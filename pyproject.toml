[project]
name = "dailybench"
version = "0.2.0"
description = "LLMCrew DailyBench — generated, programmatically scored local-LLM suite for a 16 GiB VRAM budget"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
visual = ["playwright>=1.40"]  # category K renders pages in headless Chromium

[project.scripts]
dailybench = "dailybench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dailybench", "dailybench.tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
