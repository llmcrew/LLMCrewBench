[project]
name = "dailybench"
version = "0.2.0"
description = "LLMCrew DailyBench — generated, programmatically scored local-LLM suite for a 16 GiB VRAM budget"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pyyaml>=6"]
visual = ["playwright>=1.40", "numpy>=1.24", "Pillow>=10"]  # category K renders pages in headless Chromium
vision = ["Pillow>=10"]  # category V renders its image fixtures with Pillow

[project.scripts]
dailybench = "dailybench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dailybench", "dailybench.adapters", "dailybench.tasks"]

# Ресурсы витрины (three.js и plotly) нужны отчёту и рендеру; без них wheel
# ставится без библиотек, и опубликованная сцена падает (R18). data-files, а не
# package-data: vendor/ лежит рядом с пакетом, не внутри него.
[tool.setuptools.data-files]
"vendor/three" = [
  "vendor/three/three.core.js",
  "vendor/three/three.module.js",
  "vendor/three/LICENSE",
  "vendor/three/PROVENANCE.md",
]
"vendor/plotly" = [
  "vendor/plotly/plotly.min.js",
  "vendor/plotly/LICENSE",
  "vendor/plotly/PROVENANCE.md",
]
"schema" = [
  "schema/task.schema.json",
  "schema/profile.schema.json",
  "schema/holdout.schema.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: needs a Docker daemon"]
filterwarnings = ["error::DeprecationWarning"]
