<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бесконечный туннель</title>
<style>
  :root{
    --paper: #f3ead9;
    --dim: #a89a86;
    --amber: #ffb062;
    --ink: #05070c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#05070c;color:var(--paper);
    font-family: ui-sans-serif, "Helvetica Neue", Inter, Arial, sans-serif; overflow:hidden;
    -webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}

  /* ---- editorial overlay ---- */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:3}
  .frame{position:absolute;inset:clamp(14px,2.4vw,34px);border:1px solid rgba(243,234,217,.14)}
  .frame::before,.frame::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--amber);opacity:.75}
  .frame::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
  .frame::after{right:-1px;bottom:-1px;border-left:0;border-top:0}

  header{position:absolute;left:clamp(30px,4.2vw,64px);top:clamp(32px,5.2vw,74px);max-width:min(78vw,620px)}
  .kicker{display:flex;align-items:baseline;gap:12px;font-size:10px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--amber);opacity:.9}
  .kicker i{flex:none;width:34px;height:1px;background:currentColor;display:block;transform:translateY(-3px)}
  h1{margin:.42em 0 0;font-family: ui-serif, "Times New Roman", Georgia, serif;font-weight:400;
    font-size:clamp(34px,6.6vw,84px);line-height:.92;letter-spacing:-.015em;text-wrap:balance;
    text-shadow:0 2px 40px rgba(0,0,0,.55)}
  h1 em{font-style:italic;color:var(--amber)}
  .lede{margin:18px 0 0;max-width:33ch;font-size:clamp(11px,1.2vw,13px);line-height:1.6;
    color:rgba(243,234,217,.62);letter-spacing:.02em}

  .meta{position:absolute;right:clamp(30px,4.2vw,64px);top:clamp(32px,5.2vw,74px);text-align:right;
    font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(243,234,217,.46);line-height:2.1}
  .meta b{display:block;color:var(--paper);font-weight:500;letter-spacing:.34em}
  .meta span{color:var(--amber)}

  footer{position:absolute;left:clamp(30px,4.2vw,64px);right:clamp(30px,4.2vw,64px);
    bottom:clamp(28px,4.4vw,58px);display:flex;flex-wrap:wrap;gap:16px 26px;
    align-items:center;justify-content:space-between;pointer-events:auto}
  .controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;pointer-events:auto}
  button{appearance:none;background:transparent;border:1px solid rgba(243,234,217,.3);color:var(--paper);
    font:inherit;font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding:9px 15px;
    cursor:pointer;transition:background .25s,border-color .25s,color .25s;backdrop-filter:blur(3px)}
  button:hover{background:rgba(255,176,98,.13);border-color:var(--amber);color:#fff}
  button:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
  .speed{display:flex;align-items:center;gap:12px;font-size:9.5px;letter-spacing:.22em;
    text-transform:uppercase;color:rgba(243,234,217,.5);pointer-events:auto}
  input[type=range]{-webkit-appearance:none;appearance:none;width:clamp(88px,15vw,168px);height:1px;
    background:rgba(243,234,217,.28);outline:none;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--amber);border:0;cursor:pointer;box-shadow:0 0 0 4px rgba(255,176,98,.16)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--amber);cursor:pointer}
  .hint{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,234,217,.34);text-align:right;line-height:1.9}
  .hint b{color:rgba(243,234,217,.6);font-weight:500}
  @media (max-width:640px){ .meta{display:none} .lede{display:none} .hint{display:none} }
  @media (prefers-reduced-motion:reduce){ h1,.lede{text-shadow:none} }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="ui">
  <div class="frame"></div>
  <header>
    <div class="kicker"><i></i>экспозиция&nbsp;·&nbsp;001</div>
    <h1>Бесконечный<br><em>туннель</em></h1>
    <p class="lede">Длинная выдержка внутри бетонной артерии. Световые рёбра втягиваются в точку схода, мокрый пол повторяет их. Вход есть, выхода нет.</p>
  </header>
  <div class="meta">
    <b>N&nbsp;36</b>
    <div>фокус 24&nbsp;мм</div>
    <div>f&nbsp;1.4 · 8&nbsp;сек</div>
    <div><span>iso&nbsp;1600</span></div>
  </div>
  <footer>
    <div class="controls">
      <button id="toggle" aria-pressed="false">пауза</button>
      <label class="speed">ход
        <input id="speed" type="range" min="0" max="100" value="34" aria-label="скорость движения">
      </label>
    </div>
    <div class="hint"><b>мышь</b> — наклон камеры · <b>пробел</b> — стоп-кадр</div>
  </footer>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, powerPreference:'high-performance', preserveDrawingBuffer:false});
  if(!gl){ document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:0;display:grid;place-content:center;font:16px serif">Нужен WebGL2</p>'); return; }

  const qs = new URLSearchParams(location.search);
  const START_T = parseFloat(qs.get('t') || '0') || 0;
  const STILL = qs.get('still') === '1';
  const DEBUG = qs.get('debug') === '1';
  if(qs.get('ui') === '0') document.getElementById('ui').style.display = 'none';

  const VS = `#version 300 es
  out vec2 vUv;
  void main(){
    vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
    vUv = p;
    gl_Position = vec4(p*2.0-1.0, 0.0, 1.0);
  }`;

  const SCENE = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform vec2  uRes;
  uniform float uTime;
  uniform float uSpeed;
  uniform vec2  uMouse;
  uniform sampler2D uPrev;
  uniform float uFeedback;
  uniform float uWarp;

  const float PI   = 3.14159265;
  const float CELL = 3.7;
  const float RAD  = 2.58;
  const float FLOOR = -1.28;
  const vec3  AMBER = vec3(1.0, 0.44, 0.10);
  const vec3  ICE   = vec3(0.24, 0.68, 1.0);

  float hash11(float p){ p = fract(p*.1031); p *= p+33.33; p *= p+p; return fract(p); }
  float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(hash21(i), hash21(i+vec2(1,0)), f.x),
               mix(hash21(i+vec2(0,1)), hash21(i+vec2(1,1)), f.x), f.y);
  }

  // ---------- architecture ----------
  float ridge(float z){
    float d = abs(z/CELL - floor(z/CELL + 0.5)) * CELL;       // 0 at ring
    return 0.34 * exp(-d*d*2.6) + 0.10 * exp(-d*d*36.0);
  }
  float radiusAt(float th, float z){
    float flute = 0.070 * (0.5 + 0.5*cos(th*18.0));
    float fin   = 0.100 * pow(abs(cos(th*9.0)), 12.0);
    float sag   = 0.060 * cos(th*2.0);
    return RAD - flute - fin + sag - ridge(z);
  }
  float map(vec3 p, out float mat){
    float wall = radiusAt(atan(p.y, p.x), p.z) - length(p.xy);
    float slab = p.y - FLOOR + 0.024 * exp(-p.x*p.x*9.0);     // shallow gutter
    if(slab < wall){ mat = 1.0; return slab * 0.9; }
    mat = 0.0; return wall * 0.8;
  }
  vec3 normalAt(vec3 p){
    vec2 e = vec2(0.0018, 0.0); float m;
    vec3 n = vec3(map(p+e.xyy,m) - map(p-e.xyy,m),
                  map(p+e.yxy,m) - map(p-e.yxy,m),
                  map(p+e.yyx,m) - map(p-e.yyx,m));
    return normalize(n + 1e-7);
  }

  struct Hit { float d; vec3 p; float mat; };
  Hit march(vec3 ro, vec3 rd, float maxT, int steps){
    float t = 0.01; float mat = 0.0;
    for(int i=0;i<240;i++){
      if(i>=steps) break;
      vec3 p = ro + rd*t;
      float m;
      float d = map(p, m);
      if(d < 0.0016 + t*0.0015) return Hit(t, p, m);
      t += d;
      if(t > maxT) break;
    }
    return Hit(-1.0, ro+rd*maxT, 0.0);
  }

  float ringDist(float z){ return abs(z/CELL - floor(z/CELL + 0.5)) * CELL; }
  float cellIndex(float z){ return floor(z/CELL + 0.5); }
  vec3 ringColour(float z){
    return mod(cellIndex(z), 2.0) < 0.5 ? AMBER : ICE;
  }

  vec3 fogColour(vec3 p){
    float axial = exp(-length(p.xy)*0.42);
    return mix(vec3(0.020, 0.040, 0.070), vec3(0.30, 0.20, 0.13), axial);
  }
  float fogAmount(float t){
    return 1.0 - exp(-t*t*0.00042 - t*0.013);
  }

  vec3 atmosphere(vec3 p, vec3 rd, float t){
    float d = ringDist(p.z);
    vec3 rc = ringColour(p.z);
    float ring = exp(-d*d*2.4);
    float shell = exp(-pow(length(p.xy) - RAD*0.86, 2.0)*1.05);
    float near = 1.0/(1.0 + t*0.10);
    vec3 glow = rc * ring * shell * 2.1 * near;
    glow += vec3(1.0, 0.66, 0.38) * exp(-length(p.xy)*0.9) * 0.55 * near;
    return glow;
  }

  vec3 shade(vec3 p, vec3 n, vec3 rd, float mat, float t){
    float phase = ringDist(p.z);
    vec3 rc = ringColour(p.z);
    float th = atan(p.y, p.x);

    float ringLight = exp(-phase*phase*1.1);
    float axisLight = exp(-length(p.xy)*0.42);
    float lowLight  = 0.25 + 0.75*smoothstep(FLOOR, 1.8, p.y);
    float wrap = 0.5 + 0.5 * max(dot(n, -rd), 0.0);

    vec3 baseCol; vec3 emit = vec3(0.0);
    if(mat > 0.5){
      baseCol = vec3(0.026, 0.030, 0.038);
      // painted centre line + expansion joints
      float line = smoothstep(0.05, 0.015, abs(abs(p.x) - 0.66));
      baseCol = mix(baseCol, vec3(0.26, 0.21, 0.13), line*0.9);
      float joint = smoothstep(0.02, 0.0, abs(fract(p.z*0.5) - 0.5) - 0.47);
      baseCol *= 1.0 - joint*0.5;
      emit += vec3(0.5,0.5,0.5) * ringLight * 0.05;
    } else {
      float stripe = 0.5 + 0.5*smoothstep(-0.2, 0.9, cos(th*18.0));
      baseCol = mix(vec3(0.020,0.027,0.037), vec3(0.052,0.058,0.068), stripe);
      float grime = noise(vec2(th*7.0, p.z*0.22));
      baseCol *= 0.55 + 0.85*grime;
      baseCol *= 0.55 + 0.45*smoothstep(FLOOR, 1.4, p.y);

      float core  = smoothstep(0.055, 0.0, phase);
      float halo  = exp(-phase*phase*7.0);
      emit += mix(rc, vec3(1.0), 0.5) * core * 22.0;
      emit += rc * halo * 2.6;
      emit += rc * ringLight * lowLight * 0.75;
      baseCol += rc * 0.035 * ringLight;
    }

    vec3 keyCol = rc * (ringLight*1.5 + axisLight*0.42) + vec3(0.10,0.16,0.26)*0.35;
    vec3 lit = baseCol * keyCol * 1.9 + emit;

    vec3 h = normalize(-rd + vec3(0.0, 0.25, 0.0));
    float sp = pow(max(dot(n, h), 0.0), 28.0);
    lit += rc * sp * ringLight * (mat > 0.5 ? 0.55 : 0.35);
    return lit * wrap;
  }

  vec3 traceScene(vec3 ro, vec3 rd){
    Hit h = march(ro, rd, 80.0, 210);
    vec3 col;
    if(h.d > 0.0){
      vec3 n = normalAt(h.p);
      col = shade(h.p, n, rd, h.mat, h.d);
      if(h.mat > 0.5 && rd.y < 0.0){
        vec3 rr = reflect(rd, n);
        vec2 wob = vec2(noise(h.p.xz*2.4), noise(h.p.xz*2.4 + 11.0)) - 0.5;
        rr.xz += wob * 0.035;
        Hit h2 = march(h.p + n*0.012, normalize(rr), 30.0, 80);
        vec3 rcol = h2.d > 0.0 ? shade(h2.p, normalAt(h2.p), normalize(rr), h2.mat, h2.d)
                               : fogColour(h.p)*0.9;
        float fres = pow(1.0 - max(dot(n, -rd), 0.0), 2.2);
        float wet = 0.30 + 0.70 * smoothstep(0.42, 0.72, noise(h.p.xz*0.85 + 3.0));
        col = mix(col, rcol, clamp(0.30 + fres*0.72, 0.0, 0.95) * wet);
      }
    } else {
      col = fogColour(h.p) * 0.8;
    }
    float fg = fogAmount(h.d > 0.0 ? h.d : 80.0);
    col = mix(col, fogColour(h.p) * 0.85, fg);
    col += atmosphere(h.p, rd, h.d > 0.0 ? h.d : 80.0);
    return col;
  }

  void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;

    float t = uTime;
    float travel = t * (2.0 + uSpeed*13.0);

    float swayX = sin(t*0.29)*0.20 + sin(t*0.117+2.0)*0.13;
    float swayY = -0.14 + cos(t*0.24)*0.13;
    float roll  = sin(t*0.173)*0.06 + 0.030;
    float yaw   = sin(t*0.21)*0.06 + uMouse.x*0.22;
    float pitch = sin(t*0.27+1.3)*0.04 + uMouse.y*0.14;

    vec3 ro = vec3(swayX, swayY, 6.0 + travel);
    float cr = cos(roll), sr = sin(roll);
    uv = mat2(cr, -sr, sr, cr) * uv;

    vec3 rd = normalize(vec3(uv.x * 1.02, uv.y * 1.02, -1.0));
    float cy = cos(yaw), sy = sin(yaw);
    rd.xz = mat2(cy, -sy, sy, cy) * rd.xz;
    float cp = cos(pitch), sp = sin(pitch);
    rd.yz = mat2(cp, -sp, sp, cp) * rd.yz;

    vec3 col = traceScene(ro, rd);

    // exposure + filmic curve
    col *= 1.55;
    col = (col*(2.51*col + 0.03)) / (col*(2.43*col + 0.59) + 0.14);
    col = pow(clamp(col, 0.0, 1.0), vec3(0.92));

    // long-exposure feedback, warped toward the vanishing point
    vec2 st = gl_FragCoord.xy / uRes;
    vec2 cen = vec2(0.5, 0.5);
    vec2 puv = cen + (st - cen) * (1.0 - uWarp);
    vec3 ghost = texture(uPrev, puv).rgb;
    col = mix(col, ghost*0.99, uFeedback);

    float g = hash21(gl_FragCoord.xy + fract(t)*911.0);
    col += (g - 0.5) * 0.035;

    fragColor = vec4(max(col, 0.0), 1.0);
  }`;

  const POST = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D uTex;
  uniform vec2 uRes;
  uniform float uTime;
  uniform float uBloom;
  void main(){
    vec2 st = gl_FragCoord.xy / uRes;
    vec2 d = st - 0.5;
    float r2 = dot(d, d);

    // the far portal: a hole of light at the end of the tunnel
    float port = exp(-r2*34.0);
    vec3 portal = mix(vec3(1.0, 0.52, 0.22), vec3(1.0, 0.92, 0.78), port) * port;

    float ca = 0.0007 + r2*0.0052;
    vec3 col;
    col.r = texture(uTex, 0.5 + d*(1.0 - ca)).r;
    col.g = texture(uTex, st).g;
    col.b = texture(uTex, 0.5 + d*(1.0 + ca)).b;

    vec3 bl = vec3(0.0);
    for(int i=0;i<12;i++){
      float a = float(i) * 0.5236;
      float rr = 0.0040 * (1.0 + float(i%3));
      bl += texture(uTex, st + vec2(cos(a), sin(a))*rr).rgb;
    }
    bl /= 12.0;
    col += bl*bl * uBloom;
    col += portal * 0.32;

    float vig = smoothstep(0.90, 0.12, r2*1.28);
    col *= mix(0.40, 1.0, vig);

    float n = fract(sin(dot(gl_FragCoord.xy + uTime*1.7, vec2(12.9898,78.233)))*43758.5453);
    col += (n-0.5)*0.018;

    fragColor = vec4(col, 1.0);
  }`;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(fsrc){
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsrc));
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for(let i=0;i<n;i++){ const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
    return {p, u};
  }
  const scene = program(SCENE);
  const post = program(POST);
  const vao = gl.createVertexArray();

  let W = 4, H = 4;
  let tex = [0,1].map(() => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  });
  const fbo = [gl.createFramebuffer(), gl.createFramebuffer()];
  let cur = 0;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rs = DEBUG ? 1.0 : 0.9;
    W = Math.max(2, Math.round(innerWidth * dpr * rs));
    H = Math.max(2, Math.round(innerHeight * dpr * rs));
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    for(let i=0;i<2;i++){
      gl.bindTexture(gl.TEXTURE_2D, tex[i]);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[i]);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex[i], 0);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  addEventListener('resize', resize);

  const state = { speed: START_T > 0 ? 0.34 : 0.34, target: 0.34, paused: STILL, mx: 0, my: 0, tx: 0, ty: 0 };
  const ui = {
    toggle: document.getElementById('toggle'),
    speed: document.getElementById('speed')
  };
  function setPaused(v){
    state.paused = v;
    ui.toggle.textContent = v ? 'продолжить' : 'пауза';
    ui.toggle.setAttribute('aria-pressed', String(v));
  }
  ui.toggle.addEventListener('click', () => setPaused(!state.paused));
  ui.speed.addEventListener('input', e => { state.target = e.target.value/100; });
  addEventListener('keydown', e => {
    if(e.code === 'Space'){ e.preventDefault(); setPaused(!state.paused); }
    if(e.code === 'ArrowRight'){ state.target = Math.min(1, state.target + .12); ui.speed.value = state.target*100; }
    if(e.code === 'ArrowLeft'){ state.target = Math.max(0, state.target - .12); ui.speed.value = state.target*100; }
  });
  addEventListener('pointermove', e => {
    state.tx = (e.clientX/innerWidth - 0.5) * 2;
    state.ty = (e.clientY/innerHeight - 0.5) * 2;
  });
  addEventListener('pointerleave', () => { state.tx = 0; state.ty = 0; });

  let time = START_T, last = performance.now();

  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.06);
    last = now;
    time += (state.paused || STILL) ? 0 : dt;
    state.speed += (state.target - state.speed) * Math.min(1, dt*3);
    state.mx += (state.tx - state.mx) * Math.min(1, dt*2.2);
    state.my += (state.ty - state.my) * Math.min(1, dt*2.2);

    const refW = Math.round(innerWidth * 1.0);

    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[cur]);
    gl.viewport(0, 0, W, H);
    gl.useProgram(scene.p);
    gl.bindVertexArray(vao);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex[1-cur]);
    gl.uniform1i(scene.u.uPrev, 0);
    gl.uniform2f(scene.u.uRes, W, H);
    gl.uniform1f(scene.u.uTime, time);
    gl.uniform1f(scene.u.uSpeed, state.speed);
    gl.uniform2f(scene.u.uMouse, state.mx, state.my);
    gl.uniform1f(scene.u.uFeedback, DEBUG ? 0 : 0.55 + state.speed*0.36);
    gl.uniform1f(scene.u.uWarp, DEBUG ? 0 : 0.014 + state.speed*0.075);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(post.p);
    gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
    gl.uniform1i(post.u.uTex, 0);
    gl.uniform2f(post.u.uRes, canvas.width, canvas.height);
    gl.uniform1f(post.u.uTime, time);
    gl.uniform1f(post.u.uBloom, DEBUG ? 0.0 : 0.55);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    cur = 1 - cur;
    requestAnimationFrame(frame);
  }

  resize();
  setPaused(STILL);
  requestAnimationFrame(frame);
})();
</script>
