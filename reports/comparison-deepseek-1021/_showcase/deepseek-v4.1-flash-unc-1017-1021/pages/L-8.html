<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аврора — свет над полярным кругом</title>
<style>
  :root{
    --ink:#d8ece4;
    --dim:rgba(190,224,213,.55);
    --hair:rgba(190,224,213,.22);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#02040a;overflow:hidden}
  body{
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    cursor:crosshair;
  }
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .frame{
    position:fixed;inset:0;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(18px,3.2vw,44px);
    padding-top:max(clamp(18px,3.2vw,44px),env(safe-area-inset-top));
    padding-bottom:max(clamp(18px,3.2vw,44px),env(safe-area-inset-bottom));
  }
  header,footer{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .brand{
    display:flex;align-items:center;gap:12px;
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--dim);text-shadow:0 1px 12px rgba(0,0,0,.8);
  }
  .brand .star{
    width:5px;height:5px;border-radius:50%;
    background:#9fe9c3;box-shadow:0 0 10px 2px rgba(110,255,190,.75);
    animation:pulse 5.5s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .coord{
    font-size:9.5px;letter-spacing:.22em;color:var(--dim);
    text-shadow:0 1px 10px rgba(0,0,0,.8);white-space:nowrap;
  }
  footer{align-items:flex-end}
  h1{
    margin:0;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-weight:400;font-size:clamp(30px,5vw,64px);line-height:.86;
    letter-spacing:.13em;text-transform:uppercase;
    color:rgba(227,246,238,.9);
    text-shadow:0 2px 30px rgba(0,0,0,.65);
  }
  .sub{
    margin:10px 0 0;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--dim);text-shadow:0 1px 12px rgba(0,0,0,.8);
  }
  .now{
    text-align:right;font-size:9.5px;line-height:1.9;letter-spacing:.2em;
    color:var(--dim);text-transform:uppercase;text-shadow:0 1px 10px rgba(0,0,0,.8);
  }
  .now b{font-weight:400;color:rgba(215,242,231,.78)}
  .hint{
    position:fixed;right:clamp(18px,3.2vw,44px);bottom:calc(clamp(18px,3.2vw,44px) + 74px);
    font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:rgba(190,224,213,.34);
    pointer-events:none;transition:opacity 1.2s ease;
  }
  .hint.gone{opacity:0}
  .rule{height:1px;flex:1;background:linear-gradient(90deg,var(--hair),transparent);margin-bottom:14px}
  #fallback{
    position:fixed;inset:0;display:none;place-items:center;text-align:center;
    background:radial-gradient(120% 80% at 50% 100%,#0b2b2c 0%,#04070f 55%,#010206 100%);
    padding:24px;font-size:12px;letter-spacing:.18em;line-height:2;color:var(--dim);
  }
  @media (max-width:620px){
    .now{display:none}
    .hint{display:none}
    h1{letter-spacing:.08em}
  }
</style>
</head>
<body>
<canvas id="gl" aria-label="Полярное сияние над заснеженными горами и чёрной водой"></canvas>

<div class="frame">
  <header>
    <div class="brand"><span class="star"></span><span>Aurora Borealis</span></div>
    <div class="coord">69°38′ N &nbsp;/&nbsp; 18°57′ E</div>
  </header>
  <footer>
    <div>
      <h1>Аврора</h1>
      <p class="sub">свет над полярным кругом</p>
    </div>
    <div class="now">
      <div>Полярная ночь · <b>третьи сутки</b></div>
      <div>Kp-индекс · <b id="kp">5</b></div>
      <div>Ветер · <b>3 м/с</b></div>
    </div>
  </footer>
</div>
<div class="hint" id="hint">двигайте курсором</div>
<div id="fallback">Для этой работы нужен браузер с поддержкой WebGL.</div>

<script id="vert" type="x-shader/x-vertex">
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform vec2  uPointer;

const float HORIZON = 0.325;
const mat2  ROT = mat2(0.80, 0.60, -0.60, 0.80);

float hash21(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float vnoise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p){
  float v = 0.0;
  float a = 0.5;
  for(int i = 0; i < 5; i++){
    v += a * vnoise(p);
    p = ROT * p * 2.02;
    a *= 0.5;
  }
  return v;
}

/* ---------- sky ---------- */

vec3 skyGradient(vec2 p){
  float h = clamp(p.y, 0.0, 1.0);
  vec3 zenith = vec3(0.006, 0.008, 0.024);
  vec3 mid    = vec3(0.016, 0.028, 0.062);
  vec3 low    = vec3(0.028, 0.060, 0.086);
  vec3 col = mix(low, mid, smoothstep(0.12, 0.46, h));
  col = mix(col, zenith, smoothstep(0.46, 0.96, h));

  /* cold glow resting on the horizon */
  col += vec3(0.018, 0.052, 0.050) * exp(-abs(h - HORIZON) * 10.0);

  /* faint galactic band */
  float band = exp(-pow(p.x * 0.85 + (p.y - 0.62) * 1.5 + 0.15, 2.0) * 1.7);
  col += vec3(0.030, 0.034, 0.055) * band * fbm(p * 2.1 + vec2(4.0, 1.0));
  return col;
}

vec3 starField(vec2 p, float t){
  vec2 sp = p * 165.0;
  vec2 id = floor(sp);
  vec2 f  = fract(sp) - 0.5;
  float h = hash21(id);
  if(h < 0.90) return vec3(0.0);
  vec2 off = vec2(hash21(id + 3.17), hash21(id + 9.71)) - 0.5;
  float d = length(f - off * 0.78);
  float tw = 0.62 + 0.38 * sin(t * (1.1 + h * 2.6) + h * 90.0);
  float b = smoothstep(0.105, 0.0, d) * tw;
  b *= smoothstep(0.90, 0.995, h);
  vec3 tint = mix(vec3(0.72, 0.84, 1.0), vec3(1.0, 0.91, 0.80), hash21(id + 5.53));
  return tint * b * 0.95;
}

vec3 moon(vec2 p){
  vec2 c = vec2(0.545, 0.775);
  vec2 q = p - c;
  float d = length(q);
  float r = 0.0165;
  float disc = smoothstep(r, r * 0.84, d);
  float bite = smoothstep(r * 0.94, r * 0.80, length(q - vec2(0.0095, 0.0062)));
  float crescent = clamp(disc - bite, 0.0, 1.0);
  float halo = exp(-d * 34.0) * 0.22 + exp(-d * 7.5) * 0.055;
  return vec3(1.0, 0.945, 0.83) * (crescent * 1.7 + halo);
}

/* ---------- aurora ---------- */

vec4 auroraBand(vec2 q, float t, float seed, float center, float tilt, float warpScale){
  float x = q.x;
  float wob  = fbm(vec2(x * 1.05 + seed * 3.0, t * 0.048 + seed * 2.0)) - 0.5;
  float wob2 = vnoise(vec2(x * 4.6 - seed, t * 0.105)) - 0.5;
  float cy = center + tilt * x + (wob * 1.5 + wob2 * 0.55) * warpScale;
  float d = q.y - cy;

  float edge = exp(-max(-d, 0.0) * 8.5);
  float tail = exp(-max( d, 0.0) * 2.15);
  float body = edge * tail;

  float r1 = vnoise(vec2(x * 21.0 + seed * 13.0, t * 0.125));
  float r2 = vnoise(vec2(x * 59.0 - seed * 7.0, t * 0.30 + 3.0));
  float rays = 0.22 + 1.18 * pow(r1, 1.65) + 0.48 * pow(r2, 2.3);
  float flick = 0.78 + 0.22 * sin(t * 0.62 + x * 5.0 + seed);

  float inten = body * rays * flick;
  inten += exp(-abs(d) * 85.0) * 0.85 * (0.35 + 0.95 * r1);
  return vec4(inten, d, r1, r2);
}

vec3 auroraColor(float d, float ray){
  vec3 c = vec3(0.14, 0.95, 0.47);
  c = mix(c, vec3(0.04, 0.70, 0.76), smoothstep(0.0, -0.09, d) * 0.55);
  c = mix(c, vec3(0.36, 0.15, 0.86), smoothstep(0.02, 0.30, d));
  c = mix(c, vec3(0.86, 0.19, 0.56), smoothstep(0.25, 0.52, d) * 0.7);
  c = mix(c, vec3(0.72, 1.0, 0.86), pow(ray, 3.0) * 0.42);
  return c;
}

vec3 aurora(vec2 q, float t){
  vec3 c = vec3(0.0);
  vec4 b;

  b = auroraBand(q, t, 1.0, 0.585,  0.080, 0.34);
  c += auroraColor(b.y, b.z) * b.x * 1.00;

  b = auroraBand(q, t, 4.7, 0.470, -0.052, 0.25);
  c += auroraColor(b.y, b.z) * b.x * 0.70;

  b = auroraBand(q, t, 8.9, 0.690,  0.115, 0.40);
  c += auroraColor(b.y, b.z) * b.x * 0.52;

  /* the whole sky breathes a little green */
  float glow = exp(-pow((q.y - 0.59 - q.x * 0.03) * 2.3, 2.0));
  c += vec3(0.022, 0.085, 0.065) * glow * 0.55;
  return c;
}

/* ---------- mountains ---------- */

float ridgeH(float x, float seed){
  float h = 0.0;
  float a = 1.0;
  float f = 2.1;
  for(int i = 0; i < 5; i++){
    float n = vnoise(vec2(x * f + seed * 5.3, seed * 2.1));
    h += a * (1.0 - abs(2.0 * n - 1.0));
    f *= 2.07;
    a *= 0.47;
  }
  return h;
}

vec4 mountains(vec2 p){
  vec3 col = vec3(0.0);
  float alpha = 0.0;
  float x = p.x;

  /* distant range — atmospheric, lit by moon and aurora */
  float h = ridgeH(x, 1.0) * 0.205 + 0.303;
  float m = smoothstep(0.0028, -0.0028, p.y - h);
  if(m > 0.0){
    float slope = ridgeH(x + 0.012, 1.0) - ridgeH(x - 0.012, 1.0);
    float facing = smoothstep(0.02, -0.02, slope);
    float sn = smoothstep(0.435, 0.555, p.y) * facing;
    sn *= 0.30 + 1.05 * fbm(vec2(x * 11.0, p.y * 27.0));
    sn = clamp(sn, 0.0, 1.0);
    float rim = exp(-abs(p.y - h) * 230.0);

    vec3 fc = mix(vec3(0.018, 0.028, 0.050), vec3(0.055, 0.095, 0.125), smoothstep(0.30, 0.55, p.y));
    fc += vec3(0.19, 0.34, 0.33) * sn * 0.55;
    fc += vec3(0.10, 0.27, 0.23) * rim * 0.55;

    col = col * (1.0 - m) + fc * m;
    alpha = alpha * (1.0 - m) + m;
  }

  /* dark foreground ridge */
  h = ridgeH(x, 4.0) * 0.132 + 0.300;
  m = smoothstep(0.0028, -0.0028, p.y - h);
  if(m > 0.0){
    float rim2 = exp(-abs(p.y - h) * 250.0);
    vec3 nc = mix(vec3(0.005, 0.009, 0.016), vec3(0.013, 0.021, 0.031), smoothstep(0.285, 0.44, p.y));
    nc += vec3(0.045, 0.135, 0.115) * rim2 * 0.5;
    col = col * (1.0 - m) + nc * m;
    alpha = alpha * (1.0 - m) + m;
  }
  return vec4(col, alpha);
}

/* ---------- water ---------- */

vec3 water(vec2 p, float t){
  float depth = HORIZON - p.y;

  float rip  = fbm(vec2(p.x * 4.6, p.y * 40.0 + t * 0.22)) - 0.5;
  float rip2 = vnoise(vec2(p.x * 17.0, p.y * 120.0 - t * 0.55)) - 0.5;

  vec2 mp = vec2(
    p.x + (rip * 0.013 + rip2 * 0.0042) * (0.22 + depth * 7.0),
    2.0 * HORIZON - p.y + rip2 * 0.004
  );

  vec3 refl = vec3(0.0);
  refl += starField(mp, t) * 0.55;
  refl += moon(mp) * 0.75;
  refl += aurora(mp + vec2(0.0, 0.012), t) * 0.95;
  refl = mix(refl, aurora(mp + vec2(0.007, 0.030), t) * 0.95, 0.30);

  vec3 col = vec3(0.008, 0.019, 0.028);
  col += refl * 0.34;

  vec4 mt = mountains(mp);
  col = mix(col, vec3(0.003, 0.006, 0.011), mt.a);

  col *= 0.86 + 0.28 * vnoise(vec2(p.x * 7.0, p.y * 80.0 - t * 0.35));

  /* moon path on the water */
  float mx = exp(-pow((p.x - 0.545) * 10.0, 2.0));
  float shimmer = 0.5 + 0.5 * sin(p.y * 260.0 - t * 2.6 + rip * 26.0);
  col += vec3(0.40, 0.46, 0.42) * mx * exp(-depth * 6.5) * 0.13 * shimmer;

  /* low mist separates water and stone */
  float fog = exp(-abs(p.y - HORIZON) * 60.0);
  col += vec3(0.036, 0.085, 0.082) * fog * 0.42;
  return col;
}

/* ---------- main ---------- */

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float aspect = uRes.x / uRes.y;
  vec2 p = vec2((uv.x - 0.5) * aspect, uv.y);
  vec2 q = p + uPointer * vec2(0.055, -0.018);

  vec3 col;

  if(p.y >= HORIZON){
    col = skyGradient(p);
    col += starField(p, uTime) * smoothstep(HORIZON, HORIZON + 0.17, p.y);
    col += moon(p);
    col += aurora(q, uTime) * smoothstep(HORIZON - 0.004, HORIZON + 0.075, p.y);

    vec4 mt = mountains(p);
    col = col * (1.0 - mt.a) + mt.rgb;
  } else {
    col = water(p, uTime);
  }

  /* grade: cool shadows, gentle shoulder, vignette, grain */
  col = vec3(1.0) - exp(-col * 1.35);
  float luma = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(col, col * vec3(0.86, 1.02, 1.05), (1.0 - luma) * 0.55);
  col = pow(col, vec3(0.92));

  float vig = smoothstep(1.30, 0.30, length((uv - 0.5) * vec2(1.0, 1.12)));
  col *= 0.52 + 0.60 * vig;
  col += vec3(0.004, 0.009, 0.011);

  float g = hash21(gl_FragCoord.xy * 1.7 + fract(uTime * 7.3) * 517.0);
  col += (g - 0.5) * 0.016;

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
  const canvas = document.getElementById('gl');
  const fallback = document.getElementById('fallback');
  const hint = document.getElementById('hint');
  const gl = canvas.getContext('webgl', { antialias:false, alpha:false, depth:false, stencil:false, powerPreference:'high-performance' })
          || canvas.getContext('experimental-webgl');

  if(!gl){ fallback.style.display = 'grid'; return; }

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  const vs = compile(gl.VERTEX_SHADER, document.getElementById('vert').textContent);
  const fs = compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent);
  if(!vs || !fs){ fallback.style.display = 'grid'; return; }

  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(prog));
    fallback.style.display = 'grid';
    return;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, 'uRes');
  const uTime = gl.getUniformLocation(prog, 'uTime');
  const uPointer = gl.getUniformLocation(prog, 'uPointer');

  let w = 0, h = 0, dpr = 1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    const cw = Math.max(1, Math.floor(innerWidth * dpr));
    const ch = Math.max(1, Math.floor(innerHeight * dpr));
    if(cw === w && ch === h) return;
    w = cw; h = ch;
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
    gl.uniform2f(uRes, w, h);
  }
  resize();
  addEventListener('resize', resize);

  const pointer = { x:0, y:0, tx:0, ty:0, moved:false };
  function setPointer(e){
    const x = e.clientX / innerWidth;
    const y = 1.0 - e.clientY / innerHeight;
    pointer.tx = (x - 0.5) * 2.0;
    pointer.ty = (y - 0.5) * 2.0;
    if(!pointer.moved){
      pointer.moved = true;
      hint.classList.add('gone');
    }
  }
  addEventListener('pointermove', setPointer, { passive:true });
  addEventListener('touchmove', e => { if(e.touches[0]) setPointer(e.touches[0]); }, { passive:true });

  let kp = 5;
  const kpEl = document.getElementById('kp');
  setInterval(() => {
    kp = Math.max(3, Math.min(7, kp + (Math.random() < 0.5 ? -1 : 1)));
    if(kpEl) kpEl.textContent = kp;
  }, 14000);

  const start = performance.now();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(now){
    resize();
    const t = (now - start) / 1000 * (reduced ? 0.45 : 1.0);
    pointer.x += (pointer.tx - pointer.x) * 0.035;
    pointer.y += (pointer.ty - pointer.y) * 0.035;

    gl.uniform1f(uTime, t);
    gl.uniform2f(uPointer, pointer.x, pointer.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
