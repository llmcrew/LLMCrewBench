<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEON GRID — бесконечный неоновый горизонт</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05010f; }
  body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  #c { position: fixed; inset: 0; display: block; }

  /* лёгкая плёночная текстура / строчная развёртка */
  .scan {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      rgba(0,0,0,0.10) 2px,
      rgba(0,0,0,0.10) 3px);
    mix-blend-mode: overlay;
    opacity: .55;
  }
  .vig {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(120% 90% at 50% 48%,
      rgba(0,0,0,0) 45%, rgba(0,0,0,.35) 78%, rgba(3,0,10,.9) 100%);
  }

  .hud {
    position: fixed; z-index: 4; left: 50%; top: 3.2vh; transform: translateX(-50%);
    text-align: center; pointer-events: none; user-select: none;
    letter-spacing: .55em; text-indent: .55em;
  }
  .hud .t {
    font-size: clamp(13px, 1.5vw, 22px);
    font-weight: 700;
    color: #eafcff;
    text-shadow: 0 0 6px #4df3ff, 0 0 22px #19b7ff, 0 0 48px #1666ff;
    animation: flick 5.5s infinite steps(1);
  }
  .hud .s {
    margin-top: .9em; font-size: clamp(9px, .85vw, 12px);
    letter-spacing: .42em; text-indent: .42em; color: #ff9de4;
    text-shadow: 0 0 8px #ff2fb0, 0 0 20px #b300ff; opacity: .9;
  }
  @keyframes flick {
    0%,86%,100% { opacity: 1; }
    87% { opacity: .35; }
    88% { opacity: 1; }
    91% { opacity: .5; }
    92% { opacity: 1; }
  }
  @media (max-width: 620px){ .hud .s { letter-spacing: .3em; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>
<div class="scan"></div>
<div class="hud">
  <div class="t">NEON GRID</div>
  <div class="s">INFINITE HORIZON // 1984</div>
</div>
<script>
(() => {
  "use strict";

  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d", { alpha: false });

  let W = 0, H = 0, DPR = 1;
  let cx = 0, horizon = 0, vignette = null;

  // --- параметры сцены (в мировых единицах) ---
  const FOCAL = 0.9;   // фокус
  const CAMH  = 1.0;   // высота камеры над сеткой
  const SPACING = 0.5; // шаг сетки
  const SPEED = 1.35;  // скорость набегания сетки
  const HCOLOR = 0.54; // положение горизонта (доля высоты)

  const NEON = {
    cyan:   [ 90, 240, 255],
    blue:   [ 70, 150, 255],
    magenta:[255,  60, 190],
    violet: [180,  90, 255],
  };

  const state = { mx: 0, my: 0, tmx: 0, tmy: 0, paused: false };

  // ---------------- генерация статики ----------------
  const stars = [];
  const ridges = [];

  function makeStars() {
    stars.length = 0;
    const n = Math.round((W * H) / 9000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random() * HCOLOR,
        r: Math.random() * 1.25 + 0.2,
        a: Math.random() * 0.7 + 0.15,
        ph: Math.random() * Math.PI * 2,
        sp: Math.random() * 1.6 + 0.4,
      });
    }
  }

  // два хребта силуэтов гор у горизонта
  function makeRidges() {
    ridges.length = 0;
    const layers = [
      { amp: 0.16, base: 0.30, seed: 1.7, col: "rgba(24,4,48,0.96)", rim: "rgba(255,80,200,0.55)" },
      { amp: 0.22, base: 0.42, seed: 4.3, col: "rgba(10,2,24,0.98)", rim: "rgba(120,240,255,0.5)" },
    ];
    for (const L of layers) {
      const pts = [];
      const steps = 46;
      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const k = u * 5 * L.seed;
        const h = (Math.sin(k) * 0.5 + Math.sin(k * 2.13 + 1.3) * 0.32 + Math.sin(k * 0.61) * 0.5);
        pts.push({ u, h: h * L.amp });
      }
      ridges.push({ pts, ...L });
    }
  }

  function makeVignette() {
    const g = ctx.createRadialGradient(W / 2, H * 0.48, Math.min(W, H) * 0.12,
                                        W / 2, H * 0.48, Math.max(W, H) * 0.78);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(0.62, "rgba(6,0,20,0.20)");
    g.addColorStop(1, "rgba(2,0,10,0.72)");
    vignette = g;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    horizon = Math.round(H * HCOLOR);
    makeStars();
    makeRidges();
    makeVignette();
  }

  // ---------------- помощники ----------------
  const rgb = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  function line(x1, y1, x2, y2, color, width, blur, glow) {
    if (blur > 0) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.shadowColor = glow || color;
      ctx.shadowBlur = blur;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }

  // ---------------- слои сцены ----------------

  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0.00, "#04000d");
    g.addColorStop(0.30, "#0d0326");
    g.addColorStop(0.58, "#220646");
    g.addColorStop(0.80, "#4b0a63");
    g.addColorStop(1.00, "#8c1274");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizon + 2);

    // тёмный пол-подложка (за сеткой)
    const gf = ctx.createLinearGradient(0, horizon, 0, H);
    gf.addColorStop(0, "#180330");
    gf.addColorStop(0.5, "#0b0120");
    gf.addColorStop(1, "#05000f");
    ctx.fillStyle = gf;
    ctx.fillRect(0, horizon, W, H - horizon);

    // звёзды
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const s of stars) {
      const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
      const a = s.a * tw;
      const px = s.x * W + state.mx * 8;
      const py = s.y * horizon + state.my * 6;
      ctx.fillStyle = `rgba(${200 + Math.round(55 * tw)},${220},255,${a})`;
      ctx.beginPath();
      ctx.arc(px, py, s.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSun(t) {
    const r = Math.min(W, H) * 0.20;
    const sx = cx + state.mx * 26;
    const sy = horizon - r * 0.18;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    // ореол
    const halo = ctx.createRadialGradient(sx, sy, r * 0.5, sx, sy, r * 2.9);
    halo.addColorStop(0, "rgba(255,90,180,0.30)");
    halo.addColorStop(0.45, "rgba(190,50,220,0.14)");
    halo.addColorStop(1, "rgba(120,0,180,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(sx, sy, r * 2.9, 0, 6.2832); ctx.fill();

    // диск
    const disc = ctx.createLinearGradient(0, sy - r, 0, sy + r);
    disc.addColorStop(0.00, "#fff7c4");
    disc.addColorStop(0.32, "#ffd45e");
    disc.addColorStop(0.58, "#ff7a3c");
    disc.addColorStop(0.80, "#ff2f88");
    disc.addColorStop(1.00, "#c11fc9");
    ctx.fillStyle = disc;
    ctx.shadowColor = "rgba(255,70,170,0.9)";
    ctx.shadowBlur = 60;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    // «жалюзи» — горизонтальные прорези, расширяющиеся книзу
    ctx.save();
    let y = sy - r * 0.02;
    let gap = Math.max(2, r * 0.035);
    let thick = Math.max(1.4, r * 0.012);
    while (y < sy + r) {
      const p = (y - (sy - r)) / (2 * r);
      ctx.fillStyle = `rgba(16,2,40,${0.55 + 0.35 * p})`;
      ctx.beginPath();
      ctx.rect(sx - r * 1.05, y, r * 2.1, thick);
      ctx.fill();
      y += thick + gap;
      gap *= 1.16;
      thick *= 1.10;
    }
    ctx.restore();

    // огненная линия горизонта
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const hg = ctx.createLinearGradient(0, horizon - 3, 0, horizon + 3);
    hg.addColorStop(0, "rgba(255,120,60,0)");
    hg.addColorStop(0.5, "rgba(255,150,90,0.9)");
    hg.addColorStop(1, "rgba(255,60,160,0)");
    ctx.fillStyle = hg;
    ctx.fillRect(0, horizon - 3, W, 6);
    ctx.restore();
  }

  function drawRidges(t) {
    for (let li = 0; li < ridges.length; li++) {
      const L = ridges[li];
      const off = state.mx * (14 + li * 10);
      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.beginPath();
      ctx.moveTo(-40, horizon + 2);
      for (const p of L.pts) {
        const x = -40 + p.u * (W + 80) + off;
        const y = horizon - (L.base + p.h * L.amp) * H * 0.5 - 2;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W + 40, horizon + 2);
      ctx.closePath();
      ctx.fillStyle = L.col;
      ctx.fill();

      // неоновая кромка по хребту
      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath();
      for (let i = 0; i < L.pts.length; i++) {
        const p = L.pts[i];
        const x = -40 + p.u * (W + 80) + off;
        const y = horizon - (L.base + p.h * L.amp) * H * 0.5 - 2;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = L.rim;
      ctx.shadowColor = L.rim;
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawReflection(t) {
    // отражение солнца на «полу» — вертикальные неоновые штрихи
    const r = Math.min(W, H) * 0.20;
    const baseX = cx + state.mx * 26;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const bars = 26;
    for (let i = 0; i < bars; i++) {
      const u = (i / (bars - 1) - 0.5) * 2;      // -1..1
      const wob = Math.sin(t * 1.7 + i * 0.9) * 6;
      const x = baseX + u * r * 0.95 + wob;
      const len = (1 - u * u) * (H - horizon) * 0.55 + 6;
      const a = 0.12 + 0.18 * (1 - Math.abs(u));
      const col = u < 0 ? NEON.cyan : NEON.magenta;
      const g = ctx.createLinearGradient(0, horizon, 0, horizon + len);
      g.addColorStop(0, rgb(col, a * 1.4));
      g.addColorStop(1, rgb(col, 0));
      ctx.fillStyle = g;
      ctx.fillRect(x - 1.2, horizon, 2.4, len);
    }
    ctx.restore();
  }

  function drawGrid(t) {
    const phase = (t * SPEED) % SPACING;       // набегание вглубь
    const xphase = (t * 0.42) % SPACING;       // боковой дрейф
    const vpx = cx + state.mx * 34;
    const vpy = horizon + state.my * 8;

    // горизонт для проекции с учётом лёгкого наклона камеры
    const hz = horizon + state.my * 8;
    const bottomOffset = H - hz;
    const topOffset = hz;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";

    const PASSES = [
      { w: 3.2, a: 0.30, blur: 16 },  // широкое свечение
      { w: 1.1, a: 0.95, blur: 0  },  // ядро
    ];

    for (const pass of PASSES) {
      // горизонтальные линии — пол и потолок
      const N = 46;
      for (let i = 1; i <= N; i++) {
        const z = i * SPACING - phase;
        if (z <= 0.02) continue;
        const dy = (FOCAL * CAMH) / z;
        const depth = 1 / (1 + z * 0.30);
        const a = pass.a * (0.25 + 0.75 * depth);
        if (a < 0.012) continue;

        const colF = (i % 2 === 0) ? NEON.cyan : NEON.magenta;
        const colC = (i % 2 === 0) ? NEON.violet : NEON.blue;

        const yf = hz + dy * 1.0;
        if (yf < H + 4) {
          const c = rgb(colF, a);
          line(-20, yf, W + 20, yf, c, pass.w, pass.blur, c);
        }
        const yc = hz - dy * 1.0;
        if (yc > -4) {
          const c = rgb(colC, a * 0.72);
          line(-20, yc, W + 20, yc, c, pass.w, pass.blur, c);
        }
      }

      // вертикальные линии — сходятся в точку схода
      const K = 11;
      for (let k = -K; k <= K; k++) {
        const X = k * SPACING - xphase;
        const slope = X / CAMH;
        const central = 1 - Math.abs(X) / ((K + 1) * SPACING);
        const a = pass.a * (0.35 + 0.65 * clamp(central, 0, 1));
        const colF = (k % 2 === 0) ? NEON.magenta : NEON.blue;
        const colC = (k % 2 === 0) ? NEON.violet : NEON.cyan;

        const xb = vpx + slope * bottomOffset;
        const xt = vpx + slope * -topOffset;

        const cf = rgb(colF, a);
        line(vpx, vpy, xb, H + 20, cf, pass.w, pass.blur, cf);
        const cc = rgb(colC, a * 0.7);
        line(vpx, vpy, xt, -20, cc, pass.w, pass.blur, cc);
      }
    }

    // светящаяся «точка схода»
    const vg = ctx.createRadialGradient(vpx, vpy, 0, vpx, vpy, Math.min(W, H) * 0.32);
    vg.addColorStop(0, "rgba(255,150,255,0.22)");
    vg.addColorStop(0.5, "rgba(140,60,255,0.08)");
    vg.addColorStop(1, "rgba(80,0,200,0)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();
  }

  function drawVignette() {
    ctx.save();
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ---------------- цикл ----------------
  let last = performance.now();
  let clock = 0;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    // сглаживание параллакса
    state.mx += (state.tmx - state.mx) * Math.min(1, dt * 4);
    state.my += (state.tmy - state.my) * Math.min(1, dt * 4);

    if (!state.paused) clock += dt;
    const t = clock;

    drawSky(t);
    drawSun(t);
    drawRidges(t);
    drawReflection(t);
    drawGrid(t);
    drawVignette();

    requestAnimationFrame(frame);
  }

  // ---------------- ввод ----------------
  window.addEventListener("resize", resize, { passive: true });
  window.addEventListener("pointermove", (e) => {
    state.tmx = (e.clientX / window.innerWidth - 0.5) * 2;
    state.tmy = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });
  window.addEventListener("pointerdown", () => { state.paused = !state.paused; });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { state.paused = !state.paused; e.preventDefault(); }
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
