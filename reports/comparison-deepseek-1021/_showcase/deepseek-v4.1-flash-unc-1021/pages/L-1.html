<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Северное течение</title>
<style>
  :root{ --bg:#04060f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:#e9eefb;-webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;display:block;z-index:0}
  #vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(130% 95% at 50% 44%, rgba(0,0,0,0) 40%, rgba(2,3,10,0.5) 78%, rgba(1,2,8,0.94) 100%),
      radial-gradient(65% 45% at 76% 16%, rgba(70,130,210,0.10), rgba(0,0,0,0) 62%);
  }
  #grain{
    position:fixed;inset:-50%;z-index:2;pointer-events:none;
    opacity:.06;mix-blend-mode:overlay;background-repeat:repeat;
    animation:grainShift 7s steps(7) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}
    40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-2%)}
    80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}
  }
  #title{
    position:fixed;z-index:3;left:clamp(20px,4.2vw,64px);bottom:clamp(22px,5vh,60px);
    pointer-events:none;opacity:0;transform:translateY(14px);
    animation:rise 2.8s cubic-bezier(.2,.7,.2,1) 1s forwards;
  }
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  #title h1{
    font-weight:300;font-size:clamp(26px,3.6vw,52px);
    letter-spacing:.22em;text-transform:uppercase;line-height:1.05;
    text-shadow:0 0 34px rgba(120,180,255,.4);
  }
  #title h1 .accent{color:#ffcf8f;text-shadow:0 0 30px rgba(255,180,90,.45)}
  #title p{
    margin-top:.9em;max-width:46ch;font-size:clamp(11px,1.05vw,14px);
    font-weight:300;letter-spacing:.12em;line-height:1.7;color:#9fb0cf;text-transform:uppercase;
  }
  #meta{
    position:fixed;z-index:3;right:clamp(20px,4.2vw,64px);top:clamp(20px,4.2vh,56px);
    text-align:right;pointer-events:none;font-size:clamp(10px,.95vw,12px);
    letter-spacing:.3em;text-transform:uppercase;color:#7d8dad;
    opacity:0;animation:rise 2.8s ease 1.7s forwards;
  }
  #meta b{font-weight:400;color:#cfe0ff;display:block;letter-spacing:.42em;margin-bottom:.5em}
  @media (max-width:640px){ #meta{display:none} }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vignette"></div>
<div id="grain"></div>
<div id="meta"><b>Поле&nbsp;течений</b>генеративная композиция<br>реальное время</div>
<div id="title">
  <h1>Северное <span class="accent">течение</span></h1>
  <p>Пять тысяч световых нитей дрейфуют в медленно дышащем поле скоростей. Кадр не повторяется никогда.</p>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false });
  const BG = { r: 4, g: 6, b: 15 };

  /* ---------- зерно ---------- */
  (function grain() {
    const s = 170, c = document.createElement("canvas");
    c.width = c.height = s;
    const g = c.getContext("2d"), img = g.createImageData(s, s);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 122 + (Math.random() * 132 - 66) | 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    document.getElementById("grain").style.backgroundImage = `url(${c.toDataURL()})`;
  })();

  /* ---------- перлин 3D ---------- */
  const perm = new Uint8Array(512);
  (function seed() {
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    let s = 20240607;
    const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
    for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  })();
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  function grad(h, x, y, z) {
    const q = h & 15;
    const u = q < 8 ? x : y;
    const v = q < 4 ? y : (q === 12 || q === 14 ? x : z);
    return ((q & 1) ? -u : u) + ((q & 2) ? -v : v);
  }
  function noise(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
    const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
    return lerp(
      lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
           lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),
      lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
           lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v),
      w);
  }

  /* ---------- палитра ---------- */
  const HUES = [198, 190, 168, 205, 258, 298, 336, 32];
  function hueAt(t) {
    t = ((t % 1) + 1) % 1;
    const x = t * (HUES.length - 1), i = Math.floor(x), fr = x - i;
    const sf = fr * fr * (3 - 2 * fr);
    return lerp(HUES[i], HUES[Math.min(i + 1, HUES.length - 1)], sf);
  }

  /* ---------- спрайт головы ---------- */
  const SPR = 64, STEPS = 48, sprites = [];
  (function build() {
    for (let i = 0; i < STEPS; i++) {
      const h = hueAt(i / STEPS), c = document.createElement("canvas");
      c.width = c.height = SPR;
      const g = c.getContext("2d"), r = SPR / 2;
      const grd = g.createRadialGradient(r, r, 0, r, r, r);
      grd.addColorStop(0, `hsla(${h},100%,95%,1)`);
      grd.addColorStop(.12, `hsla(${h},100%,80%,.9)`);
      grd.addColorStop(.36, `hsla(${h},100%,66%,.36)`);
      grd.addColorStop(.7, `hsla(${h},95%,58%,.08)`);
      grd.addColorStop(1, `hsla(${h},95%,58%,0)`);
      g.fillStyle = grd; g.fillRect(0, 0, SPR, SPR);
      sprites.push(c);
    }
  })();

  /* ---------- сцена ---------- */
  let W = 0, H = 0, DPR = 1, reset = false, parts = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.max(1, W * DPR | 0);
    canvas.height = Math.max(1, H * DPR | 0);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = `rgb(${BG.r},${BG.g},${BG.b})`;
    ctx.fillRect(0, 0, W, H);
    reset = true;
  }

  function spawn(p, initial) {
    p.x = Math.random() * W;
    p.y = Math.random() * H;
    if (!initial) {
      // рождение у краёв даёт ощущение втекающего потока
      if (Math.random() < .62) {
        if (Math.random() < .5) p.x = -20; else p.x = W + 20;
      } else { p.y = -20 - Math.random() * 60; }
    }
    p.px = p.x; p.py = p.y;
    p.vx = 0; p.vy = 0;
    p.w = 0.9 + Math.pow(Math.random(), 2.0) * 7.5;
    p.speed = 0.5 + Math.random() * 1.7;
    p.ht = (p.y / H) * 0.62 + (p.x / W) * 0.2 + p.speed * 0.06 + (Math.random() - .5) * .1;
    p.ht = ((p.ht % 1) + 1) % 1;
    p.bright = 0.55 + Math.random() * 0.95;
    if (Math.random() < 0.02) p.bright *= 1.9;
    p.life = initial ? Math.random() * (900) : -Math.random() * 60;
    p.maxLife = 620 + Math.random() * 1500;
  }

  function spawnMist(m) {
    m.x = Math.random() * W; m.y = Math.random() * H;
    m.vx = 0; m.vy = 0;
    m.w = 120 + Math.random() * 420;
    m.speed = 0.2 + Math.random() * 0.6;
    m.ht = Math.random();
    m.bright = 0.03 + Math.random() * 0.035;
  }

  function populate() {
    const n = Math.round(Math.min(6000, Math.max(1200, (W * H) / 380)));
    parts = new Array(n);
    for (let i = 0; i < n; i++) { const p = {}; spawn(p, true); parts[i] = p; }
    mists = new Array(30);
    for (let i = 0; i < 30; i++) { const m = {}; spawnMist(m); mists[i] = m; }
  }

  const SCALE = 0.00165;
  const f = { x: 0, y: 0 };
  function flow(x, y, z) {
    const e = 5;
    const n1 = noise(x * SCALE, (y + e) * SCALE, z);
    const n2 = noise(x * SCALE, (y - e) * SCALE, z);
    const n3 = noise((x + e) * SCALE, y * SCALE, z + 19.7);
    const n4 = noise((x - e) * SCALE, y * SCALE, z + 19.7);
    f.x = n1 - n2; f.y = -(n3 - n4);
  }

  const ptr = { x: -1e5, y: -1e5, on: false };
  let mists = [];
  let t = 0, last = performance.now();

  function frame(now) {
    const dt = Math.min(3, (now - last) / 16.6667);
    last = now;
    if (reset) { populate(); reset = false; }
    t += 0.0021 * dt;

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(${BG.r},${BG.g},${BG.b},0.030)`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";

    const z = t, driftX = 120 * t, driftY = -70 * t;
    const cx = W * .5, cy = H * .54;

    // дымовая подложка
    for (let i = 0; i < mists.length; i++) {
      const m = mists[i];
      flow(m.x + driftX, m.y + driftY, z * .6);
      const mg = Math.hypot(f.x, f.y) + 1e-4;
      m.vx += (f.x / mg) * 26 * m.speed * dt;
      m.vy += (f.y / mg) * 26 * m.speed * dt;
      m.vx *= 0.99; m.vy *= 0.99;
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.x < -m.w || m.x > W + m.w || m.y < -m.w || m.y > H + m.w) spawnMist(m);
      m.ht += 0.00008 * dt; if (m.ht > 1) m.ht -= 1;
      const spr = sprites[(m.ht * STEPS | 0) % STEPS];
      const s2 = m.w * 1.7;
      ctx.globalAlpha = m.bright;
      ctx.drawImage(spr, m.x - s2, m.y - s2, s2 * 2, s2 * 2);
    }
    ctx.globalAlpha = 1;

    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      p.life += dt;

      flow(p.x + driftX, p.y + driftY, z);
      const mag = Math.hypot(f.x, f.y) + 1e-4;
      let ax = (f.x / mag) * 150 * p.speed;
      let ay = (f.y / mag) * 150 * p.speed;

      const dx = cx - p.x, dy = cy - p.y;
      const d2 = dx * dx + dy * dy + 1e3;
      ax += dx / d2 * 12000; ay += dy / d2 * 12000;

      if (ptr.on) {
        const mx = p.x - ptr.x, my = p.y - ptr.y;
        const m2 = mx * mx + my * my, R = 230;
        if (m2 < R * R) {
          const w = 1 - m2 / (R * R), inv = 1 / (m2 + 60);
          ax += -my * inv * 900 * w - mx * inv * 180 * w;
          ay +=  mx * inv * 900 * w - my * inv * 180 * w;
        }
      }

      p.vx += ax * dt; p.vy += ay * dt;
      p.vx *= 0.968; p.vy *= 0.968;
      p.px = p.x; p.py = p.y;
      p.x += p.vx * dt; p.y += p.vy * dt;

      const sp = Math.hypot(p.vx, p.vy);
      p.ht += (sp * 0.00042 - 0.00024) * dt;
      if (p.ht > 1) p.ht -= 1; else if (p.ht < 0) p.ht += 1;

      let a = p.bright;
      if (p.life < 70) a *= Math.max(0, p.life / 70);
      const out = (p.maxLife - p.life) / 150;
      if (out < 1) a *= Math.max(0, out);

      // крупномасштабная плотность: русла света и тёмные прогалы
      const dn = noise(p.x * 0.00062 + 40, p.y * 0.00062 - 25, z * 0.35);
      let d = (dn + 0.55) * 1.05;
      d = d < 0 ? 0 : d > 1 ? 1 : d;
      d = d * d * (3 - 2 * d);
      a *= 0.22 + 0.78 * d;

      const M = 120;
      if (a <= 0.004 || p.x < -M || p.x > W + M || p.y < -M || p.y > H + M) {
        spawn(p, false); continue;
      }

      const h = hueAt(p.ht) | 0;
      const hueIdx = (p.ht * STEPS | 0) % STEPS;

      // нить
      ctx.strokeStyle = `hsla(${h},100%,68%,${(a * 0.46).toFixed(3)})`;
      ctx.lineWidth = p.w * 0.7;
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();

      // светящаяся голова
      const spr = sprites[hueIdx];
      const sz = p.w * (2.0 + Math.min(sp, 5) * 0.18);
      ctx.globalAlpha = Math.min(0.9, a * 0.66);
      ctx.drawImage(spr, p.x - sz, p.y - sz, sz * 2, sz * 2);
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }

  window.addEventListener("pointermove", e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; }, { passive: true });
  window.addEventListener("pointerdown", e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; }, { passive: true });
  window.addEventListener("pointerleave", () => ptr.on = false);
  window.addEventListener("resize", resize);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
