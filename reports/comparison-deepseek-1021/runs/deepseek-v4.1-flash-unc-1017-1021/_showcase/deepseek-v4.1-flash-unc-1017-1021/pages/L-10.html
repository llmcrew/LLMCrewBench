<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сад самоподобия — фрактальный этюд</title>
<style>
  :root{
    --ink:#04070c;
    --ivory:#f3ead8;
    --ivory-dim:rgba(243,234,216,.58);
    --gold:#e9c98f;
    --mint:#a8f5d3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);overflow:hidden}
  body{
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    color:var(--ivory);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .stage{position:fixed;inset:0;overflow:hidden;cursor:crosshair;background:var(--ink)}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  .veil{
    position:absolute;inset:0;background:#020407;opacity:0;
    transition:opacity .75s ease;pointer-events:none;z-index:6;
  }
  .frame{
    position:absolute;inset:clamp(10px,1.5vw,20px);
    border:1px solid rgba(233,201,143,.18);
    pointer-events:none;z-index:4;
  }
  .frame::before,.frame::after{
    content:"";position:absolute;width:16px;height:16px;
    border-color:rgba(233,201,143,.55);border-style:solid;
  }
  .frame::before{left:-1px;top:-1px;border-width:1px 0 0 1px}
  .frame::after{right:-1px;bottom:-1px;border-width:0 1px 1px 0}

  .top{
    position:absolute;left:clamp(24px,3.4vw,54px);right:clamp(24px,3.4vw,54px);
    top:clamp(26px,3.4vw,52px);
    display:flex;justify-content:space-between;gap:24px;
    font-size:9px;letter-spacing:.24em;text-transform:uppercase;
    color:rgba(243,234,216,.52);z-index:5;pointer-events:none;
    opacity:0;animation:fade 2.4s 1.1s ease forwards;
  }
  .top b{font-weight:400;color:rgba(233,201,143,.68)}
  .sig{display:flex;align-items:center;gap:9px}
  .sig i{
    width:5px;height:5px;border-radius:50%;background:var(--mint);
    box-shadow:0 0 10px 2px rgba(168,245,211,.5);
    animation:pulse 4.5s ease-in-out infinite;
  }
  .caption{
    position:absolute;left:clamp(24px,3.4vw,54px);bottom:clamp(26px,4vw,56px);
    z-index:5;pointer-events:none;max-width:min(560px,84vw);
  }
  .kicker{
    font-size:9px;letter-spacing:.32em;text-transform:uppercase;
    color:rgba(233,201,143,.75);margin-bottom:16px;
    display:flex;align-items:center;gap:12px;
    opacity:0;animation:fade 2s 1.5s ease forwards;
  }
  .kicker::before{content:"";width:26px;height:1px;background:rgba(233,201,143,.55)}
  h1{
    font-family:"Baskerville","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-weight:400;font-size:clamp(31px,4.5vw,66px);line-height:.95;
    letter-spacing:.06em;text-transform:uppercase;
    color:rgba(248,241,226,.96);
    text-shadow:0 2px 34px rgba(0,0,0,.55);
  }
  h1 em{
    display:block;font-style:italic;text-transform:none;
    letter-spacing:.005em;font-size:1.06em;
    color:var(--ivory);
    margin-left:.08em;
  }
  h1 span{display:block;opacity:0;transform:translateY(12px);animation:rise 2.2s ease forwards}
  h1 span:nth-child(1){animation-delay:1.55s}
  h1 span:nth-child(2){animation-delay:1.75s}
  .caption p{
    margin-top:20px;font-size:10px;line-height:1.9;letter-spacing:.08em;
    color:rgba(243,234,216,.55);max-width:310px;
    opacity:0;animation:fade 2.2s 2.3s ease forwards;
  }
  .caption p::before{
    content:"";display:block;width:44px;height:1px;
    background:rgba(243,234,216,.22);margin-bottom:13px;
  }

  .colophon{
    position:absolute;right:clamp(26px,3.4vw,54px);bottom:clamp(28px,4vw,56px);
    z-index:5;pointer-events:none;text-align:right;
    font-size:8.5px;line-height:1.95;letter-spacing:.18em;
    text-transform:uppercase;color:rgba(243,234,216,.42);
    opacity:0;animation:fade 2.4s 2.6s ease forwards;
  }
  .colophon b{font-weight:400;color:rgba(233,201,143,.6)}
  .colophon .num{
    font-family:"Baskerville","Iowan Old Style",Georgia,serif;
    font-style:italic;font-size:17px;letter-spacing:.05em;
    color:rgba(243,234,216,.62);text-transform:none;display:block;margin-bottom:7px;
  }

  .hint{
    position:absolute;left:50%;bottom:clamp(22px,3vw,38px);
    transform:translateX(-50%);z-index:5;pointer-events:none;
    font-size:8px;letter-spacing:.26em;text-transform:uppercase;
    color:rgba(243,234,216,.36);white-space:nowrap;
    opacity:0;animation:hint 8.5s 2.8s ease forwards;
  }
  .hint .key{color:rgba(233,201,143,.65)}

  @keyframes fade{to{opacity:1}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  @keyframes hint{
    0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:.28}
  }
  @media (max-width:700px){
    .colophon{display:none}
    .caption{bottom:30px}
    .caption p{display:none}
    .top{font-size:8px;letter-spacing:.16em}
    .hint{font-size:7px;letter-spacing:.16em;bottom:14px}
  }
  @media (prefers-reduced-motion:reduce){
    .sig i{animation:none}
  }
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Интерактивная фрактальная композиция: светящийся ночной сад">
  <canvas id="scene"></canvas>
  <div class="frame" aria-hidden="true"></div>
  <header class="top" aria-hidden="true">
    <span><b>Fractal botany</b> · ночная серия</span>
    <span class="sig"><i></i><span>seed <b id="seedTop">—</b></span></span>
  </header>
  <section class="caption">
    <div class="kicker">этюд о самоподобии</div>
    <h1><span>Сад</span><span><em>самоподобия</em></span></h1>
    <p>В каждой ветви повторяется целое. Свет идёт изнутри формы, а не снаружи.</p>
  </section>
  <aside class="colophon" aria-hidden="true">
    <span class="num" id="seedNum">№ —</span>
    <span>рекурсивная флора<br>девять порядков ветвления</span>
    <span><b>клик</b> — новый сад</span>
  </aside>
  <div class="hint" id="hint" aria-hidden="true">двигайте курсором <span class="key">·</span> клик — вырастить заново <span class="key">·</span> R</div>
  <div class="veil" id="veil"></div>
</main>

<script>
(() => {
  "use strict";

  const stage = document.getElementById("stage");
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d", { alpha: false });
  const veil = document.getElementById("veil");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function parseSeed() {
    const q = new URLSearchParams(location.search);
    if (q.has("seed")) {
      const n = parseInt(q.get("seed"), 36);
      if (Number.isFinite(n)) return n >>> 0;
    }
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0];
  }
  let seed = parseSeed();
  const seedLabel = seed.toString(36).toUpperCase().padStart(7, "0").slice(-7);
  document.getElementById("seedTop").textContent = seedLabel;
  document.getElementById("seedNum").textContent = "№ " + seedLabel.slice(0, 4);

  let W = innerWidth, H = innerHeight, DPR = 1;
  let lerp2 = 1.5;
  const N = { x: 0, y: 0, tx: 0, ty: 0 };
  let wind = { x: 0, amp: 0.5, bend: 0 };
  let plants = [], bgPlants = [], particles = [], petals = [];
  let crown = null;
  let startAt = performance.now() / 1000;
  const q = new URLSearchParams(location.search);
  if (q.has("t")) startAt -= parseFloat(q.get("t")) || 0;

  const off = document.createElement("canvas");
  const octx = off.getContext("2d");
  const bg = document.createElement("canvas");
  const bctx = bg.getContext("2d");
  const fg = document.createElement("canvas");
  const fctx = fg.getContext("2d");
  let grainPattern = null;

  const PAL = {
    hero: { stem: ["#174a40", "#2c7a66", "#9cf4cc"], leaf: ["#174b40", "#2d7f68", "#bdfee0"], rim: "#f7dca6" },
    teal: { stem: ["#0e3535", "#1d5b54", "#72dcbc"], leaf: ["#0d3b37", "#1d6458", "#8cecc9"], rim: "#d9c892" },
    gold: { stem: ["#3d341d", "#74602f", "#f6d28d"], leaf: ["#37351f", "#736234", "#f8dfa1"], rim: "#ffe4b0" },
    ash:  { stem: ["#182d2b", "#254641", "#6ba89a"], leaf: ["#152b29", "#274b45", "#84c3b1"], rim: "#c9bd92" }
  };
  const colCache = new Map();
  function hexA(hex, a) {
    const key = hex + a.toFixed(2);
    if (colCache.has(key)) return colCache.get(key);
    const n = parseInt(hex.slice(1), 16);
    const s = `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a.toFixed(2)})`;
    colCache.set(key, s);
    return s;
  }
  function mixHex(a, b, t) {
    const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
    const r = Math.round(lerp(A >> 16, B >> 16, t));
    const g = Math.round(lerp(A >> 8 & 255, B >> 8 & 255, t));
    const bl = Math.round(lerp(A & 255, B & 255, t));
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
  }

  function resize() {
    W = innerWidth; H = innerHeight;
    DPR = Math.min(devicePixelRatio || 1, 1.75);
    for (const c of [canvas, off, bg, fg]) {
      c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
      if (c !== canvas) { c.style.width = W + "px"; c.style.height = H + "px"; }
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    buildAll();
    startAt = performance.now() / 1000;
  }

  // ---------- fractal flora ----------
  function makePlant(rng, cfg) {
    const maxDepth = cfg.depth;
    const plant = { cfg, maxDepth, nodes: [] };
    const pal = PAL[cfg.pal];
    const phase = rng() * TAU;

    function node(x, y, angle, len, width, depth, side) {
      const t = depth / maxDepth;
      const bend = (rng() - .5) * .55 + cfg.curve * (1 - t) * 3;
      const n = {
        x, y, angle, len, width, depth, bend, side,
        phase: phase + depth * 1.7 + rng() * .9,
        start: .25 + depth * (cfg.speed || .26) + rng() * .32,
        stem: hexA(mixHex(pal.stem[0], pal.stem[Math.min(2, 1 + (t > .55) + (t > .82))], t), .22 + t * .62),
        rim: hexA(pal.rim, .1 + t * .52),
        leaf: hexA(mixHex(pal.leaf[0], pal.leaf[2], Math.pow(t, .8)), t > .9 ? .62 : .26 + t * .3),
        lw: Math.max(.32, width * (.42 + t * .2)),
        leafLen: clamp(len * 1.15 + 3, 3, 42),
        leafSide: (rng() < .5 ? -1 : 1) * (.45 + rng() * .5)
      };
      plant.nodes.push(n);
      if (depth >= maxDepth) return n;

      const grow = .8 + rng() * .05;
      const mainAngle = angle + bend + (rng() - .5) * .16;
      n.main = node(
        x + Math.cos(mainAngle) * len, y + Math.sin(mainAngle) * len,
        mainAngle, len * grow, width * .72, depth + 1, 0
      );
      if (depth < 1) return n;

      const sgn = (depth % 2 ? 1 : -1) * (rng() < .82 ? 1 : -1);
      const sl = len * (.4 + rng() * .17);
      const sa = angle + sgn * (.55 + rng() * .38) - Math.abs(bend) * .4;
      const sideNode = node(
        x + Math.cos(angle) * len * .88, y + Math.sin(angle) * len * .88,
        sa, sl, width * .48, depth + 1, sgn
      );
      n.side = sideNode;

      if (depth > 2 && depth < maxDepth - 1 && rng() < .5) {
        const sl2 = len * (.26 + rng() * .12);
        const sa2 = angle - sgn * (.7 + rng() * .4);
        n.extra = node(
          x + Math.cos(angle) * len * .62, y + Math.sin(angle) * len * .62,
          sa2, sl2, width * .32, depth + 1, -sgn
        );
      }
      return n;
    }

    plant.root = node(cfg.x, cfg.y, cfg.angle, cfg.len, cfg.width, 0, 0);
    return plant;
  }

  function leafPath(g, len, wid) {
    g.beginPath();
    g.moveTo(0, 0);
    const steps = 4;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const x = len * t;
      const w = wid * Math.sin(Math.PI * Math.pow(t, .7)) * (i % 2 ? 1 : .58);
      g.quadraticCurveTo(x - len * .08, -w, x, 0);
    }
    for (let i = steps - 1; i >= 1; i--) {
      const t = i / steps;
      const x = len * t;
      const w = wid * Math.sin(Math.PI * Math.pow(t, .7)) * (i % 2 ? 1 : .58);
      g.quadraticCurveTo(x - len * .08, w * .72, x, 0);
    }
    g.quadraticCurveTo(-len * .08, wid * .12, 0, 0);
  }

  function drawLeaf(g, x, y, a, len, wid, alpha, fill, rim, perframe) {
    if (len < 1.2 || alpha <= .01) return;
    g.save();
    g.translate(x, y); g.rotate(a);
    leafPath(g, len, wid);
    g.globalAlpha = alpha;
    g.fillStyle = fill;
    g.fill();
    if (perframe) {
      g.globalAlpha = alpha * .55;
      g.strokeStyle = rim;
      g.lineWidth = .55;
      g.stroke();
    }
    g.restore();
  }

  function drawPlant(g, plant, el, time, perframe) {
    const windAmp = reduced ? .55 : 1;
    const walk = (n) => {
      const appear = smooth(n.start, n.start + .72, el);
      if (appear <= 0) return;
      const grow = easeOut(clamp((el - n.start) / .95, 0, 1));
      const dk = n.depth / plant.maxDepth;
      const sway = Math.sin(time * .52 + n.phase + n.x * .0035) * (.008 + dk * dk * .075) * (wind.amp + .25) * windAmp;
      const a = n.angle + sway + wind.bend * dk * .17;
      const L = n.len * grow;
      const ex = n.x + Math.cos(a) * L;
      const ey = n.y + Math.sin(a) * L;

      // stem: soft sheath + bright core
      const mx = (n.x + ex) / 2, my = (n.y + ey) / 2;
      const bend = n.bend * L * (perframe ? (reduced ? .35 : .55) : 0);
      const cx = mx + Math.cos(a + Math.PI / 2) * bend;
      const cy = my + Math.sin(a + Math.PI / 2) * bend;

      if (perframe) {
        g.globalAlpha = appear * .16;
        g.strokeStyle = n.stem;
        g.lineWidth = n.lw * 3.4;
        g.beginPath(); g.moveTo(n.x, n.y); g.quadraticCurveTo(cx, cy, ex, ey); g.stroke();
      }
      g.globalAlpha = appear * (n.depth < 3 ? .75 : .92);
      g.strokeStyle = n.stem;
      g.lineWidth = n.lw;
      g.beginPath(); g.moveTo(n.x, n.y); g.quadraticCurveTo(cx, cy, ex, ey); g.stroke();

      if (perframe && n.depth < 4) {
        g.globalAlpha = appear * .3;
        g.strokeStyle = n.rim;
        g.lineWidth = .6;
        g.beginPath(); g.moveTo(n.x, n.y); g.quadraticCurveTo(cx, cy, ex, ey); g.stroke();
      }

      if (n.depth >= 2) {
        drawLeaf(g, ex, ey, a + n.leafSide, n.leafLen * grow, n.leafLen * .17 * (.7 + grow * .3), appear * (perframe ? .78 : .5), n.leaf, n.rim, perframe);
      }
      if (n.main) walk(n.main);
      if (n.side) walk(n.side);
      if (n.extra) walk(n.extra);
    };
    walk(plant.root);
  }

  // ---------- static background ----------
  function buildBackground(rng) {
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bctx.clearRect(0, 0, W, H);
    const horizon = H * .72;

    const sky = bctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#03060b");
    sky.addColorStop(.42, "#061219");
    sky.addColorStop(.72, "#081b1d");
    sky.addColorStop(1, "#020608");
    bctx.fillStyle = sky;
    bctx.fillRect(0, 0, W, H);

    // nebular washes
    bctx.save();
    bctx.globalCompositeOperation = "screen";
    const blobs = [
      [W * .22, H * .26, W * .35, "rgba(70,150,128,.14)"],
      [W * .7, H * .5, W * .38, "rgba(34,104,104,.12)"],
      [W * .5, H * .86, W * .55, "rgba(53,101,79,.13)"],
      [W * .85, H * .18, W * .3, "rgba(146,116,68,.07)"]
    ];
    for (const [x, y, r, c] of blobs) {
      const gr = bctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, c); gr.addColorStop(1, "rgba(0,0,0,0)");
      bctx.fillStyle = gr; bctx.fillRect(0, 0, W, H);
    }
    bctx.restore();

    // stars
    for (let i = 0; i < 150; i++) {
      const x = rng() * W, y = rng() * horizon;
      const a = .06 + rng() * .28;
      bctx.fillStyle = `rgba(220,235,220,${a})`;
      bctx.fillRect(x, y, rng() < .12 ? 1.6 : .8, .8);
    }

    // moon
    const mr = Math.min(W, H) * .105;
    const mx = W * .255, my = H * .265;
    const halo = bctx.createRadialGradient(mx, my, mr * .5, mx, my, mr * 5.2);
    halo.addColorStop(0, "rgba(255,225,168,.20)");
    halo.addColorStop(.3, "rgba(224,181,116,.09)");
    halo.addColorStop(1, "rgba(180,140,80,0)");
    bctx.fillStyle = halo; bctx.fillRect(0, 0, W, H);

    const disc = bctx.createRadialGradient(mx - mr * .3, my - mr * .35, mr * .1, mx, my, mr);
    disc.addColorStop(0, "#fff6dd");
    disc.addColorStop(.55, "#f0d8a8");
    disc.addColorStop(.88, "#cfa96f");
    disc.addColorStop(1, "rgba(180,140,80,.1)");
    bctx.fillStyle = disc;
    bctx.beginPath(); bctx.arc(mx, my, mr, 0, TAU); bctx.fill();

    bctx.save();
    bctx.globalCompositeOperation = "multiply";
    for (let i = 0; i < 9; i++) {
      const a = rng() * TAU, rr = Math.sqrt(rng()) * mr * .8;
      const cr = 2 + rng() * mr * .17;
      const cg = bctx.createRadialGradient(mx + Math.cos(a) * rr, my + Math.sin(a) * rr, 0, mx + Math.cos(a) * rr, my + Math.sin(a) * rr, cr);
      cg.addColorStop(0, "rgba(150,118,74,.24)");
      cg.addColorStop(1, "rgba(150,118,74,0)");
      bctx.fillStyle = cg;
      bctx.beginPath(); bctx.arc(mx + Math.cos(a) * rr, my + Math.sin(a) * rr, cr, 0, TAU); bctx.fill();
    }
    bctx.restore();

    // distant fern silhouettes
    bctx.save();
    bctx.filter = "blur(4px)";
    for (const p of bgPlants) drawPlant(bctx, p, 100, rng() * 10, false);
    bctx.restore();

    // mist bands
    bctx.save();
    bctx.globalCompositeOperation = "screen";
    for (let i = 0; i < 3; i++) {
      const y = H * (.58 + i * .075);
      const mg = bctx.createLinearGradient(0, y - H * .08, 0, y + H * .09);
      mg.addColorStop(0, "rgba(120,180,160,0)");
      mg.addColorStop(.5, `rgba(120,180,160,${.028 + i * .008})`);
      mg.addColorStop(1, "rgba(120,180,160,0)");
      bctx.fillStyle = mg;
      bctx.fillRect(0, y - H * .08, W, H * .17);
    }
    bctx.restore();
  }

  function buildForeground(rng) {
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fctx.clearRect(0, 0, W, H);

    fctx.save();
    fctx.filter = "blur(5px)";
    fctx.fillStyle = "rgba(2,8,9,.9)";
    for (let i = 0; i < 7; i++) {
      const x = -W * .05 + rng() * W * 1.1;
      const h = H * (.14 + rng() * .22);
      const dir = rng() < .5 ? -1 : 1;
      fctx.beginPath();
      fctx.moveTo(x - W * .035, H + 4);
      fctx.quadraticCurveTo(x + dir * W * .02, H - h * .55, x + dir * W * .09, H - h);
      fctx.quadraticCurveTo(x + dir * W * .02, H - h * .5, x + W * .05, H + 4);
      fctx.fill();
    }
    fctx.restore();

    fctx.save();
    fctx.lineCap = "round";
    for (let i = 0; i < 85; i++) {
      const x = rng() * W;
      const h = 18 + rng() * H * .17;
      const lean = (rng() - .5) * h * .8;
      fctx.strokeStyle = `rgba(2,7,8,${.55 + rng() * .4})`;
      fctx.lineWidth = .7 + rng() * 2.2;
      fctx.beginPath();
      fctx.moveTo(x, H + 3);
      fctx.quadraticCurveTo(x + lean * .2, H - h * .5, x + lean, H - h);
      fctx.stroke();
      if (rng() < .3) {
        fctx.strokeStyle = "rgba(180,220,190,.14)";
        fctx.lineWidth = .5;
        fctx.stroke();
      }
    }
    fctx.restore();

    // out-of-focus corner fronds
    fctx.save();
    fctx.filter = "blur(7px)";
    const corner = makePlant(mulberry32((seed ^ 0x9e3779b9) >>> 0), {
      x: W * 1.01, y: H * 1.08, angle: -2.45, len: H * .16, width: 9, depth: 7, curve: -.04, pal: "ash"
    });
    drawPlant(fctx, corner, 100, 4, false);
    fctx.restore();
  }

  function buildParticles(rng) {
    particles = [];
    const count = Math.round(clamp(W * H / 19000, 34, 95));
    for (let i = 0; i < count; i++) {
      particles.push({
        x: rng() * W, y: rng() * H,
        vy: -(.15 + rng() * .55), vx: (rng() - .5) * .22,
        r: .5 + rng() * 1.8, ph: rng() * TAU, sp: .25 + rng() * .7,
        gold: rng() < .3, a: .18 + rng() * .55, tw: rng() * TAU
      });
    }
    petals = [];
    for (let i = 0; i < 11; i++) {
      petals.push({
        x: rng() * W, y: rng() * H,
        vy: .15 + rng() * .3, vx: (rng() - .5) * .2,
        rot: rng() * TAU, vr: (rng() - .5) * .35,
        r: 2.2 + rng() * 4, ph: rng() * TAU, a: .2 + rng() * .4
      });
    }
  }

  function buildAll() {
    const rng = mulberry32(seed);
    const srng = mulberry32((seed * 2654435761) >>> 0);

    bgPlants = [];
    for (let i = 0; i < 7; i++) {
      const x = (i + .2 + srng() * .7) / 7 * W;
      bgPlants.push(makePlant(srng, {
        x, y: H * (1.02 + srng() * .04),
        angle: -Math.PI / 2 + (x / W - .5) * .7 + (srng() - .5) * .3,
        len: H * (.055 + srng() * .075), width: 4,
        depth: 6, curve: (x / W - .5) * -.07, pal: "ash", speed: .3
      }));
    }

    plants = [];
    const baseY = H * 1.035;
    // far layer
    plants.push(makePlant(rng, {
      x: W * .66, y: baseY, angle: -1.53, len: H * .085, width: 4.2,
      depth: 7, curve: -.022, pal: "teal", speed: .3
    }));
    plants.push(makePlant(rng, {
      x: W * .37, y: H * 1.05, angle: -1.47, len: H * .075, width: 4,
      depth: 7, curve: .018, pal: "ash", speed: .33
    }));
    // right frond
    plants.push(makePlant(rng, {
      x: W * .805, y: baseY, angle: -1.7, len: H * .135, width: 5.3,
      depth: 8, curve: -.035, pal: "teal", speed: .28
    }));
    // left sprout
    plants.push(makePlant(rng, {
      x: W * .135, y: H * 1.04, angle: -1.3, len: H * .095, width: 4.6,
      depth: 8, curve: .04, pal: "gold", speed: .3
    }));
    // hero
    crown = makePlant(rng, {
      x: W * .475, y: H * 1.045, angle: -1.87, len: H * .155, width: 7.4,
      depth: 9, curve: -.052, pal: "hero", speed: .245
    });
    plants.push(crown);

    buildBackground(rng);
    buildForeground(rng);
    buildParticles(rng);
    makeGrain();
  }

  function makeGrain() {
    if (grainPattern) return;
    const gc = document.createElement("canvas");
    gc.width = gc.height = 180;
    const g = gc.getContext("2d");
    const img = g.createImageData(180, 180);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = Math.random() * 90;
    }
    g.putImageData(img, 0, 0);
    grainPattern = ctx.createPattern(gc, "repeat");
  }

  // ---------- frame ----------
  let last = performance.now() / 1000;
  let light = { x: .5, y: .45, on: 0 };

  function tick(nowMs) {
    const now = nowMs / 1000;
    const dt = clamp(now - last, 0, .05);
    last = now;
    const el = now - startAt;
    const time = now;

    wind.amp = lerp(wind.amp, clamp(Math.abs(N.x) * .9 + .18, 0, .9), .035);
    wind.bend = lerp(wind.bend, N.x * 1.1, .03);
    light.x = lerp(light.x, N.tx, .04);
    light.y = lerp(light.y, N.ty, .04);

    const driftX = Math.sin(time * .13) * 5 + Math.sin(time * .071) * 3;
    const driftY = Math.cos(time * .1) * 3;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(bg, 0, 0, W, H);

    // art layer
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    octx.clearRect(0, 0, W, H);
    octx.save();
    octx.translate(driftX, driftY);
    for (const p of plants) drawPlant(octx, p, el, time, true);
    octx.restore();

    ctx.drawImage(off, 0, 0, W, H);

    // bloom
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = .42;
    ctx.filter = "blur(11px)";
    ctx.drawImage(off, 0, 0, W, H);
    ctx.filter = "none";
    ctx.globalAlpha = .18;
    ctx.filter = "blur(34px)";
    ctx.drawImage(off, 0, 0, W, H);
    ctx.restore();

    // foreground
    ctx.globalAlpha = 1;
    ctx.drawImage(fg, 0, 0, W, H);

    // pointer light
    const lx = light.x * W, ly = light.y * H;
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, Math.min(W, H) * .48);
    lg.addColorStop(0, "rgba(255,217,156,.075)");
    lg.addColorStop(.5, "rgba(120,200,170,.03)");
    lg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // spores
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const p of particles) {
      p.y += p.vy * dt * 22;
      p.x += (p.vx + Math.sin(time * p.sp + p.ph) * .11 + wind.x * .22) * dt * 22;
      if (p.y < -20) { p.y = H + 15; p.x = Math.random() * W; }
      if (p.x < -15) p.x = W + 10; else if (p.x > W + 15) p.x = -10;
      const tw = .55 + .45 * Math.sin(time * 1.7 + p.tw);
      const c = p.gold ? "255,216,150" : "154,245,207";
      const rr = p.r * 7;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
      g.addColorStop(0, `rgba(${c},${p.a * tw * .5})`);
      g.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(${c},${p.a * tw})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * .55, 0, TAU); ctx.fill();
    }
    for (const p of petals) {
      p.y += p.vy * dt * 20;
      p.x += (p.vx + Math.sin(time * .7 + p.ph) * .25) * dt * 20;
      p.rot += p.vr * dt;
      if (p.y > H + 20) { p.y = -15; p.x = Math.random() * W; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = `rgba(245,213,150,${p.a})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r, p.r * .38, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // vignette
    const vg = ctx.createRadialGradient(W * .5, H * .46, Math.min(W, H) * .18, W * .5, H * .5, Math.max(W, H) * .78);
    vg.addColorStop(0, "rgba(1,4,6,0)");
    vg.addColorStop(.62, "rgba(1,4,6,.16)");
    vg.addColorStop(1, "rgba(1,4,6,.72)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    // grain
    if (grainPattern) {
      ctx.save();
      ctx.globalCompositeOperation = "soft-light";
      ctx.globalAlpha = .1;
      ctx.translate((Math.random() * 180) | 0, (Math.random() * 180) | 0);
      ctx.fillStyle = grainPattern;
      ctx.fillRect(-180, -180, W + 360, H + 360);
      ctx.restore();
    }

    requestAnimationFrame(tick);
  }

  // ---------- input ----------
  function pointer(e) {
    const t = e.touches ? e.touches[0] : e;
    N.tx = t.clientX / W;
    N.ty = t.clientY / H;
    N.x = (t.clientX / W - .5) * 2;
  }
  stage.addEventListener("pointermove", pointer, { passive: true });
  stage.addEventListener("pointerdown", pointer, { passive: true });

  let growing = false;
  function reseed() {
    if (growing) return;
    growing = true;
    veil.style.opacity = ".92";
    setTimeout(() => {
      const s = parseSeed();
      location.hash = s.toString(36);
      renderSeed(s);
      buildAll();
      startAt = performance.now() / 1000;
      setTimeout(() => { veil.style.opacity = "0"; growing = false; }, 90);
    }, 520);
  }

  function renderSeed(s) {
    const lab = s.toString(36).toUpperCase().padStart(7, "0").slice(-7);
    document.getElementById("seedTop").textContent = lab;
    document.getElementById("seedNum").textContent = "№ " + lab.slice(0, 4);
  }

  function randomReseed() {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    growing = true;
    veil.style.opacity = ".92";
    setTimeout(() => {
      renderSeed(a[0]);
      // rebuild deterministic from chosen seed by swapping closure state
      seed = a[0];
      buildAll();
      startAt = performance.now() / 1000;
      setTimeout(() => { veil.style.opacity = "0"; growing = false; }, 90);
    }, 520);
  }

  let down = null;
  stage.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
  stage.addEventListener("pointerup", e => {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 9) randomReseed();
    down = null;
  });
  addEventListener("keydown", e => {
    if (e.key === "r" || e.key === "R" || e.key === " ") { e.preventDefault(); randomReseed(); }
  });

  let rt = 0;
  addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(resize, 160);
  });

  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
