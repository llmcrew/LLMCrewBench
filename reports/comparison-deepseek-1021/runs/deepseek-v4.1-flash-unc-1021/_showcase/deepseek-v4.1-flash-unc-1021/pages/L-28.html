<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Цепная реакция обломков</title>
<style>
  :root{
    --bg:#06060e;
    --edge:#000;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{
    font-family:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    color:#cfe0ff;
    /* faint warm core behind the void */
    background:
      radial-gradient(120% 90% at 50% 46%, #141026 0%, #090814 45%, #05050c 100%);
    cursor:crosshair;
  }
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}

  /* vignette + grain overlays */
  #vignette{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 100% at 50% 48%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.9) 100%);
    mix-blend-mode:multiply;
    z-index:2;
  }
  #grain{
    position:fixed;inset:0;pointer-events:none;
    opacity:.06;mix-blend-mode:overlay;z-index:3;
    background-repeat:repeat;
  }

  .hud{
    position:fixed;top:0;left:0;z-index:4;pointer-events:none;
    padding:18px 22px;letter-spacing:.28em;font-size:11px;line-height:1.9;
    color:#9fb4dd;text-transform:uppercase;
  }
  .hud b{color:#eaf2ff;font-weight:600}
  .hud .row{opacity:.55}
  .hud .row.hot{opacity:1;color:#ffcf8a}

  .caption{
    position:fixed;left:0;right:0;bottom:26px;z-index:4;pointer-events:none;
    text-align:center;letter-spacing:.55em;font-size:11px;
    color:#8ea0c6;text-transform:uppercase;opacity:.7;
  }
  .caption span{color:#ffd79a;opacity:.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<div class="hud">
  <div class="row">gen <b id="hGen">00</b></div>
  <div class="row">fragments <b id="hFrag">0000</b></div>
  <div class="row hot" id="hState">catalyst armed</div>
</div>

<div class="caption">цепная реакция <span>обломков</span></div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  let W = 0, H = 0, DPR = 1;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------------------------------------------------------------- palette
  // generation -> colour. cold cyan at first impact, white-hot deep in the chain.
  const PALETTE = [
    "#63e7ff", "#5aa6ff", "#8f74ff", "#d45cff",
    "#ff5fb0", "#ff6a5a", "#ffab5a", "#ffe0a3", "#fff6e0"
  ];
  const colOf = g => PALETTE[Math.min(g | 0, PALETTE.length - 1)];

  // ---------------------------------------------------------------- sim state
  const S = {
    seeds: [],
    grid: new Map(),
    cell: 1,
    shards: [],
    waves: [],
    flashes: [],
    gen: 0,
    total: 0,
    lastBoom: -99,
    tPrev: 0,
    settle: 0
  };
  let time = 0;

  // ---------------------------------------------------------------- field
  function build(){
    S.seeds.length = 0;
    S.grid.clear();

    const spacing = Math.max(74, Math.min(W, H) / 7.5);
    S.cell = spacing;
    const cols = Math.ceil(W / spacing) + 3;
    const rows = Math.ceil(H / spacing) + 3;

    let i = 0;
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const x = (c - 1) * spacing + (r % 2 ? spacing * 0.5 : 0) + rnd(-1, 1) * spacing * 0.2;
        const y = (r - 1) * spacing + rnd(-1, 1) * spacing * 0.2;
        if (x < -spacing || x > W + spacing || y < -spacing || y > H + spacing) continue;

        const n = 5 + ((i * 7) % 3);           // 5..7 sided shard
        const pts = [];
        for (let k = 0; k < n; k++){
          const a = (k / n) * TAU + rnd(-0.12, 0.12);
          const rr = rnd(0.7, 1.15);
          pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
        }
        const seed = {
          x, y,
          r: rnd(7.5, 11.5),
          rot: rnd(0, TAU),
          spin: rnd(-0.5, 0.5),
          pts,
          hit: false,
          gen: 0,
          husk: 0,
          phase: rnd(0, TAU)
        };
        S.seeds.push(seed);
        const key = (Math.floor(x / S.cell)) + "," + (Math.floor(y / S.cell));
        let bucket = S.grid.get(key);
        if (!bucket){ bucket = []; S.grid.set(key, bucket); }
        bucket.push(seed);
        i++;
      }
    }
  }

  // ---------------------------------------------------------------- events
  function burst(x, y, g, energy){
    const n = 8 + Math.floor(Math.random() * 6);
    const base = Math.random() * TAU;
    const spd = (200 + Math.random() * 220 + Math.min(g, 10) * 9) * (energy || 1);

    for (let i = 0; i < n; i++){
      const a = base + (i / n) * TAU + rnd(-0.35, 0.35);
      const v = spd * rnd(0.72, 1.18);
      const life = rnd(3.6, 6.6);
      S.shards.push({
        x, y, px: x, py: y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        g: g + 1, life: 0, max: life,
        size: rnd(1.2, 3.0),
        rot: rnd(0, TAU), spin: rnd(-6, 6),
        pull: rnd(-0.06, 0.22),          // curving drift -> arcing debris
        dead: false
      });
    }

    S.flashes.push({ x, y, life: 0, dur: rnd(0.36, 0.62), g, r: rnd(34, 58) });
    S.waves.push({ x, y, r: 6, max: S.cell * rnd(1.3, 2.0), life: 0, dur: rnd(0.65, 1.05), g });

    S.gen = Math.max(S.gen, g);
    S.total += n;
    S.lastBoom = time;
  }

  function ignite(seed, from)
  {
    if (!seed || seed.hit) return;
    seed.hit = true;
    seed.gen = (from ? from.g : 0);
    seed.husk = 1;
    burst(seed.x, seed.y, seed.gen, 1);
  }

  function reset(){
    S.shards.length = 0;
    S.waves.length = 0;
    S.flashes.length = 0;
    S.gen = 0;
    for (const s of S.seeds){ s.hit = false; s.husk = 0; s.gen = 0; }
    // detonate the seed nearest the centre
    let best = null, bd = Infinity;
    const cx = W / 2, cy = H / 2;
    for (const s of S.seeds){
      const d = (s.x - cx) ** 2 + (s.y - cy) ** 2;
      if (d < bd){ bd = d; best = s; }
    }
    if (best){
      best.hit = true; best.husk = 1; best.gen = 0;
      burst(best.x, best.y, 0, 1.25);
      S.lastBoom = time;
    }
  }

  function pointer(e){
    const p = e.touches ? e.touches[0] : e;
    const mx = p.clientX, my = p.clientY;
    let best = null, bd = Infinity;
    for (const s of S.seeds){
      const d = (s.x - mx) ** 2 + (s.y - my) ** 2;
      if (d < bd){ bd = d; best = s; }
    }
    if (!best) return;
    if (best.hit){                       // re-kick an already spent husk
      burst(best.x, best.y, Math.max(best.gen, S.gen), 1);
    } else {
      ignite(best, { g: S.gen });
    }
  }

  // ---------------------------------------------------------------- collision
  function collide(sh){
    const cell = S.cell;
    const cx = Math.floor(sh.x / cell), cy = Math.floor(sh.y / cell);
    for (let i = -1; i <= 1; i++){
      for (let j = -1; j <= 1; j++){
        const b = S.grid.get((cx + i) + "," + (cy + j));
        if (!b) continue;
        for (let k = 0; k < b.length; k++){
          const s = b[k];
          if (s.hit) continue;
          const dx = s.x - sh.x, dy = s.y - sh.y;
          const rr = s.r + 2.2;
          if (dx * dx + dy * dy < rr * rr){
            sh.dead = true;
            ignite(s, sh);
            return;
          }
        }
      }
    }
  }

  // ---------------------------------------------------------------- update
  function update(dt){
    time += dt;

    const cx = W / 2, cy = H / 2;

    // shards
    for (let i = S.shards.length - 1; i >= 0; i--){
      const sh = S.shards[i];
      sh.life += dt;
      if (sh.life >= sh.max){ S.shards.splice(i, 1); continue; }

      const damp = Math.pow(0.5, dt);
      sh.vx *= damp; sh.vy *= damp;
      sh.vx += (cx - sh.x) * sh.pull * dt;
      sh.vy += (cy - sh.y) * sh.pull * dt;
      sh.rot += sh.spin * dt;

      sh.px = sh.x; sh.py = sh.y;
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;

      if (sh.x < -40 || sh.x > W + 40 || sh.y < -40 || sh.y > H + 40){
        sh.dead = true;
      }
      collide(sh);
      if (sh.dead) S.shards.splice(i, 1);
    }

    // cheap safety cap
    if (S.shards.length > 1800) S.shards.splice(0, S.shards.length - 1800);

    // waves
    for (let i = S.waves.length - 1; i >= 0; i--){
      const w = S.waves[i];
      w.life += dt;
      const k = w.life / w.dur;
      w.r = 6 + (w.max - 6) * (1 - Math.pow(1 - k, 2.4));
      if (k >= 1) S.waves.splice(i, 1);
    }

    // flashes
    for (let i = S.flashes.length - 1; i >= 0; i--){
      const f = S.flashes[i];
      f.life += dt;
      if (f.life >= f.dur) S.flashes.splice(i, 1);
    }

    // husks relax
    for (const s of S.seeds){
      if (s.husk > 0){ s.husk -= dt * 0.45; if (s.husk < 0) s.husk = 0; }
      s.rot += s.spin * dt * 0.35;
    }

    // auto re-arm when the chain dies out
    if (S.shards.length === 0 && time - S.lastBoom > 0.55){
      S.settle += dt;
      if (S.settle > 0.5){ S.settle = 0; reset(); }
    } else {
      S.settle = 0;
    }
  }

  // ---------------------------------------------------------------- render
  function drawLattice(){
    // faint structural web between dormant nodes
    const maxD2 = (S.cell * 1.45) * (S.cell * 1.45);
    const off = [[1, 0], [0, 1], [1, 1], [-1, 1]];
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = "rgba(104,140,212,0.12)";
    ctx.beginPath();
    for (const s of S.seeds){
      if (s.hit) continue;
      const cx = Math.floor(s.x / S.cell), cy = Math.floor(s.y / S.cell);
      for (const o of off){
        const b = S.grid.get((cx + o[0]) + "," + (cy + o[1]));
        if (!b) continue;
        for (const t of b){
          if (t === s || t.hit) continue;
          const dx = t.x - s.x, dy = t.y - s.y;
          if (dx * dx + dy * dy <= maxD2){
            ctx.moveTo(s.x, s.y); ctx.lineTo(t.x, t.y);
          }
        }
      }
    }
    ctx.stroke();
  }

  function drawSeeds(){
    drawLattice();
    for (const s of S.seeds){
      if (!s.hit){
        const pulse = 0.5 + 0.5 * Math.sin(time * 1.6 + s.phase);
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = "rgba(158,194,248," + (0.36 + pulse * 0.26) + ")";
        ctx.fillStyle = "rgba(24,36,62,0.72)";
        ctx.beginPath();
        for (let k = 0; k < s.pts.length; k++){
          const p = s.pts[k];
          const px = p[0] * s.r, py = p[1] * s.r;
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // live core
        ctx.fillStyle = "rgba(202,226,255," + (0.5 + pulse * 0.5) + ")";
        ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, TAU); ctx.fill();
        ctx.restore();
      } else if (s.husk > 0){
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        ctx.globalAlpha = s.husk * 0.8;
        ctx.strokeStyle = colOf(s.gen);
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        for (let k = 0; k < s.pts.length; k++){
          const p = s.pts[k];
          const px = p[0] * s.r * (1 + (1 - s.husk) * 1.5);
          const py = p[1] * s.r * (1 + (1 - s.husk) * 1.5);
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawWaves(){
    for (const w of S.waves){
      const k = w.life / w.dur;
      const a = (1 - k) * (1 - k) * 0.7;
      const col = colOf(w.g);
      ctx.globalAlpha = a;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.4 * (1 - k) + 0.4;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = a * 0.35;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r * 0.62, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawShards(){
    ctx.lineCap = "round";
    for (const sh of S.shards){
      const k = sh.life / sh.max;
      const a = Math.min(1, sh.life * 6) * (1 - k) * (1 - k);
      const col = colOf(sh.g);
      const t = 0.026;
      const tx = sh.x - sh.vx * t, ty = sh.y - sh.vy * t;

      // soft wide pass
      ctx.globalAlpha = a * 0.3;
      ctx.strokeStyle = col;
      ctx.lineWidth = sh.size * 4.2;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(sh.x, sh.y); ctx.stroke();

      // crisp streak
      ctx.globalAlpha = a * 0.95;
      ctx.lineWidth = sh.size * (0.7 + (1 - k) * 0.8);
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(sh.x, sh.y); ctx.stroke();

      // leading spark
      ctx.globalAlpha = a;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.size * 0.6, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFlashes(){
    for (const f of S.flashes){
      const k = f.life / f.dur;
      const a = (1 - k);
      const r = f.r * (0.6 + k * 1.9);
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
      g.addColorStop(0, "rgba(255,255,255," + (a * 0.95) + ")");
      g.addColorStop(0.35, hexA(colOf(f.g), a * 0.6));
      g.addColorStop(1, hexA(colOf(f.g), 0));
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill();
    }
  }

  function hexA(hex, a){
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }

  function frame(now){
    if (!S.tPrev) S.tPrev = now;
    let dt = (now - S.tPrev) / 1000;
    S.tPrev = now;
    if (dt > 0.05) dt = 0.05;

    // trail fade to background
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(6,6,14,0.16)";
    ctx.fillRect(0, 0, W, H);

    update(dt);

    ctx.globalCompositeOperation = "lighter";
    drawFlashes();
    drawWaves();
    drawShards();
    ctx.globalCompositeOperation = "source-over";
    drawSeeds();

    updateHud();
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- hud
  let hudGen = -1, hudFrag = -1;
  const hGen = document.getElementById("hGen");
  const hFrag = document.getElementById("hFrag");
  const hState = document.getElementById("hState");
  function updateHud(){
    if (S.gen !== hudGen){
      hudGen = S.gen;
      hGen.textContent = String(S.gen).padStart(2, "0");
    }
    if (S.total !== hudFrag){
      hudFrag = S.total;
      hFrag.textContent = String(S.total).padStart(4, "0");
    }
    hState.textContent =
      S.shards.length > 0 ? "chain propagating" :
      (S.settle > 0 ? "field dormant" : "catalyst armed");
  }

  // ---------------------------------------------------------------- grain
  function makeGrain(){
    const c = document.createElement("canvas");
    c.width = c.height = 140;
    const g = c.getContext("2d");
    const img = g.createImageData(140, 140);
    for (let i = 0; i < img.data.length; i += 4){
      const v = 120 + Math.random() * 135;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    document.getElementById("grain").style.backgroundImage = "url(" + c.toDataURL() + ")";
  }

  // ---------------------------------------------------------------- size
  let resizeTO = 0;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "rgba(6,6,14,1)";
    ctx.fillRect(0, 0, W, H);

    build();
    S.shards.length = 0; S.waves.length = 0; S.flashes.length = 0;
    S.lastBoom = time;
    reset();
  }

  window.addEventListener("resize", function(){
    clearTimeout(resizeTO);
    resizeTO = setTimeout(resize, 180);
  });
  window.addEventListener("pointerdown", pointer);

  makeGrain();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
