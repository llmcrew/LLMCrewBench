<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>жидкий металл · стекло</title>
<style>
  :root{ --ink:#eef2f7; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#05070b; overflow:hidden; }
  body{
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  .frame{
    position:fixed; inset:0; pointer-events:none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.055),
                inset 0 0 140px 30px rgba(0,0,0,.55);
  }
  .cap{
    position:fixed; left:clamp(18px,3.4vw,52px); bottom:clamp(18px,4vh,46px);
    pointer-events:none; opacity:0; transform:translateY(10px);
    animation:rise 2.2s cubic-bezier(.2,.7,.2,1) .5s forwards;
    text-shadow:0 1px 22px rgba(0,0,0,.8);
  }
  .cap .t{
    display:block; font-size:clamp(15px,1.7vw,25px); font-weight:300;
    letter-spacing:.34em; text-transform:lowercase;
    background:linear-gradient(92deg,#fff 0%,#bcd3e6 42%,#e9c9a8 78%,#fff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .cap .s{
    display:block; margin-top:.7em; font-size:clamp(9px,.85vw,12px);
    letter-spacing:.42em; text-transform:uppercase; color:rgba(210,224,238,.45);
  }
  .cap .rule{
    width:clamp(90px,13vw,180px); height:1px; margin-top:1.05em;
    background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,0));
  }
  .tag{
    position:fixed; right:clamp(18px,3.4vw,52px); bottom:clamp(18px,4vh,46px);
    pointer-events:none; opacity:0; animation:rise 2.2s cubic-bezier(.2,.7,.2,1) 1s forwards;
    font-size:clamp(9px,.85vw,11px); letter-spacing:.3em; text-transform:uppercase;
    color:rgba(200,216,232,.35); text-align:right;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  .veil{ position:fixed; inset:0; background:#05070b; pointer-events:none;
         animation:veil 1.6s ease .1s forwards; }
  @keyframes veil{ to{ opacity:0; } }
  .msg{ position:fixed; inset:0; display:grid; place-items:center;
        font-size:14px; letter-spacing:.2em; color:#9fb2c6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="veil"></div>
<div class="frame"></div>
<div class="cap">
  <span class="t">жидкий металл · стекло</span>
  <span class="rule"></span>
  <span class="s">mercury &amp; glass — single fragment, real refraction</span>
</div>
<div class="tag">webgl2 · raymarched sdf<br>dispersion · 3-bounce transport</div>
<div class="msg" id="msg" hidden>нет поддержки webgl2</div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv;
void main(){
  vUv = aPos*0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>

<script id="fsScene" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;

uniform vec2  uRes;
uniform float uTime;
uniform vec2  uJitter;

out vec4 outColor;

const float FLOOR_Y = -1.25;
const vec3  SUN = vec3(0.49, 0.784, 0.381);

mat2 rot2(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

/* ---------- noise ---------- */
float hash13(vec3 p3){
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec3 x){
  vec3 i = floor(x), f = fract(x);
  f = f*f*(3.0 - 2.0*f);
  float n000 = hash13(i + vec3(0.0,0.0,0.0));
  float n100 = hash13(i + vec3(1.0,0.0,0.0));
  float n010 = hash13(i + vec3(0.0,1.0,0.0));
  float n110 = hash13(i + vec3(1.0,1.0,0.0));
  float n001 = hash13(i + vec3(0.0,0.0,1.0));
  float n101 = hash13(i + vec3(1.0,0.0,1.0));
  float n011 = hash13(i + vec3(0.0,1.0,1.0));
  float n111 = hash13(i + vec3(1.0,1.0,1.0));
  return mix(
    mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y),
    mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y), f.z);
}
float fbm(vec3 p){
  float a = 0.5, s = 0.0;
  for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + 7.1; a *= 0.5; }
  return s;
}

/* ---------- signed distance field ---------- */
float sdBlob(vec3 p){
  vec3 q = p;
  q.xz *= rot2(0.35);
  float t = uTime * 0.32;
  float n1 = fbm(q*1.55 + vec3(0.0,  t,        -t*0.55));
  float n2 = fbm(q*3.30 + vec3(-t*1.2, 0.0,     t*0.80));
  float n3 = sin(q.x*2.2 + t)*sin(q.y*2.4 - t*1.3)*sin(q.z*2.0 + t*0.7);
  float d = length(q) - 1.0;
  d -= 0.085*(n1 - 0.45) + 0.045*(n2 - 0.45) + 0.055*n3;
  return d;
}
float sdTorus(vec3 p, vec2 t){
  vec2 q = vec2(length(p.xz) - t.x, p.y);
  return length(q) - t.y;
}

float map(vec3 p, out int id){
  float t = uTime;
  float d = sdBlob(p);
  id = 1;

  // mercury droplets resting on the floor
  for(int i=0;i<3;i++){
    float fi = float(i);
    float an = fi*2.30 + 1.0;
    vec3 c = vec3(cos(an)*1.55, FLOOR_Y + 0.155, sin(an)*1.55);
    float dd = length(p - c) - 0.15 - 0.018*sin(t*1.7 + fi*2.0);
    if(dd < d){ d = dd; id = 1; }
  }

  // glass torus, tilted and slowly turning
  vec3 q = p;
  q.yz *= rot2(0.58);
  q.xz *= rot2(t*0.17);
  float g = sdTorus(q, vec2(1.82, 0.235));
  if(g < d){ d = g; id = 2; }

  // glass droplets orbiting
  for(int i=0;i<3;i++){
    float fi = float(i);
    float an = t*0.42 + fi*2.0944;
    vec3 c = vec3(cos(an)*2.55, 0.95 + 0.55*sin(t*0.66 + fi*1.7), sin(an)*2.55);
    float dd = length(p - c) - 0.155;
    if(dd < d){ d = dd; id = 2; }
  }

  float f = p.y - FLOOR_Y;
  if(f < d){ d = f; id = 3; }
  return d;
}

vec3 calcNormal(vec3 p){
  vec2 e = vec2(0.0018, 0.0);
  int id;
  return normalize(vec3(
    map(p + e.xyy, id) - map(p - e.xyy, id),
    map(p + e.yxy, id) - map(p - e.yxy, id),
    map(p + e.yyx, id) - map(p - e.yyx, id)));
}

struct Hit { float t; int id; vec3 n; vec3 p; };

Hit march(vec3 ro, vec3 rd){
  Hit h; h.t = 0.0; h.id = 0; h.n = vec3(0.0); h.p = ro;
  float t = 0.0;
  for(int i=0;i<110;i++){
    vec3 p = ro + rd*t;
    int id;
    float d = abs(map(p, id));
    if(d < max(0.0009, 0.0013*t)){
      h.t = t; h.id = id; h.p = p; h.n = calcNormal(p);
      return h;
    }
    t += d;
    if(t > 60.0) break;
  }
  return h;
}

float shadow(vec3 ro, vec3 rd, float mint, float maxt){
  float res = 1.0, t = mint;
  for(int i=0;i<34;i++){
    vec3 p = ro + rd*t;
    int id;
    float d = map(p, id);
    res = min(res, 7.0*d/max(t, 0.02));
    t += clamp(d, 0.012, 0.5);
    if(t > maxt || res < 0.004) break;
  }
  return clamp(res, 0.0, 1.0);
}

float ao(vec3 p, vec3 n){
  float o = 0.0, sc = 1.0;
  for(int i=1;i<=5;i++){
    float fi = float(i);
    vec3 q = p + n*(0.045*fi);
    int id;
    float d = map(q, id);
    o += (0.045*fi - d)*sc;
    sc *= 0.82;
  }
  return clamp(1.0 - 1.1*o, 0.0, 1.0);
}

/* ---------- studio environment ---------- */
vec3 envColor(vec3 rd){
  float y = rd.y;
  vec3 sky = mix(vec3(0.014,0.019,0.032), vec3(0.055,0.082,0.145), smoothstep(-0.55,0.65,y));
  sky = mix(sky, vec3(0.085,0.092,0.108), smoothstep(0.02,-0.7,y));

  float az = atan(rd.z, rd.x);

  // vertical studio strips
  float s1 = smoothstep(0.30, 0.85, cos(az*2.0 - 0.6));
  float s2 = smoothstep(0.45, 0.92, cos(az*3.0 + 1.7));
  float ve = smoothstep(0.62, 0.10, abs(y - 0.18));
  sky += vec3(1.00,0.965,0.94) * s1 * ve * 2.35;
  sky += vec3(0.86,0.93,1.00) * s2 * ve * 1.35;

  // overhead softbox + horizon band
  sky += vec3(1.0,0.99,0.98) * smoothstep(0.80, 0.985, y) * 1.6;
  sky += vec3(0.62,0.60,0.66) * exp(-abs(y + 0.02)*6.0) * 0.30;

  // sun
  float sd = max(dot(rd, SUN), 0.0);
  sky += vec3(1.0,0.93,0.80) * pow(sd, 620.0) * 7.0;
  sky += vec3(1.0,0.90,0.78) * pow(sd, 13.0)  * 0.28;
  return sky;
}

float schlick(float f0, float c){ return f0 + (1.0 - f0)*pow(1.0 - c, 5.0); }

/* ---------- single-path transport ---------- */
vec3 render(vec3 ro, vec3 rd, float iorMul){
  vec3 col = vec3(0.0);
  vec3 thr = vec3(1.0);
  float dist = 0.0, entryT = 0.0;
  float ior = 1.5 * iorMul;
  const vec3 GTINT = vec3(0.90, 0.975, 0.945);

  for(int b=0;b<6;b++){
    Hit h = march(ro, rd);
    if(h.id == 0){ col += thr * envColor(rd); dist += 45.0; break; }

    dist += h.t;
    vec3 n = h.n;
    bool back = dot(n, rd) > 0.0;
    if(back) n = -n;
    vec3 v = -rd;
    vec3 p = h.p + n*0.0022;
    float c = max(dot(n, v), 0.0);

    if(h.id == 1){
      // liquid metal / mercury
      vec3 refl = reflect(rd, n);
      float f = schlick(0.92, c);
      float sh = shadow(p, SUN, 0.02, 26.0);
      float sp = pow(max(dot(refl, SUN), 0.0), 1600.0);
      col += thr * vec3(3.1,2.95,2.75) * sh * sp * 3.2;
      float oc = ao(p, n)*0.5 + 0.5;
      thr *= vec3(0.90,0.93,0.985) * mix(vec3(0.80,0.85,0.95), vec3(1.0), f) * 0.92 * oc;
      ro = p; rd = refl;
    } else if(h.id == 2){
      // glass
      float f = schlick(0.05, c);
      col += thr * f * envColor(reflect(rd, n)) * (back ? 0.55 : 1.0);
      vec3 refr = refract(rd, n, back ? ior : 1.0/ior);
      if(length(refr) < 0.5){
        thr *= vec3(0.985);
        ro = p; rd = reflect(rd, n);
      } else {
        if(back){
          thr *= GTINT * (1.0 - f) * exp(-vec3(0.34,0.11,0.24)*(dist - entryT)*1.15);
        } else {
          thr *= (1.0 - f) * GTINT; entryT = dist;
        }
        ro = p; rd = refr;
      }
    } else {
      // dark glossy floor
      float f = schlick(0.28, c);
      float sh = shadow(p, SUN, 0.02, 26.0);
      float oc = ao(p, n);
      col += thr * vec3(0.085,0.095,0.125) * max(dot(n, SUN), 0.0) * sh * oc;
      thr *= (vec3(0.040,0.045,0.058) + f*vec3(0.13,0.14,0.17)) * oc;
      ro = p; rd = reflect(rd, n);
    }
  }

  // distance haze toward environment
  vec3 haze = envColor(rd);
  col = mix(col, haze, clamp(1.0 - exp(-dist*0.013), 0.0, 0.65));
  return col;
}

void main(){
  vec2 uv = (2.0*gl_FragCoord.xy - uRes + uJitter*2.0) / uRes.y;

  float t = uTime * 0.125;
  vec3 ro = vec3(sin(t)*5.35, 1.62 + 0.42*sin(t*0.71 + 1.0), cos(t)*5.35);
  vec3 ta = vec3(0.0, 0.08, 0.0);
  vec3 fw = normalize(ta - ro);
  vec3 rt = normalize(cross(vec3(0.0,1.0,0.0), fw));
  vec3 up = cross(fw, rt);

  float focal = 2.30;
  vec3 rd = normalize(fw*focal + rt*uv.x + up*uv.y);

  vec3 col = (render(ro, rd, 0.982) + render(ro, rd, 1.0) + render(ro, rd, 1.020)) / 3.0;

  outColor = vec4(col, 1.0);
}
</script>

<script id="fsBright" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uSrc;
in vec2 vUv;
out vec4 o;
void main(){
  vec3 c = texture(uSrc, vUv).rgb;
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  float k = max(l - 0.62, 0.0) / max(l, 1e-4);
  o = vec4(c*k, 1.0);
}
</script>

<script id="fsBlur" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uSrc;
uniform vec2 uDir;
in vec2 vUv;
out vec4 o;
void main(){
  float w[4];
  w[0]=0.1945946; w[1]=0.1216216; w[2]=0.0540540; w[3]=0.0162162;
  vec3 s = texture(uSrc, vUv).rgb * 0.2270270;
  for(int i=1;i<=4;i++){
    vec2 off = uDir*float(i);
    s += texture(uSrc, vUv + off).rgb * w[i-1];
    s += texture(uSrc, vUv - off).rgb * w[i-1];
  }
  o = vec4(s, 1.0);
}
</script>

<script id="fsAccum" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uPrev;
uniform sampler2D uCur;
uniform float uW;
in vec2 vUv;
out vec4 o;
void main(){
  o = vec4(mix(texture(uPrev, vUv).rgb, texture(uCur, vUv).rgb, uW), 1.0);
}
</script>

<script id="fsComp" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float uTime;
in vec2 vUv;
out vec4 o;

vec3 aces(vec3 x){
  return clamp((x*(2.51*x + 0.03)) / (x*(2.43*x + 0.59) + 0.14), 0.0, 1.0);
}
float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx)*0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y)*p3.z);
}

void main(){
  vec2 d = vUv - 0.5;
  float r2 = dot(d, d);

  // subtle chromatic aberration
  vec2 off = d * r2 * 0.075;
  vec3 sc;
  sc.r = texture(uScene, vUv + off).r;
  sc.g = texture(uScene, vUv).g;
  sc.b = texture(uScene, vUv - off).b;

  vec3 bl = texture(uBloom, vUv).rgb;
  bl.r = texture(uBloom, vUv + off*1.6).r;
  bl.b = texture(uBloom, vUv - off*1.6).b;

  vec3 c = sc + bl * 0.62;

  c = aces(c * 1.06);

  // vignette
  c *= mix(1.0, smoothstep(1.35, 0.18, r2*1.7), 0.72);

  // gamma
  c = pow(c, vec3(1.0/2.2));

  // dither / grain
  float g = hash12(gl_FragCoord.xy + fract(uTime)*97.0) - 0.5;
  c += g * 0.014;

  o = vec4(c, 1.0);
}
</script>

<script type="module">
(function(){
  "use strict";

  const canvas = document.getElementById('c');
  const msg = document.getElementById('msg');
  const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false, powerPreference:'high-performance' });
  if(!gl){ msg.hidden = false; return; }

  const HDR = !!gl.getExtension('EXT_color_buffer_float');
  const halfType = HDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
  const internalFmt = HDR ? gl.RGBA16F : gl.RGBA8;

  /* ---------- shader helpers ---------- */
  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      console.error(gl.getShaderInfoLog(s), src);
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }
  function program(vsSrc, fsSrc){
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
      console.error(gl.getProgramInfoLog(p));
      throw new Error(gl.getProgramInfoLog(p));
    }
    const u = new Map();
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for(let i=0;i<n;i++){
      const info = gl.getActiveUniform(p, i);
      u.set(info.name, gl.getUniformLocation(p, info.name));
    }
    return { p, u };
  }
  const src = id => document.getElementById(id).textContent;

  const vs = src('vs');
  const progScene  = program(vs, src('fsScene'));
  const progBright = program(vs, src('fsBright'));
  const progBlur   = program(vs, src('fsBlur'));
  const progAccum  = program(vs, src('fsAccum'));
  const progComp   = program(vs, src('fsComp'));

  /* ---------- fullscreen triangle strip ---------- */
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  function draw(){
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(null);
  }

  /* ---------- render targets ---------- */
  let W = 2, H = 2;
  let sceneT, accumA, accumB, bloomA, bloomB, fboScene, fboAccumA, fboAccumB, fboBloomA, fboBloomB;

  function makeTarget(w, h){
    w = Math.max(1, w|0); h = Math.max(1, h|0);
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFmt, w, h, 0, gl.RGBA, halfType, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb };
  }
  function destroyTarget(t){
    if(!t) return;
    gl.deleteTexture(t.tex);
    gl.deleteFramebuffer(t.fb);
  }

  let renderScale = Math.min(window.devicePixelRatio || 1, 1.3);

  function allocate(){
    const cw = Math.max(1, Math.round(canvas.clientWidth));
    const ch = Math.max(1, Math.round(canvas.clientHeight));
    const w = Math.max(320, Math.round(cw * renderScale));
    const h = Math.max(200, Math.round(ch * renderScale));
    if(w === W && h === H && sceneT) return;

    destroyTarget(sceneT); destroyTarget(accumA); destroyTarget(accumB);
    destroyTarget(bloomA); destroyTarget(bloomB);

    canvas.width = cw; canvas.height = ch;
    W = w; H = h;

    sceneT = makeTarget(W, H);
    accumA = makeTarget(W, H);
    accumB = makeTarget(W, H);
    bloomA = makeTarget(W>>1, H>>1);
    bloomB = makeTarget(W>>1, H>>1);
    fboScene = sceneT.fb; fboAccumA = accumA.fb; fboAccumB = accumB.fb;
    fboBloomA = bloomA.fb; fboBloomB = bloomB.fb;

    // clear accumulation
    for(const t of [accumA, accumB]){
      gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
      gl.clearColor(0,0,0,1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    frame = 0;
    srcIsA = true;
  }

  function bind(target){
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
    gl.viewport(0, 0, target ? target.w : canvas.width, target ? target.h : canvas.height);
  }
  // give targets a w/h for viewport convenience
  function tag(t, w, h){ t.w = w; t.h = h; return t; }

  // re-tag after allocation
  function tagAll(){
    tag(sceneT, W, H); tag(accumA, W, H); tag(accumB, W, H);
    tag(bloomA, W>>1, H>>1); tag(bloomB, W>>1, H>>1);
  }
  const _alloc = allocate;
  allocate = function(){ _alloc(); tagAll(); };

  const halton = (i, b) => { let f = 1, r = 0; while(i > 0){ f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };

  let frame = 0;
  let srcIsA = true;
  let last = performance.now() / 1000;
  let ema = 1/60, qualityTimer = 0;
  const start = last;

  function resize(){
    allocate();
  }
  window.addEventListener('resize', resize);
  allocate();

  function render(now){
    const t = now / 1000;
    let dt = t - last; last = t;
    if(dt > 0.1) dt = 0.1;
    ema = ema * 0.9 + dt * 0.1;

    // adaptive internal resolution to keep the piece fluid
    qualityTimer += dt;
    if(qualityTimer > 0.7){
      qualityTimer = 0;
      let want = renderScale;
      if(ema > 0.042) want = Math.max(0.55, renderScale - 0.12);
      else if(ema < 0.020) want = Math.min(Math.min(window.devicePixelRatio || 1, 1.35), renderScale + 0.08);
      if(Math.abs(want - renderScale) > 0.03){
        renderScale = want;
        allocate();
      }
    }

    const animT = t - start;
    const jx = halton(frame % 8 + 1, 2) - 0.5;
    const jy = halton(frame % 8 + 1, 3) - 0.5;

    // 1. scene -> HDR
    bind(tag(sceneT, W, H));
    gl.useProgram(progScene.p);
    gl.uniform2f(progScene.u.get('uRes'), W, H);
    gl.uniform1f(progScene.u.get('uTime'), animT);
    gl.uniform2f(progScene.u.get('uJitter'), jx, jy);
    draw();

    // 2. accumulate (ping-pong)
    const prev = srcIsA ? accumA : accumB;
    const next = srcIsA ? accumB : accumA;
    const w = frame === 0 ? 1.0 : 0.28;
    bind(tag(next, W, H));
    gl.useProgram(progAccum.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, prev.tex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
    gl.uniform1i(progAccum.u.get('uPrev'), 0);
    gl.uniform1i(progAccum.u.get('uCur'), 1);
    gl.uniform1f(progAccum.u.get('uW'), w);
    draw();
    const cur = next;
    srcIsA = !srcIsA;

    // 3. bright pass -> half res
    bind(tag(bloomA, W>>1, H>>1));
    gl.useProgram(progBright.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, cur.tex);
    gl.uniform1i(progBright.u.get('uSrc'), 0);
    draw();

    // 4. blur h -> B
    bind(tag(bloomB, W>>1, H>>1));
    gl.useProgram(progBlur.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
    gl.uniform1i(progBlur.u.get('uSrc'), 0);
    gl.uniform2f(progBlur.u.get('uDir'), 1.0 / (W>>1), 0);
    draw();

    // 5. blur v -> A
    bind(tag(bloomA, W>>1, H>>1));
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomB.tex);
    gl.uniform2f(progBlur.u.get('uDir'), 0, 1.0 / (H>>1));
    draw();

    // 6. composite -> screen
    bind(null);
    gl.useProgram(progComp.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, cur.tex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
    gl.uniform1i(progComp.u.get('uScene'), 0);
    gl.uniform1i(progComp.u.get('uBloom'), 1);
    gl.uniform1f(progComp.u.get('uTime'), animT);
    draw();

    frame++;
    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
