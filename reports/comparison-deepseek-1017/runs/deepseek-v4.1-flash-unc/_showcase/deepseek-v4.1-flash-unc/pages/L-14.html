<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Water surface</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ---------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// ---------------------------------------------------------------------------
// Camera: at (0, 0.9, 0), pitched down. tan(pitch) = 0.1185
// horizon ends up at exactly 0.357 of the frame height.
// ---------------------------------------------------------------------------
const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 1000);
camera.position.set(0, 0.9, 0);
camera.lookAt(new THREE.Vector3(0, 0.9 - 0.1185, -1));
camera.updateMatrixWorld();

// A camera-oriented group: children local positions are in camera space,
// but the group lives in the scene so it is actually rendered.
const camSpace = new THREE.Group();
camSpace.position.copy(camera.position);
camSpace.quaternion.copy(camera.quaternion);
scene.add(camSpace);

const TAN_HALF_FOV = Math.tan(THREE.MathUtils.degToRad(45 / 2)); // 0.41421
const FRAME_FRAC_HORIZON = 0.357;                                // from top
const HORIZON_NDC = 1 - 2 * FRAME_FRAC_HORIZON;                  // 0.286

// ---------------------------------------------------------------------------
// Sky: plane at distance 500 in front of the camera, spanning from the horizon
// up to the top edge of the frame. Vertical gradient (bottom -> top):
// #ffb066 -> #8c5f86 -> #14224f, brightness strictly decreasing upward.
// ---------------------------------------------------------------------------
const SKY_DIST = 500.0;
const skyHalfH = SKY_DIST * TAN_HALF_FOV;                 // world half frame height
const skyBottomY = HORIZON_NDC * skyHalfH;               // at the horizon
const skyHeight = skyHalfH - skyBottomY;
const skyCenterY = (skyBottomY + skyHalfH) / 2;
const skyWidth = skyHalfH * (1920 / 1080) * 1.2;         // cover the wide frame

const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    cHorizon: { value: new THREE.Color('#ffb066') },
    cMid:     { value: new THREE.Color('#8c5f86') },
    cTop:     { value: new THREE.Color('#14224f') }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 cHorizon;
    uniform vec3 cMid;
    uniform vec3 cTop;
    varying vec2 vUv;
    void main() {
      float t = vUv.y; // 0 at horizon, 1 at top of frame
      vec3 col;
      if (t < 0.12)      col = cHorizon;
      else if (t < 0.42) col = mix(cHorizon, cMid, (t - 0.12) / 0.30);
      else if (t < 0.52) col = cMid;
      else if (t < 0.72) col = mix(cMid, cTop, (t - 0.52) / 0.20);
      else               col = cTop;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});
const sky = new THREE.Mesh(new THREE.PlaneGeometry(skyWidth, skyHeight), skyMat);
sky.position.set(0, skyCenterY, -SKY_DIST);
sky.frustumCulled = false;
camSpace.add(sky);

// ---------------------------------------------------------------------------
// Sun: basic-material disk. radius = 0.05 frame height, centered horizontally,
// center 0.012 frame height above the horizon. Water slices its lower part.
// ---------------------------------------------------------------------------
const SUN_DIST = 300.0;
const sunHalfH = SUN_DIST * TAN_HALF_FOV;
const sunFrameH = 2 * sunHalfH;
const sunRadius = 0.05 * sunFrameH;
const sunHorizonY = HORIZON_NDC * sunHalfH;
const sunCenterY = sunHorizonY + 0.012 * sunFrameH;
const sun = new THREE.Mesh(
  new THREE.CircleGeometry(sunRadius, 96),
  new THREE.MeshBasicMaterial({ color: '#ffe6b0' })
);
sun.position.set(0, sunCenterY, -SUN_DIST);
sun.frustumCulled = false;
camSpace.add(sun);

// Direction from the water surface toward the sun (used for the specular).
const SUN_DIR = new THREE.Vector3(0, 0.05, -1).normalize();

// ---------------------------------------------------------------------------
// Water: plane 300 x 400, 180 x 200 subdivisions, horizontal, from z = +0.4 to
// z = -399.6. Three sine waves displace the surface in the vertex shader and
// the normal is recomputed from the analytic derivatives.
// ---------------------------------------------------------------------------
const waterGeo = new THREE.PlaneGeometry(300, 400.0, 180, 200);
waterGeo.rotateX(-Math.PI / 2);

const waterMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:    { value: 0.0 },
    uDeep:    { value: new THREE.Color('#0b2740') }, // dark water, bottom of frame
    uShallow: { value: new THREE.Color('#2f86b0') }, // light water near the horizon
    uWarm:    { value: new THREE.Color('#ffe6b0') }, // warm sun reflection
    uSunDir:  { value: SUN_DIR.clone() }
  },
  vertexShader: `
    uniform float uTime;
    varying vec3 vN;
    varying vec3 vWorld;

    // wave 1: d=(0.924,0.383), k=0.38, w=0.90, a=0.26*1.080
    // wave 2: d=(-0.643,0.766), k=0.72, w=1.50, a=0.16*1.080
    // wave 3: d=(0.309,-0.951), k=1.25, w=2.40, a=0.09*1.080
    const vec2  D1 = vec2( 0.924,  0.383);
    const vec2  D2 = vec2(-0.643,  0.766);
    const vec2  D3 = vec2( 0.309, -0.951);
    const float K1 = 0.38, W1 = 0.90, A1 = 0.2808;
    const float K2 = 0.72, W2 = 1.50, A2 = 0.1728;
    const float K3 = 1.25, W3 = 2.40, A3 = 0.0972;
    const float P1 = 2.282 + 1.0 * 1.7;
    const float P2 = 2.282 + 2.0 * 1.7;
    const float P3 = 2.282 + 3.0 * 1.7;

    void main() {
      vec2 p = position.xz;

      float arg1 = K1 * dot(D1, p) - W1 * uTime + P1;
      float arg2 = K2 * dot(D2, p) - W2 * uTime + P2;
      float arg3 = K3 * dot(D3, p) - W3 * uTime + P3;

      float h = A1 * sin(arg1) + A2 * sin(arg2) + A3 * sin(arg3);

      float dhdx = A1 * K1 * D1.x * cos(arg1)
                 + A2 * K2 * D2.x * cos(arg2)
                 + A3 * K3 * D3.x * cos(arg3);
      float dhdz = A1 * K1 * D1.y * cos(arg1)
                 + A2 * K2 * D2.y * cos(arg2)
                 + A3 * K3 * D3.y * cos(arg3);

      vec3 N = normalize(vec3(-dhdx, 1.0, -dhdz));

      vec4 worldPos = modelMatrix * vec4(position.x, h, position.z, 1.0);
      vWorld = worldPos.xyz;
      vN = N;

      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `,
  fragmentShader: `
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform vec3 uWarm;
    uniform vec3 uSunDir;
    varying vec3 vN;
    varying vec3 vWorld;

    void main() {
      vec3 N = normalize(vN);
      vec3 V = normalize(cameraPosition - vWorld);

      // Fresnel: grazing view (near the horizon) is lighter water.
      float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 4.0);
      float fshallow = smoothstep(0.14, 0.45, fres);
      vec3 base = mix(uDeep, uShallow, fshallow);

      // Specular reflection of the low sun.
      vec3 L = normalize(uSunDir);
      vec3 R = reflect(-L, N);
      float spec = pow(max(dot(R, V), 0.0), 32.0);

      // Warm reflection trail along x = 0, running from the shore to the horizon.
      float xs = vWorld.x / (0.25 * max(-vWorld.z, 1.0) + 0.5);
      float path = exp(-(xs * xs) / 0.85) * smoothstep(-2.0, -25.0, vWorld.z);

      vec3 col = mix(base, uWarm, path) + uWarm * spec * 0.012;

      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});

const water = new THREE.Mesh(waterGeo, waterMat);
water.position.z = -199.6; // spans z = +0.4 .. -399.6
water.frustumCulled = false;
scene.add(water);

// ---------------------------------------------------------------------------
// Time / probing
// ---------------------------------------------------------------------------
let t = 0;

window.__probe = function () {
  return {
    t: t.toFixed(4),
    objects: ['water', 'sky', 'sun'],
    horizon: 0.357,
    wave: t.toFixed(4)
  };
};

window.__step = function (dt) {
  t += dt;
  waterMat.uniforms.uTime.value = t;
  renderer.render(scene, camera);
  return window.__probe();
};

// First frame = start of the scene.
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
