<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>synthwave grid</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// Raw colors, no color-management shifts: pixels equal given hex values.
THREE.ColorManagement.enabled = false;

const FRAME_W = 1920;
const FRAME_H = 1080;

// Horizontal half-height of the frame at distance 30 (given by the task).
const H30 = 24.853;
const SLOPE = H30 / 30.0;          // half-height per unit of depth
const FOV = 2.0 * Math.atan(SLOPE) * 180.0 / Math.PI;

const HORIZON_FRAC = 0.55;         // horizon at exactly 55% of frame height
const SUN_START_FRAC = 0.388;      // sun center at 38.8% of frame height
const SUN_END_FRAC = 0.52;         // sun stops at 52%
const SUN_Z = -29.5;
const SUN_R = 4.971;               // 0.1 * frame height at that depth
const SKY_Z = -30.0;
const GROUND_Y = -2.485;           // exactly under the horizon line

const SUN_H = -SUN_Z * SLOPE;      // half-height of frame at sun depth

function fracToY(frac, halfH) { return (0.5 - frac) * 2.0 * halfH; }
function yToFrac(y, halfH) { return 0.5 - y / (2.0 * halfH); }

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(FRAME_W, FRAME_H, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, FRAME_W / FRAME_H, 0.1, 1000);
camera.position.set(0, 0, 0);
camera.lookAt(0, 0, -1);

const C = {
  skyTop:   new THREE.Vector3(0x1b / 255, 0x0f / 255, 0x3c / 255),
  skyBot:   new THREE.Vector3(0x19 / 255, 0xe0 / 255, 0xe8 / 255),
  gndNear:  new THREE.Vector3(0x12 / 255, 0x0a / 255, 0x2a / 255),
  gndFar:   new THREE.Vector3(0x1b / 255, 0x0f / 255, 0x3c / 255),
  grid:     new THREE.Vector3(0xff / 255, 0x2f / 255, 0xb0 / 255),
  sunTop:   new THREE.Vector3(0xff / 255, 0xb0 / 255, 0x3a / 255),
  sunBot:   new THREE.Vector3(0xff / 255, 0xb0 / 255, 0x3a / 255).multiplyScalar(0.42),
};

// ---------------------------------------------------------------- sky
const skyH = 1.1 * H30;                      // top edge = frame top, bottom = horizon
const skyCY = GROUND_Y + skyH / 2;
const skyGeo = new THREE.PlaneGeometry(400, skyH);
const skyMat = new THREE.ShaderMaterial({
  uniforms: { uTop: { value: C.skyTop }, uBot: { value: C.skyBot } },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 uTop;
    uniform vec3 uBot;
    varying vec2 vUv;
    void main() {
      float k = smoothstep(0.0, 0.32, vUv.y);
      vec3 col = mix(uBot, uTop, k);
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthWrite: true,
});
const sky = new THREE.Mesh(skyGeo, skyMat);
sky.name = 'sky';
sky.position.set(0, skyCY, SKY_Z);
scene.add(sky);

// ---------------------------------------------------------------- ground
const groundGeo = new THREE.PlaneGeometry(600, 300, 1, 1);
groundGeo.rotateX(-Math.PI / 2);
const groundMat = new THREE.ShaderMaterial({
  uniforms: {
    uOffset: { value: 0.0 },
    uNear: { value: C.gndNear },
    uFar: { value: C.gndFar },
    uGrid: { value: C.grid },
  },
  vertexShader: `
    varying vec3 vWorld;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform float uOffset;
    uniform vec3 uNear;
    uniform vec3 uFar;
    uniform vec3 uGrid;
    varying vec3 vWorld;

    void main() {
      float depth = max(0.0, -vWorld.z);
      float k = clamp(depth / 120.0, 0.0, 1.0);
      vec3 base = mix(uNear, uFar, k);

      // grid cells 1.6 units, pattern runs toward the camera
      float pz = (vWorld.z + uOffset) / 1.6;
      float px = vWorld.x / 1.6;
      float dz = abs(fract(pz - 0.5) - 0.5) * 1.6;
      float dx = abs(fract(px - 0.5) - 0.5) * 1.6;

      // world line width grows with depth, never thinner than a pixel
      float w = 0.016 + depth * 0.010;
      w = max(w, fwidth(dz) * 1.3);
      w = max(w, fwidth(dx) * 1.3);

      float lz = 1.0 - smoothstep(0.0, w, dz);
      float lx = 1.0 - smoothstep(0.0, w, dx);
      float line = max(lz, lx);
      float fade = 1.0 - smoothstep(55.0, 118.0, depth);
      line *= fade;

      vec3 col = mix(base, uGrid, line);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.name = 'ground';
ground.position.set(0, GROUND_Y, -120.0);
scene.add(ground);

// ---------------------------------------------------------------- sun
const sunGeo = new THREE.CircleGeometry(SUN_R, 128);
const sunMat = new THREE.ShaderMaterial({
  uniforms: { uTop: { value: C.sunTop }, uBot: { value: C.sunBot } },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 uTop;
    uniform vec3 uBot;
    varying vec2 vUv;
    void main() {
      // lower two thirds carry horizontal cut-out stripes
      if (vUv.y < 0.6667) {
        float s = fract(vUv.y * 9.0);
        if (s < 0.42) discard;
      }
      vec3 col = uTop * mix(0.68, 1.0, smoothstep(0.0, 0.55, vUv.y));
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const sun = new THREE.Mesh(sunGeo, sunMat);
sun.name = 'sun';
const sunY0 = fracToY(SUN_START_FRAC, SUN_H);
const sunYEnd = fracToY(SUN_END_FRAC, SUN_H);
sun.position.set(0, sunY0, SUN_Z);
scene.add(sun);

// ---------------------------------------------------------------- state
let uOffset = 0.0;
let t = 0.0;
let sunY = sunY0;

function render() {
  groundMat.uniforms.uOffset.value = uOffset;
  sun.position.y = sunY;
  renderer.render(scene, camera);
}

window.__probe = function () {
  return {
    t: +t.toFixed(4),
    objects: ['sky', 'ground', 'sun'],
    sun: [0.5, +yToFrac(sunY, SUN_H).toFixed(4)],
    grid_z: uOffset,
  };
};

window.__step = function (dt) {
  t += dt;
  uOffset = (uOffset + 0.90 * dt) % 1.6;
  sunY -= 0.025 * 2.0 * SUN_H * dt;
  if (sunY < sunYEnd) sunY = sunYEnd;
  render();
  return window.__probe();
};

render();
window.__ready = true;
</script>
</body>
</html>
