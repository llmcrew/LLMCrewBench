<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Mandelbrot</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

const W = 1920, H = 1080;

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Камера ровно по заданию: единичный ортокадр, квадрат 2x2 заполняет его целиком.
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
camera.position.set(0, 0, 1);
camera.lookAt(0, 0, 0);

const vertexShader = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = position.xy;               // диапазон [-1, 1] по обеим осям
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const fragmentShader = /* glsl */`
  precision highp float;

  varying vec2 vUv;

  uniform float uZoom;               // стартовый зум uZoom = 1.500

  // --- параметры области и итераций (числа дословно) ---
  const vec2  C_CENTER = vec2(-0.600, 0.000); // центр области, ровно на вещественной оси
  const float ZOOM0    = 1.500;
  const float HALF_H   = 1.2;                 // полувысота кадра-области
  const float ASPECT   = 4.0 / 3.0;           // кадр 1920x1080
  const float MAX_ITER = 160.0;               // максимум итераций
  const float ESCAPE_R = 2.0;                 // радиус выхода

  // --- палитра (по тону) ---
  const vec3 C0 = vec3(0.10588, 0.07059, 0.25098); // #1b1240
  const vec3 C1 = vec3(0.09412, 0.71765, 0.67451); // #18b7ac
  const vec3 C2 = vec3(0.72157, 0.94902, 0.29020); // #b8f24a
  const vec3 C3 = vec3(1.00000, 0.37255, 0.49412); // #ff5f7e

  void main() {
    float halfH = HALF_H / uZoom;
    float halfW = halfH * ASPECT;

    vec2 c = vec2(vUv.x * halfW, vUv.y * halfH) + C_CENTER;

    vec2 z = vec2(0.0);
    float it = 0.0;
    float escaped = 0.0;

    for (int i = 0; i < 160; i++) {
      z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
      if (dot(z, z) > ESCAPE_R * ESCAPE_R) {
        escaped = 1.0;
        it = float(i);
        break;
      }
    }

    float t = (escaped > 0.5)
      ? log(it + 1.0) / log(MAX_ITER + 1.0)   // log(161)
      : 1.0;                                  // тело множества

    vec3 col = C0;
    col = mix(col, C1, smoothstep(0.30, 0.40, t));
    col = mix(col, C0, smoothstep(0.55, 0.62, t));
    col = mix(col, C2, smoothstep(0.70, 0.76, t));
    col = mix(col, C3, smoothstep(0.90, 0.96, t));

    gl_FragColor = vec4(col, 1.0);
  }
`;

const ZOOM0 = 1.500;

const material = new THREE.ShaderMaterial({
  uniforms: { uZoom: { value: ZOOM0 } },
  vertexShader,
  fragmentShader,
  depthTest: false,
  depthWrite: false,
});

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
quad.name = 'mandelbrot-quad';
scene.add(quad);

let sceneTime = 0;
let zoom = ZOOM0;

function draw() {
  renderer.render(scene, camera);
}

function probe() {
  return {
    t: Number(sceneTime.toFixed(4)),
    objects: ['mandelbrot-quad'],
    zoom: Number(zoom.toFixed(4)),
  };
}

window.__step = function (dt) {
  sceneTime += dt;
  zoom = ZOOM0 * Math.exp(0.350 * sceneTime);
  material.uniforms.uZoom.value = zoom;
  draw();
  return probe();
};

window.__probe = probe;

// первая отрисовка (нулевой шаг — начало сцены)
draw();
window.__ready = true;
</script>
</body>
</html>
