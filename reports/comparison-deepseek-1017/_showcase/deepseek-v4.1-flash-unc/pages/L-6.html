<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Галактика из частиц</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ------------------------------------------------------------------ *
 * Детерминированный ЛЦГ (никакого Math.random)
 * ------------------------------------------------------------------ */
let S0 = 800660;
let lcgState = S0;
function rnd() {
  lcgState = (1664525 * lcgState + 1013904223) % 4294967296;
  return lcgState / 4294967296;
}

/* ------------------------------------------------------------------ *
 * Сцена, камера, рендерер
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1647);

const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 200);
camera.position.set(0, 0, 10.0);
camera.lookAt(0, 0, 0);

/* Полувысота кадра на дистанции камеры ≈ 4.142 единицы */
const halfH = camera.position.z * Math.tan((45 / 2) * Math.PI / 180);
const R = 0.44 * halfH;                 // радиус галактики
const PAL = {
  core: 0xffbf00,
  arm:  0xff0080,
  edge: 0x0cb7f0
};

/* ------------------------------------------------------------------ *
 * Ночное небо: мягкий радиальный градиент на канве
 * ------------------------------------------------------------------ */
function makeSky() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 256, 0, 256, 256, 360);
  g.addColorStop(0.00, '#2a2352');
  g.addColorStop(0.55, '#221b47');
  g.addColorStop(1.00, '#1d1647');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const geo = new THREE.PlaneGeometry(90, 60);
  const mat = new THREE.MeshBasicMaterial({ map: tex, depthWrite: false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, 0, -50);
  mesh.renderOrder = -10;
  scene.add(mesh);
}
makeSky();

/* ------------------------------------------------------------------ *
 * Хранилище точек галактики (для дифференциального вращения)
 * ------------------------------------------------------------------ */
const groups = {
  core: { color: PAL.core, size: 3.2, name: 'stars_core', pos: [], meta: [] },
  arm:  { color: PAL.arm,  size: 2.8, name: 'stars_arm',  pos: [], meta: [] },
  edge: { color: PAL.edge, size: 2.4, name: 'stars_edge', pos: [], meta: [] }
};
function addPoint(g, r, th, z) {
  g.meta.push({ r, th, z });
}

/* --- 7000 точек: две закрученные ветви ----------------------------- */
const N_ARM = 7000;
for (let i = 0; i < N_ARM; i++) {
  const u = rnd();
  const v = rnd();
  const w = rnd();
  const g = u + v + w - 1.5;

  const q = 0.14 + 0.86 * Math.pow(u, 0.62);
  const r = R * q;
  const th = 1.60 * 2 * Math.PI * q + Math.PI * Math.floor(v * 2) + g * 0.50 * (1 - 0.45 * q);
  const z = (w - 0.5) * 0.10 * r * (0.4 + q);

  if (q < 0.38) addPoint(groups.core, r, th, z);
  else if (q < 0.70) addPoint(groups.arm, r, th, z);
  else addPoint(groups.edge, r, th, z);
}

/* --- 2500 точек ядра-сгустка --------------------------------------- */
for (let i = 0; i < 2500; i++) {
  const u = rnd();
  const a = 2 * Math.PI * u;
  const r = 0.22 * R * Math.pow(u, 0.55);
  const z = (u - 0.5) * 0.09 * R;
  addPoint(groups.core, r, a, z);
}

/* --- 1500 точек пылевого гало на периферии ------------------------- */
for (let i = 0; i < 1500; i++) {
  const u = rnd();
  const r = R * (0.60 + 0.85 * u);
  const a = 2 * Math.PI * u;
  const z = (u - 0.5) * 0.10 * R;
  addPoint(groups.edge, r, a, z);
}

/* ------------------------------------------------------------------ *
 * Создание THREE.Points по зонам
 * ------------------------------------------------------------------ */
const objects = [];
function buildGroup(g) {
  const n = g.meta.length;
  const arr = new Float32Array(n * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const mat = new THREE.PointsMaterial({
    color: g.color,
    size: g.size,
    sizeAttenuation: false,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  pts.name = g.name;
  pts.frustumCulled = false;
  pts.userData.meta = g.meta;
  pts.userData.arr = arr;
  scene.add(pts);
  objects.push(pts);
  return pts;
}
buildGroup(groups.core);
buildGroup(groups.arm);
buildGroup(groups.edge);

/* ------------------------------------------------------------------ *
 * Добавочное пятно в ядре (core_glow)
 * ------------------------------------------------------------------ */
function makeGlow() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0.00, 'rgba(255,240,200,1.00)');
  g.addColorStop(0.18, 'rgba(255,190,70,0.85)');
  g.addColorStop(0.42, 'rgba(255,120,120,0.38)');
  g.addColorStop(0.70, 'rgba(12,183,240,0.16)');
  g.addColorStop(1.00, 'rgba(0,0,0,0.00)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const size = 0.55 * R * 2.0;
  const geo = new THREE.PlaneGeometry(size, size);
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'core_glow';
  mesh.position.set(0, 0, 0);
  mesh.renderOrder = 5;
  scene.add(mesh);
  return mesh;
}
const coreGlow = makeGlow();

/* ------------------------------------------------------------------ *
 * Дифференциальное вращение
 * ------------------------------------------------------------------ */
let t = 0;
let spin = 0;

function updatePositions() {
  for (const pts of objects) {
    const meta = pts.userData.meta;
    const arr = pts.userData.arr;
    for (let i = 0; i < meta.length; i++) {
      const m = meta[i];
      const ang = m.th + t * 0.55 / (0.25 + m.r / R);
      const ca = Math.cos(ang), sa = Math.sin(ang);
      arr[i * 3 + 0] = m.r * ca;
      arr[i * 3 + 1] = m.r * sa;
      arr[i * 3 + 2] = m.z;
    }
    pts.geometry.attributes.position.needsUpdate = true;
  }
}

/* ------------------------------------------------------------------ *
 * Проба
 * ------------------------------------------------------------------ */
function ringCounts() {
  const edges = [0.25 * R, 0.5 * R, 0.75 * R];
  const rings = [0, 0, 0, 0];
  for (const pts of objects) {
    for (const m of pts.userData.meta) {
      let z = 3;
      if (m.r < edges[0]) z = 0;
      else if (m.r < edges[1]) z = 1;
      else if (m.r < edges[2]) z = 2;
      rings[z]++;
    }
  }
  return rings;
}

window.__probe = function () {
  return {
    t: Number(t.toFixed(4)),
    spin: Number(spin.toFixed(4)),
    objects: objects.map(o => o.name),
    rings: ringCounts()
  };
};

window.__step = function (dt) {
  t += dt;
  spin += 0.55 * dt;
  updatePositions();
  renderer.render(scene, camera);
  return window.__probe();
};

/* ------------------------------------------------------------------ *
 * Первый кадр
 * ------------------------------------------------------------------ */
updatePositions();
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
