<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Greenhouse Station</title>

        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }

<script src='../../../_vendor/three.global.js'></script>

<body>
    <script type="module">
        const THREE = window.THREE;

        // LCG Setup
        let lcg = 160488;
        function rnd() {
            lcg = (lcg * 1103515245 + 12345) % 2147483648;
            return lcg / 2147483648;
        }

        // Scene Setup
        const scene = new THREE.Scene();
        // Orthographic Camera to match frame coordinates (u, v)
        // Frame 800x600. Aspect 4/3.
        // Frustum: x:-0.5..0.5, y:-0.375..0.375 matches u:0..1, v:0..1
        const frustumHeight = 0.75;
        const frustumWidth = 1.0;
        const camera = new THREE.OrthographicCamera(
            -frustumWidth / 2, frustumWidth / 2,
            frustumHeight / 2, -frustumHeight / 2,
            0.1, 100
        );
        camera.position.set(0, 0, 4);
        camera.lookAt(0, 0, -1);

        const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(800, 600, false);
        document.body.appendChild(renderer.domElement);

        // Helper to map u,v to x,y
        function uvToWorld(u, v) {
            return {
                x: (u - 0.5) * frustumWidth,
                y: (0.5 - v) * frustumHeight
            };
        }

        // Colors
        const C_GLASS = 0x123038;
        const C_LEAF = 0x7fd054;
        const C_LAMP = 0xffc06a;
        const C_METEOR = 0xa8c8dc;

        const objects = [];

        // 1. Dome Back
        const domeBackGeo = new THREE.PlaneGeometry(0.71, 0.72);
        const domeBackMat = new THREE.MeshBasicMaterial({ color: C_GLASS, opacity: 0.85, transparent: true });
        const domeBack = new THREE.Mesh(domeBackGeo, domeBackMat);
        domeBack.position.z = -14.8;
        scene.add(domeBack);
        objects.push('dome_back');

        // 2. Side Panels
        const sidePanelGeo = new THREE.PlaneGeometry(0.2, 0.75);
        const sidePanelMat = new THREE.MeshBasicMaterial({ color: C_GLASS, side: THREE.DoubleSide });
        
        const pos1 = uvToWorld(0.16, 0.5);
        const panel1 = new THREE.Mesh(sidePanelGeo, sidePanelMat);
        panel1.position.set(pos1.x, pos1.y, -12);
        panel1.rotation.y = 0.6;
        scene.add(panel1);
        objects.push('side_panel_1');

        const pos2 = uvToWorld(0.84, 0.5);
        const panel2 = new THREE.Mesh(sidePanelGeo, sidePanelMat);
        panel2.position.set(pos2.x, pos2.y, -12);
        panel2.rotation.y = -0.6;
        scene.add(panel2);
        objects.push('side_panel_2');

        // 3. Floor
        // From 62% height down. v=0.62 to v=1.0.
        const floorYStart = uvToWorld(0, 0.62).y; // -0.09
        const floorYEnd = -frustumHeight / 2; // -0.375
        const floorHeight = floorYStart - floorYEnd; // 0.285
        
        const floorGeo = new THREE.PlaneGeometry(1.0, floorHeight);
        const floorMat = new THREE.MeshBasicMaterial({ color: C_GLASS });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.set(0, floorYStart - floorHeight/2, -8);
        scene.add(floor);
        objects.push('floor');

        // Floor Rim (Warm)
        const rimGeo = new THREE.PlaneGeometry(1.0, 0.02);
        const rimMat = new THREE.MeshBasicMaterial({ color: C_LAMP });
        const rim = new THREE.Mesh(rimGeo, rimMat);
        rim.position.set(0, floorYStart, -7.9);
        scene.add(rim);
        objects.push('floor_rim');

        // 4. Ribs
        const ribGeo = new THREE.PlaneGeometry(0.012, 1.0);
        const ribMat = new THREE.MeshBasicMaterial({ color: 0x0a1a20 });
        
        const rib1 = new THREE.Mesh(ribGeo, ribMat);
        rib1.rotation.z = Math.PI / 4;
        rib1.position.z = -14.7;
        scene.add(rib1);
        objects.push('rib_1');

        const rib2 = new THREE.Mesh(ribGeo, ribMat);
        rib2.rotation.z = -Math.PI / 4;
        rib2.position.z = -14.7;
        scene.add(rib2);
        objects.push('rib_2');
        
        const rib3 = new THREE.Mesh(ribGeo, ribMat);
        rib3.rotation.z = Math.PI / 2;
        rib3.scale.x = 0.5;
        rib3.position.z = -14.7;
        scene.add(rib3);
        objects.push('rib_3');

        const rib4 = new THREE.Mesh(ribGeo, ribMat);
        rib4.rotation.z = 0;
        rib4.scale.x = 0.5;
        rib4.position.z = -14.7;
        scene.add(rib4);
        objects.push('rib_4');

        // 5. Lamps
        const lampGeo = new THREE.PlaneGeometry(0.09, 0.0525);
        const lampMat = new THREE.MeshBasicMaterial({ color: C_LAMP, opacity: 0.75, transparent: true });
        
        const lampUs = [0.28, 0.39, 0.50, 0.61, 0.72];
        const lampY = uvToWorld(0, 0.1).y;
        
        lampUs.forEach((u, i) => {
            const lamp = new THREE.Mesh(lampGeo, lampMat);
            const pos = uvToWorld(u, 0.1);
            lamp.position.set(pos.x, lampY, -10);
            scene.add(lamp);
            objects.push(`lamp_${i}`);
        });

        // 6. Plants
        const plantUs = [0.12, 0.30, 0.68, 0.86];
        
        plantUs.forEach((u, i) => {
            const z = -4 - rnd() * 5;
            const hFrame = 0.30 + rnd() * 0.25;
            const hWorld = hFrame * frustumHeight;
            
            const baseV = 0.7; 
            const pos = uvToWorld(u, baseV);
            const posX = pos.x;
            const posY = pos.y;

            const trunkGeo = new THREE.CylinderGeometry(0.02, 0.02, hWorld * 0.4, 8);
            const trunkMat = new THREE.MeshBasicMaterial({ color: C_GLASS });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(posX, posY + hWorld * 0.2, z);
            scene.add(trunk);
            
            const leafGeo = new THREE.PlaneGeometry(0.1, 0.15);
            const leafMat = new THREE.MeshBasicMaterial({ color: C_LEAF, side: THREE.DoubleSide });
            
            for(let j=0; j<3; j++) {
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                leaf.position.set(posX, posY + hWorld * (0.5 + j*0.15), z);
                leaf.rotation.y = (j / 3) * Math.PI * 2;
                leaf.rotation.x = Math.PI / 4;
                scene.add(leaf);
            }
            objects.push(`plant_${i}`);
        });

        // 7. Meteors
        const meteorCount = 26;
        const meteorGeo = new THREE.BufferGeometry();
        const meteorPositions = new Float32Array(meteorCount * 3);
        const meteorSpeeds = [];

        for(let i=0; i<meteorCount; i++) {
            const x = (rnd() - 0.5) * 2;
            const y = (rnd() - 0.5) * 1;
            meteorPositions[i*3] = x;
            meteorPositions[i*3+1] = y;
            meteorPositions[i*3+2] = -22;

            const speed = 6 + rnd() * 3;
            const angle = -Math.PI/2 + (rnd() - 0.5) * 0.5;
            meteorSpeeds.push({
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                baseSpeed: speed
            });
        }
        meteorGeo.setAttribute('position', new THREE.BufferAttribute(meteorPositions, 3));
        const meteorMat = new THREE.PointsMaterial({ color: C_METEOR, size: 5, sizeAttenuation: false, blending: THREE.AdditiveBlending });
        const meteors = new THREE.Points(meteorGeo, meteorMat);
        scene.add(meteors);
        objects.push('meteors');

        // 8. Drops
        const dropCount = 64;
        const dropGeo = new THREE.BufferGeometry();
        const dropPositions = new Float32Array(dropCount * 3);
        const dropSpeeds = [];

        for(let i=0; i<dropCount; i++) {
            const x = (rnd() - 0.5) * 1.2;
            const y = (rnd() - 0.5) * 1.2;
            dropPositions[i*3] = x;
            dropPositions[i*3+1] = y;
            dropPositions[i*3+2] = -13.5;
            
            dropSpeeds.push(2.00);
        }
        dropGeo.setAttribute('position', new THREE.BufferAttribute(dropPositions, 3));
        const dropMat = new THREE.PointsMaterial({ color: C_METEOR, size: 5, sizeAttenuation: false, opacity: 0.6, transparent: true });
        const drops = new THREE.Points(dropGeo, dropMat);
        scene.add(drops);
        objects.push('drops');

        // Animation State
        let t = 0;
        let cameraZ = 4;
        let cameraX = 0;

        window.__step = function(dt) {
            t += dt;

            // Camera Move
            if (cameraZ > 1.0) {
                cameraZ -= 2.32 * dt;
                if (cameraZ < 1.0) cameraZ = 1.0;
            }
            cameraX = 0.6 * Math.sin(t * 0.5);
            
            camera.position.set(cameraX, 0, cameraZ);

            // Meteors Move
            const mPos = meteorGeo.attributes.position.array;
            for(let i=0; i<meteorCount; i++) {
                mPos[i*3] += meteorSpeeds[i].vx * dt;
                mPos[i*3+1] += meteorSpeeds[i].vy * dt;
                
                if (mPos[i*3+1] < -0.5) {
                    mPos[i*3+1] = 0.5;
                    mPos[i*3] = (rnd() - 0.5);
                }
                mPos[i*3] += Math.sin(t + i) * 0.5 * dt;
            }
            meteorGeo.attributes.position.needsUpdate = true;

            // Drops Move
            const dPos = dropGeo.attributes.position.array;
            for(let i=0; i<dropCount; i++) {
                dPos[i*3+1] -= dropSpeeds[i] * dt;
                if (dPos[i*3+1] < -0.4) {
                    dPos[i*3+1] = 0.4;
                    dPos[i*3] = (rnd() - 0.5);
                }
            }
            dropGeo.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
            return window.__probe();
        };

        window.__probe = function() {
            const mPos = meteorGeo.attributes.position.array;
            return {
                t: parseFloat(t.toFixed(4)),
                objects: objects,
                meteor: [parseFloat(mPos[0].toFixed(4)), parseFloat(mPos[1].toFixed(4))],
                camera: [parseFloat(camera.position.x.toFixed(4)), parseFloat(camera.position.z.toFixed(4))]
            };
        };

        window.__ready = true;
        
        renderer.render(scene, camera);

    </script>

<script>
// Сцена играет сама: драйвер измеряет окно движения (сколько шагов подряд кадр
// реально меняется), разворачивает его на несколько секунд и зацикливает
// перезагрузкой. Без этого сцена выгорает за 1-2 с и стоит, как скриншот.
// Отчёт и запись могут вмешаться сообщениями 'step', 'pause', 'play', 'reset'.
(() => {
  const DT = 1 / 60;
  const QUIET = 90;          // столько шагов без изменений — окно кончилось
  const MEASURE_CAP = 1200;  // предел замера в шагах
  const MIN_WINDOW = 4;      // короче — сцена статична, повторять нечего
  const SPAN_PER_STEP = 6;   // кадров на шаг показа (~0.1 с при 60 к/с)
  const SPAN_MIN = 240;      // показ короче 4 с сливается
  const SPAN_MAX = 600;      // ...а длиннее 10 с — затягивается
  const HOLD_MS = 900;       // пауза перед повтором
  const MEASURE_MS = 8;      // бюджет замера на кадр, чтобы не морозить вкладку

  // three.js держит render собственным свойством экземпляра (this.render =
  // render), поэтому обёртка прототипа его не видит: подменяем конструктор,
  // а render перепривязываем на самом экземпляре. Так кадр обновляется, даже
  // если страница рисует только в __probe — иначе сцена стоит, как скриншот.
  let lastRender = null;
  const wrap = () => {
    const W = window.THREE && window.THREE.WebGLRenderer;
    if (!W || W.__dbWrapped) return !!W;
    const Wrapped = function (...args) {
      const inst = new W(...args);
      const orig = inst.render.bind(inst);
      inst.render = function (scene, camera) { lastRender = [inst, scene, camera]; return orig(scene, camera); };
      return inst;
    };
    Wrapped.prototype = W.prototype;
    Object.setPrototypeOf(Wrapped, W);
    Wrapped.__dbWrapped = true;
    window.THREE.WebGLRenderer = Wrapped;
    return true;
  };
  if (!wrap()) { let n = 0; const t = setInterval(() => { if (wrap() || ++n > 1500) clearInterval(t); }, 4); }

  const step = () => { if (typeof window.__step === 'function') { try { window.__step(DT); } catch (e) {} } };
  const probe = () => { if (typeof window.__probe === 'function') { try { window.__probe(); } catch (e) {} } };
  const draw = () => { if (lastRender) { try { lastRender[0].render(lastRender[1], lastRender[2]); } catch (e) {} } };
  // Один шаг — и сразу кадр: probe зовём всегда, часть страниц рисует в нём.
  const beat = () => { step(); probe(); draw(); };

  let oc = null, ox = null;
  const sig = () => {  // дешёвая подпись кадра: 64x48 достаточно для «меняется/нет»
    try {
      const cs = document.querySelectorAll('canvas');
      if (!cs.length) return -1;
      if (!oc) { oc = document.createElement('canvas'); oc.width = 64; oc.height = 48; ox = oc.getContext('2d', {willReadFrequently: true}); }
      // Сумма по ВСЕМ canvas: у L-2 их два, первый — WebGL без
      // preserveDrawingBuffer, и подпись только по нему читалась как пустая:
      // движущаяся сцена получала freeze=0 и показывалась статичным кадром.
      let total = 0;
      for (const c of cs) {
        if (!c.width || !c.height) continue;
        ox.clearRect(0, 0, 64, 48);
        ox.drawImage(c, 0, 0, 64, 48);
        const d = ox.getImageData(0, 0, 64, 48).data;
        let s = 0;
        for (let i = 0; i < d.length; i += 4) s = (s + d[i] + d[i + 1] * 3 + d[i + 2] * 7) % 1000003;
        total = (total + s + cs.length * 7) % 1000003;
      }
      return total;
    } catch (e) { return -2; }
  };

  // Замер должен пережить перезагрузку (её использует повтор): sessionStorage,
  // а если он недоступен — window.name (оба живут в пределах вкладки).
  const KEY = 'dailybench.scene:' + location.pathname;
  const put = (v) => {
    try { sessionStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
    try { window.name = 'dbscene:' + JSON.stringify(v); } catch (e) {}
  };
  const got = () => {
    try { const v = sessionStorage.getItem(KEY); if (v) return JSON.parse(v); } catch (e) {}
    try { if (window.name.indexOf('dbscene:') === 0) return JSON.parse(window.name.slice(8)); } catch (e) {}
    return null;
  };

  let freeze = 0, span = SPAN_MAX, frames = 0, shown = 0, phase = 'measuring', holdUntil = 0, auto = true;
  const scene = {mode: 'measuring', freeze: 0, step: 0};
  // Ответы сами выставляют `window.__scene` (свой THREE.Scene) — у deepseek это
  // уже занято, и модульный скрипт ответа исполняется ПОСЛЕ этого хука. Поэтому
  // драйвер живёт под своим именем, а `__scene` остаётся странице.
  window.__dbscene = scene;
  window.__beat = beat;
  const publish = () => {   // для записи и отладки: состояние драйвера наружу
    scene.mode = phase; scene.freeze = freeze; scene.step = shown;
    // seek(n) — ручной покадровый прогон до шага n (гарантирует первый кадр)
    scene.seek = (n) => {
      auto = false;
      if (shown === 0) { beat(); shown++; }
      while (shown < (n | 0)) { beat(); shown++; }
      scene.step = shown;
      return shown;
    };
  };
  publish();

  const play = () => {
    const cache = got();
    freeze = (cache && cache.freeze | 0) || 0;
    // Окно движения разворачиваем примерно на 0.1 с на шаг: сцена из 240 шагов
    // идёт 24 с — так движение видно, а не проскакивает за пару секунд.
    span = Math.min(SPAN_MAX, Math.max(SPAN_MIN, freeze * SPAN_PER_STEP));
    phase = freeze < MIN_WINDOW ? 'static' : 'play';
    frames = 0; shown = 0;
    publish();
    if (phase === 'play') requestAnimationFrame(tick);
  };

  const tick = (now) => {
    if (phase === 'play' && auto) {
      frames++;
      const target = Math.min(freeze, Math.round(frames * freeze / span));
      while (shown < target) { beat(); shown++; }
      scene.step = shown;
      if (frames >= span) { phase = 'hold'; holdUntil = performance.now() + HOLD_MS; scene.mode = phase; }
    } else if (phase === 'hold' && auto && performance.now() >= holdUntil) {
      location.reload();  // сброса у страницы нет: повтор — только перезагрузкой
    }
    requestAnimationFrame(tick);
  };

  if (got() === null) {
    // Первый заход: дождаться кадра страницы, измерить окно движения и
    // перезагрузиться — показ пойдёт с чистого состояния, замер уже в кэше.
    const t0 = performance.now();
    let prev = null, lastChange = 0, k = 0, started = false;
    const measureFrame = () => {
      const t1 = performance.now();
      while (performance.now() - t1 < MEASURE_MS && k < MEASURE_CAP) {
        beat(); k++;
        const s = sig();
        if (s !== prev) { lastChange = k; prev = s; }
        else if (k - lastChange >= QUIET) break;
      }
      if ((k >= MEASURE_CAP || k - lastChange >= QUIET) && k > 0) {
        put({freeze: lastChange});
        location.reload();
        return;
      }
      requestAnimationFrame(measureFrame);
    };
    const wait = () => {
      if (window.__ready !== true && performance.now() - t0 < 8000) { requestAnimationFrame(wait); return; }
      probe(); draw(); prev = sig();
      if (!started) { started = true; requestAnimationFrame(measureFrame); }
    };
    requestAnimationFrame(wait);
  } else {
    play();
  }

  const resume = () => { auto = true; if (phase !== 'play') { phase = 'play'; publish(); requestAnimationFrame(tick); } };
  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { auto = false; beat(); shown++; scene.step = shown; }
    else if (cmd === 'pause') { auto = false; }
    else if (cmd === 'play') { resume(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); auto = !auto; if (auto) resume(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); auto = false; beat(); shown++; scene.step = shown; }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>

  const fit = () => {
    const canvas = document.querySelector('canvas');
    if (!canvas) return;
