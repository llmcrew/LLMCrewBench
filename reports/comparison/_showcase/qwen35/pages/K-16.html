    <meta charset="UTF-8">
    <title>Terrain Simulation</title>

        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }

    <script type="module">
        const THREE = window.THREE;

        // Hash function as specified
        function hash(x, y) {
            let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) >>> 0;
            h = (h ^ (h >>> 13)) >>> 0;
            h = Math.imul(h, 1274126177) >>> 0;
            h = (h ^ (h >>> 16)) >>> 0;
            return h / 4294967296;
        }

        // Height function
        function getHeight(x, z) {
            const A = 4.0;
            return A * (hash(x, z) - 0.5);
        }

        // Scene setup
        const scene = new THREE.Scene();
        
        // Camera
        const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 500);
        camera.position.set(56.0, 43.0, 43.0);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(800, 600, false);
        renderer.domElement.style.width = '800px';
        renderer.domElement.style.height = '600px';
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.8);
        directionalLight.position.set(30.0, 40.0, 20.0);
        scene.add(directionalLight);

        // Geometry
        const geometry = new THREE.PlaneGeometry(40, 40, 40, 40);
        geometry.rotateX(-Math.PI / 2);

        const positions = geometry.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
            // x is at i, y (height) is at i+1, z is at i+2
            // After rotation, x is world X, z is world Z (inverted original Y)
            // We round to ensure integer coordinates for hash
            const x = Math.round(positions[i]);
            const z = Math.round(positions[i + 2]);
            positions[i + 1] = getHeight(x, z);
        }
        geometry.attributes.position.needsUpdate = true;
        geometry.computeVertexNormals();

        // Material
        const material = new THREE.MeshStandardMaterial({
            color: 0x8a6b3d,
            flatShading: true
        });

        // Mesh
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Initial Render
        renderer.render(scene, camera);
        window.__ready = true;

        // Step function (static terrain)
        window.__step = function(dt) {
            // Does nothing
        };

        // Probe function
        window.__probe = function() {
            renderer.render(scene, camera);

            const h1 = getHeight(2, 3);
            const h2 = getHeight(10, 10);
            const h3 = getHeight(20, 5);

            let min = Infinity;
            let max = -Infinity;

            for (let x = -20; x <= 20; x++) {
                for (let z = -20; z <= 20; z++) {
                    const h = getHeight(x, z);
                    if (h < min) min = h;
                    if (h > max) max = h;
                }
            }

            return {
                heights: [
                    Number(h1.toFixed(4)),
                    Number(h2.toFixed(4)),
                    Number(h3.toFixed(4))
                ],
                min: Number(min.toFixed(4)),
                max: Number(max.toFixed(4))
            };
        };
    </script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
