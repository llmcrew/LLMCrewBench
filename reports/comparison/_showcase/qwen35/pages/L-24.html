<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Neon Bus Stop</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// --- Deterministic Randomness ---
let lcg = 140149;
function rnd() {
    lcg = (lcg * 1103515245 + 12345) % 2147483648;
    return lcg / 2147483648;
}

// --- Scene Setup ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 800 / 600, 0.1, 1000);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, -1);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

// --- Palette ---
const C_NIGHT = 0x1c1236;
const C_BOARD = 0x22d3c5;
const C_LAMP = 0xffa83c;
const C_NEON = 0xff4d9d;
const C_DROPS = 0xa8c8dc;

// --- Geometry Helpers ---
// u, v are 0..1 relative to canvas 800x600.
// To convert to Three.js world coordinates (assuming FOV 60, aspect 4/3):
// At z=0, height is approx 2 * tan(30deg) * dist. 
// But simpler: map u,v to a fixed orthographic-like projection or calculate frustum size.
// Let's calculate frustum height at z=0.
const fov = 60 * Math.PI / 180;
const aspect = 800 / 600;
// We are looking at z=-1 from z=4. Distance = 5.
// Height at z=-1: 2 * 5 * tan(fov/2) = 10 * 0.577 = 5.77.
// Width at z=-1: 5.77 * 1.33 = 7.69.
// Center is (0,0,-1).
// Top = 0 + 5.77/2 = 2.88. Bottom = -2.88.
// Right = 0 + 7.69/2 = 3.84. Left = -3.84.

function getFrustumBounds(z) {
    const dist = 4 - z; // Camera is at z=4
    const h = 2 * dist * Math.tan(fov / 2);
    const w = h * aspect;
    return { top: h / 2, bottom: -h / 2, right: w / 2, left: -w / 2 };
}

function uvToWorld(u, v, z) {
    const bounds = getFrustumBounds(z);
    const x = bounds.left + u * (bounds.right - bounds.left);
    const y = bounds.top - v * (bounds.top - bounds.bottom); // v=0 is top
    return new THREE.Vector3(x, y, z);
}

function createPlane(w_uv, h_uv, u_center, v_center, z, color, opacity = 1.0) {
    const geometry = new THREE.PlaneGeometry(w_uv, h_uv); // Dimensions in UV space initially? No, let's use world units.
    // Actually, easier to create geometry in UV units (0..1) and scale it.
    // But let's just calculate world width/height.
    const bounds = getFrustumBounds(z);
    const worldW = (bounds.right - bounds.left) * w_uv;
    const worldH = (bounds.top - bounds.bottom) * h_uv;
    
    const geo = new THREE.PlaneGeometry(worldW, worldH);
    const mat = new THREE.MeshBasicMaterial({ color: color, opacity: opacity, transparent: opacity < 1.0, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    
    const pos = uvToWorld(u_center, v_center, z);
    mesh.position.copy(pos);
    return mesh;
}

// --- Objects ---

// 1. Night (Background)
// z = -45. Covers everything.
const nightMesh = createPlane(2.0, 2.0, 0.5, 0.5, -45, C_NIGHT); 
// Scale up to ensure coverage at z=-45
const boundsNight = getFrustumBounds(-45);
nightMesh.scale.set(10, 10, 1); 
scene.add(nightMesh);

// 2. Floor (Asphalt)
// z = -8. From 62% height down.
// 62% height means v=0.62 to v=1.0.
const floorMesh = createPlane(1.0, 0.38, 0.5, 0.81, -8, C_NIGHT);
scene.add(floorMesh);

// 3. Canopy
// z = -5. Top 0..16%.
const canopyMesh = createPlane(1.0, 0.16, 0.5, 0.08, -5, C_NIGHT);
scene.add(canopyMesh);

// 4. Posts
// z = -5. 0.02 width. Edges of glass (glass is 62% width, centered).
// Glass u: (1 - 0.62)/2 = 0.19 to 0.19+0.62 = 0.81.
// Posts at edges of glass? "по краям стекла".
const postW = 0.02;
const postH = 0.44; // Same as glass height
const postLeft = createPlane(postW, postH, 0.19, 0.38, -5, C_NIGHT);
const postRight = createPlane(postW, postH, 0.81, 0.38, -5, C_NIGHT);
scene.add(postLeft);
scene.add(postRight);

// 5. Glass
// z = -5. 62% x 44%. Top at 16%.
// Center v: 0.16 + 0.44/2 = 0.38.
const glassMesh = createPlane(0.62, 0.44, 0.5, 0.38, -5, C_NIGHT, 0.32);
// Glass needs to be slightly transparent but colored #1c1236 per spec? 
// Spec says "glass ... color #1c1236". Wait, spec says "glass panel ... opacity 0.32".
// And palette says #1c1236 is night/asphalt. 
// But geometry section says `glass` ... color #1c1236. Okay.
scene.add(glassMesh);

// 6. Board (Holo-schedule)
// z = -4.9 (in front of glass). u=0.32, v=0.30. 0.22x0.14.
// We need a canvas texture for scrolling text.
const boardCanvas = document.createElement('canvas');
boardCanvas.width = 256;
boardCanvas.height = 128;
const boardCtx = boardCanvas.getContext('2d');
const boardTex = new THREE.CanvasTexture(boardCanvas);
boardTex.minFilter = THREE.NearestFilter;

const boardMesh = createPlane(0.22, 0.14, 0.32, 0.30, -4.9, 0xffffff);
boardMesh.material.map = boardTex;
boardMesh.material.transparent = true;
boardMesh.material.opacity = 1.0;
// Override color to #22d3c5 via emissive or just draw on canvas?
// Spec: color #22d3c5. Let's make material basic color that, and draw white text? 
// Or draw cyan text on black.
boardMesh.material.color.setHex(C_BOARD);
scene.add(boardMesh);

// 7. Lamp
// z = -4.9. u=0.62, v=0.14. 0.13x0.06.
const lampMesh = createPlane(0.13, 0.06, 0.62, 0.14, -4.9, C_LAMP, 0.9);
scene.add(lampMesh);
// Halo: 0.20x0.10.
const haloMesh = createPlane(0.20, 0.10, 0.62, 0.14, -4.91, C_LAMP, 0.3);
scene.add(haloMesh);

// 8. Neon (Background sign)
// z = -45. 0.30x0.06. u=0.58, v=0.24.
const neonMesh = createPlane(0.30, 0.06, 0.58, 0.24, -45, C_NEON);
scene.add(neonMesh);

// 9. Bench
// z = -4.9. 0.30x0.05. v=0.66.
const benchMesh = createPlane(0.30, 0.05, 0.5, 0.66, -4.9, C_NIGHT);
scene.add(benchMesh);

// 10. Puddles
// z = -7.9 (on floor). 3 puddles. 0.18x0.04. v=0.90. Color #ff4d9d, opacity 0.35.
// Spread them horizontally? Spec doesn't say u, just "three puddles". 
// Let's distribute: 0.3, 0.5, 0.7.
const puddleGeo = new THREE.PlaneGeometry(0, 0); // Will set scale
const puddleMat = new THREE.MeshBasicMaterial({ color: C_NEON, opacity: 0.35, transparent: true });
const puddles = [];
for(let i=0; i<3; i++) {
    const mesh = new THREE.Mesh(puddleGeo, puddleMat);
    const u = 0.3 + i * 0.2;
    const pos = uvToWorld(u, 0.90, -7.9);
    mesh.position.copy(pos);
    // Scale based on UV size at z=-7.9
    const b = getFrustumBounds(-7.9);
    mesh.scale.set((b.right-b.left)*0.18, (b.top-b.bottom)*0.04, 1);
    scene.add(mesh);
    puddles.push(mesh);
}

// 11. Drops (Front)
// z = -4.9. 56 drops. 6px size.
// We need to manage positions manually for animation.
const dropsData = [];
const dropGeo = new THREE.PlaneGeometry(1, 1); // Will scale to 6px
const dropMat = new THREE.MeshBasicMaterial({ color: C_DROPS });
const dropsMeshes = [];

// 6px in world units at z=-4.9 (dist=8.9)
// Height at z=-4.9: 2 * 8.9 * tan(30) = 10.27.
// 600px = 10.27 units. 1px = 0.0171 units. 6px = 0.102 units.
const dropSize = 0.102;

for(let i=0; i<56; i++) {
    const mesh = new THREE.Mesh(dropGeo, dropMat);
    mesh.scale.set(dropSize, dropSize * 2, 1); // Elongated
    // Random start pos within glass area roughly? Or whole screen?
    // "drops ... before glass". Let's scatter over the glass area.
    // Glass u: 0.19..0.81, v: 0.16..0.60
    const u = 0.19 + rnd() * 0.62;
    const v = 0.16 + rnd() * 0.44;
    const pos = uvToWorld(u, v, -4.9);
    mesh.position.copy(pos);
    mesh.position.z = -4.9;
    
    // Store speed and offset for animation
    dropsData.push({
        mesh: mesh,
        speed: 1.90,
        startY: pos.y,
        offset: rnd() * 100
    });
    scene.add(mesh);
    dropsMeshes.push(mesh);
}

// 12. Rain (Back)
// z = -12. Same points, 1/3 speed.
const rainData = [];
const rainGeo = new THREE.PlaneGeometry(1, 1);
const rainMat = new THREE.MeshBasicMaterial({ color: C_DROPS, opacity: 0.5, transparent: true });
const rainMeshes = [];

for(let i=0; i<56; i++) {
    const mesh = new THREE.Mesh(rainGeo, rainMat);
    mesh.scale.set(dropSize * 1.5, dropSize * 4, 1); // Longer streaks
    // Reuse drop logic for positions but mapped to z=-12
    // To keep "same points", we use the same u,v logic but different z
    const u = 0.19 + rnd() * 0.62; // Note: rnd() is deterministic, so this matches drops if called in order
    const v = 0.16 + rnd() * 0.44;
    const pos = uvToWorld(u, v, -12);
    mesh.position.copy(pos);
    mesh.position.z = -12;
    
    rainData.push({
        mesh: mesh,
        speed: 1.90 / 3.0,
        startY: pos.y,
        offset: rnd() * 100
    });
    scene.add(mesh);
    rainMeshes.push(mesh);
}

// --- Animation State ---
let time = 0;
let boardPhase = 0;

// --- Functions ---

function drawBoard() {
    const ctx = boardCtx;
    const w = boardCanvas.width;
    const h = boardCanvas.height;
    
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, w, h);
    
    ctx.fillStyle = '#22d3c5';
    ctx.font = 'bold 20px monospace';
    
    // Header blinking
    if (Math.floor(time * 2) % 2 === 0) {
        ctx.fillText("BUS STOP 42", 10, 30);
    }
    
    // Scrolling lines
    const lines = ["14A: 2 min", "05B: 15 min", "NIGHT: 40 min", "EXP: 5 min", "LOCAL: 12 min"];
    const lineHeight = 24;
    const offset = (boardPhase * 50) % (lines.length * lineHeight);
    
    for(let i=0; i<lines.length + 1; i++) {
        const y = 50 + i * lineHeight - offset;
        if (y > 10 && y < h) {
            ctx.fillText(lines[i % lines.length], 10, y);
        }
    }
    boardTex.needsUpdate = true;
}

window.__step = function(dt) {
    time += dt;
    boardPhase += dt;
    
    // Update drops
    const boundsDrops = getFrustumBounds(-4.9);
    const totalH = boundsDrops.top - boundsDrops.bottom;
    
    dropsData.forEach(d => {
        d.mesh.position.y -= d.speed * dt;
        if (d.mesh.position.y < boundsDrops.bottom) {
            d.mesh.position.y = boundsDrops.top;
        }
    });
    
    // Update rain
    const boundsRain = getFrustumBounds(-12);
    rainData.forEach(d => {
        d.mesh.position.y -= d.speed * dt;
        if (d.mesh.position.y < boundsRain.bottom) {
            d.mesh.position.y = boundsRain.top;
        }
    });
    
    // Camera wobble
    camera.position.x = Math.sin(time * 0.5) * 0.034;
    camera.lookAt(0, 0, -1);
    
    drawBoard();
    renderer.render(scene, camera);
    
    return window.__probe();
};

window.__probe = function() {
    return {
        t: time.toFixed(4),
        objects: [
            'night', 'floor', 'canopy', 'glass', 'post', 'board', 
            'lamp', 'neon', 'bench', 'puddle', 'drops', 'rain'
        ],
        board_phase: boardPhase.toFixed(4)
    };
};

// Initial render
window.__ready = true;
drawBoard();
renderer.render(scene, camera);

</script>

<script>
// Сцена играет сама: драйвер измеряет окно движения (сколько шагов подряд кадр
// реально меняется), разворачивает его на несколько секунд и зацикливает
// перезагрузкой. Без этого сцена выгорает за 1-2 с и стоит, как скриншот.
// Отчёт и запись могут вмешаться сообщениями 'step', 'pause', 'play', 'reset'.
(() => {
  const DT = 1 / 60;
  const QUIET = 90;          // столько шагов без изменений — окно кончилось
  const MEASURE_CAP = 1200;  // предел замера в шагах
  const MIN_WINDOW = 4;      // короче — сцена статична, повторять нечего
  const SPAN_PER_STEP = 6;   // кадров на шаг показа (~0.1 с при 60 к/с)
  const SPAN_MIN = 240;      // показ короче 4 с сливается
  const SPAN_MAX = 600;      // ...а длиннее 10 с — затягивается
  const HOLD_MS = 900;       // пауза перед повтором
  const MEASURE_MS = 8;      // бюджет замера на кадр, чтобы не морозить вкладку

  // three.js держит render собственным свойством экземпляра (this.render =
  // render), поэтому обёртка прототипа его не видит: подменяем конструктор,
  // а render перепривязываем на самом экземпляре. Так кадр обновляется, даже
  // если страница рисует только в __probe — иначе сцена стоит, как скриншот.
  let lastRender = null;
  const wrap = () => {
    const W = window.THREE && window.THREE.WebGLRenderer;
    if (!W || W.__dbWrapped) return !!W;
    const Wrapped = function (...args) {
      const inst = new W(...args);
      const orig = inst.render.bind(inst);
      inst.render = function (scene, camera) { lastRender = [inst, scene, camera]; return orig(scene, camera); };
      return inst;
    };
    Wrapped.prototype = W.prototype;
    Object.setPrototypeOf(Wrapped, W);
    Wrapped.__dbWrapped = true;
    window.THREE.WebGLRenderer = Wrapped;
    return true;
  };
  if (!wrap()) { let n = 0; const t = setInterval(() => { if (wrap() || ++n > 1500) clearInterval(t); }, 4); }

  const step = () => { if (typeof window.__step === 'function') { try { window.__step(DT); } catch (e) {} } };
  const probe = () => { if (typeof window.__probe === 'function') { try { window.__probe(); } catch (e) {} } };
  const draw = () => { if (lastRender) { try { lastRender[0].render(lastRender[1], lastRender[2]); } catch (e) {} } };
  // Один шаг — и сразу кадр: probe зовём всегда, часть страниц рисует в нём.
  const beat = () => { step(); probe(); draw(); };

  let oc = null, ox = null;
  const sig = () => {  // дешёвая подпись кадра: 64x48 достаточно для «меняется/нет»
    try {
      const cs = document.querySelectorAll('canvas');
      if (!cs.length) return -1;
      if (!oc) { oc = document.createElement('canvas'); oc.width = 64; oc.height = 48; ox = oc.getContext('2d', {willReadFrequently: true}); }
      // Сумма по ВСЕМ canvas: у L-2 их два, первый — WebGL без
      // preserveDrawingBuffer, и подпись только по нему читалась как пустая:
      // движущаяся сцена получала freeze=0 и показывалась статичным кадром.
      let total = 0;
      for (const c of cs) {
        if (!c.width || !c.height) continue;
        ox.clearRect(0, 0, 64, 48);
        ox.drawImage(c, 0, 0, 64, 48);
        const d = ox.getImageData(0, 0, 64, 48).data;
        let s = 0;
        for (let i = 0; i < d.length; i += 4) s = (s + d[i] + d[i + 1] * 3 + d[i + 2] * 7) % 1000003;
        total = (total + s + cs.length * 7) % 1000003;
      }
      return total;
    } catch (e) { return -2; }
  };

  // Замер должен пережить перезагрузку (её использует повтор): sessionStorage,
  // а если он недоступен — window.name (оба живут в пределах вкладки).
  const KEY = 'dailybench.scene:' + location.pathname;
  const put = (v) => {
    try { sessionStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
    try { window.name = 'dbscene:' + JSON.stringify(v); } catch (e) {}
  };
  const got = () => {
    try { const v = sessionStorage.getItem(KEY); if (v) return JSON.parse(v); } catch (e) {}
    try { if (window.name.indexOf('dbscene:') === 0) return JSON.parse(window.name.slice(8)); } catch (e) {}
    return null;
  };

  let freeze = 0, span = SPAN_MAX, frames = 0, shown = 0, phase = 'measuring', holdUntil = 0, auto = true;
  const scene = {mode: 'measuring', freeze: 0, step: 0};
  // Ответы сами выставляют `window.__scene` (свой THREE.Scene) — у deepseek это
  // уже занято, и модульный скрипт ответа исполняется ПОСЛЕ этого хука. Поэтому
  // драйвер живёт под своим именем, а `__scene` остаётся странице.
  window.__dbscene = scene;
  window.__beat = beat;
  const publish = () => {   // для записи и отладки: состояние драйвера наружу
    scene.mode = phase; scene.freeze = freeze; scene.step = shown;
    // seek(n) — ручной покадровый прогон до шага n (гарантирует первый кадр)
    scene.seek = (n) => {
      auto = false;
      if (shown === 0) { beat(); shown++; }
      while (shown < (n | 0)) { beat(); shown++; }
      scene.step = shown;
      return shown;
    };
  };
  publish();

  const play = () => {
    const cache = got();
    freeze = (cache && cache.freeze | 0) || 0;
    // Окно движения разворачиваем примерно на 0.1 с на шаг: сцена из 240 шагов
    // идёт 24 с — так движение видно, а не проскакивает за пару секунд.
    span = Math.min(SPAN_MAX, Math.max(SPAN_MIN, freeze * SPAN_PER_STEP));
    phase = freeze < MIN_WINDOW ? 'static' : 'play';
    frames = 0; shown = 0;
    publish();
    if (phase === 'play') requestAnimationFrame(tick);
  };

  const tick = (now) => {
    if (phase === 'play' && auto) {
      frames++;
      const target = Math.min(freeze, Math.round(frames * freeze / span));
      while (shown < target) { beat(); shown++; }
      scene.step = shown;
      if (frames >= span) { phase = 'hold'; holdUntil = performance.now() + HOLD_MS; scene.mode = phase; }
    } else if (phase === 'hold' && auto && performance.now() >= holdUntil) {
      location.reload();  // сброса у страницы нет: повтор — только перезагрузкой
    }
    requestAnimationFrame(tick);
  };

  if (got() === null) {
    // Первый заход: дождаться кадра страницы, измерить окно движения и
    // перезагрузиться — показ пойдёт с чистого состояния, замер уже в кэше.
    const t0 = performance.now();
    let prev = null, lastChange = 0, k = 0, started = false;
    const measureFrame = () => {
      const t1 = performance.now();
      while (performance.now() - t1 < MEASURE_MS && k < MEASURE_CAP) {
        beat(); k++;
        const s = sig();
        if (s !== prev) { lastChange = k; prev = s; }
        else if (k - lastChange >= QUIET) break;
      }
      if ((k >= MEASURE_CAP || k - lastChange >= QUIET) && k > 0) {
        put({freeze: lastChange});
        location.reload();
        return;
      }
      requestAnimationFrame(measureFrame);
    };
    const wait = () => {
      if (window.__ready !== true && performance.now() - t0 < 8000) { requestAnimationFrame(wait); return; }
      probe(); draw(); prev = sig();
      if (!started) { started = true; requestAnimationFrame(measureFrame); }
    };
    requestAnimationFrame(wait);
  } else {
    play();
  }

  const resume = () => { auto = true; if (phase !== 'play') { phase = 'play'; publish(); requestAnimationFrame(tick); } };
  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { auto = false; beat(); shown++; scene.step = shown; }
    else if (cmd === 'pause') { auto = false; }
    else if (cmd === 'play') { resume(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); auto = !auto; if (auto) resume(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); auto = false; beat(); shown++; scene.step = shown; }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
