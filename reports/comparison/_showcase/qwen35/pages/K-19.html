<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planar Manipulator Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
    <script type="module">
        const THREE = window.THREE;

        // --- Configuration ---
        const L1 = 2.56;
        const L2 = 2.09;
        const TARGET_X = 1.11;
        const TARGET_Y = 2.08;
        const TARGET_Z = -0.2;

        // --- State ---
        let steps = 0;
        let t = 0;
        let theta1 = 0;
        let theta2 = 0;

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        // Background color implicit (black) or default, prompt doesn't specify, usually gray/white for CAD, 
        // but standard Three.js default is black. I'll leave it default or set to a neutral gray for visibility if needed.
        // Prompt implies deterministic frame, usually implies standard clear color.
        
        const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
        camera.position.set(1.6, 2.0, 9.5);
        camera.lookAt(1.6, 2.0, 0.0);

        const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(800, 600, false);
        document.body.appendChild(renderer.domElement);

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
        dirLight.position.set(5.0, 9.0, 8.0);
        scene.add(dirLight);

        // --- Objects ---

        // 1. Base
        const baseGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 32);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x8899aa });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.set(0, 0.15, 0);
        base.name = "base";
        scene.add(base);

        // 2. Arm 1 Group
        const arm1 = new THREE.Group();
        arm1.name = "arm1";
        arm1.position.set(0, 0, 0);
        scene.add(arm1);

        // Arm 1 Link
        const link1Geo = new THREE.BoxGeometry(L1, 0.3, 0.3);
        const linkMat = new THREE.MeshStandardMaterial({ color: 0xcfd8e3 });
        const link1 = new THREE.Mesh(link1Geo, linkMat);
        link1.position.set(L1 / 2, 0, 0);
        arm1.add(link1);

        // 3. Arm 2 Group (nested in Arm 1)
        const arm2 = new THREE.Group();
        arm2.name = "arm2";
        arm2.position.set(L1, 0, 0);
        arm1.add(arm2);

        // Arm 2 Link
        const link2Geo = new THREE.BoxGeometry(L2, 0.3, 0.3);
        const link2 = new THREE.Mesh(link2Geo, linkMat);
        link2.position.set(L2 / 2, 0, 0);
        arm2.add(link2);

        // 4. Effector (nested in Arm 2)
        const effectorGeo = new THREE.SphereGeometry(0.2, 32, 32);
        const effectorMat = new THREE.MeshStandardMaterial({ color: 0x44ddaa });
        const effector = new THREE.Mesh(effectorGeo, effectorMat);
        effector.name = "effector";
        effector.position.set(L2, 0, 0);
        arm2.add(effector);

        // 5. Target
        const targetGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const targetMat = new THREE.MeshStandardMaterial({ color: 0xff8a3d });
        const target = new THREE.Mesh(targetGeo, targetMat);
        target.name = "target";
        target.position.set(TARGET_X, TARGET_Y, TARGET_Z);
        scene.add(target);

        // --- Simulation Logic ---

        function clamp(val, min, max) {
            return Math.min(Math.max(val, min), max);
        }

        function solveIK(x, y) {
            // c2 = (x*x + y*y - L1*L1 - L2*L2) / (2 * L1 * L2)
            const c2 = (x * x + y * y - L1 * L1 - L2 * L2) / (2 * L1 * L2);
            
            // theta2 = -acos(clamp(c2, -1, 1)) (elbow up)
            const th2 = -Math.acos(clamp(c2, -1, 1));
            
            // theta1 = atan2(y, x) - atan2(L2 * sin(theta2), L1 + L2 * cos(theta2))
            const k1 = L1 + L2 * Math.cos(th2);
            const k2 = L2 * Math.sin(th2);
            const th1 = Math.atan2(y, x) - Math.atan2(k2, k1);

            return { th1, th2 };
        }

        window.__step = function(dt) {
            // Solve IK for the fixed target
            const angles = solveIK(TARGET_X, TARGET_Y);
            
            theta1 = angles.th1;
            theta2 = angles.th2;

            // Apply rotations
            arm1.rotation.z = theta1;
            arm2.rotation.z = theta2;

            // Update counters
            steps += 1;
            t += dt;
        };

        window.__probe = function() {
            // Get effector world position
            const effectorWorldPos = new THREE.Vector3();
            effector.getWorldPosition(effectorWorldPos);

            // Get target world position (static, but for consistency)
            const targetWorldPos = new THREE.Vector3();
            target.getWorldPosition(targetWorldPos);

            // Helper to round to 4 decimals
            const r4 = (n) => parseFloat(n.toFixed(4));

            return {
                steps: steps,
                t: r4(t),
                objects: ["base", "arm1", "target"],
                angles: [r4(theta1), r4(theta2)],
                effector: [r4(effectorWorldPos.x), r4(effectorWorldPos.y)],
                target: [r4(targetWorldPos.x), r4(targetWorldPos.y)]
            };
        };

        // --- Initial Render ---
        renderer.render(scene, camera);
        window.__ready = true;

    </script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
