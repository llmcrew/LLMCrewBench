<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Rigid Body Rotation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
    <script type="module">
        const THREE = window.THREE;

        // --- Constants & State ---
        // Главные моменты инерции
        const I1 = 0.147;
        const I2 = 0.591;
        const I3 = 0.6313;
        
        // Начальная угловая скорость
        let w1 = 3.69;
        let w2 = 0.36;
        let w3 = 0.28;
        
        let time = 0.0;
        let steps = 0;

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(50, 800/600, 0.1, 200);
        camera.position.set(0.0, 2.4, 7.5);
        camera.lookAt(0.0, 1.8, 0.0);

        const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(800, 600, false);
        document.body.appendChild(renderer.domElement);

        // --- Objects ---
        
        // Земля: плоскость 30x30, y=0, цвет 0x2b3a4a
        const groundGeo = new THREE.PlaneGeometry(30, 30);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b3a4a });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.name = 'ground';
        ground.rotation.x = -Math.PI / 2; // Поворот в плоскость XZ
        ground.position.y = 0;
        scene.add(ground);

        // Тело: бокс (2.54, 1.06, 0.8), центр (0, 1.8, 0), цвет 0xd97a3a
        const bodyGeo = new THREE.BoxGeometry(2.54, 1.06, 0.8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd97a3a });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.name = 'body';
        body.position.set(0, 1.8, 0);
        body.quaternion.set(0, 0, 0, 1); // Начальная ориентация
        scene.add(body);

        // Метка: сфера радиуса 0.14, цвет 0x9fd8ff, дочерний объект в (1.39, 0, 0)
        const markerGeo = new THREE.SphereGeometry(0.14);
        const markerMat = new THREE.MeshStandardMaterial({ color: 0x9fd8ff });
        const marker = new THREE.Mesh(markerGeo, markerMat);
        marker.position.set(1.39, 0, 0);
        body.add(marker);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(5.0, 9.0, 8.0);
        scene.add(dirLight);

        // --- Physics Engine ---
        
        window.__step = function(dt) {
            // 1. Обновление угловой скорости (Схема полунеявного Эйлера)
            // Порядок строго задан: обновляем w1, затем используем новое w1 для w2, 
            // затем новые w1, w2 для w3.
            
            // w1 += (I2 - I3)/I1 * w2 * w3 * dt
            const dw1 = ((I2 - I3) / I1) * w2 * w3 * dt;
            w1 += dw1;
            
            // w2 += (I3 - I1)/I2 * w3 * w1 * dt (использует новое w1)
            const dw2 = ((I3 - I1) / I2) * w3 * w1 * dt;
            w2 += dw2;
            
            // w3 += (I1 - I2)/I3 * w1 * w2 * dt (использует новые w1, w2)
            const dw3 = ((I1 - I2) / I3) * w1 * w2 * dt;
            w3 += dw3;
            
            // 2. Обновление ориентации (Кватернион)
            // Производная кватерниона: dq/dt = 0.5 * q * omega_local
            // omega_local как кватернион: (w1, w2, w3, 0)
            const omegaQ = new THREE.Quaternion(w1, w2, w3, 0);
            
            // Вычисляем приращение: dq = 0.5 * q * omega * dt
            const dq = body.quaternion.clone().multiply(omegaQ).multiplyScalar(0.5 * dt);
            
            // Применяем приращение
            body.quaternion.add(dq);
            body.quaternion.normalize();
            
            time += dt;
            steps++;
        };

        // --- Probe Interface ---
        window.__probe = function() {
            const f = (n) => parseFloat(n.toFixed(4));
            
            const objectNames = [];
            scene.children.forEach(obj => {
                if (obj.name) objectNames.push(obj.name);
            });
            
            return {
                steps: steps,
                t: f(time),
                objects: objectNames,
                camera: [0, 2.4, 7.5],
                omega: [f(w1), f(w2), f(w3)],
                inertia: [f(I1), f(I2), f(I3)]
            };
        };

        // --- Initial Render ---
        renderer.render(scene, camera);
        window.__ready = true;
    </script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
