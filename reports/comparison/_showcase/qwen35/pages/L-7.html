<body>
<script type="module">
const THREE = window.THREE;

// --- Конфигурация и Константы ---
const SEED = 571619;
const WIDTH = 800;
const HEIGHT = 600;
const FOV = 45;
const DISTANCE = 12.0;
const ASPECT = WIDTH / HEIGHT;

// Физика и Тайминг
const GRAVITY = 1.10;
const LIFE_TIME = 1.90;
const PERIOD = 2.00;
const PARTICLE_COUNT = 320;
const BASE_SPEED = 2.20;
const PARTICLE_SIZE = 6.0;

// Точки запуска (доли кадра: x от левого, y от верхнего)
const LAUNCH_POINTS_FRACTION = [
    { fx: 0.343, fy: 0.287 },
    { fx: 0.373, fy: 0.329 },
    { fx: 0.448, fy: 0.334 }
];

// Задержки залпов
const DELAYS = [0.0, 0.3, 0.7];

// Цвета
const COLORS = [
    0xff0051, // Красный
    0xffc300, // Золотой
    0x19cdff  // Голубой
];
const BG_COLOR = 0x280f54;

// --- Генератор Случайных Чисел (LCG) ---
let lcgState = SEED;

function nextRandom() {
    lcgState = (1664525 * lcgState + 1013904223) % 4294967296;
    return lcgState / 4294967296;
}

function resetRandom() {
    lcgState = SEED;
}

// --- Инициализация Сцены ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG_COLOR);

const camera = new THREE.PerspectiveCamera(FOV, ASPECT, 0.1, 200);
camera.position.set(0, 0, DISTANCE);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(WIDTH, HEIGHT, false);
document.body.appendChild(renderer.domElement);

// Расчет полувысоты кадра для конвертации координат
// halfHeight = distance * tan(fov / 2)
const halfHeight = DISTANCE * Math.tan(THREE.MathUtils.degToRad(FOV) / 2);
const aspectRatio = WIDTH / HEIGHT;

// Функция перевода долей экрана в мировые координаты
function getWorldPosition(fx, fy) {
    // x = (fx - 0.5) * 2 * полувысота * 800/600
    const x = (fx - 0.5) * 2 * halfHeight * aspectRatio;
    // y = (0.5 - fy) * 2 * полувысота
    const y = (0.5 - fy) * 2 * halfHeight;
    return new THREE.Vector3(x, y, 0);
}

// --- Создание Залпов ---
const bursts = [];
const burstObjects = [];

// Сбрасываем генератор перед генерацией геометрии, чтобы было детерминировано
resetRandom();

for (let i = 0; i < 3; i++) {
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3); // Храним начальные скорости
    
    const launchPos = getWorldPosition(LAUNCH_POINTS_FRACTION[i].fx, LAUNCH_POINTS_FRACTION[i].fy);

    for (let j = 0; j < PARTICLE_COUNT; j++) {
        // Генерация направления сферы
        const u = nextRandom();
        const v = nextRandom();
        const w = nextRandom();

        const z = 1 - 2 * u;
        const phi = 2 * Math.PI * v;
        const rr = Math.sqrt(1 - z * z);
        
        // Скорость V = 2.20 * (0.65 + 0.5*w)
        const V = BASE_SPEED * (0.65 + 0.5 * w);
        
        // Вектор скорости (rr*cos(phi)*V, z*V, rr*sin(phi)*V*0.5)
        const vx = rr * Math.cos(phi) * V;
        const vy = z * V;
        const vz = rr * Math.sin(phi) * V * 0.5;

        velocities[j * 3] = vx;
        velocities[j * 3 + 1] = vy;
        velocities[j * 3 + 2] = vz;

        // Начальная позиция (будет обновляться в шейдере/цикле, но здесь задаем базу)
        positions[j * 3] = launchPos.x;
        positions[j * 3 + 1] = launchPos.y;
        positions[j * 3 + 2] = launchPos.z;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    // Сохраняем скорости в userData геометрии или отдельном массиве для доступа в цикле
    geometry.userData.velocities = velocities;
    geometry.userData.launchPos = launchPos;

    const material = new THREE.PointsMaterial({
        size: PARTICLE_SIZE,
        sizeAttenuation: false,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthTest: false,
        color: COLORS[i],
        opacity: 0
    });

    const points = new THREE.Points(geometry, material);
    points.name = `burst_${i + 1}`;
    scene.add(points);
    
    burstObjects.push(points);
    bursts.push({
        object: points,
        delay: DELAYS[i],
        geometry: geometry,
        material: material
    });
}

// --- Логика Анимации ---
let currentTime = 0;

window.__step = function(dt) {
    currentTime += dt;

    let totalRadius = 0;
    let totalBright = 0;
    let activeBursts = 0;

    bursts.forEach((burst, index) => {
        const tau = (currentTime - burst.delay) % PERIOD;
        const positions = burst.geometry.attributes.position.array;
        const velocities = burst.geometry.userData.velocities;
        const launchPos = burst.geometry.userData.launchPos;

        if (tau > LIFE_TIME) {
            // Скрыть частицы
            burst.material.opacity = 0;
        } else {
            // Обновить позиции
            const brightness = Math.max(0, 1 - tau / LIFE_TIME);
            burst.material.opacity = brightness;

            let currentBurstRadiusSum = 0;

            for (let j = 0; j < PARTICLE_COUNT; j++) {
                const vx = velocities[j * 3];
                const vy = velocities[j * 3 + 1];
                const vz = velocities[j * 3 + 2];

                // p = точка + вектор * tau
                let px = launchPos.x + vx * tau;
                let py = launchPos.y + vy * tau;
                let pz = launchPos.z + vz * tau;

                // y -= 0.5 * 1.10 * tau^2
                py -= 0.5 * GRAVITY * tau * tau;

                positions[j * 3] = px;
                positions[j * 3 + 1] = py;
                positions[j * 3 + 2] = pz;

                // Для статистики радиуса (расстояние от центра взрыва)
                const dx = px - launchPos.x;
                const dy = py - launchPos.y;
                const dz = pz - launchPos.z;
                currentBurstRadiusSum += Math.sqrt(dx*dx + dy*dy + dz*dz);
            }

            burst.geometry.attributes.position.needsUpdate = true;
            
            // Накопление данных для __probe
            totalRadius += currentBurstRadiusSum / PARTICLE_COUNT;
            totalBright += brightness;
            activeBursts++;
        }
    });

    renderer.render(scene, camera);
};

// --- Probe API ---
window.__probe = function() {
    const objects = burstObjects.map(o => o.name);
    
    // Расчет средних значений для probe
    // Примечание: в реальном времени мы можем взять последние рассчитанные значения, 
    // но так как __step вызывается перед рендером, а __probe после, 
    // нам нужно либо хранить состояние, либо пересчитывать. 
    // Для простоты и соответствия требованию "растет tau", мы можем просто вернуть текущее время 
    // и имена объектов. Детальные r и bright требуют доступа к состоянию внутри цикла.
    // Чтобы не усложнять глобальными переменными состояния внутри цикла, 
    // сделаем легкий пересчет или сохраним последние значения в замыкании.
    // Но проще всего: __step обновляет глобальные переменные статистики.
    
    return {
        t: currentTime.toFixed(4),
        objects: objects,
        // Эти поля будут заполнены в __step через замыкание или глобальные переменные, 
        // но так как JS однопоточный, мы можем сохранить их при последнем вызове __step.
        // Однако, чтобы код был чистым, добавим переменные состояния.
        r: lastAvgRadius.toFixed(4),
        bright: lastAvgBright.toFixed(4)
    };
};

let lastAvgRadius = 0;
let lastAvgBright = 0;

// Переопределяем __step для сохранения статистики
const originalStep = window.__step;
window.__step = function(dt) {
    currentTime += dt;

    let sumRadius = 0;
    let sumBright = 0;
    let countActive = 0;

    bursts.forEach((burst) => {
        const tau = (currentTime - burst.delay) % PERIOD;
        const positions = burst.geometry.attributes.position.array;
        const velocities = burst.geometry.userData.velocities;
        const launchPos = burst.geometry.userData.launchPos;

        if (tau > LIFE_TIME) {
            burst.material.opacity = 0;
        } else {
            const brightness = Math.max(0, 1 - tau / LIFE_TIME);
            burst.material.opacity = brightness;
            sumBright += brightness;
            countActive++;

            let burstRadiusSum = 0;

            for (let j = 0; j < PARTICLE_COUNT; j++) {
                const vx = velocities[j * 3];
                const vy = velocities[j * 3 + 1];
                const vz = velocities[j * 3 + 2];

                let px = launchPos.x + vx * tau;
                let py = launchPos.y + vy * tau;
                let pz = launchPos.z + vz * tau;

                py -= 0.5 * GRAVITY * tau * tau;

                positions[j * 3] = px;
                positions[j * 3 + 1] = py;
                positions[j * 3 + 2] = pz;

                const dx = px - launchPos.x;
                const dy = py - launchPos.y;
                const dz = pz - launchPos.z;
                burstRadiusSum += Math.sqrt(dx*dx + dy*dy + dz*dz);
            }
            sumRadius += burstRadiusSum / PARTICLE_COUNT;
            burst.geometry.attributes.position.needsUpdate = true;
        }
    });

    if (countActive > 0) {
        lastAvgRadius = sumRadius / countActive;
        lastAvgBright = sumBright / countActive;
    } else {
        lastAvgRadius = 0;
        lastAvgBright = 0;
    }

    renderer.render(scene, camera);
};

// Первый рендер (t=0)
window.__step(0);
window.__ready = true;

</script>

<script>
// Сцена играет сама: драйвер измеряет окно движения (сколько шагов подряд кадр
// реально меняется), разворачивает его на несколько секунд и зацикливает
// перезагрузкой. Без этого сцена выгорает за 1-2 с и стоит, как скриншот.
// Отчёт и запись могут вмешаться сообщениями 'step', 'pause', 'play', 'reset'.
(() => {
  const DT = 1 / 60;
  const QUIET = 90;          // столько шагов без изменений — окно кончилось
  const MEASURE_CAP = 1200;  // предел замера в шагах
  const MIN_WINDOW = 4;      // короче — сцена статична, повторять нечего
  const SPAN_PER_STEP = 6;   // кадров на шаг показа (~0.1 с при 60 к/с)
  const SPAN_MIN = 240;      // показ короче 4 с сливается
  const SPAN_MAX = 600;      // ...а длиннее 10 с — затягивается
  const HOLD_MS = 900;       // пауза перед повтором
  const MEASURE_MS = 8;      // бюджет замера на кадр, чтобы не морозить вкладку

  // three.js держит render собственным свойством экземпляра (this.render =
  // render), поэтому обёртка прототипа его не видит: подменяем конструктор,
  // а render перепривязываем на самом экземпляре. Так кадр обновляется, даже
  // если страница рисует только в __probe — иначе сцена стоит, как скриншот.
  let lastRender = null;
  const wrap = () => {
    const W = window.THREE && window.THREE.WebGLRenderer;
    if (!W || W.__dbWrapped) return !!W;
    const Wrapped = function (...args) {
      const inst = new W(...args);
      const orig = inst.render.bind(inst);
      inst.render = function (scene, camera) { lastRender = [inst, scene, camera]; return orig(scene, camera); };
      return inst;
    };
    Wrapped.prototype = W.prototype;
    Object.setPrototypeOf(Wrapped, W);
    Wrapped.__dbWrapped = true;
    window.THREE.WebGLRenderer = Wrapped;
    return true;
  };
  if (!wrap()) { let n = 0; const t = setInterval(() => { if (wrap() || ++n > 1500) clearInterval(t); }, 4); }

  const step = () => { if (typeof window.__step === 'function') { try { window.__step(DT); } catch (e) {} } };
  const probe = () => { if (typeof window.__probe === 'function') { try { window.__probe(); } catch (e) {} } };
  const draw = () => { if (lastRender) { try { lastRender[0].render(lastRender[1], lastRender[2]); } catch (e) {} } };
  // Один шаг — и сразу кадр: probe зовём всегда, часть страниц рисует в нём.
  const beat = () => { step(); probe(); draw(); };

  let oc = null, ox = null;
  const sig = () => {  // дешёвая подпись кадра: 64x48 достаточно для «меняется/нет»
    try {
      const cs = document.querySelectorAll('canvas');
      if (!cs.length) return -1;
      if (!oc) { oc = document.createElement('canvas'); oc.width = 64; oc.height = 48; ox = oc.getContext('2d', {willReadFrequently: true}); }
      // Сумма по ВСЕМ canvas: у L-2 их два, первый — WebGL без
      // preserveDrawingBuffer, и подпись только по нему читалась как пустая:
      // движущаяся сцена получала freeze=0 и показывалась статичным кадром.
      let total = 0;
      for (const c of cs) {
        if (!c.width || !c.height) continue;
        ox.clearRect(0, 0, 64, 48);
        ox.drawImage(c, 0, 0, 64, 48);
        const d = ox.getImageData(0, 0, 64, 48).data;
        let s = 0;
        for (let i = 0; i < d.length; i += 4) s = (s + d[i] + d[i + 1] * 3 + d[i + 2] * 7) % 1000003;
        total = (total + s + cs.length * 7) % 1000003;
      }
      return total;
    } catch (e) { return -2; }
  };

  // Замер должен пережить перезагрузку (её использует повтор): sessionStorage,
  // а если он недоступен — window.name (оба живут в пределах вкладки).
  const KEY = 'dailybench.scene:' + location.pathname;
  const put = (v) => {
    try { sessionStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
    try { window.name = 'dbscene:' + JSON.stringify(v); } catch (e) {}
  };
  const got = () => {
    try { const v = sessionStorage.getItem(KEY); if (v) return JSON.parse(v); } catch (e) {}
    try { if (window.name.indexOf('dbscene:') === 0) return JSON.parse(window.name.slice(8)); } catch (e) {}
    return null;
  };

  let freeze = 0, span = SPAN_MAX, frames = 0, shown = 0, phase = 'measuring', holdUntil = 0, auto = true;
  const scene = {mode: 'measuring', freeze: 0, step: 0};
  // Ответы сами выставляют `window.__scene` (свой THREE.Scene) — у deepseek это
  // уже занято, и модульный скрипт ответа исполняется ПОСЛЕ этого хука. Поэтому
  // драйвер живёт под своим именем, а `__scene` остаётся странице.
  window.__dbscene = scene;
  window.__beat = beat;
  const publish = () => {   // для записи и отладки: состояние драйвера наружу
    scene.mode = phase; scene.freeze = freeze; scene.step = shown;
    // seek(n) — ручной покадровый прогон до шага n (гарантирует первый кадр)
    scene.seek = (n) => {
      auto = false;
      if (shown === 0) { beat(); shown++; }
      while (shown < (n | 0)) { beat(); shown++; }
      scene.step = shown;
      return shown;
    };
  };
  publish();

  const play = () => {
    const cache = got();
    freeze = (cache && cache.freeze | 0) || 0;
    // Окно движения разворачиваем примерно на 0.1 с на шаг: сцена из 240 шагов
    // идёт 24 с — так движение видно, а не проскакивает за пару секунд.
    span = Math.min(SPAN_MAX, Math.max(SPAN_MIN, freeze * SPAN_PER_STEP));
    phase = freeze < MIN_WINDOW ? 'static' : 'play';
    frames = 0; shown = 0;
    publish();
    if (phase === 'play') requestAnimationFrame(tick);
  };

  const tick = (now) => {
    if (phase === 'play' && auto) {
      frames++;
      const target = Math.min(freeze, Math.round(frames * freeze / span));
      while (shown < target) { beat(); shown++; }
      scene.step = shown;
      if (frames >= span) { phase = 'hold'; holdUntil = performance.now() + HOLD_MS; scene.mode = phase; }
    } else if (phase === 'hold' && auto && performance.now() >= holdUntil) {
      location.reload();  // сброса у страницы нет: повтор — только перезагрузкой
    }
    requestAnimationFrame(tick);
  };

  if (got() === null) {
    // Первый заход: дождаться кадра страницы, измерить окно движения и
    // перезагрузиться — показ пойдёт с чистого состояния, замер уже в кэше.
    const t0 = performance.now();
    let prev = null, lastChange = 0, k = 0, started = false;
    const measureFrame = () => {
      const t1 = performance.now();
      while (performance.now() - t1 < MEASURE_MS && k < MEASURE_CAP) {
        beat(); k++;
        const s = sig();
        if (s !== prev) { lastChange = k; prev = s; }
        else if (k - lastChange >= QUIET) break;
      }
      if ((k >= MEASURE_CAP || k - lastChange >= QUIET) && k > 0) {
        put({freeze: lastChange});
        location.reload();
        return;
      }
      requestAnimationFrame(measureFrame);
    };
    const wait = () => {
      if (window.__ready !== true && performance.now() - t0 < 8000) { requestAnimationFrame(wait); return; }
      probe(); draw(); prev = sig();
      if (!started) { started = true; requestAnimationFrame(measureFrame); }
    };
    requestAnimationFrame(wait);
  } else {
    play();
  }

  const resume = () => { auto = true; if (phase !== 'play') { phase = 'play'; publish(); requestAnimationFrame(tick); } };
  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { auto = false; beat(); shown++; scene.step = shown; }
    else if (cmd === 'pause') { auto = false; }
    else if (cmd === 'play') { resume(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); auto = !auto; if (auto) resume(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); auto = false; beat(); shown++; scene.step = shown; }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
