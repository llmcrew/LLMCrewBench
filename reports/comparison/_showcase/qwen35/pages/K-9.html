<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boids Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
    const THREE = window.THREE;

    // --- Configuration ---
    const CONFIG = {
        seed: 694576027,
        agentCount: 12,
        agentRadius: 0.3,
        backdropSize: 40,
        w_c: 0.4,
        w_s: 1.0,
        w_a: 0.3,
        r_sep: 2.5,
        max_speed: 2.5
    };

    // --- State ---
    let lcgState = CONFIG.seed;
    let stepsCount = 0;
    
    // Agent state: { x, y, vx, vy, mesh }
    const agents = [];

    // --- LCG Implementation ---
    function nextU() {
        // s = (1664525 * s + 1013904223) % 4294967296
        lcgState = (1664525 * lcgState + 1013904223) % 4294967296;
        return lcgState / 4294967296;
    }

    // --- Scene Setup ---
    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
    camera.position.set(0.0, 0.0, 18.0);
    camera.lookAt(0.0, 0.0, 0.0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(800, 600, false);
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(5.0, 5.0, 10.0);
    scene.add(dirLight);

    // Backdrop
    const backdropGeo = new THREE.PlaneGeometry(CONFIG.backdropSize, CONFIG.backdropSize);
    const backdropMat = new THREE.MeshStandardMaterial({ color: 0x22303f, side: THREE.DoubleSide });
    const backdrop = new THREE.Mesh(backdropGeo, backdropMat);
    backdrop.name = 'backdrop';
    backdrop.position.z = -2;
    // Rotate to face camera (default plane is XY, camera is on Z looking at origin)
    // Actually default PlaneGeometry is in XY plane. Camera is at 0,0,18 looking at 0,0,0.
    // So the plane at z=-2 facing +Z is correct.
    scene.add(backdrop);

    // Agents
    const agentGeo = new THREE.SphereGeometry(CONFIG.agentRadius, 32, 32);
    const agentMat = new THREE.MeshStandardMaterial({ color: 0xffb03a });

    for (let i = 0; i < CONFIG.agentCount; i++) {
        const mesh = new THREE.Mesh(agentGeo, agentMat);
        mesh.name = `agent-${i}`;
        scene.add(mesh);

        // Initialize state using LCG
        const u1 = nextU();
        const u2 = nextU();
        const u3 = nextU();
        const u4 = nextU();

        const x = -4 + 8 * u1;
        const y = -4 + 8 * u2;
        const vx = -1.5 + 3 * u3;
        const vy = -1.5 + 3 * u4;

        agents.push({
            x, y, vx, vy,
            mesh
        });
        
        // Set initial position
        mesh.position.set(x, y, 0);
    }

    // --- Simulation Logic ---

    window.__step = function(dt) {
        const N = CONFIG.agentCount;
        const accelerations = [];

        // 1. Calculate accelerations based on current state
        for (let i = 0; i < N; i++) {
            const p_i = new THREE.Vector2(agents[i].x, agents[i].y);
            const v_i = new THREE.Vector2(agents[i].vx, agents[i].vy);

            let sumPos = new THREE.Vector2(0, 0);
            let sumVel = new THREE.Vector2(0, 0);
            let sepForce = new THREE.Vector2(0, 0);

            for (let j = 0; j < N; j++) {
                if (i === j) continue;

                const p_j = new THREE.Vector2(agents[j].x, agents[j].y);
                const v_j = new THREE.Vector2(agents[j].vx, agents[j].vy);

                // Cohesion & Alignment sums
                sumPos.add(p_j);
                sumVel.add(v_j);

                // Separation
                const diff = new THREE.Vector2().subVectors(p_i, p_j);
                const dist = diff.length();

                if (dist > 0 && dist < CONFIG.r_sep) {
                    // (p_i - p_j) / |p_i - p_j|
                    const sepVec = diff.normalize();
                    sepForce.add(sepVec);
                }
            }

            const com_i = sumPos.divideScalar(N - 1);
            const avg_i = sumVel.divideScalar(N - 1);

            // a_i = w_c*(com_i - p_i) + w_s*sep_i + w_a*(avg_i - v_i)
            const cohesion = new THREE.Vector2().subVectors(com_i, p_i).multiplyScalar(CONFIG.w_c);
            const separation = sepForce.multiplyScalar(CONFIG.w_s);
            const alignment = new THREE.Vector2().subVectors(avg_i, v_i).multiplyScalar(CONFIG.w_a);

            const a_i = new THREE.Vector2().addVectors(cohesion, separation).add(alignment);
            accelerations.push(a_i);
        }

        // 2. Update velocities and positions
        for (let i = 0; i < N; i++) {
            const v = new THREE.Vector2(agents[i].vx, agents[i].vy);
            const a = accelerations[i];

            // v_i += a_i * dt
            v.add(a.multiplyScalar(dt));

            // Clamp speed
            if (v.length() > CONFIG.max_speed) {
                v.normalize().multiplyScalar(CONFIG.max_speed);
            }

            // p_i += v_i * dt
            const p = new THREE.Vector2(agents[i].x, agents[i].y);
            p.add(v.multiplyScalar(dt));

            // Update state
            agents[i].vx = v.x;
            agents[i].vy = v.y;
            agents[i].x = p.x;
            agents[i].y = p.y;

            // Update mesh
            agents[i].mesh.position.set(p.x, p.y, 0);
        }

        stepsCount++;
        renderer.render(scene, camera);
    };

    // --- Probe ---

    window.__probe = function() {
        const agentData = agents.map(a => ({
            x: parseFloat(a.x.toFixed(4)),
            y: parseFloat(a.y.toFixed(4)),
            vx: parseFloat(a.vx.toFixed(4)),
            vy: parseFloat(a.vy.toFixed(4))
        }));

        const objectNames = ['backdrop'];
        for (let i = 0; i < CONFIG.agentCount; i++) {
            objectNames.push(`agent-${i}`);
        }

        return {
            steps: stepsCount,
            agents: agentData,
            camera: [
                parseFloat(camera.position.x.toFixed(4)),
                parseFloat(camera.position.y.toFixed(4)),
                parseFloat(camera.position.z.toFixed(4))
            ],
            objects: objectNames
        };
    };

    // --- Initial Render & Ready ---
    renderer.render(scene, camera);
    window.__ready = true;

</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
