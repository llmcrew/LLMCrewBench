<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Galaxy Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// --- Configuration & Constants ---
const SEED = 800660;
const WIDTH = 800;
const HEIGHT = 600;
const FOV = 45;
const ASPECT = WIDTH / HEIGHT;
const NEAR = 0.1;
const FAR = 200;
const CAMERA_Z = 10.0;

// Colors
const COLOR_CORE = new THREE.Color('#ffbf00');
const COLOR_ARM = new THREE.Color('#ff0080');
const COLOR_EDGE = new THREE.Color('#0cb7f0');
const COLOR_SKY = new THREE.Color('#1d1638');

// Counts
const COUNT_ARMS = 7000;
const COUNT_CORE = 2500;
const COUNT_HALO = 1500;

// --- LCG Random Generator ---
class LCG {
    constructor(seed) {
        this.s = seed >>> 0;
    }
    next() {
        this.s = (1664525 * this.s + 1013904223) >>> 0;
        return this.s / 4294967296;
    }
}

// --- Global State ---
let scene, camera, renderer;
let starsCore, starsArm, starsEdge, coreGlow;
let time = 0;
let spin = 0;
const rng = new LCG(SEED);

// --- Geometry Generation ---

function createCoreTexture() {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    gradient.addColorStop(0, '#ffbf00');
    gradient.addColorStop(0.4, '#ff8800');
    gradient.addColorStop(1, 'rgba(255, 191, 0, 0)');
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    
    const texture = new THREE.CanvasTexture(canvas);
    return texture;
}

function generateGalaxy() {
    // Calculate Galaxy Radius based on camera parameters
    // half-height at distance 10 with FOV 45:
    // tan(FOV/2) = tan(22.5) ≈ 0.4142
    // halfHeight = 10 * tan(22.5) ≈ 4.142
    const halfHeight = CAMERA_Z * Math.tan(THREE.MathUtils.degToRad(FOV) / 2);
    const R = 0.44 * halfHeight;

    // --- 1. Arms (7000 points) ---
    const armGeo = new THREE.BufferGeometry();
    const armPos = new Float32Array(COUNT_ARMS * 3);
    const armCol = new Float32Array(COUNT_ARMS * 3);
    const armData = []; // Store r for animation

    for (let i = 0; i < COUNT_ARMS; i++) {
        const u = rng.next();
        const v = rng.next();
        const w = rng.next();
        const g = rng.next(); // u1+u2+u3-1.5 logic is abstracted as just a random input here per prompt "four numbers in a row"

        const q = 0.14 + 0.86 * Math.pow(u, 0.62);
        const r = 0.44 * halfHeight * q;
        
        // Two branches: floor(v * 2) gives 0 or 1
        const branchOffset = Math.floor(v * 2) * Math.PI;
        const twist = g * 0.50 * (1 - 0.45 * q);
        const theta = 1.60 * 2 * Math.PI * q + branchOffset + twist;

        const z = (w - 0.5) * 0.10 * r * (0.4 + q);

        const x = r * Math.cos(theta);
        const y = r * Math.sin(theta);

        armPos[i * 3] = x;
        armPos[i * 3 + 1] = y;
        armPos[i * 3 + 2] = z;

        // Color based on q
        let color;
        if (q <= 0.38) {
            color = COLOR_CORE;
        } else if (q <= 0.70) {
            color = COLOR_ARM;
        } else {
            color = COLOR_EDGE;
        }
        armCol[i * 3] = color.r;
        armCol[i * 3 + 1] = color.g;
        armCol[i * 3 + 2] = color.b;

        armData.push({ r: r, index: i });
    }

    armGeo.setAttribute('position', new THREE.BufferAttribute(armPos, 3));
    armGeo.setAttribute('color', new THREE.BufferAttribute(armCol, 3));
    
    starsArm = new THREE.Points(armGeo, new THREE.PointsMaterial({
        size: 2.8,
        sizeAttenuation: false,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthTest: false,
        vertexColors: true
    }));
    starsArm.name = 'stars_arm';
    starsArm.userData = { type: 'arm', data: armData, R: R };

    // --- 2. Core (2500 points) ---
    const coreGeo = new THREE.BufferGeometry();
    const corePos = new Float32Array(COUNT_CORE * 3);
    const coreCol = new Float32Array(COUNT_CORE * 3);
    const coreData = [];

    for (let i = 0; i < COUNT_CORE; i++) {
        const u = rng.next();
        const a = 2 * Math.PI * u;
        // Note: prompt says r = 0.22 * R * u^0.55. 
        // But u is used for angle too. Need another random for radius? 
        // Prompt says: "2500 points core-cluster (a = 2*pi*u, r = 0.22 * R * u^0.55...)"
        // This implies reusing u or taking next. Usually in these tasks, if variables are listed sequentially, they might imply sequential RNG calls or reusing.
        // Given "four numbers in a row" for arms, let's assume standard sequential consumption.
        // However, the formula uses 'u' for both angle and radius power. 
        // Let's assume we need a new random for radius if 'u' was consumed for angle, OR 'u' is the same variable.
        // Re-reading: "For each point take four numbers... then...". For core: "(a=..., r=...)".
        // It likely means: take u, calculate a. Take next u (let's call it u2), calculate r.
        // Let's stick to strict sequential consumption to ensure determinism matches expected "noise".
        
        const u_rad = rng.next(); 
        const r = 0.22 * R * Math.pow(u_rad, 0.55);
        const w = rng.next();
        const z = (w - 0.5) * 0.09 * R;

        const x = r * Math.cos(a);
        const y = r * Math.sin(a);

        corePos[i * 3] = x;
        corePos[i * 3 + 1] = y;
        corePos[i * 3 + 2] = z;

        coreCol[i * 3] = COLOR_CORE.r;
        coreCol[i * 3 + 1] = COLOR_CORE.g;
        coreCol[i * 3 + 2] = COLOR_CORE.b;

        coreData.push({ r: r, index: i });
    }

    coreGeo.setAttribute('position', new THREE.BufferAttribute(corePos, 3));
    coreGeo.setAttribute('color', new THREE.BufferAttribute(coreCol, 3));

    starsCore = new THREE.Points(coreGeo, new THREE.PointsMaterial({
        size: 3.2,
        sizeAttenuation: false,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthTest: false,
        vertexColors: true
    }));
    starsCore.name = 'stars_core';
    starsCore.userData = { type: 'core', data: coreData, R: R };

    // --- 3. Halo (1500 points) ---
    const haloGeo = new THREE.BufferGeometry();
    const haloPos = new Float32Array(COUNT_HALO * 3);
    const haloCol = new Float32Array(COUNT_HALO * 3);
    const haloData = [];

    for (let i = 0; i < COUNT_HALO; i++) {
        const u = rng.next();
        const u2 = rng.next(); // for angle
        
        const r = R * (0.60 + 0.85 * u);
        const a = 2 * Math.PI * u2;
        // Halo is usually flat or slightly puffed, prompt doesn't specify Z for halo, assuming flat disk or minimal Z
        // "dust halo on periphery". Let's give it slight Z spread similar to arms but wider or just flat.
        // Prompt doesn't give Z formula for halo. Assuming z=0 or small random. 
        // Let's use a small random Z to make it 3D.
        const w = rng.next();
        const z = (w - 0.5) * 0.15 * R; 

        const x = r * Math.cos(a);
        const y = r * Math.sin(a);

        haloPos[i * 3] = x;
        haloPos[i * 3 + 1] = y;
        haloPos[i * 3 + 2] = z;

        haloCol[i * 3] = COLOR_EDGE.r;
        haloCol[i * 3 + 1] = COLOR_EDGE.g;
        haloCol[i * 3 + 2] = COLOR_EDGE.b;

        haloData.push({ r: r, index: i });
    }

    haloGeo.setAttribute('position', new THREE.BufferAttribute(haloPos, 3));
    haloGeo.setAttribute('color', new THREE.BufferAttribute(haloCol, 3));

    starsEdge = new THREE.Points(haloGeo, new THREE.PointsMaterial({
        size: 2.4,
        sizeAttenuation: false,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthTest: false,
        vertexColors: true
    }));
    starsEdge.name = 'stars_edge';
    starsEdge.userData = { type: 'edge', data: haloData, R: R };

    // --- 4. Core Glow ---
    const glowGeo = new THREE.PlaneGeometry(0.55 * R, 0.55 * R);
    const glowMat = new THREE.MeshBasicMaterial({
        map: createCoreTexture(),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthTest: false,
        opacity: 0.8
    });
    coreGlow = new THREE.Mesh(glowGeo, glowMat);
    coreGlow.name = 'core_glow';
    coreGlow.rotation.x = -Math.PI / 2; // Face camera if camera is looking down, but camera is at (0,0,10) looking at (0,0,0).
    // Galaxy is "flat" (plasmia). Usually means in XY plane. Camera looks down Z.
    // So PlaneGeometry needs to be in XY plane. Default PlaneGeometry is in XY.
    // So no rotation needed if camera is at Z looking at origin.
    coreGlow.rotation.x = 0; 
    coreGlow.rotation.y = 0;
}

// --- Initialization ---

function init() {
    // Scene
    scene = new THREE.Scene();
    scene.background = COLOR_SKY;

    // Camera
    camera = new THREE.PerspectiveCamera(FOV, ASPECT, NEAR, FAR);
    camera.position.set(0, 0, CAMERA_Z);
    camera.lookAt(0, 0, 0);

    // Renderer
    renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(WIDTH, HEIGHT, false);
    document.body.appendChild(renderer.domElement);

    // Generate Objects
    generateGalaxy();

    scene.add(starsCore);
    scene.add(starsArm);
    scene.add(starsEdge);
    scene.add(coreGlow);

    // Initial Render
    renderer.render(scene, camera);
    window.__ready = true;
}

// --- Animation Logic ---

function updateRotation(dt) {
    const updatePoints = (pointsObj) => {
        const positions = pointsObj.geometry.attributes.position.array;
        const data = pointsObj.userData.data;
        const R = pointsObj.userData.R;

        for (let i = 0; i < data.length; i++) {
            const item = data[i];
            const r = item.r;
            const idx = item.index * 3;
            
            // Current angle from position
            // x = r * cos(theta), y = r * sin(theta)
            // We need to update theta.
            // Formula: theta += 0.55 * dt / (0.25 + r/R)
            
            // To avoid accumulating float errors or recalculating atan2 every frame (slow),
            // we can store current angle in userData or recalculate. 
            // Given strict determinism requirements, recalculating from position is risky due to float drift.
            // Better: Store initial theta in data during generation.
            
            if (item.initialTheta === undefined) {
                item.initialTheta = Math.atan2(positions[idx + 1], positions[idx]);
            }
            
            // Accumulate spin based on global time or per-step?
            // Prompt: "time t grows by dt". "theta += ...".
            // We need to track total rotation for each point.
            if (item.totalRotation === undefined) item.totalRotation = 0;
            
            const speedFactor = 0.55 / (0.25 + r / R);
            item.totalRotation += speedFactor * dt;
            
            const newTheta = item.initialTheta + item.totalRotation;
            
            // We also need to preserve Z.
            const z = positions[idx + 2];
            
            positions[idx] = r * Math.cos(newTheta);
            positions[idx + 1] = r * Math.sin(newTheta);
            // Z remains constant relative to the point's local logic, but prompt says "thin disk", Z is fixed per point generation.
        }
        pointsObj.geometry.attributes.position.needsUpdate = true;
    };

    updatePoints(starsCore);
    updatePoints(starsArm);
    updatePoints(starsEdge);
    
    // Core glow doesn't rotate in this specific differential model usually, 
    // but if it's part of the disk, it might. Prompt says "disk rotates". 
    // Glow is "core cluster". Let's rotate it slowly or not at all. 
    // Usually core glow is static or slow. Let's leave it static or match core speed.
    // Given "differential rotation", center moves fastest. 
    // Let's rotate the glow mesh slightly to match visual flow, or keep static as a background glow.
    // Prompt: "disk rotates". Glow is "core cluster". Let's rotate it.
    // Speed at r=0 is 0.55/0.25 = 2.2 rad/s.
    if (coreGlow.userData.totalRotation === undefined) coreGlow.userData.totalRotation = 0;
    coreGlow.userData.totalRotation += (0.55 / 0.25) * dt;
    coreGlow.rotation.z = -coreGlow.userData.totalRotation; // Rotate around Z
}

window.__step = function(dt) {
    time += dt;
    spin += 0.55 * dt;
    updateRotation(dt);
    renderer.render(scene, camera);
    return window.__probe();
};

window.__probe = function() {
    // Calculate rings for probe
    // 4 ring zones of radius. 
    // R is approx 1.8 (0.44 * 4.14).
    // Let's define zones: 0-0.25R, 0.25-0.5R, 0.5-0.75R, 0.75-R+
    const R = 0.44 * (CAMERA_Z * Math.tan(THREE.MathUtils.degToRad(FOV) / 2));
    const zones = [0, 0, 0, 0];
    
    const countInZones = (pointsObj) => {
        const data = pointsObj.userData.data;
        data.forEach(item => {
            const r = item.r;
            if (r < 0.25 * R) zones[0]++;
            else if (r < 0.5 * R) zones[1]++;
            else if (r < 0.75 * R) zones[2]++;
            else zones[3]++;
        });
    };

    countInZones(starsCore);
    countInZones(starsArm);
    countInZones(starsEdge);

    return {
        t: time.toFixed(4),
        spin: spin,
        objects: ['stars_core', 'stars_arm', 'stars_edge', 'core_glow'],
        rings: zones
    };
};

// Start
init();

</script>

<script>
// Сцена играет сама: драйвер измеряет окно движения (сколько шагов подряд кадр
// реально меняется), разворачивает его на несколько секунд и зацикливает
// перезагрузкой. Без этого сцена выгорает за 1-2 с и стоит, как скриншот.
// Отчёт и запись могут вмешаться сообщениями 'step', 'pause', 'play', 'reset'.
(() => {
  const DT = 1 / 60;
  const QUIET = 90;          // столько шагов без изменений — окно кончилось
  const MEASURE_CAP = 1200;  // предел замера в шагах
  const MIN_WINDOW = 4;      // короче — сцена статична, повторять нечего
  const SPAN_PER_STEP = 6;   // кадров на шаг показа (~0.1 с при 60 к/с)
  const SPAN_MIN = 240;      // показ короче 4 с сливается
  const SPAN_MAX = 600;      // ...а длиннее 10 с — затягивается
  const HOLD_MS = 900;       // пауза перед повтором
  const MEASURE_MS = 8;      // бюджет замера на кадр, чтобы не морозить вкладку

  // three.js держит render собственным свойством экземпляра (this.render =
  // render), поэтому обёртка прототипа его не видит: подменяем конструктор,
  // а render перепривязываем на самом экземпляре. Так кадр обновляется, даже
  // если страница рисует только в __probe — иначе сцена стоит, как скриншот.
  let lastRender = null;
  const wrap = () => {
    const W = window.THREE && window.THREE.WebGLRenderer;
    if (!W || W.__dbWrapped) return !!W;
    const Wrapped = function (...args) {
      const inst = new W(...args);
      const orig = inst.render.bind(inst);
      inst.render = function (scene, camera) { lastRender = [inst, scene, camera]; return orig(scene, camera); };
      return inst;
    };
    Wrapped.prototype = W.prototype;
    Object.setPrototypeOf(Wrapped, W);
    Wrapped.__dbWrapped = true;
    window.THREE.WebGLRenderer = Wrapped;
    return true;
  };
  if (!wrap()) { let n = 0; const t = setInterval(() => { if (wrap() || ++n > 1500) clearInterval(t); }, 4); }

  const step = () => { if (typeof window.__step === 'function') { try { window.__step(DT); } catch (e) {} } };
  const probe = () => { if (typeof window.__probe === 'function') { try { window.__probe(); } catch (e) {} } };
  const draw = () => { if (lastRender) { try { lastRender[0].render(lastRender[1], lastRender[2]); } catch (e) {} } };
  // Один шаг — и сразу кадр: probe зовём всегда, часть страниц рисует в нём.
  const beat = () => { step(); probe(); draw(); };

  let oc = null, ox = null;
  const sig = () => {  // дешёвая подпись кадра: 64x48 достаточно для «меняется/нет»
    try {
      const cs = document.querySelectorAll('canvas');
      if (!cs.length) return -1;
      if (!oc) { oc = document.createElement('canvas'); oc.width = 64; oc.height = 48; ox = oc.getContext('2d', {willReadFrequently: true}); }
      // Сумма по ВСЕМ canvas: у L-2 их два, первый — WebGL без
      // preserveDrawingBuffer, и подпись только по нему читалась как пустая:
      // движущаяся сцена получала freeze=0 и показывалась статичным кадром.
      let total = 0;
      for (const c of cs) {
        if (!c.width || !c.height) continue;
        ox.clearRect(0, 0, 64, 48);
        ox.drawImage(c, 0, 0, 64, 48);
        const d = ox.getImageData(0, 0, 64, 48).data;
        let s = 0;
        for (let i = 0; i < d.length; i += 4) s = (s + d[i] + d[i + 1] * 3 + d[i + 2] * 7) % 1000003;
        total = (total + s + cs.length * 7) % 1000003;
      }
      return total;
    } catch (e) { return -2; }
  };

  // Замер должен пережить перезагрузку (её использует повтор): sessionStorage,
  // а если он недоступен — window.name (оба живут в пределах вкладки).
  const KEY = 'dailybench.scene:' + location.pathname;
  const put = (v) => {
    try { sessionStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
    try { window.name = 'dbscene:' + JSON.stringify(v); } catch (e) {}
  };
  const got = () => {
    try { const v = sessionStorage.getItem(KEY); if (v) return JSON.parse(v); } catch (e) {}
    try { if (window.name.indexOf('dbscene:') === 0) return JSON.parse(window.name.slice(8)); } catch (e) {}
    return null;
  };

  let freeze = 0, span = SPAN_MAX, frames = 0, shown = 0, phase = 'measuring', holdUntil = 0, auto = true;
  const scene = {mode: 'measuring', freeze: 0, step: 0};
  // Ответы сами выставляют `window.__scene` (свой THREE.Scene) — у deepseek это
  // уже занято, и модульный скрипт ответа исполняется ПОСЛЕ этого хука. Поэтому
  // драйвер живёт под своим именем, а `__scene` остаётся странице.
  window.__dbscene = scene;
  window.__beat = beat;
  const publish = () => {   // для записи и отладки: состояние драйвера наружу
    scene.mode = phase; scene.freeze = freeze; scene.step = shown;
    // seek(n) — ручной покадровый прогон до шага n (гарантирует первый кадр)
    scene.seek = (n) => {
      auto = false;
      if (shown === 0) { beat(); shown++; }
      while (shown < (n | 0)) { beat(); shown++; }
      scene.step = shown;
      return shown;
    };
  };
  publish();

  const play = () => {
    const cache = got();
    freeze = (cache && cache.freeze | 0) || 0;
    // Окно движения разворачиваем примерно на 0.1 с на шаг: сцена из 240 шагов
    // идёт 24 с — так движение видно, а не проскакивает за пару секунд.
    span = Math.min(SPAN_MAX, Math.max(SPAN_MIN, freeze * SPAN_PER_STEP));
    phase = freeze < MIN_WINDOW ? 'static' : 'play';
    frames = 0; shown = 0;
    publish();
    if (phase === 'play') requestAnimationFrame(tick);
  };

  const tick = (now) => {
    if (phase === 'play' && auto) {
      frames++;
      const target = Math.min(freeze, Math.round(frames * freeze / span));
      while (shown < target) { beat(); shown++; }
      scene.step = shown;
      if (frames >= span) { phase = 'hold'; holdUntil = performance.now() + HOLD_MS; scene.mode = phase; }
    } else if (phase === 'hold' && auto && performance.now() >= holdUntil) {
      location.reload();  // сброса у страницы нет: повтор — только перезагрузкой
    }
    requestAnimationFrame(tick);
  };

  if (got() === null) {
    // Первый заход: дождаться кадра страницы, измерить окно движения и
    // перезагрузиться — показ пойдёт с чистого состояния, замер уже в кэше.
    const t0 = performance.now();
    let prev = null, lastChange = 0, k = 0, started = false;
    const measureFrame = () => {
      const t1 = performance.now();
      while (performance.now() - t1 < MEASURE_MS && k < MEASURE_CAP) {
        beat(); k++;
        const s = sig();
        if (s !== prev) { lastChange = k; prev = s; }
        else if (k - lastChange >= QUIET) break;
      }
      if ((k >= MEASURE_CAP || k - lastChange >= QUIET) && k > 0) {
        put({freeze: lastChange});
        location.reload();
        return;
      }
      requestAnimationFrame(measureFrame);
    };
    const wait = () => {
      if (window.__ready !== true && performance.now() - t0 < 8000) { requestAnimationFrame(wait); return; }
      probe(); draw(); prev = sig();
      if (!started) { started = true; requestAnimationFrame(measureFrame); }
    };
    requestAnimationFrame(wait);
  } else {
    play();
  }

  const resume = () => { auto = true; if (phase !== 'play') { phase = 'play'; publish(); requestAnimationFrame(tick); } };
  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { auto = false; beat(); shown++; scene.step = shown; }
    else if (cmd === 'pause') { auto = false; }
    else if (cmd === 'play') { resume(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); auto = !auto; if (auto) resume(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); auto = false; beat(); shown++; scene.step = shown; }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>

  const fit = () => {
    const canvas = document.querySelector('canvas');
    if (!canvas) return;
    const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.documentElement.style.zoom = k === 1 ? '' : String(k);
    document.body.style.overflow = 'hidden';
