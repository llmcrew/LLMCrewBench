<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Космическая заправка</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// --- LCG Implementation ---
let lcg = 865521;
function rnd() {
    lcg = (lcg * 1103515245 + 12345) % 2147483648;
    return lcg / 2147483648;
}

// --- Scene Setup ---
const scene = new THREE.Scene();
// Camera starts at (0, 0, 4) looking at (0, 0, -1)
const camera = new THREE.PerspectiveCamera(60, 800 / 600, 0.1, 100);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, -1);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setSize(800, 600, false);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

// --- Colors ---
const C_STATION = 0x241644;
const C_CYAN = 0x35d5e6;
const C_AMBER = 0xffb347;
const C_FOG = 0xa8c8dc;

// --- Helpers ---
const objects = [];
const fov = 60 * Math.PI / 180;

// Map screen u,v (0..1) to world X,Y at specific Z
// Camera is at z=4.
function getWorldPos(u, v, z) {
    const d = 4 - z;
    const h = 2 * d * Math.tan(fov / 2);
    const w = h * (800 / 600);
    const x = (u - 0.5) * w;
    const y = (0.5 - v) * h;
    return { x, y, w, h };
}

// --- 1. Night & Hull ---
// Night z = -45
const nightGeo = new THREE.PlaneGeometry(100, 100);
const nightMat = new THREE.MeshBasicMaterial({ color: C_STATION });
const night = new THREE.Mesh(nightGeo, nightMat);
night.position.z = -45;
scene.add(night);
objects.push('night');

// Hull z = -18
const hullMat = new THREE.MeshBasicMaterial({ color: C_STATION });
const hull = new THREE.Mesh(nightGeo, hullMat);
hull.position.z = -18;
scene.add(hull);
objects.push('hull');

// --- 2. Platform (Pad) ---
// u=0.52, v=0.62, size 0.52x0.10 frame.
// Placed at z = -5 (behind drops at -3.9, in front of hull)
const padZ = -5;
const padData = getWorldPos(0.52, 0.62, padZ);
const padW = 0.52 * padData.w;
const padH = 0.10 * padData.h;

const padBaseGeo = new THREE.BoxGeometry(padW, 0.1, padH);
const padBaseMat = new THREE.MeshBasicMaterial({ color: C_STATION });
const padBase = new THREE.Mesh(padBaseGeo, padBaseMat);

const padTopGeo = new THREE.PlaneGeometry(padW, padH);
const padTopMat = new THREE.MeshBasicMaterial({ color: C_CYAN, transparent: true, opacity: 0.5 });
const padTop = new THREE.Mesh(padTopGeo, padTopMat);
padTop.rotation.x = -Math.PI / 2;
padTop.position.y = 0.05;

const padGroup = new THREE.Group();
padGroup.add(padBase);
padGroup.add(padTop);
padGroup.position.set(padData.x, padData.y, padZ);
scene.add(padGroup);
objects.push('pad');

// --- 3. Rover ---
// u=0.55, v=0.55. On platform.
const roverZ = padZ;
const roverData = getWorldPos(0.55, 0.55, roverZ);
const roverGroup = new THREE.Group();
roverGroup.position.set(roverData.x, roverData.y, roverZ);

// Body (0.60 height)
const bodyGeo = new THREE.BoxGeometry(0.8, 0.6, 1.2);
const bodyMat = new THREE.MeshBasicMaterial({ color: C_STATION });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.3;

// Cabin (0.30 height)
const cabinGeo = new THREE.BoxGeometry(0.6, 0.3, 0.8);
const cabinMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
const cabin = new THREE.Mesh(cabinGeo, cabinMat);
cabin.position.y = 0.6 + 0.15;

// Wheels (2x #241644)
const wheelGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.1, 16);
wheelGeo.rotateZ(Math.PI / 2);
const wheelMat = new THREE.MeshBasicMaterial({ color: C_STATION });
const w1 = new THREE.Mesh(wheelGeo, wheelMat);
w1.position.set(-0.4, 0.2, 0.5);
const w2 = new THREE.Mesh(wheelGeo, wheelMat);
w2.position.set(-0.4, 0.2, -0.5);

// Lights (3x #ffb347, 0.10 width)
const lightGeo = new THREE.BoxGeometry(0.1, 0.05, 0.05);
const lightMat = new THREE.MeshBasicMaterial({ color: C_AMBER });
const l1 = new THREE.Mesh(lightGeo, lightMat);
l1.position.set(0.4, 0.3, 0.4);
const l2 = new THREE.Mesh(lightGeo, lightMat);
l2.position.set(0.4, 0.3, 0);
const l3 = new THREE.Mesh(lightGeo, lightMat);
l3.position.set(0.4, 0.3, -0.4);

roverGroup.add(body, cabin, w1, w2, l1, l2, l3);
scene.add(roverGroup);
objects.push('rover');

// --- 4. Tower ---
// u=0.25, v=0.30, 0.05x0.46 frame.
const towerZ = -6;
const towerData = getWorldPos(0.25, 0.30, towerZ);
const towerW = 0.05 * towerData.w;
const towerH = 0.46 * towerData.h;

const towerGeo = new THREE.BoxGeometry(towerW, towerH, towerW);
const towerMat = new THREE.MeshBasicMaterial({ color: C_STATION });
const tower = new THREE.Mesh(towerGeo, towerMat);
tower.position.set(towerData.x, towerData.y, towerZ);
scene.add(tower);
objects.push('tower');

// Hose (#35d5e6, 0.02 width, curved arc of 3 segments)
const hosePoints = [];
// Start: Tower side
hosePoints.push(new THREE.Vector3(towerData.x + towerW/2, towerData.y + towerH*0.2, towerZ));
// Control 1
hosePoints.push(new THREE.Vector3(towerData.x + towerW*2, towerData.y + towerH*0.2, towerZ - 1));
// Control 2
hosePoints.push(new THREE.Vector3(roverData.x - 0.5, roverData.y + 0.5, roverZ - 1));
// End: Rover
hosePoints.push(new THREE.Vector3(roverData.x, roverData.y + 0.5, roverZ));

const hoseCurve = new THREE.CatmullRomCurve3(hosePoints);
const hoseGeo = new THREE.TubeGeometry(hoseCurve, 20, 0.02 * towerData.w, 8, false);
const hoseMat = new THREE.MeshBasicMaterial({ color: C_CYAN });
const hose = new THREE.Mesh(hoseGeo, hoseMat);
scene.add(hose);
objects.push('hose');

// --- 5. Holograms ---
// 3 cyan panels behind tower (0.09x0.12 frame, v=0.28)
const holoZ = -7;
const holoData = getWorldPos(0.25, 0.28, holoZ); // Aligned with tower u
const holoW = 0.09 * holoData.w;
const holoH = 0.12 * holoData.h;
const holoMat = new THREE.MeshBasicMaterial({ color: C_CYAN, transparent: true, opacity: 0.6, side: THREE.DoubleSide });

for (let i = 0; i < 3; i++) {
    const holo = new THREE.Mesh(new THREE.PlaneGeometry(holoW, holoH), holoMat);
    holo.position.set(holoData.x + (i - 1) * 0.15, holoData.y, holoZ);
    scene.add(holo);
    objects.push(`holo_${i}`);
}

// --- 6. Fog ---
// Two layers: v=0.72 and v=0.44. Opacity 0.27. Color #a8c8dc.
// Placed at Z = -4.0 (behind drops at -3.9)
const fogZ = -4.0;
const fogData = getWorldPos(0.5, 0.5, fogZ);
const fogW = fogData.w;
const fogH = fogData.h;
const bandH = 0.05 * fogH; // Thin bands

const fogMat = new THREE.MeshBasicMaterial({ color: C_FOG, transparent: true, opacity: 0.27 });

const fog1 = new THREE.Mesh(new THREE.PlaneGeometry(fogW, bandH), fogMat);
fog1.position.set(0, (0.5 - 0.72) * fogH, fogZ);
scene.add(fog1);
objects.push('fog1');

const fog2 = new THREE.Mesh(new THREE.PlaneGeometry(fogW, bandH), fogMat);
fog2.position.set(0, (0.5 - 0.44) * fogH, fogZ);
scene.add(fog2);
objects.push('fog2');

// --- 7. Drops ---
// 76 drops #a8c8dc, z=-3.9, size 6 px.
const dropZ = -3.9;
const dropData = getWorldPos(0.5, 0.5, dropZ);
// sizeAttenuation: false means size is in pixels
const dropsGeo = new THREE.BufferGeometry();
const dropPositions = new Float32Array(76 * 3);

for (let i = 0; i < 76; i++) {
    dropPositions[i * 3] = (rnd() - 0.5) * dropData.w;
    dropPositions[i * 3 + 1] = (rnd() - 0.5) * dropData.h;
    dropPositions[i * 3 + 2] = dropZ;
}
dropsGeo.setAttribute('position', new THREE.BufferAttribute(dropPositions, 3));
const dropsMat = new THREE.PointsMaterial({ color: C_FOG, size: 6, sizeAttenuation: false });
const drops = new THREE.Points(dropsGeo, dropsMat);
scene.add(drops);
objects.push('drops');

// --- Animation State ---
let time = 0;

window.__step = function(dt) {
    time += dt;

    // Camera Orbit
    // x oscillates 0.7 units, freq 0.25
    const camX = 0.7 * Math.sin(2 * Math.PI * 0.25 * time);
    // z decreases 1.58 units/s until 2.0. Start 4.
    let camZ = 4 - 1.58 * time;
    if (camZ < 2.0) camZ = 2.0;

    camera.position.set(camX, 0, camZ);
    // LookAt offset 0.3 left (-0.3)
    camera.lookAt(-0.3, 0, -1);

    // Drops Animation
    const positions = drops.geometry.attributes.position.array;
    const limitY = -dropData.h / 2 - 1;
    for (let i = 0; i < 76; i++) {
        positions[i * 3 + 1] -= 2.20 * dt;
        if (positions[i * 3 + 1] < limitY) {
            positions[i * 3 + 1] = dropData.h / 2 + 1;
            positions[i * 3] = (rnd() - 0.5) * dropData.w;
        }
    }
    drops.geometry.attributes.position.needsUpdate = true;

    // Neon Blink (Pad Opacity)
    // Base 0.5, blinking
    const blink = 0.5 + 0.5 * Math.sin(time * 5);
    padTopMat.opacity = 0.5 * blink;

    renderer.render(scene, camera);

    return window.__probe();
};

window.__probe = function() {
    return {
        t: parseFloat(time.toFixed(4)),
        objects: objects,
        camera: [parseFloat(camera.position.x.toFixed(4)), parseFloat(camera.position.z.toFixed(4))],
        pad: parseFloat(padTopMat.opacity.toFixed(4))
    };
};

window.__ready = true;
// Initial render
window.__step(0);

</script>

<script>
// Сцена играет сама: драйвер измеряет окно движения (сколько шагов подряд кадр
// реально меняется), разворачивает его на несколько секунд и зацикливает
// перезагрузкой. Без этого сцена выгорает за 1-2 с и стоит, как скриншот.
// Отчёт и запись могут вмешаться сообщениями 'step', 'pause', 'play', 'reset'.
(() => {
  const DT = 1 / 60;
  const QUIET = 90;          // столько шагов без изменений — окно кончилось
  const MEASURE_CAP = 1200;  // предел замера в шагах
  const MIN_WINDOW = 4;      // короче — сцена статична, повторять нечего
  const SPAN_PER_STEP = 6;   // кадров на шаг показа (~0.1 с при 60 к/с)
  const SPAN_MIN = 240;      // показ короче 4 с сливается
  const SPAN_MAX = 600;      // ...а длиннее 10 с — затягивается
  const HOLD_MS = 900;       // пауза перед повтором
  const MEASURE_MS = 8;      // бюджет замера на кадр, чтобы не морозить вкладку

  // three.js держит render собственным свойством экземпляра (this.render =
  // render), поэтому обёртка прототипа его не видит: подменяем конструктор,
  // а render перепривязываем на самом экземпляре. Так кадр обновляется, даже
  // если страница рисует только в __probe — иначе сцена стоит, как скриншот.
  let lastRender = null;
  const wrap = () => {
    const W = window.THREE && window.THREE.WebGLRenderer;
    if (!W || W.__dbWrapped) return !!W;
    const Wrapped = function (...args) {
      const inst = new W(...args);
      const orig = inst.render.bind(inst);
      inst.render = function (scene, camera) { lastRender = [inst, scene, camera]; return orig(scene, camera); };
      return inst;
    };
    Wrapped.prototype = W.prototype;
    Object.setPrototypeOf(Wrapped, W);
    Wrapped.__dbWrapped = true;
    window.THREE.WebGLRenderer = Wrapped;
    return true;
  };
  if (!wrap()) { let n = 0; const t = setInterval(() => { if (wrap() || ++n > 1500) clearInterval(t); }, 4); }

  const step = () => { if (typeof window.__step === 'function') { try { window.__step(DT); } catch (e) {} } };
  const probe = () => { if (typeof window.__probe === 'function') { try { window.__probe(); } catch (e) {} } };
  const draw = () => { if (lastRender) { try { lastRender[0].render(lastRender[1], lastRender[2]); } catch (e) {} } };
  // Один шаг — и сразу кадр: probe зовём всегда, часть страниц рисует в нём.
  const beat = () => { step(); probe(); draw(); };

  let oc = null, ox = null;
  const sig = () => {  // дешёвая подпись кадра: 64x48 достаточно для «меняется/нет»
    try {
      const cs = document.querySelectorAll('canvas');
      if (!cs.length) return -1;
      if (!oc) { oc = document.createElement('canvas'); oc.width = 64; oc.height = 48; ox = oc.getContext('2d', {willReadFrequently: true}); }
      // Сумма по ВСЕМ canvas: у L-2 их два, первый — WebGL без
      // preserveDrawingBuffer, и подпись только по нему читалась как пустая:
      // движущаяся сцена получала freeze=0 и показывалась статичным кадром.
      let total = 0;
      for (const c of cs) {
        if (!c.width || !c.height) continue;
        ox.clearRect(0, 0, 64, 48);
        ox.drawImage(c, 0, 0, 64, 48);
        const d = ox.getImageData(0, 0, 64, 48).data;
        let s = 0;
        for (let i = 0; i < d.length; i += 4) s = (s + d[i] + d[i + 1] * 3 + d[i + 2] * 7) % 1000003;
        total = (total + s + cs.length * 7) % 1000003;
      }
      return total;
    } catch (e) { return -2; }
  };

  // Замер должен пережить перезагрузку (её использует повтор): sessionStorage,
  // а если он недоступен — window.name (оба живут в пределах вкладки).
  const KEY = 'dailybench.scene:' + location.pathname;
  const put = (v) => {
    try { sessionStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
    try { window.name = 'dbscene:' + JSON.stringify(v); } catch (e) {}
  };
  const got = () => {
    try { const v = sessionStorage.getItem(KEY); if (v) return JSON.parse(v); } catch (e) {}
    try { if (window.name.indexOf('dbscene:') === 0) return JSON.parse(window.name.slice(8)); } catch (e) {}
    return null;
  };

  let freeze = 0, span = SPAN_MAX, frames = 0, shown = 0, phase = 'measuring', holdUntil = 0, auto = true;
  const scene = {mode: 'measuring', freeze: 0, step: 0};
  // Ответы сами выставляют `window.__scene` (свой THREE.Scene) — у deepseek это
  // уже занято, и модульный скрипт ответа исполняется ПОСЛЕ этого хука. Поэтому
  // драйвер живёт под своим именем, а `__scene` остаётся странице.
  window.__dbscene = scene;
  window.__beat = beat;
  const publish = () => {   // для записи и отладки: состояние драйвера наружу
    scene.mode = phase; scene.freeze = freeze; scene.step = shown;
    // seek(n) — ручной покадровый прогон до шага n (гарантирует первый кадр)
    scene.seek = (n) => {
      auto = false;
      if (shown === 0) { beat(); shown++; }
      while (shown < (n | 0)) { beat(); shown++; }
      scene.step = shown;
      return shown;
    };
  };
  publish();

  const play = () => {
    const cache = got();
    freeze = (cache && cache.freeze | 0) || 0;
    // Окно движения разворачиваем примерно на 0.1 с на шаг: сцена из 240 шагов
    // идёт 24 с — так движение видно, а не проскакивает за пару секунд.
    span = Math.min(SPAN_MAX, Math.max(SPAN_MIN, freeze * SPAN_PER_STEP));
    phase = freeze < MIN_WINDOW ? 'static' : 'play';
    frames = 0; shown = 0;
    publish();
    if (phase === 'play') requestAnimationFrame(tick);
  };

  const tick = (now) => {
    if (phase === 'play' && auto) {
      frames++;
      const target = Math.min(freeze, Math.round(frames * freeze / span));
      while (shown < target) { beat(); shown++; }
      scene.step = shown;
      if (frames >= span) { phase = 'hold'; holdUntil = performance.now() + HOLD_MS; scene.mode = phase; }
    } else if (phase === 'hold' && auto && performance.now() >= holdUntil) {
      location.reload();  // сброса у страницы нет: повтор — только перезагрузкой
    }
    requestAnimationFrame(tick);
  };

  if (got() === null) {
    // Первый заход: дождаться кадра страницы, измерить окно движения и
    // перезагрузиться — показ пойдёт с чистого состояния, замер уже в кэше.
    const t0 = performance.now();
    let prev = null, lastChange = 0, k = 0, started = false;
    const measureFrame = () => {
      const t1 = performance.now();
      while (performance.now() - t1 < MEASURE_MS && k < MEASURE_CAP) {
        beat(); k++;
        const s = sig();
        if (s !== prev) { lastChange = k; prev = s; }
        else if (k - lastChange >= QUIET) break;
      }
      if ((k >= MEASURE_CAP || k - lastChange >= QUIET) && k > 0) {
        put({freeze: lastChange});
        location.reload();
        return;
      }
      requestAnimationFrame(measureFrame);
    };
    const wait = () => {
      if (window.__ready !== true && performance.now() - t0 < 8000) { requestAnimationFrame(wait); return; }
      probe(); draw(); prev = sig();
      if (!started) { started = true; requestAnimationFrame(measureFrame); }
    };
    requestAnimationFrame(wait);
  } else {
    play();
  }

  const resume = () => { auto = true; if (phase !== 'play') { phase = 'play'; publish(); requestAnimationFrame(tick); } };
  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { auto = false; beat(); shown++; scene.step = shown; }
    else if (cmd === 'pause') { auto = false; }
    else if (cmd === 'play') { resume(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); auto = !auto; if (auto) resume(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); auto = false; beat(); shown++; scene.step = shown; }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>

(() => {
  const fit = () => {
    const canvas = document.querySelector('canvas');
    if (!canvas) return;
    const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.documentElement.style.zoom = k === 1 ? '' : String(k);
    document.body.style.overflow = 'hidden';
    document.body.style.display = 'flex';
    document.body.style.alignItems = 'center';
    document.body.style.justifyContent = 'center';
    document.body.style.height = '100vh';
  };
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  fit();
})();
