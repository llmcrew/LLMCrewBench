<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Water Surface</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
<script src='../../../_vendor/three.global.js'></script>

<body>
    <script type="module">
        const THREE = window.THREE;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(800, 600, false);
        document.body.appendChild(renderer.domElement);

        // Scene
        const scene = new THREE.Scene();

        // Camera
        // PerspectiveCamera(45, 800/600, 0.1, 1000)
        const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 1000);
        camera.position.set(0, 0.9, 0);
        // LookAt (0, 0.9 - 0.1185, -1)
        camera.lookAt(0, 0.9 - 0.1185, -1);

        // Time
        let time = 0.0;

        // --- Sky ---
        // Plane at distance 500.0
        // Colors: #ffb066 (horizon), #8c5f86 (mid), #14224f (top)
        
        const lookDir = new THREE.Vector3(0, -0.1185, -1).normalize();
        const skyDist = 500.0;
        const skyCenter = camera.position.clone().add(lookDir.clone().multiplyScalar(skyDist));
        
        const tanHalfFov = Math.tan(THREE.MathUtils.degToRad(45) / 2);
        const skyHeight = 2 * skyDist * tanHalfFov;
        const skyWidth = skyHeight * (800 / 600);
        
        const skyGeo = new THREE.PlaneGeometry(skyWidth, skyHeight);
        
        const skyMat = new THREE.ShaderMaterial({
            uniforms: {
                colorHorizon: { value: new THREE.Color(0xffb066) },
                colorMid: { value: new THREE.Color(0x8c5f86) },
                colorTop: { value: new THREE.Color(0x14224f) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 colorHorizon;
                uniform vec3 colorMid;
                uniform vec3 colorTop;
                varying vec2 vUv;
                void main() {
                    vec3 color;
                    if (vUv.y < 0.5) {
                        color = mix(colorHorizon, colorMid, vUv.y * 2.0);
                    } else {
                        color = mix(colorMid, colorTop, (vUv.y - 0.5) * 2.0);
                    }
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });

        const skyMesh = new THREE.Mesh(skyGeo, skyMat);
        skyMesh.position.copy(skyCenter);
        skyMesh.lookAt(camera.position);
        
        // Align bottom of sky with horizon
        // Horizon is 6.76 deg above look vector.
        // Offset = 500 * tan(6.76 deg) = 59.25
        skyMesh.translateY(59.25); 
        skyMesh.name = "sky";
        scene.add(skyMesh);

        // --- Sun ---
        // Disk radius 0.05 frame height.
        // 0.05 * 600px = 30px height. Radius = 15px.
        // At dist 300.
        // 600px corresponds to 45 deg FOV height = 2 * 300 * tan(22.5) = 248.5 units.
        // 30px = (30/600) * 248.5 = 12.425 units (diameter).
        // Radius = 6.21 units.
        const sunRadius = 6.21;
        const sunGeo = new THREE.CircleGeometry(sunRadius, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffe6b0 });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        
        // Position: Center horizontally. 0.012 frame height above horizon.
        // 0.012 * 600px = 7.2px.
        // 7.2px in units at dist 300 = (7.2/600) * 248.5 = 2.98 units.
        // Horizon is at Y=0. Sun is at Y=2.98.
        // Camera is at (0, 0.9, 0).
        // Vector to Sun: (0, 2.98 - 0.9, -300) approx.
        // Let's place it precisely on the ray.
        // Horizon angle from camera: atan((0 - 0.9) / 7.59) = -6.76 deg.
        // Sun angle: -6.76 + (0.012 * 45) = -6.22 deg.
        // Wait, 0.012 frame height is angular offset.
        // 0.012 * 45 deg = 0.54 deg.
        // Sun is 0.54 deg ABOVE horizon.
        // Horizon is at Y=0.
        // So Sun is at Y = 0 + 300 * tan(0.54 deg) = 2.82 relative to horizon plane?
        // No, relative to camera Y.
        // Camera Y = 0.9.
        // Ray to horizon hits Y=0 at Z=-7.59.
        // Ray to Sun hits Z=-300.
        // Angle of horizon ray = atan(-0.9 / 7.59) = -6.76 deg.
        // Angle of sun ray = -6.76 + 0.54 = -6.22 deg.
        // Sun Y = 0.9 + 300 * tan(-6.22 deg) = 0.9 - 32.7 = -31.8.
        // This puts Sun BELOW horizon (Y=0).
        // Contradiction: "0.012 height of frame ABOVE horizon".
        // Horizon is at Y=0. Sun must be at Y > 0.
        // My angle calculation:
        // Camera (0, 0.9, 0). LookAt (0, 0.7815, -1).
        // Look vector is DOWN.
        // Horizon is HORIZONTAL (Y=0).
        // So Horizon is ABOVE look vector.
        // Sun is ABOVE Horizon.
        // So Sun is EVEN MORE ABOVE look vector.
        // Look vector angle = -6.76 deg.
        // Horizon angle = 0 deg.
        // Sun angle = +0.54 deg.
        // Sun Y = 0.9 + 300 * tan(0.54 deg) = 0.9 + 2.82 = 3.72.
        // Sun Z = -300 * cos(0.54 deg) = -299.9.
        sunMesh.position.set(0, 3.72, -299.9);
        sunMesh.lookAt(camera.position);
        sunMesh.name = "sun";
        scene.add(sunMesh);

        // --- Water ---
        const waterGeo = new THREE.PlaneGeometry(300, 400.0, 180, 200);
        waterGeo.rotateX(-Math.PI / 2);
        
        const waterMat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0.0 },
                colorHorizon: { value: new THREE.Color(0x2f86b0) },
                colorBottom: { value: new THREE.Color(0x0b2740) },
                sunColor: { value: new THREE.Color(0xffe6b0) },
                sunDirection: { value: sunMesh.position.clone() },
                cameraPosition: { value: camera.position }
            },
            vertexShader: `
                uniform float time;
                varying vec3 vWorldPosition;
                varying vec3 vNormal;
                varying vec3 vViewPosition;

                void main() {
                    // World X = position.x
                    // World Z = -position.y - 199.6
                    vec2 p_xz = vec2(position.x, -position.y - 199.6);
                    
                    float h = 0.0;
                    float dh_dx = 0.0;
                    float dh_dz = 0.0;
                    
                    float scale = 1.080;
                    
                    // Wave 1
                    {
                        vec2 d = vec2(0.924, 0.383);
                        float k = 0.38;
                        float w = 0.90;
                        float a = 0.26;
                        float p = 2.282 + 0.0 * 1.7;
                        float phase = k * dot(d, p_xz) - w * time + p;
                        float s = sin(phase);
                        float c = cos(phase);
                        h += scale * a * s;
                        dh_dx += scale * a * k * d.x * c;
                        dh_dz += scale * a * k * d.z * c;
                    }
                    // Wave 2
                    {
                        vec2 d = vec2(-0.643, 0.766);
                        float k = 0.72;
                        float w = 1.50;
                        float a = 0.16;
                        float p = 2.282 + 1.0 * 1.7;
                        float phase = k * dot(d, p_xz) - w * time + p;
                        float s = sin(phase);
                        float c = cos(phase);
                        h += scale * a * s;
                        dh_dx += scale * a * k * d.x * c;
                        dh_dz += scale * a * k * d.z * c;
                    }
                    // Wave 3
                    {
                        vec2 d = vec2(0.309, -0.951);
                        float k = 1.25;
                        float w = 2.40;
                        float a = 0.09;
                        float p = 2.282 + 2.0 * 1.7;
                        float phase = k * dot(d, p_xz) - w * time + p;
                        float s = sin(phase);
                        float c = cos(phase);
                        h += scale * a * s;
                        dh_dx += scale * a * k * d.x * c;
                        dh_dz += scale * a * k * d.z * c;
                    }
                    
                    vec3 newPos = vec3(position.x, h, position.z);
                    vec4 mvPosition = modelViewMatrix * vec4(newPos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    vWorldPosition = (modelMatrix * vec4(newPos, 1.0)).xyz;
                    vNormal = normalize(vec3(-dh_dx, 1.0, -dh_dz));
                    vViewPosition = -mvPosition.xyz;
                }
            `,
            fragmentShader: `
                uniform vec3 colorHorizon;
                uniform vec3 colorBottom;
                uniform vec3 sunColor;
                uniform vec3 sunDirection;
                uniform vec3 cameraPosition;
                
                varying vec3 vWorldPosition;
                varying vec3 vNormal;
                varying vec3 vViewPosition;
                
                void main() {
                    vec3 V = normalize(vViewPosition);
                    
                    // Fresnel
                    float fresnel = pow(1.0 - max(dot(vNormal, V), 0.0), 3.0);
                    
                    // Base Color Gradient
                    float zNorm = (vWorldPosition.z - (-399.6)) / (0.4 - (-399.6));
                    vec3 baseColor = mix(colorHorizon, colorBottom, zNorm);
                    
                    // Fresnel lighten
                    baseColor = mix(baseColor, vec3(1.0), fresnel * 0.5);
                    
                    // Specular
                    vec3 L = normalize(sunDirection - vWorldPosition);
                    vec3 R = reflect(-L, vNormal);
                    float spec = pow(max(dot(R, V), 0.0), 32.0);
                    
                    // Warm Path
                    float path = exp(-vWorldPosition.x * vWorldPosition.x / 0.35);
                    float zFade = smoothstep(-2.0, -25.0, vWorldPosition.z);
                    float warmPath = path * zFade;
                    
                    vec3 finalColor = baseColor;
                    finalColor += sunColor * spec;
                    finalColor += sunColor * warmPath;
                    
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });
        
        const waterMesh = new THREE.Mesh(waterGeo, waterMat);
        waterMesh.position.set(0, 0, -199.6);
        waterMesh.name = "water";
        scene.add(waterMesh);

        // Initial Render
        renderer.render(scene, camera);
        window.__ready = true;

        // API
        window.__step = function(dt) {
            time += dt;
            waterMat.uniforms.time.value = time;
            renderer.render(scene, camera);
            return window.__probe();
        };

        window.__probe = function() {
            return {
                t: parseFloat(time.toFixed(4)),
                objects: ["sky", "sun", "water"],
                horizon: 0.357,
                wave: time.toFixed(4)
            };
        };

    </script>

<script>
// Сцена играет сама: драйвер измеряет окно движения (сколько шагов подряд кадр
// реально меняется), разворачивает его на несколько секунд и зацикливает
// перезагрузкой. Без этого сцена выгорает за 1-2 с и стоит, как скриншот.
// Отчёт и запись могут вмешаться сообщениями 'step', 'pause', 'play', 'reset'.
(() => {
  const DT = 1 / 60;
  const QUIET = 90;          // столько шагов без изменений — окно кончилось
  const MEASURE_CAP = 1200;  // предел замера в шагах
  const MIN_WINDOW = 4;      // короче — сцена статична, повторять нечего
  const SPAN_PER_STEP = 6;   // кадров на шаг показа (~0.1 с при 60 к/с)
  const SPAN_MIN = 240;      // показ короче 4 с сливается
  const SPAN_MAX = 600;      // ...а длиннее 10 с — затягивается
  const HOLD_MS = 900;       // пауза перед повтором
  const MEASURE_MS = 8;      // бюджет замера на кадр, чтобы не морозить вкладку

  // three.js держит render собственным свойством экземпляра (this.render =
  // render), поэтому обёртка прототипа его не видит: подменяем конструктор,
  // а render перепривязываем на самом экземпляре. Так кадр обновляется, даже
  // если страница рисует только в __probe — иначе сцена стоит, как скриншот.
  let lastRender = null;
  const wrap = () => {
    const W = window.THREE && window.THREE.WebGLRenderer;
    if (!W || W.__dbWrapped) return !!W;
    const Wrapped = function (...args) {
      const inst = new W(...args);
      const orig = inst.render.bind(inst);
      inst.render = function (scene, camera) { lastRender = [inst, scene, camera]; return orig(scene, camera); };
      return inst;
    };
    Wrapped.prototype = W.prototype;
    Object.setPrototypeOf(Wrapped, W);
    Wrapped.__dbWrapped = true;
    window.THREE.WebGLRenderer = Wrapped;
    return true;
  };
  if (!wrap()) { let n = 0; const t = setInterval(() => { if (wrap() || ++n > 1500) clearInterval(t); }, 4); }

  const step = () => { if (typeof window.__step === 'function') { try { window.__step(DT); } catch (e) {} } };
  const probe = () => { if (typeof window.__probe === 'function') { try { window.__probe(); } catch (e) {} } };
  const draw = () => { if (lastRender) { try { lastRender[0].render(lastRender[1], lastRender[2]); } catch (e) {} } };
  // Один шаг — и сразу кадр: probe зовём всегда, часть страниц рисует в нём.
  const beat = () => { step(); probe(); draw(); };

  let oc = null, ox = null;
  const sig = () => {  // дешёвая подпись кадра: 64x48 достаточно для «меняется/нет»
    try {
      const cs = document.querySelectorAll('canvas');
      if (!cs.length) return -1;
      if (!oc) { oc = document.createElement('canvas'); oc.width = 64; oc.height = 48; ox = oc.getContext('2d', {willReadFrequently: true}); }
      // Сумма по ВСЕМ canvas: у L-2 их два, первый — WebGL без
      // preserveDrawingBuffer, и подпись только по нему читалась как пустая:
      // движущаяся сцена получала freeze=0 и показывалась статичным кадром.
      let total = 0;
      for (const c of cs) {
        if (!c.width || !c.height) continue;
        ox.clearRect(0, 0, 64, 48);
        ox.drawImage(c, 0, 0, 64, 48);
        const d = ox.getImageData(0, 0, 64, 48).data;
        let s = 0;
        for (let i = 0; i < d.length; i += 4) s = (s + d[i] + d[i + 1] * 3 + d[i + 2] * 7) % 1000003;
        total = (total + s + cs.length * 7) % 1000003;
      }
      return total;
    } catch (e) { return -2; }
  };

  // Замер должен пережить перезагрузку (её использует повтор): sessionStorage,
  // а если он недоступен — window.name (оба живут в пределах вкладки).
  const KEY = 'dailybench.scene:' + location.pathname;
  const put = (v) => {
    try { sessionStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
    try { window.name = 'dbscene:' + JSON.stringify(v); } catch (e) {}
  };
  const got = () => {
    try { const v = sessionStorage.getItem(KEY); if (v) return JSON.parse(v); } catch (e) {}
    try { if (window.name.indexOf('dbscene:') === 0) return JSON.parse(window.name.slice(8)); } catch (e) {}
    return null;
  };

  let freeze = 0, span = SPAN_MAX, frames = 0, shown = 0, phase = 'measuring', holdUntil = 0, auto = true;
  const scene = {mode: 'measuring', freeze: 0, step: 0};
  // Ответы сами выставляют `window.__scene` (свой THREE.Scene) — у deepseek это
  // уже занято, и модульный скрипт ответа исполняется ПОСЛЕ этого хука. Поэтому
  // драйвер живёт под своим именем, а `__scene` остаётся странице.
  window.__dbscene = scene;
  window.__beat = beat;
  const publish = () => {   // для записи и отладки: состояние драйвера наружу
    scene.mode = phase; scene.freeze = freeze; scene.step = shown;
    // seek(n) — ручной покадровый прогон до шага n (гарантирует первый кадр)
    scene.seek = (n) => {
      auto = false;
      if (shown === 0) { beat(); shown++; }
      while (shown < (n | 0)) { beat(); shown++; }
      scene.step = shown;
      return shown;
    };
  };
  publish();

  const play = () => {
    const cache = got();
    freeze = (cache && cache.freeze | 0) || 0;
    // Окно движения разворачиваем примерно на 0.1 с на шаг: сцена из 240 шагов
    // идёт 24 с — так движение видно, а не проскакивает за пару секунд.
    span = Math.min(SPAN_MAX, Math.max(SPAN_MIN, freeze * SPAN_PER_STEP));
    phase = freeze < MIN_WINDOW ? 'static' : 'play';
    frames = 0; shown = 0;
    publish();
    if (phase === 'play') requestAnimationFrame(tick);
  };

  const tick = (now) => {
    if (phase === 'play' && auto) {
      frames++;
      const target = Math.min(freeze, Math.round(frames * freeze / span));
      while (shown < target) { beat(); shown++; }
      scene.step = shown;
      if (frames >= span) { phase = 'hold'; holdUntil = performance.now() + HOLD_MS; scene.mode = phase; }
    } else if (phase === 'hold' && auto && performance.now() >= holdUntil) {
      location.reload();  // сброса у страницы нет: повтор — только перезагрузкой
    }
    requestAnimationFrame(tick);
  };

  if (got() === null) {
    // Первый заход: дождаться кадра страницы, измерить окно движения и
    // перезагрузиться — показ пойдёт с чистого состояния, замер уже в кэше.
    const t0 = performance.now();
    let prev = null, lastChange = 0, k = 0, started = false;
    const measureFrame = () => {
      const t1 = performance.now();
      while (performance.now() - t1 < MEASURE_MS && k < MEASURE_CAP) {
        beat(); k++;
        const s = sig();
        if (s !== prev) { lastChange = k; prev = s; }
        else if (k - lastChange >= QUIET) break;
      }
      if ((k >= MEASURE_CAP || k - lastChange >= QUIET) && k > 0) {
        put({freeze: lastChange});
        location.reload();
        return;
      }
      requestAnimationFrame(measureFrame);
    };
    const wait = () => {
      if (window.__ready !== true && performance.now() - t0 < 8000) { requestAnimationFrame(wait); return; }
      probe(); draw(); prev = sig();
      if (!started) { started = true; requestAnimationFrame(measureFrame); }
    };
    requestAnimationFrame(wait);
  } else {
    play();
  }

  const resume = () => { auto = true; if (phase !== 'play') { phase = 'play'; publish(); requestAnimationFrame(tick); } };
  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { auto = false; beat(); shown++; scene.step = shown; }
    else if (cmd === 'pause') { auto = false; }
    else if (cmd === 'play') { resume(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); auto = !auto; if (auto) resume(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); auto = false; beat(); shown++; scene.step = shown; }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>

  const fit = () => {
    const canvas = document.querySelector('canvas');
