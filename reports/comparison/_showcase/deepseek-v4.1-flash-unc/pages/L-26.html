<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Meteor Impact — Orbital View</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;}
  canvas{display:block;}
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ============================================================
   ДЕТЕРМИНИРОВАННЫЙ ГПСЧ (явный LCG, seed = 399148)
   ============================================================ */
let lcg = 399148;
function rnd(){
  lcg = (lcg * 1103515245 + 12345) % 2147483648;
  return lcg / 2147483648;
}

/* ============================================================
   РЕНДЕРЕР / СЦЕНА / КАМЕРА
   ============================================================ */
const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03040c);

const camera = new THREE.PerspectiveCamera(50, W / H, 0.05, 900);
camera.position.set(-0.02, 0.90, 5.5);

/* ============================================================
   КОНСТАНТЫ СЦЕНЫ
   ============================================================ */
const EARTH_POS   = new THREE.Vector3(-0.6, -2.0, -13.0);
const EARTH_R     = 4.0;
const METEOR_START= new THREE.Vector3(1.9, 1.5, -6.0);
const METEOR_VEL  = new THREE.Vector3(-0.395, -0.516, -0.719);
const IMPACT_T    = 1.74;

const _mpAtImpact = METEOR_START.clone().addScaledVector(METEOR_VEL, IMPACT_T);
const IMPACT_N    = _mpAtImpact.clone().sub(EARTH_POS).normalize();
const IMPACT_POINT= EARTH_POS.clone().addScaledVector(IMPACT_N, EARTH_R);

const LIGHT_DIR = new THREE.Vector3(0.50, 0.62, 0.75).normalize();

/* ============================================================
   СВЕТ
   ============================================================ */
scene.add(new THREE.AmbientLight(0x1b2a4a, 1.0));
const sun = new THREE.DirectionalLight(0xfff2e2, 1.15);
sun.position.copy(LIGHT_DIR).multiplyScalar(60);
scene.add(sun);
const camLight = new THREE.PointLight(0xbfd4ff, 1.4, 40, 2);
camLight.position.set(-0.02, 0.9, 5.5);
scene.add(camLight);

/* ============================================================
   ОБЩИЕ GLSL-ХЕЛПЕРЫ (шум)
   ============================================================ */
const NOISE_GLSL = `
float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453123); }
float noise(vec3 p){
  vec3 i = floor(p); vec3 f = fract(p);
  f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)), f.x),
                 mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                 mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){
  float a = 0.5, s = 0.0;
  for(int i=0;i<5;i++){ s += a*noise(p); p = p*2.07 + vec3(1.7); a *= 0.5; }
  return s;
}
`;

/* ============================================================
   ЗЕМЛЯ  (earth)
   ============================================================ */
const earthMat = new THREE.ShaderMaterial({
  uniforms: { uLight: { value: LIGHT_DIR.clone() } },
  vertexShader: `
    varying vec3 vPos; varying vec3 vN; varying vec3 vW;
    void main(){
      vPos = position;
      vN = normalize(mat3(modelMatrix) * normal);
      vW = (modelMatrix * vec4(position,1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    uniform vec3 uLight;
    varying vec3 vPos; varying vec3 vN; varying vec3 vW;
    ${NOISE_GLSL}
    void main(){
      vec3 n  = normalize(vN);
      vec3 sp = normalize(vPos);

      float cont = fbm(sp * 2.10);
      float land = smoothstep(0.455, 0.520, cont);

      vec3 sea   = vec3(0.075, 0.192, 0.369);   // #13315e
      vec3 landC = vec3(0.184, 0.420, 0.275);   // #2f6b46
      vec3 col   = mix(sea, landC, land);

      float det = fbm(sp * 8.0);
      col *= 0.80 + 0.40 * det;

      float diff  = max(dot(n, uLight), 0.0);
      float night = smoothstep(0.32, -0.05, dot(n, uLight));

      float cl     = fbm(sp * 20.0);
      float lights = smoothstep(0.575, 0.700, cl) * land * night;

      col = col * (0.085 + 1.05 * diff);
      col += vec3(1.0, 0.816, 0.816) * lights * 1.9;   // #ffd0d0

      vec3 vd  = normalize(cameraPosition - vW);
      float rim = pow(1.0 - max(dot(n, vd), 0.0), 3.0);
      col += vec3(0.435, 0.714, 1.0) * rim * 0.45;

      gl_FragColor = vec4(col, 1.0);
    }`
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R, 72, 48), earthMat);
earth.position.copy(EARTH_POS);
scene.add(earth);

/* ============================================================
   АТМОСФЕРА  (atmosphere)
   ============================================================ */
const atmoMat = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(0x6fb6ff) } },
  vertexShader: `
    varying vec3 vN; varying vec3 vW;
    void main(){
      vN = normalize(mat3(modelMatrix) * normal);
      vW = (modelMatrix * vec4(position,1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    uniform vec3 uColor; varying vec3 vN; varying vec3 vW;
    void main(){
      vec3 vd = normalize(cameraPosition - vW);
      float f = pow(1.0 - abs(dot(normalize(vN), vd)), 2.4);
      gl_FragColor = vec4(uColor * f * 1.55, f);
    }`,
  transparent: true, blending: THREE.AdditiveBlending,
  depthWrite: false, side: THREE.FrontSide
});
const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(4.4, 64, 48), atmoMat);
atmosphere.position.copy(EARTH_POS);
scene.add(atmosphere);

/* ============================================================
   ОБЛАКА  (clouds)  opacity 0.28
   ============================================================ */
const cloudMat = new THREE.ShaderMaterial({
  uniforms: {
    uLight:   { value: LIGHT_DIR.clone() },
    uOpacity: { value: 0.28 }
  },
  vertexShader: `
    varying vec3 vPos; varying vec3 vN; varying vec3 vW;
    void main(){
      vPos = position;
      vN = normalize(mat3(modelMatrix) * normal);
      vW = (modelMatrix * vec4(position,1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    uniform vec3 uLight; uniform float uOpacity;
    varying vec3 vPos; varying vec3 vN; varying vec3 vW;
    ${NOISE_GLSL}
    void main(){
      vec3 sp = normalize(vPos);
      float c = fbm(sp * 3.3);
      float a = smoothstep(0.46, 0.74, c);
      vec3 n = normalize(vN);
      float diff = max(dot(n, uLight), 0.0);
      vec3 col = vec3(1.0, 0.99, 0.97) * (0.22 + 0.95 * diff);
      gl_FragColor = vec4(col, a * uOpacity);
    }`,
  transparent: true, depthWrite: false
});
const clouds = new THREE.Mesh(new THREE.SphereGeometry(4.06, 64, 48), cloudMat);
clouds.position.copy(EARTH_POS);
scene.add(clouds);

/* ============================================================
   МЕТЕОРИТ  (meteor) + свечение + свет
   ============================================================ */
const meteor = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 24, 18),
  new THREE.MeshBasicMaterial({ color: 0xffd0a0, transparent: true, opacity: 1 })
);
scene.add(meteor);

const meteorGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.44, 20, 14),
  new THREE.MeshBasicMaterial({
    color: 0xffa860, transparent: true, opacity: 0.35,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
scene.add(meteorGlow);

const meteorLight = new THREE.PointLight(0xffb070, 4.0, 26, 2);
scene.add(meteorLight);

/* ============================================================
   ОГНЕННЫЙ СЛЕД  (trail) — 90 аддитивных точек
   ============================================================ */
const TRAIL_N = 90;
const trailGeo   = new THREE.BufferGeometry();
const trailPos   = new Float32Array(TRAIL_N * 3);
const trailAlpha = new Float32Array(TRAIL_N);
const trailSize  = new Float32Array(TRAIL_N);
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(trailAlpha, 1));
trailGeo.setAttribute('aSize',    new THREE.BufferAttribute(trailSize, 1));

const trailMat = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(0xffd0a0) } },
  vertexShader: `
    attribute float aAlpha; attribute float aSize;
    varying float vA;
    void main(){
      vA = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * 520.0 / max(-mv.z, 0.001);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform vec3 uColor; varying float vA;
    void main(){
      vec2 d = gl_PointCoord - vec2(0.5);
      float r = 1.0 - smoothstep(0.0, 0.5, length(d));
      gl_FragColor = vec4(uColor * vA * r, vA * r);
    }`,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const trail = new THREE.Points(trailGeo, trailMat);
trail.frustumCulled = false;
scene.add(trail);

/* ============================================================
   УДАРНАЯ ВОЛНА  (shock) — кольцо вокруг метеорита
   ============================================================ */
const shock = new THREE.Mesh(
  new THREE.TorusGeometry(1.0, 0.055, 8, 48),
  new THREE.MeshBasicMaterial({
    color: 0xffe0b0, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
shock.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), METEOR_VEL.clone().normalize());
scene.add(shock);

/* ============================================================
   ВСПЫШКА УДАРА  (impact_flash)
   ============================================================ */
const flash = new THREE.Mesh(
  new THREE.SphereGeometry(1.0, 24, 18),
  new THREE.MeshBasicMaterial({
    color: 0xfff0c0, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
flash.position.copy(IMPACT_POINT);
flash.visible = false;
scene.add(flash);

const flashLight = new THREE.PointLight(0xffd090, 0, 45, 2);
flashLight.position.copy(IMPACT_POINT);
scene.add(flashLight);

/* ============================================================
   КОЛЬЦО ПЫЛИ  (impact_ring)
   ============================================================ */
const impactRing = new THREE.Mesh(
  new THREE.RingGeometry(0.86, 1.0, 64),
  new THREE.MeshBasicMaterial({
    color: 0xffc890, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  })
);
impactRing.position.copy(IMPACT_POINT).addScaledVector(IMPACT_N, 0.03);
impactRing.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), IMPACT_N);
impactRing.visible = false;
scene.add(impactRing);

/* ============================================================
   ОБЛОМКИ  (debris) — 120 раскалённых точек
   ============================================================ */
const DEBRIS_N = 120;
const debrisGeo   = new THREE.BufferGeometry();
const debrisPos   = new Float32Array(DEBRIS_N * 3);
const debrisAlpha = new Float32Array(DEBRIS_N);
const debrisSize  = new Float32Array(DEBRIS_N);
const debrisVel   = new Float32Array(DEBRIS_N * 3);
const debrisLife  = new Float32Array(DEBRIS_N);
const debrisMax   = new Float32Array(DEBRIS_N);
const debrisJit   = new Float32Array(DEBRIS_N * 3);

for (let i = 0; i < DEBRIS_N; i++) {
  const u  = rnd() * 2 - 1;
  const th = rnd() * Math.PI * 2;
  const s  = Math.sqrt(Math.max(0, 1 - u * u));
  const d  = new THREE.Vector3(s * Math.cos(th), s * Math.sin(th), u);
  d.lerp(IMPACT_N, 0.55).normalize();
  const sp = 0.9 + rnd() * 2.7;
  debrisVel[i * 3]     = d.x * sp;
  debrisVel[i * 3 + 1] = d.y * sp;
  debrisVel[i * 3 + 2] = d.z * sp;
  debrisMax[i]  = 0.9 + rnd() * 1.3;
  debrisLife[i] = 0;
  debrisSize[i] = 0.030 + rnd() * 0.055;
  debrisJit[i * 3]     = (rnd() - 0.5) * 0.06;
  debrisJit[i * 3 + 1] = (rnd() - 0.5) * 0.06;
  debrisJit[i * 3 + 2] = (rnd() - 0.5) * 0.06;
  debrisPos[i * 3]     = IMPACT_POINT.x;
  debrisPos[i * 3 + 1] = IMPACT_POINT.y;
  debrisPos[i * 3 + 2] = IMPACT_POINT.z;
}
debrisGeo.setAttribute('position', new THREE.BufferAttribute(debrisPos, 3));
debrisGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(debrisAlpha, 1));
debrisGeo.setAttribute('aSize',    new THREE.BufferAttribute(debrisSize, 1));

const debrisMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float aAlpha; attribute float aSize;
    varying float vA;
    void main(){
      vA = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * 520.0 / max(-mv.z, 0.001);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - vec2(0.5);
      float r = 1.0 - smoothstep(0.0, 0.5, length(d));
      vec3 c = mix(vec3(1.0, 0.32, 0.07), vec3(1.0, 0.95, 0.78), vA);
      gl_FragColor = vec4(c * vA * r, vA * r);
    }`,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const debris = new THREE.Points(debrisGeo, debrisMat);
debris.frustumCulled = false;
scene.add(debris);

/* ============================================================
   СТАНЦИЯ  (station) — слева, на переднем плане
   ============================================================ */
const station = new THREE.Group();
station.position.set(-1.0, 0.70, 1.2);
station.rotation.set(0.12, 0.55, 0.18);
station.scale.setScalar(0.55);
scene.add(station);

const hullMat  = new THREE.MeshStandardMaterial({ color: 0xa8b4c0, metalness: 0.78, roughness: 0.38 });
const panelMat = new THREE.MeshStandardMaterial({ color: 0x1e3a6e, metalness: 0.62, roughness: 0.30, emissive: 0x0a1830 });

const hull = new THREE.Mesh(new THREE.BoxGeometry(0.60, 0.26, 0.26), hullMat);
station.add(hull);

const nose = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.30, 12), hullMat);
nose.rotation.z = Math.PI / 2;
nose.position.set(0.42, 0, 0);
station.add(nose);

const truss = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.70, 8), hullMat);
truss.rotation.z = Math.PI / 2;
station.add(truss);

const panel1 = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.02, 0.42), panelMat);
panel1.position.set(-0.85, 0, 0);
station.add(panel1);
const panel2 = panel1.clone();
panel2.position.set(0.85, 0, 0);
station.add(panel2);

const winMat = new THREE.MeshBasicMaterial({
  color: 0xffd9a0, transparent: true, opacity: 0.35,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const win = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.14), winMat);
win.position.set(0.0, 0.02, 0.135);
station.add(win);

const winMat2 = winMat.clone();
const win2 = new THREE.Mesh(new THREE.PlaneGeometry(0.10, 0.10), winMat2);
win2.position.set(-0.30, 0.02, 0.135);
station.add(win2);

const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffe8c0 });
for (let i = 0; i < 5; i++) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 6), bulbMat);
  b.position.set(-0.22 + i * 0.11, -0.145, 0.13);
  station.add(b);
}

/* ============================================================
   ЗВЁЗДЫ  (stars) — 2000 точек
   ============================================================ */
const STAR_N = 2000;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STAR_N * 3);
const starCol = new Float32Array(STAR_N * 3);
for (let i = 0; i < STAR_N; i++) {
  const u  = rnd() * 2 - 1;
  const th = rnd() * Math.PI * 2;
  const s  = Math.sqrt(Math.max(0, 1 - u * u));
  const R  = 260;
  starPos[i * 3]     = R * s * Math.cos(th);
  starPos[i * 3 + 1] = R * s * Math.sin(th);
  starPos[i * 3 + 2] = R * u;
  const b    = 0.35 + rnd() * 0.65;
  const tint = rnd();
  starCol[i * 3]     = b * (0.80 + 0.20 * tint);
  starCol[i * 3 + 1] = b * (0.86 + 0.14 * tint);
  starCol[i * 3 + 2] = b;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('color',    new THREE.BufferAttribute(starCol, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  size: 1.7, sizeAttenuation: false, vertexColors: true,
  transparent: true, depthWrite: false
}));
stars.frustumCulled = false;
scene.add(stars);

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let t = 0;
let impacted = false;
let impactAge = -1;
let debrisOn = false;

/* ============================================================
   ОБНОВЛЕНИЕ СЦЕНЫ
   ============================================================ */
function updateTrail(mp) {
  const v = METEOR_VEL;
  const fade = impacted ? Math.max(0, 1 - impactAge / 0.6) : 1;
  for (let i = 0; i < TRAIL_N; i++) {
    const k = (i + 1) * 0.021;
    trailPos[i * 3]     = mp.x - v.x * k;
    trailPos[i * 3 + 1] = mp.y - v.y * k;
    trailPos[i * 3 + 2] = mp.z - v.z * k;
    const f = Math.pow(1 - i / TRAIL_N, 1.6);
    trailAlpha[i] = f * 0.95 * fade;
    trailSize[i]  = 0.020 + 0.095 * f;
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.aAlpha.needsUpdate   = true;
  trailGeo.attributes.aSize.needsUpdate    = true;
}

function update(dt) {
  /* --- метеорит --- */
  const mp = METEOR_START.clone().addScaledVector(METEOR_VEL, t);
  meteor.position.copy(mp);
  meteorGlow.position.copy(mp);
  meteorLight.position.copy(mp);

  const mFade = impacted ? Math.max(0, 1 - impactAge / 0.5) : 1;
  meteor.material.opacity     = mFade;
  meteorGlow.material.opacity = 0.35 * mFade;
  meteorLight.intensity       = 4.0 * mFade;
  meteor.visible     = mFade > 0.01;
  meteorGlow.visible = meteor.visible;

  updateTrail(mp);

  /* --- ударная волна вокруг метеорита --- */
  const phase = (t % 0.4) / 0.4;
  shock.position.copy(mp);
  shock.scale.setScalar(0.06 + phase * 0.60);
  const sFade = impacted ? Math.max(0, 1 - impactAge / 0.45) : 1;
  shock.material.opacity = (1 - phase) * 0.85 * sFade;
  shock.visible = shock.material.opacity > 0.01;

  /* --- момент удара --- */
  if (!impacted && t >= IMPACT_T) {
    impacted  = true;
    impactAge = 0;
    debrisOn  = true;
    for (let i = 0; i < DEBRIS_N; i++) {
      debrisPos[i * 3]     = IMPACT_POINT.x + debrisJit[i * 3];
      debrisPos[i * 3 + 1] = IMPACT_POINT.y + debrisJit[i * 3 + 1];
      debrisPos[i * 3 + 2] = IMPACT_POINT.z + debrisJit[i * 3 + 2];
      debrisLife[i] = debrisMax[i];
    }
    debrisGeo.attributes.position.needsUpdate = true;
  }

  /* --- эффекты удара --- */
  if (impacted) {
    impactAge = t - IMPACT_T;

    const f = Math.max(0, 1 - impactAge / 0.75);
    flash.visible = f > 0.001;
    flash.scale.setScalar(0.25 + impactAge * 3.2);
    flash.material.opacity = f * 0.95;
    flashLight.intensity   = f * 14.0;

    const r = Math.max(0, 1 - impactAge / 1.8);
    impactRing.visible = r > 0.001;
    impactRing.scale.setScalar(0.25 + impactAge * 2.6);
    impactRing.material.opacity = r * 0.85;

    /* отражение вспышки в стекле иллюминатора */
    const refl = Math.max(0, 1 - impactAge / 0.9);
    winMat.opacity  = 0.35 + 0.55 * refl;
    winMat2.opacity = 0.35 + 0.45 * refl;
    winMat.color.setRGB(1.0, 0.85 + 0.10 * refl, 0.63 + 0.25 * refl);
    winMat2.color.copy(winMat.color);

    /* обломки */
    if (debrisOn) {
      for (let i = 0; i < DEBRIS_N; i++) {
        if (debrisLife[i] > 0) {
          debrisLife[i] -= dt;
          const ix = i * 3;
          debrisPos[ix]     += debrisVel[ix]     * dt;
          debrisPos[ix + 1] += debrisVel[ix + 1] * dt;
          debrisPos[ix + 2] += debrisVel[ix + 2] * dt;

          const gx = EARTH_POS.x - debrisPos[ix];
          const gy = EARTH_POS.y - debrisPos[ix + 1];
          const gz = EARTH_POS.z - debrisPos[ix + 2];
          const gl = Math.hypot(gx, gy, gz) || 1;
          const g  = 1.6 * dt / gl;
          debrisVel[ix]     += gx * g;
          debrisVel[ix + 1] += gy * g;
          debrisVel[ix + 2] += gz * g;

          debrisAlpha[i] = Math.max(0, debrisLife[i] / debrisMax[i]);
        } else {
          debrisAlpha[i] = 0;
        }
      }
      debrisGeo.attributes.position.needsUpdate = true;
      debrisGeo.attributes.aAlpha.needsUpdate   = true;
    }
  }

  /* --- камера: ведёт метеорит, затем смещается к точке удара --- */
  const camMeteor = METEOR_START.clone().addScaledVector(METEOR_VEL, Math.min(t, IMPACT_T));
  let k = Math.min(t / IMPACT_T, 1);
  k = k * k * (3 - 2 * k);
  const lookTarget = camMeteor.clone().lerp(IMPACT_POINT, k);
  camera.lookAt(lookTarget);
}

/* ============================================================
   ПРОБА
   ============================================================ */
window.__probe = function () {
  return {
    t: +t.toFixed(4),
    objects: [
      'earth', 'atmosphere', 'clouds', 'meteor', 'trail', 'shock',
      'impact_flash', 'impact_ring', 'debris', 'station', 'stars'
    ],
    meteor: [
      +meteor.position.x.toFixed(4),
      +meteor.position.y.toFixed(4),
      +meteor.position.z.toFixed(4)
    ],
    impact_age: +impactAge.toFixed(4)
  };
};

/* ============================================================
   ШАГ
   ============================================================ */
window.__step = function (dt) {
  t += dt;
  update(dt);
  renderer.render(scene, camera);
  return window.__probe();
};

/* ============================================================
   ПЕРВЫЙ КАДР
   ============================================================ */
update(0);
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
