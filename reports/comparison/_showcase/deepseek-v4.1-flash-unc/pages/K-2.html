<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Груз на пружине</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ---------- Рендерер ---------- */
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

/* ---------- Сцена и камера ---------- */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
camera.position.set(0.0, 3.5, 15.0);
camera.lookAt(0.0, 0.2, 0.0);

/* ---------- Свет ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.45));

const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.position.set(8.0, 14.0, 10.0);
scene.add(dirLight);

/* ---------- Земля ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x2b3a4a })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.3, 0);
ground.name = 'ground';
scene.add(ground);

/* ---------- Стена ---------- */
const wall = new THREE.Mesh(
  new THREE.BoxGeometry(0.8, 3.2, 3.2),
  new THREE.MeshStandardMaterial({ color: 0x8a93a6 })
);
wall.position.set(-7, 0.9, 0);
wall.name = 'wall';
scene.add(wall);

/* ---------- Груз ---------- */
const mass = new THREE.Mesh(
  new THREE.BoxGeometry(1.2, 1.2, 1.2),
  new THREE.MeshStandardMaterial({ color: 0xff8a3d })
);
mass.name = 'mass';
scene.add(mass);

/* ---------- Пружина ---------- */
// Цилиндр единичной высоты, ориентированный вдоль оси X.
const spring = new THREE.Mesh(
  new THREE.CylinderGeometry(0.09, 0.09, 1, 16),
  new THREE.MeshStandardMaterial({ color: 0xd8dde6 })
);
spring.rotation.z = Math.PI / 2;   // локальная ось Y -> мировая ось X
spring.name = 'spring';
scene.add(spring);

/* ---------- Физика ---------- */
const K = 10.07;
const M = 1.0;
const C = 0.27;

const ANCHOR_X = -6.6;
const ANCHOR_Y = 0.3;

let x = 1.21;
let v = 1.32;
let steps = 0;
let t = 0;

function r4(n) {
  return Math.round(n * 10000) / 10000;
}

function updateScene() {
  mass.position.set(x, 0.3, 0);

  const len = Math.abs(x - ANCHOR_X);
  spring.scale.y = Math.max(len, 1e-6);
  spring.position.set((x + ANCHOR_X) / 2, ANCHOR_Y, 0);
}

function render() {
  renderer.render(scene, camera);
}

/* ---------- Публичный API ---------- */
function objectNames() {
  const names = [];
  scene.traverse((o) => {
    if (o.name) names.push(o.name);
  });
  return names;
}

function state() {
  return {
    steps: steps,
    t: r4(t),
    objects: objectNames(),
    camera: [0, 3.5, 15],
    x: r4(x),
    v: r4(v),
    k: K,
    m: M
  };
}

window.__step = function (dt) {
  // Полунеявный Эйлер, ровно в заданном порядке.
  v += (-K / M * x - C * v) * dt;
  x += v * dt;

  steps += 1;
  t += dt;

  updateScene();
  render();

  return state();
};

window.__probe = function () {
  return state();
};

/* ---------- Первая отрисовка ---------- */
updateScene();
render();
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
