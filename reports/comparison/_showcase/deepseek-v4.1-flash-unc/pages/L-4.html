<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ночной город</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a1b5c; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

const W = 800, H = 600;

/* ---------- рендерер ---------- */
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
document.body.appendChild(renderer.domElement);

/* ---------- сцена и камера ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a1b5c');

const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100000);
camera.position.set(0, 8, 27.5);   // высота 8, 26 единиц от фасада (фасад z = 1.5)
camera.lookAt(0, 8, 0);            // строго горизонтально
camera.updateMatrixWorld(true);

/* ---------- земля ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20000, 20000),
  new THREE.MeshBasicMaterial({ color: '#0b0b14' })
);
ground.name = 'ground';
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, 0);
scene.add(ground);

/* ---------- дома ---------- */
const HOUSES = [
  { x: -6.8, w: 2.4, h: 14.8 },
  { x: -3.7, w: 2.1, h: 10.1 },
  { x: -1.2, w: 1.6, h: 10.7 },
  { x:  1.5, w: 2.3, h: 14.9 },
  { x:  4.8, w: 2.6, h: 13.5 },
  { x:  8.0, w: 1.6, h: 10.9 }
];
const DEPTH = 3;
const FACADE_Z = DEPTH / 2;                 // 1.5
const houseMat = new THREE.MeshBasicMaterial({ color: '#0b0b14' });

const winPos = [];    // [x, y, z]
const winBase = [];   // THREE.Color

HOUSES.forEach((hd, idx) => {
  const house = new THREE.Mesh(new THREE.BoxGeometry(hd.w, hd.h, DEPTH), houseMat);
  house.name = 'house';
  house.position.set(hd.x, hd.h / 2, 0);    // низ на y = 0
  scene.add(house);

  const even = ((idx + 1) % 2) === 0;       // чётный номер дома -> бирюза
  const base = new THREE.Color(even ? '#22e0d0' : '#ffb066');

  const nCols   = Math.max(1, Math.floor(hd.w / 0.95));
  const nFloors = Math.max(1, Math.floor((hd.h - 0.35 - 1.0) / 1.45) + 1);

  for (let c = 0; c < nCols; c++) {
    const ox = (c - (nCols - 1) / 2) * 0.95;
    for (let f = 0; f < nFloors; f++) {
      winPos.push([hd.x + ox, 1.0 + f * 1.45, FACADE_Z + 0.01]);
      winBase.push(base);
    }
  }
});

/* ---------- окна (один InstancedMesh) ---------- */
const windows = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.5, 0.7),
  new THREE.MeshBasicMaterial({ color: 0xffffff }),
  winPos.length
);
windows.name = 'windows';
windows.frustumCulled = false;

const dummy = new THREE.Object3D();
for (let i = 0; i < winPos.length; i++) {
  dummy.position.set(winPos[i][0], winPos[i][1], winPos[i][2]);
  dummy.rotation.set(0, 0, 0);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  windows.setMatrixAt(i, dummy.matrix);
}
windows.instanceMatrix.needsUpdate = true;
scene.add(windows);

/* ---------- дымка ---------- */
const HAZE_H = 20;
const hazeGeo = new THREE.PlaneGeometry(120, HAZE_H, 1, 48);
{
  const pos = hazeGeo.attributes.position;
  const col = new Float32Array(pos.count * 4);
  const hc = new THREE.Color('#4a5a8a');
  for (let i = 0; i < pos.count; i++) {
    const f = (pos.getY(i) + HAZE_H / 2) / HAZE_H;   // 0 низ .. 1 верх
    col[i * 4 + 0] = hc.r;
    col[i * 4 + 1] = hc.g;
    col[i * 4 + 2] = hc.b;
    col[i * 4 + 3] = Math.pow(1 - f, 1.15);          // вертикальный градиент
  }
  hazeGeo.setAttribute('color', new THREE.BufferAttribute(col, 4));
}
const haze = new THREE.Mesh(hazeGeo, new THREE.MeshBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.22,
  depthWrite: false,
  side: THREE.DoubleSide
}));
haze.name = 'haze';
haze.position.set(0, 7.35, 12);   // перед домами
scene.add(haze);

/* ---------- анимация ---------- */
let t = 0;
let litCount = 0;
const tmpColor = new THREE.Color();

function applyWindows(time) {
  let lit = 0;
  for (let i = 0; i < winPos.length; i++) {
    const phase = (((i * 0.129 + time * 0.500) % 1) + 1) % 1;
    const on = phase < 0.78;
    if (on) lit++;
    tmpColor.copy(winBase[i]);
    if (!on) tmpColor.multiplyScalar(0.15);
    windows.setColorAt(i, tmpColor);
  }
  if (windows.instanceColor) windows.instanceColor.needsUpdate = true;
  return lit;
}

function draw() {
  litCount = applyWindows(t);
  haze.position.y = 7.35 + 0.9 * Math.sin(t * 0.25);
  renderer.render(scene, camera);
}

window.__probe = function () {
  return {
    t: Math.round(t * 10000) / 10000,
    objects: scene.children.map(o => o.name).filter(n => n && n.length > 0),
    lit: litCount,
    haze_y: Math.round(haze.position.y * 10000) / 10000
  };
};

window.__step = function (dt) {
  t += dt;
  draw();
  return window.__probe();
};

/* ---------- первый кадр ---------- */
draw();
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
