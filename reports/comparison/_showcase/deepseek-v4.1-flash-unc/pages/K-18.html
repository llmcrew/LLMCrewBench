<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Orrery</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

const W = 800, H = 600;

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 200);
camera.position.set(0.0, 10.0, 13.0);
camera.lookAt(0.0, 0.0, 0.0);

const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);

const directional = new THREE.DirectionalLight(0xffffff, 2.2);
directional.position.set(7.0, 13.0, 7.0);
scene.add(directional);

// --- star ---
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 32, 16),
  new THREE.MeshStandardMaterial({ color: 0xffcf5c })
);
sun.name = 'sun';
sun.position.set(0, 0.6, 0);
scene.add(sun);

// --- planets data ---
const PLANETS = [
  { name: 'Меркурий', R: 2.04, T: 7.81,  theta0: 150.00, color: 0x3d6bff },
  { name: 'Венера',   R: 3.77, T: 16.36, theta0: 175.06, color: 0x22b3a0 },
  { name: 'Марс',     R: 5.19, T: 8.84,  theta0: 116.62, color: 0xff5566 }
];

const planetMeshes = [];
const thetas = PLANETS.map(p => p.theta0);

const ringMaterial = new THREE.MeshBasicMaterial({
  color: 0x2f4a63,
  side: THREE.DoubleSide
});

for (let i = 0; i < PLANETS.length; i++) {
  const p = PLANETS[i];

  // orbit ring
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(p.R - 0.03, p.R + 0.03, 96),
    ringMaterial
  );
  ring.name = 'orbit-' + i;
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.3;
  scene.add(ring);

  // planet
  const planet = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 32, 16),
    new THREE.MeshStandardMaterial({ color: p.color })
  );
  planet.name = p.name;
  scene.add(planet);
  planetMeshes.push(planet);
}

function placePlanet(i) {
  const p = PLANETS[i];
  const rad = thetas[i] * Math.PI / 180;
  planetMeshes[i].position.set(
    p.R * Math.cos(rad),
    0.3,
    p.R * Math.sin(rad)
  );
}

for (let i = 0; i < PLANETS.length; i++) placePlanet(i);

// --- simulation state ---
let steps = 0;
let t = 0;

function r4(v) {
  return Math.round(v * 10000) / 10000;
}

function render() {
  renderer.render(scene, camera);
}

window.__step = function (dt) {
  for (let i = 0; i < PLANETS.length; i++) {
    thetas[i] = (thetas[i] + 360 / PLANETS[i].T * dt) % 360;
    placePlanet(i);
  }
  steps += 1;
  t += dt;
  render();
  return window.__probe();
};

window.__probe = function () {
  return {
    steps: steps,
    t: r4(t),
    camera: [0, 10, 13],
    objects: scene.children.map(c => c.name),
    planets: PLANETS.map((p, i) => ({
      name: p.name,
      theta: r4(thetas[i]),
      x: r4(planetMeshes[i].position.x),
      z: r4(planetMeshes[i].position.z)
    }))
  };
};

render();
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
