<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Euler rigid body — free rotation</title>
<style>
  html, body { margin: 0; padding: 0; background: #101418; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);

const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
camera.position.set(0.0, 2.4, 7.5);
camera.lookAt(0.0, 1.8, 0.0);

const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.position.set(5.0, 9.0, 8.0);
scene.add(dirLight);

/* ---------- ground ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x2b3a4a })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, 0);
ground.name = 'ground';
scene.add(ground);

/* ---------- body ---------- */
const body = new THREE.Mesh(
  new THREE.BoxGeometry(2.54, 1.06, 0.8),
  new THREE.MeshStandardMaterial({ color: 0xd97a3a })
);
body.position.set(0, 1.8, 0);
body.name = 'body';
scene.add(body);

/* ---------- marker on the long axis ---------- */
const marker = new THREE.Mesh(
  new THREE.SphereGeometry(0.14, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0x9fd8ff })
);
marker.position.set(1.39, 0, 0);
marker.name = 'marker';
body.add(marker);

/* ---------- physics state ---------- */
const I = [0.147, 0.591, 0.6313];      // I1, I2, I3 (axes X, Y, Z of the body)
let omega = [3.69, 0.36, 0.28];        // w1, w2, w3
let steps = 0;
let t = 0;

const q = new THREE.Quaternion();      // orientation of the body

const _wq = new THREE.Quaternion();
const _qd = new THREE.Quaternion();

function integrateOrientation(dt) {
  // dq = 0.5 * q ⊗ (0, w1, w2, w3) * dt
  _wq.set(omega[0], omega[1], omega[2], 0);
  _qd.copy(q).multiply(_wq);
  q.set(
    q.x + 0.5 * dt * _qd.x,
    q.y + 0.5 * dt * _qd.y,
    q.z + 0.5 * dt * _qd.z,
    q.w + 0.5 * dt * _qd.w
  );
  q.normalize();
}

const r4 = (x) => Number(x.toFixed(4));

/* ---------- step ---------- */
window.__step = function (dt) {
  // semi-implicit Euler, strictly in this order; updated components are reused
  omega[0] = omega[0] + (I[1] - I[2]) / I[0] * omega[1] * omega[2] * dt;
  omega[1] = omega[1] + (I[2] - I[0]) / I[1] * omega[2] * omega[0] * dt;
  omega[2] = omega[2] + (I[0] - I[1]) / I[2] * omega[0] * omega[1] * dt;

  integrateOrientation(dt);

  body.quaternion.copy(q);

  steps += 1;
  t += dt;

  renderer.render(scene, camera);

  return window.__probe();
};

/* ---------- probe ---------- */
window.__probe = function () {
  const objects = [];
  scene.traverse((o) => { if (o.name) objects.push(o.name); });

  return {
    steps: steps,
    t: r4(t),
    objects: objects,
    camera: [r4(camera.position.x), r4(camera.position.y), r4(camera.position.z)],
    omega: [r4(omega[0]), r4(omega[1]), r4(omega[2])],
    inertia: [r4(I[0]), r4(I[1]), r4(I[2])]
  };
};

/* ---------- first frame ---------- */
body.quaternion.copy(q);
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
