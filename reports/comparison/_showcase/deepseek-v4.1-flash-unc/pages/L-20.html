<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>meteor greenhouse</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style><script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

const SEED = 160488;
let lcg = SEED;
const rnd = () => { lcg = (lcg * 1103515245 + 12345) % 2147483648; return lcg / 2147483648; };

const H = (d) => Math.tan(45 * Math.PI / 360) * d;
const FW = (u, d) => u * 2 * H(d) * (800 / 600);
const FH = (u, d) => u * 2 * H(d);
const CAM_Z = 4;

const renderer = new THREE.WebGLRenderer({antialias: false, preserveDrawingBuffer: true});
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d2630, 16, 40);
const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 200);
camera.position.set(0, 0, CAM_Z);
camera.lookAt(0, 0, -1);

const solid = (c) => new THREE.MeshBasicMaterial({color: c});
const hx = (c) => c.slice(0, 2) === '0x' ? '#' + c.slice(2) : c;
const vgrad = (top, bottom) => new THREE.ShaderMaterial({
  uniforms: {uTop: {value: new THREE.Color(hx(top))}, uBottom: {value: new THREE.Color(hx(bottom))}},
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 uTop; uniform vec3 uBottom; varying vec2 vUv;
    void main() {
      gl_FragColor = vec4(mix(uBottom, uTop, smoothstep(0.0, 1.0, vUv.y)), 1.0);
      #include <colorspace_fragment>
    }`,
});
const haze = (c, o) => new THREE.MeshBasicMaterial({color: c, transparent: true, opacity: o, depthWrite: false});
const glow = (c, o) => new THREE.MeshBasicMaterial({color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false});
// Свет и материал вместо эмиссивной заливки: поверхности получают блик и затенение.
const lit = (c, o) => new THREE.MeshStandardMaterial({color: c, roughness: 0.62, metalness: 0.06, opacity: o ?? 1, transparent: (o ?? 1) < 1});
const foliage = new THREE.MeshBasicMaterial({color: 0x7fd054});
const glass = new THREE.MeshStandardMaterial({color: 0x123038, emissive: 0x0c2530, emissiveIntensity: 0.35, roughness: 0.35, metalness: 0.15, transparent: true, opacity: 0.85, side: THREE.DoubleSide});

const place = (mesh, u, v, z) => {
  mesh.position.set((u - 0.5) * FW(1, CAM_Z - z), (0.5 - v) * FH(1, CAM_Z - z), z);
  scene.add(mesh);
  return mesh;
};
const quad = (u, v, material, name, z) => {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(FW(u, CAM_Z - z), FH(v, CAM_Z - z)), material);
  mesh.name = name;
  return place(mesh, 0.5, 0.5, z);
};
const solid3 = (u, v, d, material, name, z) => {
  const depth = d * FW(u, CAM_Z - z);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(FW(u, CAM_Z - z), FH(v, CAM_Z - z), depth), material);
  mesh.name = name;
  return place(mesh, 0.5, 0.5, z);
};
const body = (w, h, d, material, name, u, v, z) => {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(FW(w, CAM_Z - z), FH(h, CAM_Z - z), d), material);
  mesh.name = name;
  return place(mesh, u, v, z);
};
const spray = (n, size, colour) => {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
  const cloud = new THREE.Points(geometry, new THREE.PointsMaterial({
    size: size, sizeAttenuation: false, color: colour, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthTest: false,
  }));
  scene.add(cloud);
  return cloud;
};
const round = (v) => Math.round(v * 1e4) / 1e4;
const names = () => scene.children.map((o) => o.name).filter(Boolean);

// Свет станции: тёплые лампы под куполом, холодный ключ снаружи и слабый общий.
scene.add(new THREE.AmbientLight(0x3d5a68, 1.15));
const key = new THREE.PointLight(0xffd6a2, 6.0, 30, 2.0);
key.position.set(0, 1.1, -3);
scene.add(key);
const rim = new THREE.PointLight(0x9fc4d8, 3.0, 40, 2.0);
rim.position.set(0.5, 1.6, -7);
scene.add(rim);

const FLY = 2.32;
const SPEED = 2.00;
const DOME_Z = -14.8;

// Ночь и дальний корпус: тёмный холодный фон за куполом.
place(quad(2.6, 2.6, vgrad('0x16323c', '0x061014'), 'night', -60), 0.5, 0.5, -60);
place(quad(1.9, 1.5, haze(0x123038, 0.5), 'dome_far', -34), 0.5, 0.34, -34);

// Стеклянный купол: задняя панель и две наклонённые боковые.
place(quad(0.714, 0.72, glass, 'dome_back', DOME_Z), 0.5, 0.31, DOME_Z);
place(quad(1.02, 0.02, glow(0xffc06a, 0.5), 'dome_ridge', DOME_Z + 0.05), 0.5, 0.30, DOME_Z + 0.05);
place(quad(0.34, 0.65, haze(0x123038, 0.6), 'dome_left', -12), 0.16, 0.34, -12).rotation.y = 0.6;
place(quad(0.34, 0.65, haze(0x123038, 0.6), 'dome_right', -12), 0.84, 0.34, -12).rotation.y = -0.6;

// Пол станции телом, уходящим в глубину, с тёплой кромкой.
body(2.6, 0.46, 3.2, lit(0x0a1a22), 'floor', 0.5, 0.84, -8);
place(quad(2.6, 0.03, glow(0xffc06a, 0.85), 'floor_lip', -7.9), 0.5, 0.62, -7.9);

// Рёбра купола: четыре наклонные тёмные тела.
for (let i = 0; i < 4; i++) {
  const rib = solid3(0.012, 0.66, 0.10, lit(0x08161c), 'rib' + i, -13);
  place(rib, 0.20 + i * 0.20, 0.33, -13);
  rib.rotation.z = (i % 2 ? 0.14 : -0.14);
}

// Мягкие лампы под куполом: светящееся тело и точка света.
for (let i = 0; i < 5; i++) {
  const u = 0.30 + i * 0.10;
  place(quad(0.09, 0.07, glow(0xffc06a, 0.75), 'lamp' + i, -9), u, 0.10, -9);
  place(quad(0.12, 0.09, glow(0xffb457, 0.18), 'lamp_halo' + i, -8.8), u, 0.10, -8.8);
  if (i % 2 === 0) {
    const pl = new THREE.PointLight(0xffc06a, 2.4, 12, 2.0);
    pl.position.set((u - 0.5) * FW(1, CAM_Z + 9), (0.5 - 0.10) * FH(1, CAM_Z + 9), -9);
    scene.add(pl);
  }
}

// Растения в кадках: ствол-цилиндр, три листа, горшок.
const plants = [];
for (let i = 0; i < 4; i++) {
  const u = 0.12 + (i % 4) * 0.25;
  const h = 0.36 + (i % 3) * 0.11;
  const z = -4 - (i % 3) * 2.4;
  const base = 0.88;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(FW(0.018, CAM_Z - z), FW(0.024, CAM_Z - z), FH(h, CAM_Z - z), 8), lit(0x08202a));
  stem.name = 'stem' + i;
  place(stem, u, base - h / 2, z);
  plants.push(stem);
  const leaf = (name, du, dv, w, hh) => {
    const m = body(w, hh, 0.05, foliage, name, u + du, base - dv, z + 0.14);
    m.rotation.z = du * 3.0;
    return m;
  };
  leaf('leaf_a' + i, -0.065, h * 0.72, 0.10, 0.06);
  leaf('leaf_b' + i, 0.065, h * 0.52, 0.09, 0.06);
  leaf('leaf_top' + i, 0.0, h + 0.02, 0.12, 0.07);
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(FW(0.045, CAM_Z - z), FW(0.036, CAM_Z - z), FH(0.07, CAM_Z - z), 10), lit(0x0a222c));
  pot.name = 'pot' + i;
  place(pot, u, base - 0.03, z);
  plants.push(pot);
}

// Метеорный дождь снаружи и капли по стеклу.
const meteors = spray(26, 5, 0xa8c8dc);
const meteorSpan = FH(0.9, 26), meteorWide = FW(1.3, 26);
const meteorSpeed = [];
{
  const p = meteors.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) {
    p.setXYZ(i, (rnd() - 0.5) * meteorWide, (rnd() - 0.5) * meteorSpan, -22);
    meteorSpeed.push(6 + rnd() * 3);
  }
  p.needsUpdate = true;
}
const drops = spray(64, 5, 0xa8c8dc);
const dropSpan = FH(0.80, 10), dropWide = FW(0.86, 10);
{
  const p = drops.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) p.setXYZ(i, (rnd() - 0.5) * dropWide, (rnd() - 0.5) * dropSpan, -13.5);
  p.needsUpdate = true;
}

let t = 0;
const fizz = [];
for (let i = 0; i < 64; i++) fizz.push(0.6 + rnd() * 0.8);

window.__step = (dt) => {
  t += dt;
  const pm = meteors.geometry.attributes.position;
  for (let i = 0; i < pm.count; i++) {
    let y = pm.getY(i) - meteorSpeed[i] * dt;
    let x = pm.getX(i) + meteorSpeed[i] * 0.45 * dt;
    if (y < -meteorSpan / 2) { y += meteorSpan; x -= meteorWide * 0.45; }
    if (x > meteorWide / 2) x -= meteorWide;
    pm.setXYZ(i, x, y, -22);
  }
  pm.needsUpdate = true;
  const pd = drops.geometry.attributes.position;
  for (let i = 0; i < pd.count; i++) {
    let y = pd.getY(i) - SPEED * fizz[i % 64] * dt;
    if (y < -dropSpan / 2) y += dropSpan;
    pd.setY(i, y);
  }
  pd.needsUpdate = true;
  camera.position.z = Math.max(1.0, camera.position.z - FLY * dt);
  camera.position.x = Math.sin(t * 0.35) * 0.6;
  camera.lookAt(camera.position.x * 0.4, 0, -1);
  renderer.render(scene, camera);
  return window.__probe();
};

window.__probe = () => ({
  t: round(t),
  objects: names(),
  meteor: [round(meteors.geometry.attributes.position.getX(0)), round(meteors.geometry.attributes.position.getY(0))],
  camera: [round(camera.position.x), round(camera.position.z)],
});

renderer.render(scene, camera);
window.__ready = true;
</script>
</body></html>
