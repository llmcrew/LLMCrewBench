<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Aurora — 28 ribbons</title>
<style>
  html, body { margin: 0; padding: 0; background: #1d1638; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ---------- deterministic LCG (seed 53827) ---------- */
const MOD = 4294967296;
let s = 53827;
function rnd() {
  s = (1664525 * s + 1013904223) % MOD;
  return s / MOD;
}

/* ---------- frame geometry ---------- */
const FOV = 45;
const DIST = 10.0;
const FRAME_H = 2 * DIST * Math.tan((FOV / 2) * Math.PI / 180); // ≈ 8.2843
const FRAME_W = FRAME_H * (800 / 600);                          // ≈ 11.0457

/* ---------- scene / camera / renderer ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1638);

const camera = new THREE.PerspectiveCamera(FOV, 800 / 600, 0.1, 200);
camera.position.set(0, 0, DIST);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

if (THREE.SRGBColorSpace !== undefined && 'outputColorSpace' in renderer) {
  renderer.outputColorSpace = THREE.SRGBColorSpace;
} else if (THREE.sRGBEncoding !== undefined && 'outputEncoding' in renderer) {
  renderer.outputEncoding = THREE.sRGBEncoding;
}

/* ---------- helpers ---------- */
function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/* ---------- shared 64x256 canvas texture ----------
   vertical: bottom #18f051 -> middle #2197db -> top #ff33ee
   horizontal: opaque middle, soft side falloff (curtain look) */
function makeTexture() {
  const W = 64, H = 256;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);

  const cTop = [0xff, 0x33, 0xee];
  const cMid = [0x21, 0x97, 0xdb];
  const cBot = [0x18, 0xf0, 0x51];

  for (let y = 0; y < H; y++) {
    // canvas row 0 == top of ribbon (flipY), row H-1 == bottom
    const t = y / (H - 1);
    let col;
    if (t < 0.5) {
      const k = t / 0.5;
      col = [cTop[0] + (cMid[0] - cTop[0]) * k,
             cTop[1] + (cMid[1] - cTop[1]) * k,
             cTop[2] + (cMid[2] - cTop[2]) * k];
    } else {
      const k = (t - 0.5) / 0.5;
      col = [cMid[0] + (cBot[0] - cMid[0]) * k,
             cMid[1] + (cBot[1] - cMid[1]) * k,
             cMid[2] + (cBot[2] - cMid[2]) * k];
    }
    for (let x = 0; x < W; x++) {
      const nx = (x + 0.5) / W;
      const d = Math.abs(nx - 0.5) * 2;      // 0 center, 1 edge
      const a = 1 - smoothstep(0.4, 1.0, d); // opaque middle, soft sides
      const idx = (y * W + x) * 4;
      img.data[idx]     = Math.round(col[0]);
      img.data[idx + 1] = Math.round(col[1]);
      img.data[idx + 2] = Math.round(col[2]);
      img.data[idx + 3] = Math.round(a * 255);
    }
  }
  ctx.putImageData(img, 0, 0);

  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  if (THREE.SRGBColorSpace !== undefined && 'colorSpace' in tex) {
    tex.colorSpace = THREE.SRGBColorSpace;
  } else if (THREE.sRGBEncoding !== undefined && 'encoding' in tex) {
    tex.encoding = THREE.sRGBEncoding;
  }
  tex.needsUpdate = true;
  return tex;
}

const tex = makeTexture();

/* ---------- 28 ribbons ---------- */
const N = 28;
const ribbons = [];

for (let i = 0; i < N; i++) {
  const u  = rnd();
  const v  = rnd();
  const u2 = rnd();
  const u3 = rnd();
  const u4 = rnd();
  const u5 = rnd();

  const w  = 0.030 + 0.055 * u;                       // fraction of frame width
  const h  = 0.30  + 0.38  * v;                       // fraction of frame height
  const x  = (i + 0.5 + 0.6 * (u2 - 0.5)) / N - 0.5;  // fraction of frame width
  const y  = 0.02  + 0.26  * u3;                      // fraction of frame height
  const op = 0.16  + 0.24  * u4;
  const ph = 0.4   * u5;

  const geo = new THREE.PlaneGeometry(1, 1);
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    opacity: op
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'ribbon_' + (i + 1);
  mesh.position.set(x * FRAME_W, y * FRAME_H, 0);
  mesh.scale.set(w * FRAME_W, h * FRAME_H, 1);
  mesh.userData = { xf: x, hf: h, ph: ph };
  scene.add(mesh);
  ribbons.push(mesh);
}

/* ---------- animation state ---------- */
let t = 0;

function applyWave() {
  const wphase = 2 * Math.PI * 0.35 * t;
  for (const m of ribbons) {
    const d = m.userData;
    const dx = 0.05 * Math.sin(wphase - 3.0 * d.xf + d.ph);
    const hh = d.hf * (1 + 0.15 * Math.sin(2 * Math.PI * 0.35 * 0.7 * t + d.ph));
    m.position.x = (d.xf + dx) * FRAME_W;
    m.scale.y = hh * FRAME_H;
  }
}

function draw() {
  applyWave();
  renderer.render(scene, camera);
}

/* ---------- public API ---------- */
window.__probe = function () {
  return {
    t: Number(t.toFixed(4)),
    objects: scene.children.map(o => o.name),
    wave: Number((2 * Math.PI * 0.35 * t).toFixed(4))
  };
};

window.__step = function (dt) {
  t += dt;
  draw();
  return window.__probe();
};

/* ---------- first frame ---------- */
draw();
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
