<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Bar chart scene</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ---------- renderer / camera ---------- */
const W = 800, H = 600;

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 200);
camera.position.set(0.0, 7.0, 18.0);
camera.lookAt(0.0, 3.0, 0.0);

/* ---------- lights ---------- */
const ambient = new THREE.AmbientLight(0xffffff, 0.35);
ambient.name = 'ambient';
scene.add(ambient);

const directional = new THREE.DirectionalLight(0xffffff, 2.2);
directional.position.set(8.0, 14.0, 8.0);
directional.name = 'directional';
scene.add(directional);

/* ---------- ground ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.MeshStandardMaterial({ color: 0x2b3a4a })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, 0);
ground.name = 'ground';
scene.add(ground);

/* ---------- data ---------- */
const DATA = [
  { label: 'A', value: 4.99 },
  { label: 'B', value: 4.21 },
  { label: 'C', value: 6.61 },
  { label: 'D', value: 7.00 },
  { label: 'E', value: 4.97 },
  { label: 'F', value: 6.07 },
  { label: 'G', value: 2.00 }
];
const n = DATA.length;

/* ---------- bars ---------- */
const barGeo = new THREE.BoxGeometry(1, 1, 1);
const barMat = new THREE.MeshStandardMaterial({ color: 0xff8a3d });
const bars = [];

for (let i = 0; i < n; i++) {
  const bar = new THREE.Mesh(barGeo, barMat);
  bar.name = 'bar-' + i;
  bar.position.set((i - (n - 1) / 2) * 2.0, 0, 0);
  bar.scale.set(1, 0, 1);
  scene.add(bar);
  bars.push(bar);
}

/* ---------- marker ---------- */
const marker = new THREE.Mesh(
  new THREE.SphereGeometry(0.25, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0xffe066 })
);
marker.name = 'marker';
marker.position.set(bars[0].position.x, 0.5, 0);
scene.add(marker);

/* ---------- simulation state ---------- */
let t = 0;
let steps = 0;

function currentHeights() {
  const k = Math.min(1, t / 0.5);
  return DATA.map(d => d.value * k);
}

function applyState() {
  const hs = currentHeights();
  for (let i = 0; i < n; i++) {
    bars[i].scale.y = hs[i];
    bars[i].position.y = hs[i] / 2;   // нижняя грань на полу
  }
  const active = steps % n;
  marker.position.set(bars[active].position.x, hs[active] + 0.5, 0);
}

function round4(x) {
  return Math.round(x * 10000) / 10000;
}

/* ---------- public API ---------- */
window.__step = function (dt) {
  t += dt;
  steps += 1;
  applyState();
  renderer.render(scene, camera);
  return window.__probe();
};

window.__probe = function () {
  const hs = currentHeights();
  return {
    steps: steps,
    t: round4(t),
    objects: scene.children.map(c => c.name),
    bars: DATA.map((d, i) => ({ label: d.label, height: round4(hs[i]) })),
    max_height: round4(Math.max.apply(null, hs)),
    active: steps % n
  };
};

/* ---------- first frame ---------- */
applyState();
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
