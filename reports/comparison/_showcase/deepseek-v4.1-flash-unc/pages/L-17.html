<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>lofi — комната с дождём за окном</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ================= deterministic LCG ================= */
let lcg = 232350;
function rnd() {
  lcg = (lcg * 1103515245 + 12345) % 2147483648;
  return lcg / 2147483648;
}

/* ================= constants ================= */
const W = 800, H = 600;
const FOV = 50;
const ASPECT = W / H;
const CAM_Z0 = 4;
const CAM_Z_END = -3.6;
const CAM_SPEED = 1.64;

/* ================= renderer / scene / camera ================= */
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x2e1636, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2e1636);

const camera = new THREE.PerspectiveCamera(FOV, ASPECT, 0.1, 400);
camera.position.set(0, 0, CAM_Z0);
camera.lookAt(0, 0, -1);

/* ================= helpers ================= */
function uvAt(u, v, z) {
  const d = CAM_Z0 - z;
  const h = 2 * d * Math.tan(FOV * Math.PI / 360);
  const w = h * ASPECT;
  return { x: (u - 0.5) * w, y: (0.5 - v) * h, h: h, w: w };
}

function addPlane(w, h, x, y, z, color, opts) {
  opts = opts || {};
  const mat = new THREE.MeshBasicMaterial({
    color: color,
    transparent: opts.opacity !== undefined && opts.opacity < 1,
    opacity: opts.opacity !== undefined ? opts.opacity : 1,
    depthWrite: opts.depthWrite !== undefined ? opts.depthWrite : true,
    side: opts.side || THREE.FrontSide,
    blending: opts.blending || THREE.NormalBlending
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z);
  if (opts.rotX) m.rotation.x = opts.rotX;
  if (opts.rotZ) m.rotation.z = opts.rotZ;
  if (opts.renderOrder !== undefined) m.renderOrder = opts.renderOrder;
  scene.add(m);
  return m;
}

/* ================= window frame ================= */
const GZ = -6.0;
const gTop = uvAt(0.5, 0.11, GZ).y;
const gBot = uvAt(0.5, 0.45, GZ).y;
const gLeft = uvAt(0.11, 0.5, GZ).x;
const gRight = uvAt(0.89, 0.5, GZ).x;
const gW = gRight - gLeft;
const gH = gTop - gBot;
const gCY = (gTop + gBot) / 2;

const WZ = -6.05;
addPlane(60, 30 - gTop, 0, (gTop + 30) / 2, WZ, 0x2e1636).name = 'wall_top';
addPlane(60, gBot + 30, 0, (gBot - 30) / 2, WZ, 0x2e1636).name = 'wall_bottom';
addPlane(gLeft + 30, gH, (gLeft - 30) / 2, gCY, WZ, 0x2e1636).name = 'wall_left';
addPlane(30 - gRight, gH, (gRight + 30) / 2, gCY, WZ, 0x2e1636).name = 'wall_right';

/* glass */
const glass = addPlane(gW, gH, 0, gCY, GZ, 0x6a90a8, { opacity: 0.35, depthWrite: false, renderOrder: 1 });
glass.name = 'glass';

/* warm sill strip at 50% height */
const sillTop = gBot;
const sillBot = uvAt(0.5, 0.55, GZ).y;
addPlane(gW + 0.6, sillTop - sillBot, 0, (sillTop + sillBot) / 2, GZ + 0.05, 0xffa83c, { renderOrder: 1 }).name = 'sill';

/* ================= city behind glass ================= */
const CITY_Z = -20;
const cityInfo = uvAt(0.5, 0.5, CITY_Z);
const cityGroup = new THREE.Group();
cityGroup.name = 'city';
const bMat = new THREE.MeshBasicMaterial({ color: 0x1a0e24 });
for (let i = 0; i < 18; i++) {
  const bw = 1.4 + rnd() * 2.6;
  const bh = 6 + rnd() * 7;
  const bx = -15 + i * 1.75 + rnd() * 0.9;
  const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 2), bMat);
  m.position.set(bx, -4 + bh / 2, CITY_Z);
  cityGroup.add(m);
}
scene.add(cityGroup);

const winMat = new THREE.MeshBasicMaterial({
  color: 0x7fe3e0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const winSize = 0.012 * cityInfo.h;
for (let i = 0; i < 26; i++) {
  const wx = -11 + rnd() * 22;
  const wy = 1.2 + rnd() * 7.5;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(winSize, winSize), winMat);
  m.position.set(wx, wy, CITY_Z + 1.05);
  m.renderOrder = 2;
  scene.add(m);
}

/* ================= rain streaks ================= */
const RAIN_Z = -12;
const rainCount = 64;
const rainYMin = 0.0, rainYMax = 6.5;
const rainPos = new Float32Array(rainCount * 3);
for (let i = 0; i < rainCount; i++) {
  rainPos[i * 3] = -8 + rnd() * 16;
  rainPos[i * 3 + 1] = rainYMin + rnd() * (rainYMax - rainYMin);
  rainPos[i * 3 + 2] = RAIN_Z;
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.PointsMaterial({
  color: 0xa8c8dc, size: 5, sizeAttenuation: false,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const rain = new THREE.Points(rainGeo, rainMat);
rain.name = 'rain';
rain.renderOrder = 3;
scene.add(rain);

/* ================= drops on the glass ================= */
const DROP_Z = -5.9;
const dropCount = 240;
const dropYMin = 0.4, dropYMax = 3.7;
const dropPos = new Float32Array(dropCount * 3);
for (let i = 0; i < dropCount; i++) {
  dropPos[i * 3] = -4.8 + rnd() * 9.6;
  dropPos[i * 3 + 1] = dropYMin + rnd() * (dropYMax - dropYMin);
  dropPos[i * 3 + 2] = DROP_Z;
}
const dropGeo = new THREE.BufferGeometry();
dropGeo.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));
const dropMat = new THREE.PointsMaterial({
  color: 0xa8c8dc, size: 6, sizeAttenuation: false,
  transparent: true, opacity: 0.9, depthWrite: false
});
const drops = new THREE.Points(dropGeo, dropMat);
drops.name = 'drops';
drops.renderOrder = 4;
scene.add(drops);

/* ================= plant on the sill ================= */
const PLANT_Z = -5.5;
const pInfo = uvAt(0.16, 0.5, PLANT_Z);
const plantBaseY = uvAt(0.5, 0.45, PLANT_Z).y;
const plantGroup = new THREE.Group();
plantGroup.name = 'plant';
plantGroup.position.set(pInfo.x, plantBaseY, PLANT_Z);

const leafMat = new THREE.MeshBasicMaterial({ color: 0x7bbf6a, side: THREE.DoubleSide });
const leafSpecs = [
  [0.09, 0.15, 0.35, 0.95, 0.35],
  [0.08, 0.12, -0.35, 0.70, -0.45],
  [0.07, 0.10, 0.05, 1.35, 0.10]
];
for (let i = 0; i < leafSpecs.length; i++) {
  const s = leafSpecs[i];
  const m = new THREE.Mesh(new THREE.PlaneGeometry(s[0] * pInfo.w, s[1] * pInfo.h), leafMat);
  m.position.set(s[2], s[3], 0);
  m.rotation.z = s[4];
  plantGroup.add(m);
}
const pot = new THREE.Mesh(
  new THREE.BoxGeometry(0.42, 0.36, 0.42),
  new THREE.MeshBasicMaterial({ color: 0x2e1636 })
);
pot.position.set(0, 0.18, 0);
plantGroup.add(pot);
scene.add(plantGroup);

/* ================= desk + monitor ================= */
const DESK_Z = -5.2;
const dInfo = uvAt(0.73, 0.72, DESK_Z);
const desk = new THREE.Mesh(
  new THREE.BoxGeometry(3.6, 0.25, 1.4),
  new THREE.MeshBasicMaterial({ color: 0x2e1636 })
);
desk.position.set(dInfo.x, dInfo.y, DESK_Z);
desk.name = 'desk';
scene.add(desk);

addPlane(2.2, 1.4, dInfo.x, dInfo.y + 0.13, DESK_Z, 0xffa83c, {
  rotX: -Math.PI / 2, renderOrder: 5
}).name = 'desk_glow';

const mon = addPlane(1.65, 1.0, dInfo.x, dInfo.y + 0.65, DESK_Z - 0.1, 0x7fe3e0, { renderOrder: 5 });
mon.name = 'monitor';

/* ================= warm lamp ================= */
const lInfo = uvAt(0.25, 0.06, -5.0);
const lamp = new THREE.Mesh(
  new THREE.SphereGeometry(0.32, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xffa83c })
);
lamp.position.set(lInfo.x, lInfo.y, -5.0);
lamp.name = 'lamp';
scene.add(lamp);
addPlane(1.5, 1.5, lInfo.x, lInfo.y, -5.05, 0xffa83c, {
  opacity: 0.22, depthWrite: false, renderOrder: 0
}).name = 'lamp_glow';

/* ================= probe / step ================= */
const objectNames = [
  'wall_top', 'wall_bottom', 'wall_left', 'wall_right', 'glass', 'sill',
  'city', 'rain', 'drops', 'plant', 'desk', 'desk_glow', 'monitor', 'lamp', 'lamp_glow'
];

let t = 0;

window.__probe = function () {
  return {
    t: Number(t.toFixed(4)),
    objects: objectNames.slice(),
    camera: [
      Number(camera.position.x.toFixed(4)),
      Number(camera.position.z.toFixed(4))
    ]
  };
};

const RAIN_SPEED = 2.4;
const DROP_SPEED = 0.55;

window.__step = function (dt) {
  t += dt;

  /* camera slowly pushes toward the window */
  camera.position.z = Math.max(CAM_Z_END, camera.position.z - CAM_SPEED * dt);

  /* rain falls and wraps */
  const rp = rainGeo.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
    rp[i * 3 + 1] -= RAIN_SPEED * dt;
    if (rp[i * 3 + 1] < rainYMin) rp[i * 3 + 1] += (rainYMax - rainYMin);
  }
  rainGeo.attributes.position.needsUpdate = true;

  /* drops slide down the glass and wrap */
  const dp = dropGeo.attributes.position.array;
  for (let i = 0; i < dropCount; i++) {
    dp[i * 3 + 1] -= DROP_SPEED * dt;
    if (dp[i * 3 + 1] < dropYMin) dp[i * 3 + 1] += (dropYMax - dropYMin);
  }
  dropGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
  return window.__probe();
};

/* first frame at t = 0 */
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
