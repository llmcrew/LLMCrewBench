<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Neon Bus Stop</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ================= deterministic LCG ================= */
let _lcg = 140149n;
const _A = 1103515245n, _C = 12345n, _M = 2147483648n;
function rnd() {
  _lcg = (_lcg * _A + _C) % _M;
  return Number(_lcg) / 2147483648;
}

/* ================= renderer / scene / camera ================= */
const W = 800, H = 600;
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-4, 4, 3, -3, 0.1, 200);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, -1);

/* frame helpers: u,v in [0..1] -> world coords (frame is 8 x 6 world units) */
const FW = 8, FH = 6;
const ux = u => (u - 0.5) * FW;
const vy = v => (0.5 - v) * FH;
const sw = f => f * FW;
const sh = f => f * FH;

const names = [];
function reg(n) { if (names.indexOf(n) === -1) names.push(n); }

function plane(name, w, h, x, y, z, color, opacity = 1, blending = THREE.NormalBlending) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({
      color,
      transparent: opacity < 1,
      opacity,
      blending,
      depthWrite: true,
      depthTest: true
    })
  );
  m.position.set(x, y, z);
  m.name = name;
  scene.add(m);
  reg(name);
  return m;
}

/* ================= static geometry ================= */

/* night backdrop */
plane('night', 40, 40, 0, 0, -45, 0x1c1236);

/* asphalt floor: from 62% height down */
plane('floor', 40, sh(0.38), 0, vy(0.81), -8, 0x1c1236);

/* canopy: top strip 0..16% */
plane('canopy', 40, sh(0.16), 0, vy(0.08), -5, 0x1c1236);

/* glass panel: 62% x 44%, top at 16% height */
plane('glass', sw(0.62), sh(0.44), 0, vy(0.38), -5, 0xa8c8dc, 0.32);

/* two canopy posts at the glass edges */
plane('post', sw(0.02), sh(0.62), ux(0.19), vy(0.31), -4.95, 0x1c1236);
plane('post', sw(0.02), sh(0.62), ux(0.81), vy(0.31), -4.95, 0x1c1236);

/* crimson neon sign behind the glass */
plane('neon', sw(0.30), sh(0.06), ux(0.58), vy(0.24), -6, 0xff4d9d);

/* bench under the glass */
plane('bench', sw(0.30), sh(0.05), 0, vy(0.66), -5, 0x1c1236);

/* three puddles with reflection */
[-2.24, 0, 2.24].forEach(x => {
  plane('puddle', sw(0.18), sh(0.04), x, vy(0.90), -7.9, 0xff4d9d, 0.35);
});

/* warm lamp under the canopy + warm halo */
plane('lamp', sw(0.13), sh(0.06), ux(0.62), vy(0.14), -4.8, 0xffa83c, 0.9);
plane('halo', sw(0.20), sh(0.10), ux(0.62), vy(0.14), -4.85, 0xffa83c, 0.45, THREE.AdditiveBlending);

/* ================= hologram board ================= */
const boardGroup = new THREE.Group();
boardGroup.position.set(ux(0.32), vy(0.30), -4.8);
scene.add(boardGroup);
reg('board');

const boardBase = new THREE.Mesh(
  new THREE.PlaneGeometry(sw(0.22), sh(0.14)),
  new THREE.MeshBasicMaterial({ color: 0x22d3c5 })
);
boardGroup.add(boardBase);

const stripeMat = new THREE.MeshBasicMaterial({ color: 0x0a5f5a });
const stripes = [];
for (let i = 0; i < 5; i++) {
  const s = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.08), stripeMat);
  s.position.set(0, -0.34 + i * 0.14, 0.01);
  boardGroup.add(s);
  stripes.push(s);
}
const header = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.10), stripeMat);
header.position.set(0, 0.34, 0.01);
boardGroup.add(header);

/* ================= drops + rain ================= */
const DROP_COUNT = 56;
const dropBaseX = new Float32Array(DROP_COUNT);
const dropBaseY = new Float32Array(DROP_COUNT);
const dropPos = new Float32Array(DROP_COUNT * 3);

for (let i = 0; i < DROP_COUNT; i++) {
  const u = 0.19 + rnd() * 0.62;
  const v = 0.16 + rnd() * 0.44;
  dropBaseX[i] = ux(u);
  dropBaseY[i] = vy(v);
  dropPos[i * 3] = dropBaseX[i];
  dropPos[i * 3 + 1] = dropBaseY[i];
  dropPos[i * 3 + 2] = 0;
}

const dropGeo = new THREE.BufferGeometry();
dropGeo.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));
const dropMat = new THREE.PointsMaterial({
  color: 0xa8c8dc,
  size: 6,
  sizeAttenuation: false
});
const drops = new THREE.Points(dropGeo, dropMat);
drops.position.z = -4.9;
drops.name = 'drops';
scene.add(drops);
reg('drops');

/* rain streaks behind the glass, same points, 1/3 slower */
const rainGeo = new THREE.PlaneGeometry(0.06, 0.5);
const rainMat = new THREE.MeshBasicMaterial({ color: 0xa8c8dc });
const rainMeshes = [];
for (let i = 0; i < DROP_COUNT; i++) {
  const m = new THREE.Mesh(rainGeo, rainMat);
  m.position.set(dropBaseX[i], dropBaseY[i], -12);
  scene.add(m);
  rainMeshes.push(m);
}
reg('rain');

/* ================= animation state ================= */
let t = 0;
let boardPhase = 0;

const DROP_SPEED = 1.90;
const RAIN_SPEED = 1.90 / 3;
const WRAP_RANGE = 2.64;   /* y from -0.6 (v=0.60) to 2.04 (v=0.16) */
const WRAP_LOW = -0.6;

function updateScene() {
  /* drops fall in front of the glass */
  const pa = dropGeo.attributes.position;
  const fall = (t * DROP_SPEED) % WRAP_RANGE;
  for (let i = 0; i < DROP_COUNT; i++) {
    let y = dropBaseY[i] - fall;
    if (y < WRAP_LOW) y += WRAP_RANGE;
    pa.setY(i, y);
  }
  pa.needsUpdate = true;

  /* rain falls behind the glass, slower */
  const rfall = (t * RAIN_SPEED) % WRAP_RANGE;
  for (let i = 0; i < DROP_COUNT; i++) {
    let y = dropBaseY[i] - rfall;
    if (y < WRAP_LOW) y += WRAP_RANGE;
    rainMeshes[i].position.y = y;
  }

  /* running schedule lines */
  for (let i = 0; i < 5; i++) {
    const p = (boardPhase * 0.6 + i * 0.2) % 1;
    stripes[i].position.x = -0.88 + p * 1.21;
  }
  /* blinking header */
  header.visible = (Math.floor(boardPhase * 2) % 2) === 0;

  /* subtle camera sway */
  camera.position.x = 0.034 * Math.sin(t * 0.6);
  camera.lookAt(0, 0, -1);
}

/* ================= public API ================= */
window.__probe = function () {
  return {
    t: Number(t.toFixed(4)),
    objects: names.slice(),
    board_phase: Number(boardPhase.toFixed(4))
  };
};

window.__step = function (dt) {
  t += dt;
  boardPhase += dt * 0.5;
  updateScene();
  renderer.render(scene, camera);
  return window.__probe();
};

/* first frame */
updateScene();
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
