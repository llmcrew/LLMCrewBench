<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Night Fireworks</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ---------- renderer / scene / camera ---------- */
const W = 800, H = 600;

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x280f54);   // ночное небо

const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 200);
camera.position.set(0, 0, 12.0);
camera.lookAt(0, 0, 0);

/* ---------- frame-fraction -> world ---------- */
const HALF_H = 4.971;
const ASPECT = W / H;
const fx2x = fx => (fx - 0.5) * 2 * HALF_H * ASPECT;
const fy2y = fy => (0.5 - fy) * 2 * HALF_H;

/* ---------- fixture constants ---------- */
const LAUNCH = [[0.343, 0.287], [0.373, 0.329], [0.448, 0.334]];
const DELAYS = [0.0, 0.3, 0.7];
const COLORS = [0xff0051, 0xffc300, 0x19cdff];
const N       = 320;
const SPEED   = 2.20;
const GRAV    = 1.10;
const LIFE    = 1.90;
const PERIOD  = 2.00;

/* ---------- deterministic LCG ---------- */
let s = 571619;
function rnd() {
  s = (1664525 * s + 1013904223) % 4294967296;
  return s / 4294967296;
}

/* ---------- build bursts ---------- */
const bursts = [];

for (let b = 0; b < 3; b++) {
  const px = fx2x(LAUNCH[b][0]);
  const py = fy2y(LAUNCH[b][1]);
  const pz = 0;

  const vecs = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const u = rnd();
    const v = rnd();
    const w = rnd();
    const z   = 1 - 2 * u;
    const phi = 2 * Math.PI * v;
    const rr  = Math.sqrt(Math.max(0, 1 - z * z));
    const V   = SPEED * (0.65 + 0.5 * w);
    vecs[i * 3]     = rr * Math.cos(phi) * V;
    vecs[i * 3 + 1] = z * V;
    vecs[i * 3 + 2] = rr * Math.sin(phi) * V * 0.5;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(N * 3), 3));

  const mat = new THREE.PointsMaterial({
    size: 6.0,
    sizeAttenuation: false,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    vertexColors: true,
    color: new THREE.Color(COLORS[b])
  });

  const pts = new THREE.Points(geo, mat);
  pts.name = 'burst_' + (b + 1);
  pts.frustumCulled = false;
  scene.add(pts);

  bursts.push({ pts, geo, vecs, px, py, pz, delay: DELAYS[b], tau: 0, bright: 0 });
}

/* ---------- animation state ---------- */
let t = 0;

function update() {
  for (const b of bursts) {
    let tau = (t - b.delay) % PERIOD;
    if (tau < 0) tau += PERIOD;

    const bright = Math.max(0, 1 - tau / LIFE);
    const pos = b.geo.attributes.position.array;
    const col = b.geo.attributes.color.array;
    const g2  = 0.5 * GRAV * tau * tau;

    for (let i = 0; i < N; i++) {
      pos[i * 3]     = b.px + b.vecs[i * 3] * tau;
      pos[i * 3 + 1] = b.py + b.vecs[i * 3 + 1] * tau - g2;
      pos[i * 3 + 2] = b.pz + b.vecs[i * 3 + 2] * tau;

      col[i * 3]     = bright;
      col[i * 3 + 1] = bright;
      col[i * 3 + 2] = bright;
    }

    b.geo.attributes.position.needsUpdate = true;
    b.geo.attributes.color.needsUpdate = true;
    b.tau = tau;
    b.bright = bright;
  }
}

/* ---------- probe ---------- */
function probe() {
  const bs = bursts.map(b => {
    const tau = b.tau;
    const g2  = 0.5 * GRAV * tau * tau;
    let sum = 0;
    for (let i = 0; i < N; i++) {
      const dx = b.vecs[i * 3] * tau;
      const dy = b.vecs[i * 3 + 1] * tau - g2;
      const dz = b.vecs[i * 3 + 2] * tau;
      sum += Math.sqrt(dx * dx + dy * dy + dz * dz);
    }
    return {
      r: Number((sum / N).toFixed(4)),
      bright: Number(b.bright.toFixed(4))
    };
  });

  return {
    t: Number(t.toFixed(4)),
    objects: scene.children.map(o => o.name),
    bursts: bs
  };
}

/* ---------- public API ---------- */
window.__probe = probe;

window.__step = function (dt) {
  t += dt;
  update();
  renderer.render(scene, camera);
  return probe();
};

/* ---------- first frame ---------- */
update();
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
