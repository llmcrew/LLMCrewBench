<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ночной фейерверк</title>
<style>
  html, body { margin: 0; padding: 0; background: #280f54; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ---------- детерминированный ЛЦГ ---------- */
const S0 = 571619;
const MOD = 4294967296;
let _s = S0;
function nextU() {
  _s = (1664525 * _s + 1013904223) % MOD;
  return _s / MOD;
}

/* ---------- сцена и камера ---------- */
const W = 1920, H = 1080;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#280f54');

const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 200);
camera.position.set(0, 0, 12.0);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
document.body.appendChild(renderer.domElement);

/* ---------- перевод долей кадра в мировые координаты ---------- */
const halfHeight = 12.0 * Math.tan((45 * Math.PI / 180) / 2); // ~4.9706
function frameToWorld(fx, fy) {
  const x = (fx - 0.5) * 2 * halfHeight * (800 / 600);
  const y = (0.5 - fy) * 2 * halfHeight;
  return new THREE.Vector3(x, y, 0);
}

/* ---------- параметры залпов ---------- */
const BURSTS = [
  { name: 'burst_1', fx: 0.343, fy: 0.287, delay: 0.0, color: new THREE.Color('#ff0051') },
  { name: 'burst_2', fx: 0.373, fy: 0.329, delay: 0.3, color: new THREE.Color('#ffc300') },
  { name: 'burst_3', fx: 0.448, fy: 0.334, delay: 0.7, color: new THREE.Color('#19cdff') },
];
const COUNT = 320;
const PERIOD = 2.00;
const LIFE = 1.90;
const SPEED = 2.20;
const GRAV = 1.10;

/* ---------- генерация частиц (порядок обращений к ЛЦГ фиксирован) ---------- */
const burstData = [];
const group = new THREE.Group();
group.name = 'fireworks';
scene.add(group);

for (const b of BURSTS) {
  const point = frameToWorld(b.fx, b.fy);
  const vel = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const u = nextU();
    const v = nextU();
    const w = nextU();
    const z = 1 - 2 * u;
    const phi = 2 * Math.PI * v;
    const rr = Math.sqrt(Math.max(0, 1 - z * z));
    const V = SPEED * (0.65 + 0.5 * w);
    vel[i * 3 + 0] = rr * Math.cos(phi) * V;
    vel[i * 3 + 1] = z * V;
    vel[i * 3 + 2] = rr * Math.sin(phi) * V * 0.5;
  }

  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 4);
  for (let i = 0; i < COUNT; i++) {
    pos[i * 3 + 0] = point.x;
    pos[i * 3 + 1] = point.y;
    pos[i * 3 + 2] = point.z;
    col[i * 4 + 0] = b.color.r;
    col[i * 4 + 1] = b.color.g;
    col[i * 4 + 2] = b.color.b;
    col[i * 4 + 3] = 1;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 4));

  const mat = new THREE.PointsMaterial({
    size: 6.0,
    sizeAttenuation: false,
    transparent: true,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    depthWrite: false,
  });

  const points = new THREE.Points(geo, mat);
  points.name = b.name;
  points.frustumCulled = false;
  group.add(points);

  burstData.push({ points, geo, point, vel, delay: b.delay });
}

/* ---------- звёзды (детализация фона, генерируются после залпов) ---------- */
(function stars() {
  const N = 420;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    const u = nextU();
    const v = nextU();
    const w = nextU();
    pos[i * 3 + 0] = (u - 0.5) * 46;
    pos[i * 3 + 1] = (v - 0.35) * 30;
    pos[i * 3 + 2] = -8 - w * 24;
    const t = nextU();
    col[i * 4 + 0] = 0.55 + 0.35 * t;
    col[i * 4 + 1] = 0.60 + 0.30 * t;
    col[i * 4 + 2] = 0.75 + 0.25 * t;
    col[i * 4 + 3] = 0.18 + 0.30 * (1 - w);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 4));
  const mat = new THREE.PointsMaterial({
    size: 1.6,
    sizeAttenuation: false,
    transparent: true,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    depthWrite: false,
  });
  const stars = new THREE.Points(geo, mat);
  stars.name = 'stars';
  stars.frustumCulled = false;
  scene.add(stars);
})();

/* ---------- состояние времени ---------- */
let t = 0;

function wrap(x, p) {
  return ((x % p) + p) % p;
}

function update() {
  for (const b of burstData) {
    const tau = wrap(t - b.delay, PERIOD);
    const alive = tau <= LIFE ? Math.max(0, 1 - tau / LIFE) : 0;
    const posAttr = b.geo.getAttribute('position');
    const colAttr = b.geo.getAttribute('color');
    const pos = posAttr.array;
    const col = colAttr.array;
    const dt2 = 0.5 * GRAV * tau * tau;
    for (let i = 0; i < COUNT; i++) {
      const k = i * 3;
      pos[k + 0] = b.point.x + b.vel[k + 0] * tau;
      pos[k + 1] = b.point.y + b.vel[k + 1] * tau - dt2;
      pos[k + 2] = b.point.z + b.vel[k + 2] * tau;
      col[i * 4 + 3] = alive;
    }
    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;
  }
}

/* ---------- проба ---------- */
function probe() {
  const objects = [];
  scene.traverse((o) => { if (o.name) objects.push(o.name); });
  const bursts = burstData.map((b) => {
    const tau = wrap(t - b.delay, PERIOD);
    const bright = tau <= LIFE ? Math.max(0, 1 - tau / LIFE) : 0;
    const pos = b.geo.getAttribute('position').array;
    let sum = 0;
    for (let i = 0; i < COUNT; i++) {
      const k = i * 3;
      const dx = pos[k + 0] - b.point.x;
      const dy = pos[k + 1] - b.point.y;
      const dz = pos[k + 2] - b.point.z;
      sum += Math.sqrt(dx * dx + dy * dy + dz * dz);
    }
    const r = sum / COUNT;
    return {
      name: b.points.name,
      r: Number(r.toFixed(4)),
      bright: Number(bright.toFixed(4)),
    };
  });
  return {
    t: Number(t.toFixed(4)),
    objects,
    bursts,
  };
}

/* ---------- шаг времени ---------- */
window.__step = function (dt) {
  t += dt;
  update();
  renderer.render(scene, camera);
  return window.__probe();
};
window.__probe = probe;

/* ---------- начальный кадр ---------- */
update();
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
