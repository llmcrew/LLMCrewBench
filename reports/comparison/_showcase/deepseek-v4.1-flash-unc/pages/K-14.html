<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Life 24x24</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ---------- параметры ---------- */
const N = 24;                 // размер сетки
const CELLS = N * N;          // 576

/* ---------- детерминированный ГПСЧ (ЛКГ) ---------- */
let seed = 1741694328;
function next() {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
}

/* ---------- состояние ---------- */
let grid = new Uint8Array(CELLS);
for (let i = 0; i < N; i++) {
  for (let j = 0; j < N; j++) {
    grid[i * N + j] = next() < 0.3 ? 1 : 0;
  }
}
let generation = 0;

/* ---------- сцена ---------- */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 500);
camera.position.set(0.0, 34.0, 23.0);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(10.0, 28.0, 14.0);
scene.add(dirLight);

/* ---------- инстансированная сетка кубиков ---------- */
const geometry = new THREE.BoxGeometry(0.92, 0.4, 0.92);
const material = new THREE.MeshLambertMaterial();
const mesh = new THREE.InstancedMesh(geometry, material, CELLS);
mesh.name = 'life';

const dummy = new THREE.Object3D();
for (let i = 0; i < N; i++) {
  for (let j = 0; j < N; j++) {
    const idx = i * N + j;
    dummy.position.set(j - 11.5, 0.2, i - 11.5);
    dummy.updateMatrix();
    mesh.setMatrixAt(idx, dummy.matrix);
  }
}
mesh.instanceMatrix.needsUpdate = true;
scene.add(mesh);

const COLOR_ALIVE = new THREE.Color(0xffa726);
const COLOR_DEAD  = new THREE.Color(0x1a2432);

function updateColors() {
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const idx = i * N + j;
      mesh.setColorAt(idx, grid[idx] ? COLOR_ALIVE : COLOR_DEAD);
    }
  }
  mesh.instanceColor.needsUpdate = true;
}

/* ---------- правила B3/S23 ---------- */
function step() {
  const nextGrid = new Uint8Array(CELLS);
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      let n = 0;
      for (let di = -1; di <= 1; di++) {
        for (let dj = -1; dj <= 1; dj++) {
          if (di === 0 && dj === 0) continue;
          const ni = i + di, nj = j + dj;
          if (ni < 0 || ni >= N || nj < 0 || nj >= N) continue; // за границей — мёртв
          n += grid[ni * N + nj];
        }
      }
      const alive = grid[i * N + j];
      nextGrid[i * N + j] = alive ? ((n === 2 || n === 3) ? 1 : 0)
                                  : (n === 3 ? 1 : 0);
    }
  }
  grid = nextGrid;
  generation++;
}

/* ---------- подсчёт состояния ---------- */
function snapshot() {
  let alive = 0;
  const rows = [0, 0, 0];
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      if (grid[i * N + j]) {
        alive++;
        if (i === 0)  rows[0]++;
        if (i === 11) rows[1]++;
        if (i === 23) rows[2]++;
      }
    }
  }
  return { alive: alive, generation: generation, rows: rows };
}

/* ---------- API ---------- */
window.__step = function (dt) {
  step();
  return snapshot();
};

window.__probe = function () {
  updateColors();
  renderer.render(scene, camera);
  return snapshot();
};

/* ---------- первая отрисовка ---------- */
updateColors();
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
