<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Planetary Collision</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';

// ---------- LCG ----------
let lcg = 160717;
function rnd(){
  lcg = (lcg * 1103515245 + 12345) % 2147483648;
  return lcg / 2147483648;
}

// ---------- Renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020308);

const camera = new THREE.PerspectiveCamera(50, 1920/1080, 0.1, 500);
camera.position.set(0, 0.6, 8);

// ---------- Lights ----------
const sunLight = new THREE.DirectionalLight(0xfff4e0, 2.2);
sunLight.position.set(6, 4, 10);
scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0x4466aa, 0.5);
fillLight.position.set(-5, -2, 4);
scene.add(fillLight);
scene.add(new THREE.AmbientLight(0x111122, 0.6));

// ---------- GLSL noise (shared) ----------
const NOISE_GLSL = `
float hash31(vec3 p){
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash31(i + vec3(0,0,0));
  float n100 = hash31(i + vec3(1,0,0));
  float n010 = hash31(i + vec3(0,1,0));
  float n110 = hash31(i + vec3(1,1,0));
  float n001 = hash31(i + vec3(0,0,1));
  float n101 = hash31(i + vec3(1,0,1));
  float n011 = hash31(i + vec3(0,1,1));
  float n111 = hash31(i + vec3(1,1,1));
  return mix(
    mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y),
    mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y),
    f.z
  );
}
float fbm(vec3 p){
  float v = 0.0;
  float a = 0.5;
  for(int i=0;i<5;i++){
    v += a * vnoise(p);
    p *= 2.1;
    a *= 0.5;
  }
  return v;
}
`;

// ---------- Earth ----------
const earthMat = new THREE.ShaderMaterial({
  uniforms: {
    uLightDir: { value: new THREE.Vector3(6,4,10).normalize() }
  },
  vertexShader: `
    varying vec3 vPos;
    varying vec3 vNormal;
    void main(){
      vPos = position;
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uLightDir;
    varying vec3 vPos;
    varying vec3 vNormal;
    ${NOISE_GLSL}
    void main(){
      vec3 p = normalize(vPos);
      float n = fbm(p * 2.5 + 10.0);
      vec3 ocean = vec3(0.0745, 0.1922, 0.3686);
      vec3 land  = vec3(0.1843, 0.4196, 0.2745);
      float landMask = smoothstep(0.48, 0.52, n);
      vec3 col = mix(ocean, land, landMask);
      // cities
      vec3 cell = floor(p * 14.0);
      float ch = hash31(cell);
      float city = step(0.92, ch) * landMask;
      vec3 cityCol = vec3(1.0, 0.8157, 0.8157);
      col = mix(col, cityCol, city * 0.85);
      // clouds
      float cl = fbm(p * 4.0 + 30.0);
      col = mix(col, vec3(0.9), smoothstep(0.55, 0.7, cl) * 0.35);
      // lighting
      float diff = max(dot(normalize(vNormal), uLightDir), 0.0);
      col *= 0.25 + 0.85 * diff;
      // rim
      float rim = 1.0 - max(dot(normalize(vNormal), vec3(0,0,1)), 0.0);
      col += vec3(0.2, 0.4, 0.8) * pow(rim, 3.0) * 0.4;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(3.2, 64, 48), earthMat);
earth.name = 'earth';
earth.position.set(2.6, -1.4, -11);
scene.add(earth);

// ---------- Atmosphere ----------
const atmoMat = new THREE.ShaderMaterial({
  transparent: true,
  side: THREE.BackSide,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPos;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    varying vec3 vPos;
    void main(){
      float rim = 1.0 - abs(dot(normalize(vNormal), vec3(0,0,1)));
      float a = pow(rim, 2.5) * 0.7;
      gl_FragColor = vec4(0.4353, 0.7137, 1.0, a);
    }
  `
});
const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(3.55, 48, 32), atmoMat);
atmosphere.name = 'atmosphere';
atmosphere.position.copy(earth.position);
scene.add(atmosphere);

// ---------- Planet A ----------
const planetAMat = new THREE.ShaderMaterial({
  uniforms: {
    uCrack: { value: 0.0 },
    uLightDir: { value: new THREE.Vector3(6,4,10).normalize() }
  },
  vertexShader: `
    varying vec3 vPos;
    varying vec3 vNormal;
    void main(){
      vPos = position;
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    uniform float uCrack;
    uniform vec3 uLightDir;
    varying vec3 vPos;
    varying vec3 vNormal;
    ${NOISE_GLSL}
    void main(){
      vec3 p = normalize(vPos);
      vec3 base = vec3(0.5412, 0.4157, 0.3216);
      // surface variation
      float sv = fbm(p * 3.0 + 5.0);
      base *= 0.8 + 0.4 * sv;
      // cracks
      float cn = fbm(p * 5.0 + 20.0);
      float crack = 1.0 - smoothstep(0.0, 0.06, abs(cn - 0.5));
      vec3 lava = vec3(1.0, 0.4784, 0.2353);
      vec3 col = mix(base, lava, crack * uCrack);
      // lighting
      float diff = max(dot(normalize(vNormal), uLightDir), 0.0);
      col *= 0.3 + 0.7 * diff;
      // emissive lava
      col += lava * crack * uCrack * 0.8;
      // rim
      float rim = 1.0 - max(dot(normalize(vNormal), vec3(0,0,1)), 0.0);
      col += vec3(0.3, 0.15, 0.05) * pow(rim, 3.0) * 0.3;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const planet_a = new THREE.Mesh(new THREE.SphereGeometry(2.0, 48, 32), planetAMat);
planet_a.name = 'planet_a';
planet_a.position.set(-4.17, 0.65, -7);
scene.add(planet_a);

// ---------- Planet B ----------
const planet_b = new THREE.Mesh(
  new THREE.SphereGeometry(1.7, 48, 32),
  new THREE.MeshStandardMaterial({ color: 0x6d5a72, roughness: 0.8, metalness: 0.1 })
);
planet_b.name = 'planet_b';
planet_b.position.set(-1.95, -0.60, -9);
scene.add(planet_b);

// Planet B velocity: reaches planet_a center at t=2.87
const bStart = new THREE.Vector3(-1.95, -0.60, -9);
const aPos = new THREE.Vector3(-4.17, 0.65, -7);
const bVel = aPos.clone().sub(bStart).divideScalar(2.87);

// ---------- Shards (160) ----------
const SHARD_COUNT = 160;
const shardVel = new Float32Array(SHARD_COUNT * 3);
for (let i = 0; i < SHARD_COUNT; i++){
  // random direction via LCG
  const theta = rnd() * Math.PI * 2;
  const phi = Math.acos(2.0 * rnd() - 1.0);
  const speed = 1.5 + rnd() * 3.0;
  shardVel[i*3]   = Math.sin(phi) * Math.cos(theta) * speed;
  shardVel[i*3+1] = Math.sin(phi) * Math.sin(theta) * speed;
  shardVel[i*3+2] = Math.cos(phi) * speed;
}
const shardGeo = new THREE.BufferGeometry();
const shardPos = new Float32Array(SHARD_COUNT * 3);
shardGeo.setAttribute('position', new THREE.BufferAttribute(shardPos, 3));
const shardMat = new THREE.PointsMaterial({
  color: 0xff7a3c, size: 0.08, transparent: true, opacity: 1.0,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const shards = new THREE.Points(shardGeo, shardMat);
shards.name = 'shards';
scene.add(shards);

// ---------- Dust (90) ----------
const DUST_COUNT = 90;
const dustPos0 = new Float32Array(DUST_COUNT * 3);
const dustVel = new Float32Array(DUST_COUNT * 3);
for (let i = 0; i < DUST_COUNT; i++){
  const theta = rnd() * Math.PI * 2;
  const phi = Math.acos(2.0 * rnd() - 1.0);
  const r = 1.0 + rnd() * 1.5;
  dustPos0[i*3]   = Math.sin(phi) * Math.cos(theta) * r;
  dustPos0[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
  dustPos0[i*3+2] = Math.cos(phi) * r;
  dustVel[i*3]   = (rnd() - 0.5) * 0.3;
  dustVel[i*3+1] = (rnd() - 0.5) * 0.3;
  dustVel[i*3+2] = (rnd() - 0.5) * 0.3;
}
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_COUNT * 3);
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0xd8b18a, size: 0.12, transparent: true, opacity: 0.6,
  blending: THREE.NormalBlending, depthWrite: false
});
const dust = new THREE.Points(dustGeo, dustMat);
dust.name = 'dust';
scene.add(dust);

// ---------- Station ----------
const station = new THREE.Group();
station.name = 'station';
// body
const stBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.6, 0.2, 0.2),
  new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.4, metalness: 0.7 })
);
station.add(stBody);
// panels
const panelMat = new THREE.MeshStandardMaterial({ color: 0x2244aa, roughness: 0.3, metalness: 0.5 });
const panelL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 0.3), panelMat);
panelL.position.set(-0.55, 0, 0);
station.add(panelL);
const panelR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 0.3), panelMat);
panelR.position.set(0.55, 0, 0);
station.add(panelR);
// antenna
const ant = new THREE.Mesh(
  new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8),
  new THREE.MeshStandardMaterial({ color: 0xccccdd })
);
ant.position.set(0, 0.25, 0);
station.add(ant);
// light on station
const stLight = new THREE.PointLight(0x66aaff, 0.5, 3);
stLight.position.set(0, 0.1, 0);
station.add(stLight);

station.position.set(3.5, -2.5, -4);
scene.add(station);

// ---------- Stars (2200) ----------
const STAR_COUNT = 2200;
const starPos = new Float32Array(STAR_COUNT * 3);
const starCol = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++){
  const theta = rnd() * Math.PI * 2;
  const phi = Math.acos(2.0 * rnd() - 1.0);
  const r = 80 + rnd() * 120;
  starPos[i*3]   = Math.sin(phi) * Math.cos(theta) * r;
  starPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
  starPos[i*3+2] = Math.cos(phi) * r;
  const b = 0.4 + rnd() * 0.6;
  const tint = rnd();
  starCol[i*3]   = b * (tint > 0.8 ? 1.0 : 0.9);
  starCol[i*3+1] = b * 0.92;
  starCol[i*3+2] = b * (tint < 0.2 ? 1.0 : 0.95);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
const starMat = new THREE.PointsMaterial({ size: 0.3, vertexColors: true, sizeAttenuation: true });
const stars = new THREE.Points(starGeo, starMat);
stars.name = 'stars';
scene.add(stars);

// ---------- State ----------
let t = 0;
const IMPACT_T = 2.87;

function updateScene(){
  // Camera
  camera.position.set(0, 0.6, 8 + 0.055 * t);
  // look between planets
  const mid = new THREE.Vector3().addVectors(planet_a.position, planet_b.position).multiplyScalar(0.5);
  camera.lookAt(mid);

  // Earth rotation
  earth.rotation.y = 0.15 * t;
  atmosphere.rotation.y = 0.15 * t;

  // Planet B movement
  if (t < IMPACT_T){
    planet_b.position.copy(bStart).addScaledVector(bVel, t);
  } else {
    planet_b.position.copy(aPos);
  }

  // Planet A deformation
  const preGrow = 1.0 + 0.08 * Math.min(t / IMPACT_T, 1.0);
  let sx = preGrow;
  let sy = preGrow;
  let sz = preGrow;
  if (t >= IMPACT_T){
    const dt2 = Math.min((t - IMPACT_T) / 2.0, 1.0);
    sx = preGrow * (1.0 - 0.35 * dt2);
    sy = preGrow * (1.0 + 0.1 * dt2);
    sz = preGrow * (1.0 + 0.1 * dt2);
  }
  planet_a.scale.set(sx, sy, sz);
  planet_a.rotation.y = 0.1 * t;

  // Cracks
  const crack = t >= IMPACT_T ? Math.min((t - IMPACT_T) / 1.5, 1.0) : 0.0;
  planetAMat.uniforms.uCrack.value = crack;

  // Shards
  if (t >= IMPACT_T){
    const dt2 = t - IMPACT_T;
    for (let i = 0; i < SHARD_COUNT; i++){
      shardPos[i*3]   = aPos.x + shardVel[i*3]   * dt2;
      shardPos[i*3+1] = aPos.y + shardVel[i*3+1] * dt2;
      shardPos[i*3+2] = aPos.z + shardVel[i*3+2] * dt2;
    }
    shardGeo.attributes.position.needsUpdate = true;
    shardMat.opacity = Math.max(1.0 - dt2 * 0.15, 0.1);
  } else {
    for (let i = 0; i < SHARD_COUNT; i++){
      shardPos[i*3] = 0; shardPos[i*3+1] = 0; shardPos[i*3+2] = 0;
    }
    shardGeo.attributes.position.needsUpdate = true;
    shardMat.opacity = 0.0;
  }

  // Dust
  if (t >= IMPACT_T){
    const dt2 = t - IMPACT_T;
    for (let i = 0; i < DUST_COUNT; i++){
      dustPos[i*3]   = aPos.x + dustPos0[i*3]   + dustVel[i*3]   * dt2;
      dustPos[i*3+1] = aPos.y + dustPos0[i*3+1] + dustVel[i*3+1] * dt2;
      dustPos[i*3+2] = aPos.z + dustPos0[i*3+2] + dustVel[i*3+2] * dt2;
    }
    dustGeo.attributes.position.needsUpdate = true;
    dustMat.opacity = Math.min(dt2 * 0.5, 0.6);
  } else {
    for (let i = 0; i < DUST_COUNT; i++){
      dustPos[i*3] = 0; dustPos[i*3+1] = 0; dustPos[i*3+2] = 0;
    }
    dustGeo.attributes.position.needsUpdate = true;
    dustMat.opacity = 0.0;
  }

  // Station rotation
  station.rotation.z = 0.53 * Math.min(t / 4.0, 1.0);

  // Earth atmosphere distortion (storm)
  if (t >= IMPACT_T){
    const storm = Math.min((t - IMPACT_T) / 3.0, 1.0);
    atmosphere.scale.setScalar(1.0 + storm * 0.08);
  } else {
    atmosphere.scale.setScalar(1.0);
  }
}

// ---------- Probe ----------
function getGap(){
  return planet_a.position.distanceTo(planet_b.position);
}

window.__probe = function(){
  return {
    t: Math.round(t * 10000) / 10000,
    objects: ['earth','atmosphere','planet_a','planet_b','shards','dust','station','stars'],
    gap: Math.round(getGap() * 10000) / 10000
  };
};

window.__step = function(dt){
  t += dt;
  updateScene();
  renderer.render(scene, camera);
  return window.__probe();
};

// Initial render
updateScene();
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
