<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Lava Lamp</title>
<style>
  html, body { margin: 0; padding: 0; background: #16092b; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<canvas id="frame"></canvas>
<script type="module">
const THREE = window.THREE;

// ---- renderer: 1920x1080, pixelRatio 1, deterministic ----
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('frame'), preserveDrawingBuffer: true, antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);

// camera: 45 deg, at 2.0 units -> half-height of frame = tan(22.5deg) * 2 = 0.8284
const camera = new THREE.PerspectiveCamera(45, 4 / 3, 0.1, 10);
camera.position.set(0, 0, 2);
camera.lookAt(0, 0, 0);

const scene = new THREE.Scene();

// single plane filling the frame exactly: half-height 0.8284, half-width 4/3 times that
const HALF_H = Math.tan(THREE.MathUtils.degToRad(45 / 2)) * 2; // 0.8284
const plane = new THREE.Mesh(
  new THREE.PlaneGeometry(HALF_H * (4 / 3) * 2, HALF_H * 2),
  new THREE.ShaderMaterial({
    uniforms: {
      uB: { value: new Float32Array(27) } // per blob: x, y (p-coords), r
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      uniform vec3 uB[9]; // x, y in p-coords, radius (fraction of frame height)

      vec3 BG   = vec3(22.0, 9.0, 43.0) / 255.0;   // #16092b dark plum
      vec3 HALO = vec3(255.0, 45.0, 107.0) / 255.0; // #ff2d6b glow
      vec3 BODY = vec3(255.0, 107.0, 26.0) / 255.0; // #ff6b1a lava body
      vec3 CORE = vec3(255.0, 223.0, 61.0) / 255.0; // #ffdf3d hot core

      void main() {
        // x in fractions of frame height, y in fractions of frame height
        vec2 p = (vUv - 0.5) * vec2(1.3333, 1.0);

        // metaball field F(p) = sum r_i^2 / max(|p - c_i|^2, 1e-4)
        float F = 0.0;
        for (int i = 0; i < 9; i++) {
          vec2 d = p - uB[i].xy;
          float r = uB[i].z;
          F += (r * r) / max(dot(d, d), 0.0001);
        }

        // bands of the field: halo F ~0.3..0.62, body F ~0.85..1.3, core F ~2.4..3.2
        // (core color carries on deeper; outer halo bleeds in softly)
        vec3 col = BG;
        col = mix(col, HALO, smoothstep(0.27, 0.34, F));
        col = mix(col, BODY, smoothstep(0.82, 0.87, F));
        col = mix(col, CORE, smoothstep(2.36, 2.44, F));

        gl_FragColor = vec4(col, 1.0);
      }
    `
  })
);
scene.add(plane);

// ---- blobs: [cx (fraction of width), cy0 (fraction of height), r (fraction of height), A, w, phase] ----
const BLOBS = [
  [0.333, 0.604, 0.089, 0.126, 0.497, 1.59],
  [0.457, 0.657, 0.102, 0.106, 0.478, 3.21],
  [0.120, 0.672, 0.081, 0.112, 0.679, 4.65],
  [0.606, 0.543, 0.077, 0.136, 0.965, 3.37],
  [0.420, 0.600, 0.081, 0.100, 1.148, 2.45],
  [0.779, 0.713, 0.103, 0.175, 1.136, 0.39],
  [0.472, 0.318, 0.079, 0.178, 0.656, 1.23],
  [0.192, 0.509, 0.101, 0.161, 1.014, 3.99],
  [0.892, 0.486, 0.102, 0.115, 0.862, 2.83],
];

// time advances only via window.__step(dt)
let t = 0;

function blobYs() {
  return BLOBS.map(b => b[1] + b[3] * Math.sin(b[4] * t + b[5]));
}

function updateUniforms() {
  const ys = blobYs();
  const arr = plane.material.uniforms.uB.value;
  for (let i = 0; i < BLOBS.length; i++) {
    const b = BLOBS[i];
    // to p-coords: x in fractions of frame height, y in fractions of height
    arr[i * 3 + 0] = (b[0] - 0.5) * (4 / 3);
    arr[i * 3 + 1] = ys[i] - 0.5;
    arr[i * 3 + 2] = b[2];
  }
}

const r4 = v => Math.round(v * 10000) / 10000;

window.__probe = function () {
  const ys = blobYs();
  const blobs = BLOBS.map((b, i) => ({ x: r4(b[0]), y: r4(ys[i]), r: r4(b[2]) }));
  return {
    t: r4(t),
    objects: blobs.map((b, i) => ({ id: i, type: 'blob', x: b.x, y: b.y, r: b.r })),
    blobs,
  };
};

function draw() {
  updateUniforms();
  renderer.render(scene, camera);
}

// first frame — start of the scene
draw();
window.__ready = true;

window.__step = function (dt) {
  t += dt;
  draw();
  return window.__probe();
};
</script>
</body>
</html>
