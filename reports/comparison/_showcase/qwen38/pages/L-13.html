body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}

<script type="module">
const THREE = window.THREE;

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 4 / 3, 0.1, 10);
camera.position.set(0, 0, 2.0);
camera.lookAt(0, 0, 0);

const halfH = 0.8284;
const halfW = halfH * 4 / 3;
const planeW = halfW * 2;
const planeH = halfH * 2;

const blobData = [
  [0.333, 0.604, 0.089, 0.126, 0.497, 1.59],
  [0.457, 0.657, 0.102, 0.106, 0.478, 3.21],
  [0.120, 0.672, 0.081, 0.112, 0.679, 4.65],
  [0.606, 0.543, 0.077, 0.136, 0.965, 3.37],
  [0.420, 0.600, 0.081, 0.100, 1.148, 2.45],
  [0.779, 0.713, 0.103, 0.175, 1.136, 0.39],
  [0.472, 0.318, 0.079, 0.178, 0.656, 1.23],
  [0.192, 0.509, 0.101, 0.161, 1.014, 3.99],
  [0.892, 0.486, 0.102, 0.115, 0.862, 2.83]
];

const N = 9;
const centers = [];
const radii = [];
for (let i = 0; i < N; i++) {
  const [fx, fy, r] = blobData[i];
  centers.push(new THREE.Vector2((fx - 0.5) * 1.3333, (fy - 0.5) * 1.0));
  radii.push(r);
}

const vertexShader = `
varying vec2 vUv;
void main(){
  vUv = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const fragmentShader = `
precision highp float;
varying vec2 vUv;
uniform vec2 uCenters[${N}];
uniform float uRadii[${N}];

void main(){
  vec2 p = (vUv - 0.5) * vec2(1.3333, 1.0);

  float F = 0.0;
  for(int i = 0; i < ${N}; i++){
    vec2 d = p - uCenters[i];
    float d2 = max(dot(d, d), 0.0001);
    F += uRadii[i] * uRadii[i] / d2;
  }

  vec3 bg      = vec3(0.0863, 0.0353, 0.1686);
  vec3 halo    = vec3(1.0,    0.1765, 0.4196);
  vec3 surface = vec3(1.0,    0.4196, 0.1020);
  vec3 core    = vec3(1.0,    0.8745, 0.2392);

  vec3 col;
  if(F < 0.28){
    col = bg;
  } else if(F < 0.32){
    col = mix(bg, halo, (F - 0.28) / 0.04);
  } else if(F < 0.62){
    col = halo;
  } else if(F < 0.85){
    float t = (F - 0.62) / 0.23;
    col = mix(halo, surface, t * t * (3.0 - 2.0 * t));
  } else if(F < 1.3){
    col = surface;
  } else if(F < 2.4){
    float t = (F - 1.3) / 1.1;
    col = mix(surface, core, t * t * (3.0 - 2.0 * t));
  } else {
    col = core;
  }

  // subtle depth: slight brightness modulation from field
  float lum = 1.0 + 0.03 * clamp(F - 0.5, 0.0, 2.0) / 2.0;
  col *= lum;

  gl_FragColor = vec4(col, 1.0);
}`;

const geometry = new THREE.PlaneGeometry(planeW, planeH);
const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms: {
    uCenters: { value: centers },
    uRadii:   { value: radii }
  },
  side: THREE.FrontSide
});

const mesh = new THREE.Mesh(geometry, material);
mesh.name = 'lavaPlane';
scene.add(mesh);

let time = 0;

function updateBlobs() {
  for (let i = 0; i < N; i++) {
    const [fx, fy0, , A, w, p] = blobData[i];
    const fy = fy0 + A * Math.sin(w * time + p);
    material.uniforms.uCenters.value[i].set(
      (fx - 0.5) * 1.3333,
      (fy - 0.5) * 1.0
    );
  }
}

function render() {
  updateBlobs();
  renderer.render(scene, camera);
}

// Initial frame at t=0
render();
window.__ready = true;

window.__step = function(dt) {
  time += dt;
  render();
  return window.__probe();
};

window.__probe = function() {
  const blobs = [];
  for (let i = 0; i < N; i++) {
    const [fx, fy0, , A, w, p] = blobData[i];
    const fy = fy0 + A * Math.sin(w * time + p);
    blobs.push([
      Math.round(fx * 10000) / 10000,
      Math.round(fy * 10000) / 10000
    ]);
  }
  return {
    t: Math.round(time * 10000) / 10000,
    objects: scene.children.map(o => o.name),
    blobs: blobs
  };
};
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
