<script type="module">
const THREE = window.THREE;

// Deterministic RNG: seed 571619
let s = 571619;
function rng() {
  s = (1664525 * s + 1013904223) % 4294967296;
  return s / 4294967296;
}

// Constants
const SPEED = 2.20;
const GRAVITY = 1.10;
const LIFE = 1.90;
const PERIOD = 2.00;
const N = 320;
const SIZE = 6.0;

const LAUNCH = [
  {fx: 0.343, fy: 0.287},
  {fx: 0.373, fy: 0.329},
  {fx: 0.448, fy: 0.334}
];
const DELAYS = [0.0, 0.3, 0.7];
const COLORS = [0xff0051, 0xffc300, 0x19cdff];

// Camera
const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 200);
camera.position.set(0, 0, 12.0);
camera.lookAt(0, 0, 0);

const halfH = 12.0 * Math.tan(45 * Math.PI / 360);

function f2w(fx, fy) {
  const x = (fx - 0.5) * 2 * halfH * (800 / 600);
  const y = (0.5 - fy) * 2 * halfH;
  return new THREE.Vector3(x, y, 0);
}

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x280f54);

// Renderer
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

// Generate burst vectors (order: burst 0 → 2, particle 0 → 319, u,v,w)
const burstData = [];
for (let b = 0; b < 3; b++) {
  const lp = f2w(LAUNCH[b].fx, LAUNCH[b].fy);
  const vecs = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const u = rng();
    const v = rng();
    const w = rng();
    const z = 1 - 2 * u;
    const phi = 2 * Math.PI * v;
    const rr = Math.sqrt(1 - z * z);
    const V = SPEED * (0.65 + 0.5 * w);
    vecs[i * 3]     = rr * Math.cos(phi) * V;
    vecs[i * 3 + 1] = z * V;
    vecs[i * 3 + 2] = rr * Math.sin(phi) * V * 0.5;
  }
  burstData.push({ lp, vecs, delay: DELAYS[b], color: COLORS[b] });
}

// Create Points objects
const pts = [];
for (let b = 0; b < 3; b++) {
  const pos = new Float32Array(N * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size: SIZE,
    sizeAttenuation: false,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    color: COLORS[b]
  });
  const p = new THREE.Points(geo, mat);
  p.name = 'burst_' + (b + 1);
  scene.add(p);
  pts.push(p);
}

// State
let t = 0;

function mod(a, b) { return ((a % b) + b) % b; }

function update() {
  for (let b = 0; b < 3; b++) {
    const { lp, vecs, delay } = burstData[b];
    const tau = mod(t - delay, PERIOD);
    const pos = pts[b].geometry.attributes.position.array;

    if (tau > LIFE) {
      pts[b].material.opacity = 0;
      for (let i = 0; i < N; i++) {
        pos[i*3] = lp.x; pos[i*3+1] = lp.y; pos[i*3+2] = lp.z;
      }
    } else {
      const bright = Math.max(0, 1 - tau / LIFE);
      pts[b].material.opacity = bright;
      const g = 0.5 * GRAVITY * tau * tau;
      for (let i = 0; i < N; i++) {
        pos[i*3]     = lp.x + vecs[i*3]     * tau;
        pos[i*3 + 1] = lp.y + vecs[i*3 + 1] * tau - g;
        pos[i*3 + 2] = lp.z + vecs[i*3 + 2] * tau;
      }
    }
    pts[b].geometry.attributes.position.needsUpdate = true;
  }
}

// Initial frame (t = 0)
update();
renderer.render(scene, camera);
window.__ready = true;

// API
window.__step = function(dt) {
  t += dt;
  update();
  renderer.render(scene, camera);
  return window.__probe();
};

window.__probe = function() {
  const objects = scene.children.map(o => o.name).filter(Boolean);
  const bursts = [];
  for (let b = 0; b < 3; b++) {
    const { lp, vecs, delay } = burstData[b];
    const tau = mod(t - delay, PERIOD);
    const bright = tau > LIFE ? 0 : Math.max(0, 1 - tau / LIFE);
    const g = 0.5 * GRAVITY * tau * tau;
    let sumR = 0;
    for (let i = 0; i < N; i++) {
      const dx = vecs[i*3] * tau;
      const dy = vecs[i*3+1] * tau - g;
      const dz = vecs[i*3+2] * tau;
      sumR += Math.sqrt(dx*dx + dy*dy + dz*dz);
    }
    const r = sumR / N;
    bursts.push({
      r: Math.round(r * 10000) / 10000,
      bright: Math.round(bright * 10000) / 10000
    });
  }
  return {
    t: Math.round(t * 10000) / 10000,
    objects,
    bursts
  };
};
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
