<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Night Fireworks</title>
<style>
  html, body { margin: 0; padding: 0; background: #280f54; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ---- Fixture constants (verbatim) ----
// seed 571619, launch points (0.343, 0.287), (0.373, 0.329), (0.448, 0.334),
// delays 0.0, 0.3, 0.7, speed 2.20, gravity 1.10, life 1.90, period 2.00, 320 particles per burst

const HALF_H = 4.971;          // half frame height at z = 12
const ASPECT = 800 / 600;
const N = 320;                 // particles per burst
const V0 = 2.20;               // speed
const GRAV = 1.10;             // gravity
const LIFE = 1.90;             // life
const PERIOD = 2.00;           // repeat period
const DELAYS = [0.0, 0.3, 0.7];
const COLORS = [0xff0051, 0xffc300, 0x19cdff]; // red, gold, blue
const FRAMES = [
  { fx: 0.343, fy: 0.287 },
  { fx: 0.373, fy: 0.329 },
  { fx: 0.448, fy: 0.334 }
];

// launch points in world coordinates
const BASES = FRAMES.map(p => new THREE.Vector3(
  (p.fx - 0.5) * 2 * HALF_H * ASPECT,
  (0.5 - p.fy) * 2 * HALF_H,
  0
));

// ---- Deterministic LCG (only randomness source, fixed call order) ----
let S = 571619;                // S0 = 571619
function rnd() {
  S = (1664525 * S + 1013904223) % 4294967296;
  return S / 4294967296;
}

// ---- Renderer / scene / camera ----
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#280f54'); // night sky

const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 200);
camera.position.set(0, 0, 12.0);
camera.lookAt(0, 0, 0);

// ---- Bursts ----
const bursts = [];
for (let i = 0; i < 3; i++) {
  const base = BASES[i];
  const pos = new Float32Array(N * 3);
  const vel = new Float32Array(N * 3);
  for (let j = 0; j < N; j++) {
    const u = rnd();                 // 1st LCG number: sphere z
    const v = rnd();                 // 2nd LCG number: azimuth
    const w = rnd();                 // 3rd LCG number: speed
    const z = 1 - 2 * u;
    const phi = 2 * Math.PI * v;
    const rr = Math.sqrt(1 - z * z);
    const V = V0 * (0.65 + 0.5 * w);
    vel[j * 3]     = rr * Math.cos(phi) * V;
    vel[j * 3 + 1] = z * V;
    vel[j * 3 + 2] = rr * Math.sin(phi) * V * 0.5;
    pos[j * 3]     = base.x;
    pos[j * 3 + 1] = base.y;
    pos[j * 3 + 2] = base.z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: COLORS[i],
    size: 6.0,
    sizeAttenuation: false,
    transparent: true,
    opacity: 1.0,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    depthTest: false
  });
  const pts = new THREE.Points(geo, mat);
  pts.name = 'burst_' + (i + 1);
  pts.frustumCulled = false;
  scene.add(pts);
  bursts.push({ pts, geo, mat, base, vel, delay: DELAYS[i] });
}

// ---- Animation driven only by window.__step ----
let t = 0;

function tauOf(delay) {
  return ((t - delay) % PERIOD + PERIOD) % PERIOD;
}

function update() {
  for (const b of bursts) {
    const tau = tauOf(b.delay);
    const bright = Math.max(0, 1 - tau / LIFE);
    b.mat.opacity = bright;
    if (tau > LIFE) {
      b.pts.visible = false;
      continue;
    }
    b.pts.visible = true;
    const arr = b.geo.attributes.position.array;
    const fall = 0.5 * GRAV * tau * tau;
    for (let j = 0; j < N; j++) {
      arr[j * 3]     = b.base.x + b.vel[j * 3] * tau;
      arr[j * 3 + 1] = b.base.y + b.vel[j * 3 + 1] * tau - fall;
      arr[j * 3 + 2] = b.base.z + b.vel[j * 3 + 2] * tau;
    }
    b.geo.attributes.position.needsUpdate = true;
  }
  renderer.render(scene, camera);
}

// ---- Probe ----
function probe() {
  const list = [];
  for (const b of bursts) {
    const tau = tauOf(b.delay);
    const bright = Math.max(0, 1 - tau / LIFE);
    let sum = 0;
    if (tau <= LIFE) {
      const arr = b.geo.attributes.position.array;
      for (let j = 0; j < N; j++) {
        const dx = arr[j * 3]     - b.base.x;
        const dy = arr[j * 3 + 1] - b.base.y;
        const dz = arr[j * 3 + 2] - b.base.z;
        sum += Math.sqrt(dx * dx + dy * dy + dz * dz);
      }
    }
    list.push({
      name: b.pts.name,
      r: Math.round((sum / N) * 10000) / 10000,
      bright: Math.round(bright * 10000) / 10000
    });
  }
  return {
    t: Math.round(t * 10000) / 10000,
    objects: list,
    bursts: list
  };
}

// first frame: scene start (t = 0)
update();
window.__ready = true;
window.__probe = probe;
window.__step = function (dt) {
  t += dt;
  update();
  return window.__probe();
};
</script>
</body>
</html>
