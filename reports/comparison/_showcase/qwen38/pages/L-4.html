<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ночной город</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b14; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const THREE = window.THREE;

const W = 1920, H = 1080;

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x2a1b5c, 1);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 500);
camera.position.set(0, 8, 26);
camera.lookAt(0, 8, 0);

const SILHOUETTE = 0x0b0b14;
const CYAN = new THREE.Color(0x22e0d0);
const WARM = new THREE.Color(0xffb066);

// ---------- земля ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshBasicMaterial({ color: SILHOUETTE })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.name = 'ground';
scene.add(ground);

// ---------- дома ----------
const houses = [
  { x: -6.8, w: 2.4, h: 14.8 },
  { x: -3.7, w: 2.1, h: 10.1 },
  { x: -1.2, w: 1.6, h: 10.7 },
  { x:  1.5, w: 2.3, h: 14.9 },
  { x:  4.8, w: 2.6, h: 13.5 },
  { x:  8.0, w: 1.6, h: 10.9 }
];

for (const hs of houses) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(hs.w, hs.h, 3),
    new THREE.MeshBasicMaterial({ color: SILHOUETTE })
  );
  mesh.name = 'house';
  mesh.position.set(hs.x, hs.h / 2, 0);
  scene.add(mesh);
}

// ---------- окна (InstancedMesh) ----------
const COL_STEP = 0.95, FLOOR_STEP = 1.45;
const WIN_W = 0.5, WIN_H = 0.7;

const winList = [];        // { houseIdx, x, y, base: Color }
houses.forEach((hs, hi) => {
  const base = (hi % 2 === 1) ? CYAN : WARM;   // чётный номер дома (2,4,6) — бирюза
  const nCols = Math.max(1, Math.floor((hs.w - 0.5) / COL_STEP) + 1);
  const nFloors = Math.floor((hs.h - 0.35 - 1.0) / FLOOR_STEP) + 1;
  for (let c = 0; c < nCols; c++) {
    for (let f = 0; f < nFloors; f++) {
      winList.push({
        x: hs.x + (c - (nCols - 1) / 2) * COL_STEP,
        y: 1.0 + f * FLOOR_STEP,
        base: base
      });
    }
  }
});

const windowsGeo = new THREE.PlaneGeometry(WIN_W, WIN_H);
const windowsMat = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  side: THREE.DoubleSide,
  toneMapped: false
});
const windowsMesh = new THREE.InstancedMesh(windowsGeo, windowsMat, winList.length);
windowsMesh.name = 'windows';
const _m4 = new THREE.Matrix4();
winList.forEach((win, i) => {
  _m4.makeTranslation(win.x, win.y, 1.53); // слегка впереди фасада
  windowsMesh.setMatrixAt(i, _m4);
});
windowsMesh.instanceMatrix.needsUpdate = true;
scene.add(windowsMesh);

function updateWindows(t) {
  const _c = new THREE.Color();
  let lit = 0;
  for (let i = 0; i < winList.length; i++) {
    const phase = (i * 0.129 + t * 0.500) % 1;
    const on = phase < 0.78;
    if (on) lit++;
    const b = on ? 1.0 : 0.15;
    _c.copy(winList[i].base).multiplyScalar(b);
    windowsMesh.setColorAt(i, _c);
  }
  windowsMesh.instanceColor.needsUpdate = true;
  return lit;
}

// ---------- дымка ----------
function makeGradientTexture() {
  const cv = document.createElement('canvas');
  cv.width = 4; cv.height = 256;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  // вертикальный градиент прозрачности: тоньше на краях, плотнее по центру
  g.addColorStop(0.0,  'rgba(255,255,255,0.0)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.55, 'rgba(255,255,255,1.0)');
  g.addColorStop(0.85, 'rgba(255,255,255,0.5)');
  g.addColorStop(1.0,  'rgba(255,255,255,0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 4, 256);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.NoColorSpace;
  return tex;
}
const haze = new THREE.Mesh(
  new THREE.PlaneGeometry(90, 18),
  new THREE.MeshBasicMaterial({
    color: 0x4a5a8a,
    transparent: true,
    opacity: 0.22,
    alphaMap: makeGradientTexture(),
    side: THREE.DoubleSide,
    depthWrite: false,
    toneMapped: false
  })
);
haze.name = 'haze';
haze.position.set(1.0, 7.35, 9);
scene.add(haze);

// ---------- время / probe ----------
let t = 0;

function hazeY(tt) { return 7.35 + 0.9 * Math.sin(tt * 0.25); }

function probe() {
  const objects = [];
  scene.traverse((o) => {
    if (o.isMesh) objects.push({ name: o.name || 'mesh', count: o.isInstancedMesh ? o.count : 1 });
  });
  return {
    t: Math.round(t * 10000) / 10000,
    objects: objects,
    lit: litCount,
    haze_y: Math.round(haze.position.y * 10000) / 10000
  };
}

let litCount = 0;

function render() {
  haze.position.y = hazeY(t);
  litCount = updateWindows(t);
  renderer.render(scene, camera);
}

render();
window.__ready = true;

window.__probe = probe;
window.__step = (dt) => {
  t += dt;
  render();
  return probe();
};
</script>
</body>
</html>
