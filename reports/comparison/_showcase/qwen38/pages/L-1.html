<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Закат над морем</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ---------- базовые постоянные ----------
const FW = 1920, FH = 1080;                 // кадр
const DIST = 12;                            // расстояние до плоскостей
const FOV = 45;
const ASPECT = 800 / 600;                   // aspect камеры из задания
const HALF_H = DIST * Math.tan(THREE.MathUtils.degToRad(FOV / 2)); // ≈ 4.971
const HALF_W = HALF_H * ASPECT;             // половина видимой ширины кадра
const CAM_Y = 0.2;

// горизонт ровно на 52% высоты кадра от верхнего края:
// ndc_y = 1 - 2*0.52 = -0.04  →  y мира = CAM_Y - 0.04 * HALF_H
const HORIZON_TOP = 0.52;
const HORIZON_Y = CAM_Y + (1 - 2 * HORIZON_TOP) * HALF_H;

const SKY_H = 5.169;                        // высота неба, ед. сцены
const SEA_H = 4.772;                        // высота воды, ед. сцены
const PLANE_W = 40;

// ---------- рендерер ----------
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(FW, FH, false);
document.body.appendChild(renderer.domElement);

// ---------- сцена и камера ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, ASPECT, 0.1, 200);
camera.position.set(0, CAM_Y, 0);
camera.lookAt(0, CAM_Y, -1);                // строго вдоль горизонта

// ---------- небо: вертикальный градиент #1b2a4a (верх) → #ff7a3d (горизонт) ----------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.FrontSide,
  uniforms: {
    topColor:    { value: new THREE.Color('#1b2a4a') }, // холодная ночь сверху
    bottomColor: { value: new THREE.Color('#ff7a3d') }  // тёплая полоса у горизонта
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    vec3 toSrgb(vec3 c) {
      return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c));
    }
    void main() {
      // uvy=1 — верх плоскости, uvy=0 — горизонт.
      // Профиль с утолщёнными концами: ночь сверху держится дольше,
      // у горизонта — широкая тёплая полоса; яркость монотонна сверху вниз.
      float w = smoothstep(0.0, 0.80, vUv.y);
      gl_FragColor = vec4(toSrgb(mix(bottomColor, topColor, w)), 1.0);
    }
  `
});
const sky = new THREE.Mesh(new THREE.PlaneGeometry(PLANE_W, SKY_H), skyMat);
sky.name = 'sky';
sky.position.set(0, HORIZON_Y + SKY_H / 2, -DIST);
scene.add(sky);

// ---------- вода: градиент #ff7a3d (горизонт) → #20283a (низ) + рябь ----------
// рябь: полосы яркости с шагом 0.024 высоты кадра (в экранных px) и фазой 0.386
const RIPPLE_PERIOD_FRAC = 0.024;           // в долях высоты кадра
const RIPPLE_PHASE = 0.386;
const seaMat = new THREE.ShaderMaterial({
  side: THREE.FrontSide,
  uniforms: {
    topColor:    { value: new THREE.Color('#ff7a3d') }, // тёплая полоса у горизонта
    bottomColor: { value: new THREE.Color('#20283a') },
    uFrameH:     { value: FH },
    uRipplePx:   { value: RIPPLE_PERIOD_FRAC * FH },
    uRipplePh:   { value: RIPPLE_PHASE }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float uFrameH;
    uniform float uRipplePx;
    uniform float uRipplePh;
    vec3 toSrgb(vec3 c) {
      return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c));
    }
    void main() {
      // vUv.y=1 — горизонт, vUv.y=0 — нижний край кадра.
      // Внизу — устойчивый тёмный водоём, к горизонту — тёплая полоса;
      // монотонно к горизонту.
      float w = smoothstep(0.22, 1.0, vUv.y);
      vec3 col = mix(bottomColor, topColor, w);
      // горизонтальная рябь в экранных координатах
      float phase = 6.28318530718 * (gl_FragCoord.y / uRipplePx - uRipplePh);
      float band  = 0.5 + 0.5 * sin(phase);
      // лёгкий модулятор яркости — и блики, и затенённые впадины
      float shade = 1.0 + 0.08 * (band - 0.5);
      gl_FragColor = vec4(toSrgb(col * shade), 1.0);
    }
  `
});
const sea = new THREE.Mesh(new THREE.PlaneGeometry(PLANE_W, SEA_H), seaMat);
sea.name = 'sea';
sea.position.set(0, HORIZON_Y - SEA_H / 2, -DIST);
scene.add(sea);

// ---------- солнце: сплюснутый диск, садится к горизонту ----------
const SUN_R = 0.075 * 2 * HALF_H;           // 0.075 высоты кадра — в единицах сцены
const sunGeo = new THREE.CircleGeometry(SUN_R, 48);
const sunMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffd08a') });

const sun = new THREE.Mesh(sunGeo, sunMat);
sun.name = 'sun';
sun.scale.y = 0.55;                         // сплюснутость: рефракция у горизонта
scene.add(sun);

// стартовая позиция: (0.41 ширины кадра, 0.70 высоты кадра от нижнего края)
const SUN_X0 = (0.41 - 0.5) * 2 * HALF_W;
const SUN_Y0 = CAM_Y + (0.70 - 0.5) * 2 * HALF_H;
const SUN_SPEED = 0.040 * 2 * HALF_H;       // 0.040 высоты кадра в секунду

// ---------- отражение солнца: зеркально относительно горизонта, scale.y = 2.5 ----------
const sunReflection = new THREE.Mesh(sunGeo.clone(), sunMat.clone());
sunReflection.name = 'sun_reflection';
sunReflection.scale.y = 2.5;
scene.add(sunReflection);

// ---------- состояние ----------
let t = 0;
let sunY = SUN_Y0;

function layoutSun() {
  sunY = Math.max(HORIZON_Y, SUN_Y0 - t * SUN_SPEED); // не ниже линии горизонта
  sun.position.set(SUN_X0, sunY, -DIST + 0.02);
  sunReflection.position.set(SUN_X0, 2 * HORIZON_Y - sunY, -DIST + 0.01);
  renderer.render(scene, camera);
}

layoutSun();

// ---------- API ----------
function probe() {
  const r4 = (v) => Math.round(v * 1e4) / 1e4;
  const objects = [];
  scene.traverse((o) => { if (o.isMesh && o.name) objects.push(o.name); });
  return {
    t: r4(t),
    objects: objects,
    sun: [r4(sun.position.x), r4(sun.position.y)]
  };
}

window.__step = function (dt) {
  t += dt;
  layoutSun();
  return window.__probe();
};

window.__probe = function () {
  return probe();
};

window.__ready = true;
</script>
</body>
</html>
