<script type="module">
const THREE = window.THREE;

const W = 800, H = 600, DIST = 12, FOV = 45;
const HALF_H = DIST * Math.tan(FOV * 0.5 * Math.PI / 180);
const FH = 2 * HALF_H;
const FW = FH * (W / H);
const SKY_H = 5.169, SEA_H = 4.772;
const fTop = 0.2 + HALF_H;
const hzY = fTop - SKY_H;

const cam = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 200);
cam.position.set(0, 0.2, 0);
cam.lookAt(0, 0.2, -1);

const scene = new THREE.Scene();
const ren = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
ren.setPixelRatio(1);
ren.setSize(W, H, false);
document.body.appendChild(ren.domElement);

// Sky plane
const skyMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec3 top = vec3(0.10588,0.16471,0.29020);
      vec3 bot = vec3(1.0,0.47843,0.23922);
      gl_FragColor = vec4(mix(bot, top, vUv.y), 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.PlaneGeometry(40, SKY_H), skyMat);
sky.name = 'sky';
sky.position.set(0, hzY + SKY_H / 2, -DIST);
scene.add(sky);

// Water plane
const seaMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec3 top = vec3(1.0,0.47843,0.23922);
      vec3 bot = vec3(0.12549,0.15686,0.22745);
      vec3 c = mix(bot, top, vUv.y);
      float step = 0.05;
      float r = sin(6.2831853 * vUv.y / step + 0.386) * 0.04;
      c += r;
      gl_FragColor = vec4(c, 1.0);
    }`
});
const sea = new THREE.Mesh(new THREE.PlaneGeometry(40, SEA_H), seaMat);
sea.name = 'sea';
sea.position.set(0, hzY - SEA_H / 2, -DIST);
scene.add(sea);

// Sun
const sr = 0.075 * FH;
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffd08a });
const sun = new THREE.Mesh(new THREE.CircleGeometry(sr, 64), sunMat);
sun.name = 'sun';
sun.scale.y = 0.55;
const sx = (0.41 - 0.5) * FW;
const sy0 = 0.2 + (0.70 - 0.5) * FH;
sun.position.set(sx, sy0, -DIST);
scene.add(sun);

// Sun reflection
const refMat = new THREE.MeshBasicMaterial({ color: 0xffd08a });
const ref = new THREE.Mesh(new THREE.CircleGeometry(sr, 64), refMat);
ref.name = 'sun_reflection';
ref.scale.y = 2.5;
ref.position.set(sx, 2 * hzY - sy0, -DIST);
scene.add(ref);

// Animation state
let t = 0;
const spd = 0.040 * FH;

function upd() {
  const ny = Math.max(sy0 - spd * t, hzY);
  sun.position.y = ny;
  ref.position.y = 2 * hzY - ny;
}

upd();
ren.render(scene, cam);
window.__ready = true;

window.__step = function(dt) {
  t += dt;
  upd();
  ren.render(scene, cam);
  return window.__probe();
};

window.__probe = function() {
  return {
    t: +t.toFixed(4),
    objects: scene.children.filter(o => o.name).map(o => o.name),
    sun: [+sun.position.x.toFixed(4), +sun.position.y.toFixed(4)]
  };
};
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
