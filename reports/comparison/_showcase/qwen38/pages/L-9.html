<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Звёздное небо над горами</title>
<style>
  html, body { margin: 0; padding: 0; background: #05040f; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ---------- Камера и кадр ----------
// PerspectiveCamera(45, 800/600, 0.1, 200), точка (0,0,10), смотрит в начало.
// Полувысота кадра на дистанции 10: 10 * tan(22.5°) ≈ 4.14214
const FOV = 45, ASPECT = 800 / 600, NEAR = 0.1, FAR = 200;
const CAM_Z = 10.0;
const HALF_H = CAM_Z * Math.tan(THREE.MathUtils.degToRad(FOV / 2)); // ≈ 4.142
const FR_W = 2 * HALF_H * ASPECT;   // 11.0457 — ширина «кадра» по спеке
const FR_H = 2 * HALF_H;            // 8.2843
const PX = FR_H / 1080;             // сценная величина 1 px кадра 1920x1080

function fx2x(fx) { return (fx - 0.5) * 2 * HALF_H * ASPECT; }
function fy2y(fy) { return (0.5 - fy) * 2 * HALF_H; }

// ---------- Детерминированный генератор ----------
// s — целое, S0 = 219090, s = (1664525*s + 1013904223) % 4294967296, u = s / 4294967296
let rs = 219090;
function rnd() {
  rs = (1664525 * rs + 1013904223) % 4294967296;
  return rs / 4294967296;
}

// ---------- Рендерер ----------
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, ASPECT, NEAR, FAR);
camera.position.set(0, 0, CAM_Z);
camera.lookAt(0, 0, 0);

// ---------- Небо: вертикальный градиент #090722 (верх) → #150b38 (горизонт) ----------
const skyTexData = new Uint8Array(1 * 256 * 4);
const topC = { r: 0x09, g: 0x07, b: 0x22 };
const botC = { r: 0x15, g: 0x0b, b: 0x38 };
for (let v = 0; v < 256; v++) {
  const f = v / 255; // 0 — низ (горизонт), 1 — верх
  skyTexData[v * 4 + 0] = Math.round(botC.r + (topC.r - botC.r) * f);
  skyTexData[v * 4 + 1] = Math.round(botC.g + (topC.g - botC.g) * f);
  skyTexData[v * 4 + 2] = Math.round(botC.b + (topC.b - botC.b) * f);
  skyTexData[v * 4 + 3] = 255;
}
const skyTex = new THREE.DataTexture(skyTexData, 1, 256, THREE.RGBAFormat);
skyTex.colorSpace = THREE.SRGBColorSpace;
skyTex.minFilter = THREE.LinearFilter;
skyTex.magFilter = THREE.LinearFilter;
skyTex.needsUpdate = true;
const sky = new THREE.Mesh(
  new THREE.PlaneGeometry(FR_W * 3, FR_H * 3, 1, 1),
  new THREE.MeshBasicMaterial({ map: skyTex, fog: false })
);
sky.name = 'sky';
sky.position.z = -4;
scene.add(sky);

// ---------- Горы: ломаная по 9 точкам, заливка #00b1d9, имя ridge ----------
// высоты над нижним краем кадра в долях высоты кадра
const ridgeFrac = [0.395, 0.367, 0.438, 0.144, 0.242, 0.229, 0.420, 0.260, 0.363];
const shape = new THREE.Shape();
shape.moveTo(-FR_W / 2, -HALF_H - 0.05);
for (let i = 0; i < ridgeFrac.length; i++) {
  const fx = i / (ridgeFrac.length - 1);
  const y = -HALF_H + ridgeFrac[i] * FR_H;
  shape.lineTo(fx2x(fx), y);
}
shape.lineTo(FR_W / 2, -HALF_H - 0.05);
shape.closePath();
const ridge = new THREE.Mesh(
  new THREE.ShapeGeometry(shape, 8),
  new THREE.MeshBasicMaterial({ color: 0x00b1d9 })
);
ridge.name = 'ridge';
ridge.position.z = 0;
scene.add(ridge);

// ---------- Звёзды: InstancedMesh, 620 четырёхугольника, имя stars ----------
const N_STARS = 620;
const starGeo = new THREE.PlaneGeometry(1, 1);
const starMat = new THREE.MeshBasicMaterial({
  color: 0xf2f6ff,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthTest: false,
  depthWrite: false
});
const stars = new THREE.InstancedMesh(starGeo, starMat, N_STARS);
stars.name = 'stars';
stars.frustumCulled = false;
stars.position.z = -1.0; // за горами в пространстве, но depthTest: false

const starBase = new Float32Array(N_STARS); // базовый размер в px кадра
const starX = new Float32Array(N_STARS);
const starY = new Float32Array(N_STARS);
const starPh = new Float32Array(N_STARS);

const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _v = new THREE.Vector3();
const _s = new THREE.Vector3();

for (let i = 0; i < N_STARS; i++) {
  const u1 = rnd(); // размер
  const u2 = rnd(); // fx
  const u3 = rnd(); // fy
  const u4 = rnd(); // фаза
  starBase[i] = 2.0 + 2.6 * u1;                 // пиксели кадра
  starX[i] = fx2x(u2);
  starY[i] = fy2y(u3 * 0.72);                   // верхние две трети кадра
  starPh[i] = 6.283 * u4;
}
scene.add(stars);

// ---------- Луна: диск r = 0.075 высоты кадра, #ffd699, имя moon + аддитивное пятно ----------
const MOON_FX0 = 0.664, MOON_FY = 0.340;
const moonR = 0.075 * FR_H; // 0.6213
const moon = new THREE.Mesh(
  new THREE.CircleGeometry(moonR, 48),
  new THREE.MeshBasicMaterial({ color: 0xffd699 })
);
moon.name = 'moon';

// мягкое аддитивное свечение вокруг луны
const glowCanvas = document.createElement('canvas');
glowCanvas.width = glowCanvas.height = 128;
const gctx = glowCanvas.getContext('2d');
const grad = gctx.createRadialGradient(64, 64, 0, 64, 64, 64);
grad.addColorStop(0.0, 'rgba(255,255,255,1)');
grad.addColorStop(0.25, 'rgba(255,255,255,0.55)');
grad.addColorStop(0.55, 'rgba(255,255,255,0.16)');
grad.addColorStop(1.0, 'rgba(255,255,255,0)');
gctx.fillStyle = grad;
gctx.fillRect(0, 0, 128, 128);
const glowTex = new THREE.CanvasTexture(glowCanvas);
const glow = new THREE.Mesh(
  new THREE.PlaneGeometry(moonR * 6.5, moonR * 6.5),
  new THREE.MeshBasicMaterial({
    map: glowTex,
    color: 0xffd699,
    blending: THREE.AdditiveBlending,
    transparent: true,
    opacity: 0.55,
    depthWrite: false
  })
);
glow.name = 'moonGlow';
glow.position.z = -0.05;

const moonGroup = new THREE.Group();
moonGroup.add(glow);
moonGroup.add(moon);
scene.add(moonGroup);

// ---------- Анимация ----------
let t = 0;

function layoutStars() {
  for (let i = 0; i < N_STARS; i++) {
    const tw = 0.5 + 0.5 * Math.sin(starPh[i] + 1.7 * t); // 0.5..1.0 базового размера
    const sz = starBase[i] * PX * tw;
    _v.set(starX[i], starY[i], 0);
    _s.set(sz, sz, 1);
    _m.compose(_v, _q, _s);
    stars.setMatrixAt(i, _m);
  }
  stars.instanceMatrix.needsUpdate = true;
}

function layoutMoon() {
  const fx = MOON_FX0 + 0.02 * t; // ход луны: 0.02 ширины кадра в секунду
  moonGroup.position.set(fx2x(fx), fy2y(MOON_FY), 0.1);
}

function probe() {
  const fxMoon = MOON_FX0 + 0.02 * t;
  return {
    t: Number(t.toFixed(4)),
    objects: ['sky', 'ridge', 'stars', 'moon'],
    moon: Number(fxMoon.toFixed(4))
  };
}

window.__step = function (dt) {
  t += dt;
  layoutStars();
  layoutMoon();
  renderer.render(scene, camera);
  return window.__probe();
};

window.__probe = function () {
  return probe();
};

// ---------- Первый кадр ----------
layoutStars();
layoutMoon();
window.__ready = false;
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
