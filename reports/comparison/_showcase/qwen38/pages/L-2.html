<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>synthwave grid</title>
<style>
  html, body { margin: 0; padding: 0; background: #05020c; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const THREE = window.THREE;

const W = 1920, H = 1080;
// tan(fov/2): полувысота кадра 24.853 на дистанции 30
const K = 24.853 / 30;
const FOV = 2 * Math.atan(K) * 180 / Math.PI;

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  antialias: true,
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x1b0f3c, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 500);
camera.position.set(0, 0, 0);
camera.lookAt(0, 0, -1);

// ---------- небо ----------
const skyMat = new THREE.ShaderMaterial({
  depthWrite: true,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying vec2 vUv;
    void main() {
      vec3 top = vec3(0.10588, 0.05882, 0.23529); // #1b0f3c
      vec3 bot = vec3(0.09804, 0.87843, 0.90980); // #19e0e8
      float s = smoothstep(0.0, 0.32, vUv.y);
      gl_FragColor = vec4(mix(bot, top, s), 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.PlaneGeometry(120, 27.338), skyMat);
sky.name = 'sky';
sky.position.set(0, 24.853 - 27.338 / 2, -30);
scene.add(sky);

// ---------- земля ----------
const groundMat = new THREE.ShaderMaterial({
  uniforms: { uOffset: { value: 0.0 } },
  vertexShader: `
    varying vec3 vWorld;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform float uOffset;
    varying vec3 vWorld;
    void main() {
      vec3 cNear = vec3(0.07059, 0.03922, 0.16471); // #120a2a
      vec3 cFar  = vec3(0.10588, 0.05882, 0.23529); // #1b0f3c
      vec3 cLine = vec3(1.0, 0.18431, 0.69020);     // #ff2fb0
      float t = clamp(-vWorld.z / 30.0, 0.0, 1.0);
      vec3 base = mix(cNear, cFar, t);
      float z = vWorld.z;
      // ширина линии в мировых единицах растёт с глубиной (на кадре ~постоянна > 1px)
      float w = (0.055 + 0.035 * t);
      float cellH = fract((z + uOffset) / 1.6);
      float cellV = fract(vWorld.x / 1.6);
      float dH = min(cellH, 1.0 - cellH) * (1.6 / w);
      float dV = min(cellV, 1.0 - cellV) * (1.6 / w);
      float lh = 1.0 - smoothstep(0.85, 1.15, dH);
      float lv = 1.0 - smoothstep(0.85, 1.15, dV);
      float fade = 1.0 - 0.65 * smoothstep(0.45, 1.0, t); // дальние линии гаснут к горизонту
      float m = clamp(max(lh, lv) * fade, 0.0, 1.0);
      gl_FragColor = vec4(mix(base, cLine, m), 1.0);
    }`
});
const groundGeo = new THREE.PlaneGeometry(240, 120);
groundGeo.rotateX(-Math.PI / 2);
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.name = 'ground';
ground.position.set(0, -2.485, -60.05); // от камеры на 120 единиц вглубь, ровно под горизонтом
scene.add(ground);

// ---------- солнце ----------
const sunMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying vec2 vUv;
    void main() {
      vec2 p = vUv * 2.0 - 1.0;
      if (length(p) > 1.0) discard;
      vec3 top = vec3(1.0, 0.69020, 0.22745); // #ffb03a
      vec3 low = vec3(0.92157, 0.30196, 0.05882);
      float t = clamp(0.5 - p.y * 0.5, 0.0, 1.0);
      vec3 col = mix(top, low, 0.85 * smoothstep(0.55, 1.0, t)); // сверху #ffb03a, книзу темнее
      // в нижних двух третях диска вырезаем горизонтальные полосы
      if (p.y < 1.0 / 3.0) {
        float q2 = (1.0 / 3.0 - p.y);              // 0 у хорды, до 4/3 у dna
        float gap = mix(0.35, 0.62, q2 / (4.0 / 3.0));
        float stripe = fract(q2 / 0.19);
        if (stripe < gap) discard;
      }
      gl_FragColor = vec4(col, 1.0);
    }`
});
const sun = new THREE.Mesh(new THREE.CircleGeometry(4.971, 96), sunMat);
sun.name = 'sun';
sun.position.set(0, 0, -29.5);
scene.add(sun);

// позиция солнца в долях кадра: центр на 38.8% высоты выше горизонта
const T295 = 29.5 * K;        // полувысота кадра на z = -29.5
const H295 = 2 * T295;        // высота кадра на z = -29.5
const SUN_Y0 = T295 * (1 - 2 * 0.388);           // 38.8% от верха
const SUN_YT = T295 * (1 - 2 * 0.52);            // 52% от верха (цель)
const SUN_RATE = 0.025 * H295;                   // единиц кадра в 0.025 высоты кадра / c

let t = 0;
let uOffset = 0;

sun.position.y = SUN_Y0;
groundMat.uniforms.uOffset.value = 0;

function probe() {
  return {
    t: +t.toFixed(4),
    objects: ['sky', 'ground', 'sun'],
    sun: [0.5, +((T295 - sun.position.y) / H295).toFixed(4)],
    grid_z: +uOffset.toFixed(4)
  };
}

window.__probe = probe;
window.__step = function (dt) {
  t += dt;
  uOffset = (uOffset + 0.90 * dt) % 1.6;
  groundMat.uniforms.uOffset.value = uOffset;
  sun.position.y = Math.max(SUN_YT, SUN_Y0 - SUN_RATE * t);
  renderer.render(scene, camera);
  return window.__probe();
};

renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
