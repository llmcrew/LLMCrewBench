<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Meteor Impact — Orbital View</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;}
  canvas{display:block;width:100vw;height:100vh;}
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ---------- deterministic LCG ---------- */
let lcg = 399148;
function rnd(){ lcg = (lcg * 1103515245 + 12345) % 2147483648; return lcg / 2147483648; }

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer:true, antialias:true});
renderer.setPixelRatio(1);
renderer.setSize(1920,1080,false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);

const camera = new THREE.PerspectiveCamera(46, 1920/1080, 0.01, 200);
camera.position.set(-0.02, 0.90, 5.5);

/* ---------- lights ---------- */
const sun = new THREE.DirectionalLight(0xfff2e0, 1.35);
sun.position.set(6, 4, 8);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x223355, 0.55));
const rim = new THREE.DirectionalLight(0x6fb6ff, 0.5);
rim.position.set(-6,-2,-4);
scene.add(rim);

/* ---------- EARTH shader (L-25 style) ---------- */
const earthUniforms = { uTime:{value:0} };
const earthMat = new THREE.ShaderMaterial({
  uniforms: earthUniforms,
  vertexShader: `
    varying vec3 vPos; varying vec3 vNormal;
    void main(){
      vPos = position;
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying vec3 vPos; varying vec3 vNormal;
    uniform float uTime;
    float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    float noise(vec3 x){
      vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
      return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),
                     mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                     mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
    }
    float fbm(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*noise(p); p*=2.02; a*=0.5;} return s; }
    void main(){
      vec3 p = normalize(vPos);
      float h = fbm(p*2.2 + 1.7);
      vec3 ocean = vec3(0.075,0.192,0.369);   // #13315e
      vec3 land  = vec3(0.184,0.420,0.275);   // #2f6b46
      float landMask = smoothstep(0.46,0.56,h);
      vec3 col = mix(ocean, land, landMask);
      // polar caps
      float cap = smoothstep(0.72,0.85, abs(p.y));
      col = mix(col, vec3(0.85,0.9,0.95), cap*0.7);
      // lighting
      vec3 sunDir = normalize(vec3(6.0,4.0,8.0));
      float ndl = dot(normalize(vNormal), sunDir);
      float day = smoothstep(-0.15,0.25, ndl);
      col *= 0.25 + 0.95*day;
      // city lights on dark land
      float night = 1.0 - day;
      float city = step(0.62, hash(floor(p*40.0))) * landMask * night;
      col += vec3(1.0,0.816,0.816) * city * 0.9;   // #ffd0d0
      // atmosphere rim glow
      float rim = pow(1.0 - abs(dot(normalize(vNormal), vec3(0,0,1))), 2.0);
      col += vec3(0.435,0.714,1.0) * rim * 0.35;
      gl_FragColor = vec4(col,1.0);
    }`
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(4.0, 96, 96), earthMat);
earth.name = 'earth';
earth.position.set(-0.6,-2.0,-13);
scene.add(earth);

/* ---------- atmosphere ---------- */
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(4.4, 64, 64),
  new THREE.ShaderMaterial({
    transparent:true, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false,
    vertexShader:`varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vN; void main(){ float i=pow(0.65-dot(vN,vec3(0,0,1.0)),3.0); gl_FragColor=vec4(vec3(0.435,0.714,1.0)*i, i);}`
  })
);
atmosphere.name='atmosphere';
atmosphere.position.copy(earth.position);
scene.add(atmosphere);

/* ---------- clouds ---------- */
const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(4.12, 64, 64),
  new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{uTime:earthUniforms.uTime},
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      varying vec3 vP; uniform float uTime;
      float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      float noise(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
        return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
      float fbm(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<4;i++){ s+=a*noise(p); p*=2.1; a*=0.5;} return s; }
      void main(){ float c=smoothstep(0.5,0.72,fbm(normalize(vP)*3.0+uTime*0.02));
        gl_FragColor=vec4(vec3(1.0), c*0.28); }`
  })
);
clouds.name='clouds';
clouds.position.copy(earth.position);
scene.add(clouds);

/* ---------- meteor ---------- */
const meteor = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 32, 32),
  new THREE.MeshStandardMaterial({color:0xffd0a0, emissive:0xff7a20, emissiveIntensity:2.2, roughness:0.4, metalness:0.1})
);
meteor.name='meteor';
scene.add(meteor);

const M_START = new THREE.Vector3(1.9,1.5,-6.0);
const M_VEL   = new THREE.Vector3(-0.395,-0.516,-0.719);
const IMPACT_T = 1.74;
const IMPACT_POINT = M_START.clone().add(M_VEL.clone().multiplyScalar(IMPACT_T));

/* ---------- trail (90 additive points) ---------- */
const TRAIL_N = 90;
const trailPos = new Float32Array(TRAIL_N*3);
const trailSize = new Float32Array(TRAIL_N);
const trailAlpha = new Float32Array(TRAIL_N);
for(let i=0;i<TRAIL_N;i++){ trailSize[i]= (1.0 - i/TRAIL_N)*10.0 + 2.0; }
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos,3));
trailGeo.setAttribute('aSize', new THREE.BufferAttribute(trailSize,1));
trailGeo.setAttribute('aAlpha', new THREE.BufferAttribute(trailAlpha,1));
const trail = new THREE.Points(trailGeo, new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`attribute float aSize; attribute float aAlpha; varying float vA;
    void main(){ vA=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=aSize*(300.0/-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`varying float vA; void main(){ vec2 c=gl_PointCoord-0.5; float d=length(c);
    float a=smoothstep(0.5,0.0,d)*vA; gl_FragColor=vec4(vec3(1.0,0.816,0.627)*a, a); }`
}));
trail.name='trail';
scene.add(trail);

/* ---------- shock ring around meteor ---------- */
const shock = new THREE.Mesh(
  new THREE.RingGeometry(0.5,1.0,48),
  new THREE.MeshBasicMaterial({color:0xffb060, transparent:true, opacity:0.6, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false})
);
shock.name='shock';
scene.add(shock);

/* ---------- impact flash & ring ---------- */
const impact_flash = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 32, 32),
  new THREE.MeshBasicMaterial({color:0xfff2c0, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false})
);
impact_flash.name='impact_flash';
impact_flash.position.copy(IMPACT_POINT);
scene.add(impact_flash);

const impact_ring = new THREE.Mesh(
  new THREE.RingGeometry(0.6,1.0,64),
  new THREE.MeshBasicMaterial({color:0xc9a06a, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false})
);
impact_ring.name='impact_ring';
impact_ring.position.copy(IMPACT_POINT);
scene.add(impact_ring);

/* ---------- debris (120) ---------- */
const DEB_N = 120;
const debPos = new Float32Array(DEB_N*3);
const debSize = new Float32Array(DEB_N);
const debAlpha = new Float32Array(DEB_N);
const debDir = [];
const debSpd = [];
for(let i=0;i<DEB_N;i++){
  // random unit direction via LCG
  const u = rnd()*2-1;
  const th = rnd()*Math.PI*2;
  const r = Math.sqrt(1-u*u);
  debDir.push(new THREE.Vector3(r*Math.cos(th), r*Math.sin(th), u));
  debSpd.push(0.6 + rnd()*1.6);
  debSize[i] = 3.0 + rnd()*5.0;
}
const debGeo = new THREE.BufferGeometry();
debGeo.setAttribute('position', new THREE.BufferAttribute(debPos,3));
debGeo.setAttribute('aSize', new THREE.BufferAttribute(debSize,1));
debGeo.setAttribute('aAlpha', new THREE.BufferAttribute(debAlpha,1));
const debris = new THREE.Points(debGeo, new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`attribute float aSize; attribute float aAlpha; varying float vA;
    void main(){ vA=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=aSize*(300.0/-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`varying float vA; void main(){ vec2 c=gl_PointCoord-0.5; float d=length(c);
    float a=smoothstep(0.5,0.0,d)*vA; gl_FragColor=vec4(vec3(1.0,0.45,0.15)*a, a); }`
}));
debris.name='debris';
scene.add(debris);

/* ---------- station ---------- */
const station = new THREE.Group();
station.name='station';
station.position.set(-0.95, 0.35, 1.2);
const hullMat = new THREE.MeshStandardMaterial({color:0x8a93a3, roughness:0.5, metalness:0.7});
const hull = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.55,0.20), hullMat);
station.add(hull);
// panels
const panelMat = new THREE.MeshStandardMaterial({color:0x1a2a55, roughness:0.3, metalness:0.6, emissive:0x0a1a44, emissiveIntensity:0.4});
const pL = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.10,0.02), panelMat);
pL.position.set(-0.30,0.05,0); station.add(pL);
const pR = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.10,0.02), panelMat);
pR.position.set(0.30,-0.05,0); station.add(pR);
// antenna
const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.18,8), hullMat);
ant.position.set(0,0.36,0); station.add(ant);
// lights (small emissive dots)
const lightMat = new THREE.MeshBasicMaterial({color:0x88ddff});
for(let i=0;i<5;i++){
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.012,8,8), lightMat);
  dot.position.set(-0.10 + i*0.05, -0.24, 0.105);
  station.add(dot);
}
// porthole with reflection
const portholeMat = new THREE.MeshBasicMaterial({color:0xffd9a0, transparent:true, opacity:0.35, side:THREE.DoubleSide});
const porthole = new THREE.Mesh(new THREE.PlaneGeometry(0.12,0.12), portholeMat);
porthole.position.set(0,0.05,0.105);
station.add(porthole);
scene.add(station);

/* ---------- stars (2000) ---------- */
const STAR_N = 2000;
const starPos = new Float32Array(STAR_N*3);
for(let i=0;i<STAR_N;i++){
  const u = rnd()*2-1;
  const th = rnd()*Math.PI*2;
  const r = Math.sqrt(1-u*u);
  const R = 60 + rnd()*40;
  starPos[i*3]   = r*Math.cos(th)*R;
  starPos[i*3+1] = r*Math.sin(th)*R;
  starPos[i*3+2] = u*R;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff, size:1.4, sizeAttenuation:false, transparent:true, opacity:0.9}));
stars.name='stars';
scene.add(stars);

/* ---------- state ---------- */
let t = 0;
const _tmp = new THREE.Vector3();
const _look = new THREE.Vector3();

function update(){
  earthUniforms.uTime.value = t;
  // meteor position
  const mp = M_START.clone().add(M_VEL.clone().multiplyScalar(t));
  meteor.position.copy(mp);
  // shock ring follows meteor, grows 0->0.6 over 0.4s, repeats
  const sc = (t % 0.4)/0.4 * 0.6;
  shock.position.copy(mp);
  shock.scale.setScalar(Math.max(sc,0.001));
  shock.lookAt(mp.clone().add(M_VEL));
  shock.material.opacity = 0.6 * (1.0 - (t%0.4)/0.4);

  // trail: points trailing behind along path
  const spacing = 0.022;
  for(let i=0;i<TRAIL_N;i++){
    const back = (i+1)*spacing;
    _tmp.copy(mp).addScaledVector(M_VEL, -back);
    trailPos[i*3]=_tmp.x; trailPos[i*3+1]=_tmp.y; trailPos[i*3+2]=_tmp.z;
    trailAlpha[i] = Math.max(0, 1.0 - i/TRAIL_N) * 0.9;
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.aAlpha.needsUpdate = true;

  // impact
  const age = Math.max(0, t - IMPACT_T);
  if(age > 0){
    // flash
    const f = Math.max(0, 1.0 - age/0.6);
    impact_flash.material.opacity = f;
    impact_flash.scale.setScalar(0.5 + age*3.0);
    // ring dust
    impact_ring.scale.setScalar(0.3 + age*2.2);
    impact_ring.material.opacity = Math.max(0, 0.8 - age/1.2);
    impact_ring.lookAt(camera.position);
    // debris
    for(let i=0;i<DEB_N;i++){
      const d = debDir[i];
      const s = debSpd[i]*age;
      debPos[i*3]   = IMPACT_POINT.x + d.x*s;
      debPos[i*3+1] = IMPACT_POINT.y + d.y*s;
      debPos[i*3+2] = IMPACT_POINT.z + d.z*s;
      debAlpha[i] = Math.max(0, 1.0 - age/1.6);
    }
    debGeo.attributes.position.needsUpdate = true;
    debGeo.attributes.aAlpha.needsUpdate = true;
    // porthole reflection of flash
    portholeMat.opacity = 0.35 + f*0.5;
  } else {
    impact_flash.material.opacity = 0;
    impact_ring.material.opacity = 0;
    for(let i=0;i<DEB_N;i++){ debAlpha[i]=0; }
    debGeo.attributes.aAlpha.needsUpdate = true;
    portholeMat.opacity = 0.35;
  }

  // camera look: from meteor to impact point
  const k = THREE.MathUtils.smoothstep(t, 1.4, 2.0);
  _look.copy(mp).lerp(IMPACT_POINT, k);
  camera.lookAt(_look);
}

function render(){
  update();
  renderer.render(scene, camera);
}

/* ---------- probe / step ---------- */
function probe(){
  const mp = M_START.clone().add(M_VEL.clone().multiplyScalar(t));
  return {
    t: Number(t.toFixed(4)),
    objects: ['earth','atmosphere','clouds','meteor','trail','shock','impact_flash','impact_ring','debris','station','stars'],
    meteor: [Number(mp.x.toFixed(4)), Number(mp.y.toFixed(4)), Number(mp.z.toFixed(4))],
    impact_age: Number(Math.max(0, t-IMPACT_T).toFixed(4))
  };
}
window.__probe = probe;
window.__step = function(dt){
  t += dt;
  render();
  return window.__probe();
};

/* first frame */
render();
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
