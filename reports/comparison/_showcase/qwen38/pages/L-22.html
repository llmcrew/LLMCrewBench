<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Робот-ремонтник под дождём</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ---------- детерминированный LCG ----------
let lcg = 238931;
const rnd = () => (lcg = (lcg * 1103515245 + 12345) % 2147483648) / 2147483648;

const r4 = n => Math.round(n * 10000) / 10000;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

// ---------- сцена / камера ----------
// fov 60, aspect 16/9. Горизонт (кромка асфальта) при тангенсе наклона 0.057735
// попадает ровно в v = 0.40. Камера (0, 1.8, z), z: 4 -> 0.8, скорость 1.06/с.
const CAM_Y = 1.8;
const PITCH_TAN = 0.057735;
const S_P = 0.057673, C_P = 0.998317; // sin/cos наклона
let t = 0;
let camZ = 4.0;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1b1a2a, 10, 42);

const camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.05, 120);
function placeCamera() {
  camera.position.set(0, CAM_Y, camZ);
  camera.lookAt(0, CAM_Y - 30 * PITCH_TAN, camZ - 30);
}
placeCamera();

// ---------- палитра ----------
const C = {
  night:  0x1b1a2a,
  floor:  0x14121f,
  neon:   0xff2f7a,
  spark:  0xffd94a,
  cool:   0xa8c8dc,
  shadow: 0x100e1d,
};

// ---------- фон: ночь, стена, асфальт ----------
const sky = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 130),
  new THREE.MeshBasicMaterial({ color: C.night, fog: false })
);
sky.position.set(0, 32, -45); // z = -45
scene.add(sky);

const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 100),
  new THREE.MeshStandardMaterial({ color: C.night, roughness: 0.95, metalness: 0.0 })
);
wall.position.set(0, 32, -16); // z = -16
wall.receiveShadow = true;
scene.add(wall);

// окна на стене (глухие, чуть темнее стены)
const winMat = new THREE.MeshBasicMaterial({ color: C.shadow, fog: true });
for (let ix = 0; ix < 6; ix++) {
  for (let iy = 0; iy < 2; iy++) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.1, 0.16), winMat);
    w.position.set(-15 + ix * 6, 4.4 + iy * 1.7, -15.9);
    scene.add(w);
  }
}
// парапет и крышки вентиляции на линии крыши (силуэт)
const roofMat = new THREE.MeshBasicMaterial({ color: 0x141226 });
[[ -14, 7.15, 3.2, 2.2 ], [ -7, 7.35, 2.4, 1.6 ], [ 6, 7.2, 4.0, 2.6 ], [ 16, 7.12, 2.6, 2.0 ]]
  .forEach(([x, y, s, h]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(s, h, 1.4), roofMat);
    m.position.set(x, y, -15.3);
    scene.add(m);
  });
// труба
const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 3.4, 10), roofMat);
pipe.position.set(11.5, 8.4, -15.4);
scene.add(pipe);
// кондиционер
const ac = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.9, 0.9),
  new THREE.MeshStandardMaterial({ color: 0x1d1930, roughness: 0.7, metalness: 0.4 }));
ac.position.set(-11.5, 3.4, -15.55);
scene.add(ac);
// шов стены
const seam = new THREE.Mesh(new THREE.BoxGeometry(240, 0.09, 0.05),
  new THREE.MeshBasicMaterial({ color: 0x12101f }));
seam.position.set(0, 2.6, -15.94);
scene.add(seam);

// асфальт: z ~ +3 .. -55
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(170, 58),
  new THREE.MeshStandardMaterial({ color: C.floor, roughness: 0.34, metalness: 0.55 })
);
floor.geometry.rotateX(-Math.PI / 2);
floor.position.set(0, 0, -26);
floor.receiveShadow = true;
scene.add(floor);

// ---------- вывеска SIGN ----------
// центр (-4.49, 5.17, -15.85), 30% x 12% кадра, u=0.28, v=0.16
const sign = new THREE.Group();
sign.position.set(-4.49, 5.17, -15.85);

const backing = new THREE.Mesh(new THREE.BoxGeometry(13.1, 3.35, 0.34),
  new THREE.MeshStandardMaterial({ color: 0x16131f, roughness: 0.6, metalness: 0.5 }));
sign.add(backing);

const screenMat = new THREE.MeshBasicMaterial({ color: C.neon, fog: false });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(12.26, 2.62), screenMat);
screen.position.z = 0.19;
sign.add(screen);

// тёмные "буквы"
const barMat = new THREE.MeshBasicMaterial({ color: C.night });
[-4.7, -3.1, -1.5, 0.1, 1.7, 3.3].forEach((bx, i) => {
  const h = 1.55 + 0.35 * rnd();      // LCG: форма "букв"
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.48, h, 0.05), barMat);
  bar.position.set(bx, 0, 0.22);
  sign.add(bar);
});

// неоновая рамка
const frameMat = new THREE.MeshBasicMaterial({ color: C.neon, fog: false });
[
  [0,  1.45, 13.0, 0.26, 0.05],
  [0, -1.45, 13.0, 0.26, 0.05],
].forEach(([fxx, fyy, w, h, d]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
  m.position.set(fxx, fyy, 0.20);
  sign.add(m);
});
[1].forEach(() => {});
[[6.44], [-6.44]].forEach(([fxx]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.26, 3.15, 0.05), frameMat);
  m.position.set(fxx, 0, 0.20);
  sign.add(m);
});

// кронштейны крепления
const brkMat = new THREE.MeshBasicMaterial({ color: 0x0f0d18 });
[[ -3.5, -1.0 ], [ 3.5, -1.0 ]].forEach(([bx, by]) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.42), brkMat);
  b.position.set(bx, by, -0.1);
  sign.add(b);
});
scene.add(sign);

// мягкое неоновое свечение (canvas-градиент, без внешних ресурсов)
function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.4)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowTx = glowTexture();
const signGlowMat = new THREE.SpriteMaterial({
  map: glowTx, color: C.neon, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false
});
const signGlow = new THREE.Sprite(signGlowMat);
signGlow.scale.set(18, 7.5, 1);
signGlow.position.set(-4.49, 5.17, -15.7);
scene.add(signGlow);

// ---------- источники света ----------
const hemi = new THREE.HemisphereLight(0x38345a, 0x070810, 0.55);
scene.add(hemi);

const signSpot = new THREE.SpotLight(C.neon, 480, 40, 0.62, 0.65, 1.8);
signSpot.position.set(-4.49, 7.2, -11.5);
signSpot.target.position.set(-1.5, 1.0, -7.5);
signSpot.castShadow = true;
signSpot.shadow.mapSize.set(1024, 1024);
signSpot.shadow.camera.near = 2;
signSpot.shadow.camera.far = 40;
scene.add(signSpot, signSpot.target);

const signPoint = new THREE.PointLight(C.neon, 30, 18, 2);
signPoint.position.set(-4.49, 5.1, -15.0);
scene.add(signPoint);

// холодная заливка спереди (дождливая даль)
const fill = new THREE.PointLight(C.cool, 6, 18, 2);
fill.position.set(1.4, 3.0, -1.2);
scene.add(fill);

// ---------- робот-ремонтник ----------
// ноги на асфальте: u = 0.44 -> x = -0.739, z = -8, высота 2.8
const RX = -0.739;
const RZ = -8;
const robot = new THREE.Group();
robot.position.set(RX, 0, RZ);

const bodyMat = new THREE.MeshStandardMaterial({ color: C.night, roughness: 0.45, metalness: 0.55 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x141223, roughness: 0.6, metalness: 0.4 });

function addPart(geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  robot.add(m);
  return m;
}

// ноги (0.35 высоты)
addPart(new THREE.BoxGeometry(0.55, 0.98, 0.7), bodyMat, -0.85, 0.49, 0);
addPart(new THREE.BoxGeometry(0.55, 0.98, 0.7), bodyMat,  0.85, 0.49, 0);
// ботинки
addPart(new THREE.BoxGeometry(0.66, 0.18, 0.9), darkMat, -0.85, 0.09, 0.05);
addPart(new THREE.BoxGeometry(0.66, 0.18, 0.9), darkMat,  0.85, 0.09, 0.05);

// корпус (0.55 высоты)
addPart(new THREE.BoxGeometry(3.2, 1.12, 1.15), bodyMat, 0, 1.54, 0);
// панель на груди
addPart(new THREE.BoxGeometry(1.9, 0.7, 0.06), darkMat, 0, 1.6, 0.6);
const panelMat = new THREE.MeshBasicMaterial({ color: C.neon });
addPart(new THREE.BoxGeometry(0.2, 0.42, 0.04), panelMat, 0.55, 1.6, 0.64);
addPart(new THREE.BoxGeometry(0.2, 0.42, 0.04), panelMat, 0.05, 1.6, 0.64);

// голова (0.30)
addPart(new THREE.BoxGeometry(1.5, 0.72, 1.0), bodyMat, 0, 2.45, 0);
// визор / глаз, холодный
const eyeMat = new THREE.MeshBasicMaterial({ color: C.cool, fog: false });
addPart(new THREE.BoxGeometry(0.9, 0.2, 0.06), eyeMat, -0.1, 2.5, 0.51);
// антенна
addPart(new THREE.CylinderGeometry(0.035, 0.035, 0.5, 8), darkMat, 0.5, 3.05, -0.1);
const blinkDot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), eyeMat);
blinkDot.position.set(0.5, 3.32, -0.1);
robot.add(blinkDot);

// левая рука (вниз-вперёд, спокойная)
const armGeoL = new THREE.BoxGeometry(0.38, 1.2, 0.38);
armGeoL.translate(0, -0.6, 0);
const armL = addPart(armGeoL, bodyMat, -1.8, 1.95, 0, -0.5);
// правая рука — вытянута вперёд (искры из-под кисти)
const armGeoR = new THREE.BoxGeometry(0.38, 1.2, 0.38);
armGeoR.translate(0, -0.6, 0);
const armR = addPart(armGeoR, bodyMat, 1.8, 1.95, 0, -0.9);
// кисть + сварочный инструмент
addPart(new THREE.BoxGeometry(0.5, 0.5, 0.5), darkMat, 2.0, 1.22, 0.85);
const nozzle = addPart(new THREE.ConeGeometry(0.16, 0.42, 10), darkMat, 2.0, 0.98, 1.0);
nozzle.rotation.x = Math.PI;

// лампа на плече, тёплая
const lampCore = new THREE.Mesh(new THREE.SphereGeometry(0.15, 14, 12),
  new THREE.MeshBasicMaterial({ color: C.spark, fog: false }));
lampCore.position.set(-1.8, 2.12, 0.25);
robot.add(lampCore);
const lampLight = new THREE.PointLight(C.spark, 14, 11, 2);
lampLight.position.set(RX - 1.8, 2.15, RZ + 0.3);
scene.add(lampLight);
const lampGlowMat = new THREE.SpriteMaterial({
  map: glowTx, color: C.spark, transparent: true, opacity: 0.55,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false
});
const lampGlow = new THREE.Sprite(lampGlowMat);
lampGlow.scale.set(1.1, 1.1, 1);
lampGlow.position.set(RX - 1.8, 2.15, RZ + 0.3);
scene.add(lampGlow);

scene.add(robot);

// ---------- мокрый асфальт и лужи ----------
// wet: полоса 0.96 x 0.06, v = 0.945 -> z = -3.21
const wetMat = new THREE.MeshBasicMaterial({ color: C.cool, transparent: true, opacity: 0.14, depthWrite: false });
const wet = new THREE.Mesh(new THREE.PlaneGeometry(15.8, 0.82), wetMat);
wet.geometry.rotateX(-Math.PI / 2);
wet.position.set(0, 0.004, -3.21);
scene.add(wet);
// яркие блики-полоски на мокрой ленте
const streakMat = new THREE.MeshBasicMaterial({ color: C.cool, transparent: true, opacity: 0.32, depthWrite: false });
for (let i = 0; i < 5; i++) {
  const sw = 1.5 + rnd() * 3.2;
  const sx = (rnd() * 2 - 1) * 5.6;
  const sz = -3.21 + (rnd() * 2 - 1) * 0.34;
  const s = new THREE.Mesh(new THREE.PlaneGeometry(sw, 0.05 + rnd() * 0.05), streakMat);
  s.geometry.rotateX(-Math.PI / 2);
  s.position.set(sx, 0.006 + i * 0.0008, sz);
  scene.add(s);
}

// три лужи с отражением вывески: 0.20 x 0.05, v = 0.88 -> z = -2.55
const puddleMat = new THREE.MeshBasicMaterial({ color: C.neon, transparent: true, opacity: 0.4, depthWrite: false });
const puddleHotMat = new THREE.MeshBasicMaterial({ color: C.neon, transparent: true, opacity: 0.55, depthWrite: false });
const puddles = [];
[[0.28, -0.04], [0.44, 0.0], [0.58, 0.05]].forEach(([uu, dz]) => {
  const x = (uu - 0.5) * 1.0265 * 7.21;
  const g = new THREE.CircleGeometry(1, 42);
  g.rotateX(-Math.PI / 2);
  const p = new THREE.Mesh(g, puddleMat);
  p.scale.set(1.48, 1, 0.21);
  p.position.set(x, 0.008, -2.55 + dz);
  scene.add(p);
  const hot = new THREE.Mesh(g, puddleHotMat);
  hot.scale.set(0.62, 1, 0.09);
  hot.position.set(x + 0.1, 0.009, -2.55 + dz - 0.02);
  scene.add(hot);
  puddles.push(p, hot);
});

// ---------- дождь: 54 капли, z = -3.9, 1.93 ед/с ----------
const DROPS_N = 54, DROP_SPEED = 1.93;
const DROP_YMAX = -0.5, DROP_YMIN = -4.55;
const drops = [];
for (let i = 0; i < DROPS_N; i++) {
  drops.push({ x: (rnd() * 2 - 1) * 3.9, y: DROP_YMAX - rnd() * (DROP_YMAX - DROP_YMIN), z: -3.9 });
}
const dropGeo = new THREE.BufferGeometry();
const dropPos = new Float32Array(DROPS_N * 3);
dropGeo.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));
const dropMat = new THREE.PointsMaterial({
  color: C.cool, size: 8, sizeAttenuation: false,
  transparent: true, opacity: 0.85, depthWrite: false
});
const dropsPts = new THREE.Points(dropGeo, dropMat);
scene.add(dropsPts);

// ---------- искры: 22, u=.. плечо (z = -6), 3..4.5 ед/с ----------
const SPARKS_N = 22;
const sparks = [];
for (let i = 0; i < SPARKS_N; i++) {
  sparks.push({ x: 0.9 + (rnd() * 2 - 1) * 0.85, y: 0.35 + rnd() * 2.65, z: -6, vy: 3.0 + rnd() * 1.5 });
}
const sparkGeo = new THREE.BufferGeometry();
const sparkPos = new Float32Array(SPARKS_N * 3);
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
const sparkMat = new THREE.PointsMaterial({
  color: C.spark, size: 6, sizeAttenuation: false,
  transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const sparksPts = new THREE.Points(sparkGeo, sparkMat);
scene.add(sparksPts);

function writePoints() {
  for (let i = 0; i < DROPS_N; i++) {
    dropPos[i * 3] = drops[i].x;
    dropPos[i * 3 + 1] = drops[i].y;
    dropPos[i * 3 + 2] = drops[i].z;
  }
  dropGeo.attributes.position.needsUpdate = true;
  for (let i = 0; i < SPARKS_N; i++) {
    sparkPos[i * 3] = sparks[i].x;
    sparkPos[i * 3 + 1] = sparks[i].y;
    sparkPos[i * 3 + 2] = sparks[i].z;
  }
  sparkGeo.attributes.position.needsUpdate = true;
}
writePoints();

// ---------- мигание вывески (раз в 1.4 с) ----------
function applyBlink() {
  const on = (t % 1.4) < 1.12;
  screenMat.color.setHex(on ? C.neon : 0x3a1124);
  frameMat.color.setHex(on ? C.neon : 0x401227);
  signGlowMat.opacity = on ? 0.5 : 0.07;
  signSpot.intensity = on ? 480 : 8;
  signPoint.intensity = on ? 30 : 2.5;
}
applyBlink();

// ---------- step / probe ----------
function step(dt) {
  t += dt;
  camZ = Math.max(0.8, camZ - 1.06 * dt);
  placeCamera();

  for (let i = 0; i < DROPS_N; i++) {
    drops[i].y -= DROP_SPEED * dt;
    if (drops[i].y < DROP_YMIN) drops[i].y += (DROP_YMAX - DROP_YMIN);
  }
  for (let i = 0; i < SPARKS_N; i++) {
    sparks[i].y -= sparks[i].vy * dt;
    if (sparks[i].y < 0.3) sparks[i].y = Math.min(sparks[i].y + 2.65, 3.0);
  }
  applyBlink();
  writePoints();
  renderer.render(scene, camera);
  return probe();
}

function probe() {
  return {
    t: r4(t),
    objects: [
      { n: 'night',  x: 0, y: 32, z: -45 },
      { n: 'wall',   x: 0, y: 32, z: -16 },
      { n: 'floor',  x: 0, y: 0, z: -26 },
      { n: 'sign',   x: r4(sign.position.x), y: r4(sign.position.y), z: r4(sign.position.z) },
      { n: 'robot',  x: r4(RX), y: r4(1.4), z: r4(RZ) },
      { n: 'wet',    x: 0, y: 0, z: -3.21 },
      { n: 'puddle', x: r4(-0.45), y: 0, z: -2.55 },
      { n: 'drops',  x: 0, y: -2.5, z: -3.9 },
      { n: 'sparks', x: r4(sparks[0].x), y: r4(sparks[0].y), z: -6 },
    ],
    spark: [r4(sparks[0].x), r4(sparks[0].y)],
    camera: [r4(camera.position.x), r4(camera.position.z)],
  };
}

window.__step = step;
window.__probe = probe;

// первый кадр (t = 0)
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
