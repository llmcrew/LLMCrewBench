<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мост — наклонная изометрия</title>
<style>
  html, body { margin: 0; padding: 0; background: #15171f; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const THREE = window.THREE;

const BG = 0x15171f;
const TEAL = 0x3ce8f0;
const DARK = 0x123f4a;
const ROAD = 0xffc247;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), preserveDrawingBuffer: true, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
renderer.setClearColor(BG, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);

const camera = new THREE.PerspectiveCamera(45, 1920 / 1080, 0.1, 200);
camera.position.set(13, 7, 21);
camera.lookAt(0.0, 1.0, 0.0);

const matDark = new THREE.MeshBasicMaterial({ color: DARK });
const matTeal = new THREE.MeshBasicMaterial({ color: TEAL });
const matRoad = new THREE.MeshBasicMaterial({ color: ROAD });
const lineMat = new THREE.LineBasicMaterial({ color: TEAL });

function addBox(parent, w, h, d, x, y, z, mat, rz = 0, rx = 0) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  if (rz) mesh.rotation.z = rz;
  if (rx) mesh.rotation.x = rx;
  parent.add(mesh);
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat));
  return mesh;
}

function addArc(parent, cx, cy, tube = 0.30) {
  const geo = new THREE.TorusGeometry(3.8, tube, 12, 48, Math.PI);
  const arc = new THREE.Mesh(geo, matTeal);
  arc.position.set(cx, cy, 0);
  parent.add(arc);
  arc.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 24), lineMat));
  return arc;
}

const rig = new THREE.Group();
rig.position.set(0, 0, 0);
scene.add(rig);

const deckTop = 0.68 + 0.35 / 2; // 0.855 — верх полотна

// Балка пролёта
addBox(rig, 18, 1.0, 5.0, 0, 0, 0, matDark);
// Полотно дороги
addBox(rig, 18, 0.35, 4.6, 0, 0.68, 0, matRoad);
// Перила
addBox(rig, 18, 0.4, 0.22, 0, 1.05,  2.3, matTeal);
addBox(rig, 18, 0.4, 0.22, 0, 1.05, -2.3, matTeal);
// Пилоны
addBox(rig, 1.4, 8.0, 1.4,  6.5, -4.0,  2.0, matDark);
addBox(rig, 1.4, 8.0, 1.4,  6.5, -4.0, -2.0, matDark);
addBox(rig, 1.4, 8.0, 1.4, -6.5, -4.0,  2.0, matDark);
addBox(rig, 1.4, 8.0, 1.4, -6.5, -4.0, -2.0, matDark);
// Арка — полукруг, плоскость XY
addArc(rig, 0, 1.2);
// Подвесы: пара из задания + дополняющий ряд от арки до полотна
addBox(rig, 0.16, 2.63, 0.16,  2.74, deckTop + 2.63 / 2, 0, matTeal);
addBox(rig, 0.16, 2.63, 0.16, -2.74, deckTop + 2.63 / 2, 0, matTeal);
for (const hx of [1.06, 2.0, 3.3]) {
  const top = 1.2 + 3.8 * Math.sqrt(1 - (hx / 3.8) * (hx / 3.8)) - 0.05;
  const h = top - deckTop;
  addBox(rig, 0.10, h, 0.10,  hx, deckTop + h / 2, 0, matTeal);
  addBox(rig, 0.10, h, 0.10, -hx, deckTop + h / 2, 0, matTeal);
}
// Ограждение — бирюзовые панели по обе стороны полотна
addBox(rig, 17.8, 0.45, 0.06, 0, deckTop + 0.225,  2.05, matTeal);
addBox(rig, 17.8, 0.45, 0.06, 0, deckTop + 0.225, -2.05, matTeal);
// Рёбра конструкции: ригельная решётка по граням балки пролёта
for (let i = -4; i < 5; i++) {
  const x = i * 2.0;
  for (const zs of [2.58, -2.58]) {
    addBox(rig, 0.10, 0.85, 0.10, x, 0, zs, matTeal);
    addBox(rig, 0.10, 0.28, 0.70, x + 1.0, 0, zs, matTeal, Math.PI / 4);
    addBox(rig, 0.10, 0.28, 0.70, x + 1.0, 0, zs, matTeal, -Math.PI / 4);
  }
}
addBox(rig, 0.70, 0.28, 0.10,  9.06, 0, -1.0, matTeal, 0, Math.PI + Math.PI / 4);
addBox(rig, 0.70, 0.28, 0.10, -9.06, 0,  1.0, matTeal, 0, -Math.PI / 4);
// Дополнительные арочные порталы у пилонов (плоскость XY)
addArc(rig, 5.4, deckTop, 0.5);
addArc(rig, -5.4, deckTop, 0.5);
// Торец щиты балки пролёта
addBox(rig, 0.08, 0.9, 4.4,  9.04, 0, 0, matTeal);
addBox(rig, 0.08, 0.9, 4.4, -9.04, 0, 0, matTeal);

// Первая отрисовка
renderer.render(scene, camera);

let t = 0;

window.__ready = true;

window.__step = function (dt) {
  t += dt;
  rig.rotation.y = 0.080 * t;
  renderer.render(scene, camera);
  return window.__probe();
};

window.__probe = function () {
  const objects = [];
  scene.traverse((o) => {
    objects.push({
      type: o.type,
      name: o.name || '',
      pos: [o.position.x, o.position.y, o.position.z]
    });
  });
  return {
    t: Number(t.toFixed(4)),
    objects: objects,
    yaw: Number(((rig.rotation.y * 180) / Math.PI).toFixed(4))
  };
};
</script>
</body>
</html>
