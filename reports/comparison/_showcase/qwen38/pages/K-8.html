<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0}
body{display:flex;justify-content:center;align-items:center;height:100vh;background:#111}
canvas{display:block}

<body>
<script type="module">
const THREE = window.THREE;

/* ── Сцена ── */
const scene = new THREE.Scene();

/* ── Backdrop ── */
const backdropGeo = new THREE.PlaneGeometry(40, 40);
const backdropMat = new THREE.MeshBasicMaterial({ color: 0x22303f });
const backdrop = new THREE.Mesh(backdropGeo, backdropMat);
backdrop.name = 'backdrop';
backdrop.position.set(0, 0, -2);
scene.add(backdrop);

/* ── Particles (InstancedMesh, 12 сфер r=0.3) ── */
const sphereGeo = new THREE.SphereGeometry(0.3, 16, 12);
const sphereMat = new THREE.MeshStandardMaterial({ color: 0xffa64d });
const particles = new THREE.InstancedMesh(sphereGeo, sphereMat, 12);
particles.name = 'particles';
scene.add(particles);

/* ── Камера ── */
const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
camera.position.set(0.0, 0.0, 16.0);
camera.lookAt(0.0, 0.0, 0.0);
scene.add(camera);

/* ── Свет ── */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(4.0, 6.0, 10.0);
scene.add(dirLight);

/* ── Рендерер ── */
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

/* ── Состояние частиц ── */
const N = 12;
const px = new Float64Array(N);
const py = new Float64Array(N);
const H = 0.2;

for (let i = 0; i < N; i++) {
  px[i] = -3 + 2 * (i % 4);
  py[i] = 2 - 1.5 * Math.floor(i / 4);
}

/* ── LCG ── */
let s = 2215753936;
let steps = 0;

function lcg() {
  s = (1664525 * s + 1013904223) % 4294967296;
  return s / 4294967296;
}

/* ── Обновление инстансов ── */
const _dummy = new THREE.Object3D();
function syncInstances() {
  for (let i = 0; i < N; i++) {
    _dummy.position.set(px[i], py[i], 0);
    _dummy.updateMatrix();
    particles.setMatrixAt(i, _dummy.matrix);
  }
  particles.instanceMatrix.needsUpdate = true;
}

/* ── Первая отрисовка ── */
syncInstances();
renderer.render(scene, camera);
window.__ready = true;

/* ── __step ── */
window.__step = function (dt) {
  for (let i = 0; i < N; i++) {
    const u1 = lcg();
    px[i] += (2 * u1 - 1) * H;
    const u2 = lcg();
    py[i] += (2 * u2 - 1) * H;
    if (px[i] < -6.0) px[i] = -6.0;
    if (px[i] >  6.0) px[i] =  6.0;
    if (py[i] < -4.0) py[i] = -4.0;
    if (py[i] >  4.0) py[i] =  4.0;
  }
  steps++;
  syncInstances();
  renderer.render(scene, camera);
  return { steps, particles: roundParticles() };
};

/* ── __probe ── */
function round4(v) { return Math.round(v * 10000) / 10000; }

function roundParticles() {
  const arr = [];
  for (let i = 0; i < N; i++) {
    arr.push({ x: round4(px[i]), y: round4(py[i]) });
  }
  return arr;
}

window.__probe = function () {
  return {
    steps: steps,
    particles: roundParticles(),
    camera: [round4(camera.position.x), round4(camera.position.y), round4(camera.position.z)],
    objects: scene.children.filter(o => o.name).map(o => o.name)
  };
};
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
