<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Галактика — спиральный диск из частиц</title>
<style>
  html, body { margin: 0; padding: 0; background: #1d1638; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ============ Детерминированный генератор (ЛЦГ) ============ */
function makeLCG(seed) {
  let s = seed >>> 0;
  return function () {
    s = (1664525 * s + 1013904223) % 4294967296;
    return s / 4294967296;
  };
}
const rand = makeLCG(800660);          // S0 = 800660, строго заданный порядок обращений
const skyRand = makeLCG(800661);       // отдельный поток только для фона

/* ============ Камера и сцена ============ */
const HALF_H = 10.0 * Math.tan(45 * Math.PI / 360);   // полувысота кадра ≈ 4.142
const R = 0.44 * HALF_H;                              // радиус диска = 0.44 полувысоты

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1638);

const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 200);
camera.position.set(0, 0, 10.0);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

/* ============ Ночное небо (плоскость с градиентом и звёздами) ============ */
function makeSkyCanvas() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 384;
  const x = c.getContext('2d');
  // мягкая фиолетовая дымка: светлее в центре, #1d1638 по краям
  x.save();
  x.translate(256, 192);
  x.scale(1, 192 / 256); // эллипс под аспектом кадра 4:3
  const g = x.createRadialGradient(0, 0, 0, 0, 0, 256);
  g.addColorStop(0.00, 'rgb(95,70,128)');
  g.addColorStop(0.45, 'rgb(62,46,96)');
  g.addColorStop(0.85, 'rgb(46,34,78)');
  g.addColorStop(1.00, 'rgb(29,22,56)');
  x.fillStyle = g;
  x.beginPath();
  x.arc(0, 0, 256, 0, Math.PI * 2);
  x.fill();
  x.restore();
  // редкие далёкие звёзды
  for (let i = 0; i < 180; i++) {
    const px = skyRand() * 512;
    const py = skyRand() * 384;
    const b = 90 + skyRand() * 150;
    const rr = 0.4 + skyRand() * 0.9;
    x.fillStyle = 'rgba(' + (Math.min(255, b + 40) | 0) + ',' +
                    (Math.min(255, b + 8) | 0) + ',' +
                    (Math.min(255, b + 30) | 0) + ',0.9)';
    x.beginPath();
    x.arc(px, py, rr, 0, Math.PI * 2);
    x.fill();
  }
  return c;
}
const skyTex = new THREE.CanvasTexture(makeSkyCanvas());
skyTex.colorSpace = THREE.SRGBColorSpace;
const sky = new THREE.Mesh(
  new THREE.PlaneGeometry(16, 12),
  new THREE.MeshBasicMaterial({ map: skyTex, transparent: false, depthWrite: false })
);
sky.position.set(0, 0, -3);
sky.renderOrder = 0;
sky.name = 'sky';
scene.add(sky);

/* ============ Тёплые свечения ядра ============ */
function makeGlowCanvas(stops, size) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) g.addColorStop(o, col);
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);
  return c;
}
const glowMats = [
  {
    name: 'nebula_glow', size: 2.9, order: 1,
    stops: [[0, 'rgba(255,170,70,0.30)'], [0.45, 'rgba(255,120,50,0.10)'], [1, 'rgba(255,100,30,0)']]
  },
  {
    name: 'core_glow', size: 0.55 * R, order: 2,
    stops: [[0, 'rgba(255,205,110,0.95)'], [0.3, 'rgba(255,170,60,0.55)'],
            [0.65, 'rgba(255,120,40,0.15)'], [1, 'rgba(255,100,30,0)']]
  }
];
for (const gm of glowMats) {
  const tex = new THREE.CanvasTexture(makeGlowCanvas(gm.stops, 256));
  tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(gm.size, gm.size),
    new THREE.MeshBasicMaterial({
      map: tex, transparent: true, blending: THREE.AdditiveBlending,
      depthTest: false, depthWrite: false
    })
  );
  m.position.set(0, 0, 0.02);
  m.renderOrder = gm.order;
  m.name = gm.name;
  scene.add(m);
}

/* ============ Частицы: зоны и материал ============ */
// Зоны: ядро (до q=0.38), средние рукава (0.38..0.70), периферия (>=0.70)
const zones = {
  core: { name: 'stars_core', size: 3.2, color: new THREE.Color('#ffbf00'), list: [] },
  arm:  { name: 'stars_arm',  size: 2.8, color: new THREE.Color('#ff0080'), list: [] },
  edge: { name: 'stars_edge', size: 2.4, color: new THREE.Color('#0cb7f0'), list: [] }
};
const TAU = Math.PI * 2;

// --- Рукава: 7000 точек, две ветви, закрученных на 1.60 оборота ---
for (let i = 0; i < 7000; i++) {
  const u = rand();
  const v = rand();
  const w = rand();
  const g = u + v + w - 1.5;
  const q = 0.14 + 0.86 * Math.pow(u, 0.62);
  const r = R * q;
  const theta = 1.60 * TAU * q + Math.PI * Math.floor(v * 2) + g * 0.50 * (1 - 0.45 * q);
  const z = (w - 0.5) * 0.10 * r * (0.4 + q);
  const zone = q < 0.38 ? zones.core : (q < 0.70 ? zones.arm : zones.edge);
  zone.list.push({ r, a: theta, z, q });
}

// --- Ядро-сгусток: 2500 тёплых точек ---
for (let i = 0; i < 2500; i++) {
  const u = rand();
  const a = TAU * u;
  const r = 0.22 * R * Math.pow(u, 0.55);
  const z = (u - 0.5) * 0.09 * R;
  zones.core.list.push({ r, a, z, q: r / R });
}

// --- Пылевое гало: 1500 точек на периферии ---
for (let i = 0; i < 1500; i++) {
  const u = rand();
  const r = R * (0.60 + 0.85 * u);
  const a = TAU * u;
  zones.edge.list.push({ r, a, z: 0, q: r / R });
}

/* ============ Собираем Points-объекты ============ */
const SPEED = 0.55; // рад/с, дифференциальное вращение
const groups = [];
for (const key of ['core', 'arm', 'edge']) {
  const z = zones[key];
  const n = z.list.length;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const a0 = new Float32Array(n);
  const radii = new Float32Array(n);
  const zz = new Float32Array(n);
  const om = new Float32Array(n);
  const ringCount = [0, 0, 0, 0];
  for (let i = 0; i < n; i++) {
    const p = z.list[i];
    a0[i] = p.a;
    radii[i] = p.r;
    zz[i] = p.z;
    om[i] = SPEED / (0.25 + p.q);
    col[i * 3] = z.color.r;
    col[i * 3 + 1] = z.color.g;
    col[i * 3 + 2] = z.color.b;
    ringCount[Math.min(3, Math.floor(p.q / 0.25))]++;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    sizeAttenuation: false,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    vertexColors: true,
    size: z.size
  }));
  pts.name = z.name;
  pts.renderOrder = 3;
  scene.add(pts);
  groups.push({ geo, pos, a0, radii, zz, om, n, rings: ringCount });
}

const rings = [0, 0, 0, 0];
for (const g of groups) for (let i = 0; i < 4; i++) rings[i] += g.rings[i];

/* ============ Время и обновление позиций ============ */
const OMEGA0 = 0.55;
let t = 0;
let spin = 0;

function updatePositions() {
  for (const g of groups) {
    const pos = g.pos;
    for (let i = 0; i < g.n; i++) {
      const th = g.a0[i] + g.om[i] * t;
      pos[i * 3] = g.radii[i] * Math.cos(th);
      pos[i * 3 + 1] = g.radii[i] * Math.sin(th);
      pos[i * 3 + 2] = g.zz[i];
    }
    g.geo.attributes.position.needsUpdate = true;
  }
}

function probe() {
  return {
    t: Math.round(t * 10000) / 10000,
    spin: Math.round(spin * 10000) / 10000,
    objects: ['sky', 'nebula_glow', 'core_glow', 'stars_core', 'stars_arm', 'stars_edge'],
    rings: rings
  };
}

window.__step = function (dt) {
  t += dt;
  spin += OMEGA0 * dt;
  updatePositions();
  renderer.render(scene, camera);
  return window.__probe();
};
window.__probe = probe;

/* ============ Первый кадр (t = 0) ============ */
updatePositions();
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
