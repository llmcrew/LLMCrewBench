<html>
<head><meta charset="utf-8"><script src='../../../_vendor/three.global.js'></script>
</head>
<body style="margin:0;overflow:hidden;background:#000">
<script type="module">
const THREE = window.THREE;

// === LCG: seed 800660 ===
let s = 800660;
function lcg() {
  s = (1664525 * s + 1013904223) % 4294967296;
  return s / 4294967296;
}

// === Constants ===
const HALF_H = 10 * Math.tan(22.5 * Math.PI / 180); // ≈ 4.142
const R = 0.44 * HALF_H; // disk radius ≈ 1.8225
const SPEED = 0.55; // рад/с

// === Scene ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1848);

const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 200);
camera.position.set(0, 0, 10.0);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

// === Generate arm points: 7000, two branches ===
const armData = [];
for (let i = 0; i < 7000; i++) {
  const u = lcg();
  const v = lcg();
  const w = lcg();
  const g = lcg() + lcg() + lcg() - 1.5;

  const q = 0.14 + 0.86 * Math.pow(u, 0.62);
  const r = R * q;
  const theta = 1.60 * 2 * Math.PI * q + Math.PI * Math.floor(v * 2) + g * 0.50 * (1 - 0.45 * q);
  const z = (w - 0.5) * 0.10 * r * (0.4 + q);

  let zone;
  if (q < 0.38) zone = 0;
  else if (q < 0.70) zone = 1;
  else zone = 2;

  armData.push({ theta0: theta, r, z, zone });
}

// === Generate core cluster: 2500 points ===
const coreData = [];
for (let i = 0; i < 2500; i++) {
  const u = lcg();
  const a = 2 * Math.PI * u;
  const r = 0.22 * R * Math.pow(u, 0.55);
  const z = (u - 0.5) * 0.09 * R;
  coreData.push({ theta0: a, r, z });
}

// === Generate dust halo: 1500 points ===
const haloData = [];
for (let i = 0; i < 1500; i++) {
  const u = lcg();
  const r = R * (0.60 + 0.85 * u);
  const a = 2 * Math.PI * u;
  haloData.push({ theta0: a, r, z: 0 });
}

// === Group by zone ===
const armZone0 = armData.filter(d => d.zone === 0);
const armZone1 = armData.filter(d => d.zone === 1);
const armZone2 = armData.filter(d => d.zone === 2);

// === stars_core: core(2500) + arm zone0, size 3.2, #ffbf00 ===
const coreCount = coreData.length + armZone0.length;
const corePos = new Float32Array(coreCount * 3);
const coreTheta = new Float32Array(coreCount);
const coreRad = new Float32Array(coreCount);
const coreZ = new Float32Array(coreCount);
{
  let idx = 0;
  for (const d of coreData) { coreTheta[idx] = d.theta0; coreRad[idx] = d.r; coreZ[idx] = d.z; idx++; }
  for (const d of armZone0) { coreTheta[idx] = d.theta0; coreRad[idx] = d.r; coreZ[idx] = d.z; idx++; }
}
const coreGeom = new THREE.BufferGeometry();
coreGeom.setAttribute('position', new THREE.BufferAttribute(corePos, 3));
const coreMat = new THREE.PointsMaterial({
  size: 3.2, sizeAttenuation: false, transparent: true,
  blending: THREE.AdditiveBlending, depthTest: false,
  color: 0xffbf00, opacity: 0.55
});
const starsCore = new THREE.Points(coreGeom, coreMat);
starsCore.name = 'stars_core';
scene.add(starsCore);

// === stars_arm: arm zone1, size 2.8, #ff0080 ===
const armCount = armZone1.length;
const armPos = new Float32Array(armCount * 3);
const armTheta = new Float32Array(armCount);
const armRad = new Float32Array(armCount);
const armZ = new Float32Array(armCount);
for (let i = 0; i < armCount; i++) { armTheta[i] = armZone1[i].theta0; armRad[i] = armZone1[i].r; armZ[i] = armZone1[i].z; }
const armGeom = new THREE.BufferGeometry();
armGeom.setAttribute('position', new THREE.BufferAttribute(armPos, 3));
const armMat = new THREE.PointsMaterial({
  size: 2.8, sizeAttenuation: false, transparent: true,
  blending: THREE.AdditiveBlending, depthTest: false,
  color: 0xff0080, opacity: 0.55
});
const starsArm = new THREE.Points(armGeom, armMat);
starsArm.name = 'stars_arm';
scene.add(starsArm);

// === stars_edge: arm zone2 + halo(1500), size 2.4, #0cb7f0 ===
const edgeCount = armZone2.length + haloData.length;
const edgePos = new Float32Array(edgeCount * 3);
const edgeTheta = new Float32Array(edgeCount);
const edgeRad = new Float32Array(edgeCount);
const edgeZ = new Float32Array(edgeCount);
{
  let idx = 0;
  for (const d of armZone2) { edgeTheta[idx] = d.theta0; edgeRad[idx] = d.r; edgeZ[idx] = d.z; idx++; }
  for (const d of haloData) { edgeTheta[idx] = d.theta0; edgeRad[idx] = d.r; edgeZ[idx] = d.z; idx++; }
}
const edgeGeom = new THREE.BufferGeometry();
edgeGeom.setAttribute('position', new THREE.BufferAttribute(edgePos, 3));
const edgeMat = new THREE.PointsMaterial({
  size: 2.4, sizeAttenuation: false, transparent: true,
  blending: THREE.AdditiveBlending, depthTest: false,
  color: 0x0cb7f0, opacity: 0.55
});
const starsEdge = new THREE.Points(edgeGeom, edgeMat);
starsEdge.name = 'stars_edge';
scene.add(starsEdge);

// === core_glow: additive radial gradient plane, size 0.55*R ===
const glowR = 0.55 * R;
const gc = document.createElement('canvas');
gc.width = 256; gc.height = 256;
const gctx = gc.getContext('2d');
const grad = gctx.createRadialGradient(128, 128, 0, 128, 128, 128);
grad.addColorStop(0.0, 'rgba(255,200,50,0.9)');
grad.addColorStop(0.2, 'rgba(255,180,30,0.6)');
grad.addColorStop(0.5, 'rgba(255,140,10,0.25)');
grad.addColorStop(0.8, 'rgba(255,100,0,0.06)');
grad.addColorStop(1.0, 'rgba(255,80,0,0)');
gctx.fillStyle = grad;
gctx.fillRect(0, 0, 256, 256);
const glowTex = new THREE.CanvasTexture(gc);
const glowGeom = new THREE.PlaneGeometry(glowR * 2, glowR * 2);
const glowMat = new THREE.MeshBasicMaterial({
  map: glowTex, transparent: true,
  blending: THREE.AdditiveBlending, depthTest: false,
  side: THREE.DoubleSide
});
const coreGlow = new THREE.Mesh(glowGeom, glowMat);
coreGlow.name = 'core_glow';
coreGlow.position.set(0, 0, 0);
scene.add(coreGlow);

// === Animation state ===
let t = 0;
let spin = 0;

function updatePositions() {
  for (let i = 0; i < coreCount; i++) {
    const th = coreTheta[i] + SPEED * t / (0.25 + coreRad[i] / R);
    corePos[i * 3]     = coreRad[i] * Math.cos(th);
    corePos[i * 3 + 1] = coreRad[i] * Math.sin(th);
    corePos[i * 3 + 2] = coreZ[i];
  }
  coreGeom.attributes.position.needsUpdate = true;

  for (let i = 0; i < armCount; i++) {
    const th = armTheta[i] + SPEED * t / (0.25 + armRad[i] / R);
    armPos[i * 3]     = armRad[i] * Math.cos(th);
    armPos[i * 3 + 1] = armRad[i] * Math.sin(th);
    armPos[i * 3 + 2] = armZ[i];
  }
  armGeom.attributes.position.needsUpdate = true;

  for (let i = 0; i < edgeCount; i++) {
    const th = edgeTheta[i] + SPEED * t / (0.25 + edgeRad[i] / R);
    edgePos[i * 3]     = edgeRad[i] * Math.cos(th);
    edgePos[i * 3 + 1] = edgeRad[i] * Math.sin(th);
    edgePos[i * 3 + 2] = edgeZ[i];
  }
  edgeGeom.attributes.position.needsUpdate = true;
}

// Initial positions at t=0
updatePositions();

// First render
renderer.render(scene, camera);
window.__ready = true;

// === API ===
window.__step = function(dt) {
  t += dt;
  spin += SPEED * dt;
  updatePositions();
  renderer.render(scene, camera);
  return window.__probe();
};

window.__probe = function() {
  const rings = [0, 0, 0, 0];
  for (let i = 0; i < coreCount; i++) {
    const q = coreRad[i] / R;
    if (q < 0.25) rings[0]++; else if (q < 0.5) rings[1]++; else if (q < 0.75) rings[2]++; else rings[3]++;
  }
  for (let i = 0; i < armCount; i++) {
    const q = armRad[i] / R;
    if (q < 0.25) rings[0]++; else if (q < 0.5) rings[1]++; else if (q < 0.75) rings[2]++; else rings[3]++;
  }
  for (let i = 0; i < edgeCount; i++) {
    const q = edgeRad[i] / R;
    if (q < 0.25) rings[0]++; else if (q < 0.5) rings[1]++; else if (q < 0.75) rings[2]++; else rings[3]++;
  }

  return {
    t: Math.round(t * 10000) / 10000,
    spin: Math.round(spin * 10000) / 10000,
    objects: scene.children.map(o => o.name).filter(n => n),
    rings: rings
  };
};
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
