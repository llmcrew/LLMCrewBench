<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Бесконечный туннель</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0612; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
const THREE = window.THREE;

const RING_COUNT = 34;
const STEP = 2.3;
const SPEED = 7.000;
const SPAN = RING_COUNT * STEP; // 34 * 2.3

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0612);
scene.fog = new THREE.Fog(0x0a0612, 8, 90);

const camera = new THREE.PerspectiveCamera(55, 800 / 600, 0.1, 200);
camera.position.set(0, 0, 8.0);
camera.lookAt(0, 0, -1);

const vertexShader = `
  varying vec2 vUv;
  varying float vDepth;
  void main() {
    // у тора uv.x идёт вдоль большого круга (по кольцу) — полосы бегут по кольцу
    vUv = uv;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vDepth = -mvPosition.z;
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const fragmentShader = `
  precision highp float;
  varying vec2 vUv;
  varying float vDepth;
  uniform float uPhase;
  uniform vec3 uTeal;
  uniform vec3 uOrange;
  uniform vec3 uFog;
  uniform vec3 uGlow;
  vec3 linearToSRGB(vec3 c) {
    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
  }
  void main() {
    // 4 цветовые полосы по кольцу, бегут по фазе
    float s = sin(vUv.x * 3.14159 * 4.0 + uPhase);
    vec3 colour = s > 0.0 ? uTeal : uOrange;

    // ближние кольца притухают — вплывают из темноты
    colour *= smoothstep(0.4, 4.0, vDepth);

    // дальние подсвечиваются светом из конца туннеля
    float far = smoothstep(40.0, 68.0, vDepth);
    colour = mix(colour, uGlow, far * 0.30);

    // туман по глубине
    float fog = 1.0 - exp(-0.046 * vDepth);
    colour = mix(colour, uFog, fog);

    gl_FragColor = vec4(linearToSRGB(colour), 1.0);
  }
`;

const torusGeo = new THREE.TorusGeometry(2.0, 0.34, 10, 48);

const rings = [];
for (let i = 0; i < RING_COUNT; i++) {
  const mat = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: {
      uPhase:  { value: 0.0 },
      uTeal:   { value: new THREE.Color(0x33d1c6) },
      uOrange: { value: new THREE.Color(0xe0733c) },
      uFog:    { value: new THREE.Color(0x0a0612) },
      uGlow:   { value: new THREE.Color(0xeaf2ff) }
    }
  });
  const m = new THREE.Mesh(torusGeo, mat);
  m.name = 'ring' + i;
  scene.add(m);
  rings.push(m);
}

// свет в конце туннеля
const light = new THREE.Mesh(
  new THREE.CircleGeometry(1.2, 48),
  new THREE.MeshBasicMaterial({ color: 0xeaf2ff, fog: false })
);
light.name = 'tunnelLight';
light.position.set(0, 0, -42.0);
light.scale.setScalar(5.0);
scene.add(light);

let t = 0;

function update() {
  for (let i = 0; i < RING_COUNT; i++) {
    const z = -72.0 + ((i * STEP + t * SPEED) % SPAN);
    const m = rings[i];
    m.position.z = z;
    const radiusMul = 1 + 0.16 * Math.sin(i * 0.7);
    const fadeMul = Math.max(1, (4 - z) / 12);
    m.scale.setScalar(radiusMul * fadeMul);
    m.material.uniforms.uPhase.value = 0.4 * t + 0.4 * i;
  }
  renderer.render(scene, camera);
}

function r4(x) { return Math.round(x * 10000) / 10000; }

window.__probe = function () {
  return {
    t: r4(t),
    objects: rings.map(m => m.name).concat([light.name]),
    speed: r4(SPEED),
    z: [0, 1, 2].map(i => r4(rings[i].position.z))
  };
};

window.__step = function (dt) {
  t += dt;
  update();
  return window.__probe();
};

update();
window.__ready = true;
</script>
</body>
</html>
