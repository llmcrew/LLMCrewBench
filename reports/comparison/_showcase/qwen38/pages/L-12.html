<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Туннель</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0612; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ---------- рендерер ----------
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

// ---------- сцена, туман, фон ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0612);
scene.fog = new THREE.Fog(0x0a0612, 8, 90);

// ---------- камера внутри туннеля ----------
const camera = new THREE.PerspectiveCamera(55, 800 / 600, 0.1, 200);
camera.position.set(0, 0, 8.0);
camera.lookAt(0, 0, -1);

// ---------- константы заворота ----------
const N = 34;
const STEP = 2.3;
const SPEED = 7.000;
const Z0 = -72.0;
const SPAN = N * STEP; // 34 * 2.3

// ---------- шейдер кольца ----------
const vert = `
varying vec2 vUv;
varying float vDepth;
void main() {
  vUv = uv;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  vDepth = -mv.z;
  gl_Position = projectionMatrix * mv;
}
`;
const frag = `
uniform float uPhase;
uniform vec3 uFog;
varying vec2 vUv;
varying float vDepth;
void main() {
  // 4 цветовые полосы по кольцу: период 2 полосы на кольцо
  float stripe = sin(vUv.x * 3.14159 * 4.0 + uPhase);
  vec3 cTeal = vec3(0.2000, 0.8196, 0.7765); // #33d1c6
  vec3 cOran = vec3(0.8784, 0.4510, 0.2353); // #e0733c
  vec3 colour = mix(cOran, cTeal, step(0.0, stripe));

  // дальние кольца подсвечиваются светом из конца туннеля
  float far = smoothstep(40.0, 68.0, vDepth);
  colour = mix(colour, vec3(0.9176, 0.9490, 1.0), far * 0.30); // #eaf2ff

  // ближние кольца притухают: вплывают из темноты
  colour *= smoothstep(0.4, 4.0, vDepth);

  // туман по глубине
  float fog = 1.0 - exp(-0.046 * vDepth);
  colour = mix(colour, uFog, fog);

  gl_FragColor = vec4(colour, 1.0);
}
`;

// ---------- кольца ----------
const ringGeo = new THREE.TorusGeometry(2.0, 0.34, 10, 48);
const fogColor = new THREE.Color(0x0a0612);
const rings = [];
for (let i = 0; i < N; i++) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uPhase: { value: 0.0 },
      uFog: { value: fogColor }
    },
    vertexShader: vert,
    fragmentShader: frag
  });
  const m = new THREE.Mesh(ringGeo, mat);
  m.name = 'ring' + i;
  scene.add(m);
  rings.push(m);
}

// ---------- свет в конце туннеля ----------
const cap = new THREE.Mesh(
  new THREE.CircleGeometry(1.2, 48),
  new THREE.MeshBasicMaterial({ color: 0xeaf2ff, fog: false })
);
cap.name = 'endcap';
cap.position.set(0, 0, -42.0);
cap.scale.set(5.0, 5.0, 5.0);
scene.add(cap);

// ---------- состояние и обновление ----------
let t = 0;

function zOf(i) {
  return Z0 + (((i * STEP + t * SPEED) % SPAN + SPAN) % SPAN);
}

function update() {
  for (let i = 0; i < N; i++) {
    const z = zOf(i);
    const r = 1 + 0.16 * Math.sin(i * 0.7); // лёгкий разброс радиуса
    const s = Math.max(1, (4 - z) / 12);    // гашение в тумане
    rings[i].position.set(0, 0, z);
    rings[i].scale.set(r * s, r * s, s);
    rings[i].material.uniforms.uPhase.value = 0.4 * t + 0.4 * i;
  }
}

// ---------- API ----------
const r4 = v => Math.round(v * 10000) / 10000;

window.__probe = function () {
  return {
    t: r4(t),
    objects: scene.children.map(o => o.name),
    speed: SPEED,
    z: [zOf(0), zOf(1), zOf(2)].map(r4)
  };
};

window.__step = function (dt) {
  t += dt;
  update();
  renderer.render(scene, camera);
  return window.__probe();
};

// ---------- первый кадр (t = 0) ----------
update();
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
