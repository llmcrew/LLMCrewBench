<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#111}
canvas{display:block}

<body>
<script type="module">
const THREE = window.THREE;

// ─── Симуляция ───
const N = 64;
const A = 0.8;
const center = 18;
const sigma = 7.0;
const c2 = 0.25;

let u = new Float64Array(N);
let u_prev = new Float64Array(N);

for (let i = 0; i < N; i++) {
  u[i] = A * Math.exp(-Math.pow((i - center) / sigma, 2));
}
u[0] = 0;
u[63] = 0;
u_prev = u.slice();

function step() {
  const next = new Float64Array(N);
  next[0] = 0;
  next[63] = 0;
  for (let i = 1; i <= 62; i++) {
    next[i] = 2 * u[i] - u_prev[i] + c2 * (u[i - 1] - 2 * u[i] + u[i + 1]);
  }
  u_prev = u;
  u = next;
}

function calcEnergy() {
  let e = 0;
  for (let i = 1; i <= 62; i++) {
    e += 0.5 * (u[i] - u_prev[i]) * (u[i] - u_prev[i])
       + 0.5 * c2 * (u[i + 1] - u[i]) * (u[i + 1] - u[i]);
  }
  return e;
}

function round4(x) {
  return Math.round(x * 10000) / 10000;
}

// ─── Сцена ───
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 500);
camera.position.set(0, 0, 60);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
dirLight.position.set(0, 20, 40);
scene.add(dirLight);

// InstancedMesh — 64 сферы
const sphereGeo = new THREE.SphereGeometry(0.55, 16, 12);
const sphereMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
const mesh = new THREE.InstancedMesh(sphereGeo, sphereMat, N);
mesh.name = 'string';
scene.add(mesh);

// Line по тем же точкам
const linePositions = new Float32Array(N * 3);
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
const lineMat = new THREE.LineBasicMaterial({ color: 0xffd27f });
const line = new THREE.Line(lineGeo, lineMat);
scene.add(line);

// Вспомогательные объекты
const dummy = new THREE.Object3D();
const colorLow = new THREE.Color(0x1d3f7a);
const colorHigh = new THREE.Color(0xffd27f);
const tmpColor = new THREE.Color();

function updateVisuals() {
  for (let i = 0; i < N; i++) {
    const x = (i - 31.5) * 0.7;
    const y = u[i] * 4.5;
    dummy.position.set(x, y, 0);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    const t = Math.abs(u[i]) / A;
    tmpColor.copy(colorLow).lerp(colorHigh, t);
    mesh.setColorAt(i, tmpColor);
    linePositions[i * 3]     = x;
    linePositions[i * 3 + 1] = y;
    linePositions[i * 3 + 2] = 0;
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  lineGeo.attributes.position.needsUpdate = true;
}

// ─── Рендерер ───
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

// Первая отрисовка
updateVisuals();
renderer.render(scene, camera);
window.__ready = true;

// ─── Публичный API ───
window.__step = function (dt) {
  step();
  return {
    samples: [round4(u[16]), round4(u[32]), round4(u[48])],
    energy: round4(calcEnergy())
  };
};

window.__probe = function () {
  updateVisuals();
  renderer.render(scene, camera);
  return {
    samples: [round4(u[16]), round4(u[32]), round4(u[48])],
    energy: round4(calcEnergy())
  };
};
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
