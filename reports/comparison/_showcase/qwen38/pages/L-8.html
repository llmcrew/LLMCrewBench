<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>aurora ribbons</title>
<style>html,body{margin:0;padding:0;background:#1d1638;overflow:hidden}canvas{display:block;width:1920px;height:1080px}</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ----- LCG: seed 53827, s = (1664525*s + 1013904223) % 4294967296 -----
let s = 53827;
function rng(){ s = (1664525 * s + 1013904223) % 4294967296; return s / 4294967296; }

// ----- renderer / camera / scene -----
const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer: true});
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, 800/600, 0.1, 200);
camera.position.set(0, 0, 10.0);
camera.lookAt(0, 0, 0);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1638); // night sky

// frame size at distance 10
const HALF_H = 10.0 * Math.tan(THREE.MathUtils.degToRad(22.5)); // ~4.142
const FRAME_H = 2 * HALF_H;
const FRAME_W = FRAME_H * (800 / 600);

// ----- shared 64x256 canvas texture: vertical color + horizontal soft fade -----
const cvs = document.createElement('canvas');
cvs.width = 64; cvs.height = 256;
const c2d = cvs.getContext('2d');
const img = c2d.createImageData(64, 256);
const TOP = [0xff, 0x33, 0xee]; // top    #ff33ee
const MID = [0x21, 0x97, 0xdb]; // middle #2197db
const BOT = [0x18, 0xf0, 0x51]; // bottom #18f051
function mixc(a, b, k){ return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k]; }
for (let y = 0; y < 256; y++){
  const ty = y / 255;                       // 0 = top of canvas
  const col = ty <= 0.5 ? mixc(TOP, MID, ty * 2) : mixc(MID, BOT, (ty - 0.5) * 2);
  for (let x = 0; x < 64; x++){
    const nx = x / 63;                      // 0..1 across width
    const ax = Math.pow(Math.sin(Math.PI * nx), 1.2); // opaque center, soft sides
    const av = 1;                                     // color carries the vertical profile
    const a = Math.round(255 * ax * av);
    const i = (y * 64 + x) * 4;
    img.data[i]   = col[0];
    img.data[i+1] = col[1];
    img.data[i+2] = col[2];
    img.data[i+3] = a;
  }
}
c2d.putImageData(img, 0, 0);
const tex = new THREE.CanvasTexture(cvs);
tex.magFilter = THREE.LinearFilter;
tex.minFilter = THREE.LinearFilter;
tex.generateMipmaps = false;
tex.colorSpace = THREE.SRGBColorSpace;

// ----- 28 ribbons: width 0.030..0.055, height 0.30..0.38 -----
const geo = new THREE.PlaneGeometry(1, 1);
const N = 28;
const ribbons = [];
for (let i = 1; i <= N; i++){
  const u1 = rng(); // w
  const u2 = rng(); // h
  const u3 = rng(); // x
  const u4 = rng(); // y
  const u5 = rng(); // op
  const u6 = rng(); // ph
  const wf = 0.030 + 0.055 * u1;
  const hf = 0.30 + 0.38 * u2;
  const xf = (i + 0.5 + 0.6 * (u3 - 0.5)) / N - 0.5;
  const yf = 0.02 + 0.26 * u4;
  const op = 0.16 + 0.24 * u5;
  const ph = 0.4 * u6;
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true,
    blending: THREE.AdditiveBlending, depthTest: false
  });
  mat.opacity = op;
  const m = new THREE.Mesh(geo, mat);
  m.name = 'ribbon_' + i;
  m.position.set(xf * FRAME_W, yf * FRAME_H, 0);
  m.renderOrder = i;
  scene.add(m);
  ribbons.push({ mesh: m, xf, ph, x0: xf * FRAME_W, sx: wf * FRAME_W, sy: hf * FRAME_H });
}
function layoutScale(){
  for (const r of ribbons){
    r.mesh.scale.set(r.sx, r.sy * (1 + 0.15 * Math.sin(2 * Math.PI * 0.35 * 0.7 * t + r.ph)), 1);
  }
}
function layoutWave(){
  for (const r of ribbons){
    r.mesh.position.x = r.x0 + 0.05 * Math.sin(2 * Math.PI * 0.35 * t - 3.0 * r.xf + r.ph);
  }
}

// ----- time / animation (only via window.__step) -----
const TAU = Math.PI * 2;
let t = 0;
function refresh(){
  layoutWave();
  layoutScale();
  renderer.render(scene, camera);
}
refresh();
window.__ready = true;

window.__step = function(dt){
  t += dt;
  refresh();
  return window.__probe();
};
window.__probe = function(){
  return {
    t: Math.round(t * 10000) / 10000,
    objects: ribbons.map(r => r.mesh.name),
    wave: Math.round((TAU * 0.35 * t) * 10000) / 10000
  };
};
</script>
</body>
</html>
