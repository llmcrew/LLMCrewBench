<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{margin:0;background:#000;overflow:hidden}
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// LCG: seed 53827, step s=(1664525*s+1013904223)%4294967296, u=s/4294967296
let s = 53827;
function lcg(){
  s = (1664525 * s + 1013904223) % 4294967296;
  return s / 4294967296;
}

// Renderer
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

// Camera: PerspectiveCamera(45, 800/600, 0.1, 200) at (0,0,10) looking at origin
const camera = new THREE.PerspectiveCamera(45, 800/600, 0.1, 200);
camera.position.set(0, 0, 10.0);
camera.lookAt(0, 0, 0);

// Scene with night sky background #1d1638
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1638);

// Frame dimensions in world units
const halfH = Math.tan(22.5 * Math.PI / 180) * 10; // ≈4.142
const frameH = 2 * halfH;
const frameW = frameH * (800 / 600);

// Shared canvas texture 64×256
const cvs = document.createElement('canvas');
cvs.width = 64;
cvs.height = 256;
const c2d = cvs.getContext('2d');

// Vertical gradient: top #ff33ee, middle #2197db, bottom #18f051
const vg = c2d.createLinearGradient(0, 0, 0, 256);
vg.addColorStop(0, '#ff33ee');
vg.addColorStop(0.5, '#2197db');
vg.addColorStop(1, '#18f051');
c2d.fillStyle = vg;
c2d.fillRect(0, 0, 64, 256);

// Horizontal soft fade: opaque centre, transparent edges
const img = c2d.getImageData(0, 0, 64, 256);
for (let px = 0; px < 64; px++) {
  const t = px / 63;
  const a = 4 * t * (1 - t); // parabolic 0→1→0
  for (let py = 0; py < 256; py++) {
    const idx = (py * 64 + px) * 4;
    img.data[idx + 3] = Math.round(a * 255);
  }
}
c2d.putImageData(img, 0, 0);

const tex = new THREE.CanvasTexture(cvs);
tex.needsUpdate = true;

// 28 ribbons
const ribbons = [];
const rdata = [];

for (let i = 0; i < 28; i++) {
  const u1 = lcg();
  const u2 = lcg();
  const u3 = lcg();
  const u4 = lcg();
  const u5 = lcg();
  const u6 = lcg();

  const w  = 0.030 + 0.055 * u1;
  const h  = 0.30  + 0.38  * u2;
  const x  = (i + 0.5 + 0.6 * (u3 - 0.5)) / 28 - 0.5;
  const y  = 0.02  + 0.26  * u4;
  const op = 0.16  + 0.24  * u5;
  const ph = 0.4   * u6;

  const ww = w * frameW;
  const wh = h * frameH;
  const wx = x * frameW;
  const wy = y * frameH;

  const geo = new THREE.PlaneGeometry(1, 1);
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: false
  });
  mat.opacity = op;

  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'ribbon_' + (i + 1);
  mesh.scale.set(ww, wh, 1);
  mesh.position.set(wx, wy, 0);

  scene.add(mesh);
  ribbons.push(mesh);
  rdata.push({ x, ph, ww, wh, wx, wy });
}

// Animation state
let t = 0;

function step(dt) {
  t += dt;
  for (let i = 0; i < 28; i++) {
    const d = rdata[i];
    const dx = 0.05 * Math.sin(2 * Math.PI * 0.35 * t - 3.0 * d.x + d.ph);
    const hScale = 1 + 0.15 * Math.sin(2 * Math.PI * 0.35 * 0.7 * t + d.ph);
    ribbons[i].position.x = d.wx + dx * frameW;
    ribbons[i].scale.y = d.wh * hScale;
  }
  renderer.render(scene, camera);
  return probe();
}

function probe() {
  const objects = scene.children.filter(c => c.name).map(c => c.name);
  const wave = 2 * Math.PI * 0.35 * t;
  return {
    t: Math.round(t * 10000) / 10000,
    objects,
    wave: Math.round(wave * 10000) / 10000
  };
}

// Initial render at t = 0
renderer.render(scene, camera);
window.__ready = true;
window.__step = step;
window.__probe = probe;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
