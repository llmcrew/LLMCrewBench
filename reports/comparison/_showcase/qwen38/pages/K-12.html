<script type="module">
const THREE = window.THREE;

const N = 32;
const SIZE = N * N;

// --- Temperature state ---
const T = new Float64Array(SIZE);
T[8 * N + 8] = 1000;

// --- Scene ---
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 500);
camera.position.set(0.0, 40.0, 40.0);
camera.lookAt(0, 0, 0);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
dirLight.position.set(12.0, 40.0, 16.0);
scene.add(dirLight);

// --- InstancedMesh plate ---
const geo = new THREE.BoxGeometry(0.92, 1, 0.92);
const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, metalness: 0.1 });
const plate = new THREE.InstancedMesh(geo, mat, SIZE);
plate.name = 'plate';
scene.add(plate);

// Pre-allocate instance color buffer
const colorArray = new Float32Array(SIZE * 3);
plate.instanceColor = new THREE.InstancedBufferAttribute(colorArray, 3);

const cLow  = new THREE.Color(0x14306b);
const cHigh = new THREE.Color(0xff5a1e);
const tmpColor = new THREE.Color();
const dummy = new THREE.Object3D();

function paint() {
  let maxT = 0;
  for (let k = 0; k < SIZE; k++) {
    if (T[k] > maxT) maxT = T[k];
  }
  if (maxT === 0) maxT = 1;

  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const idx = i * N + j;
      const t = T[idx] / maxT;
      const h = 0.05 + 3.0 * t;

      dummy.position.set(j - 15.5, h * 0.5, i - 15.5);
      dummy.scale.set(1, h, 1);
      dummy.updateMatrix();
      plate.setMatrixAt(idx, dummy.matrix);

      tmpColor.copy(cLow).lerp(cHigh, t);
      plate.setColorAt(idx, tmpColor);
    }
  }
  plate.instanceMatrix.needsUpdate = true;
  plate.instanceColor.needsUpdate = true;
}

// --- Renderer ---
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

// --- Simulation step (in-place, Gauss-Seidel order) ---
function step(dt) {
  const a = 0.2;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const idx = i * N + j;
      const c  = T[idx];
      const up = (i > 0)   ? T[(i - 1) * N + j] : c;
      const dn = (i < N-1) ? T[(i + 1) * N + j] : c;
      const lf = (j > 0)   ? T[i * N + (j - 1)] : c;
      const rt = (j < N-1) ? T[i * N + (j + 1)] : c;
      T[idx] = c + a * (up + dn + lf + rt - 4.0 * c);
    }
  }
}

// --- Probe (paint + render + return state) ---
function probe() {
  paint();
  renderer.render(scene, camera);

  let sum = 0;
  let maxT = 0;
  for (let k = 0; k < SIZE; k++) {
    sum += T[k];
    if (T[k] > maxT) maxT = T[k];
  }
  const mean = sum / SIZE;

  const r4 = (v) => Math.round(v * 10000) / 10000;

  return {
    grid: 32,
    mean: r4(mean),
    max: r4(maxT),
    samples: [
      r4(T[8 * N + 8]),
      r4(T[16 * N + 16]),
      r4(T[24 * N + 8])
    ]
  };
}

// --- Initial render ---
paint();
renderer.render(scene, camera);

// --- Public API ---
window.__step = function (dt) {
  step(dt);
  // Return state info without rendering
  let sum = 0, maxT = 0;
  for (let k = 0; k < SIZE; k++) {
    sum += T[k];
    if (T[k] > maxT) maxT = T[k];
  }
  const r4 = (v) => Math.round(v * 10000) / 10000;
  return {
    grid: 32,
    mean: r4(sum / SIZE),
    max: r4(maxT),
    samples: [
      r4(T[8 * N + 8]),
      r4(T[16 * N + 16]),
      r4(T[24 * N + 8])
    ]
  };
};

window.__probe = probe;
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
