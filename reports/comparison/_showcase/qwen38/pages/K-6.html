<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Свободное вращение твёрдого тела</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
  }
  canvas {
    display: block;
  }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

const I1 = 0.147;
const I2 = 0.591;
const I3 = 0.6313;

let w1 = 3.69;
let w2 = 0.36;
let w3 = 0.28;

let steps = 0;
let t = 0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
camera.position.set(0.0, 2.4, 7.5);
camera.lookAt(0.0, 1.8, 0.0);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
renderer.domElement.style.width = '800px';
renderer.domElement.style.height = '600px';
document.body.appendChild(renderer.domElement);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x2b3a4a })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, 0);
ground.name = 'ground';
scene.add(ground);

const body = new THREE.Mesh(
  new THREE.BoxGeometry(2.54, 1.06, 0.8),
  new THREE.MeshStandardMaterial({ color: 0xd97a3a })
);
body.position.set(0, 1.8, 0);
body.name = 'body';
scene.add(body);

const marker = new THREE.Mesh(
  new THREE.SphereGeometry(0.14, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0x9fd8ff })
);
marker.position.set(1.39, 0, 0);
body.add(marker);

const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);

const directional = new THREE.DirectionalLight(0xffffff, 2.0);
directional.position.set(5.0, 9.0, 8.0);
scene.add(directional);

const round4 = (x) => {
  if (!Number.isFinite(x)) return 0;
  const r = Number(x.toFixed(4));
  return Object.is(r, -0) ? 0 : r;
};

const getObjects = () => {
  const names = [];
  scene.traverse((obj) => {
    if (obj.name) names.push(obj.name);
  });
  return names;
};

const probe = () => ({
  steps: steps,
  t: round4(t),
  objects: getObjects(),
  camera: [
    round4(camera.position.x),
    round4(camera.position.y),
    round4(camera.position.z)
  ],
  omega: [round4(w1), round4(w2), round4(w3)],
  inertia: [round4(I1), round4(I2), round4(I3)]
});

const axis = new THREE.Vector3();
const deltaQ = new THREE.Quaternion();

const step = (dt) => {
  if (typeof dt !== 'number' || !Number.isFinite(dt)) {
    return probe();
  }

  steps += 1;
  t += dt;

  w1 += ((I2 - I3) / I1) * w2 * w3 * dt;
  w2 += ((I3 - I1) / I2) * w3 * w1 * dt;
  w3 += ((I1 - I2) / I3) * w1 * w2 * dt;

  const mag = Math.sqrt(w1 * w1 + w2 * w2 + w3 * w3);
  const angle = mag * dt;

  if (mag > 0 && angle !== 0) {
    axis.set(w1 / mag, w2 / mag, w3 / mag);
    deltaQ.setFromAxisAngle(axis, angle);
    body.quaternion.multiply(deltaQ);
    body.quaternion.normalize();
  }

  renderer.render(scene, camera);
  return probe();
};

window.__step = step;
window.__probe = probe;

renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
