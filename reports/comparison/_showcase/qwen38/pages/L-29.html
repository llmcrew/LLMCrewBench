<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Орбита покидает Землю</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ---------- детерминированный LCG ---------- */
let lcg = 364651;
function rnd() {
  lcg = (Math.imul(lcg, 1103515245) + 12345) >>> 0;
  return lcg / 2147483648;
}
function rndUnitDir(out) {
  const u = rnd() * 2 - 1;
  const ph = rnd() * Math.PI * 2;
  const s = Math.sqrt(Math.max(0, 1 - u * u));
  out.set(s * Math.cos(ph), u, s * Math.sin(ph));
  return out;
}

/* ---------- рендерер / сцена / камера ---------- */
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);

const camera = new THREE.PerspectiveCamera(16, 1920 / 1080, 0.02, 600);
const camStart = new THREE.Vector3(0.26, 0.25, 2.2);
const camEnd   = new THREE.Vector3(-1.30, 0.42, 14);
const CAM_T = 5.66;
const STATION_BASE_Z = 3.6;

/* ---------- свет ---------- */
scene.add(new THREE.AmbientLight(0x2a3038, 2.2));
const sunWreck = new THREE.DirectionalLight(0xff8a4c, 0.45);
sunWreck.position.set(-2.6, 2.2, -34);
scene.add(sunWreck);
const moonLight = new THREE.PointLight(0xff8a4c, 300, 0, 2);
moonLight.position.set(-2.6, 2.2, -34);
scene.add(moonLight);

/* ---------- canvas-текстуры свечения ---------- */
function radialTex(stops) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  for (const s of stops) gr.addColorStop(s[0], s[1]);
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const texFlare  = radialTex([
  [0.00, 'rgba(255,152,100,1)'],
  [0.60, 'rgba(255,138,76,0.97)'],
  [0.85, 'rgba(255,138,76,0.45)'],
  [1.00, 'rgba(110,44,20,0)']
]);
const texRing = radialTex([
  [0.00, 'rgba(94,159,224,0)'],
  [0.86, 'rgba(94,159,224,0)'],
  [0.90, 'rgba(94,159,224,0.45)'],
  [0.945, 'rgba(94,159,224,0.92)'],
  [0.985, 'rgba(94,159,224,0.35)'],
  [1.00, 'rgba(94,159,224,0)']
]);
const texEngine = radialTex([
  [0.00, 'rgba(232,250,255,1)'],
  [0.30, 'rgba(143,216,255,0.98)'],
  [0.65, 'rgba(143,216,255,0.40)'],
  [1.00, 'rgba(143,216,255,0)']
]);

/* ---------- звезды: 2600 ---------- */
{
  const N = 2600;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const d = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    const r = 140 + 240 * rnd();
    rndUnitDir(d).multiplyScalar(r);
    pos[i*3] = d.x; pos[i*3+1] = d.y; pos[i*3+2] = d.z;
    const b = 0.55 + 0.45 * rnd();
    const k = rnd();
    let cr = 1, cg = 1, cb = 1;
    if (k < 0.10)      { cr = 1;    cg = 0.85; cb = 0.70; }
    else if (k < 0.22) { cr = 0.78; cg = 0.87; cb = 1;    }
    col[i*3] = cr*b; col[i*3+1] = cg*b; col[i*3+2] = cb*b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({
    size: 1.7, sizeAttenuation: false, vertexColors: true,
    transparent: false, depthWrite: false
  }));
  stars.name = 'stars';
  scene.add(stars);
}

/* ---------- Земля: повреждённая, разломы ---------- */
const EARTH_POS = new THREE.Vector3(0.4, -2.6, -22);
const impacts = [];
for (let i = 0; i < 5; i++) impacts.push(rndUnitDir(new THREE.Vector3()));

const earthUniforms = {
  uTime:  { value: 0 },
  uCrack: { value: 0.001 },
  uImp:   { value: impacts }
};
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(3.6, 96, 64),
  new THREE.ShaderMaterial({
    uniforms: earthUniforms,
    vertexShader: `
      varying vec3 vObj;
      void main() {
        vObj = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform float uTime;
      uniform float uCrack;
      uniform vec3  uImp[5];
      varying vec3  vObj;

      float hash(vec3 p) {
        p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
        p *= 17.0;
        return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
      }
      float vnoise(vec3 x) {
        vec3 i = floor(x);
        vec3 f = fract(x);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(mix(hash(i),                        hash(i + vec3(1,0,0)), f.x),
              mix(hash(i + vec3(0,1,0)),          hash(i + vec3(1,1,0)), f.x), f.y),
          mix(mix(hash(i + vec3(0,0,1)),          hash(i + vec3(1,0,1)), f.x),
              mix(hash(i + vec3(0,1,1)),          hash(i + vec3(1,1,1)), f.x), f.y),
          f.z);
      }
      float fbm(vec3 p) {
        float a = 0.5, s = 0.0;
        for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.13 + 11.7; a *= 0.5; }
        return s;
      }
      void main() {
        vec3 p = normalize(vObj);
        float tm = uTime;
        float n1 = fbm(p * 2.6 + vec3(0.0, tm * 0.012, 0.0));
        float n2 = fbm(p * 5.2 + 13.7);

        /* сеть разломов — яркие гребни */
        float ca = 1.0 - smoothstep(0.0, 0.20, abs(fbm(p * 4.2 + 3.1) - 0.5) * 1.6);
        float cb = 1.0 - smoothstep(0.0, 0.14, abs(fbm(p * 8.5 + 9.4) - 0.5) * 1.8);
        float cracks = max(ca * 0.9, cb * 0.75);

        /* следы ударов */
        float imp = 0.0;
        for (int i = 0; i < 5; i++) {
          float d = acos(clamp(dot(p, normalize(uImp[i])), -1.0, 1.0));
          imp += smoothstep(0.32, 0.0, d) * 0.95;
        }

        /* пепельные штормы — движущиеся седые вихри */
        float storm = smoothstep(0.60, 0.92, fbm(p * 6.5 + vec3(tm * 0.06, 0.0, -tm * 0.05)));

        /* тёмные базальтовые жилы — трещины коры */
        float ridf = smoothstep(0.5, 0.0, abs(fbm(p * 7.5 + 21.0) - 0.5) * 2.4);

        vec3 flame = vec3(1.0, 0.541, 0.298);           /* #ff8a4c */
        vec3 base  = flame * (0.88 + 0.20 * n1);         /* раскалённая пепельная кора */
        base = mix(base, vec3(0.40, 0.37, 0.35), storm * 0.35); /* пепел и шторма */
        base *= 1.0 - 0.32 * ridf * (1.0 - 0.5 * storm);
        base += n2 * 0.10 * flame;

        float flick = uCrack * (0.80 + 0.20 * sin(tm * 2.6 + n2 * 18.0));
        vec3 col = base
          + cracks * flick * flame * 0.40
          + imp * (0.5 + 0.5 * flick) * flame * 0.9;

        /* держим тон в семействе #ff8a4c: без выбивания в белый */
        col.r = min(col.r, 1.000);
        col.g = min(col.g, 0.700);
        col.b = min(col.b, 0.440);

        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
earth.name = 'earth';
earth.position.copy(EARTH_POS);
scene.add(earth);

/* ---------- атмосфера: тусклый ореол #5e9fe0 ---------- */
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(4.72, 96, 64),
  new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexShader: `
      varying vec3 vN; varying vec3 vW;
      void main() {
        vN = normalize(mat3(modelMatrix) * normal);
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform float uTime;
      varying vec3 vN; varying vec3 vW;
      void main() {
        vec3 V = normalize(cameraPosition - vW);
        float f = pow(1.0 - abs(dot(normalize(vN), V)), 2.4);
        float dim = 0.78 + 0.10 * sin(uTime * 0.7);
        vec3 c = vec3(0.369, 0.624, 0.878);               /* #5e9fe0 */
        gl_FragColor = vec4(c * f * 1.7 * dim, 1.0);
      }`
  })
);
atmosphere.name = 'atmosphere';
atmosphere.position.copy(EARTH_POS);
atmosphere.renderOrder = 1;
scene.add(atmosphere);

/* плотное синее кольцо на кромке атмосферы */
const atmoRing = new THREE.Sprite(new THREE.SpriteMaterial({
  map: texRing, color: 0xffffff,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
}));
atmoRing.name = 'atmo_ring';
atmoRing.scale.set(10.4, 10.4, 1);
atmoRing.position.copy(EARTH_POS);
atmoRing.renderOrder = 2;
scene.add(atmoRing);

/* ---------- разрушенная Луна ---------- */
const moonBroken = new THREE.Mesh(
  new THREE.SphereGeometry(0.9, 48, 32),
  new THREE.MeshStandardMaterial({ color: 0x9a97a8, roughness: 0.95, metalness: 0.05 })
);
moonBroken.name = 'moon_broken';
moonBroken.position.set(-2.6, 2.2, -34);

const moonCutout = new THREE.Mesh(
  new THREE.SphereGeometry(0.62, 40, 28),
  new THREE.MeshBasicMaterial({ color: 0x0d0b12 })
);
moonCutout.name = 'moon_cutout';
moonCutout.position.set(-0.28, 0.32, 0.72);
moonBroken.add(moonCutout);

const moonEmber = new THREE.Mesh(
  new THREE.SphereGeometry(0.34, 24, 16),
  new THREE.MeshBasicMaterial({ color: 0xff8a4c })
);
moonEmber.name = 'moon_ember';
moonEmber.position.set(-0.36, 0.42, 0.92);
moonBroken.add(moonEmber);

const cataclysmGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: texFlare, color: 0xffffff,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
}));
cataclysmGlow.name = 'cataclysm_glow';
cataclysmGlow.scale.set(20.5, 20.5, 1);
cataclysmGlow.position.copy(moonBroken.position);
cataclysmGlow.renderOrder = 4;
scene.add(cataclysmGlow);

const moonCoreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: texFlare, color: 0xff9a60, opacity: 0.55,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
}));
moonCoreGlow.name = 'moon_core_glow';
moonCoreGlow.scale.set(2.8, 2.8, 1);
moonCoreGlow.position.copy(moonBroken.position);
moonCoreGlow.renderOrder = 5;
scene.add(moonCoreGlow);
scene.add(moonBroken);

/* ---------- станция ---------- */
const station = new THREE.Group();
station.name = 'station';
station.position.set(0, 0.2, 3.6);

const hullMat = new THREE.MeshStandardMaterial({ color: 0xa9b2c0, metalness: 0.6, roughness: 0.5 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x69727f, metalness: 0.55,  roughness: 0.55 });
const panelMat = new THREE.MeshStandardMaterial({
  color: 0x16324f, metalness: 0.7, roughness: 0.4,
  emissive: 0x0a1a2c, emissiveIntensity: 1.0
});

const hull = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.085, 0.40, 14).rotateX(Math.PI / 2), hullMat);
hull.name = 'hull';
hull.position.z = -0.02;
station.add(hull);

const ring = new THREE.Mesh(new THREE.TorusGeometry(0.125, 0.017, 10, 40), darkMat);
ring.name = 'habitat_ring';
ring.position.z = -0.10;
station.add(ring);

const panelL = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.006, 0.095), panelMat);
const panelR = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.006, 0.095), panelMat);
panelL.name = 'panel_left';  panelL.position.set(-0.185, 0, 0.05);
panelR.name = 'panel_right'; panelR.position.set( 0.185, 0, 0.05);
station.add(panelL, panelR);

const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.09, 6), darkMat);
mast.name = 'mast';
mast.position.set(0, 0.115, -0.16);
station.add(mast);

const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.085, 0.10, 14).rotateX(Math.PI / 2), darkMat);
nozzle.name = 'nozzle';
nozzle.position.z = 0.165;
station.add(nozzle);

/* три пятна engine_glow в корме */
const engineGlows = [];
const engineSpots = [
  [0, 0.048, 0.235],
  [-0.044, -0.028, 0.235],
  [0.044, -0.028, 0.235]
];
for (let i = 0; i < 3; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: texEngine, color: 0x8fd8ff,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  s.name = 'engine_glow';
  s.scale.set(0.24, 0.24, 1);
  s.position.set(engineSpots[i][0], engineSpots[i][1], engineSpots[i][2]);
  s.renderOrder = 3;
  station.add(s);
  engineGlows.push(s);
}
const plume = new THREE.Sprite(new THREE.SpriteMaterial({
  map: texEngine, color: 0x8fd8ff, opacity: 0.5,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
}));
plume.name = 'engine_plume';
plume.scale.set(0.20, 0.68, 1);
plume.position.z = 0.45;
plume.renderOrder = 2;
station.add(plume);

const engineLight = new THREE.PointLight(0x8fd8ff, 3.5, 6, 2);
engineLight.name = 'engine_light';
engineLight.position.set(0, 0, 0.32);
station.add(engineLight);

scene.add(station);

/* ---------- кольцо космической пыли вокруг станции: 140 точек ---------- */
const dustRing = new THREE.Group();
dustRing.name = 'dust_ring';
{
  const N = 140;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const base = new THREE.Color(0xc8d4e4);
  const cyan = new THREE.Color(0x8fd8ff);
  const tmp = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const th = rnd() * Math.PI * 2;
    const rr = 0.55 + 3.1 * Math.pow(rnd(), 0.8);
    pos[i*3]   = Math.cos(th) * rr;
    pos[i*3+1] = Math.sin(th) * rr * 0.42 + (rnd() - 0.5) * 0.3;
    pos[i*3+2] = (rnd() - 0.5) * 1.1;
    tmp.copy(base).lerp(cyan, rnd() < 0.35 ? 0.4 + 0.5 * rnd() : 0);
    const b = 0.5 + 0.5 * rnd();
    col[i*3] = tmp.r*b; col[i*3+1] = tmp.g*b; col[i*3+2] = tmp.b*b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({
    size: 1.9, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  pts.name = 'dust_points';
  dustRing.add(pts);
}
station.add(dustRing);

/* ---------- пояс обломков между станцией и Землёй: 60 точек ---------- */
const debrisBelt = new THREE.Group();
debrisBelt.name = 'debris_belt';
{
  const N = 60;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const base = new THREE.Color(0x9aa0ac);
  for (let i = 0; i < N; i++) {
    pos[i*3]   = (rnd() * 2 - 1) * 4.2;
    pos[i*3+1] = 0.8 + (rnd() * 2 - 1) * 3.0;
    pos[i*3+2] = 2.5 - 20 * rnd();
    const b = 0.35 + 0.5 * rnd();
    col[i*3] = base.r*b; col[i*3+1] = base.g*b; col[i*3+2] = base.b*b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({
    size: 2.1, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: 0.85, depthWrite: false
  }));
  pts.name = 'debris_points';
  debrisBelt.add(pts);
}
scene.add(debrisBelt);

/* ---------- пепловые облака в глубине космоса ---------- */
function makeEmberTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0.00, 'rgba(255,158,100,0.97)');
  gr.addColorStop(0.55, 'rgba(255,138,76,0.90)');
  gr.addColorStop(0.80, 'rgba(215,105,58,0.48)');
  gr.addColorStop(1.00, 'rgba(120,52,26,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 260; i++) {
    const x = rnd() * 256, y = rnd() * 256;
    const r = 2 + 10 * rnd();
    const a = 0.03 + 0.07 * rnd();
    g.fillStyle = rnd() < 0.5
      ? 'rgba(255,180,130,' + a.toFixed(3) + ')'
      : 'rgba(110,55,28,' + a.toFixed(3) + ')';
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const emberTex = makeEmberTex();
/* позиции в ndc относительно финального кадра — за ними остаюсь */
const hazeSpots = [
  { nx:  0.68, ny: 0.60, dist: 92, scale: 17.5 },   /* правее, высоко */
  { nx:  0.55, ny: -0.72, dist: 104, scale: 17.5 }  /* правый нижний угол */
];
const hazeGroup = new THREE.Group();
hazeGroup.name = 'ash_field';
{
  const camTmp = new THREE.PerspectiveCamera(16, 1920 / 1080, 0.02, 600);
  camTmp.position.copy(camEnd);
  camTmp.lookAt(new THREE.Vector3(0, 0.2, STATION_BASE_Z + 0.05 * CAM_T));
  camTmp.updateMatrixWorld(true);
  for (const h of hazeSpots) {
    const v = new THREE.Vector3(h.nx, h.ny, 0.5).unproject(camTmp);
    const dir = v.sub(camTmp.position).normalize();
    const pos = camTmp.position.clone().add(dir.multiplyScalar(h.dist));
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: emberTex, color: 0xffffff, opacity: 1.0,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    s.scale.set(h.scale, h.scale, 1);
    s.position.copy(pos);
    s.renderOrder = 3;
    hazeGroup.add(s);
  }
}
scene.add(hazeGroup);const NAMES = [];
(function collect(o) {
  if (o.name) NAMES.push(o.name);
  for (const c of o.children) collect(c);
})(scene);

/* ---------- анимация ---------- */
let t = 0;
const lookTarget = new THREE.Vector3();

function applyState() {
  /* станция медленно удаляется от Земли */
  station.position.z = STATION_BASE_Z + 0.05 * t;
  station.position.y = 0.2 + 0.045 * Math.sin(t * 0.5);
  station.rotation.y = t * 0.16;
  station.rotation.x = 0.05 * Math.sin(t * 0.31 + 1.4);

  /* сопло: мерцание двигателей */
  for (let i = 0; i < engineGlows.length; i++) {
    engineGlows[i].material.opacity = 0.85 + 0.15 * Math.sin(t * 8.0 + i * 2.1);
    const s = 0.24 + 0.015 * Math.sin(t * 11.0 + i * 1.7);
    engineGlows[i].scale.set(s, s, 1);
  }
  engineLight.intensity = 3.2 + 1.0 * Math.sin(t * 9.0);

  /* пыль: вращается и мерцает огнями станции */
  dustRing.rotation.z = t * 0.32;
  dustRing.children[0].material.opacity = 0.75 + 0.2 * Math.sin(t * 2.2);

  /* обломки: медленное вращение */
  debrisBelt.rotation.y = t * 0.035;

  /* Земля: разломы включаются, штормы ползут */
  earthUniforms.uTime.value = t;
  earthUniforms.uCrack.value = Math.min(1, t / 5.0) * (0.9 + 0.1 * Math.sin(t * 1.3));
  atmosphere.material.uniforms.uTime.value = t;

  /* флёр от разрушенной Луны */
  cataclysmGlow.material.opacity = 0.92 + 0.08 * Math.sin(t * 0.9);
  moonCoreGlow.material.opacity  = 0.40 + 0.08 * Math.sin(t * 1.7 + 0.6);
  const em = 1 + 0.08 * Math.sin(t * 2.3);
  moonEmber.scale.set(em, em, em);

  /* камера: линейный отъезд от станции, глядя на неё */
  const u = Math.min(1, t / CAM_T);
  camera.position.lerpVectors(camStart, camEnd, u);
  lookTarget.copy(station.position);
  camera.lookAt(lookTarget);
}

function render() {
  renderer.render(scene, camera);
}

function step(dt) {
  t += dt;
  applyState();
  render();
  return probe();
}

function probe() {
  const d = station.position.distanceTo(earth.position);
  const r4 = (v) => Math.round(v * 10000) / 10000;
  return {
    t: r4(t),
    objects: NAMES.slice(),
    camera: [r4(camera.position.x), r4(camera.position.y), r4(camera.position.z)],
    distance: r4(d)
  };
}

/* ---------- старт: первый кадр — начало сцены ---------- */
applyState();
render();
window.__step = step;
window.__probe = probe;
window.__ready = true;
</script>
</body>
</html>
