<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Орбиты</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #c { width: 800px; height: 600px; display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const THREE = window.THREE;

// ---------- константы ----------
const FULL_UNIT  = 3.314;          // высота кадра в единицах сцены (на плоскости сцены)
const HALF_UNIT  = FULL_UNIT / 2;  // 1.657: 1 "доля высоты кадра" = HALF_UNIT в мировых координатах
const TRAIL_N    = 60;             // спрайтов в хвосте
const TRAIL_DT   = 0.0167;         // шаг по времени между точками хвоста, с
const TAU        = Math.PI * 2;

const SPHERES = [
  { a: 0.603, inc: 0.765, t0: 2.567, T: 5.76, color: 0xff4d6d },
  { a: 0.784, inc: 0.780, t0: 5.254, T: 8.40, color: 0xffd166 },
  { a: 0.668, inc: 0.754, t0: 2.690, T: 5.09, color: 0x4dd0e1 },
  { a: 0.691, inc: 0.620, t0: 6.163, T: 8.27, color: 0x9b6dff },
  { a: 0.321, inc: 0.520, t0: 3.844, T: 6.70, color: 0xff4d6d },
  { a: 0.507, inc: 0.688, t0: 3.682, T: 5.89, color: 0xffd166 },
];

// ---------- renderer / сцена / камера ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080f22);

const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 100);
camera.position.set(0, 0, 4.0);
camera.lookAt(0, 0, 0);

// ---------- детерминированные текстуры ----------
function radialTex(size, stops) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, c] of stops) g.addColorStop(o, c);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// мягкое светящееся пятно (для хвостов, свечения сфер и ореола центра)
const glowTex = radialTex(128, [
  [0.0, 'rgba(255,255,255,1)'],
  [0.25, 'rgba(255,255,255,0.55)'],
  [0.6, 'rgba(255,255,255,0.12)'],
  [1.0, 'rgba(255,255,255,0)'],
]);

// диск центра: радиальный градиент #ffe9a8 -> фон #080f22
const centerTex = radialTex(512, [
  [0.00, '#fff6d8'],
  [0.10, '#ffe9a8'],
  [0.38, '#e8b45e'],
  [0.72, '#28304a'],
  [1.00, '#080f22'],
]);

// ---------- геометрия орбит ----------
const theta = (t, s) => s.t0 + (TAU * t) / s.T;

function orbitPoint(t, s, out, di = 0) {
  const th = theta(t - di, s);
  const r  = s.a * HALF_UNIT;
  const sy = Math.sin(th) * r;
  out[0] = Math.cos(th) * r;
  out[1] = sy * Math.cos(s.inc);
  out[2] = sy * Math.sin(s.inc);
  return out;
}

const tmp = new THREE.Vector3();

// ---------- фон: плоскость во весь кадр ----------
const bgDist = 7.0;
const bgHalfH = Math.tan(THREE.MathUtils.degToRad(22.5)) * bgDist;
const bg = new THREE.Mesh(
  new THREE.PlaneGeometry(bgHalfH * 2.4, bgHalfH * 2.4),
  new THREE.MeshBasicMaterial({ color: 0x080f22 })
);
bg.position.z = -bgDist;
scene.add(bg);

// ---------- центральный диск ----------
const CENTER_R = 0.22 * HALF_UNIT;
const center = new THREE.Mesh(
  new THREE.CircleGeometry(CENTER_R, 64),
  new THREE.MeshBasicMaterial({ map: centerTex })
);
center.position.z = -0.02;
scene.add(center);

const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xffe9a8, transparent: true, opacity: 0.4,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
halo.scale.set(2.6, 2.6, 1);
halo.position.z = -1.1; // позади всех орбит: не перекрашивает сферы
scene.add(halo);

// ---------- сферы, свечение, кольца и хвосты ----------
const SPHERE_R = 0.12;
const objects = ['center'];
const items = SPHERES.map((s, idx) => {
  objects.push(`sphere-${idx + 1}`);

  // тело
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(SPHERE_R, 28, 20),
    new THREE.MeshBasicMaterial({ color: s.color })
  );
  scene.add(mesh);

  // свечение вокруг тела
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: s.color, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  glow.scale.set(SPHERE_R * 5.5, SPHERE_R * 5.5, 1);
  scene.add(glow);

  // тонкое кольцо орбиты
  const ringPts = [];
  for (let k = 0; k < 128; k++) {
    const th = (k / 128) * TAU;
    const r = s.a * HALF_UNIT;
    const sy = Math.sin(th) * r;
    ringPts.push(new THREE.Vector3(Math.cos(th) * r, sy * Math.cos(s.inc), sy * Math.sin(s.inc)));
  }
  const ring = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(ringPts),
    new THREE.LineBasicMaterial({ color: 0x1c2b4d, transparent: true, opacity: 0.55 })
  );
  scene.add(ring);

  // хвост: 60 светящихся точек
  const tPos = new Float32Array(TRAIL_N * 3);
  const tCol = new Float32Array(TRAIL_N * 3);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
  trailGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
  const trail = new THREE.Points(trailGeo, new THREE.PointsMaterial({
    map: glowTex, size: 0.17, sizeAttenuation: true, vertexColors: true,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  scene.add(trail);

  const c3 = new THREE.Color(s.color);
  return { def: s, mesh, glow, trail, tPos, tCol, c3 };
});

// ---------- обновление сцены в момент времени t ----------
function update(t) {
  for (const it of items) {
    const { def, mesh, glow, tPos, tCol, c3 } = it;
    const r = def.a * HALF_UNIT;

    const base = orbitPoint(t, def, [0, 0, 0]);
    mesh.position.set(...base);
    glow.position.set(...base);

    for (let i = 0; i < TRAIL_N; i++) {
      orbitPoint(t, def, tmp, i * TRAIL_DT);
      tPos[i * 3]     = tmp.x;
      tPos[i * 3 + 1] = tmp.y;
      tPos[i * 3 + 2] = tmp.z;
      const b = 1.0 - (1.0 - 0.06) * (i / (TRAIL_N - 1)); // 1.0 -> 0.06
      tCol[i * 3]     = c3.r * b;
      tCol[i * 3 + 1] = c3.g * b;
      tCol[i * 3 + 2] = c3.b * b;
    }
    it.trail.geometry.attributes.position.needsUpdate = true;
    it.trail.geometry.attributes.color.needsUpdate = true;
  }
}

// ---------- время, шаги, зонд ----------
let t = 0;
const r4 = v => Math.round(v * 1e4) / 1e4;

window.__probe = function () {
  return {
    t: r4(t),
    objects,
    orbits: SPHERES.map(s => r4(((theta(t, s) % TAU) + TAU) % TAU)),
    planets: SPHERES.map(s => {
      const p = orbitPoint(t, s, [0, 0, 0]);
      return { x: r4(p[0] / FULL_UNIT), y: r4(p[1] / FULL_UNIT), z: r4(p[2] / FULL_UNIT) };
    }),
  };
};

window.__step = function (dt) {
  t += dt;
  update(t);
  renderer.render(scene, camera);
  return window.__probe();
};

// ---------- стартовый кадр (t = 0) ----------
update(0);
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
