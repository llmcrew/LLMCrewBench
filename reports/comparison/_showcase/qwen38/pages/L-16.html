<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{margin:0;overflow:hidden;background:#080f22}
canvas{display:block;width:800px;height:600px}
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

const W=800,H=600,FULL_H=3.314,HALF_H=FULL_H/2;

const camera=new THREE.PerspectiveCamera(45,W/H,0.1,100);
camera.position.set(0,0,4.0);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();

// Background
const bgMesh=new THREE.Mesh(
  new THREE.PlaneGeometry(14,14),
  new THREE.MeshBasicMaterial({color:0x080f22,side:THREE.DoubleSide})
);
bgMesh.position.set(0,0,-1);
bgMesh.name='background';
scene.add(bgMesh);

// Orbit data
const OP=[
  {a:0.603,inc:0.765,t0:2.567,T:5.76,color:0xff4d6d},
  {a:0.784,inc:0.780,t0:5.254,T:8.40,color:0xffd166},
  {a:0.668,inc:0.754,t0:2.690,T:5.09,color:0x4dd0e1},
  {a:0.691,inc:0.620,t0:6.163,T:8.27,color:0x9b6dff},
  {a:0.321,inc:0.520,t0:3.844,T:6.70,color:0xff4d6d},
  {a:0.507,inc:0.688,t0:3.682,T:5.89,color:0xffd166}
];
const TAIL_N=60,DT_T=0.0167;

function theta(o,t){return o.t0+2*Math.PI*t/o.T}
function pos(o,t){
  const th=theta(o,t),r=o.a*HALF_H;
  return new THREE.Vector3(r*Math.cos(th),r*Math.sin(th)*Math.cos(o.inc),r*Math.sin(th)*Math.sin(o.inc));
}

function glowTex(r,g,b){
  const s=64,c=document.createElement('canvas');c.width=s;c.height=s;
  const x=c.getContext('2d'),gr=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.25,`rgba(${r},${g},${b},0.7)`);
  gr.addColorStop(0.55,`rgba(${r},${g},${b},0.25)`);
  gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gr;x.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}

function hexRGB(h){return{r:(h>>16)&255,g:(h>>8)&255,b:h&255}}

// Center glow
(function(){
  const s=128,c=document.createElement('canvas');c.width=s;c.height=s;
  const x=c.getContext('2d'),gr=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'#ffe9a8');
  gr.addColorStop(0.25,'#ffe9a8');
  gr.addColorStop(0.5,'rgba(255,233,168,0.55)');
  gr.addColorStop(0.75,'rgba(255,233,168,0.15)');
  gr.addColorStop(1,'rgba(8,15,34,0)');
  x.fillStyle=gr;x.fillRect(0,0,s,s);
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  const wr=0.22*HALF_H;
  sp.scale.set(wr*2,wr*2,1);
  sp.position.set(0,0,0);
  sp.name='center';
  scene.add(sp);
})();

// Spheres & tails
const spheres=[],tails=[];
const whiteGlow=glowTex(255,255,255);

for(let i=0;i<6;i++){
  const o=OP[i],{r,g,b}=hexRGB(o.color);

  // Sphere sprite
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:glowTex(r,g,b),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
  }));
  const ss=0.14*HALF_H;
  sp.scale.set(ss,ss,1);
  sp.name='sphere_'+(i+1);
  scene.add(sp);
  spheres.push(sp);

  // Tail points
  const tp=new Float32Array(TAIL_N*3);
  const tc=new Float32Array(TAIL_N*3);
  for(let j=0;j<TAIL_N;j++){
    const br=1.0-0.94*(j/(TAIL_N-1));
    tc[j*3]=(r/255)*br;
    tc[j*3+1]=(g/255)*br;
    tc[j*3+2]=(b/255)*br;
  }
  const tg=new THREE.BufferGeometry();
  tg.setAttribute('position',new THREE.BufferAttribute(tp,3));
  tg.setAttribute('color',new THREE.BufferAttribute(tc,3));
  const tm=new THREE.PointsMaterial({
    size:0.07,vertexColors:true,transparent:true,depthWrite:false,
    blending:THREE.AdditiveBlending,map:whiteGlow,sizeAttenuation:true
  });
  const pts=new THREE.Points(tg,tm);
  pts.name='tail_'+(i+1);
  scene.add(pts);
  tails.push(pts);
}

let t=0;

function update(tt){
  for(let i=0;i<6;i++){
    const o=OP[i];
    spheres[i].position.copy(pos(o,tt));
    const arr=tails[i].geometry.attributes.position.array;
    for(let j=0;j<TAIL_N;j++){
      const p=pos(o,tt-j*DT_T);
      arr[j*3]=p.x;arr[j*3+1]=p.y;arr[j*3+2]=p.z;
    }
    tails[i].geometry.attributes.position.needsUpdate=true;
  }
}

update(0);
renderer.render(scene,camera);
window.__ready=true;

window.__step=function(dt){
  t+=dt;
  update(t);
  renderer.render(scene,camera);
  return window.__probe();
};

window.__probe=function(){
  const objects=scene.children.map(o=>o.name);
  const orbits=OP.map(o=>Math.round(theta(o,t)*1e4)/1e4);
  const planets=OP.map(o=>{
    const p=pos(o,t);
    return{x:Math.round(p.x/FULL_H*1e4)/1e4,y:Math.round(p.y/FULL_H*1e4)/1e4};
  });
  return{t:Math.round(t*1e4)/1e4,objects,orbits,planets};
};
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
