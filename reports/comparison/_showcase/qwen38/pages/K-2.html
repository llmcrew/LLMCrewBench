<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Груз на пружине</title>
<style>
  html, body { margin: 0; padding: 0; background: #10141a; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ---------- Константы симуляции ----------
const K = 10.07;
const M = 1.0;
const C = 0.27;

let x = 1.21;   // координата груза
let v = 1.32;   // скорость груза
let steps = 0;
let t = 0.0;

// ---------- Рендерер ----------
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

// ---------- Сцена ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141a);

// ---------- Камера ----------
const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
camera.position.set(0.0, 3.5, 15.0);
camera.lookAt(0.0, 0.2, 0.0);

// ---------- Свет ----------
const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.position.set(8.0, 14.0, 10.0);
scene.add(dirLight);

// ---------- Объекты сцены ----------

// Земля
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x2b3a4a })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.3, 0);
ground.name = 'ground';
scene.add(ground);

// Стена
const wall = new THREE.Mesh(
  new THREE.BoxGeometry(0.8, 3.2, 3.2),
  new THREE.MeshStandardMaterial({ color: 0x8a93a6 })
);
wall.position.set(-7, 0.9, 0);
wall.name = 'wall';
scene.add(wall);

// Груз
const mass = new THREE.Mesh(
  new THREE.BoxGeometry(1.2, 1.2, 1.2),
  new THREE.MeshStandardMaterial({ color: 0xff8a3d })
);
mass.position.set(x, 0.3, 0);
mass.name = 'mass';
scene.add(mass);

// Пружина (цилиндр, ориентированный вдоль X)
const spring = new THREE.Mesh(
  new THREE.CylinderGeometry(0.09, 0.09, 1, 16),
  new THREE.MeshStandardMaterial({ color: 0xd8dde6 })
);
spring.name = 'spring';
scene.add(spring);

// Точка крепления пружины к стене
const springAnchor = new THREE.Vector3(-6.6, 0.3, 0);

const _up = new THREE.Vector3(0, 1, 0);
const _dir = new THREE.Vector3();
const _mid = new THREE.Vector3();
const _q = new THREE.Quaternion();

function updateSpring() {
  const bx = x, by = 0.3, bz = 0;
  _dir.set(bx - springAnchor.x, by - springAnchor.y, bz - springAnchor.z);
  const len = _dir.length();
  _mid.set(
    (springAnchor.x + bx) / 2,
    (springAnchor.y + by) / 2,
    (springAnchor.z + bz) / 2
  );
  spring.position.copy(_mid);
  spring.scale.set(1, len, 1);
  if (len > 1e-9) {
    _dir.normalize();
    _q.setFromUnitVectors(_up, _dir);
    spring.quaternion.copy(_q);
  }
}
updateSpring();

// ---------- Отрисовка ----------
function render() {
  mass.position.set(x, 0.3, 0);
  updateSpring();
  renderer.render(scene, camera);
}
render();

// ---------- API ----------
function r4(n) {
  return Math.round(n * 10000) / 10000;
}

window.__step = function (dt) {
  // полунеявный Эйлер, строго в заданном порядке
  v += (-K / M * x - C * v) * dt;
  x += v * dt;
  steps += 1;
  t += dt;
  render();
  return window.__probe();
};

window.__probe = function () {
  const objects = [];
  scene.traverse(function (obj) {
    if (obj.name) objects.push(obj.name);
  });
  return {
    steps: steps,
    t: r4(t),
    objects: objects,
    camera: [r4(camera.position.x), r4(camera.position.y), r4(camera.position.z)],
    x: r4(x),
    v: r4(v),
    k: r4(K),
    m: r4(M)
  };
};

window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
