<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Mandelbrot fullscreen</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const THREE = window.THREE;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// Fragment shader computes the whole fractal: the full screen is a single 2x2 quad.
const vertexShader = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const fragmentShader = /* glsl */`
  precision highp float;
  varying vec2 vUv;
  uniform float uZoom; // starts at 1.500

  const int    MAX_ITER = 160;   // maximum 160 iterations
  const float  ESCAPE_R = 2.0;   // escape radius 2.0

  vec3 colA() { return vec3(27.0/255.0, 18.0/255.0, 64.0/255.0); }   // #1b1240
  vec3 colB() { return vec3(24.0/255.0, 183.0/255.0, 172.0/255.0); } // #18b7ac
  vec3 colC() { return vec3(184.0/255.0, 242.0/255.0, 74.0/255.0); } // #b8f24a
  vec3 colD() { return vec3(255.0/255.0, 95.0/255.0, 126.0/255.0); } // #ff5f7e

  void main() {
    vec2 p = vUv * 2.0 - 1.0;                 // screen square
    // region: half-height 1.2 / uZoom, width 4/3 of height,
    // center c = (-0.600, 0.000) at the middle of the frame
    vec2 c = vec2(-0.600, 0.000) + p * (vec2(4.0/3.0, 1.0) * 1.2 / uZoom);

    vec2 z = vec2(0.0);
    int i = 0;
    for (i = 0; i < MAX_ITER; i++) {
      float zz = z.x * z.x + z.y * z.y;
      if (zz > ESCAPE_R * ESCAPE_R) break;    // |z| > 2.0 -> escaped
      z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c; // z = z*z + c
    }

    bool inside = (i >= MAX_ITER); // did not escape in 160 iterations
    float t = inside ? 1.0 : log(float(i) + 1.0) / log(161.0);

    vec3 col = colA();                                   // t = 0 -> #1b1240
    col = mix(col, colB(), smoothstep(0.30, 0.40, t));   // to #18b7ac
    col = mix(col, colA(), smoothstep(0.55, 0.62, t));   // back to dark
    col = mix(col, colC(), smoothstep(0.70, 0.76, t));   // to #b8f24a
    col = mix(col, colD(), smoothstep(0.90, 0.96, t));   // to #ff5f7e
    if (inside) col = colD();                            // interior -> #ff5f7e
    gl_FragColor = vec4(col, 1.0);
  }
`;
const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms: { uZoom: { value: 1.500 } }
});

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
quad.name = 'mandelbrot';
scene.add(quad);

let t = 0.0;
const r4 = (x) => Math.round(x * 10000) / 10000;

function applyZoom() {
  material.uniforms.uZoom.value = 1.500 * Math.exp(0.350 * t);
}

function probe() {
  return {
    t: r4(t),
    objects: scene.children.map((o) => o.name),
    zoom: r4(material.uniforms.uZoom.value)
  };
}
window.__probe = probe;

function step(dt) {
  t += dt;
  applyZoom();
  renderer.render(scene, camera);
  return probe();
}
window.__step = step;

// initial frame
applyZoom();
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
