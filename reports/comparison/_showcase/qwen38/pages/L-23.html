<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Космическая заправка под дождём</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block}
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ============ детерминированный LCG — единственный источник случайности ============ */
let lcg = 865521;
const rnd = () => { lcg = (lcg * 1103515245 + 12345) % 2147483648; return lcg / 2147483648; };

/* ============ рендерер ============ */
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x241644);
const camera = new THREE.PerspectiveCamera(55, 16/9, 0.05, 400);

const NIGHT = 0x241644, CYAN = 0x35d5e6, AMBER = 0xffb347, RAINC = 0xa8c8dc;

/* ============ helpers кадра: u,v — доли кадра, z — глубина (камера на z=4) ============ */
const CAM0 = 4, TANG = Math.tan(55 * Math.PI / 360), ASP = 16/9;
const visH = d => 2 * d * TANG;                // видимая высота на расстоянии d
const P    = (u,v,z) => { const d = CAM0 - z; return new THREE.Vector3((u-0.5)*visH(d)*ASP, (0.5-v)*visH(d), z); };
const SZ   = (fw,fh,z) => { const d = CAM0 - z; return [fw*visH(d)*ASP, fh*visH(d)]; };

const box  = (w,h,d,mat) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
const plane= (w,h,mat)   => new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);

function tube(a, b, r, mat){
  const d = new THREE.Vector3().subVectors(b, a);
  const len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().normalize());
  return m;
}

/* ============ материалы ============ */
const matNight   = new THREE.MeshBasicMaterial({ color: NIGHT });
const matHull    = new THREE.MeshStandardMaterial({ color: NIGHT, roughness: 0.85, metalness: 0.25 });
const matHullLt  = new THREE.MeshStandardMaterial({ color: 0x2b1d4e, roughness: 0.8,  metalness: 0.2 });
const matRoverB  = new THREE.MeshStandardMaterial({ color: 0x332456, roughness: 0.55, metalness: 0.45 });
const matWheel   = new THREE.MeshBasicMaterial({ color: NIGHT });
const matGround  = new THREE.MeshBasicMaterial({ color: NIGHT });

const matCyan      = new THREE.MeshBasicMaterial({ color: CYAN });
const matCyanNeon  = new THREE.MeshBasicMaterial({ color: CYAN });           // мигает
const matHose      = new THREE.MeshBasicMaterial({ color: CYAN });           // мигает
const matPad       = new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.5 });
const matHolo      = new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
const matHolo2     = new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
const matFog       = new THREE.MeshBasicMaterial({ color: RAINC, transparent: true, opacity: 0.27, depthWrite: false });
const matRainF     = new THREE.MeshBasicMaterial({ color: RAINC });
const matRainM     = new THREE.MeshBasicMaterial({ color: RAINC });
const matAmber     = new THREE.MeshBasicMaterial({ color: AMBER });
const matAmberNeon = new THREE.MeshBasicMaterial({ color: AMBER });          // мигает
const matHaloAmber = new THREE.MeshBasicMaterial({ color: AMBER, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false });
const matHaloCyan  = new THREE.MeshBasicMaterial({ color: CYAN,  transparent: true, opacity: 0.3,  blending: THREE.AdditiveBlending, depthWrite: false });

const neonCyan  = [matCyanNeon, matHose];   // циановый неон (фликер)
const neonAmber = [matAmberNeon];           // янтарный неон (медленнее)

/* огни (для стандартных материалов — объём и “мокрость”) */
scene.add(new THREE.AmbientLight(0x3a2b5e, 1.1));
const padLight  = new THREE.PointLight(CYAN,  40, 22, 2); padLight.position.set(0.45, -0.5, -7.0); scene.add(padLight);
const roverLight= new THREE.PointLight(AMBER, 14, 12, 2); roverLight.position.set(0.9, 0.4, -6.8); scene.add(roverLight);
const towerLight= new THREE.PointLight(CYAN,  22, 16, 2); towerLight.position.set(-6.0, 3.2, -9.0); scene.add(towerLight);
const holoLight = new THREE.PointLight(CYAN,  10, 12, 2); holoLight.position.set(-7.0, 3.6, -12.5); scene.add(holoLight);

/* ============ night — глухая ночь, z=-45 ============ */
const night = plane(400, 220, matNight);
night.position.z = -45;
scene.add(night);

/* ============ hull — корпус станции, z=-18 ============ */
const hull = new THREE.Group();
{
  const main  = box(19, 6, 1.6, matHull);   main.position.set(2.6, 1.4, -18);
  const block = box(8, 2.6, 1.3, matHull);  block.position.set(-8.2, 0.2, -18.2);
  const spine = box(1.4, 5, 1.9, matHull);  spine.position.set(8.5, 3.2, -18.3);
  const ant1  = box(0.12, 3.4, 0.12, matHullLt); ant1.position.set(6.5, 5.6, -18);
  const ant2  = box(0.1, 2.2, 0.1, matHullLt);   ant2.position.set(-10, 2.4, -18);
  const dome  = new THREE.Mesh(new THREE.SphereGeometry(1.1, 16, 12), matHullLt);
  dome.position.set(-4.5, 4.9, -18); dome.scale.y = 0.7;
  hull.add(main, block, spine, ant1, ant2, dome);
  /* циановые иллюминаторы-линии */
  for (let i = 0; i < 6; i++){
    const w = 0.55, h = 0.16;
    const win = plane(w, h, matCyan);
    win.position.set(7.9 - i*1.55, 2.1 + (i%2)*0.5, -17.15);
    hull.add(win);
  }
  const winS = plane(0.7, 0.14, matCyan); winS.position.set(-7.4, 0.7, -17.55); hull.add(winS);
  /* янтарная полоса-огонь на корпусе */
  const amberStrip = plane(1.0, 0.24, matAmber); amberStrip.position.set(1.2, 2.8, -17.1); hull.add(amberStrip);
  const amberHalo = plane(1.6, 0.5, matHaloAmber); amberHalo.position.set(1.2, 2.8, -17.15); hull.add(amberHalo);
  /* янтарные огни станции */
  for (const [ax, ay] of [[-2.6, 1.1], [5.0, 0.9], [9.6, 4.4]]){
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), matAmber);
    l.position.set(ax, ay, -17.1); hull.add(l);
    const g = plane(0.5, 0.5, matHaloAmber); g.position.set(ax, ay, -17.02); hull.add(g);
  }
}
scene.add(hull);

/* ============ земля / тёмная площадка ночью ============ */
const ground = box(46, 0.5, 26, matGround);
ground.position.set(0, -2.6, -14.5);   // верх земли y = -2.35, туман B идёт прямо над ней
scene.add(ground);

/* ============ pad — светящаяся платформа: 0.52x0.10 кадра, u=0.52, v=0.62 ============ */
const PADZ = -8;
const pc = P(0.52, 0.62, PADZ);
const pad = new THREE.Group();
{
  const [w] = SZ(0.52, 0.10, PADZ);
  /* тёмное основание под платформой — до земли */
  const base = box(w, 1.0, 8.4, matNight);
  base.position.set(pc.x, -2.0, PADZ);
  const plate = box(w, 0.12, 8.4, matPad);               // сама платформа #35d5e6, opacity 0.5
  plate.position.set(pc.x, -1.49, PADZ);
  /* зарядные полосы — строго циановые */
  const stripZ = PADZ;
  for (const off of [-3.4, -1.15, 1.15, 3.4]){
    const s = box(0.14, 0.02, 7.7, matCyan);
    s.position.set(pc.x + off, -1.42, stripZ);
    pad.add(s);
  }
  const rimT = box(w, 0.05, 0.1, matCyan);             // циановые кромки
  rimT.position.set(pc.x, -1.42, PADZ + 4.2);
  const rimB = rimT.clone(); rimB.position.z = PADZ - 4.2;
  const rimL = box(0.1, 0.05, 8.4, matCyan); rimL.position.set(pc.x - w/2, -1.42, PADZ);
  const rimR = rimL.clone(); rimR.position.x = pc.x + w/2;
  /* циановый ореол вокруг кромки (под кромкой, не закрывает полосы) */
  const halo = box(w + 1.6, 0.06, 9.6, matHaloCyan);
  halo.position.set(pc.x, -1.52, PADZ);
  /* широкое свечение под платформой — поднимает нижнюю-среднюю полосу */
  const underGlow = box(w + 5, 0.5, 5, new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false }));
  underGlow.position.set(pc.x, -1.8, PADZ + 0.5);
  pad.add(base, plate, rimT, rimB, rimL, rimR, halo, underGlow);
}
scene.add(pad);

/* ============ rover — на платформе, u=0.55, v=0.55 ============ */
const ROZ = -7.5;
const rc = P(0.55, 0.42, ROZ); // центр кадра ровера ≈ v 0.42..0.55
const rover = new THREE.Group();
rover.position.set(rc.x, -1.43, ROZ);
{
  const totalH = 0.19 * visH(CAM0 - ROZ);        // ~2.27 м объекта
  const bodyH = 0.60 * totalH, cabH = 0.32 * totalH;
  const body = box(1.7, bodyH, 2.3, matRoverB);
  body.position.y = bodyH/2 + 0.32;
  const cab = box(1.05, cabH, 1.15, matHullLt);
  cab.position.set(-0.12, bodyH + 0.32 + cabH/2 + 0.08, 0.1);
  const win = plane(0.85, cabH*0.6, matCyan);
  win.rotation.y = -Math.PI/2;
  win.position.set(-0.68, bodyH + 0.32 + cabH/2 + 0.1, 0.1);
  /* два колеса */
  const wg = new THREE.CylinderGeometry(0.42, 0.42, 0.36, 18);
  for (const zz of [-0.75, 0.75]){
    const wh = new THREE.Mesh(wg, matWheel);
    wh.rotation.z = Math.PI/2;
    wh.position.set(0.84, 0.4, zz);
    rover.add(wh);
  }
  /* три янтарных огня (ширина ~0.10 объекта) + ореолы */
  const lampPos = [
    new THREE.Vector3(-0.95, 0.75, -0.6),
    new THREE.Vector3(-0.95, 0.75,  0.6),
    new THREE.Vector3(-0.12, bodyH + 0.32 + cabH + 0.22, 0.1)
  ];
  for (const lp of lampPos){
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 10), matAmber);
    l.position.copy(lp); rover.add(l);
    const core = plane(0.72, 0.72, matAmber);            // ядро огня (строго янтарное)
    core.position.copy(lp); rover.add(core);
    const g = plane(1.35, 1.35, matHaloAmber);
    g.position.copy(lp); g.position.z -= 0.03; rover.add(g);
  }
  /* задний янтарный рубильник */
  const tail = box(0.05, 0.12, 1.4, matAmber);
  tail.position.set(0.88, 0.7, 0); rover.add(tail);
  rover.add(body, cab, win);
}
scene.add(rover);

/* ============ tower — заправочная башня: u=0.25, v=0.30, 0.05x0.46 кадра ============ */
const TOZ = -10;
const tcx = P(0.25, 0.30, TOZ).x;
const tower = new THREE.Group();
{
  const [tw, th] = SZ(0.05, 0.46, TOZ);           // ~1.3 x 6.7
  const baseY = -1.6, topY = baseY + th;
  const shaft = box(tw, th, tw*0.95, matHull);
  shaft.position.set(tcx, baseY + th/2, TOZ);
  const cap = box(tw*1.6, 0.3, tw*1.6, matHullLt);
  cap.position.set(tcx, topY + 0.15, TOZ);
  /* вертикальный циановый неон */
  const neon = box(0.09, th*0.9, 0.06, matCyanNeon);
  neon.position.set(tcx + tw*0.55, baseY + th/2, TOZ + tw*0.45);
  /* янтарные башенные огни */
  for (const ay of [baseY + th*0.22, baseY + th*0.45]){
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), matAmberNeon);
    b.position.set(tcx, ay, TOZ + tw*0.5); tower.add(b);
    const core = plane(0.9, 0.9, matAmber);
    core.position.copy(b.position).z += 0.08; tower.add(core);
    const g = plane(1.35, 1.35, matHaloAmber); g.position.copy(core.position); g.position.z -= 0.05; tower.add(g);
  }
  const baseFlare = box(tw*2.2, 0.35, tw*2.2, matHull);
  baseFlare.position.set(tcx, baseY + 0.1, TOZ);
  /* стрела над ровером */
  const a0 = new THREE.Vector3(tcx + tw*0.5, topY + 0.28, TOZ);
  const a1 = new THREE.Vector3(rc.x + 1.3, topY + 0.28, ROZ - 0.3);
  const arm = tube(a0, a1, 0.22, matHullLt);
  const armGlow = tube(a0, a1, 0.05, matCyanNeon);
  tower.add(shaft, cap, neon, baseFlare, arm, armGlow);
}
scene.add(tower);

/* ============ шланг — #35d5e6, 0.02 ширины, дуга из трёх отрезков ============ */
const hose = new THREE.Group();
{
  const r = 0.02 * visH(CAM0 - ROZ) * ASP / 2;   // ~0.21
  const h0 = new THREE.Vector3(rc.x + 1.25, 4.9, ROZ - 0.3);
  const h1 = new THREE.Vector3(rc.x + 2.1, 3.3, ROZ - 0.1);
  const h2 = new THREE.Vector3(rc.x + 1.0, 1.4, ROZ);
  hose.add(tube(h0, h1, r, matHose));
  hose.add(tube(h1, h2, r, matHose));
  const tip = new THREE.Mesh(new THREE.ConeGeometry(r*1.6, 0.5, 10), matHose);
  tip.position.copy(h2).setY(h2.y - 0.25);
  hose.add(tip);
  const hdrop = box(0.08, 0.2, 0.08, matCyanNeon);  // капля зарядки
  hdrop.position.set(h2.x, h2.y - 0.7, h2.z);
  hose.add(hdrop);
}
scene.add(hose);

/* ============ holo — три циановые голопанели за башней, 0.09x0.12, v=0.28 ============ */
const holo = new THREE.Group();
{
  const hz = -13;
  const [hw, hh] = SZ(0.09, 0.12, hz);
  for (let i = 0; i < 3; i++){
    const u = 0.16 + i*0.125;
    const pos = P(u, 0.28, hz);
    const panel = plane(hw, hh, i === 1 ? matHolo2 : matHolo);
    panel.position.copy(pos);
    const frame = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.PlaneGeometry(hw, hh)),
      new THREE.LineBasicMaterial({ color: CYAN }));
    frame.position.copy(pos).add(new THREE.Vector3(0, 0, 0.01));
    /* внутренние “график”-линии */
    const rows = new THREE.Group();
    for (let k = 0; k < 4; k++){
      const bar = plane(hw*0.55*(0.4 + rnd()*0.6), 0.012*visH(hz), matCyan);
      bar.position.set(-hw*0.15, hh*0.32 - k*hh*0.22, -0.005);
      rows.add(bar);
    }
    panel.add(rows);
    holo.add(panel, frame);
  }
}
scene.add(holo);

/* ============ fog — два слоя тумана: #a8c8dc, opacity 0.27, v=0.72 и 0.44 ============ */
const fogA = plane(34, 0.13 * visH(18), matFog);  fogA.position.set(0, P(0.5, 0.44, -14).y, -14);   // за башней и ровером, перед корпусом
const fogB = plane(30, 0.14 * visH(10.2), matFog);  fogB.position.set(1.5, P(0.5, 0.72, -6.2).y, -6.2);
/* дополнительные тонкие нити тумана (чуть плотнее — для читаемости дождя) */
const fogC = plane(30, 0.014 * visH(8.4), new THREE.MeshBasicMaterial({ color: RAINC, transparent: true, opacity: 0.8, depthWrite: false }));
fogC.position.set(-1.2, P(0.5, 0.52, -5.2).y, -5.2);
const fogD = plane(30, 0.012 * visH(9.0), new THREE.MeshBasicMaterial({ color: RAINC, transparent: true, opacity: 0.8, depthWrite: false }));
fogD.position.set(1.0, P(0.5, 0.585, -5.9).y, -5.9);
scene.add(fogA, fogB, fogC, fogD);

/* ============ дождь: 76 капель z=-3.9, 6 px, 2.20 ед/с + два слоя струй ============ */
const rains = [];
function addRain(x, y0, z, w, h, mat, speed, span){
  const m = plane(w, h, mat);
  m.position.set(x, y0, z);
  scene.add(m);
  rains.push({ m, y0, speed, span });
}
const dropSpan = 9.0;
for (let i = 0; i < 76; i++){
  const x = (rnd() - 0.5) * 13.6;
  const y0 = (rnd() - 0.5) * dropSpan;
  const px6 = 6/1080 * visH(7.9);              // 6 px на z=-3.9
  addRain(x, y0, -3.9, px6, px6*1.7, matRainF, 2.20, dropSpan);
}
const midSpan = 12, foreSpan = 10;
for (let i = 0; i < 62; i++){
  const x = (rnd() - 0.5) * 22;
  const y0 = (rnd() - 0.5) * midSpan;
  const hh = 0.35 + rnd()*0.4;
  addRain(x, y0, -5.5 - rnd()*5.2, 0.02 + hh*0.015, hh, matRainM, 5 + 4*rnd(), midSpan);
}
for (let i = 0; i < 56; i++){
  const x = (rnd() - 0.5) * 13.5;
  const y0 = (rnd() - 0.5) * foreSpan;
  const hh = 0.45 + rnd()*0.35;
  addRain(x, y0, -4.5 + rnd()*0.7, 0.065, hh, matRainM, 7.5 + 3.5*rnd(), foreSpan);
}
const dropsGroup = new THREE.Group(); // формальная группа имён

const wrapY = (v, span) => ((v % span) + span) % span - span/2;

/* ============ камера: старт (0,0,4), смотрит в -Z ============ */
const S = { t: 0, camX: 0, camZ: 4, padOp: 0.5 };
function placeCamera(t){
  S.camX = 0.7 * Math.sin(2*Math.PI*0.25*t);
  S.camZ = Math.max(2.0, 4 - 1.58*t);
  camera.position.set(S.camX, 0, S.camZ);
  camera.lookAt(-0.3, -0.35, -9);  // взгляд смещён на 0.3 влево
}
placeCamera(0);

/* ============ шаг/проба ============ */
function flicker(t){
  return 0.62 + 0.26*Math.sin(9.1*t)*Math.sin(2.7*t + 1.3) + 0.12*Math.sin(23.7*t + 0.6);
}
const _c = new THREE.Color();
function applyNeon(t){
  const f = THREE.MathUtils.clamp(flicker(t), 0.15, 1);
  for (const m of neonCyan)  m.color.setHex(CYAN).multiplyScalar(0.45 + 0.55*f);
  const fa = 0.7 + 0.3*Math.sin(5.3*t + 0.8);
  for (const m of neonAmber) m.color.setHex(AMBER).multiplyScalar(fa);
  matHolo.opacity  = 0.30 + 0.22*f;
  matHolo2.opacity = 0.34 + 0.18*Math.sin(7.9*t + 2.1)*0.5 + 0.09;
  padLight.intensity  = 34 + 14*f;
  towerLight.intensity= 16 + 10*f;
}

function draw(t){
  for (const r of rains) r.m.position.y = wrapY(r.y0 - r.speed*t, r.span);
  fogA.position.x = 0.9*Math.sin(0.13*t);
  fogB.position.x = -1.1*Math.sin(0.10*t + 1.4);
  fogC.position.x = 0.7*Math.sin(0.17*t + 0.4);
  fogD.position.x = -0.6*Math.sin(0.12*t + 2.0);
  applyNeon(t);
  renderer.render(scene, camera);
}

window.__probe = () => {
  const r4 = x => Math.round(x*10000)/10000;
  const r3 = x => Math.round(x*1000)/1000;
  const o = (name, p, extra) => Object.assign({ name, p: [r3(p.x), r3(p.y), r3(p.z)] }, extra || {});
  return {
    t: r4(S.t),
    objects: [
      o('night', night.position),
      o('hull',  { x: 2.6, y: 1.4, z: -18 }),
      o('pad',   { x: pc.x, y: -1.49, z: PADZ }, { opacity: r4(S.padOp) }),
      o('rover', rover.position),
      o('tower', { x: tcx, y: 1.5, z: TOZ }),
      o('hose',  hose.children[0].position),
      o('holo',  holo.children[0].position),
      o('fogA',  fogA.position), o('fogB', fogB.position),
      o('drops', { x: rains[0].m.position.x, y: rains[0].m.position.y, z: -3.9 }, { count: 76 })
    ],
    camera: [r4(S.camX), r4(S.camZ)],
    pad: r4(S.padOp)
  };
};

window.__step = function(dt){
  S.t += dt;
  placeCamera(S.t);
  draw(S.t);
  return window.__probe();
};

/* первый кадр — начало сцены (t=0), затем проба отвечает */
draw(0);
window.__ready = true;
</script>
</body>
</html>
