<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мандала</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a24; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const THREE = window.THREE;

// ---- constants ----
const H = 6.627;               // frame height in world units at z=0 plane
const N_RAYS = 12;

const GOLD   = 0xffd257;
const PINK   = 0xff3aa8;
const CYAN   = 0x2ee6ff;
const BG     = 0x0a0a24;

const basic = (color, opts = {}) =>
  new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, ...opts });

// ---- renderer / scene / camera ----
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  preserveDrawingBuffer: true,
  antialias: true
});
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(BG, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);

const camera = new THREE.PerspectiveCamera(45, 1920 / 1080, 0.1, 100);
camera.position.set(0, 0, 8);
camera.lookAt(0, 0, 0);

// ---- mandala wheel ----
const wheel = new THREE.Group();
wheel.name = 'wheel';

// core: bright gold disc + gold torus ring on top of it
const core = new THREE.Mesh(
  new THREE.CircleGeometry(0.06 * H, 64),
  basic(GOLD)
);
core.name = 'core';
wheel.add(core);

const coreRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.068 * H, 0.012 * H, 16, 96),
  basic(GOLD)
);
coreRing.name = 'coreRing';
coreRing.position.z = 0.002;
wheel.add(coreRing);

// long petals: 12 planes, width 0.03H, radius 0.1H..0.34H, alternating pink/cyan
// rays spread from zero degree in both directions -> perfectly symmetric
const petals = new THREE.Group();
petals.name = 'petals';

const longLen = (0.34 - 0.1) * H;
const longGeo = new THREE.PlaneGeometry(0.03 * H, longLen);
longGeo.translate(0, (0.1 + 0.34) * 0.5 * H, 0);   // spans 0.1H..0.34H outward

const tipGeo = new THREE.CircleGeometry(0.022 * H, 32);

for (let k = 0; k < N_RAYS; k++) {
  const a = (k * Math.PI) / 6;                       // 0, 30, 60, ... degrees
  const color = (k % 2 === 0) ? PINK : CYAN;

  const petal = new THREE.Mesh(longGeo, basic(color));
  petal.name = 'petal' + k;
  petal.rotation.z = a;
  petals.add(petal);

  const tip = new THREE.Mesh(tipGeo, basic(color));
  tip.name = 'tip' + k;
  tip.position.set(Math.cos(a) * 0.34 * H, Math.sin(a) * 0.34 * H, 0.001);
  petals.add(tip);
}
wheel.add(petals);

// short second series: 12 wider petals rotated by 15°, radius 0.1H..0.2H
const innerPetals = new THREE.Group();
innerPetals.name = 'innerPetals';

const shortLen = (0.2 - 0.1) * H;
const shortGeo = new THREE.PlaneGeometry(0.042 * H, shortLen);
shortGeo.translate(0, (0.1 + 0.2) * 0.5 * H, 0);

for (let k = 0; k < N_RAYS; k++) {
  const a = (k * Math.PI) / 6 + Math.PI / 12;        // offset 15°
  const p = new THREE.Mesh(shortGeo, basic(GOLD));
  p.name = 'innerPetal' + k;
  p.rotation.z = a;
  innerPetals.add(p);
}
wheel.add(innerPetals);

// rings: gold torus (R=0.16H, tube=0.012H) and cyan torus (R=0.34H, tube=0.006H)
const ringGold = new THREE.Mesh(
  new THREE.TorusGeometry(0.16 * H, 0.012 * H, 16, 128),
  basic(GOLD)
);
ringGold.name = 'ringGold';
wheel.add(ringGold);

const ringOuter = new THREE.Mesh(
  new THREE.TorusGeometry(0.34 * H, 0.006 * H, 16, 160),
  basic(CYAN)
);
ringOuter.name = 'ringOuter';
wheel.add(ringOuter);

scene.add(wheel);

// ---- time / stepping ----
let t = 0;

function applyWheel() {
  wheel.rotation.z = 0.2014 * t;
}

function names() {
  const out = [];
  scene.traverse((o) => { if (o.name) out.push(o.name); });
  return out;
}

function probe() {
  return {
    t: Number(t.toFixed(4)),
    objects: names(),
    angle: Number(((0.2014 * t * 180) / Math.PI).toFixed(4))
  };
}

window.__step = function (dt) {
  t += dt;
  applyWheel();
  renderer.render(scene, camera);
  return probe();
};

window.__probe = probe;

// first frame at t = 0
applyWheel();
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
