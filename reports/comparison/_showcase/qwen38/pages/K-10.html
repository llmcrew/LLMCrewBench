<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Particles in a box</title>
<style>
  html, body { margin: 0; padding: 0; background: #10141a; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141a);

// Floor: 40x40 plane at y=0
const floorGeo = new THREE.PlaneGeometry(40, 40);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x2b3a4a, side: THREE.DoubleSide });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.name = 'floor';
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, 0);
scene.add(floor);

// Back wall: 16x12 plane at z=-2
const wallGeo = new THREE.PlaneGeometry(16, 12);
const wallMat = new THREE.MeshStandardMaterial({ color: 0x22303f, side: THREE.DoubleSide });
const wall = new THREE.Mesh(wallGeo, wallMat);
wall.name = 'wall';
wall.position.set(0, 6, -2);
scene.add(wall);

// Camera
const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
camera.position.set(0.0, 4.0, 16.0);
camera.lookAt(0.0, 2.0, 0.0);
scene.add(camera);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff, 2.0);
dir.position.set(6.0, 12.0, 8.0);
scene.add(dir);

// ---------- LCG ----------
let s = 2278553777;
function lcg() {
  s = (1664525 * s + 1013904223) % 4294967296;
  return s / 4294967296;
}

// ---------- Balls ----------
const R = 0.4;
const ballGeo = new THREE.SphereGeometry(R, 32, 16);
const ballMat = new THREE.MeshStandardMaterial({ color: 0xff8a3d });

const balls = [];
for (let i = 0; i < 4; i++) {
  const x  = -4 + 8 * lcg();
  const y  = 0.8 + 1.2 * lcg();
  const vx = -3 + 6 * lcg();
  const vy = 3 + 7 * lcg();

  const mesh = new THREE.Mesh(ballGeo, ballMat);
  mesh.name = 'ball-' + i;
  mesh.position.set(x, y, 0);
  scene.add(mesh);

  balls.push({ x, y, vx, vy, mesh });
}

// ---------- Simulation state ----------
let steps = 0;
let bounces = 0;
const G = 9.00;

function step(dt) {
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i];
    b.vy -= G * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if (b.y - R < 0) {
      b.y = R;
      b.vy = -b.vy;
      bounces++;
    } else if (b.y + R > 4.0) {
      b.y = 4.0 - R;
      b.vy = -b.vy;
      bounces++;
    }

    if (b.x - R < -5.0) {
      b.x = -5.0 + R;
      b.vx = -b.vx;
      bounces++;
    } else if (b.x + R > 5.0) {
      b.x = 5.0 - R;
      b.vx = -b.vx;
      bounces++;
    }

    b.mesh.position.set(b.x, b.y, 0);
  }
  steps++;
  return probe();
}

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

// First render
renderer.render(scene, camera);

// ---------- Probe ----------
function round4(v) {
  return Math.round(v * 10000) / 10000;
}

function probe() {
  return {
    steps: steps,
    bounces: bounces,
    balls: balls.map(b => ({
      x: round4(b.x),
      y: round4(b.y),
      vx: round4(b.vx),
      vy: round4(b.vy)
    })),
    camera: [round4(camera.position.x), round4(camera.position.y), round4(camera.position.z)],
    objects: ['floor', 'wall', 'ball-0', 'ball-1', 'ball-2', 'ball-3']
  };
}

// ---------- Public API ----------
window.__step = step;
window.__probe = probe;
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
