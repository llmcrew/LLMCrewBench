<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Жидкий металл и стекло</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0714; overflow: hidden; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0714);
scene.fog = new THREE.Fog(0x0a0714, 14, 45);

// ---------- env map: DataTexture 8x64, equirect ----------
function hexToRgb(h) {
  return [(h >> 16) & 255, (h >> 8) & 255, h & 255];
}
const ENV_W = 8, ENV_H = 64;
const envStops = [
  { t: 0.00, c: hexToRgb(0x0a0714) },
  { t: 0.45, c: hexToRgb(0x0d1b2e) },
  { t: 0.85, c: hexToRgb(0x1b4a5e) },
  { t: 1.00, c: hexToRgb(0x8fd3ff) }
];
const envData = new Uint8Array(ENV_W * ENV_H * 4);
function lerpStops(stops, t) {
  let a = stops[0], b = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t >= stops[i].t && t <= stops[i + 1].t) { a = stops[i]; b = stops[i + 1]; break; }
  }
  const span = (b.t - a.t) || 1;
  const k = (t - a.t) / span;
  return [
    a.c[0] + (b.c[0] - a.c[0]) * k,
    a.c[1] + (b.c[1] - a.c[1]) * k,
    a.c[2] + (b.c[2] - a.c[2]) * k
  ];
}
for (let y = 0; y < ENV_H; y++) {         // row 0 = bottom (v=0)
  const t = y / (ENV_H - 1);
  const [r, g, b] = lerpStops(envStops, t);
  for (let x = 0; x < ENV_W; x++) {
    const i = (y * ENV_W + x) * 4;
    envData[i] = Math.round(r);
    envData[i + 1] = Math.round(g);
    envData[i + 2] = Math.round(b);
    envData[i + 3] = 255;
  }
}
const envMap = new THREE.DataTexture(envData, ENV_W, ENV_H);
envMap.colorSpace = THREE.SRGBColorSpace;
envMap.mapping = THREE.EquirectangularReflectionMapping;
envMap.needsUpdate = true;
scene.environment = envMap;

// ---------- background gradient texture: #0a0714 (bottom) -> #4d7fa8 (top) ----------
const BG_W = 2, BG_H = 256;
const bgData = new Uint8Array(BG_W * BG_H * 4);
const bgBot = hexToRgb(0x0a0714), bgTop = hexToRgb(0x4d7fa8);
for (let y = 0; y < BG_H; y++) {
  const k = y / (BG_H - 1);
  const r = bgBot[0] + (bgTop[0] - bgBot[0]) * k;
  const g = bgBot[1] + (bgTop[1] - bgBot[1]) * k;
  const b = bgBot[2] + (bgTop[2] - bgBot[2]) * k;
  for (let x = 0; x < BG_W; x++) {
    const i = (y * BG_W + x) * 4;
    bgData[i] = Math.round(r);
    bgData[i + 1] = Math.round(g);
    bgData[i + 2] = Math.round(b);
    bgData[i + 3] = 255;
  }
}
const bgTex = new THREE.DataTexture(bgData, BG_W, BG_H);
bgTex.colorSpace = THREE.SRGBColorSpace;
bgTex.needsUpdate = true;

// ---------- camera ----------
const camera = new THREE.PerspectiveCamera(42, 1920 / 1080, 0.1, 100);
camera.position.set(0, 0.85, 5.4);
camera.lookAt(-0.15, 0.42, 0.2);

// ---------- geometry & materials ----------
// liquid-metal sphere
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.8, 48, 32),
  new THREE.MeshPhysicalMaterial({
    color: 0x33d1c6,
    metalness: 1.0,
    roughness: 0.18,
    clearcoat: 0.6,
    envMapIntensity: 3.0
  })
);
sphere.name = 'sphere';
sphere.position.set(0, 0.40, 0.60);
scene.add(sphere);

// glass torus
const torus = new THREE.Mesh(
  new THREE.TorusGeometry(0.80, 0.28, 16, 64),
  new THREE.MeshPhysicalMaterial({
    color: 0xe0733c,
    metalness: 0.15,
    roughness: 0.06,
    clearcoat: 1.0
  })
);
torus.name = 'torus';
torus.position.set(-1.45, -0.25, -0.6);
torus.rotation.z = 0.18;
scene.add(torus);

// floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshPhysicalMaterial({
    color: 0x121a2e,
    metalness: 0.85,
    roughness: 0.30
  })
);
floor.name = 'floor';
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.20;
scene.add(floor);

// background wall
const back = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshBasicMaterial({ map: bgTex, fog: true })
);
back.name = 'background';
back.position.set(0, 14.0, -6); // plane bottom hides under the floor; visible slice shows the darker lower part of the gradient
scene.add(back);

// ---------- lights ----------
const dirLight = new THREE.DirectionalLight(0xffffff, 4.0);
dirLight.position.set(2.0, 4.0, 3.0);
scene.add(dirLight);

const spark = new THREE.PointLight(0xf2f6fb, 120, 25);
spark.position.set(0.6, 2.6, 2.2);
scene.add(spark);

const orbitA = new THREE.PointLight(0x33d1c6, 45, 25);
const orbitB = new THREE.PointLight(0xe0733c, 45, 25);
scene.add(orbitA, orbitB);

scene.add(new THREE.AmbientLight(0x223044, 0.3));

const ORBIT_R = 3.2, ORBIT_SPEED = 0.900, ORBIT_PHASE = 0.052, ORBIT_Y = 1.6;
function orbitPos(t) {
  const a = ORBIT_SPEED * t + ORBIT_PHASE;
  return { x: ORBIT_R * Math.cos(a), y: ORBIT_Y, z: ORBIT_R * Math.sin(a) + 2.0 };
}

// ---------- state & API ----------
let t = 0;
function applyOrbit() {
  const p = orbitPos(t);
  orbitA.position.set(p.x, p.y, p.z);
  orbitB.position.set(p.x, p.y, p.z);
}
function round4(v) { return Math.round(v * 10000) / 10000; }

window.__probe = function () {
  const p = orbitPos(t);
  return {
    t: round4(t),
    objects: [
      { name: 'sphere', position: [0.0, 0.40, 0.60], rotationY: round4(sphere.rotation.y), rotationX: round4(sphere.rotation.x) },
      { name: 'torus',  position: [-1.45, -0.25, -0.60], rotationY: round4(torus.rotation.y) },
      { name: 'floor',  position: [0.0, -1.20, 0.0] },
      { name: 'background', position: [0.0, 14.0, -6.0] }
    ],
    angle: round4(sphere.rotation.y),
    light: [round4(p.x), round4(p.y), round4(p.z)]
  };
};

window.__step = function (dt) {
  t += dt;
  sphere.rotation.y += 1.100 * dt;
  sphere.rotation.x += 0.4 * dt;
  torus.rotation.y += 0.7 * dt;
  applyOrbit();
  renderer.render(scene, camera);
  return window.__probe();
};

// initial frame (t = 0)
applyOrbit();
renderer.render(scene, camera);
window.__ready = true;

// safety net: if the GL context is restored (rare, headless GPUs), repaint
renderer.domElement.addEventListener('webglcontextrestored', () => {
  renderer.render(scene, camera);
});
</script>
</body>
</html>
