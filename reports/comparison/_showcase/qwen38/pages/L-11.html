<script type="module">
const THREE = window.THREE;

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0714, 14, 45);

const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 100);
camera.position.set(0, 0.5, 4.0);
camera.lookAt(0, 0.1, 0);

// --- Environment map: DataTexture 8x64 ---
function makeEnvMap() {
  const W = 8, H = 64;
  const data = new Uint8Array(W * H * 4);
  const stops = [
    { t: 0.0,  c: [0x0a, 0x07, 0x14] },
    { t: 1/3,  c: [0x0d, 0x1b, 0x2e] },
    { t: 2/3,  c: [0x1b, 0x4a, 0x5e] },
    { t: 1.0,  c: [0x8f, 0xd3, 0xff] }
  ];
  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    let i = 0;
    while (i < stops.length - 2 && v > stops[i + 1].t) i++;
    const t0 = stops[i].t, t1 = stops[i + 1].t;
    const f = (v - t0) / (t1 - t0);
    const r = Math.round(stops[i].c[0] + f * (stops[i + 1].c[0] - stops[i].c[0]));
    const g = Math.round(stops[i].c[1] + f * (stops[i + 1].c[1] - stops[i].c[1]));
    const b = Math.round(stops[i].c[2] + f * (stops[i + 1].c[2] - stops[i].c[2]));
    for (let x = 0; x < W; x++) {
      const idx = (y * W + x) * 4;
      data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, W, H);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.needsUpdate = true;
  return tex;
}
scene.environment = makeEnvMap();

// --- Sphere ---
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.8, 48, 32),
  new THREE.MeshPhysicalMaterial({
    color: 0x33d1c6,
    metalness: 1.0,
    roughness: 0.18,
    clearcoat: 0.6,
    envMapIntensity: 3.0
  })
);
sphere.name = 'sphere';
sphere.position.set(0, 0.40, 0.60);
scene.add(sphere);

// --- Torus ---
const torus = new THREE.Mesh(
  new THREE.TorusGeometry(0.80, 0.28, 16, 64),
  new THREE.MeshPhysicalMaterial({
    color: 0xe0733c,
    metalness: 0.15,
    roughness: 0.06,
    clearcoat: 1.0
  })
);
torus.name = 'torus';
torus.position.set(-1.45, -0.25, -0.6);
scene.add(torus);

// --- Floor ---
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshPhysicalMaterial({
    color: 0x121a2e,
    metalness: 0.85,
    roughness: 0.30
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.20;
scene.add(floor);

// --- Background plane ---
function makeBgTexture() {
  const W = 8, H = 64;
  const data = new Uint8Array(W * H * 4);
  const bot = [0x0a, 0x07, 0x14];
  const top = [0x4d, 0x7f, 0xa8];
  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    const r = Math.round(bot[0] + v * (top[0] - bot[0]));
    const g = Math.round(bot[1] + v * (top[1] - bot[1]));
    const b = Math.round(bot[2] + v * (top[2] - bot[2]));
    for (let x = 0; x < W; x++) {
      const idx = (y * W + x) * 4;
      data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, W, H);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}
const bgPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshBasicMaterial({ map: makeBgTexture() })
);
bgPlane.position.z = -6;
scene.add(bgPlane);

// --- Lights ---
const dirLight = new THREE.DirectionalLight(0xffffff, 4.0);
dirLight.position.set(2.0, 4.0, 3.0);
scene.add(dirLight);

const sparkLight = new THREE.PointLight(0xf2f6fb, 120, 25);
sparkLight.position.set(0.6, 2.6, 2.2);
scene.add(sparkLight);

const orbitLight1 = new THREE.PointLight(0x33d1c6, 45, 25);
const orbitLight2 = new THREE.PointLight(0xe0733c, 45, 25);
scene.add(orbitLight1);
scene.add(orbitLight2);

const ambientLight = new THREE.AmbientLight(0x223044, 0.3);
scene.add(ambientLight);

// --- Orbit update ---
function updateOrbit(time) {
  const a = 0.900 * time + 0.052;
  const x = 3.2 * Math.cos(a);
  const z = 3.2 * Math.sin(a) + 2.0;
  orbitLight1.position.set(x, 0, z);
  orbitLight2.position.set(x, 0, z);
}
updateOrbit(0);

// --- Render ---
function render() {
  renderer.render(scene, camera);
}
render();
window.__ready = true;

// --- State ---
let t = 0;

window.__step = function(dt) {
  t += dt;
  sphere.rotation.y += 1.100 * dt;
  sphere.rotation.x += 0.4 * dt;
  torus.rotation.y += 0.7 * dt;
  updateOrbit(t);
  render();
  return window.__probe();
};

window.__probe = function() {
  const a = 0.900 * t + 0.052;
  const lx = 3.2 * Math.cos(a);
  const lz = 3.2 * Math.sin(a) + 2.0;
  return {
    t: Math.round(t * 10000) / 10000,
    objects: ['sphere', 'torus'],
    angle: Math.round(sphere.rotation.y * 10000) / 10000,
    light: [
      Math.round(lx * 10000) / 10000,
      0,
      Math.round(lz * 10000) / 10000
    ]
  };
};
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
