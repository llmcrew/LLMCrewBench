<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#1a1a2e}
canvas{display:block}
</style>
<script src='../../../_vendor/three.global.js'></script>

<body>
<script type="module">
const THREE = window.THREE;

const L1 = 2.56;
const L2 = 2.09;
const TX = 1.11;
const TY = 2.08;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
camera.position.set(1.6, 2.0, 9.5);
camera.lookAt(1.6, 2.0, 0.0);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
dirLight.position.set(5.0, 9.0, 8.0);
scene.add(dirLight);

// Base
const baseGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 32);
const baseMat = new THREE.MeshStandardMaterial({ color: 0x8899aa });
const base = new THREE.Mesh(baseGeo, baseMat);
base.name = 'base';
base.position.set(0, 0.15, 0);
scene.add(base);

// Arm1 group
const arm1 = new THREE.Group();
arm1.name = 'arm1';
arm1.position.set(0, 0, 0);
scene.add(arm1);

const link1Geo = new THREE.BoxGeometry(L1, 0.3, 0.3);
const link1Mat = new THREE.MeshStandardMaterial({ color: 0xcfd8e3 });
const link1 = new THREE.Mesh(link1Geo, link1Mat);
link1.position.set(L1 / 2, 0, 0);
arm1.add(link1);

// Arm2 group (nested in arm1)
const arm2 = new THREE.Group();
arm2.name = 'arm2';
arm2.position.set(L1, 0, 0);
arm1.add(arm2);

const link2Geo = new THREE.BoxGeometry(L2, 0.3, 0.3);
const link2Mat = new THREE.MeshStandardMaterial({ color: 0xcfd8e3 });
const link2 = new THREE.Mesh(link2Geo, link2Mat);
link2.position.set(L2 / 2, 0, 0);
arm2.add(link2);

// Effector
const effGeo = new THREE.SphereGeometry(0.2, 32, 32);
const effMat = new THREE.MeshStandardMaterial({ color: 0x44ddaa });
const effector = new THREE.Mesh(effGeo, effMat);
effector.name = 'effector';
effector.position.set(L2, 0, 0);
arm2.add(effector);

// Target
const tgtGeo = new THREE.SphereGeometry(0.3, 32, 32);
const tgtMat = new THREE.MeshStandardMaterial({ color: 0xff8a3d });
const target = new THREE.Mesh(tgtGeo, tgtMat);
target.name = 'target';
target.position.set(TX, TY, -0.2);
scene.add(target);

// State
let steps = 0;
let t = 0;

// Initial: angles zero, IK not computed
arm1.rotation.z = 0;
arm2.rotation.z = 0;

function round4(v) {
  return Math.round(v * 10000) / 10000;
}

window.__step = function (dt) {
  const x = TX;
  const y = TY;

  const c2 = (x * x + y * y - L1 * L1 - L2 * L2) / (2 * L1 * L2);
  const clamped = Math.max(-1, Math.min(1, c2));
  const theta2 = -Math.acos(clamped);
  const theta1 = Math.atan2(y, x) - Math.atan2(L2 * Math.sin(theta2), L1 + L2 * Math.cos(theta2));

  arm1.rotation.z = theta1;
  arm2.rotation.z = theta2;

  steps += 1;
  t += dt;

  renderer.render(scene, camera);

  return window.__probe();
};

window.__probe = function () {
  const objects = scene.children
    .filter(function (c) { return c.name; })
    .map(function (c) { return c.name; });

  const wp = new THREE.Vector3();
  effector.getWorldPosition(wp);

  return {
    steps: steps,
    t: round4(t),
    objects: objects,
    angles: [round4(arm1.rotation.z), round4(arm2.rotation.z)],
    effector: [round4(wp.x), round4(wp.y)],
    target: [round4(target.position.x), round4(target.position.y)]
  };
};

// First render
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
