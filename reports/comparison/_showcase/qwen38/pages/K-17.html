<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Bar chart scene</title>
<style>
  html, body { margin: 0; padding: 0; background: #10141a; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// ---- Данные ----
const DATA = [
  { label: 'A', value: 4.99 },
  { label: 'B', value: 4.21 },
  { label: 'C', value: 6.61 },
  { label: 'D', value: 7.00 },
  { label: 'E', value: 4.97 },
  { label: 'F', value: 6.07 },
  { label: 'G', value: 2.00 },
];
const n = DATA.length;

// ---- Сцена ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141a);

// Пол
const groundGeo = new THREE.PlaneGeometry(24, 24);
groundGeo.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b3a4a });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.name = 'ground';
ground.position.set(0, 0, 0);
scene.add(ground);

// Столбцы
const barGeo = new THREE.BoxGeometry(1, 1, 1);
const barMat = new THREE.MeshStandardMaterial({ color: 0xff8a3d });
const bars = [];
for (let i = 0; i < n; i++) {
  const bar = new THREE.Mesh(barGeo, barMat);
  bar.name = 'bar-' + i;
  const x = (i - (n - 1) / 2) * 2.0;
  bar.position.set(x, 0, 0);
  bar.scale.set(1, 0, 1);
  scene.add(bar);
  bars.push(bar);
}

// Маркер
const markerGeo = new THREE.SphereGeometry(0.25, 24, 16);
const markerMat = new THREE.MeshStandardMaterial({ color: 0xffe066 });
const marker = new THREE.Mesh(markerGeo, markerMat);
marker.name = 'marker';
marker.position.set(0, 0.5, 0);
scene.add(marker);

// ---- Камера ----
const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
camera.position.set(0.0, 7.0, 18.0);
camera.lookAt(0.0, 3.0, 0.0);

// ---- Свет ----
const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff, 2.2);
dir.position.set(8.0, 14.0, 8.0);
scene.add(dir);

// ---- Рендерер ----
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

// ---- Состояние ----
let t = 0;
let steps = 0;

function heights() {
  const k = Math.min(1, t / 0.5);
  return DATA.map(d => d.value * k);
}

function applyState() {
  const hs = heights();
  for (let i = 0; i < n; i++) {
    const h = hs[i];
    bars[i].scale.y = h;
    bars[i].position.y = h / 2;
  }
  const active = steps % n;
  const ax = (active - (n - 1) / 2) * 2.0;
  marker.position.set(ax, hs[active] + 0.5, 0);
}

function round4(x) {
  return Math.round(x * 10000) / 10000;
}

window.__step = function (dt) {
  t += dt;
  steps += 1;
  applyState();
  renderer.render(scene, camera);
  return window.__probe();
};

window.__probe = function () {
  const hs = heights();
  const barsInfo = DATA.map((d, i) => ({
    label: d.label,
    height: round4(hs[i]),
  }));
  const maxH = hs.reduce((a, b) => (b > a ? b : a), 0);
  const objects = scene.children.map(c => c.name);
  return {
    steps: steps,
    t: round4(t),
    objects: objects,
    bars: barsInfo,
    max_height: round4(maxH),
    active: steps % n,
  };
};

// ---- Первая отрисовка ----
applyState();
renderer.render(scene, camera);
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
