<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Разрушение планеты — цепная реакция</title>
<style>
  html,body{margin:0;padding:0;background:#05040c;overflow:hidden}
  canvas{display:block}
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ---------------- Deterministic LCG ---------------- */
let lcg = 701695;
function rnd(){ lcg = (lcg * 1103515245 + 12345) % 2147483648; return lcg / 2147483648; }

/* ---------------- Renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070512);
scene.fog = new THREE.FogExp2(0x0a0818, 0.004);

const camera = new THREE.PerspectiveCamera(55, 16/9, 0.05, 600);

/* ---------------- Key points ---------------- */
const EARTH_POS = new THREE.Vector3(3.0, -2.2, -14);
const CORE_POS  = new THREE.Vector3(-3.2, 1.4, -12);
const STATION_POS = new THREE.Vector3(-1.15, 0.15, -11.4);

/* ---------------- Lights ---------------- */
scene.add(new THREE.AmbientLight(0x28304a, 0.9));
const sun = new THREE.DirectionalLight(0xcfe2ff, 1.35);
sun.position.set(-60, 40, 90);
scene.add(sun);
const coreLight = new THREE.PointLight(0xff9a5a, 3.2, 60, 2);
coreLight.position.copy(CORE_POS);
scene.add(coreLight);
const stationLight = new THREE.PointLight(0x8fd8ff, 0.7, 6, 2);
stationLight.position.copy(STATION_POS).add(new THREE.Vector3(0, 0.4, 0));
scene.add(stationLight);

/* soft round sprite for points (deterministic) */
function softDot(){
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const ctx = c.getContext('2d');
  const grd = ctx.createRadialGradient(16,16,0, 16,16,16);
  grd.addColorStop(0.0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.35,'rgba(255,255,255,0.85)');
  grd.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,32,32);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const dotTex = softDot();
const dotTexCore = (function(){
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const ctx = c.getContext('2d');
  const grd = ctx.createRadialGradient(16,16,0, 16,16,16);
  grd.addColorStop(0.0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.55,'rgba(255,255,255,1)');
  grd.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,32,32);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
})();

/* ---------------- stars (2400 points) ---------------- */
{
  const N = 2400;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    pos[i*3]   = (rnd() - 0.5) * 170;
    pos[i*3+1] = (rnd() - 0.5) * 105 - 4;
    pos[i*3+2] = -20 - rnd() * 37; // in front of the nebula plane
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    color: 0xffffff, size: 0.16, sizeAttenuation: true,
    map: dotTex, transparent: true, opacity: 0.9, depthWrite: false
  });
  const stars = new THREE.Points(g, m);
  stars.name = 'stars';
  scene.add(stars);
}

/* ---------------- nebula (behind, z = -60) ---------------- */
{
  const g = new THREE.PlaneGeometry(260, 150);
  const m = new THREE.MeshBasicMaterial({
    color: 0x5a4a8f, transparent: true, opacity: 0.92, depthWrite: false, fog: false
  });
  const nebula = new THREE.Mesh(g, m);
  nebula.name = 'nebula';
  nebula.position.set(0, -4, -60);
  scene.add(nebula);
}

/* ---------------- dust clouds ---------------- */
{
  const N = 380;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    pos[i*3]   = (rnd() - 0.5) * 90;
    pos[i*3+1] = (rnd() - 0.5) * 55 - 3;
    pos[i*3+2] = -22 - rnd() * 30;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    color: 0x9a86d8, size: 1.9, sizeAttenuation: true,
    map: dotTex, transparent: true, opacity: 0.14,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const dust = new THREE.Points(g, m);
  dust.name = 'dust';
  scene.add(dust);
}

/* ---------------- earth ---------------- */
const earthShader = {
  vertexShader: `
    varying vec3 vN;
    varying vec3 vW;
    void main(){
      vN = normalize(mat3(modelMatrix) * normal);
      vec4 w = modelMatrix * vec4(position, 1.0);
      vW = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vN;
    varying vec3 vW;
    float hash(vec3 p){ p = fract(p * 0.3183098845 + 0.1); p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float vnoise(vec3 x){
      vec3 i = floor(x); vec3 f = fract(x); f = f*f*(3.0-2.0*f);
      return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
                     mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                     mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p){
      float a = 0.5; float s = 0.0;
      for (int k = 0; k < 5; k++){ s += a * vnoise(p); p *= 2.03; a *= 0.5; }
      return s;
    }
    void main(){
      vec3 n = normalize(vN);
      float cont = fbm(n * 2.2 + 7.31);
      float land = smoothstep(0.495, 0.525, cont);
      vec3 ocean = mix(vec3(0.012, 0.09, 0.24), vec3(0.03, 0.23, 0.42), fbm(n * 5.0 + 2.0));
      vec3 lcol = mix(vec3(0.09, 0.26, 0.09), vec3(0.40, 0.31, 0.14), fbm(n * 7.0 + 3.7));
      float iceM = smoothstep(0.74, 0.88, abs(n.y));
      vec3 base = mix(mix(ocean, lcol, land), vec3(0.83, 0.88, 0.95), iceM);
      float cl = smoothstep(0.54, 0.72,
        fbm(n * 3.4 + vec3(uTime * 0.02, 0.0, uTime * 0.013) + 11.0));
      vec3 sunD = normalize(vec3(-0.55, 0.35, 0.8));
      float diff = max(dot(n, sunD), 0.0);
      float fres = pow(1.0 - max(dot(n, normalize(cameraPosition - vW)), 0.0), 2.4);
      vec3 col = base * (0.05 + 1.2 * diff);
      col += base * cl * (0.22 + 0.8 * diff);
      float night = 1.0 - smoothstep(-0.15, 0.12, dot(n, sunD));
      float lights = pow(fbm(n * 15.0 + 9.2), 5.0) * land * (1.0 - iceM);
      col += vec3(1.0, 0.72, 0.38) * lights * night * 0.65;
      col += vec3(0.435, 0.714, 1.0) * fres * (0.3 + 0.7 * diff) + vec3(0.9, 0.9, 1.0) * (1.0 - land) * (1.0 - diff) * 0.02;
      gl_FragColor = vec4(col, 1.0);
    }`,
  uniforms: { uTime: { value: 0 } }
};

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(3.0, 64, 48),
  new THREE.ShaderMaterial(earthShader)
);
earth.name = 'earth';
earth.position.copy(EARTH_POS);
const earthGroup = new THREE.Group();
earthGroup.position.copy(EARTH_POS);
earth.position.set(0, 0, 0);
earthGroup.add(earth);
scene.add(earthGroup);

/* ---------------- atmosphere (halo #6fb6ff) ---------------- */
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(5.0, 48, 32),
  new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vN;
      varying vec3 vW;
      void main(){
        vN = normalize(mat3(modelMatrix) * normal);
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      varying vec3 vN;
      varying vec3 vW;
      void main(){
        vec3 n = normalize(vN);
        vec3 v = normalize(cameraPosition - vW);
        float a = pow(1.0 - abs(dot(n, v)), 1.7);
        gl_FragColor = vec4(vec3(0.435, 0.714, 1.0), a);
      }`,
    transparent: true,
    blending: THREE.NormalBlending,
    depthWrite: false,
    side: THREE.FrontSide
  })
);
atmosphere.name = 'atmosphere';
atmosphere.position.copy(EARTH_POS);
scene.add(atmosphere);

/* ---------------- aurora — two flattened torus bands #7bf0c8 ---------------- */
function makeAurora(yOff, phase){
  const g = new THREE.TorusGeometry(1.75, 0.4, 12, 72, Math.PI * 1.7);
  const m = new THREE.MeshBasicMaterial({
    color: 0x7bf0c8, transparent: true, opacity: 0.66,
    blending: THREE.NormalBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.rotation.x = Math.PI / 2;
  mesh.rotation.z = phase;
  mesh.scale.set(1.45, 1.45, 0.55); // flatten the band
  mesh.position.copy(EARTH_POS).add(new THREE.Vector3(0, yOff, 0));
  return mesh;
}
const auroraGroup = new THREE.Group();
auroraGroup.name = 'aurora';
const auroraA = makeAurora( 2.55, 0.4);
const auroraB = makeAurora(-2.55, 2.8);
auroraGroup.add(auroraA, auroraB);
scene.add(auroraGroup);

/* core hot fragment ---------------- */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(1.1, 48, 32),
  new THREE.MeshStandardMaterial({
    color: 0xff9a5a, emissive: 0xff6a2a, emissiveIntensity: 1.6,
    roughness: 0.55, metalness: 0.1
  })
);
core.name = 'core';
core.position.copy(CORE_POS);
scene.add(core);

/* core corona (soft glow halo) */
const coreGlow = new THREE.Mesh(
  new THREE.SphereGeometry(1.55, 32, 24),
  new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vN; varying vec3 vW;
      void main(){
        vN = normalize(mat3(modelMatrix) * normal);
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      varying vec3 vN; varying vec3 vW;
      void main(){
        float g = pow(1.0 - abs(dot(normalize(vN), normalize(cameraPosition - vW))), 2.6);
        gl_FragColor = vec4(vec3(1.0, 0.55, 0.28) * g * 1.5, g);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  })
);
coreGlow.position.copy(CORE_POS);
scene.add(coreGlow);

/* ---------------- orbit rings + satellites ---------------- */
const ORBIT_R = [4.2, 5.3, 6.4, 7.6];
const orbitsGroup = new THREE.Group();
orbitsGroup.name = 'orbits';
const ringDefs = [];
for (let i = 0; i < 4; i++){
  const R = ORBIT_R[i];
  const tilt = new THREE.Euler((rnd() - 0.5) * 1.1, rnd() * Math.PI * 2, (rnd() - 0.5) * 0.7);
  const g = new THREE.TorusGeometry(R, 0.14, 8, 180);
  const m = new THREE.MeshBasicMaterial({
    color: 0x7bf0c8, transparent: true, opacity: 0.25,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const ring = new THREE.Mesh(g, m);
  ring.position.copy(EARTH_POS);
  ring.rotation.set(tilt.x, tilt.y, tilt.z);
  orbitsGroup.add(ring);
  ringDefs.push({ R, quat: new THREE.Quaternion().setFromEuler(tilt) });
}
scene.add(orbitsGroup);

const satellites = new THREE.Group();
satellites.name = 'satellites';
const satDefs = [];
const satColors = [0xcdefff, 0xcdefff, 0xcdefff, 0xcdefff, 0xcdefff];
for (let i = 0; i < 5; i++){
  const rd = ringDefs[i % 4];
  const s = new THREE.Mesh(
    new THREE.SphereGeometry(0.085, 12, 8),
    new THREE.MeshBasicMaterial({ color: satColors[i] })
  );
  satellites.add(s);
  satDefs.push({
    mesh: s, R: rd.R, quat: rd.quat,
    phase: rnd() * Math.PI * 2,
    speed: 0.14 + rnd() * 0.3,
    dir: (i % 2 === 0) ? 1 : -1
  });
}
scene.add(satellites);

/* ---------------- station (left edge, debris flies past) ---------------- */
const station = new THREE.Group();
station.name = 'station';
{
  const dark = new THREE.MeshStandardMaterial({ color: 0x9aa4b8, metalness: 0.75, roughness: 0.35 });
  const hull = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.3, 1.0), dark);
  station.add(hull);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.55, 12), dark);
  hub.rotation.x = Math.PI / 2;
  station.add(hub);
  const panelMat = new THREE.MeshStandardMaterial({
    color: 0x17346e, emissive: 0x1a44a0, emissiveIntensity: 0.7,
    metalness: 0.6, roughness: 0.3
  });
  const p1 = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.025, 0.55), panelMat);
  p1.position.x = -1.05;
  const p2 = p1.clone();
  p2.position.x = 1.05;
  station.add(p1, p2);
  const dish = new THREE.Mesh(
    new THREE.SphereGeometry(0.17, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2.6),
    new THREE.MeshStandardMaterial({ color: 0xc8d2e8, metalness: 0.7, roughness: 0.3, side: THREE.DoubleSide })
  );
  dish.position.set(0, 0.32, 0.3);
  dish.rotation.x = Math.PI;
  station.add(dish);
  const blinker = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0x7bf0c8 })
  );
  blinker.name = 'blinker';
  blinker.position.set(0, 0.32, -0.42);
  station.add(blinker);
}
station.position.copy(STATION_POS);
station.rotation.y = 0.6;
scene.add(station);

/* ---------------- debris paths (LCG-driven) ---------------- */
const N_DEBRIS = 200;
const dStart = new Float32Array(N_DEBRIS * 3);
const dDir   = new Float32Array(N_DEBRIS * 3);
const dSpeed = new Float32Array(N_DEBRIS);
const dPhase = new Float32Array(N_DEBRIS);
const dLen   = new Float32Array(N_DEBRIS);
{
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpD = new THREE.Vector3();
  for (let i = 0; i < N_DEBRIS; i++){
    // start just outside the core surface
    const th = rnd() * Math.PI * 2;
    const ph = Math.acos(2 * rnd() - 1);
    const surf = new THREE.Vector3(
      Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th)
    ).multiplyScalar(1.15 + rnd() * 0.5);
    tmpA.copy(CORE_POS).add(surf);

    // endpoint: mostly earth side; spread so lines thread the station corridor
    if (rnd() < 0.45){
      // aimed near the station, then continuing toward/away — passes it closely
      tmpB.copy(STATION_POS).add(new THREE.Vector3(
        (rnd() - 0.5) * 2.2, (rnd() - 0.5) * 1.6, (rnd() - 0.5) * 2.2));
      // extend the target past the corridor toward earth
      tmpD.copy(EARTH_POS).sub(STATION_POS).normalize().multiplyScalar(4 + rnd() * 5);
      tmpB.add(tmpD);
    } else {
      tmpB.copy(EARTH_POS).add(new THREE.Vector3(
        (rnd() - 0.5) * 5.0, (rnd() - 0.5) * 3.5, (rnd() - 0.5) * 3.0));
    }
    tmpD.copy(tmpB).sub(tmpA).normalize();
    dDir[i*3]   = tmpD.x; dDir[i*3+1] = tmpD.y; dDir[i*3+2] = tmpD.z;
    dSpeed[i] = 0.55 + rnd() * 0.95;
    dPhase[i] = rnd() * 20;
    dLen[i] = 9 + rnd() * 5;
    dStart[i*3] = tmpA.x; dStart[i*3+1] = tmpA.y; dStart[i*3+2] = tmpA.z;
  }
}

const debrisPos = new Float32Array(N_DEBRIS * 3);
const debrisGeo = new THREE.BufferGeometry();
debrisGeo.setAttribute('position', new THREE.BufferAttribute(debrisPos, 3));
// bright cores (solid colour) + additive glow halo
const debrisCore = new THREE.Points(debrisGeo, new THREE.PointsMaterial({
  color: 0xffb070, size: 1.45, sizeAttenuation: true,
  map: dotTexCore, transparent: true, opacity: 1.0, depthWrite: false
}));
debrisCore.name = 'cloud_debris';
debrisCore.renderOrder = 11;
const debrisGlow = new THREE.Points(debrisGeo, new THREE.PointsMaterial({
  color: 0xffb070, size: 2.6, sizeAttenuation: true,
  map: dotTex, transparent: true, opacity: 0.3,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
debrisGlow.renderOrder = 10;
scene.add(debrisCore, debrisGlow);
const cloud_debris = debrisCore;

let aheadGlobal = 0;
function updateDebris(t){
  let ahead = 0;
  for (let i = 0; i < N_DEBRIS; i++){
    const s = (t * dSpeed[i] + dPhase[i]) % dLen[i];
    const x = dStart[i*3]   + dDir[i*3]   * s;
    const y = dStart[i*3+1] + dDir[i*3+1] * s;
    const z = dStart[i*3+2] + dDir[i*3+2] * s;
    debrisPos[i*3] = x; debrisPos[i*3+1] = y; debrisPos[i*3+2] = z;
    const dx = x - STATION_POS.x, dy = y - STATION_POS.y, dz = z - STATION_POS.z;
    if (dx*dx + dy*dy + dz*dz < 2.76 * 2.76) ahead++;
  }
  debrisGeo.attributes.position.needsUpdate = true;
  aheadGlobal = ahead;
}

/* ---------------- trajectory lines ---------------- */
{
  const lines = [];
  for (let k = 0; k < 14; k++){
    const a = rnd() * Math.PI * 2, b = Math.acos(2 * rnd() - 1);
    const off1 = new THREE.Vector3(
      Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a)
    ).multiplyScalar(1.2 + rnd() * 0.4);
    const off2 = new THREE.Vector3((rnd()-0.5)*8, (rnd()-0.5)*6, (rnd()-0.5)*3);
    const p0 = CORE_POS.clone().add(off1);
    const p1 = EARTH_POS.clone().add(off2);
    const p2 = p1.clone().add(p1.clone().sub(p0).clone().normalize().multiplyScalar(3 + rnd()*3));
    const curve = new THREE.QuadraticBezierCurve3(p0, p0.clone().lerp(p1, 0.5).add(new THREE.Vector3((rnd()-0.5)*1.5,(rnd()-0.5)*1.5,(rnd()-0.5)*1.5)), p2);
    const g = new THREE.BufferGeometry().setFromPoints(curve.getPoints(28));
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({
      color: 0xffb070, transparent: true, opacity: 0.16,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    lines.push(l);
  }
  const traj = new THREE.Group();
  traj.name = 'trails';
  traj.add(...lines);
  scene.add(traj);
}

/* ---------------- camera path ---------------- */
const camPosFrom = new THREE.Vector3(0.6, 0.4, 4);
const camPosTo   = new THREE.Vector3(-0.19, 1.16, 12);
const camTgtFrom = new THREE.Vector3(-3.2, 1.4, -12);   // start: watching the shattered core
const camTgtTo   = new THREE.Vector3(0.4, -0.8, -12.6); // end: full panorama
function updateCamera(t){
  let u = t / 6.0;
  if (u < 0) u = 0; if (u > 1) u = 1;
  const e = u * u * (3 - 2 * u);
  camera.position.lerpVectors(camPosFrom, camPosTo, e);
  const tgt = new THREE.Vector3().lerpVectors(camTgtFrom, camTgtTo, e);
  camera.lookAt(tgt);
}

/* ---------------- state ---------------- */
let t = 0;

function renderFrame(){
  updateDebris(t); // recomputes aheadGlobal too
  // earth slow rotation (clouds via uTime)
  earth.rotation.y = t * 0.06;
  earthShader.uniforms.uTime.value = t;
  // aurora flicker + drift
  auroraA.rotation.y = 0.4 + t * 0.22;
  auroraB.rotation.y = 2.8 - t * 0.17;
  auroraA.material.opacity = 0.62 + 0.18 * Math.sin(t * 2.1);
  auroraB.material.opacity = 0.62 + 0.18 * Math.sin(t * 1.7 + 1.3);
  // satellites around their rings
  for (let i = 0; i < satDefs.length; i++){
    const sd = satDefs[i];
    const a = sd.phase + sd.dir * t * sd.speed;
    tmpV.set(Math.cos(a) * sd.R, Math.sin(a) * sd.R, 0).applyQuaternion(sd.quat);
    sd.mesh.position.copy(EARTH_POS).add(tmpV);
  }
  // station blink
  station.getObjectByName('blinker').scale.setScalar(
    0.7 + 0.6 * (0.5 + 0.5 * Math.sin(t * 4.0)));
  // core breathing
  coreLight.intensity = 2.6 + 0.9 * Math.sin(t * 3.1) + 0.4 * Math.sin(t * 7.3);
  core.scale.setScalar(1.0 + 0.04 * Math.sin(t * 2.3));
  updateCamera(t);
  renderer.render(scene, camera);
}
const tmpV = new THREE.Vector3();

function probe(){
  return {
    t: Number(t.toFixed(4)),
    objects: ['earth','atmosphere','aurora','core','cloud_debris','orbits',
              'satellites','station','nebula','stars'],
    ahead: aheadGlobal
  };
}
window.__probe = probe;

window.__step = function(dt){
  t += dt;
  renderFrame();
  return window.__probe();
};

/* first frame — scene beginning */
renderFrame();
window.__ready = true;
</script>
</body>
</html>
