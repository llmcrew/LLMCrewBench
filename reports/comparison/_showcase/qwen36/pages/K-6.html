<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Free Rotation of Rigid Body</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
  const THREE = window.THREE;

  // --- Scene Setup ---
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
  camera.position.set(0.0, 2.4, 7.5);
  camera.lookAt(0.0, 1.8, 0.0);

  const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(800, 600, false);
  document.body.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
  dirLight.position.set(5.0, 9.0, 8.0);
  scene.add(dirLight);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(30, 30);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b3a4a });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.name = 'ground';
  scene.add(ground);

  // Body
  const bodyGeo = new THREE.BoxGeometry(2.54, 1.06, 0.8);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd97a3a });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.set(0, 1.8, 0);
  body.name = 'body';
  scene.add(body);

  // Marker
  const markerGeo = new THREE.SphereGeometry(0.14, 16, 16);
  const markerMat = new THREE.MeshStandardMaterial({ color: 0x9fd8ff });
  const marker = new THREE.Mesh(markerGeo, markerMat);
  marker.position.set(1.39, 0, 0);
  body.add(marker);

  // --- Physics State ---
  let omega = [3.69, 0.36, 0.28];
  const I = [0.147, 0.591, 0.6313];
  let steps = 0;
  let t = 0.0;
  let bodyQuaternion = new THREE.Quaternion();

  // --- Simulation Functions ---
  window.__step = function(dt) {
    let w1 = omega[0], w2 = omega[1], w3 = omega[2];
    let I1 = I[0], I2 = I[1], I3 = I[2];

    // Semi-implicit Euler (strict order)
    w1 += (I2 - I3) / I1 * w2 * w3 * dt;
    w2 += (I3 - I1) / I2 * w3 * w1 * dt;
    w3 += (I1 - I2) / I3 * w1 * w2 * dt;

    omega[0] = w1;
    omega[1] = w2;
    omega[2] = w3;

    t += dt;
    steps++;

    // Update orientation (omega is in body frame)
    let wLen = Math.sqrt(w1 * w1 + w2 * w2 + w3 * w3);
    if (wLen > 1e-10) {
      let axis = new THREE.Vector3(w1 / wLen, w2 / wLen, w3 / wLen);
      let angle = wLen * dt;
      let deltaQ = new THREE.Quaternion().setFromAxisAngle(axis, angle);
      bodyQuaternion.multiply(deltaQ);
      bodyQuaternion.normalize();
    }
    body.quaternion.copy(bodyQuaternion);

    renderer.render(scene, camera);
    return __probe();
  };

  window.__probe = function() {
    return {
      steps: steps,
      t: Number(t.toFixed(4)),
      objects: ["ground", "body", "marker"],
      camera: [0, 2.4, 7.5],
      omega: [Number(omega[0].toFixed(4)), Number(omega[1].toFixed(4)), Number(omega[2].toFixed(4))],
      inertia: [Number(I[0].toFixed(4)), Number(I[1].toFixed(4)), Number(I[2].toFixed(4))]
    };
  };

  // --- Initialization ---
  window.__ready = true;
  renderer.render(scene, camera);
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
