<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{margin:0;background:#1d1638;overflow:hidden}
canvas{display:block;width:1920px;height:1080px}
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* -------- LCG (deterministic) -------- */
var _ls = 800660;
function _lR(){
  _ls = (1664525 * _ls + 1013904223) % 4294967296;
  return _ls / 4294967296;
}

/* -------- Constants -------- */
var W = 1920, H = 1080;
var HALF_H = Math.tan(Math.PI * 45 / 360) * 10;  // ≈ 4.142
var R0 = HALF_H;    // reference radius (half-height)
var TAU = 2 * Math.PI;

/* -------- Scene & Camera -------- */
var scene = new THREE.Scene();

var camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 200);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

var renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x1d1638, 1);
renderer.domElement.style.width  = '1920px';
renderer.domElement.style.height = '1080px';
document.body.appendChild(renderer.domElement);

/* -------- Core-glow plane -------- */
var gsz = 0.55 * R0;
var gCanvas = document.createElement('canvas');
gCanvas.width = gCanvas.height = 512;
var gCtx = gCanvas.getContext('2d');

var gGrad = gCtx.createRadialGradient(256, 256, 0, 256, 256, 256);
gGrad.addColorStop(0,   'rgba(255,210,80,1)');
gGrad.addColorStop(0.35,'rgba(255,160,20,0.55)');
gGrad.addColorStop(0.75,'rgba(255,80,10,0.12)');
gGrad.addColorStop(1,   'rgba(255,50,5,0)');
gCtx.fillStyle = gGrad;
gCtx.fillRect(0, 0, 512, 512);

var glowMat = new THREE.MeshBasicMaterial({
  map: new THREE.CanvasTexture(gCanvas),
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthTest: false,
  side: THREE.DoubleSide
});
var glowMesh = new THREE.Mesh(new THREE.PlaneGeometry(gsz, gsz), glowMat);
glowMesh.renderOrder = 0;
scene.add(glowMesh);

/* -------- Colors & Sizes -------- */
var CLR = [0xffbf00, 0xff0080, 0x0cb7f0];   // core / arm / edge
var SZ  = [3.2, 2.8, 2.4];
var NM  = ['stars_core', 'stars_arm', 'stars_edge'];

/* -------- Generate point data -------- */
var Arm = [], CoreC = [], Halo = [];

// --- 7 000 spiral-arm points (3 RNG calls each) ---
for (var i = 0; i < 7000; i++) {
  var u = _lR(), v = _lR(), w = _lR();
  var g  = u + v + w - 1.5;
  var q  = 0.14 + 0.86 * Math.pow(u, 0.62);
  var r  = 0.44 * R0 * q;
  var th = 1.60 * TAU * q + Math.PI * Math.floor(v * 2) + g * 0.50 * (1 - 0.45 * q);
  var z  = (w - 0.5) * 0.10 * r * (0.4 + q);
  var ci = q <= 0.38 ? 0 : (q <= 0.70 ? 1 : 2);
  Arm.push({ r: r, rn: r / R0, t: th, z: z, ci: ci });
}

// --- 2 500 core-cluster points (1 RNG call each) ---
for (var i = 0; i < 2500; i++) {
  var u = _lR();
  var a = TAU * u;
  var r = 0.22 * R0 * Math.pow(u, 0.55);
  var z = (u - 0.5) * 0.09 * R0;
  CoreC.push({ r: r, rn: r / R0, t: a, z: z, ci: 0 });
}

// --- 1 500 dust-halo points (1 RNG call each) ---
for (var i = 0; i < 1500; i++) {
  var u = _lR();
  var a = TAU * u;
  var r = R0 * (0.60 + 0.85 * u);
  Halo.push({ r: r, rn: r / R0, t: a, z: 0, ci: 2 });
}

/* -------- Partition into three clouds -------- */
function filterBy(ci, arr) { return arr.filter(function(p){ return p.ci === ci; }); }

var CP = filterBy(0, Arm).concat(CoreC);   // core zone + cluster
var AP = filterBy(1, Arm);                  // mid-arm zone
var EP = filterBy(2, Arm).concat(Halo);     // outer zone + halo

/* -------- Build Points meshes -------- */
function makeCloud(pts, hexColour, sz) {
  var n   = pts.length;
  var pos = new Float32Array(n * 3);

  for (var i = 0; i < n; i++) {
    pos[i * 3]     = pts[i].r * Math.cos(pts[i].t);
    pos[i * 3 + 1] = pts[i].r * Math.sin(pts[i].t);
    pos[i * 3 + 2] = pts[i].z;
  }

  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  var mat = new THREE.PointsMaterial({
    size: sz,
    color: hexColour,
    sizeAttenuation: false,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: false
  });

  var mesh = new THREE.Points(geo, mat);

  /* sync – called each animation step */
  mesh._sync = function () {
    for (var i = 0; i < n; i++) {
      pos[i * 3]     = pts[i].r * Math.cos(pts[i].t);
      pos[i * 3 + 1] = pts[i].r * Math.sin(pts[i].t);
      pos[i * 3 + 2] = pts[i].z;
    }
    geo.attributes.position.needsUpdate = true;
  };

  return mesh;
}

var coreMesh = makeCloud(CP, CLR[0], SZ[0]);
coreMesh.name = 'stars_core';
coreMesh.renderOrder = 1;

var armMesh  = makeCloud(AP, CLR[1], SZ[1]);
armMesh.name  = 'stars_arm';
armMesh.renderOrder = 2;

var edgeMesh = makeCloud(EP, CLR[2], SZ[2]);
edgeMesh.name = 'stars_edge';
edgeMesh.renderOrder = 3;

scene.add(coreMesh, armMesh, edgeMesh);

/* -------- Time & animation -------- */
var simT = 0;
var simSpin = 0;

window.__step = function (dt) {
  if (dt <= 0) return;
  simT   += dt;
  simSpin += 0.55 * dt;

  // rotate every point differentially
  var all = [];
  for (var i = 0; i < CP.length  ; i++) all[all.length] = CP[i];
  for (var i = 0; i < AP.length  ; i++) all[all.length] = AP[i];
  for (var i = 0; i < EP.length  ; i++) all[all.length] = EP[i];

  for (var i = 0; i < all.length; i++) {
    var dth = 0.55 * dt / (0.25 + all[i].rn);
    all[i].t += dth;
  }

  coreMesh._sync();
  armMesh._sync();
  edgeMesh._sync();
};

window.__probe = function () {
  // radial ring counts (normalized radius bins)
  var rc = [0, 0, 0, 0];
  var all = [];
  for (var i = 0; i < CP.length; i++) all[all.length] = CP[i];
  for (var i = 0; i < AP.length; i++) all[all.length] = AP[i];
  for (var i = 0; i < EP.length; i++) all[all.length] = EP[i];

  for (var i = 0; i < all.length; i++) {
    if      (all[i].rn < 0.25) rc[0]++;
    else if (all[i].rn < 0.5)  rc[1]++;
    else if (all[i].rn < 0.75) rc[2]++;
    else                       rc[3]++;
  }

  return {
    t:       simT.toFixed(4),
    spin:    simSpin.toFixed(4),
    objects: [coreMesh.name, armMesh.name, edgeMesh.name],
    rings:   rc
  };
};

/* -------- Initial frame & ready flag -------- */
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
