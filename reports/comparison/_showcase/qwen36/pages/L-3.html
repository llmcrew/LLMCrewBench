<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Mandala</title>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<script type="module">
const THREE = window.THREE;

// ── constants ──────────────────────────────────────────────
const HR  = 6.627;           // frame height at mandala plane (z=0)
const W   = 1920;
const H   = 1080;
const PI2 = Math.PI * 2;

// palette
const C_BG    = new THREE.Color('#0a0a24');
const C_GOLD  = new THREE.Color('#ffd257');
const C_PINK  = new THREE.Color('#ff3aa8');
const C_CYAN  = new THREE.Color('#2ee6ff');

// scale factors from spec
const coreR       = 0.06 * HR;       // 0.39762 — core disc radius
const coreThick   = 0.004 * HR;      // 0.0265  — torus tube on core
const coreHubH    = 0.08 * HR;       // 0.5302  — central cylinder height

const rayMinR     = 0.10 * HR;       // 0.6627
const rayMaxR     = 0.34 * HR;       // 2.25318
const rayW        = 0.03 * HR;       // 0.19881
const rayLen      = rayMaxR - rayMinR; // 1.59048

const tipR        = 0.022 * HR;      // 0.145794
const tipThick    = 0.018 * HR;      // 0.1193  — cylinder thickness for tips

const s2MinR      = 0.10 * HR;       // 0.6627
const s2MaxR      = 0.20 * HR;       // 1.3254
const s2W         = 0.042 * HR;      // 0.278334
const s2Len       = s2MaxR - s2MinR;  // 0.6627

const ring1R      = 0.16 * HR;       // 1.06032
const ring1TubeR  = 0.012 * HR;      // 0.079524
const ring2R      = 0.34 * HR;       // 2.25318
const ring2TubeR  = 0.006 * HR;      // 0.039762

// ── scene / camera / renderer ──────────────────────────────
const scene   = new THREE.Scene();
scene.background = C_BG;

const camera  = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
camera.position.set(0, 0, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
document.body.appendChild(renderer.domElement);

// ── materials (basic, double-sided — no lights needed) ────
const matGold  = new THREE.MeshBasicMaterial({ color: C_GOLD, side: THREE.DoubleSide });
const matPink  = new THREE.MeshBasicMaterial({ color: C_PINK, side: THREE.DoubleSide });
const matCyan  = new THREE.MeshBasicMaterial({ color: C_CYAN, side: THREE.DoubleSide });

// ── core: disk + torus ring + small central cylinder ───────
const coreMesh = new THREE.Mesh(
    new THREE.CircleGeometry(coreR, 48),
    matGold
);
coreMesh.name = 'core';

const coreRingMesh = new THREE.Mesh(
    new THREE.TorusGeometry(coreR * 0.92, coreThick, 8, 64),
    matGold
);
coreRingMesh.name = 'coreRing';

const coreCylinder = new THREE.Mesh(
    new THREE.CylinderGeometry(coreR * 0.3, coreR * 0.3, coreHubH, 32),
    matGold
);
coreCylinder.rotation.x = Math.PI / 2;      // axis toward camera
coreCylinder.name = 'coreCylinder';

// ── wheel (the rotating group) ─────────────────────────────
const wheel = new THREE.Group();
wheel.name = 'wheel';

// — main petals (12 flat planes, alternating pink/cyan) ───
const petals = new THREE.Group();
petals.name = 'petals';

for (let i = 0; i < 12; i++) {
    const angle = (i * 30) * Math.PI / 180;
    const petalColor = (i % 2 === 0) ? matPink : matCyan;

    // flat blade — PlaneGeometry
    const blade = new THREE.Mesh(
        new THREE.PlaneGeometry(rayW, rayLen),
        petalColor
    );
    blade.position.set(
        (rayMinR + rayLen / 2) * Math.cos(angle),
        (rayMinR + rayLen / 2) * Math.sin(angle),
        0
    );
    blade.rotation.z = angle;
    blade.name = 'ray_' + i;
    petals.add(blade);

    // tip — thin CylinderGeometry (circular disc viewed from front)
    const tip = new THREE.Mesh(
        new THREE.CylinderGeometry(tipR, tipR, tipThick, 24),
        petalColor
    );
    tip.position.set(
        rayMaxR * Math.cos(angle),
        rayMaxR * Math.sin(angle),
        0
    );
    tip.rotation.x = Math.PI / 2;
    tip.name = 'tip_' + i;
    petals.add(tip);
}

// — secondary petals (12, shifted 15°, gold, fills gaps) ──
for (let i = 0; i < 12; i++) {
    const angle = ((i * 30) + 15) * Math.PI / 180;

    const blade = new THREE.Mesh(
        new THREE.PlaneGeometry(s2W, s2Len),
        matGold
    );
    blade.position.set(
        (s2MinR + s2Len / 2) * Math.cos(angle),
        (s2MinR + s2Len / 2) * Math.sin(angle),
        0
    );
    blade.rotation.z = angle;
    blade.name = 'ray2_' + i;
    petals.add(blade);
}

// — outer decorative tori on petals (at each outer tip) ──
for (let i = 0; i < 12; i++) {
    const angle = (i * 30) * Math.PI / 180;
    const ringMat = (i % 2 === 0) ? matGold : matGold;  // decorative gold ring

    const torus = new THREE.Mesh(
        new THREE.TorusGeometry(tipR * 0.5, 0.004 * HR, 8, 16),
        ringMat
    );
    torus.position.set(
        rayMaxR * Math.cos(angle),
        rayMaxR * Math.sin(angle),
        0
    );
    torus.name = 'petalTorus_' + i;
    petals.add(torus);
}

// — decorative small cylinders between some main rays ──
const cylCount = 12;
for (let i = 0; i < cylCount; i++) {
    if (i % 3 !== 0) continue;  // every 3rd ray gets a small cylinder
    const angle = (i * 30) * Math.PI / 180;
    const cylR = 0.012 * HR;
    const cylH = rayLen * 0.3;

    const cyl = new THREE.Mesh(
        new THREE.CylinderGeometry(cylR, cylR, cylH, 12),
        matGold
    );
    cyl.position.set(
        (rayMinR + rayLen * 0.7) * Math.cos(angle),
        (rayMinR + rayLen * 0.7) * Math.sin(angle),
        0
    );
    cyl.rotation.x = Math.PI / 2;
    cyl.name = 'decoCyl_' + i;
    petals.add(cyl);
}

// — rings ────────────────────────────────────────────────
const ringInner = new THREE.Mesh(
    new THREE.TorusGeometry(ring1R, ring1TubeR, 16, 64),
    matGold
);
ringInner.name = 'ringInner';

const ringOuter = new THREE.Mesh(
    new THREE.TorusGeometry(ring2R, ring2TubeR, 12, 64),
    matCyan
);
ringOuter.name = 'ringOuter';

// ── assemble into wheel ──────────────────────────────────
wheel.add(coreMesh, coreRingMesh, coreCylinder, petals, ringInner, ringOuter);
scene.add(wheel);

// ── initial render (t = 0, no rotation) ──────────────────
renderer.render(scene, camera);

// ── animation: wheel rotates on Z ────────────────────────
let t = 0;

function probe() {
    const angleDeg = wheel.rotation.z * 180 / Math.PI;
    const objects = [];
    wheel.traverse(function(obj) { if (obj.name) objects.push(obj.name); });
    return {
        t: parseFloat(t.toFixed(4)),
        objects: objects,
        angle: parseFloat(angleDeg.toFixed(4))
    };
}

window.__step = function(dt) {
    t += dt;
    wheel.rotation.z = 0.2014 * t;
    renderer.render(scene, camera);
    return probe();
};

window.__probe = probe;
window.__ready = true;
</script>
</body>
</html>
