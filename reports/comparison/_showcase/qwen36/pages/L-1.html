<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="importmap">
{"imports": {"three": "./vendor/three.module.js"}}
</script>
<script type="module">
const THREE = window.THREE;

/* ─── constants ─── */
const FOV        = 45;
const ASPECT     = 800 / 600;
const NEAR       = 0.1;
const FAR        = 200;
const CAM_Y      = 0.2;
const DIST       = 12;
const TAN_HF     = Math.tan(FOV * Math.PI / 360);          // tan(22.5°)
const FH         = 2 * DIST * TAN_HF;                       // frame height ≈ 9.9415
const FW         = FH * ASPECT;                              // frame width  ≈ 13.2553
const SKY_H      = 5.169;                                    // sky plane height
const SEA_H      = 4.772;                                    // sea plane height
const HZ         = 0.0015;                                   // horizon world Y
const SUN_R      = 0.075 * FH;                               // sun radius ≈ 0.7456
const SUN_SPD    = 0.040 * FH;                               // descent speed ≈ 0.3977 units/s
const RIPPLE_STP = 0.024 * FH;                               // ripple band spacing ≈ 0.2386
const RIPPLE_PH  = 0.386;                                    // ripple phase

/* initial sun position (0.41, 0.70 as fractions of frame) */
const SUN_X = (0.41 - 0.5) * FW;                             // ≈ -1.192
const SUN_Y0 = -DIST * TAN_HF + CAM_Y + 0.70 * FH;           // ≈ 2.188

/* ─── scene, camera ─── */
const scene  = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(FOV, ASPECT, NEAR, FAR);
camera.position.set(0, CAM_Y, 0);
camera.lookAt(0, CAM_Y, -1);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

/* ─── sky plane ─── */
const skyGeo = new THREE.PlaneGeometry(40, SKY_H);
skyGeo.translate(0, HZ + SKY_H / 2, 0);                       // position centre
const skyMat = new THREE.ShaderMaterial({
    uniforms: {
        topC:       { value: new THREE.Color('#1b2a4a') },
        horizonC:   { value: new THREE.Color('#ff7a3d') }
    },
    vertexShader: `
        varying float vY;
        void main() {
            vY = position.y;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
    fragmentShader: `
        uniform vec3 topC, horizonC;
        varying float vY;
        void main() {
            float t = clamp((vY - ${HZ.toFixed(7)}) / ${SKY_H}, 0.0, 1.0);
            gl_FragColor = vec4(mix(horizonC, topC, t), 1.0);
        }`,
    side: THREE.DoubleSide
});
const sky = new THREE.Mesh(skyGeo, skyMat);
sky.name = 'sky';
scene.add(sky);

/* ─── sea plane ─── */
const seaGeo = new THREE.PlaneGeometry(40, SEA_H);
seaGeo.translate(0, HZ - SEA_H / 2, 0);                       // position centre
const seaMat = new THREE.ShaderMaterial({
    uniforms: {
        horizonC:   { value: new THREE.Color('#ff7a3d') },
        bottomC:    { value: new THREE.Color('#20283a') },
        bandStep:   { value: RIPPLE_STP },
        bandPhase:  { value: RIPPLE_PH },
        hzY:        { value: HZ }
    },
    vertexShader: `
        varying float vY;
        void main() {
            vY = position.y;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
    fragmentShader: `
        uniform vec3 horizonC, bottomC;
        uniform float bandStep, bandPhase, hzY;
        varying float vY;
        void main() {
            float seaBottom = hzY - ${SEA_H};
            float t2 = clamp((vY - seaBottom) / ${SEA_H}, 0.0, 1.0);
            vec3 col = mix(bottomC, horizonC, t2);
            float rip = sin(vY * ${Math.PI.toFixed(10)} / bandStep + bandPhase);
            col *= 1.0 + rip * 0.12;
            gl_FragColor = vec4(col, 1.0);
        }`,
    side: THREE.DoubleSide
});
const sea = new THREE.Mesh(seaGeo, seaMat);
sea.name = 'sea';
scene.add(sea);

/* ─── sun ─── */
const sunGeo = new THREE.CircleGeometry(SUN_R, 32);
const sunMat = new THREE.MeshBasicMaterial({ color: '#ffd08a' });
const sun = new THREE.Mesh(sunGeo, sunMat);
sun.scale.y = 0.55;
sun.position.set(SUN_X, SUN_Y0, -DIST);
sun.name = 'sun';
scene.add(sun);

/* ─── sun reflection ─── */
const sunReflectionGeo = new THREE.CircleGeometry(SUN_R, 32);
const sunReflectionMat = new THREE.MeshBasicMaterial({ color: '#ffd08a' });
const sunReflection = new THREE.Mesh(sunReflectionGeo, sunReflectionMat);
sunReflection.scale.y = 2.5;
sunReflection.name = 'sun_reflection';
scene.add(sunReflection);

/* ─── animation state & helpers ─── */
let currentSunY = SUN_Y0;

function updateReflection() {
    const reflY = 2 * HZ - currentSunY;
    sunReflection.position.set(sun.position.x, reflY, -DIST);
}
updateReflection();

/* ─── public API ─── */
window.__step = function(dt) {
    t += dt;
    if (!sun.reachedHorizon) {
        currentSunY -= SUN_SPD * dt;
        if (currentSunY < HZ) {
            currentSunY = HZ;
            sun.reachedHorizon = true;
        }
        sun.position.y = currentSunY;
        updateReflection();
    }
};

let t = 0;

window.__probe = function() {
    return {
        t: parseFloat(t.toFixed(4)),
        objects: ['sky', 'sea', 'sun', 'sun_reflection'],
        sun: [
            parseFloat(sun.position.x.toFixed(4)),
            parseFloat(sun.position.y.toFixed(4))
        ]
    };
};

/* ─── first render ─── */
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
