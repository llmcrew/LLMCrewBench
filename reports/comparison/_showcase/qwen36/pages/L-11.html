<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Liquid Metal and Glass</title>
<style>
body { margin: 0; overflow: hidden; background: #0a0714; }
canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
const THREE = window.THREE;

// ── Renderer ──
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ── Environment-map DataTexture 8 × 64 ──
// Gradient: bottom → top  #0a0714 → #0d1b2e → #1b4a5e → #8fd3ff
// ~16 rows per band; sky brightens only at very top → two narrow bright bands
const c = [
  [0x0a, 0x07, 0x14],  // #0a0714  rows 0-15
  [0x0d, 0x1b, 0x2e],  // #0d1b2e  rows 16-31
  [0x1b, 0x4a, 0x5e],  // #1b4a5e  rows 32-47
  [0x8f, 0xd3, 0xff],  // #8fd3ff  rows 48-63
];
const data = new Float32Array(8 * 64 * 4);
for (let row = 0; row < 64; row++) {
  const i = Math.min(Math.floor(row / 16), 3);
  const px = row * 8;
  for (let col = 0; col < 8; col++) {
    const o = (px + col) * 4;
    data[o]     = c[i][0] / 255;
    data[o + 1] = c[i][1] / 255;
    data[o + 2] = c[i][2] / 255;
    data[o + 3] = 1;
  }
}
const envMap = new THREE.DataTexture(data, 8, 64, THREE.RGBAFormat, THREE.FloatType);
envMap.mapping = THREE.EquirectangularReflectionMapping;
envMap.needsUpdate = true;

// ── Scene & Camera ──
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0714, 14, 45);

const camera = new THREE.PerspectiveCamera(
  45, 1920 / 1080, 0.1, 100);
camera.position.set(0, 1.0, 3.5);
camera.lookAt(0, 0.4, 0.6);

// ── Sphere ──
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.8, 48, 32),
  new THREE.MeshPhysicalMaterial({
    color: 0x33d1c6, metalness: 1.0, roughness: 0.18,
    clearcoat: 0.6, envMapIntensity: 3.0, envMap,
  }));
sphere.name = 'sphere';
sphere.position.set(0, 0.40, 0.60);
scene.add(sphere);

// ── Torus ──
const torus = new THREE.Mesh(
  new THREE.TorusGeometry(0.80, 0.28, 16, 64),
  new THREE.MeshPhysicalMaterial({
    color: 0xe0733c, metalness: 0.15, roughness: 0.06,
    clearcoat: 1.0, envMapIntensity: 2.0, envMap,
  }));
torus.name = 'torus';
torus.position.set(-1.45, -0.25, -0.6);
scene.add(torus);

// ── Floor ──
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshPhysicalMaterial({
    color: 0x121a2e, metalness: 0.85, roughness: 0.30,
  }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.20;
scene.add(floor);

// ── Background plane (same gradient as env-map, 2D mapped) ──
const bg = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshBasicMaterial({
    map: envMap, transparent: true,
    side: THREE.FrontSide, depthWrite: false,
  }));
bg.position.z = -6;
scene.add(bg);

// ── Lights ──
const dirLight = new THREE.DirectionalLight(0xffffff, 4.0);
dirLight.position.set(2.0, 4.0, 3.0);
scene.add(dirLight);

const sparkle = new THREE.PointLight(0xf2f6fb, 120, 25);
sparkle.position.set(0.6, 2.6, 2.2);
scene.add(sparkle);

const pLight1 = new THREE.PointLight(0x33d1c6, 45, 25);
const pLight2 = new THREE.PointLight(0xe0733c, 45, 25);
scene.add(pLight1);
scene.add(pLight2);

scene.add(new THREE.AmbientLight(0x223044, 0.3));

// ── Animation ──
let lastTime = 0;

// initial render for __ready
renderer.render(scene, camera);
window.__ready = true;

window.__step = function(dt) {
  const t = lastTime + dt;

  sphere.rotation.y += 1.100 * dt;
  sphere.rotation.x += 0.400 * dt;
  torus.rotation.y   += 0.700 * dt;

  const phase = 0.900 * t + 0.052;
  // orbit radius 3.2, plane xz, centre (0, 4, 2)
  pLight1.position.set(3.2 * Math.cos(phase), 4.0,
    3.2 * Math.sin(phase) + 2.0);
  pLight2.position.set(3.2 * Math.cos(phase), 4.0,
    3.2 * Math.sin(phase) + 2.0);

  lastTime = t;

  renderer.render(scene, camera);

  return window.__probe();
};

window.__probe = function() {
  const lp = new THREE.Vector3();
  sparkle.getWorldPosition(lp);
  return {
    t: Number((lastTime).toFixed(4)),
    objects: [
      {
        name: 'sphere',
        position: [
          +sphere.position.x.toFixed(4),
          +sphere.position.y.toFixed(4),
          +sphere.position.z.toFixed(4),
        ],
      },
      {
        name: 'torus',
        position: [
          +torus.position.x.toFixed(4),
          +torus.position.y.toFixed(4),
          +torus.position.z.toFixed(4),
        ],
      },
      {
        name: 'floor',
        position: [0, -1.20, 0],
      },
    ],
    angle: Number(sphere.rotation.y.toFixed(4)),
    light: [
      +lp.x.toFixed(4),
      +lp.y.toFixed(4),
      +lp.z.toFixed(4),
    ],
  };
};
</script>
</body>
</html>
