<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Робот-ремонтник под дождём</title>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
const THREE = window.THREE;

/* ═══════════════════ LCG ═══════════════════ */
let lcgState = 238931;
function seededR() {
  lcgState = (lcgState * 1103515245 + 12345) & 0x7FFFFFFF;
  return lcgState / 2147483648;
}

/* ═══════════════════ Renderer ═══════════════════ */
const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(1920,1080,false);
document.body.appendChild(renderer.domElement);

/* ═══════════════════ Scene ═══════════════════ */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x08080f,18,50);

/* ═══════════════════ Camera ═══════════════════ */
const camera = new THREE.PerspectiveCamera(50,1920/1080,0.1,100);
camera.position.set(0,1.6,4.0);
camera.lookAt(0,-0.3,-8);

/* ═══════════════════ Colours ═══════════════════ */
const C_NIGHT=0x1b1a2a, C_SIGN=0xff2f7a, C_SPARK=0xffd94a, C_RAIN=0xa8c8dc, C_ASLT=0x14121f;

/* ═══════════════════ Lights ═══════════════════ */
scene.add(new THREE.AmbientLight(0x0c0c1a,0.35));

const splt = new THREE.PointLight(C_SIGN,2.5,18,1.5);
splt.position.set(-5.5,5.8,-14);
scene.add(splt);

const lpt = new THREE.PointLight(C_SPARK,0.8,6,2);
scene.add(lpt);

const sfl = new THREE.DirectionalLight(C_SIGN,0.15);
sfl.position.set(-3,8,-10);
sfl.target.position.set(0,0,0);
scene.add(sfl); scene.add(sfl.target);

/* ═══════════════════ Materials ═══════════════════ */
const mNight   = new THREE.MeshBasicMaterial({color:C_NIGHT});
const mWall    = new THREE.MeshStandardMaterial({color:C_NIGHT,roughness:0.95});
const mAslt    = new THREE.MeshStandardMaterial({color:C_ASLT,roughness:0.45,metalness:0.1});
const mSign    = new THREE.MeshBasicMaterial({color:C_SIGN,transparent:true,opacity:1.0});
const mRobot   = new THREE.MeshStandardMaterial({color:C_NIGHT,roughness:0.65,metalness:0.3});
const mHead    = new THREE.MeshStandardMaterial({color:0x23223a,roughness:0.5,metalness:0.2});
const mEye     = new THREE.MeshBasicMaterial({color:C_RAIN});
const mLamp    = new THREE.MeshBasicMaterial({color:C_SPARK});
const mWet     = new THREE.MeshBasicMaterial({color:C_RAIN,transparent:true,opacity:0.12});
const mPud     = new THREE.MeshBasicMaterial({color:C_SIGN,transparent:true,opacity:0.4});
const spd      = new THREE.MeshBasicMaterial({color:C_SPARK});
spd.blending = THREE.AdditiveBlending; spd.transparent=true; spd.opacity=0.9;
const mDrp     = new THREE.MeshBasicMaterial({color:C_RAIN,transparent:true,opacity:0.55});

/* ═══════════════════ Backdrop z=-45 ═══════════════════ */
const nMesh = new THREE.Mesh(new THREE.PlaneGeometry(120,60),mNight);
nMesh.position.set(0,5,-45); scene.add(nMesh);

/* ═══════════════════ Wall z=-16 ═══════════════════ */
const wMesh = new THREE.Mesh(new THREE.PlaneGeometry(80,35),mWall);
wMesh.position.set(0,8,-16); scene.add(wMesh);

const wlnMat = new THREE.LineBasicMaterial({color:0x0e0d18});
for(let b=-20;b<=20;b+=2.5){
  const g=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(b-1.2,0,-16),new THREE.Vector3(b-1.2,18,-16)]);
  scene.add(new THREE.Line(g,wlnMat));
}

/* ═══════════════════ Floor / asphalt ═══════════════════ */
const fMesh = new THREE.Mesh(new THREE.PlaneGeometry(50,40),mAslt);
fMesh.rotation.x=-Math.PI/2; fMesh.position.set(0,0,-8); scene.add(fMesh);

/* Wet highlight strip near bottom */
const wSt = new THREE.Mesh(new THREE.PlaneGeometry(28,0.4),mWet);
wSt.rotation.x=-Math.PI/2; wSt.position.set(0,0.01,-2.5); scene.add(wSt);

/* Wet reflection near sign */
const wSt2 = new THREE.Mesh(new THREE.PlaneGeometry(8,0.8),mWet.clone());
wSt2.material.opacity=0.08; wSt2.rotation.x=-Math.PI/2;
wSt2.position.set(-5.2,0.008,-10); scene.add(wSt2);

/* ═══════════════════ Neon sign u=0.28 v=0.16 30%×12% ═══════════════════ */
const sg = new THREE.Group();
sg.add(new THREE.Mesh(new THREE.PlaneGeometry(6,1.6),mSign));
for(let i=0;i<3;i++){
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1.3,8),mSign.clone());
  t.rotation.z=Math.PI/2; t.position.set(-2.1+i*2.1,0,0); sg.add(t);
}
const fg=new THREE.EdgesGeometry(new THREE.PlaneGeometry(6,1.6));
sg.add(new THREE.LineSegments(fg,new THREE.LineBasicMaterial({color:C_SIGN})));
sg.position.set(-5.5,5.8,-15.5); scene.add(sg);

/* ═══════════════════ Puddles 3×(0.20×0.05)  v≈0.88 ═══════════════════ */
for(const p of[[-5.5,-10],[-.9,-4.5],[3.2,-11.5]]){
  const pm=new THREE.Mesh(new THREE.PlaneGeometry(4,1.2),mPud.clone());
  pm.rotation.x=-Math.PI/2; pm.position.set(p[0],.005,p[1]); scene.add(pm);
}

/* ═══════════════════ Robot u=0.44 v=0.66, width 20% ═══════════════════ */
function buildRobot(){
  const g=new THREE.Group(), rh=1.85, rw=1.05;
  const bH=rh*.55, hH=rh*.30, bO=new THREE.Mesh(new THREE.BoxGeometry(rw,bH,rw*.65),mRobot.clone());
  bO.position.y=bH/2; g.add(bO);
  const hO=new THREE.Mesh(new THREE.BoxGeometry(rw*.9,hH,rw*.6),mHead.clone());
  hO.position.y=bH+hH/2; g.add(hO);
  // antenna
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.25,6),mRobot.clone()),{position:new THREE.Vector3(0,bH+hH+.125,0)}));
  // eye #a8c8dc ~0.12 width
  const ey=new THREE.Mesh(new THREE.SphereGeometry(.055,10,10),mEye.clone());
  ey.position.set(rw*.38,bH+hH*.6,rw*.35); g.add(ey);
  // lamp #ffd94a shoulder
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.15,6),mRobot.clone()),{position:new THREE.Vector3(rw/2+.02,bH*.95,0)}));
  const lb=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),mLamp.clone());
  lb.position.set(rw/2+.13,bH*.98,0); g.add(lb);
  // legs 35% total
  const lH=rh*.35/2, lW=rw*.32,lB=new THREE.BoxGeometry(lW,lH,lW);
  g.add(new THREE.Mesh(lB,mRobot.clone()).translateX(-rw*.22).translateY(lH/2));
  const rL2=new THREE.Mesh(lB,mRobot.clone()); rL2.position.set(rw*.22,lH/2,0); g.add(rL2);
  // arms 45%
  const aW=rw*.225, aH=rh*.42, aG=new THREE.BoxGeometry(aW,aH,aW*.9);
  const la=new THREE.Mesh(aG,mRobot.clone());
  la.position.set(-rw/2-aW/2,bH*.55,0); g.add(la);
  const ra=new THREE.Mesh(aG,mRobot.clone());
  ra.position.set(rw/2+aW/2,bH*.55,.05); ra.rotation.z=-.35; ra.rotation.x=.3; g.add(ra);
  return g;
}
const robot = buildRobot();
robot.position.set(-.9,0,-4.5); scene.add(robot);

/* ═══════════════════ Sparks 22 #ffd94a additive z=-6 ═══════════════════ */
const sparks=[];
const sG=new THREE.Group(); scene.add(sG);
const sStart={x:-.9+1.05/2+.13, y:0+1.85*.55*.98+.13, z:-6};
const sGeo=new THREE.PlaneGeometry(.05,.05);
for(let i=0;i<22;i++){
  const m=new THREE.Mesh(sGeo, spd.clone());
  const sx=sStart.x+(seededR()-.3)*.5, sy=sStart.y+seededR()*.4;
  m.position.set(sx,sy,sStart.z); sG.add(m);
  sparks.push({mesh:m,x:sx,y:sy,vz:sStart.z,
    vx:(seededR()-.4)*.8+.3, vy:-(3+seededR()*1.5),
    l:seededR(), a:seededR()*Math.PI*2});
}

/* ═══════════════════ Drops 54 #a8c8dc z=-3.9 1.93 u/s ═══════════════════ */
const drops=[];
const dGeo=new THREE.BoxGeometry(.02,.18,.02);
for(let i=0;i<54;i++){
  const m=new THREE.Mesh(dGeo,mDrp.clone());
  const x=(seededR()-.5)*14, y=seededR()*10-2;
  m.position.set(x,y,-3.9); scene.add(m);
  drops.push({mesh:m,x,y});
}

/* ═══════════════════ State ═══════════════════ */
let t=0,bT=0;
camera.position.z=4;

/* ═══════════════════ __step(dt) → __probe() ═══════════════════ */
window.__step=function(dt){
  t+=dt; bT=t;
  // blink sign 1.4 s
  const bk=(bT%1.4)/1.4, br=bk<.65?1:.12;
  mSign.opacity=br; splt.intensity=br*2.5;
  // sparks
  for(const s of sparks){
    s.y+=s.vy*dt;
    s.x+=s.vx*dt+Math.sin(s.a+bT*.9)*.06*dt;
    s.mesh.position.set(s.x,s.y,s.vz);
    s.mesh.lookAt(camera.position);
    if(s.y<-3){
      s.x=sStart.x+(seededR()-.3)*.5;
      s.y=sStart.y+seededR()*.2;
      s.vx=(seededR()-.4)*.8+.3;
      s.vy=-(3+seededR()*1.5);
      s.a=seededR()*Math.PI*2; s.l=seededR();
    }
  }
  // drops
  for(const d of drops){
    d.y-=1.93*dt;
    if(d.y<-2.5){d.y=8+seededR()*4; d.x=(seededR()-.5)*14;}
    d.mesh.position.set(d.x,d.y,-3.9);
    d.mesh.lookAt(camera.position);
  }
  // camera z decreases 1.06/s to 0.8
  camera.position.z=Math.max(4-1.06*t,.8);
  // lamp point light follows shoulder
  lpt.position.set(sStart.x,sStart.y,-4.5);
  return window.__probe();
};

/* ═══════════════════ __probe() ═══════════════════ */
window.__probe=function(){
  let sp=[0,0];
  if(sparks.length){
    const v=sparks[0].mesh.position.clone(); v.project(camera);
    sp[0]=Math.round((v.x*.5+.5)*1e4)/1e4;
    sp[1]=Math.round((v.y*.5+.5)*1e4)/1e4;
  }
  const c=camera.position;
  return{
    t:Math.round(t*1e4)/1e4,
    objects:[
      {n:"night",d:-45},{n:"wall",d:-16},
      {n:"floor",d:-8,c:"#14121f"},
      {n:"sign",u:.28,v:.16,c:"#ff2f7a"},
      {n:"robot",u:.44,v:.66,w:.20},
      {n:"wet",v:.945},
      {n:"puddles",v:.88,n:3}
    ],
    spark:sp,
    camera:[Math.round(c.x*1e4)/1e4,Math.round(c.z*1e4)/1e4]
  };
};

/* ═══════════════════ First frame ═══════════════════ */
window.__step(0);
renderer.render(scene,camera);
window.__ready=true;
</script>
</body>
</html>
