<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0}
  body{overflow:hidden;background:#080f22}
  canvas{display:block}
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

const HALF_H = 1.657;
const FULL_H = 3.314;
const TAIL_LEN = 60;
const DT = 0.0167;

const SPHERES = [
  { a:0.603,  inc:0.765,  t0:2.567,  T:5.76, color:'#ff4d6d' },
  { a:0.784,  inc:0.780,  t0:5.254,  T:8.40, color:'#ffd166' },
  { a:0.668,  inc:0.754,  t0:2.690,  T:5.09, color:'#4dd0e1' },
  { a:0.691,  inc:0.620,  t0:6.163,  T:8.27, color:'#9b6dff' },
  { a:0.321,  inc:0.520,  t0:3.844,  T:6.70, color:'#ff4d6d' },
  { a:0.507,  inc:0.688,  t0:3.682,  T:5.89, color:'#ffd166' },
];

let scene, camera, renderer;
let t = 0;

function orbitPos(a, inc, th) {
  const r = a * HALF_H;
  return [r * Math.cos(th), r * Math.sin(th) * Math.cos(inc), r * Math.sin(th) * Math.sin(inc)];
}
function angleAt(s, now) { return s.t0 + 2 * Math.PI * now / s.T; }

/* ---------- текстуры ---------- */
function makeGlowTex(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const d = size / 2;
  const rg = g.createRadialGradient(d, d, 0, d, d, d);
  rg.addColorStop(0,    'rgba(255,255,255,1)');
  rg.addColorStop(0.15, 'rgba(255,255,255,0.80)');
  rg.addColorStop(0.50, 'rgba(255,255,255,0.18)');
  rg.addColorStop(1,    'rgba(255,255,255,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}

function makeCenterTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 200;
  const g = c.getContext('2d');
  const d = c.width / 2;
  const rg = g.createRadialGradient(d, d, 0, d, d, d);
  rg.addColorStop(0,    'rgba(255,233,168,1.00)');
  rg.addColorStop(0.2,  'rgba(255,233,168,0.72)');
  rg.addColorStop(0.55, 'rgba(255,233,168,0.16)');
  rg.addColorStop(0.9,  'rgba(255,233,168,0.02)');
  rg.addColorStop(1,    'rgba(255,233,168,0.00)');
  g.fillStyle = rg;
  g.fillRect(0, 0, c.width, c.height);
  return new THREE.CanvasTexture(c);
}

/* ---------- инициализация ---------- */
scene = new THREE.Scene();
scene.background = new THREE.Color(0x080f22);

camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 100);
camera.position.set(0, 0, 4.0);
camera.lookAt(0, 0, 0);

renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x111122, 1.0));
const dl1 = new THREE.DirectionalLight(0xffffff, 0.4);
dl1.position.set(2, 3, 5);
scene.add(dl1);
const dl2 = new THREE.DirectionalLight(0x9999ff, 0.15);
dl2.position.set(-3, -2, 4);
scene.add(dl2);

/* фон — большая плоскость */
scene.add(new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshBasicMaterial({ color: 0x080f22, side: THREE.DoubleSide })
).translateZ(-4));

/* центр: диск радиуса 0.22·HALF_H */
const ctex = makeCenterTex();
const cMat = new THREE.SpriteMaterial({ map: ctex, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false });
const centerSpot = new THREE.Sprite(cMat);
centerSpot.scale.set(2 * 0.22 * HALF_H, 2 * 0.22 * HALF_H, 1);
scene.add(centerSpot);

/* хвост и сферы */
const gtex = makeGlowTex(48);

SPHERES.forEach((s) => {
  /* сфера */
  const mg = new THREE.SphereGeometry(0.06, 16, 16);
  const mc = new THREE.MeshStandardMaterial({
    color: new THREE.Color(s.color),
    emissive: new THREE.Color(s.color),
    emissiveIntensity: 2.0,
    roughness: 0.35, metalness: 0.1,
  });
  const mesh = new THREE.Mesh(mg, mc);
  scene.add(mesh);
  s.mesh = mesh;

  /* хвост — Points, 60 светящихся спрайтов */
  const n = TAIL_LEN;
  const pa = new Float32Array(n * 3);
  const ca = new Float32Array(n * 3);
  const rgb = new THREE.Color(s.color);

  for (let i = 0; i < n; i++) {
    const b = 1.0 - 0.94 * (i / (n - 1));
    pa[i * 3]   = 0; pa[i * 3 + 1] = 0; pa[i * 3 + 2] = 0;
    ca[i * 3]   = rgb.r * b; ca[i * 3 + 1] = rgb.g * b; ca[i * 3 + 2] = rgb.b * b;
  }

  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.BufferAttribute(pa, 3));
  tg.setAttribute('color',    new THREE.BufferAttribute(ca, 3));

  const tm = new THREE.PointsMaterial({
    size: 0.055, map: gtex, vertexColors: true,
    transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true,
  });

  const pts = new THREE.Points(tg, tm);
  scene.add(pts);
  s.pts = pts;
  s.pa  = pa;
});

/* ---------- обновление ---------- */
function update(now) {
  SPHERES.forEach((s) => {
    /* хвост */
    for (let i = 0; i < TAIL_LEN; i++) {
      const th = angleAt(s, now - i * DT);
      [s.pa[i*3], s.pa[i*3+1], s.pa[i*3+2]] = orbitPos(s.a, s.inc, th);
    }
    s.pts.geometry.attributes.position.needsUpdate = true;

    /* сфера */
    const th = angleAt(s, now);
    const [x, y, z] = orbitPos(s.a, s.inc, th);
    s.mesh.position.set(x, y, z);
  });
}

function render(now) {
  update(now);
  renderer.render(scene, camera);
}

/* ---------- API ---------- */
window.__step = function(dt) {
  t += dt;
  render(t);
};

window.__probe = function() {
  const orbits = [], planets = [];
  SPHERES.forEach((s) => {
    const th = angleAt(s, t);
    const [x, y, z] = orbitPos(s.a, s.inc, th);
    orbits.push(parseFloat(th.toFixed(4)));
    planets.push({
      x: parseFloat((x / FULL_H).toFixed(4)),
      y: parseFloat((y / FULL_H).toFixed(4)),
      z: parseFloat((z / FULL_H).toFixed(4)),
    });
  });
  return {
    t: parseFloat(t.toFixed(4)),
    objects: SPHERES.map(() => ({ type: 'sphere' })),
    orbits,
    planets,
  };
};

/* ---------- старт ---------- */
render(0);
window.__ready = true;
</script>
</body>
</html>
