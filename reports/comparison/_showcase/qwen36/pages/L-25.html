<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbital Station</title>
<style> * { margin:0; padding:0; } body { overflow:hidden; background:#000; } canvas { display:block; width:1920px; height:1080px; } </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="importmap">
{ "imports": {"three": "./vendor/three.module.js"} }
</script>
<script type="module">
const THREE = window.THREE;

// ═══ LCG ════════════════════════════════════════════════════════════
let L = 9173;
function LCG() {
  L = (L * 1103515245 + 12345) % 2147483648;
  return L / 2147483648;
}

// ═══ Renderer ═══════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// ═══ Camera ═════════════════════════════════════════════════════════
const camera = new THREE.PerspectiveCamera(45, 1920/1080, 0.05, 4000);
camera.position.set(0, 0.4, 6);
camera.lookAt(0, 0, -6);

// ═══ Stars (2200 points) ══════════════════════════════════════════
{
  const starsGeo = new THREE.BufferGeometry();
  const pos = new Float32Array(2200*3);
  const col = new Float32Array(2200*3);
  const R = 998;
  for (let i=0; i<2200; i++) {
    const th = LCG()*Math.PI*2;
    const phi = Math.acos(2*LCG()-1);
    pos[i*3]   = R*Math.sin(phi)*Math.cos(th);
    pos[i*3+1] = R*Math.sin(phi)*Math.sin(th);
    pos[i*3+2] = R*Math.cos(phi);
    const b = 0.6+LCG()*0.4;
    col[i*3] = b; col[i*3+1] = b; col[i*3+2] = b*(0.9+LCG()*0.1);
  }
  starsGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  starsGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const starsMat = new THREE.PointsMaterial({ size: 1.5, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
  const stars = new THREE.Points(starsGeo, starsMat);
  stars.name = 'stars';
  scene.add(stars);
}

// ═══ Helpers: Noise in GLSL strings ════════════════════════════════
const noisyFS = `
float hash21(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.43);
  return fract(p.x * p.y);
}
float hash31(vec3 p) {
  p = fract(p * vec3(234.34, 435.345, 455.345));
  p += dot(p, p + 34.431);
  return fract(p.x * p.y * p.z);
}
float n3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n = i.x * 157.0 + i.y * 31.0;
  return mix(
    mix(mix(hash31(i + vec3(0,0,0)), hash31(i + vec3(1,0,0)), f.x),
        mix(hash31(i + vec3(0,1,0)), hash31(i + vec3(1,1,0)), f.x), f.y),
    mix(mix(hash31(i + vec3(0,0,1)), hash31(i + vec3(1,0,1)), f.x),
        mix(hash31(i + vec3(0,1,1)), hash31(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p, int oct) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 6; i++) {
    if (i >= oct) break;
    v += a * n3(p);
    p *= 2.03; a *= 0.48;
  }
  return v;
}
`;

// ═══ Earth ═════════════════════════════════════════════════════════
{
  const geo = new THREE.SphereGeometry(4.0, 128, 64);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uSunDir: { value: new THREE.Vector3(1, 0.3, 0.5).normalize() },
      uClock: { value: 0 }
    },
    vertexShader: `
      varying vec3 vWP, vWN;
      void main(){
        vWN = normalize((modelMatrix * vec4(normal,0.0)).xyz);
        vWP = (modelMatrix * vec4(position,1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: noisyFS + `
      uniform vec3 uSunDir;
      uniform float uClock;
      varying vec3 vWP, vWN;
      void main(){
        float NdL = max(dot(normalize(vWN), uSunDir), 0.0);
        float day = smoothstep(-0.1, 0.35, NdL);
        
        float land = fbm(vWP * 3.0 + vec3(0.0, uClock*0.01, 0.0), 6);
        float landM = smoothstep(0.42, 0.58, land);
        
        vec3 ocean = vec3(0.075, 0.192, 0.369);
        vec3 landC = vec3(0.184, 0.420, 0.275);
        float lat = abs(vWP.y / 4.0);
        float pol = smoothstep(0.65, 0.92, lat);
        
        vec3 terr = mix(ocean, landC, landM);
        terr = mix(terr, vec3(0.95,0.95,0.97), pol * 0.7);
        
        float city = fbm(vWP * 8.0 + vec3(50.0, 100.0, 0.0), 5);
        city = smoothstep(0.48, 0.58, city);
        vec3 cityLight = vec3(0.996, 0.816, 0.816) * city;
        
        vec3 sun = terr * (0.15 + 0.85 * max(0.0, NdL));
        vec3 sunset = vec3(0.8, 0.35, 0.15) * pow(1.0 - abs(NdL), 5.0) * 0.5 * (1.0 - pol);
        vec3 nite = terr * 0.02 + cityLight * (1.0 - day) * 2.0;
        
        vec3 col = mix(nite, sun + sunset, day);
        
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const earth = new THREE.Mesh(geo, mat);
  earth.position.set(-1.2, -1.6, -14);
  earth.name = 'earth';
  scene.add(earth);
}

// ═══ Atmosphere ═════════════════════════════════════════════════════
{
  const geo = new THREE.SphereGeometry(4.35, 64, 32);
  const mat = new THREE.ShaderMaterial({
    side: THREE.FrontSide,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexShader: `
      varying vec3 vWN, vVD;
      void main(){
        vWN = normalize((modelMatrix * vec4(normal,0.0)).xyz);
        vec4 wp = modelMatrix * vec4(position,1.0);
        vVD = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vWN, vVD;
      void main(){
        float fr = pow(1.0 - max(dot(vVD, vWN), 0.0), 3.5);
        float rim = smoothstep(0.4, 1.0, fr);
        gl_FragColor = vec4(vec3(0.431, 0.714, 1.0) * 1.5, rim * 0.65);
      }
    `
  });
  const atmos = new THREE.Mesh(geo, mat);
  atmos.position.set(-1.2, -1.6, -14);
  atmos.name = 'atmosphere';
  scene.add(atmos);
}

// ═══ Clouds ═════════════════════════════════════════════════════════
{
  const geo = new THREE.SphereGeometry(4.10, 128, 64);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uClock: { value: 0 } },
    vertexShader: `
      varying vec3 vWP, vWN;
      void main(){
        vWN = normalize((modelMatrix * vec4(normal,0.0)).xyz);
        vWP = (modelMatrix * vec4(position,1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: noisyFS + `
      uniform float uClock;
      varying vec3 vWP, vWN;
      void main(){
        float NdL = max(dot(normalize(vWN), vec3(1.,0.3,0.5)), 0.0);
        float day = smoothstep(-0.1, 0.3, NdL);
        vec3 cUV = vWP * 0.5 + vec3(uClock * 0.03, 0.0, 0.0);
        float cloud = fbm(cUV * 2.5, 6);
        cloud = smoothstep(0.35, 0.62, cloud);
        vec3 col = vec3(1.0) * (0.5 + 0.5 * day);
        gl_FragColor = vec4(col, cloud * 0.30 * day);
      }
    `
  });
  const clouds = new THREE.Mesh(geo, mat);
  clouds.position.set(-1.2, -1.6, -14);
  clouds.name = 'clouds';
  scene.add(clouds);
}

// ═══ Station ════════════════════════════════════════════════════════
const stationGroup = new THREE.Group();
{
  // Body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 0.30, 0.30),
    new THREE.MeshStandardMaterial({ color: 0x888899, metalness: 0.7, roughness: 0.3 })
  );
  body.name = 'station_body';
  stationGroup.add(body);
  
  // Solar panels
  const panMat = new THREE.MeshStandardMaterial({ color: 0x2233aa, metalness: 0.5, roughness: 0.4, side: THREE.DoubleSide });
  const panL = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.16), panMat);
  panL.position.set(-0.375, 0, 0);
  stationGroup.add(panL);
  const panR = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.16), panMat);
  panR.position.set(0.375, 0, 0);
  stationGroup.add(panR);
  
  // Antenna
  const antMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.2 });
  const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.4, 8), antMat);
  ant.position.set(0, 0.35, 0);
  stationGroup.add(ant);
  const dish = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), antMat);
  dish.position.set(0, 0.55, 0);
  stationGroup.add(dish);
  
  // Windows
  const winMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x3388bb, emissiveIntensity: 0.8 });
  for (let i = 0; i < 3; i++) {
    const w = new THREE.Mesh(new THREE.CircleGeometry(0.04, 12), winMat);
    w.position.set(-0.2 + i * 0.2, 0, 0.151);
    stationGroup.add(w);
  }
}
stationGroup.position.set(0.7, 0.1, 4.2);
stationGroup.scale.setScalar(0.65);
stationGroup.name = 'station';
scene.add(stationGroup);

// ═══ Lights ═════════════════════════════════════════════════════════
const sunD = new THREE.Vector3(1, 0.3, 0.5).normalize();
scene.add(new THREE.DirectionalLight(0xfff5e0, 2.5).copy({ position: sunD.clone().multiplyScalar(50) }));
scene.add(new THREE.AmbientLight(0x111122, 0.3));

// ═══ Earth pos ══════════════════════════════════════════════════════
const earthPos = new THREE.Vector3(-1.2, -1.6, -14);

function surfacePoint(a, e, radius) {
  return new THREE.Vector3(
    Math.sin(a)*Math.cos(e)*radius + earthPos.x,
    Math.sin(e)*radius + earthPos.y,
    Math.cos(a)*Math.cos(e)*radius + earthPos.z
  );
}

// ═══ Explosions ═════════════════════════════════════════════════════
const expDefs = [
  { a: -0.136, e: 0.372, delay: 0, idx:0 },
  { a:  0.331, e:-0.345, delay: 1.5, idx:1 }
];
const explosions = [];
const expStarted = {};

// --- Flash ---
const flash = new THREE.Mesh(
  new THREE.SphereGeometry(0.05, 16, 16),
  new THREE.ShaderMaterial({
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    uniforms: { uOp: { value: 0 } },
    vertexShader: `varying vec3 vA,vB; void main(){
      vA=normalize((modelMatrix*vec4(normal,0.)).xyz);
      vB=normalize(cameraPosition-(modelMatrix*vec4(position,1.)).xyz);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    }`,
    fragmentShader: `uniform float uOp; varying vec3 vA,vB; void main(){
      float fr=pow(1.-max(dot(vB,vA),0.),2.5);
      gl_FragColor=vec4(vec3(1.,0.851,0.627)*(1.5+fr*2.),fr*uOp);
    }`
  })
);
flash.name = 'flash';
scene.add(flash);

// --- Dome ---
const dome = new THREE.Mesh(
  new THREE.SphereGeometry(1, 32, 16, 0, Math.PI*2, 0, Math.PI*0.5),
  new THREE.ShaderMaterial({
    transparent: true, blending: THREE.AdditiveBlending, side: THREE.FrontSide, depthWrite: false,
    uniforms: { uOp: { value: 0 } },
    vertexShader: `varying vec3 vA,vB; void main(){
      vA=normalize((modelMatrix*vec4(normal,0.)).xyz);
      vB=normalize(cameraPosition-(modelMatrix*vec4(position,1.)).xyz);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    }`,
    fragmentShader: `uniform float uOp; varying vec3 vA,vB; void main(){
      float fr=pow(1.-max(dot(vB,vA),0.),2.);
      gl_FragColor=vec4(vec3(1.,0.851,0.627)*1.5,(fr*.5+.2)*uOp);
    }`
  })
);
dome.name = 'dome';
scene.add(dome);

// --- Ring ---
const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.05, 0.15, 64),
  new THREE.ShaderMaterial({
    transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false,
    uniforms: { uOp: { value: 0 } },
    vertexShader: `varying vec3 vA,vB; varying vec2 vUV; void main(){
      vA=normalize((modelMatrix*vec4(normal,0.)).xyz);
      vB=normalize(cameraPosition-(modelMatrix*vec4(position,1.)).xyz);
      vUV=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    }`,
    fragmentShader: `uniform float uOp; varying vec3 vA,vB; varying vec2 vUV; void main(){
      float ed=smoothstep(0.,.15,vUV.x)*(1.-smoothstep(.85,1.,vUV.x));
      float fr=pow(1.-max(dot(vB,vA),0.),1.5);
      gl_FragColor=vec4(vec3(1.,0.851,0.627)*2.,(ed*fr*1.5+.1)*uOp);
    }`
  })
);
ring.name = 'ring';
scene.add(ring);

// --- Mushroom ---
const mushMat = new THREE.ShaderMaterial({
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  uniforms: { uOp: { value: 0 } },
  vertexShader: `varying vec3 vA,vB; void main(){
    vA=normalize((modelMatrix*vec4(normal,0.)).xyz);
    vB=normalize(cameraPosition-(modelMatrix*vec4(position,1.)).xyz);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
  }`,
  fragmentShader: `uniform float uOp; varying vec3 vA,vB; void main(){
    float fr=pow(1.-max(dot(vB,vA),0.),2.);
    gl_FragColor=vec4(vec3(1.,0.8,0.6)*2.,(0.5+fr*.5)*uOp*.8);
  }`
});
const mushGroup = new THREE.Group();
mushGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.15,0.3,12), mushMat));
const mushCap = new THREE.Mesh(new THREE.SphereGeometry(0.2,16,12), mushMat);
mushCap.position.y = 0.25;
mushGroup.add(mushCap);
mushGroup.name = 'mushroom';
scene.add(mushGroup);

// ═══ Post-processing targets ═══════════════════════════════════════
const rtA = new THREE.WebGLRenderTarget(1920,1080, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat, type:THREE.HalfFloatType });
const rtB = new THREE.WebGLRenderTarget(1920,1080, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat, type:THREE.HalfFloatType });
const rtC = new THREE.WebGLRenderTarget(960,540, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat, type:THREE.HalfFloatType });
const rtD = new THREE.WebGLRenderTarget(960,540, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat, type:THREE.HalfFloatType });

const cam2D = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const qGeo = new THREE.PlaneGeometry(2,2);

// Grain texture
const gCanvas = document.createElement('canvas');
gCanvas.width = gCanvas.height = 512;
const gCtx = gCanvas.getContext('2d');
const gImg = gCtx.createImageData(512,512);
for (let i = 0; i < gImg.data.length; i += 4) {
  const v = Math.floor(LCG() * 256);
  gImg.data[i] = gImg.data[i+1] = gImg.data[i+2] = v;
  gImg.data[i+3] = 255;
}
gCtx.putImageData(gImg, 0, 0);
const grainTex = new THREE.CanvasTexture(gCanvas);
grainTex.wrapS = grainTex.wrapT = THREE.RepeatWrapping;

// Bright pass
const M_bright = new THREE.ShaderMaterial({
  uniforms: { t: { value: null } },
  vertexShader: `varying vec2 u; void main(){ u=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D t; varying vec2 u; void main(){
    vec3 c=texture2D(t,u).rgb;
    gl_FragColor=vec4(c*smoothstep(.3,.9,dot(c,vec3(.299,.587,.114))),1.);
  }`
});
const Q_bright = new THREE.Mesh(qGeo, M_bright);

// Blur H
const M_bH = new THREE.ShaderMaterial({
  uniforms: { t:{value:null}, r:{value:new THREE.Vector2(960,540)} },
  vertexShader: `varying vec2 u; void main(){ u=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D t; uniform vec2 r; varying vec2 u; void main(){
    vec2 px=1./r, c=vec3(0.);
    c+=texture2D(t,u+vec2(-4*px.x,0.)).rgb*.02;
    c+=texture2D(t,u+vec2(-3*px.x,0.)).rgb*.06;
    c+=texture2D(t,u+vec2(-2*px.x,0.)).rgb*.12;
    c+=texture2D(t,u+vec2(-px.x,0.)).rgb*.20;
    c+=texture2D(t,u).rgb*.26;
    c+=texture2D(t,u+vec2(px.x,0.)).rgb*.20;
    c+=texture2D(t,u+vec2(2*px.x,0.)).rgb*.12;
    c+=texture2D(t,u+vec2(3*px.x,0.)).rgb*.06;
    c+=texture2D(t,u+vec2(4*px.x,0.)).rgb*.02;
    gl_FragColor=vec4(c,1.);
  }`
});
const Q_bH = new THREE.Mesh(qGeo, M_bH);

// Blur V
const M_bV = new THREE.ShaderMaterial({
  uniforms: { t:{value:null}, r:{value:new THREE.Vector2(960,540)} },
  vertexShader: `varying vec2 u; void main(){ u=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D t; uniform vec2 r; varying vec2 u; void main(){
    vec2 px=1./r; vec3 c=vec3(0.);
    c+=texture2D(t,u+vec2(0.,-4*px.y)).rgb*.02;
    c+=texture2D(t,u+vec2(0.,-3*px.y)).rgb*.06;
    c+=texture2D(t,u+vec2(0.,-2*px.y)).rgb*.12;
    c+=texture2D(t,u+vec2(0.,-px.y)).rgb*.20;
    c+=texture2D(t,u).rgb*.26;
    c+=texture2D(t,u+vec2(0.,px.y)).rgb*.20;
    c+=texture2D(t,u+vec2(0.,2*px.y)).rgb*.12;
    c+=texture2D(t,u+vec2(0.,3*px.y)).rgb*.06;
    c+=texture2D(t,u+vec2(0.,4*px.y)).rgb*.02;
    gl_FragColor=vec4(c,1.);
  }`
});
const Q_bV = new THREE.Mesh(qGeo, M_bV);

// Bloom combine
const M_bc = new THREE.ShaderMaterial({
  uniforms: { s:{value:null}, b:{value:null} },
  vertexShader: `varying vec2 u; void main(){ u=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D s,b; varying vec2 u; void main(){
    gl_FragColor=vec4(texture2D(s,u).rgb+texture2D(b,u).rgb*.7,1.);
  }`
});
const Q_bc = new THREE.Mesh(qGeo, M_bc);

// Final FX
const M_final = new THREE.ShaderMaterial({
  uniforms: { t:{value:null}, g:{value:grainTex} },
  vertexShader: `varying vec2 u; void main(){ u=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D t,g; varying vec2 u; void main(){
    vec2 uv=u;
    vec2 dir=uv-.5;
    float d=length(dir);
    float ca=(0.003+.002*d*d)*d*2.;
    vec2 co=normalize(dir+.001)*ca;
    vec3 col=vec3(texture2D(t,uv+co).r, texture2D(t,uv).g, texture2D(t,uv-co).b);
    col*=1.-d*d*.8;
    float gn=texture2D(g,uv*100.).r;
    col+=gn*.06+.02-.03;
    col*=1.1;
    col.b*=1.02;
    gl_FragColor=vec4(col,1.);
  }`
});
const Q_final = new THREE.Mesh(qGeo, M_final);

// ═══ Probe & Step ═════════════════════════════════════════════════
let simT = 0;
let shakeA = 0;

window.__probe = function() {
  const objs = [
    {name:'earth', pos:[earthPos.x, earthPos.y, earthPos.z]},
    {name:'atmosphere', pos:[earthPos.x, earthPos.y, earthPos.z]},
    {name:'clouds', pos:[earthPos.x, earthPos.y, earthPos.z]},
    {name:'station', pos:[stationGroup.position.x, stationGroup.position.y, stationGroup.position.z]},
    {name:'stars', count:2200}
  ];
  for (const e of explosions) {
    if (e.t < 6) objs.push({name:'expl'+e.idx, pos:[e.pos.x,e.pos.y,e.pos.z], age:Math.round(e.t*1000)/1000});
  }
  let boom = -1;
  for (let i=explosions.length-1; i>=0; i--) {
    if (explosions[i].t < 6) { boom=Math.round(explosions[i].t*1000)/1000; break; }
  }
  return {
    t: Math.round(simT*1000)/1000,
    objects: objs,
    camera: [Math.round(camera.position.x*1e4)/1e4, Math.round(camera.position.y*1e4)/1e4],
    boom: boom
  };
};

window.__step = function(dt) {
  simT += dt;
  shakeA += dt * 3.7;

  // Fire explosions
  for (const d of expDefs) {
    const key = d.a + '_' + d.e;
    if (simT >= d.delay && !expStarted[key]) {
      explosions.push({ idx:d.idx, t:0, pos: surfacePoint(d.a, d.e, 4.0) });
      expStarted[key] = true;
    }
  }

  for (const e of explosions) {
    e.t += dt;
    const N = e.pos.clone().sub(earthPos).normalize();

    // Flash: 0->0.5 grow, 0.5->1.0 fade
    if (e.t < 1.0) {
      flash.visible = true;
      flash.position.copy(e.pos);
      if (e.t <= 0.5) {
        const p = e.t / 0.5;
        flash.scale.setScalar(0.05 + 0.29*p);
        flash.material.uniforms.uOp.value = Math.min(1, p*2);
      } else {
        const f = 1-(e.t-0.5)/0.5;
        flash.material.uniforms.uOp.value = Math.max(0,f);
      }
    } else flash.visible = false;

    // Dome: .15->1.75 expand, 1.75->2.55 fade
    if (e.t < 2.55) {
      dome.visible = true;
      dome.position.copy(e.pos);
      dome.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), N);
      dome.scale.setScalar(0.01);
      if (e.t >= 0.15 && e.t < 1.75) {
        const p = (e.t-0.15)/1.6;
        dome.scale.setScalar(p*0.9+0.01);
        dome.material.uniforms.uOp.value = Math.min(0.25, p*0.5);
      } else if (e.t >= 1.75) {
        const f = 1-(e.t-1.75)/0.8;
        dome.material.uniforms.uOp.value = Math.max(0, 0.25*f);
      } else {
        dome.material.uniforms.uOp.value = 0;
      }
    } else dome.visible = false;

    // Ring: .3->2.7 expand, 2.7->4.2 fade
    if (e.t < 4.2) {
      ring.visible = true;
      ring.position.copy(e.pos);
      ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), N);
      ring.scale.setScalar(0.05);
      if (e.t >= 0.3 && e.t < 2.7) {
        const p = (e.t-0.3)/2.4;
        ring.scale.set(p*1.8, p*1.8, 1);
        ring.material.uniforms.uOp.value = 0.5;
      } else if (e.t >= 2.7) {
        const f = 1-(e.t-2.7)/1.5;
        ring.material.uniforms.uOp.value = Math.max(0, 0.5*f);
      } else {
        ring.material.uniforms.uOp.value = 0;
      }
    } else ring.visible = false;

    // Mushroom: .4->2.4 rise, 2.4->4.4 fade
    if (e.t < 4.5) {
      mushGroup.visible = true;
      const rise = Math.min(0.5, (e.t - 0.4) * 0.25);
      mushGroup.position.copy(e.pos.clone().add(N.clone().multiplyScalar(0.05 + rise)));
      mushGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), N);
      if (e.t >= 0.4 && e.t < 2.4) {
        const p = (e.t-0.4)/2;
        const ms = 0.3 + 0.7*Math.min(1, p*2);
        mushGroup.scale.setScalar(ms);
        if (mushGroup.children[0]) mushGroup.children[0].scale.set(1, 0.5+2*p, 1);
        mushMat.uniforms.uOp.value = Math.min(0.8, p*1.2);
      } else if (e.t >= 2.4 && e.t < 2.4+2) {
        const f = 1-(e.t-2.4)/2;
        mushMat.uniforms.uOp.value = Math.max(0, 0.8*f);
      } else {
        mushMat.uniforms.uOp.value = 0;
      }
    } else mushGroup.visible = false;
  }

  // Station
  stationGroup.rotation.y = simT * 0.3;
  stationGroup.rotation.x = Math.sin(simT*0.2)*0.05;

  // Clouds
  clouds.material.uniforms.uClock.value = simT;

  // World rotation
  earth.rotation.y = simT*0.02;
  atmos.rotation.y = simT*0.02;
  clouds.rotation.y = simT*0.015;

  // Camera shake
  const sx = Math.sin(shakeA)*0.023 + Math.sin(shakeA*1.7)*0.012;
  const sy = Math.cos(shakeA*1.3)*0.023*0.6 + Math.cos(shakeA*2.1)*0.008;
  camera.position.set(sx, 0.4+sy, 6);
  camera.lookAt(0, 0, -6);

  // Cleanup
  for (let i=explosions.length-1; i>=0; i--) {
    if (explosions[i].t > 8) explosions.splice(i, 1);
  }
};

// ═══ Render ═════════════════════════════════════════════════════════
let firstFrame = true;

function render() {
  // Sim
  for (let s=0; s<1; s++) window.__step(1/30);

  // Scene -> rtA
  renderer.setRenderTarget(rtA);
  renderer.setViewport(0,0,1920,1080);
  renderer.setScissor(0,0,1920,1080);
  renderer.render(scene, camera);

  // Bloom bright -> rtC
  renderer.setRenderTarget(rtC);
  renderer.setViewport(0,0,960,540);
  Q_bright.material.uniforms.t.value = rtA.texture;
  renderer.render(new THREE.Scene(), cam2D);

  // Blur H rtC->rtD
  renderer.setRenderTarget(rtD);
  renderer.setViewport(0,0,960,540);
  Q_bH.material.uniforms.t.value = rtC.texture;
  renderer.render(new THREE.Scene(), cam2D);

  // Blur V rtD->rtC
  renderer.setRenderTarget(rtC);
  Q_bV.material.uniforms.t.value = rtD.texture;
  renderer.render(new THREE.Scene(), cam2D);

  // 2nd blur for strength
  renderer.setRenderTarget(rtD);
  Q_bH.material.uniforms.t.value = rtC.texture;
  renderer.render(new THREE.Scene(), cam2D);
  renderer.setRenderTarget(rtC);
  Q_bV.material.uniforms.t.value = rtD.texture;
  renderer.render(new THREE.Scene(), cam2D);

  // Combine -> rtB
  renderer.setRenderTarget(rtB);
  renderer.setViewport(0,0,1920,1080);
  renderer.setScissor(0,0,1920,1080);
  Q_bc.material.uniforms.s.value = rtA.texture;
  Q_bc.material.uniforms.b.value = rtC.texture;
  renderer.render(new THREE.Scene(), cam2D);

  // Final FX -> screen
  renderer.setRenderTarget(null);
  renderer.setViewport(0,0,1920,1080);
  Q_final.material.uniforms.t.value = rtB.texture;
  renderer.render(new THREE.Scene(), cam2D);

  if (firstFrame) {
    firstFrame = false;
    window.__ready = true;
    console.log('__probe:', JSON.stringify(window.__probe(), null, 2));
  }
}

render();
requestAnimationFrame(function loop() { render(); requestAnimationFrame(loop); });
</script>
