<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DailyBench Flow</title>
<style>
body { margin:0; overflow:hidden; background:#0b1424; }
canvas { display:block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ── constants ── */
const N          = 1500;
const M          = 4294967296;    // 2^32
const F2P32      = 1.0 / M;       // 2.328306436538696e-10
const DEG2RAD    = Math.PI / 180;
const DT_SCALE   = 0.18;
const AGE_RATE   = 1 / 2.6;
const LEN_MAX    = 0.090;
const LEN_MIN    = 0.040;
const BR_MAX     = 1.0;
const BR_MIN     = 0.25;
const P0         = 0.987;
const DP         = 2.1;
const XMIN       = -4 / 3;
const XSPAN      = 8 / 3;
const YMIN       = -1;
const YSPAN      = 2;

const WAVES = [
  { a:0.50, k:1.40, m:0.90, w:0.70, p:P0 },
  { a:0.35, k:0.80, m:-1.70,w:1.10, p:P0+DP }
];

/* ── LCG (glibc X_{n+1} = (a·X_n + c) mod m) ── */
let _seed = 765555113;

/* ── particle pools ── */
const px  = new Float32Array(N);
const py  = new Float32Array(N);
const age = new Float32Array(N);

function birth(i) {
  // first LCG step → x coordinate
  _seed = (1664525 * _seed + 1013904223) % M;
  px[i] = (_seed * F2P32 * 2 - 1) * (4 / 3);
  // second LCG step → y coordinate
  _seed = (1664525 * _seed + 1013904223) % M;
  py[i]  = _seed * F2P32 * 2 - 1;
  age[i] = 0;
}
for (let i = 0; i < N; i++) birth(i);

/* ── analytical velocity from stream function ψ ── */
// v = (∂ψ/∂y, −∂ψ/∂x)
//   = Σ a_i·cos(k_i·x+m_i·y−w_i·t+p_i)·(m_i, −k_i)
function vel(X, Y, T) {
  let vx = 0, vy = 0;
  for (let w = 0; w < 2; w++) {
    const c = Math.cos(WAVES[w].k*X + WAVES[w].m*Y - WAVES[w].w*T + WAVES[w].p);
    vx += WAVES[w].a * c * WAVES[w].m;
    vy -= WAVES[w].a * c * WAVES[w].k;
  }
  return [vx, vy];
}

/* ── Three.js scene ── */
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer:true, antialias:false });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1424);

const cam = new THREE.OrthographicCamera(-4/3, 4/3, 1, -1, 0.1, 10);
cam.position.set(0, 0, 2);
cam.lookAt(0, 0, 0);

/* InstancedMesh — PlaneGeometry(1,1), per-instance scale (0.010, len, 1) */
const geo   = new THREE.PlaneGeometry(1, 1);
const mat   = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
const mesh  = new THREE.InstancedMesh(geo, mat, N);
const colAttr = new THREE.InstancedBufferAttribute(new Float32Array(N*3), 3);
mesh.instanceColor = colAttr;
scene.add(mesh);

const aux = new THREE.Object3D();
const tmpCol = new THREE.Color();
let simT = 0;

/* ── render (build all instances + draw) ── */
function frame() {
  for (let i = 0; i < N; i++) {
    const a  = age[i];
    const [vx, vy] = vel(px[i], py[i], simT);

    const len = LEN_MAX - (LEN_MAX-LEN_MIN)*a;       // 0.090 → 0.040
    const br  = BR_MAX  - (BR_MAX-BR_MIN)*a;         // 1.0   → 0.25

    const angDeg = Math.atan2(vy, vx) / DEG2RAD;

    // colour sector by velocity direction
    let h = 0x28d7e8;
    if (       angDeg >= -60 && angDeg <  60) h = 0xe8399b;
    else /* >= 60 or <= -180 */             h = 0xf2c53d;

    // matrix: position, scale, rotate so length axis aligns with velocity
    aux.position.set(px[i], py[i], 0);
    aux.scale.set(0.010, len, 1);
    aux.rotation.z = Math.atan2(vy, vx) - Math.PI/2;
    aux.updateMatrix();
    mesh.setMatrixAt(i, aux.matrix);

    // instance colour
    tmpCol.setHex(h).multiplyScalar(br);
    mesh.setColorAt(i, tmpCol);
  }
  mesh.instanceMatrix.needsUpdate = true;
  colAttr.needsUpdate = true;
  renderer.render(scene, cam);
}

/* ── public API ── */
function __step(dt) {
  simT += dt;

  for (let i = 0; i < N; i++) {
    const [vx, vy] = vel(px[i], py[i], simT);
    px[i] += vx * DT_SCALE * dt;
    py[i] += vy * DT_SCALE * dt;
    age[i]  += dt * AGE_RATE;

    // re-birth when lifetime ends or particle leaves frame
    if (age[i] >= 1 || px[i] < XMIN  || px[i] >  4/3 ||
        py[i] < YMIN  || py[i] >  1) {
      birth(i);
    }
  }

  frame();
  return __probe();
}

function __probe() {
  const pts = [];
  for (let i = 0; i < 8; i++) {
    pts.push([
      parseFloat(((px[i] - XMIN) / XSPAN).toFixed(4)),
      parseFloat(((py[i] - YMIN) / YSPAN).toFixed(4))
    ]);
  }

  let speed = 0;
  for (let i = 0; i < N; i++) {
    const [vx, vy] = vel(px[i], py[i], simT);
    speed += Math.hypot(vx, vy);
  }

  return {
    t:       parseFloat(simT.toFixed(4)),
    objects: [{ type:'InstancedMesh', count:N, geometry:'PlaneGeometry(1,1)' }],
    particles: pts,
    speed:   parseFloat((speed/N).toFixed(4))
  };
}

window.__step    = __step;
window.__probe   = __probe;

/* initial draw at t = 0 */
frame();
window.__ready = true;
</script>
</body>
</html>
