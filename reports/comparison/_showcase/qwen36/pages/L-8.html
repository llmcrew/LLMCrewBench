  <script type="module">
    const THREE = window.THREE;

    // LCG state and generator
    let s = 53827;
    function nextU() {
      s = (1664525 * s + 1013904223) % 4294967296;
      return s / 4294967296;
    }

    // Scene & Camera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1d1638');

    const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 200);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(800, 600, false);
    document.body.appendChild(renderer.domElement);

    // Canvas texture 64x256
    const c = document.createElement('canvas');
    c.width = 64; c.height = 256;
    const ctx = c.getContext('2d');

    // Vertical color gradient
    const vGrad = ctx.createLinearGradient(0, 255, 0, 0);
    vGrad.addColorStop(0, '#18f051');
    vGrad.addColorStop(0.5, '#2197db');
    vGrad.addColorStop(1, '#ff33ee');
    ctx.fillStyle = vGrad;
    ctx.fillRect(0, 0, 64, 256);

    // Horizontal alpha fade (opaque middle, soft edges)
    const hGrad = ctx.createLinearGradient(0, 0, 63, 0);
    hGrad.addColorStop(0, 'rgba(0,0,0,0)');
    hGrad.addColorStop(0.2, 'rgba(0,0,0,1)');
    hGrad.addColorStop(0.8, 'rgba(0,0,0,1)');
    hGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'destination-in';
    ctx.fillStyle = hGrad;
    ctx.fillRect(0, 0, 64, 256);
    ctx.globalCompositeOperation = 'source-over';

    const tex = new THREE.CanvasTexture(c);

    // Frame dimensions at z=10
    const halfHeight = 10 * Math.tan(45 * Math.PI / 360);
    const halfWidth = halfHeight * (800 / 600);

    const stripData = [];
    const geo = new THREE.PlaneGeometry(1, 1);

    // Generate 28 strips
    for (let i = 0; i < 28; i++) {
      const u = nextU();
      const v = nextU();
      const u2 = nextU();
      const u3 = nextU();
      const u4 = nextU();
      const u5 = nextU();

      const w = 0.030 + 0.055 * u;
      const h = 0.30 + 0.38 * v;
      const x = (i + 0.5 + 0.6 * (u2 - 0.5)) / 28 - 0.5;
      const y = 0.02 + 0.26 * u3;
      const op = 0.16 + 0.24 * u4;
      const ph = 0.4 * u5;

      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthTest: false,
        opacity: op
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.name = `ribbon_${i + 1}`;
      mesh.scale.set(w, h, 1);
      mesh.position.set(x * halfWidth * 2, y * halfHeight * 2, 0);
      scene.add(mesh);

      stripData.push({ mesh, x, y, h, ph });
    }

    let t = 0;

    window.__step = function(dt) {
      t += dt;
      for (const d of stripData) {
        const dx = 0.05 * Math.sin(2 * Math.PI * 0.35 * t - 3.0 * d.x + d.ph);
        const newH = d.h * (1 + 0.15 * Math.sin(2 * Math.PI * 0.35 * 0.7 * t + d.ph));
        d.mesh.position.x = d.x * halfWidth * 2 + dx;
        d.mesh.scale.y = newH;
      }
      renderer.render(scene, camera);
      return window.__probe();
    };

    window.__probe = function() {
      return {
        t: t.toFixed(4),
        objects: stripData.map(d => d.mesh.name),
        wave: (2 * Math.PI * 0.35 * t).toFixed(4)
      };
    };

    // Initial frame at t=0
    window.__step(0);
    window.__ready = true;
  </script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
