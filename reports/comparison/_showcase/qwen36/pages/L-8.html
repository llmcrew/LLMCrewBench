<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Aurora</title>
<style>
body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block}
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ── Frame geometry (distance 10, fov 45°) ── */
const HALF_H = 10 * Math.tan(Math.PI / 8);          // ≈ 4.142
const FW     = HALF_H * 2 * (800 / 600);             // frame width
const FH     = HALF_H * 2;                           // frame height

/* ── Canvas texture 64 × 256 ────────────────────────── */
/*  vertical   bottom=green  middle=blue   top=purple
    horizontal  bright centre → black edges           */
function makeTexture(){
  const W=64,H=256,cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'), img=ctx.createImageData(W,H), px=img.data;
  // colour stops  #18f051  →  #2197db  →  #ff33ee
  const gR=24,gG=240,gB=81;
  const bR=33,bG=151,bB=219;
  const pR=255,pG=51, pB=238;
  for(let y=0;y<H;y++){
    const v=y/(H-1);
    let r,g,b;
    if(v<0.5){const t=v*2;r=gR+(bR-gR)*t;g=gG+(bG-gG)*t;b=gB+(bB-gB)*t;}
    else      {const t=(v-0.5)*2;r=bR+(pR-bR)*t;g=bG+(pG-bG)*t;b=bB+(pB-bB)*t;}
    for(let x=0;x<W;x++){
      const d=Math.abs((x/(W-1))-0.5)*2;
      // soft horizontal falloff — opaque through the middle, black at edges
      let f=d<0.2?1:d<0.75?1-(d-0.2)/0.55:0;
      const i=(y*W+x)*4;
      px[i]  =0|r*f; px[i+1]=0|g*f; px[i+2]=0|b*f; px[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(cv);
  tex.needsUpdate=true;
  return tex;
}
const tex=makeTexture();

/* ── LCG (no Math.random) ─────────────────────────── */
let rng=53827;          // seed
function rngNext(){
  rng=(1664525*rng+1013904223)%4294967296;
  return rng/4294967296;
}

/* ── Scene, Camera, Renderer ───────────────────────── */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1d1638);

const camera=new THREE.PerspectiveCamera(45,800/600,0.1,200);
camera.position.set(0,0,10);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(1920,1080,false);
document.body.appendChild(renderer.domElement);

/* ── Build 28 ribbons ─────────────────────────────── */
const ribbonParams=[];          // store for deterministic probe
for(let i=0;i<28;i++){
  const u =rngNext(); const v =rngNext();
  const u2=rngNext(); const u3=rngNext();
  const u4=rngNext(); const u5=rngNext();

  const w  =0.030+0.055*u;
  const h  =0.30+0.38*v;
  const xc =(i+0.5+0.6*(u2-0.5))/28-0.5;
  const yc =0.02+0.26*u3;
  const op =0.16+0.24*u4;
  const ph =0.4*u5;

  const mesh=new THREE.Mesh(
    new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({
      map:tex, transparent:true,
      blending:THREE.AdditiveBlending,
      depthTest:false
    })
  );
  mesh.name='ribbon_'+(i+1);
  mesh.position.set(xc*FW, yc*FH, 0);
  mesh.scale.set(w*FW, h*FH, 1);
  mesh.material.opacity=op;

  const info={w,h,xc,yc,op,ph,mesh};
  mesh.userData=info;
  ribbonParams.push(info);
  scene.add(mesh);
}

/* ── Wave animation ────────────────────────────────── */
let t=0;

function applyWave(){
  const wp=2*Math.PI*0.35*t;
  for(let i=0;i<ribbonParams.length;i++){
    const d=ribbonParams[i];
    if(!d.mesh) continue;
    const dx=0.05*Math.sin(wp-3.0*d.xc+d.ph);
    const hm=1+0.15*Math.sin(2*Math.PI*0.35*0.7*t+d.ph);
    d.mesh.position.x=(d.xc+dx)*FW;
    d.mesh.scale.y   =d.h*hm*FH;
  }
}

/* ── Public API ────────────────────────────────────── */
window.__step=function(dt){
  t+=dt;
  applyWave();
};

window.__probe=function(){
  const phase=2*Math.PI*0.35*t;
  const objs=ribbonParams.filter(d=>d.mesh).map(d=>{
    const m=d.mesh;
    return {name:m.name,
            x:+m.position.x.toFixed(4),
            y:+m.position.y.toFixed(4),
            z:+m.position.z.toFixed(4)};
  });
  return {t:+t.toFixed(4),objects:objs,wave:+phase.toFixed(4)};
};

/* ── First frame ───────────────────────────────────── */
applyWave();
renderer.render(scene,camera);
window.__ready=true;

</script>
</body>
</html>
