<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
const THREE = window.THREE;

(function () {
  const W = 1920, H = 1080;

  /* ---------- Renderer ---------- */
  const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer:true});
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  document.body.appendChild(renderer.domElement);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 1000);
  camera.position.set(0, 0.9, 0);
  camera.lookAt(0, 0.7815, -1);

  /* ---------- Clipping plane y = 0 (keep world Y >= 0) ---------- */
  const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
  renderer.clippingPlanes = [clipPlane];

  /* ---------- Time ---------- */
  let t = 0;

  /* === Sun position ============================================ */
  const tanHalfFov = Math.tan(Math.PI * 45 / 360);              // 0.4142
  const horizonNDY = Math.atan(0.1185) / tanHalfFov;            // ≈ 0.2866
  const sunNDY     = horizonNDY + 0.024;                        // 0.012 frame-h above horizon
  // Build sun ray in camera view-space (Three.js: looks along local -Z)
  const viewY      = sunNDY * tanHalfFov * 300;                 // view Y at dist 300
  const camWorld   = camera.matrixWorld;
  // Matrix columns: 0→(c0,c4,c8) Right,  1→(c1,c5,c9) Up,  2→(c2,c6,c10) Back(=+Z local)
  const camRight   = new THREE.Vector3(camWorld.elements[ 0], camWorld.elements[ 4], camWorld.elements[ 8]);
  const camUp      = new THREE.Vector3(camWorld.elements[ 1], camWorld.elements[ 5], camWorld.elements[ 9]);
  const camBack    = new THREE.Vector3(camWorld.elements[ 2], camWorld.elements[ 6], camWorld.elements[10]);
  // Camera looks opposite to camBack (local +Z points backward)
  const sunWorldDir = new THREE.Vector3()
      .addScaledVector(camRight,  0)
      .addScaledVector(camUp,     viewY)
      .addScaledVector(camBack,  -300)
      .normalize();
  const sunPos     = new THREE.Vector3().copy(camera.position).addScaledVector(sunWorldDir, 300);
  const sunRadius  = 300 * Math.tan(Math.PI * 2.25 / 180);

  /* ================================================================ */
  /* === WATER SHADERS ============================================= */
  /* ================================================================ */

  const waterVShader = `
uniform float uTime;
varying vec3 vNormal;
varying vec2 vUv;
varying vec3 vWorldPos;

void main() {
  vec3 pos  = position;
  vec2 p    = pos.xz;
  float h   = 0.0, dhdx = 0.0, dhdz = 0.0;
  float a1 = 0.26 * 1.080, a2 = 0.16 * 1.080, a3 = 0.09 * 1.080;

  float d0 = dot(p, vec2( 0.924,  0.383));
  float ph0 = 0.38*d0 - 0.90*uTime + 2.282;
  h   += a1*sin(ph0);  dhdx += a1*0.38*cos(ph0)* 0.924;  dhdz += a1*0.38*cos(ph0)* 0.383;

  float d1 = dot(p, vec2(-0.643,  0.766));
  float ph1 = 0.72*d1 - 1.50*uTime + 3.982;
  h   += a2*sin(ph1);  dhdx += a2*0.72*cos(ph1)*(-0.643); dhdz += a2*0.72*cos(ph1)* 0.766;

  float d2 = dot(p, vec2( 0.309, -0.951));
  float ph2 = 1.25*d2 - 2.40*uTime + 5.682;
  h   += a3*sin(ph2);  dhdx += a3*1.25*cos(ph2)* 0.309;  dhdz += a3*1.25*cos(ph2)*(-0.951);

  pos.y += h;
  vNormal = normalize(vec3(-dhdx, 1.0, -dhdz));
  vUv     = uv;
  vWorldPos = pos;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
}`;

  const waterFShader = `
uniform vec3 uCamPos;
uniform vec3 uSunPos;
varying vec3 vNormal;
varying vec2 vUv;
varying vec3 vWorldPos;

void main() {
  vec3 N = normalize(vNormal);
  vec3 V = normalize(uCamPos - vWorldPos);
  vec3 L = normalize(uSunPos - vWorldPos);

  // Fresnel water colour: dark near camera, light at horizon
  float F = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.0);
  vec3 col = mix(vec3(0.043,0.153,0.251), vec3(0.184,0.522,0.690), F);

  // Specular sun glint
  vec3 R = reflect(-L, N);
  col += pow(max(dot(R, V), 0.0), 32.0) * vec3(1.0,0.902,0.690) * 1.2;

  // Warm sun-trail   exp(-x²/0.35) · smoothstep(-2,-25,z)
  float trail = exp(-vWorldPos.x*vWorldPos.x/0.35) *
                smoothstep(-2.0, -25.0, vWorldPos.z);
  col += trail * vec3(1.0,0.902,0.690) * 0.6;

  gl_FragColor = vec4(col, 1.0);
}`;

  const waterUniforms = {
    uTime:  { value: 0 },
    uCamPos:{ value: camera.position.clone() },
    uSunPos:{ value: sunPos.clone() }
  };

  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 400, 180, 200),
    new THREE.ShaderMaterial({
      uniforms: waterUniforms,
      vertexShader: waterVShader,
      fragmentShader: waterFShader,
      clippingPlanes: [clipPlane]
    })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, 0, -199.6);
  water.name = 'water';
  scene.add(water);

  /* ================================================================ */
  /* === SKY SHADERS =============================================== */
  /* ================================================================ */

  // Sky plane: large, placed at distance 500, oriented perpendicular to view.
  // Gradient computed from projected Y (ndcY) – independent of placement.
  const skyVShader = `
varying float vNdCY;                       // ndcY * tan(fov/2)
void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  vNdCY = mv.y / (-mv.z);                  // = ndcY * tanHalfFov
  gl_Position = projectionMatrix * mv;
}`;

  const skyFShader = `
uniform float uTanHalfFov;
uniform float uMinNDY;                     // horizon ndcY ≈ 0.2866
varying float vNdCY;

void main() {
  float ndcY = vNdCY / uTanHalfFov;
  // t = 0 at horizon, t = 1 at top of frame
  float t  = clamp((ndcY - uMinNDY) / (1.0 - uMinNDY), 0.0, 1.0);

  vec3 col;
  if (t < 0.5) {
    col = mix(vec3(1.0,0.690,0.400),     // #ffb066
              vec3(0.549,0.373,0.525),   // #8c5f86
              t * 2.0);
  } else {
    col = mix(vec3(0.549,0.373,0.525),   // #8c5f86
              vec3(0.078,0.133,0.310),   // #14224f
              (t - 0.5) * 2.0);
  }
  gl_FragColor = vec4(col, 1.0);
}`;

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);             // unit look direction (world −Z in view)
  const skyCenter = camera.position.clone().addScaledVector(dir, 500);

  const sky = new THREE.Mesh(
    new THREE.PlaneGeometry(2000, 800),
    new THREE.ShaderMaterial({
      uniforms: {
        uTanHalfFov: { value: tanHalfFov },
        uMinNDY:     { value: horizonNDY }
      },
      vertexShader: skyVShader,
      fragmentShader: skyFShader,
      side: THREE.FrontSide,
      clippingPlanes: [clipPlane]
    })
  );
  sky.position.copy(skyCenter);
  sky.lookAt(camera.position);               // face the camera
  sky.name = 'sky';
  scene.add(sky);

  /* ================================================================ */
  /* === SUN (MeshBasicMaterial) =================================== */
  /* ================================================================ */

  const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(sunRadius, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xffe6b0, clippingPlanes: [clipPlane] })
  );
  sunMesh.position.copy(sunPos);
  sunMesh.name = 'sun';
  scene.add(sunMesh);

  /* ================================================================ */
  /* === ANIMATION & PROBE ========================================= */
  /* ================================================================ */

  window.__step = function (dt) {
    dt       = dt || 0;
    t       += dt;
    waterUniforms.uTime.value = t;
    renderer.render(scene, camera);
    return window.__probe();
  };

  window.__probe = function () {
    return {
      t:       parseFloat(t.toFixed(4)),
      objects: [
        { name:'water', type:'plane', position:[0, 0, -199.6] },
        { name:'sky',   type:'plane', position: sky.position.toArray() },
        { name:'sun',   type:'sphere',position: sunPos.toArray() }
      ],
      horizon: 0.357,
      wave:    parseFloat(t.toFixed(4))
    };
  };

  /* First frame — signal ready */
  renderer.render(scene, camera);
  window.__ready = true;

})();
</script>
</body>
</html>
