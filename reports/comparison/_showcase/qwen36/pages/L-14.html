<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Water Surface</title>
  <style>body { margin: 0; overflow: hidden; }</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
  <script type="module">
    const THREE = window.THREE;

    const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(800, 600, false);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 1000);
    camera.position.set(0, 0.9, 0);
    camera.lookAt(0, 0.9 - 0.1185, -1);

    // Water
    const waterGeo = new THREE.PlaneGeometry(300, 400.0, 180, 200);
    waterGeo.rotateX(-Math.PI / 2);
    waterGeo.translate(0, 0, -199.6); // z from 0.4 to -399.6
    const waterMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uCamPos: { value: camera.position },
        uSunDir: { value: new THREE.Vector3() }
      },
      vertexShader: `
        uniform float uTime;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying vec2 vUv;

        void main() {
          vUv = uv;
          vec3 pos = position;
          vec2 p = pos.xz;
          float t = uTime;

          vec3 d1 = vec3(0.924, 0.383, 0.0);
          float k1 = 0.38, w1 = 0.90, a1 = 0.26;
          vec3 d2 = vec3(-0.643, 0.766, 0.0);
          float k2 = 0.72, w2 = 1.50, a2 = 0.16;
          vec3 d3 = vec3(0.309, -0.951, 0.0);
          float k3 = 1.25, w3 = 2.40, a3 = 0.09;
          float p1 = 2.282, p2 = 2.282 + 1.7, p3 = 2.282 + 3.4;

          float h = 0.0;
          float dhdx = 0.0;
          float dhdz = 0.0;

          float arg1 = k1 * dot(d1.xz, p) - w1 * t + p1;
          h += a1 * sin(arg1);
          dhdx += a1 * k1 * cos(arg1) * d1.x;
          dhdz += a1 * k1 * cos(arg1) * d1.z;

          float arg2 = k2 * dot(d2.xz, p) - w2 * t + p2;
          h += a2 * sin(arg2);
          dhdx += a2 * k2 * cos(arg2) * d2.x;
          dhdz += a2 * k2 * cos(arg2) * d2.z;

          float arg3 = k3 * dot(d3.xz, p) - w3 * t + p3;
          h += a3 * sin(arg3);
          dhdx += a3 * k3 * cos(arg3) * d3.x;
          dhdz += a3 * k3 * cos(arg3) * d3.z;

          h *= 1.080;
          dhdx *= 1.080;
          dhdz *= 1.080;

          pos.y += h;
          vNormal = normalize(vec3(-dhdx, 1.0, -dhdz));
          vWorldPos = (modelMatrix * vec4(pos, 1.0)).xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying vec2 vUv;
        uniform vec3 uCamPos;
        uniform vec3 uSunDir;

        void main() {
          vec3 N = normalize(vNormal);
          vec3 V = normalize(uCamPos - vWorldPos);
          vec3 L = normalize(uSunDir);

          float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
          vec3 colHorizon = vec3(0.184, 0.525, 0.690);
          vec3 colBottom = vec3(0.043, 0.153, 0.251);
          vec3 waterCol = mix(colBottom, colHorizon, fresnel);

          vec3 R = reflect(-L, N);
          float spec = pow(max(dot(R, V), 0.0), 32.0);
          vec3 sunCol = vec3(1.0, 0.902, 0.690);
          waterCol += sunCol * spec * 1.5;

          float track = exp(-vWorldPos.x * vWorldPos.x / 0.35) * smoothstep(-2.0, -25.0, vWorldPos.z);
          waterCol += sunCol * track * 0.8;

          gl_FragColor = vec4(waterCol, 1.0);
        }
      `
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.name = 'water';
    scene.add(water);

    // Sky
    const skyGeo = new THREE.PlaneGeometry(1000, 1000);
    const skyMat = new THREE.ShaderMaterial({
      uniforms: {
        uCamPos: { value: camera.position }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldPos;
        void main() {
          vUv = uv;
          vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        varying vec3 vWorldPos;
        uniform vec3 uCamPos;
        void main() {
          vec3 col1 = vec3(1.0, 0.690, 0.400);
          vec3 col2 = vec3(0.549, 0.373, 0.525);
          vec3 col3 = vec3(0.078, 0.133, 0.310);
          vec3 skyCol;
          if (vUv.y < 0.5) {
            skyCol = mix(col1, col2, vUv.y * 2.0);
          } else {
            skyCol = mix(col2, col3, (vUv.y - 0.5) * 2.0);
          }
          gl_FragColor = vec4(skyCol, 1.0);
        }
      `
    });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    sky.name = 'sky';
    scene.add(sky);

    // Sun
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const frameHeightAt300 = 2 * 300 * Math.tan(Math.PI / 4 / 2);
    const sunOffset = 0.012 * frameHeightAt300;
    const sunPos = camera.position.clone().add(dir.clone().multiplyScalar(300)).add(camera.up.clone().multiplyScalar(sunOffset));
    const sunGeo = new THREE.PlaneGeometry(25, 25);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffe6b0 });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    sun.position.copy(sunPos);
    sun.lookAt(camera.position);
    sun.name = 'sun';
    scene.add(sun);

    // Update sun direction for water shader
    waterMat.uniforms.uSunDir.value.copy(sunPos.clone().sub(new THREE.Vector3(0, 0, 0)).normalize());

    // Animation & Probe
    let t = 0.0;
    window.__step = function(dt) {
      t += dt;
      waterMat.uniforms.uTime.value = t;
      renderer.render(scene, camera);
      return window.__probe();
    };

    window.__probe = function() {
      return {
        t: t.toFixed(4),
        objects: ['water', 'sky', 'sun'],
        horizon: 0.357,
        wave: t.toFixed(4)
      };
    };

    window.__ready = true;
  </script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
