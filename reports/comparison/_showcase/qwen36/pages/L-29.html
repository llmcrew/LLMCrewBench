<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Orbital Station Escape</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// LCG Randomness
let lcg = 364651;
function rnd() {
  lcg = (lcg * 1103515245 + 12345) % 2147483648;
  return lcg / 2147483648;
}

// Scene Setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020205);
scene.fog = new THREE.FogExp2(0x020205, 0.008);

const camera = new THREE.PerspectiveCamera(45, 1920/1080, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x303040, 0.6);
scene.add(ambientLight);
const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
sunLight.position.set(5, 3, 5);
scene.add(sunLight);

// Earth
const earthGeo = new THREE.SphereGeometry(3.6, 64, 64);
const earthMat = new THREE.ShaderMaterial({
  uniforms: {
    time: { value: 0 },
    crackIntensity: { value: 0 },
    lightDir: { value: sunLight.position.clone().normalize() }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPosition;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPosition = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float time;
    uniform float crackIntensity;
    uniform vec3 lightDir;
    varying vec3 vNormal;
    varying vec3 vPosition;
    
    float hash(vec3 p) {
      p = fract(p * 0.3183099 + vec3(.1, .2, .3));
      p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }
    float noise(vec3 p) {
      vec3 i = floor(p);
      vec3 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
            mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
        mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
            mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    
    void main() {
      vec3 pos = vPosition;
      float n = noise(pos * 2.0 + time * 0.1);
      float storms = smoothstep(0.4, 0.6, n);
      float ash = smoothstep(0.6, 0.8, n);
      
      vec3 baseColor = mix(vec3(0.1, 0.2, 0.4), vec3(0.2, 0.3, 0.5), storms);
      baseColor = mix(baseColor, vec3(0.5, 0.5, 0.5), ash);
      
      float cracks = smoothstep(0.7, 0.9, noise(pos * 5.0 + time * 0.05));
      cracks *= crackIntensity;
      
      float diff = max(dot(vNormal, normalize(lightDir)), 0.0);
      vec3 litColor = baseColor * (0.3 + 0.7 * diff);
      vec3 finalColor = mix(litColor, vec3(1.0, 0.54, 0.3), cracks);
      gl_FragColor = vec4(finalColor, 1.0);
    }
  `
});
const earth = new THREE.Mesh(earthGeo, earthMat);
earth.position.set(0.4, -2.6, -22);
scene.add(earth);

// Atmosphere
const atmosGeo = new THREE.SphereGeometry(3.85, 64, 64);
const atmosMat = new THREE.ShaderMaterial({
  uniforms: {
    color: { value: new THREE.Color(0x5e9fe0) }
  },
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 color;
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.65 - dot(vNormal, vec3(0,0,1)), 2.5);
      gl_FragColor = vec4(color, intensity * 0.4);
    }
  `,
  transparent: true,
  side: THREE.FrontSide,
  depthWrite: false
});
const atmosphere = new THREE.Mesh(atmosGeo, atmosMat);
atmosphere.position.copy(earth.position);
scene.add(atmosphere);

// Moon
const moonGeo = new THREE.SphereGeometry(0.9, 64, 64);
const moonMat = new THREE.ShaderMaterial({
  uniforms: {
    cutoutPos: { value: new THREE.Vector3(-2.3, 2.5, -33.5) }
  },
  vertexShader: `
    varying vec3 vPosition;
    void main() {
      vPosition = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 cutoutPos;
    varying vec3 vPosition;
    void main() {
      float dist = distance(vPosition, cutoutPos);
      if (dist < 0.9) discard;
      float diff = max(dot(normalize(vPosition - cutoutPos), normalize(vec3(5,3,5))), 0.0);
      vec3 color = vec3(0.6, 0.59, 0.66) * (0.4 + 0.6 * diff);
      gl_FragColor = vec4(color, 1.0);
    }
  `
});
const moon_broken = new THREE.Mesh(moonGeo, moonMat);
moon_broken.position.set(-2.6, 2.2, -34);
scene.add(moon_broken);

// Station
const station = new THREE.Group();
station.position.set(0, 0.2, 3.6);

const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 16);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.5, metalness: 0.8 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.rotation.x = Math.PI / 2;
station.add(body);

const panelGeo = new THREE.BoxGeometry(2.5, 0.1, 0.6);
const panelMat = new THREE.MeshStandardMaterial({ color: 0x111133, roughness: 0.2, metalness: 0.9, emissive: 0x000022 });
const panel1 = new THREE.Mesh(panelGeo, panelMat);
panel1.position.set(0, 0.5, 0);
station.add(panel1);
const panel2 = panel1.clone();
panel2.position.y = -0.5;
station.add(panel2);

const nozzleGeo = new THREE.ConeGeometry(0.2, 0.5, 16);
const nozzleMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
const nozzle = new THREE.Mesh(nozzleGeo, nozzleMat);
nozzle.rotation.x = Math.PI / 2;
nozzle.position.z = -1.0;
station.add(nozzle);

const glowGeo = new THREE.SphereGeometry(0.1, 16, 16);
const glowMat = new THREE.MeshBasicMaterial({ color: 0x8fd8ff });
const engine_glow1 = new THREE.Mesh(glowGeo, glowMat);
engine_glow1.position.set(0, 0.1, -1.2);
station.add(engine_glow1);
const engine_glow2 = engine_glow1.clone();
engine_glow2.position.set(0, -0.1, -1.2);
station.add(engine_glow2);
const engine_glow3 = engine_glow1.clone();
engine_glow3.position.set(0, 0, -1.2);
station.add(engine_glow3);

const engineLight = new THREE.PointLight(0x8fd8ff, 2, 5);
engineLight.position.set(0, 0, -1.2);
station.add(engineLight);

scene.add(station);

// Dust Ring
const dustCount = 140;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i*3] = (rnd() - 0.5) * 4;
  dustPos[i*3+1] = (rnd() - 0.5) * 4;
  dustPos[i*3+2] = (rnd() - 0.5) * 4;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: 0xc8d4e4, size: 0.05, transparent: true, opacity: 0.8 });
const dust_ring = new THREE.Points(dustGeo, dustMat);
scene.add(dust_ring);

// Debris Belt
const debrisCount = 60;
const debrisGeo = new THREE.BufferGeometry();
const debrisPos = new Float32Array(debrisCount * 3);
for (let i = 0; i < debrisCount; i++) {
  debrisPos[i*3] = (rnd() - 0.5) * 10;
  debrisPos[i*3+1] = (rnd() - 0.5) * 6;
  debrisPos[i*3+2] = -22 + rnd() * 26;
}
debrisGeo.setAttribute('position', new THREE.BufferAttribute(debrisPos, 3));
const debrisMat = new THREE.PointsMaterial({ color: 0x555555, size: 0.08 });
const debris_belt = new THREE.Points(debrisGeo, debrisMat);
scene.add(debris_belt);

// Stars
const starsCount = 2600;
const starsGeo = new THREE.BufferGeometry();
const starsPos = new Float32Array(starsCount * 3);
for (let i = 0; i < starsCount; i++) {
  starsPos[i*3] = (rnd() - 0.5) * 200;
  starsPos[i*3+1] = (rnd() - 0.5) * 200;
  starsPos[i*3+2] = (rnd() - 0.5) * 200;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
const stars = new THREE.Points(starsGeo, starsMat);
scene.add(stars);

// Camera Animation
const camStart = new THREE.Vector3(0.26, 0.25, 2.2);
const camEnd = new THREE.Vector3(-1.30, 0.42, 14);
const camDuration = 5.66;
let t = 0;

// Probe & Step
window.__probe = function() {
  const dist = station.position.distanceTo(earth.position);
  return {
    t: t.toFixed(4),
    objects: ['earth', 'atmosphere', 'moon_broken', 'dust_ring', 'station', 'debris_belt', 'stars'],
    camera: [camera.position.x, camera.position.y, camera.position.z],
    distance: dist.toFixed(4)
  };
};

window.__step = function(dt) {
  t += dt;
  
  // Station moves away
  station.position.z -= dt * 0.5;
  station.rotation.y += dt * 0.1;
  
  // Dust moves
  const dPos = dust_ring.geometry.attributes.position.array;
  for (let i = 0; i < dustCount; i++) {
    dPos[i*3+2] -= dt * 0.2;
    if (dPos[i*3+2] < station.position.z - 2) dPos[i*3+2] = station.position.z + 2;
  }
  dust_ring.geometry.attributes.position.needsUpdate = true;
  
  // Debris moves slowly
  const bPos = debris_belt.geometry.attributes.position.array;
  for (let i = 0; i < debrisCount; i++) {
    bPos[i*3+2] -= dt * 0.1;
    if (bPos[i*3+2] < earth.position.z + 5) bPos[i*3+2] = station.position.z - 2;
  }
  debris_belt.geometry.attributes.position.needsUpdate = true;
  
  // Earth cracks
  earthMat.uniforms.time.value = t;
  earthMat.uniforms.crackIntensity.value = Math.min(1.0, t * 0.5);
  
  // Camera
  let progress = Math.min(1.0, t / camDuration);
  camera.position.lerpVectors(camStart, camEnd, progress);
  camera.lookAt(station.position);
  
  // Render
  renderer.render(scene, camera);
  
  return window.__probe();
};

window.__ready = true;
window.__step(0);
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
