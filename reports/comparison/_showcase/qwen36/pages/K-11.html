<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Particle Simulation</title>
  <style>body { margin: 0; overflow: hidden; }</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
  <script type="module">
    const THREE = window.THREE;

    // Scene
    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
    camera.position.set(4.0, 3.0, 18.0);
    camera.lookAt(4.0, 3.0, 0.0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(800, 600, false);
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(6.0, 10.0, 10.0);
    scene.add(dirLight);

    // Backdrop
    const backdropGeo = new THREE.PlaneGeometry(40, 40);
    const backdropMat = new THREE.MeshStandardMaterial({ color: 0x22303f, roughness: 1, metalness: 0 });
    const backdrop = new THREE.Mesh(backdropGeo, backdropMat);
    backdrop.position.z = -2;
    backdrop.name = 'backdrop';
    scene.add(backdrop);

    // Particles
    const particleGeo = new THREE.SphereGeometry(0.3, 16, 16);
    const particleMat = new THREE.MeshStandardMaterial({ color: 0xffa64d });
    const particlesMesh = new THREE.InstancedMesh(particleGeo, particleMat, 36);
    particlesMesh.name = 'particles';
    scene.add(particlesMesh);

    // LCG & Initial Positions
    let s = 2070952145;
    const particlesState = [];
    const dummy = new THREE.Object3D();

    for (let i = 0; i < 36; i++) {
      s = (1664525 * s + 1013904223) % 4294967296;
      const u = s / 4294967296;
      const x = 8.0 * u;
      const y = 6.0 * u;
      particlesState.push({ x, y });
      dummy.position.set(x, y, 0);
      dummy.updateMatrix();
      particlesMesh.setMatrixAt(i, dummy.matrix);
    }
    particlesMesh.instanceMatrix.needsUpdate = true;

    // Simulation State
    let steps = 0;
    const A = 1.5;
    const B = 1.5;

    window.__step = function(dt) {
      for (let i = 0; i < 36; i++) {
        const p = particlesState[i];
        const vx = A * Math.sin(Math.PI * p.y / 6.0);
        const vy = B * Math.cos(Math.PI * p.x / 8.0);
        p.x += vx * dt;
        p.y += vy * dt;

        dummy.position.set(p.x, p.y, 0);
        dummy.updateMatrix();
        particlesMesh.setMatrixAt(i, dummy.matrix);
      }
      particlesMesh.instanceMatrix.needsUpdate = true;
      steps++;
    };

    window.__probe = function() {
      return {
        steps: steps,
        field: { A: A, B: B },
        particles: particlesState.map(p => ({
          x: Number(p.x.toFixed(4)),
          y: Number(p.y.toFixed(4))
        })),
        camera: [
          Number(camera.position.x.toFixed(4)),
          Number(camera.position.y.toFixed(4)),
          Number(camera.position.z.toFixed(4))
        ],
        objects: ["backdrop", "particles"]
      };
    };

    // Initial Render
    renderer.render(scene, camera);
    window.__ready = true;
  </script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
