<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ночной фейерверк</title>
<style>
body { margin: 0; overflow: hidden; background: #280f54; }
canvas { display: block; width: 100%; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ── LCG (детерминированный ПСЧ) ───────────────────────────── */
let LCG_S = 571619;
function lcg() {
  LCG_S = (1664525 * LCG_S + 1013904223) % 4294967296;
  return LCG_S / 4294967296;
}

/* ── Константы сцены ───────────────────────────────────────── */
const PI         = Math.PI;
const NP         = 320;      // частиц в залпе
const NB         = 3;        // количество залпов
const PB         = 20;       // буфер для probe: макс. частиц в расчёте
const HALF_FOV   = PI / 180 * 22.5;
const HS         = 12.0 * Math.tan(HALF_FOV);   // полувысота на дистанции 12
const ASPECT     = 800.0 / 600.0;
const XSC        = 2.0 * HS * ASPECT;            // масштаб X от доли кадра
const YSC        = 2.0 * HS;                      // масштаб Y от доли кадра

const SPEED_B    = 2.20;
const SPEED_OFF  = 0.65;
const MUL        = 0.5;
const G          = 0.5 * 1.10;                     // g в формуле y -= 0.5*g*tau^2
const LIFETIME   = 1.90;
const PERIOD     = 2.00;

const DELAYS     = [0.0, 0.3, 0.7];

const PALETTE    = [
  new THREE.Color(0xff0051),  // #ff0051 красный
  new THREE.Color(0xffc300),  // #ffc300 золотой
  new THREE.Color(0x19cdff),  // #19cdff голубой
];

/* ── Точки запуска  (fraction → 3D, z=0) ─────────────────── */
const LAUNCH = [
  [ (0.343 - 0.5) * XSC, (0.5 - 0.287) * YSC, 0.0 ],
  [ (0.373 - 0.5) * XSC, (0.5 - 0.329) * YSC, 0.0 ],
  [ (0.448 - 0.5) * XSC, (0.5 - 0.334) * YSC, 0.0 ],
];

/* ── Генерация направлений  (LCG) ─────────────────────────── */
const DIRS = [];
for (let b = 0; b < NB; b++) {
  const d = new Array(NP);
  for (let i = 0; i < NP; i++) {
    const u = lcg();                      // для z
    const v = lcg();                      // для phi
    const w = lcg();                      // для V
    const z = 1.0 - 2.0 * u;
    const phi = 2.0 * PI * v;
    const rr = Math.sqrt(Math.max(0.0, 1.0 - z * z));
    const V = SPEED_B * (SPEED_OFF + MUL * w);
    d[i] = { vx: rr * Math.cos(phi) * V,
             vy: z * V,
             vz: rr * Math.sin(phi) * V * 0.5 };
  }
  DIRS.push(d);
}

/* ── Сцена Three.js ────────────────────────────────────────── */
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 200);
camera.position.set(0, 0, 12.0);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
renderer.setClearAlpha(1);
renderer.setClearColor(0x280f54);
document.body.appendChild(renderer.domElement);

/* ── Буферы ────────────────────────────────────────────────── */
const posA = [];
const colA = [];
const bursts = [];

for (let b = 0; b < NB; b++) {
  const pos = new Float32Array(NP * 3);
  const col = new Float32Array(NP * 3);
  posA.push(pos);
  colA.push(col);

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geom.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size:           6.0,
    sizeAttenuation: false,
    transparent:    true,
    blending:       THREE.AdditiveBlending,
    depthTest:      false,
    vertexColors:   true,
  });

  const pts = new THREE.Points(geom, mat);
  pts.name = 'burst_' + (b + 1);
  scene.add(pts);
  bursts.push({ object: pts, pos, col, color: PALETTE[b] });
}

/* ── Данные probe ──────────────────────────────────────────── */
const probeOut = { r: 0, bright: 0 };
let probeData  = [{ r: 0, bright: 0 },
                  { r: 0, bright: 0 },
                  { r: 0, bright: 0 }];

/* ── Обновление физики ────────────────────────────────────── */
function update(t) {
  for (let b = 0; b < NB; b++) {
    const delay = DELAYS[b];
    let tau = (t - delay) % PERIOD;
    if (tau < 0) tau += PERIOD;

    const dir  = DIRS[b];
    const lac  = LAUNCH[b];
    const pos  = posA[b];
    const col  = colA[b];
    const bc   = PALETTE[b];

    let sumR  = 0;
    let sumBr = 0;
    let cnt   = 0;

    for (let i = 0; i < NP; i++) {
      const d = dir[i];

      // положение
      pos[i * 3]     = lac[0]       + d.vx * tau;
      pos[i * 3 + 1] = lac[1]       + d.vy * tau - G * tau * tau;
      pos[i * 3 + 2] = lac[2]       + d.vz * tau;

      // яркость
      const bright = (tau <= LIFETIME) ? Math.max(0.0, 1.0 - tau / LIFETIME) : 0;

      // цвет (с яркостью)
      col[i * 3]     = bc.r * bright;
      col[i * 3 + 1] = bc.g * bright;
      col[i * 3 + 2] = bc.b * bright;

      if (bright > 0) {
        const dx = pos[i * 3]     - lac[0];
        const dy = pos[i * 3 + 1] - lac[1];
        const dz = pos[i * 3 + 2] - lac[2];
        sumR  += Math.sqrt(dx * dx + dy * dy + dz * dz);
        sumBr += bright;
        cnt++;
      }
    }

    probeData[b].r          = cnt > 0 ? sumR / cnt  : 0.0;
    probeData[b].bright     = cnt > 0 ? sumBr / cnt  : 0.0;
  }
}

/* ── Метки обновлений ─────────────────────────────────────── */
const flags   = [false, false, false];
function markDirty(b) { flags[b] = true; }

/* ── window.__step / __probe ──────────────────────────────── */
let simTime = 0.0;

window.__step = function (dt) {
  simTime += dt;
  update(simTime);

  for (let b = 0; b < NB; b++) {
    posA[b].needsUpdate = true;
    colA[b].needsUpdate = true;
  }

  renderer.render(scene, camera);
  return window.__probe();
};

window.__probe = function () {
  const objects = [];
  for (let b = 0; b < NB; b++) {
    objects.push({ name: 'burst_' + (b + 1),
                   r:          probeData[b].r,
                   bright:     probeData[b].bright });
  }
  return {
    t:       simTime.toFixed(4),
    objects: objects,
    bursts:  probeData.map(d => ({ r: d.r, bright: d.bright })),
  };
};

/* ── Первичная отрисовка (t = 0) ──────────────────────────── */
update(0.0);
for (let b = 0; b < NB; b++) {
  posA[b].needsUpdate = true;
  colA[b].needsUpdate = true;
}
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
