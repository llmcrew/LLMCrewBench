<html>
<head>
  <meta charset="utf-8">
  <style>body { margin: 0; overflow: hidden; background: #280f54; }</style>

</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <script type="module">
    const THREE = window.THREE;

    // LCG Generator
    let s = 571619;
    function nextLCG() {
        s = (1664525 * s + 1013904223) % 4294967296;
        return s / 4294967296;
    }

    // Coordinate mapping
    const halfH = 12.0 * Math.tan(45 * Math.PI / 360);
    const scaleX = 2 * halfH * (800 / 600);
    const scaleY = 2 * halfH;
    const launchPoints = [
        { x: (0.343 - 0.5) * scaleX, y: (0.5 - 0.287) * scaleY, z: 0 },
        { x: (0.373 - 0.5) * scaleX, y: (0.5 - 0.329) * scaleY, z: 0 },
        { x: (0.448 - 0.5) * scaleX, y: (0.5 - 0.334) * scaleY, z: 0 }
    ];

    // Precompute particle directions & velocities
    const dirs = [];
    for (let i = 0; i < 3; i++) {
        dirs[i] = [];
        for (let j = 0; j < 320; j++) {
            const u = nextLCG();
            const v = nextLCG();
            const w = nextLCG();
            const z_dir = 1 - 2 * u;
            const phi = 2 * Math.PI * v;
            const rr = Math.sqrt(1 - z_dir * z_dir);
            const V = 2.20 * (0.65 + 0.5 * w);
            dirs[i].push({
                vx: rr * Math.cos(phi) * V,
                vy: z_dir * V,
                vz: rr * Math.sin(phi) * V * 0.5
            });
        }
    }

    // Three.js Setup
    const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(800, 600, false);
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 200);
    camera.position.set(0, 0, 12.0);
    camera.lookAt(0, 0, 0);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x280f54);

    const names = ['burst_1', 'burst_2', 'burst_3'];
    const colorsHex = [0xff0051, 0xffc300, 0x19cdff];
    const delays = [0.0, 0.3, 0.7];
    const bursts = [];

    for (let i = 0; i < 3; i++) {
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(320 * 3);
        const col = new Float32Array(320 * 4);
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(col, 4));

        const mat = new THREE.PointsMaterial({
            size: 6.0,
            sizeAttenuation: false,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            vertexColors: true
        });

        const pts = new THREE.Points(geo, mat);
        pts.name = names[i];
        scene.add(pts);
        bursts.push({ pts, geo, pos, col, delay: delays[i], color: colorsHex[i], launch: launchPoints[i] });
    }

    let t = 0;

    function updateBursts() {
        for (let i = 0; i < 3; i++) {
            const b = bursts[i];
            let tau = (t - b.delay) % 2.00;
            if (tau < 0) tau += 2.00;
            const visible = tau <= 1.90;
            const bright = visible ? Math.max(0, 1 - tau / 1.90) : 0;
            const c = new THREE.Color(b.color);

            for (let j = 0; j < 320; j++) {
                const idx = j;
                const d = dirs[i][j];
                if (visible) {
                    b.pos[idx * 3] = b.launch.x + d.vx * tau;
                    b.pos[idx * 3 + 1] = b.launch.y + d.vy * tau - 0.5 * 1.10 * tau * tau;
                    b.pos[idx * 3 + 2] = b.launch.z + d.vz * tau;
                    b.col[idx * 4] = c.r;
                    b.col[idx * 4 + 1] = c.g;
                    b.col[idx * 4 + 2] = c.b;
                    b.col[idx * 4 + 3] = bright;
                } else {
                    b.pos[idx * 3] = 0;
                    b.pos[idx * 3 + 1] = -100;
                    b.pos[idx * 3 + 2] = 0;
                    b.col[idx * 4 + 3] = 0;
                }
            }
            b.geo.attributes.position.needsUpdate = true;
            b.geo.attributes.color.needsUpdate = true;
        }
    }

    window.__probe = function() {
        let burstsData = [];
        for (let i = 0; i < 3; i++) {
            const b = bursts[i];
            let tau = (t - b.delay) % 2.00;
            if (tau < 0) tau += 2.00;
            const visible = tau <= 1.90;
            const bright = visible ? Math.max(0, 1 - tau / 1.90) : 0;
            let r = 0;
            if (visible) {
                let sumR = 0;
                for (let j = 0; j < 320; j++) {
                    const d = dirs[i][j];
                    const speed = Math.sqrt(d.vx * d.vx + d.vy * d.vy + d.vz * d.vz);
                    sumR += speed * tau;
                }
                r = sumR / 320;
            }
            burstsData.push({ r: +r.toFixed(4), bright: +bright.toFixed(4) });
        }
        return {
            t: +t.toFixed(4),
            objects: ['burst_1', 'burst_2', 'burst_3'],
            bursts: burstsData
        };
    };

    window.__step = function(dt) {
        t += dt;
        updateBursts();
        return window.__probe();
    };

    // Initial state & render
    updateBursts();
    renderer.render(scene, camera);
    window.__ready = true;
  </script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
