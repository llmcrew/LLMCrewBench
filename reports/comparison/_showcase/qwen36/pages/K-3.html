<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Damped Pendulum</title>
  <style>body { margin: 0; overflow: hidden; }</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
  <script type="module">
    const THREE = window.THREE;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 800/600, 0.1, 200);
    camera.position.set(0.0, 1.8, 9.0);
    camera.lookAt(0.0, 1.4, 0.0);

    const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(800, 600, false);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(5.0, 10.0, 9.0);
    scene.add(dirLight);

    const L = 2.28;
    const g = 9.81;
    const c = 0.12;

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x2b3a4a }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.2;
    ground.name = 'ground';
    scene.add(ground);

    const support = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.3, 0.5), new THREE.MeshStandardMaterial({ color: 0x8a93a6 }));
    support.position.set(0, 3.15, 0);
    support.name = 'support';
    scene.add(support);

    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, L, 16), new THREE.MeshStandardMaterial({ color: 0x5b6472 }));
    rod.name = 'rod';
    scene.add(rod);

    const bob = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), new THREE.MeshStandardMaterial({ color: 0xff8a3d }));
    bob.name = 'bob';
    scene.add(bob);

    let theta = 1.068;
    let omega = 0.0;
    let steps = 0;
    let t = 0.0;

    function updateScene() {
      const pivot = new THREE.Vector3(0, 3, 0);
      const bobPos = new THREE.Vector3(L * Math.sin(theta), 3 - L * Math.cos(theta), 0);
      bob.position.copy(bobPos);

      const dir = new THREE.Vector3().subVectors(bobPos, pivot).normalize();
      const mid = new THREE.Vector3().addVectors(pivot, bobPos).multiplyScalar(0.5);
      rod.position.copy(mid);
      rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    }

    window.__step = function(dt) {
      omega += (-g/L * Math.sin(theta) - c*omega) * dt;
      theta += omega * dt;
      steps++;
      t += dt;
      updateScene();
      return { theta, omega };
    };

    window.__probe = function() {
      return {
        steps: steps,
        t: Math.round(t * 10000) / 10000,
        objects: ['ground', 'support', 'rod', 'bob'],
        camera: [0, 1.8, 9],
        theta: Math.round(theta * 10000) / 10000,
        omega: Math.round(omega * 10000) / 10000,
        L: Math.round(L * 10000) / 10000
      };
    };

    updateScene();
    renderer.render(scene, camera);
    window.__ready = true;
  </script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
