<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><script src='../../../_vendor/three.global.js'></script>
</head>
<body style="margin:0;overflow:hidden;"><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
const THREE = window.THREE;

/* ── LCG ───────────────────────────────────────────────────────── */
let rs = 219090;                              // seed 219090
function rng(){
  rs = ((1664525*rs)+1013904223)%4294967296|0;
  return rs/4294967296;
}

/* ── Renderer / Camera ─────────────────────────────────────────── */
const canvas = document.getElementById('c');
const ren    = new THREE.WebGLRenderer({canvas, preserveDrawingBuffer:true});
ren.setPixelRatio(1);
ren.setSize(1920,1080,false);

const cam  = new THREE.PerspectiveCamera(45,800/600,0.1,200);
cam.position.set(0,0,10);
cam.lookAt(0,0,0);

const scene = new THREE.Scene();

/* ── Geometric constants (d=10 from camera) ─────────────────────── */
const hh = Math.tan(Math.PI*45/360)*10;    // ≈ 4.142 (half-height at z=0)
const hw = hh*800/600;                      // half-width at z=0
const F  = hh*2;                             // frame height
const Ppx = 1080/2;                          // NDC-half-height in px

/* ════════════ SKY (gradient plane) ═══════════════════════════════ */
const skyC = document.createElement('canvas');
skyC.width=2; skyC.height=512;
const sx = skyC.getContext('2d');
for(let i=0;i<512;i++){
  const t=i/511, r=9+t*12, g=7+t*4, b=34+t*22;
  sx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
  sx.fillRect(0,i,2,1);
}
const skyTex = new THREE.CanvasTexture(skyC);
skyTex.flipY = true;

const sky = new THREE.Mesh(
  new THREE.PlaneGeometry(hw*3, hh*3),
  new THREE.MeshBasicMaterial({map:skyTex,side:THREE.DoubleSide,depthWrite:false})
);
sky.name = 'sky';
sky.position.z = -99;
sky.renderOrder = 0;
scene.add(sky);

/* ════════════ MOUNTAIN RIDGE ═════════════════════════════════════ */
const rds = [0.395,0.367,0.438,0.144,0.242,0.229,0.420,0.260,0.363];
const NP  = rds.length;
const sh  = new THREE.Shape();
sh.moveTo(-hw,-hh);
for(let i=0;i<NP;i++){
  const x = -hw+(hw-(-hw))*i/(NP-1);
  const y = -hh+rds[i]*F;
  sh.lineTo(x,y);
}
sh.lineTo(hw,-hh);
sh.closePath();
const mnt = new THREE.Mesh(
  new THREE.ShapeGeometry(sh),
  new THREE.MeshBasicMaterial({color:0x00b1d9,side:THREE.DoubleSide})
);
mnt.name = 'ridge';
mnt.renderOrder = 1;
scene.add(mnt);

/* ════════════ STARS (InstancedMesh of 620 quadrilaterals) ════════ */
const NS    = 620;
const starG = new THREE.PlaneGeometry(1,1);
const starM = new THREE.MeshBasicMaterial({
  color:0xf2f6ff,
  blending:THREE.AdditiveBlending,
  depthTest:false, depthWrite:false
});
const stars = new THREE.InstancedMesh(starG,starM,NS);
stars.name = 'stars';
stars.renderOrder = 2;
scene.add(stars);

const dmy = new THREE.Object3D();
const sI  = [];
for(let i=0;i<NS;i++){
  const u  = rng();
  const u2 = rng();
  const u3 = rng();
  const u4 = rng();
  const fx = u2;
  const fy = u3*0.72;
  const ph = 6.283*u4;
  const szPx = 2.0+2.6*u;
  const wx = (fx-0.5)*2*hh*800/600;
  const wy = (0.5-fy)*2*hh;
  const wu = szPx*hh/Ppx;
  sI.push({fx,fy,ph,szPx,wx,wy,wu});
  dmy.position.set(wx,wy,0);
  dmy.scale.set(wu,wu,1);
  dmy.rotation.set(0,0,Math.PI/4);
  dmy.updateMatrix();
  stars.setMatrixAt(i,dmy.matrix);
}
stars.instanceMatrix.needsUpdate = true;

/* ════════════ MOON ═══════════════════════════════════════════════ */
const moonR = 0.075*F;
const mfx0  = 0.664;
const mfy   = 0.340;
let   mfx   = mfx0;

function moonX(){return(mfx-0.5)*2*hh*800/600;}
function moonY(){return(0.5-mfy)*2*hh;}

const moon = new THREE.Mesh(
  new THREE.CircleGeometry(moonR,32),
  new THREE.MeshBasicMaterial({color:0xffd699,side:THREE.DoubleSide})
);
moon.name = 'moon';
moon.renderOrder = 3;
scene.add(moon);

const glow = new THREE.Mesh(
  new THREE.CircleGeometry(moonR*3,32),
  new THREE.MeshBasicMaterial({
    color:0xffd699,
    blending:THREE.AdditiveBlending,
    transparent:true,opacity:0.28,
    depthWrite:false,side:THREE.DoubleSide
  })
);
glow.name = 'moonglow';
glow.renderOrder = 4;
scene.add(glow);

function placeMoon(){
  moon.position.set(moonX(),moonY(),-0.05);
  glow.position.set(moonX(),moonY(),-0.04);
}
placeMoon();

/* ════════════ ANIMATION ═════════════════════════════════════════ */
let t = 0;

window.__step = function(dt){
  t += dt;
  for(let i=0;i<NS;i++){
    const s = sI[i];
    const sc = 0.5+0.5*Math.sin(s.ph+1.7*t);
    dmy.position.set(s.wx,s.wy,0);
    dmy.scale.set(s.wu*sc, s.wu*sc, 1);
    dmy.rotation.set(0,0,Math.PI/4);
    dmy.updateMatrix();
    stars.setMatrixAt(i,dmy.matrix);
  }
  stars.instanceMatrix.needsUpdate = true;
  mfx = mfx0+0.02*t;
  placeMoon();
  ren.render(scene,cam);
};

window.__probe = function(){
  return {
    t:      t.toFixed(4),
    objects:scene.children.map(o=>({name:o.name})),
    moon:   mfx.toFixed(4)
  };
};

/* ── First render ──────────────────────────────────────────────── */
__step(0);
ren.render(scene,cam);
window.__ready = true;
</script>
</body>
</html>
