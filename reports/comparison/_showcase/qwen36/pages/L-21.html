<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Аналоговая рубка с дождём</title>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

// --- LCG Determinism ---
let lcg = 782736;
function rnd() {
  lcg = (lcg * 1103515245 + 12345) % 2147483648;
  return lcg / 2147483648;
}

// --- Renderer & Camera ---
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 100);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, -1);

// Scale factor to map 800x600 pixels to reasonable 3D units
const S = 0.01;

// --- Colors ---
const COL_DARK = 0x2a1c4a;
const COL_GREEN = 0x57e08a;
const COL_AMBER = 0xffd166;
const COL_COLD = 0xa8c8dc;
const COL_DARK_BLUE = 0x1a2140;

// --- Scene Objects ---
const objects = {};

// night
const nightGeo = new THREE.PlaneGeometry(10, 10);
const nightMat = new THREE.MeshBasicMaterial({ color: COL_DARK });
objects.night = new THREE.Mesh(nightGeo, nightMat);
objects.night.position.z = -0.45;
scene.add(objects.night);

// glass
const glassGeo = new THREE.PlaneGeometry(6.24, 2.76);
const glassMat = new THREE.MeshBasicMaterial({ color: COL_COLD, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
objects.glass = new THREE.Mesh(glassGeo, glassMat);
objects.glass.position.set(0, 3.9, -0.05);
scene.add(objects.glass);

// canopy above glass
const canopyGeo = new THREE.PlaneGeometry(6.24, 0.72);
const canopyMat = new THREE.MeshBasicMaterial({ color: COL_DARK });
objects.canopy = new THREE.Mesh(canopyGeo, canopyMat);
objects.canopy.position.set(0, 5.28, -0.05);
scene.add(objects.canopy);

// rain
const rainCount = 44;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(rainCount * 3);
for (let i = 0; i < rainCount; i++) {
  rainPos[i * 3] = rnd() * 8;
  rainPos[i * 3 + 1] = 2.52 + rnd() * 2.76;
  rainPos[i * 3 + 2] = -0.12;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.PointsMaterial({ color: COL_COLD, size: 0.05, blending: THREE.AdditiveBlending, depthWrite: false });
objects.rain = new THREE.Points(rainGeo, rainMat);
scene.add(objects.rain);

// skyline
const skylineGroup = new THREE.Group();
const buildings = [
  { w: 0.8, h: 1.5, x: 1.0 },
  { w: 1.2, h: 2.0, x: 2.5 },
  { w: 0.6, h: 1.2, x: 4.0 },
  { w: 1.0, h: 1.8, x: 5.5 },
  { w: 0.9, h: 1.4, x: 7.0 }
];
buildings.forEach(b => {
  const geo = new THREE.BoxGeometry(b.w, b.h, 0.1);
  const mat = new THREE.MeshBasicMaterial({ color: COL_DARK_BLUE });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(b.x, 2.52 + b.h / 2, -0.14);
  skylineGroup.add(mesh);
});
objects.skyline = skylineGroup;
scene.add(objects.skyline);

// drops
const dropsCount = 58;
const dropsGeo = new THREE.BufferGeometry();
const dropsPos = new Float32Array(dropsCount * 3);
for (let i = 0; i < dropsCount; i++) {
  dropsPos[i * 3] = rnd() * 8;
  dropsPos[i * 3 + 1] = 2.52 + rnd() * 2.76;
  dropsPos[i * 3 + 2] = -0.049;
}
dropsGeo.setAttribute('position', new THREE.BufferAttribute(dropsPos, 3));
const dropsMat = new THREE.PointsMaterial({ color: COL_COLD, size: 0.06, blending: THREE.AdditiveBlending, depthWrite: false });
objects.drops = new THREE.Points(dropsGeo, dropsMat);
scene.add(objects.drops);

// panel
const panelGeo = new THREE.PlaneGeometry(6.72, 0.84);
const panelMat = new THREE.MeshBasicMaterial({ color: COL_DARK });
objects.panel = new THREE.Mesh(panelGeo, panelMat);
objects.panel.position.set(4, 1.8, 0);
objects.panel.rotation.x = 0.25;
scene.add(objects.panel);

// screens
const screenGeo = new THREE.PlaneGeometry(0.88, 0.60);
const screenUniforms = { uTime: { value: 0 } };
const screenMat = new THREE.ShaderMaterial({
  uniforms: screenUniforms,
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main() {
      vec3 col = vec3(0.345, 0.878, 0.541);
      float scan = smoothstep(0.02, 0.0, abs(vUv.y - fract(uTime * 0.5)));
      col += scan * 0.4;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
objects.screens = [];
for (let i = 0; i < 4; i++) {
  const u = 0.20 + i * 0.20;
  const mesh = new THREE.Mesh(screenGeo, screenMat.clone());
  mesh.position.set(u * 8, 1.8, 0.01);
  scene.add(mesh);
  objects.screens.push(mesh);
}

// dials
objects.dials = [];
for (let i = 0; i < 5; i++) {
  const u = 0.45 + i * 0.025;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.1), new THREE.MeshBasicMaterial({ color: COL_AMBER }));
  mesh.position.set(u * 8, 2.12, 0.02);
  scene.add(mesh);
  objects.dials.push(mesh);
}

// toggles
objects.toggles = [];
for (let i = 0; i < 5; i++) {
  const u = 0.45 + i * 0.025;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.08), new THREE.MeshBasicMaterial({ color: COL_AMBER }));
  mesh.position.set(u * 8, 2.32, 0.03);
  scene.add(mesh);
  objects.toggles.push(mesh);
}

// floor
const floorGeo = new THREE.PlaneGeometry(8, 3.12);
const floorMat = new THREE.MeshBasicMaterial({ color: COL_DARK });
objects.floor = new THREE.Mesh(floorGeo, floorMat);
objects.floor.position.set(4, 1.56, -0.01);
scene.add(objects.floor);

// flash
const flashGeo = new THREE.PlaneGeometry(4, 2.4);
const flashMat = new THREE.MeshBasicMaterial({ color: COL_COLD, blending: THREE.AdditiveBlending, depthWrite: false });
objects.flash = new THREE.Mesh(flashGeo, flashMat);
objects.flash.position.set(2.72, 2.04, -0.14);
scene.add(objects.flash);

// --- State & Animation ---
let t = 0;
const speed = 0.018; // 1.80 * S

window.__probe = () => {
  const flashBright = 0.5 + 0.5 * Math.sin(2 * Math.PI * 0.94 * t);
  return {
    t: t.toFixed(4),
    objects: ["night", "glass", "rain", "skyline", "drops", "panel", "screen", "dial", "toggle", "floor", "flash"],
    flash: parseFloat(flashBright.toFixed(4))
  };
};

window.__step = (dt) => {
  t += dt;

  // Camera drift
  camera.position.x += 0.059 * dt;

  // Update rain
  const rPos = objects.rain.geometry.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
    rPos[i * 3 + 1] -= speed * dt;
    if (rPos[i * 3 + 1] < 2.52) rPos[i * 3 + 1] += 3.5;
  }
  objects.rain.geometry.attributes.position.needsUpdate = true;

  // Update drops
  const dPos = objects.drops.geometry.attributes.position.array;
  for (let i = 0; i < dropsCount; i++) {
    dPos[i * 3 + 1] -= speed * dt;
    if (dPos[i * 3 + 1] < 2.52) dPos[i * 3 + 1] += 3.5;
  }
  objects.drops.geometry.attributes.position.needsUpdate = true;

  // Flash brightness oscillation
  const flashBright = 0.5 + 0.5 * Math.sin(2 * Math.PI * 0.94 * t);
  objects.flash.material.opacity = flashBright;

  // Indicators & toggles brightness oscillation
  const indBright = 0.5 + 0.5 * Math.sin(2 * Math.PI * 1.5 * t);
  const amberColor = new THREE.Color(COL_AMBER);
  objects.dials.forEach(m => {
    m.material.color.copy(amberColor.multiplyScalar(indBright));
  });
  objects.toggles.forEach(m => {
    m.material.color.copy(amberColor.multiplyScalar(indBright));
  });

  // Scanline update
  screenUniforms.uTime.value = t;

  return window.__probe();
};

// --- Initial Render & Ready ---
function render() {
  renderer.render(scene, camera);
}

render();
window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
