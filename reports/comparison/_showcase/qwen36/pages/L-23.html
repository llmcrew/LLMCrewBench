<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body { margin: 0; overflow: hidden; background: #000; }</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ================================================================
   LCG  (seed 865521  –  no Math.random anywhere)
   ================================================================ */
let _lcg = 865521;
function rnd() {
  _lcg = (_lcg * 1103515245 + 12345) % 2147483648;
  return _lcg / 2147483648;
}

/* ================================================================
   Constants
   ================================================================ */
const NIGHT = 0x241644;
const CYAN  = 0x35d5e6;
const AMBER = 0xffb347;
const RAIN  = 0xa8c8dc;
const HULL  = 0x1a0e35;

/* ================================================================
   Scene
   ================================================================ */
const scene  = new THREE.Scene();
scene.background = new THREE.Color(NIGHT);

const camera = new THREE.PerspectiveCamera(48, 1920 / 1080, 0.1, 300);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, -1);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true, antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

/* ---- Lights ---- */
scene.add(new THREE.AmbientLight(0x1a0e35, 0.25));

const platLight = new THREE.PointLight(CYAN, 1.2, 12);
platLight.position.set(0, -0.8, -5);
scene.add(platLight);

const roverLight = new THREE.PointLight(AMBER, 0.8, 6);
roverLight.position.set(2.2, -0.2, -5);
scene.add(roverLight);

const holoLight = new THREE.PointLight(CYAN, 0.9, 12);
holoLight.position.set(-5, 1.5, -8);
scene.add(holoLight);

/* ================================================================
   1) Night backdrop   z = -45
   ================================================================ */
const nightGeo = new THREE.PlaneGeometry(200, 120);
const nightMat = new THREE.MeshBasicMaterial({ color: NIGHT, side: THREE.DoubleSide });
const nightObj = new THREE.Mesh(nightGeo, nightMat);
nightObj.position.z = -45;
nightObj.name = 'night';
scene.add(nightObj);

/* ================================================================
   2) Station hull   z = -18
   ================================================================ */
const hullGeo = new THREE.BoxGeometry(45, 24, 4);
const hullMat = new THREE.MeshBasicMaterial({ color: NIGHT });
const hullObj = new THREE.Mesh(hullGeo, hullMat);
hullObj.position.set(0, 0, -18);
hullObj.name = 'hull';
scene.add(hullObj);

// hull detail panels
for (let i = 0; i < 8; i++) {
  const pg = new THREE.BoxGeometry(3 + rnd() * 4, 2 + rnd() * 3, 0.1);
  const pm = new THREE.MeshBasicMaterial({ color: HULL });
  const p  = new THREE.Mesh(pg, pm);
  const a  = (i / 8) * Math.PI * 2;
  p.position.set(Math.cos(a) * 14, (rnd() - 0.5) * 18, -16);
  p.lookAt(0, p.position.y, -16);
  scene.add(p);
}

/* ================================================================
   3) Platform   0.52×0.10 frame,  v=0.62  u=0.52
   ================================================================ */
const platMat = new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.5 });

// dark base
const baseGeo = new THREE.BoxGeometry(18, 0.25, 7);
const baseMat = new THREE.MeshBasicMaterial({ color: NIGHT });
const baseObj = new THREE.Mesh(baseGeo, baseMat);
baseObj.position.set(0, -1.5, -5.5);
scene.add(baseObj);

// cyan top
const platGeo = new THREE.BoxGeometry(18, 0.04, 7);
const platObj = new THREE.Mesh(platGeo, platMat);
platObj.position.set(0, -1.36, -5.5);
scene.add(platObj);

// cyan edge strips
for (let side of [-1, 1]) {
  const sGeo = new THREE.BoxGeometry(18, 0.06, 0.04);
  const sMesh = new THREE.Mesh(sGeo,
    new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.7 }));
  sMesh.position.set(0, -1.34, side * 3.5);
  sMesh.name = 'neon_strip';
  scene.add(sMesh);
}
// transverse strips
for (let i = -3; i <= 3; i++) {
  const sGeo = new THREE.BoxGeometry(0.04, 0.06, 7);
  const sMesh = new THREE.Mesh(sGeo,
    new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.6 }));
  sMesh.position.set(i * 2.2, -1.34, -5.5);
  sMesh.name = 'neon_strip';
  scene.add(sMesh);
}

/* ================================================================
   4) Rover   on platform   (u≈0.55, v≈0.55 in frame)
   ================================================================ */
const roverG = new THREE.Group();

// body  60 % of total height  ≈ 0.6 h
const bodyGeo = new THREE.BoxGeometry(2.8, 0.66, 1.4);
const bodyMat = new THREE.MeshBasicMaterial({ color: NIGHT });
const bodyM = new THREE.Mesh(bodyGeo, bodyMat);
bodyM.position.y = 0.33;
roverG.add(bodyM);

// cabin  30 % of total height
const cabinGeo = new THREE.BoxGeometry(1.1, 0.39, 0.9);
const cabinMat = new THREE.MeshBasicMaterial({ color: HULL });
const cabinM = new THREE.Mesh(cabinGeo, cabinMat);
cabinM.position.set(-0.3, 0.825, 0);
roverG.add(cabinM);
// antenna
const antGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.5);
const antMat = new THREE.MeshBasicMaterial({ color: HULL });
const antM   = new THREE.Mesh(antGeo, antMat);
antM.position.set(-0.6, 1.25, 0);
roverG.add(antM);

// 2 wheels
const wGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.14, 16);
const wMat = new THREE.MeshBasicMaterial({ color: NIGHT });
for (const x of [0.7, -0.7]) {
  for (const z of [0.8, -0.8]) {
    const w = new THREE.Mesh(wGeo, wMat);
    w.rotation.x = Math.PI / 2;
    w.position.set(x, -0.08, z);
    roverG.add(w);
  }
}

// 3 amber lights (each ~0.10 frame width in screen when close)
const lGeo = new THREE.OctahedronGeometry(0.11, 2);
const lMat = new THREE.MeshBasicMaterial({ color: AMBER });
const roverLights = [];
const lightPos = [
  [-1.15, 0.65,  0.65],
  [-1.15, 0.65,  0],
  [-1.15, 0.65, -0.65]
];
lightPos.forEach(p => {
  const lm = new THREE.Mesh(lGeo, lMat.clone());
  lm.position.set(...p);
  lm.name = 'rover_light';
  roverG.add(lm);
  roverLights.push(lm);
});

// tiny forward-facing amber indicator lights
const fwdLGeo = new THREE.SphereGeometry(0.08, 8, 8);
const fwdLMat = new THREE.MeshBasicMaterial({ color: AMBER });
[-1, 0, 1].forEach((i, idx) => {
  const flm = new THREE.Mesh(fwdLGeo, fwdLMat.clone());
  flm.position.set(-1.55, 0.35 + (idx - 1) * 0.25, 0.75);
  flm.name = 'rover_light';
  roverG.add(flm);
});

// rover light spot on platform
const roverSpotGeo = new THREE.CircleGeometry(1.2, 32);
const roverSpotMat = new THREE.MeshBasicMaterial({
  color: AMBER, transparent: true, opacity: 0.12, side: THREE.DoubleSide
});
const roverSpot = new THREE.Mesh(roverSpotGeo, roverSpotMat);
roverSpot.rotation.x = -Math.PI / 2;
roverSpot.position.set(-1.5, -1.35, -5.5);
roverSpot.name = 'rover_spot';
scene.add(roverSpot);

roverG.position.set(1.8, -1.33, -5.5);
scene.add(roverG);

/* ================================================================
   5) Refueling tower   u≈0.25, v≈0.30   0.05×0.46 frame
   ================================================================ */
const towerGeo = new THREE.BoxGeometry(0.8, 3.6, 0.8);
const towerMat = new THREE.MeshBasicMaterial({ color: NIGHT });
const towerM   = new THREE.Mesh(towerGeo, towerMat);
towerM.position.set(-5.5, 0.2, -7);
towerM.name = 'tower';
scene.add(towerM);

// tower top
const tTopGeo = new THREE.BoxGeometry(1.2, 0.3, 1.2);
const tTopMat = new THREE.MeshBasicMaterial({ color: NIGHT });
const tTopM   = new THREE.Mesh(tTopGeo, tTopMat);
tTopM.position.set(-5.5, 2.15, -7);
scene.add(tTopM);

// amber beacon on top
const beaconGeo = new THREE.SphereGeometry(0.15, 12, 12);
const beaconMat = new THREE.MeshBasicMaterial({ color: AMBER });
const beacon    = new THREE.Mesh(beaconGeo, beaconMat);
beacon.position.set(-5.5, 2.4, -7);
beacon.name = 'tower_light';
scene.add(beacon);

// tower neon ring
const ringGeo = new THREE.TorusGeometry(0.55, 0.03, 8, 32);
const ringMat = new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.7 });
const ringM   = new THREE.Mesh(ringGeo, ringMat);
ringM.position.set(-5.5, 1.8, -7);
ringM.rotation.x = Math.PI / 2;
ringM.name = 'neon_ring';
scene.add(ringM);

// tower status light
const stLGeo = new THREE.SphereGeometry(0.08, 8, 8);
const stLMat = new THREE.MeshBasicMaterial({ color: AMBER });
const stLM   = new THREE.Mesh(stLGeo, stLMat);
stLM.position.set(-5.5, 1.2, -7.46);
stLM.name = 'tower_light';
scene.add(stLM);

/* ================================================================
   6) Hose   0.02 wide, 3 curved segments — cyan
   ================================================================ */
function buildHose() {
  const pts = [
    new THREE.Vector3(-5.1, 2.0, -7),
    new THREE.Vector3(-3.5, 1.2, -6.2),
    new THREE.Vector3(-1.0, 0.4, -5.8),
    new THREE.Vector3(1.2, -0.5, -5.5)
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube  = new THREE.TubeGeometry(curve, 30, 0.03, 8, false);
  const hoseMat = new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.8 });
  const hoseObj = new THREE.Mesh(tube, hoseMat);
  hoseObj.name = 'hose';
  scene.add(hoseObj);
}
buildHose();

// nozzle at rover end
const nozzleGeo = new THREE.CylinderGeometry(0.06, 0.04, 0.3, 8);
const nozzleMat = new THREE.MeshBasicMaterial({ color: CYAN });
const nozzle    = new THREE.Mesh(nozzleGeo, nozzleMat);
nozzle.position.set(1.2, -0.5, -5.2);
nozzle.rotation.z = Math.PI / 4;
nozzle.name = 'hose';
scene.add(nozzle);

/* ================================================================
   7) Holograms   3 cyan panels behind tower   v≈0.28
   ================================================================ */
const holoGroup = new THREE.Group();
for (let i = 0; i < 3; i++) {
  const hg = new THREE.PlaneGeometry(2.2, 2.2);
  const hm = new THREE.MeshBasicMaterial({
    color: CYAN, transparent: true, opacity: 0.35,
    side: THREE.DoubleSide
  });
  const hmesh = new THREE.Mesh(hg, hm);
  hmesh.position.set(-5 + i * 2.5, 1.5, -8.8);
  hmesh.name = 'holo';
  holoGroup.add(hmesh);
  // hologram scan line
  if (i < 2) {
    const scanGeo = new THREE.RingGeometry(0.6, 0.65, 32);
    const scanMat = new THREE.MeshBasicMaterial({
      color: CYAN, transparent: true, opacity: 0.25, side: THREE.DoubleSide
    });
    const scan = new THREE.Mesh(scanGeo, scanMat);
    scan.position.set(-5 + i * 2.5, 1.5, -8.78);
    scan.name = 'holo';
    holoGroup.add(scan);
  }
}
scene.add(holoGroup);

/* ================================================================
   8) Fog layers   v≈0.72 and v≈0.44
   ================================================================ */
function makeFog(y, z) {
  const fg = new THREE.PlaneGeometry(80, 8);
  const fm = new THREE.MeshBasicMaterial({
    color: RAIN, transparent: true, opacity: 0.27, side: THREE.DoubleSide
  });
  const f = new THREE.Mesh(fg, fm);
  f.position.set(0, y, z);
  f.name = 'fog';
  scene.add(f);
}
makeFog(-0.6, -20);    // lower fog v≈0.72
makeFog(0.6, -14);     // upper fog v≈0.44

/* ================================================================
   9) Rain drops   76 of them,  z=−3.9,  speed=2.20  unit/s
   ================================================================ */
const DROP_N = 76;
const drops    = [];
const dropGeo  = new THREE.BufferGeometry();
const dPos     = new Float32Array(DROP_N * 6); // 2 Vertices per line
const dropMat  = new THREE.LineBasicMaterial({ color: RAIN });

for (let i = 0; i < DROP_N; i++) {
  const x = (rnd() - 0.5) * 16;
  const y = rnd() * 18 - 8;
  drops.push({ x, y, z: -3.9, len: 0.35 });
  dPos[i * 6]     = x;
  dPos[i * 6 + 1] = y;
  dPos[i * 6 + 2] = -3.9;
  dPos[i * 6 + 3] = x;
  dPos[i * 6 + 4] = y - 0.35;
  dPos[i * 6 + 5] = -3.9;
}
dropGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
const dropLines = new THREE.LineSegments(dropGeo, dropMat);
scene.add(dropLines);

/* ================================================================
   10) Extra rain splashes near platform
   ================================================================ */
const splashGroup = new THREE.Group();
for (let i = 0; i < 12; i++) {
  const sg = new THREE.RingGeometry(0.04, 0.06, 12);
  const sm = new THREE.MeshBasicMaterial({
    color: RAIN, transparent: true, opacity: 0.4, side: THREE.DoubleSide
  });
  const s = new THREE.Mesh(sg, sm);
  s.rotation.x = -Math.PI / 2;
  s.position.set(
    (rnd() - 0.5) * 14,
    -1.33 + rnd() * 0.1,
    -5.5 + (rnd() - 0.5) * 5
  );
  s.name = 'splash';
  splashGroup.add(s);
}
splashGroup.visible = false; // we animate them in step
scene.add(splashGroup);

/* ================================================================
   11) Neon ceiling cables & details
   ================================================================ */
function makeCable(pts, color) {
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube  = new THREE.TubeGeometry(curve, 20, 0.02, 6, false);
  return new THREE.Mesh(tube, new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.6
  }));
}
// overhead cable from left
const cable1 = makeCable([
  new THREE.Vector3(-9, 3, -6),
  new THREE.Vector3(-6, 0.5, -5),
  new THREE.Vector3(-1, -0.2, -5.5),
  new THREE.Vector3(3, -0.6, -5.5)
], CYAN);
scene.add(cable1);

// structural supports
for (let i = 0; i < 4; i++) {
  const colGeo = new THREE.CylinderGeometry(0.08, 0.08, 7, 8);
  const colMat = new THREE.MeshBasicMaterial({ color: HULL });
  const col = new THREE.Mesh(colGeo, colMat);
  col.position.set(-8 + i * 5.3, -0.5, -5);
  scene.add(col);
}

/* ================================================================
   State
   ================================================================ */
let t = 0;
let padOp = 0.5;

/* ================================================================
   Animation helpers
   ================================================================ */
function updateCamera() {
  // x oscillates on 0.7 amplitude, freq 0.25 Hz
  const cx = Math.sin(2 * Math.PI * 0.25 * t) * 0.7;
  // z decreases 1.58 unit/s down to 2.0
  const cz = Math.max(2.0, 4 - 1.58 * t);
  camera.position.set(cx, 0, cz);

  // lookAt offset 0.3 left, slightly down to catch rover
  camera.lookAt(-0.3, -0.4, -5.5);
}

function updateNeon() {
  // deterministic blink: 5 Hz square wave
  const on = Math.sin(t * Math.PI * 10) >= 0;
  const intensity = on ? 1.0 : 0.25;

  scene.traverse(obj => {
    if (obj.name === 'neon_strip' || obj.name === 'neon_ring') {
      if (obj.material) obj.material.opacity = 0.35 + 0.45 * intensity;
    }
    if (obj.name === 'rover_light') {
      if (obj.material) obj.material.color.setHex(on ? AMBER : 0x885522);
    }
    if (obj.name === 'tower_light') {
      if (obj.material) obj.material.color.setHex(on ? AMBER : 0x884400);
    }
    if (obj.name === 'holo') {
      if (obj.material) obj.material.opacity = 0.15 + 0.2 * intensity;
    }
    if (obj.name === 'hose') {
      if (obj.material) obj.material.opacity = 0.5 + 0.3 * intensity;
    }
  });

  // flicker rover spot
  roverSpotMat.opacity = on ? 0.15 : 0.05;
}

function updatePlatform() {
  // gentle pulse on platform glow
  padOp = 0.4 + 0.15 * Math.sin(t * 1.3);
  platMat.opacity = padOp;
  platLight.intensity = 1.0 + 0.5 * Math.sin(t * 1.3);
}

function updateDrops(dt) {
  const p = dropLines.geometry.attributes.position.array;
  for (let i = 0; i < DROP_N; i++) {
    drops[i].y -= 2.20 * dt;
    if (drops[i].y < -8) {
      drops[i].y = 8 + rnd() * 4;
      drops[i].x = (rnd() - 0.5) * 16;
    }
    p[i * 6]     = drops[i].x;
    p[i * 6 + 1] = drops[i].y;
    p[i * 6 + 2] = -3.9;
    p[i * 6 + 3] = drops[i].x;
    p[i * 6 + 4] = drops[i].y - drops[i].len;
    p[i * 6 + 5] = -3.9;
  }
  dropLines.geometry.attributes.position.needsUpdate = true;
}

function updateSplash(dt) {
  splashGroup.visible = true;
  splashGroup.children.forEach(s => {
    s.material.opacity += dt * 2; // fade in
    if (s.material.opacity > 0.5) {
      s.material.opacity = 0.1;
      s.material.color.setHex(RAIN);
    } else if (s.material.opacity > 0.3) {
      s.material.color.setHex(0xffffff);
    }
  });
}

/* ================================================================
   Public API
   ================================================================ */
function updateScene(dt) {
  t += dt;
  updateCamera();
  updateNeon();
  updatePlatform();
  updateDrops(dt);
  updateSplash(dt);
}

function __probe() {
  return {
    t:       parseFloat(t.toFixed(4)),
    objects: [
      { name: 'night',    z: -45,  color: '#241644' },
      { name: 'hull',     z: -18,  color: '#241644' },
      { name: 'pad',      color: '#35d5e6',
        opacity: parseFloat(padOp.toFixed(4)) },
      { name: 'tower',    color: '#241644' },
      { name: 'hose',     color: '#35d5e6',
        segments: 3 },
      { name: 'holo',     color: '#35d5e6', count: 3 },
      { name: 'fog',      color: '#a8c8dc', opacity: 0.27, count: 2 },
      { name: 'drops',    color: '#a8c8dc', count: 76,
        z: -3.9, speed: 2.20 }
    ],
    camera: [
      parseFloat(camera.position.x.toFixed(4)),
      parseFloat(camera.position.z.toFixed(4))
    ],
    pad: parseFloat(padOp.toFixed(4))
  };
}

function __step(dt) {
  updateScene(dt);
  return __probe();
}

window.__step = __step;
window.__probe = __probe;

/* ================================================================
   First render → __ready
   ================================================================ */
renderer.render(scene, camera);
window.__ready = true;
console.log('__ready =', window.__ready);
</script>
</body>
</html>
