<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mandelbrot</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const scene = new THREE.Scene();

const geometry = new THREE.PlaneGeometry(2, 2);
const material = new THREE.ShaderMaterial({
    uniforms: { uZoom: { value: 1.5 } },
    vertexShader: `void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
        precision highp float;
        uniform float uZoom;
        void main() {
            vec2 uv = gl_FragCoord.xy / vec2(800.0, 600.0) * 2.0 - 1.0;
            float h = 1.2 / uZoom;
            float w = 1.6 / uZoom;
            vec2 c = uv * vec2(w, h) + vec2(-0.600, 0.000);

            vec2 z = vec2(0.0);
            int i;
            for (i = 0; i < 160; i++) {
                z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
                if (length(z) > 2.0) break;
            }

            float t;
            if (i == 160) {
                t = 1.0;
            } else {
                t = log(float(i + 1)) / log(161.0);
            }

            vec3 col;
            vec3 c0 = vec3(27.0, 18.0, 64.0) / 255.0;
            vec3 c1 = vec3(24.0, 183.0, 172.0) / 255.0;
            vec3 c2 = vec3(184.0, 242.0, 74.0) / 255.0;
            vec3 c3 = vec3(255.0, 95.0, 126.0) / 255.0;

            if (t < 0.30) {
                col = c0;
            } else if (t < 0.40) {
                col = mix(c0, c1, smoothstep(0.30, 0.40, t));
            } else if (t < 0.55) {
                col = c1;
            } else if (t < 0.62) {
                col = mix(c1, c0, smoothstep(0.55, 0.62, t));
            } else if (t < 0.70) {
                col = c0;
            } else if (t < 0.76) {
                col = mix(c0, c2, smoothstep(0.70, 0.76, t));
            } else if (t < 0.90) {
                col = c2;
            } else if (t < 0.96) {
                col = mix(c2, c3, smoothstep(0.90, 0.96, t));
            } else {
                col = c3;
            }

            gl_FragColor = vec4(col, 1.0);
        }
    `
});

const plane = new THREE.Mesh(geometry, material);
plane.name = 'Mandelbrot';
scene.add(plane);

let time = 0.0;

window.__step = function(dt) {
    time += dt;
    material.uniforms.uZoom.value = 1.500 * Math.exp(0.350 * time);
    renderer.render(scene, camera);
};

window.__probe = function() {
    return {
        t: parseFloat(time.toFixed(4)),
        objects: scene.children.map(c => c.name),
        zoom: parseFloat(material.uniforms.uZoom.value.toFixed(4))
    };
};

window.__ready = true;
renderer.render(scene, camera);
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
