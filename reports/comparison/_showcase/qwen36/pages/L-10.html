<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0;overflow:hidden}</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js"}}
</script>
<script type="module">
const THREE = window.THREE;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer: true});
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

let animTime = 0;

const uniforms = {
    uTime: {value: 0},
    uZoom: {value: 1.5}
};

const geometry = new THREE.PlaneGeometry(2, 2);
const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: `
        void main(){
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        }
    `,
    fragmentShader: `
        precision highp float;
        uniform float uTime;
        uniform float uZoom;

        void main(){
            vec2 uv = (gl_FragCoord.xy / vec2(1920.0,1080.0)) * 2.0 - 1.0;
            float hw = 1.6 / uZoom;
            float hh = 1.2 / uZoom;
            vec2 c = vec2(-0.600, 0.000) + uv * vec2(hw, hh);

            vec2 z = vec2(0.0);
            float iter = 0.0;
            for(int i=0;i<160;i++){
                float x2=z.x*z.x;
                float y2=z.y*z.y;
                if(x2+y2>4.0) break;
                z=vec2(x2-y2+c.x, 2.0*z.x*z.y+c.y);
                iter+=1.0;
            }

            float t;
            if(iter>=160.0){
                t=1.0;
            }else{
                t=log(iter+1.0)/log(161.0);
            }

            vec3 c0=vec3(27.0,18.0,64.0)/255.0;
            vec3 c1=vec3(24.0,183.0,172.0)/255.0;
            vec3 c2=vec3(184.0,242.0,74.0)/255.0;
            vec3 c3=vec3(255.0,95.0,126.0)/255.0;
            vec3 col;
            if(t<=0.30){
                col=c0;
            }else if(t<=0.40){
                col=mix(c0,c1,smoothstep(0.30,0.40,t));
            }else if(t<=0.55){
                col=c1;
            }else if(t<=0.62){
                col=mix(c1,c0,smoothstep(0.55,0.62,t));
            }else if(t<=0.70){
                col=c0;
            }else if(t<=0.76){
                col=mix(c0,c2,smoothstep(0.70,0.76,t));
            }else if(t<=0.90){
                col=c2;
            }else if(t<=0.96){
                col=mix(c2,c3,smoothstep(0.90,0.96,t));
            }else{
                col=c3;
            }
            gl_FragColor=vec4(col,1.0);
        }
    `
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

let hasRendered = false;

window.__step = function(dt){
    animTime += dt;
    uniforms.uTime.value = animTime;
    uniforms.uZoom.value = 1.500 * Math.exp(0.350 * animTime);
    renderer.render(scene, camera);
    hasRendered = true;
    return window.__probe();
};

window.__probe = function(){
    const z = uniforms.uZoom.value;
    const t = parseFloat(animTime.toFixed(4));
    return {
        t: t,
        uZoom: z,
        objects: [mesh],
        zoom: parseFloat(z.toFixed(4))
    };
};

/* initial render */
renderer.render(scene, camera);
hasRendered = true;
window.__ready = true;
</script>
</body>
</html>
