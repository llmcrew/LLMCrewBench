<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Оранжерея на станции</title>
<style>*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
const THREE = window.THREE;

/* ═══ LCG ═══ */
let _lcg=160488;
function rnd(){_lcg=(1103515245*_lcg+12345)%2147483648;return _lcg/2147483648;}
function rndR(a,b){return a+rnd()*(b-a);}

/* ═══ Renderer ═══ */
const renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(1920,1080,false);
renderer.setClearColor(0x123038);
document.body.appendChild(renderer.domElement);

/* ═══ Scene ═══ */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x123038);

const camera=new THREE.PerspectiveCamera(55,1920/1080,0.1,200);
camera.position.set(0,0,4);
camera.lookAt(0,0,-5);

const C=h=>new THREE.Color(h);
const M=(hex,o={})=>new THREE.MeshStandardMaterial({color:C(hex),...o});

/* ═══ LIGHTING ═══ */
scene.add(new THREE.AmbientLight(0x123038,0.5));
const lwp=[[-8,3.5,-5.5],[-4,4,-6.5],[0,4.5,-7],[4,4,-6.5],[8,3.5,-5.5]];
for(const p of lwp)scene.add(Object.assign(new THREE.PointLight(0xffc06a,2.5,20),{position:new THREE.Vector3(...p)}));
const dl=new THREE.DirectionalLight(0xa8c8dc,0.15);dl.position.set(5,10,-20);scene.add(dl);

/* ═══ DOME ═══ */
const gmc={color:0x123038,transparent:true,side:THREE.DoubleSide,roughness:0.06,metalness:0.08};

// back panel z=-14.8
const bp=new THREE.Mesh(new THREE.PlaneGeometry(28,18),
  new THREE.MeshPhysicalMaterial({...gmc,opacity:0.85}));
bp.position.set(0,1.5,-14.8);scene.add(bp);

// side panels at z=-12, rotated ±0.6 rad
for(const s of[-1,1]){
  const sp=new THREE.Mesh(new THREE.PlaneGeometry(28,18),
    new THREE.MeshPhysicalMaterial({...gmc,opacity:0.55}));
  sp.position.set(s*6.5,1.5,-12);
  sp.rotation.y=s*0.6;
  scene.add(sp);
}

// curved roof — hemisphere, transparent
const rm=new THREE.MeshPhysicalMaterial({...gmc,opacity:0.14,roughness:0.02,metalness:0.12});
const roof=new THREE.Mesh(new THREE.SphereGeometry(8,48,20,0,Math.PI*2,0,Math.PI/2),rm);
roof.position.set(0,1,-7);scene.add(roof);

// inner warm glow
const rgi=new THREE.Mesh(new THREE.SphereGeometry(7.9,48,20,0,Math.PI*2,0,Math.PI/2),
  new THREE.MeshPhysicalMaterial({color:0xffc06a,transparent:true,opacity:0.05,side:THREE.BackSide}));
rgi.position.set(0,1,-7);scene.add(rgi);

// dome arc frame — torus segments for structural ribs
const arcMat=new THREE.MeshStandardMaterial({color:0x123038,roughness:0.3,metalness:0.8,transparent:true,opacity:0.9});
for(let i=0;i<8;i++){
  const angle=(i/8)*Math.PI;
  const cx=Math.cos(angle)*8;
  const cz=Math.sin(angle)*8-7;
  const cy=2.5+Math.sin(angle)*2;
  const arc=new THREE.Mesh(new THREE.TorusGeometry(0.2,0.08,6,10,angle+0.4),arcMat);
  arc.position.set(cx-4*Math.cos(angle),cy,cz-4);
  arc.rotation.y=Math.PI/2-angle;
  arc.rotation.z=angle*0.5;
  scene.add(arc);
}

/* ═══ FLOOR ═══ */
const fl=new THREE.Mesh(new THREE.PlaneGeometry(60,40),M(0x123038,{roughness:0.9}));
fl.rotation.x=-Math.PI/2;fl.position.set(0,-6,-7);scene.add(fl);

// warm edge stripe
const em=new THREE.MeshStandardMaterial({color:0xffc06a,emissive:0xffc06a,emissiveIntensity:0.7,roughness:0.4});
for(let x=-12;x<=12;x+=3){
  const s=new THREE.Mesh(new THREE.BoxGeometry(2.5,0.05,0.06),em);
  s.position.set(x,-5.95,-7);scene.add(s);
}

// floor grid lines
const flm=new THREE.MeshStandardMaterial({color:0x1a3a42,roughness:0.7,metalness:0.4});
for(let z=-12;z<0;z+=2){
  const g=new THREE.Mesh(new THREE.BoxGeometry(24,0.02,0.03),flm);
  g.position.set(0,-5.94,z);scene.add(g);
}

/* ═══ RIBS on dome (4 curved dark strips) ═══ */
const rbm=new THREE.MeshStandardMaterial({color:0x123038,roughness:0.3,metalness:0.7});
for(let i=0;i<4;i++){
  const a=(i/4)*Math.PI+Math.PI*0.4;
  const rb=new THREE.Mesh(new THREE.BoxGeometry(0.14,12,0.14),rbm);
  rb.position.set(Math.sin(a)*8,5,Math.cos(a)*8-7);
  rb.rotation.z=-a*0.35;
  scene.add(rb);
}

/* ═══ LAMPS (5 planes under dome) ═══ */
const LU=[-0.72,-0.36,0,0.36,0.72];
for(let i=0;i<5;i++){
  scene.add(Object.assign(
    new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.2),
      new THREE.MeshStandardMaterial({color:0xffc06a,emissive:0xffc06a,emissiveIntensity:3,transparent:true,opacity:0.75,side:THREE.DoubleSide})),
    {position:new THREE.Vector3(LU[i]*16,1.8,-5-i*0.5),
     rotation:new THREE.Euler(-Math.PI/6,0,0)}
  ));
  // lamp glow sphere
  const glow=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,6),
    new THREE.MeshStandardMaterial({color:0xffc06a,emissive:0xffc06a,emissiveIntensity:2,transparent:true,opacity:0.4}));
  glow.position.set(LU[i]*16,1.5,-5-i*0.5);scene.add(glow);
}

/* ═══ PLANTS (4 trunks + leaves, z=-4..-9) ═══ */
const PU=[0.12,0.3,0.68,0.86];
const plants=[];
for(let i=0;i<4;i++){
  const px=(PU[i]-0.5)*18;
  const pz=-4-i*1.5;
  const h=0.3+i*0.0875;

  // trunk (dark cylinder)
  scene.add(Object.assign(
    new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.11,h+1.5,8),M(0x123038,{roughness:0.8})),
    {position:new THREE.Vector3(px,-6+(h+1.5)/2,pz)}
  ));

  // pot
  const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.38,0.55,8),M(0x1a2a30,{roughness:0.7,metalness:0.2}));
  pot.position.set(px,-5.72,pz);scene.add(pot);

  // 3 foliage spheres
  for(let j=0;j<3;j++){
    const ls=0.5+rnd()*0.6;
    const lf=new THREE.Mesh(new THREE.SphereGeometry(ls,8,6),M(0x7fd054,{roughness:0.7}));
    lf.position.set(px+(rnd()-0.5)*0.5,-6+h+0.5+j*0.55,pz+(rnd()-0.5)*0.5);
    lf.scale.set(1,0.6+rnd()*0.3,0.7+rnd()*0.3);
    scene.add(lf);
  }
  plants.push({x:px,z:pz});
}

/* ═══ METEORS (26, outside at z≈−22, falling) ═══ */
const MC=26,TL=6;
const MD=[];
const mPos=new Float32Array(MC*3);
for(let i=0;i<MC;i++){
  const sp=6+rnd()*3,dr=(rnd()-0.5)*2;
  MD.push({x:rndR(-22,22),y:rndR(8,22),z:rndR(-22,-28),speed:sp,drift:dr,trailT:new Float32Array(TL*3)});
  mPos[i*3]=MD[i].x;mPos[i*3+1]=MD[i].y;mPos[i*3+2]=MD[i].z;
}
const mGeo=new THREE.BufferGeometry();
mGeo.setAttribute('position',new THREE.BufferAttribute(mPos,3));
const mMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uColor:{value:new THREE.Color(0xa8c8dc)}},
  vertexShader:`
    void main(){
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_Position=projectionMatrix*mv;
      gl_PointSize=5.0*(200.0/(-mv.z+0.1));
    }`,
  fragmentShader:`
    uniform vec3 uColor;
    void main(){
      float d=length(gl_PointCoord-0.5);
      if(d>0.5)discard;
      gl_FragColor=vec4(uColor,1.0-d*2.0);
    }`
});
scene.add(new THREE.Points(mGeo,mMat));

// trails
const tGeo=new THREE.BufferGeometry();
const tPos=new Float32Array(MC*TL*3);
tGeo.setAttribute('position',new THREE.BufferAttribute(tPos,3));
const tMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uColor:{value:new THREE.Color(0xa8c8dc)}},
  vertexShader:`
    void main(){
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_Position=projectionMatrix*mv;
      gl_PointSize=3.0*(200.0/(-mv.z+0.1));
    }`,
  fragmentShader:`
    uniform vec3 uColor;
    void main(){
      float d=length(gl_PointCoord-0.5);
      if(d>0.5)discard;
      gl_FragColor=vec4(uColor,0.35*(1.0-d*2.0));
    }`
});
scene.add(new THREE.Points(tGeo,tMat));

/* ═══ DROPS (64 on dome, z≈−13.5) ═══ */
const DC=64;
const DD=[];
const dPos=new Float32Array(DC*3);
for(let i=0;i<DC;i++){
  const dx=rndR(-10,10),dy=rndR(-4,10),dz=rndR(-14.2,-13.2);
  DD.push({x:dx,y:dy,z:dz,dr:(rnd()-0.5)*0.35});
  dPos[i*3]=dx;dPos[i*3+1]=dy;dPos[i*3+2]=dz;
}
const dGeo=new THREE.BufferGeometry();
dGeo.setAttribute('position',new THREE.BufferAttribute(dPos,3));
const dMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uColor:{value:new THREE.Color(0xa8c8dc)}},
  vertexShader:`
    void main(){
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_Position=projectionMatrix*mv;
      gl_PointSize=5.0*(150.0/(-mv.z+0.1));
    }`,
  fragmentShader:`
    uniform vec3 uColor;
    void main(){
      float d=length(gl_PointCoord-0.5);
      if(d>0.5)discard;
      gl_FragColor=vec4(uColor,0.55*(1.0-d*2.0));
    }`
});
scene.add(new THREE.Points(dGeo,dMat));

/* ═══ EXTRA ═══ */
// stars (space outside dome)
const sg=new THREE.BufferGeometry(),sp=[];
for(let i=0;i<60;i++){sp.push(rndR(-35,35),rndR(-18,18),rndR(-45,-25));}
sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xa8c8dc,size:0.2,transparent:true,opacity:0.3,depthWrite:false})));

// station beams
const btm=M(0x123038,{roughness:0.6,metalness:0.7});
for(const s of[-1,1]){const b=new THREE.Mesh(new THREE.BoxGeometry(0.25,13,0.25),btm);b.position.set(s*11,-1,-7);scene.add(b);}
for(const z of[-12,-7,-4]){const b=new THREE.Mesh(new THREE.BoxGeometry(24,0.15,0.15),btm);b.position.set(0,-5.8,z);scene.add(b);}

/* ═══ ANIMATION & API ═══ */
let elapsed=0,camX=0,camZ=4;

function renewMeteor(m){
  m.y=rndR(14,24);
  m.x=rndR(-22,22);
  m.z=rndR(-24,-28);
  m.speed=6+rnd()*3;
  m.drift=(rnd()-0.5)*2;
  // reset trail
  for(let t=0;t<TL;t++){
    m.trailT[t*3]=0;m.trailT[t*3+1]=0;m.trailT[t*3+2]=0;
  }
}

function __step(dt){
  elapsed+=dt;

  // camera: z decreases 2.32/s to 1.0, x oscillates 0.6 units
  camZ=Math.max(4-2.32*elapsed,1.0);
  camX=0.6*Math.sin(2.8*elapsed);
  camera.position.set(camX,0,camZ);
  camera.lookAt(0,0,-5);

  // ── meteors ──
  const mp=mGeo.attributes.position.array;
  const tp=tGeo.attributes.position.array;
  for(let i=0;i<MC;i++){
    const m=MD[i];
    // update velocity for trail
    const vdx=m.drift*dt, vdy=m.speed*dt, vdz=m.speed*dt*0.05;
    // shift trail backward
    for(let t=TL-1;t>0;t--){
      m.trailT[t*3]=m.trailT[(t-1)*3]-vdx;
      m.trailT[t*3+1]=m.trailT[(t-1)*3+1]+vdy;
      m.trailT[t*3+2]=m.trailT[(t-1)*3+2]-vdz;
    }
    m.trailT[0]=vdx; // head offset
    m.trailT[1]=-vdy; // trail extends opposite to velocity
    m.trailT[2]=-vdz;

    m.y-=vdy;
    m.x+=vdx;
    m.z-=vdx*0.1;
    if(m.y<-10||m.z<-32){
      renewMeteor(m);
    }
    mp[i*3]=m.x;mp[i*3+1]=m.y;mp[i*3+2]=m.z;
    // trail
    for(let t=0;t<TL;t++){
      tp[i*TL*3+t*3]   = m.x-m.trailT[t*3];
      tp[i*TL*3+t*3+1] = m.y-m.trailT[t*3+1];
      tp[i*TL*3+t*3+2] = m.z-m.trailT[t*3+2];
    }
  }
  mGeo.attributes.position.needsUpdate=true;
  tGeo.attributes.position.needsUpdate=true;

  // ── drops: speed 2.00 units/s ──
  const dp=dGeo.attributes.position.array;
  for(let i=0;i<DC;i++){
    const d=DD[i];
    d.y+=2.00*dt;d.x+=d.drift*dt;
    if(d.y>12){d.y=rndR(-5,1);d.x=rndR(-10,10);d.dr=(rnd()-0.5)*0.35;}
    dp[i*3]=d.x;dp[i*3+1]=d.y;dp[i*3+2]=d.z;
  }
  dGeo.attributes.position.needsUpdate=true;

  return __probe();
}

function __probe(){
  const vec=new THREE.Vector3(MD[0].x,MD[0].y,MD[0].z);
  vec.project(camera);
  const sx=(vec.x*0.5+0.5)*1920;
  const sy=(-vec.y*0.5+0.5)*1080;
  return{
    t:parseFloat(elapsed.toFixed(4)),
    objects:[
      {name:'dome_back',z:-14.8,opacity:0.85},
      {name:'dome_side_l',z:-12,rot:-0.6},
      {name:'dome_side_r',z:-12,rot:0.6},
      {name:'floor',z:-7},
      {name:'roof',r:8},
      {name:'lamps',n:5,u:LU},
      {name:'plants',n:4,u:PU},
      {name:'meteors',n:MC,speed:[6,9]},
      {name:'drops',n:DC,speed:2.00}
    ],
    meteor:[parseFloat(sx.toFixed(4)),parseFloat(sy.toFixed(4))],
    camera:[parseFloat(camX.toFixed(4)),parseFloat(camZ.toFixed(4))]
  };
}

/* ═══ First render ═══ */
renderer.render(scene,camera);
window.__ready=true;
window.__step=__step;
window.__probe=__probe;
</script>
</body>
</html>
