<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Box Simulation</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
  <script type="module">
    const THREE = window.THREE;

    // --- Scene Setup ---
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
    camera.position.set(0.0, 4.0, 16.0);
    camera.lookAt(0.0, 2.0, 0.0);

    const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(800, 600, false);
    document.body.appendChild(renderer.domElement);

    // --- Lights ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(6.0, 12.0, 8.0);
    scene.add(dirLight);

    // --- Objects ---
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({ color: 0x2b3a4a })
    );
    floor.position.set(0, 0, 0);
    floor.rotation.set(-Math.PI / 2, 0, 0);
    floor.name = 'floor';
    scene.add(floor);

    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(16, 12),
      new THREE.MeshStandardMaterial({ color: 0x22303f })
    );
    wall.position.set(0, 2, -2);
    wall.name = 'wall';
    scene.add(wall);

    const ballGeo = new THREE.SphereGeometry(0.4, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({ color: 0xff8a3d });
    const balls = [];
    for (let i = 0; i < 4; i++) {
      const mesh = new THREE.Mesh(ballGeo, ballMat);
      mesh.name = `ball-${i}`;
      scene.add(mesh);
      balls.push({ mesh, x: 0, y: 0, vx: 0, vy: 0 });
    }

    // --- LCG Initialization ---
    let s = 2278553777;
    const MOD = 4294967296;
    for (let i = 0; i < 4; i++) {
      s = (1664525 * s + 1013904223) % MOD;
      const u = s / MOD;
      const x = -4 + 8 * u;
      const y = 0.8 + 1.2 * u;
      const vx = -3 + 6 * u;
      const vy = 3 + 7 * u;
      balls[i].x = x;
      balls[i].y = y;
      balls[i].vx = vx;
      balls[i].vy = vy;
      balls[i].mesh.position.set(x, y, 0);
    }

    // --- Simulation State ---
    let steps = 0;
    let bounces = 0;
    const r = 0.4;

    window.__step = function(dt) {
      for (let i = 0; i < 4; i++) {
        const b = balls[i];
        b.vy -= 9.0 * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        if (b.y - r < 0) {
          b.y = r;
          b.vy = -b.vy;
          bounces++;
        } else if (b.y + r > 4.0) {
          b.y = 4.0 - r;
          b.vy = -b.vy;
          bounces++;
        }
        if (b.x - r < -5.0) {
          b.x = -5.0 + r;
          b.vx = -b.vx;
          bounces++;
        } else if (b.x + r > 5.0) {
          b.x = 5.0 - r;
          b.vx = -b.vx;
          bounces++;
        }
        b.mesh.position.set(b.x, b.y, 0);
      }
      steps++;
    };

    window.__probe = function() {
      return {
        steps: steps,
        bounces: bounces,
        balls: balls.map(b => ({
          x: Math.round(b.x * 10000) / 10000,
          y: Math.round(b.y * 10000) / 10000,
          vx: Math.round(b.vx * 10000) / 10000,
          vy: Math.round(b.vy * 10000) / 10000
        })),
        camera: [
          Math.round(camera.position.x * 10000) / 10000,
          Math.round(camera.position.y * 10000) / 10000,
          Math.round(camera.position.z * 10000) / 10000
        ],
        objects: ["floor", "wall", "ball-0", "ball-1", "ball-2", "ball-3"]
      };
    };

    // --- Initial Render ---
    renderer.render(scene, camera);
    window.__ready = true;
  </script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
