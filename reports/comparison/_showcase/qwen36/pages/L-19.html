<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8">
<title>Трамвай сквозь дождливый город</title>
<style>
html,body{margin:0;padding:0;background:#1a1230;overflow:hidden;width:1920px;height:1080px}
canvas{display:block;width:1920px;height:1080px}
</style><script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
const THREE = window.THREE;

/* ═══════════════════════ LCG ═══════════════════════ */
let _L=488641;
function lr(){ _L=(1103515245*_L+12345)%2147483648; return _L/2147483648; }

/* ═══════════════════════ THREE.JS ═══════════════════════ */
const W=1920, H=1080;
const tanF=Math.tan(45*Math.PI/360); // tan(22.5°)
const asp=W/H;

function frustum(z){
  const d=4-z;
  return { hw:d*tanF*asp, hh:d*tanF };
}
function fx(u,z){ return -frustum(z).hw + u*2*frustum(z).hw; }
function fy(v,z){ return frustum(z).hh - v*2*frustum(z).hh; }

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1230);
scene.fog=new THREE.Fog(0x1a1230, 32, 55);

const camera=new THREE.PerspectiveCamera(45, W/H, 0.1, 100);
camera.position.set(0,0,4);
camera.lookAt(0,0,-1);

const renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true, antialias:false});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
document.body.style.margin='0';
document.body.style.overflow='hidden';
document.body.style.background='#1a1230';
document.body.appendChild(renderer.domElement);

/* ═══════════════════════ MATERIALS ═══════════════════════ */
const mCabin   = new THREE.MeshStandardMaterial({color:0x1a1230, roughness:0.92, metalness:0});
const mGlass   = new THREE.MeshPhysicalMaterial({
  color:0xffffff, transparent:true, opacity:0.30,
  roughness:0.08, metalness:0, side:THREE.DoubleSide, depthWrite:false
});
const mMull    = new THREE.MeshStandardMaterial({color:0x1a1230, roughness:0.88, metalness:0.1});
const mRail    = new THREE.MeshBasicMaterial({color:0x12c7d4, transparent:true, opacity:0.40, depthWrite:false, side:THREE.DoubleSide});
const mGlowT   = new THREE.MeshBasicMaterial({color:0xffa63c, transparent:true, opacity:0.50, depthWrite:false, side:THREE.DoubleSide});
const mGlowB   = new THREE.MeshBasicMaterial({color:0xffa63c, transparent:true, opacity:0.45, depthWrite:false, side:THREE.DoubleSide});

/* ═══════════════════════ NIGHT ═══════════════════════ */
const nf=frustum(-45);
const night=new THREE.Mesh(
  new THREE.PlaneGeometry(nf.hw*2+20, nf.hh*2+20),
  new THREE.MeshBasicMaterial({color:0x1a1230, side:THREE.DoubleSide})
);
night.position.z=-45;
scene.add(night);

/* ═══════════════════════ CABIN (объёмные тела) ═══════════════════════ */
// Потолок sala — box над окном, z=-2.0
const cw1=2*frustum(-2).hw, ch1=0.9, cd1=0.22;
const cab=new THREE.Mesh(new THREE.BoxGeometry(cw1,ch1,cd1), mCabin);
cab.position.set(0, fy(0.05,-2), -2);
scene.add(cab);

// Пол и низовая стена — box под окном, z=-2
const cabLow=new THREE.Mesh(new THREE.BoxGeometry(cw1, 1.0, cd1), mCabin);
cabLow.position.set(0, fy(0.86,-2), -2);
scene.add(cabLow);

// Левый и правый простенки (у стены кабины)
const stGeo=new THREE.BoxGeometry(0.16, fy(0.05,-2)-fy(0.95,-2)+1.2, 0.22);
const stL=new THREE.Mesh(stGeo, mCabin);
stL.position.set(fx(0.045,-2), fy(0.5,-2), -2);
scene.add(stL);
const stR=new THREE.Mesh(stGeo.clone(), mCabin);
stR.position.set(fx(0.955,-2), fy(0.5,-2), -2);
scene.add(stR);

// Задние стены кабины (за камерой, z=7) — уходят глубже = шире = обрамляют кадр
const bkGeo=new THREE.BoxGeometry(0.01, 2*frustum(7).hh+2, 4);
const bkL=new THREE.Mesh(bkGeo, mCabin);
bkL.position.set(fx(0.045,7), fy(0.5,7), 7);
scene.add(bkL);
const bkR=new THREE.Mesh(bkGeo.clone(), mCabin);
bkR.position.set(fx(0.955,7), fy(0.5,7), 7);
scene.add(bkR);

// Задний потолок/пол
const bkHGeo=new THREE.BoxGeometry(2*frustum(7).hw+2, 0.01, 4);
const bkT=new THREE.Mesh(bkHGeo, mCabin);
bkT.position.set(0, fy(0.05,-2)+frustum(7).hh+0.5, 6);
scene.add(bkT);
const bkF=new THREE.Mesh(bkHGeo.clone(), mCabin);
bkF.position.set(0, fy(0.9,-2)-frustum(7).hh-0.5, 6);
scene.add(bkF);

/* ═══════════════════════ GLASS ═══════════════════════ */
const gw=0.78*frustum(-4).w, gh=0.62*frustum(-4).h;
const glass=new THREE.Mesh(new THREE.PlaneGeometry(gw, gh), mGlass);
glass.position.set(fx(0.5,-4), fy(0.41,-4), -4);
scene.add(glass);

/* ═══════════════════════ MULLIONS ═══════════════════════ */
const mMz=-3.995;
const mMv=0.014;
const mMh=gh+0.12;
const mGeoV=new THREE.BoxGeometry(mMv, 0.14, mMh);
[0.31, 0.65].forEach(u=>{
  const m=new THREE.Mesh(mGeoV.clone(), mMull);
  m.position.set(fx(u, mMz), fy(0.41,-4), mMz);
  scene.add(m);
});
// Горизонтальные рамы
const mGeoH=new THREE.BoxGeometry(gw+0.03, 0.028, 0.14);
const mTop=new THREE.Mesh(mGeoH, mMull);
mTop.position.set(fx(0.5,-4), fy(0.10,-4)+0.014, mMz);
scene.add(mTop);
const mBot=new THREE.Mesh(mGeoH, mMull);
mBot.position.set(fx(0.5,-4), fy(0.72,-4)-0.014, mMz);
scene.add(mBot);

/* ═══════════════════════ RAIL ═══════════════════════ */
const rZ=-3.99;
const rGeo=new THREE.PlaneGeometry(0.78*frustum(rZ).w, 0.02*frustum(rZ).h);
const rail=new THREE.Mesh(rGeo, mRail);
rail.position.set(fx(0.5,-4), fy(0.59,-4), rZ);
scene.add(rail);

/* ═══════════════════════ GLOW TOP ═══════════════════════ */
const gtZ=-3.985;
const gtGeo=new THREE.PlaneGeometry(0.70*frustum(gtZ).w, 0.05*frustum(gtZ).h);
const glowTop=new THREE.Mesh(gtGeo, mGlowT);
glowTop.position.set(fx(0.5,-4), fy(0.17,-4), gtZ);
scene.add(glowTop);

/* ═══════════════════════ GLOW LOW ═══════════════════════ */
const glZ=-3.98;
const glGeo=new THREE.PlaneGeometry(0.62*frustum(glZ).w, 0.04*frustum(glZ).h);
const glowLow=new THREE.Mesh(glGeo, mGlowB);
glowLow.position.set(fx(0.5,-4), fy(0.66,-4), glZ);
scene.add(glowLow);

/* ═══════════════════════ LIGHT ═══════════════════════ */
const pWarm1=new THREE.PointLight(0xffa63c, 10, 15);
pWarm1.position.set(0, 3.2, -1);
scene.add(pWarm1);

const pWarm2=new THREE.PointLight(0xffa63c, 4, 8);
pWarm2.position.set(0, 2.0, 1.5);
scene.add(pWarm2);

// неоновый свет с улицы
const pNeon=new THREE.PointLight(0x12c7d4, 18, 30);
pNeon.position.set(0, 0.8, -12);
scene.add(pNeon);

const pNeon2=new THREE.PointLight(0x12c7d4, 10, 22);
pNeon2.position.set(5, -1, -10);
scene.add(pNeon2);

const pNeon3=new THREE.PointLight(0x12c7d4, 8, 18);
pNeon3.position.set(-6, 2, -8);
scene.add(pNeon3);

scene.add(new THREE.AmbientLight(0x1a1230, 0.4));

// subtle fill для cabin
scene.add(new THREE.HemisphereLight(0x1a1230, 0x1a1230, 0.3));

/* ═══════════════════════ BLOBS (22 неоновых пятна) ═══════════════════════ */
// Glow-текстура (canvas)
const _cb=document.createElement('canvas'); _cb.width=_cb.height=64;
const _cx=_cb.getContext('2d');
const _gr=_cx.createRadialGradient(32,32,0,32,32,32);
_gr.addColorStop(0,'#12c7d4'); _gr.addColorStop(0.25,'#12c7d4');
_gr.addColorStop(0.6,'#12c7d455'); _gr.addColorStop(1,'#12c7d400');
_cx.fillStyle=_gr; _cx.fillRect(0,0,64,64);
const blobTex=new THREE.CanvasTexture(_cb);

const bD=[], bM=[];
const f14=frustum(-14);

for(let i=0;i<22;i++){
  const sp=2+lr()*2.4;       // 2–4.4 speed
  const rad=0.13+lr()*0.06;  // 7–13 px at z=-14
  const bx=f14.hw*(lr()*2-1)*0.9; // within 90% of half-width
  const by=fy(0.08+lr()*0.66, -14);
  bD.push({x:bx, y:by, sp:sp, rad:rad});
}

const bMat=new THREE.SpriteMaterial({
  map:blobTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
});
bD.forEach((b,i)=>{
  const s=new THREE.Sprite(bMat);
  s.scale.set(b.rad*2.5, b.rad*2.5, 1);
  s.position.set(b.x, b.y, -14);
  scene.add(s);
  bM.push(s);
});

/* ═══════════════════════ DROPS (60 капель) ═══════════════════════ */
const _dd=document.createElement('canvas'); _dd.width=_dd.height=32;
const _ddx=_dd.getContext('2d');
const _dg=_ddx.createRadialGradient(16,16,0,16,16,16);
_dg.addColorStop(0,'#a8c8dc'); _dg.addColorStop(0.5,'#a8c8dca9');
_dg.addColorStop(0.8,'#a8c8dc30'); _dg.addColorStop(1,'#a8c8dc00');
_ddx.fillStyle=_dg; _ddx.fillRect(0,0,32,32);
const dropTex=new THREE.CanvasTexture(_dd);

const dD=[], dM=[];
const dU1=0.11, dU2=0.89, dV1=0.10, dV2=0.72;

for(let i=0;i<60;i++){
  dD.push({
    x: fx(dU1+lr()*(dU2-dU1), -3.9),
    y: fy(dV1+lr()*(dV2-dV1), -3.9)
  });
}

for(let i=0;i<60;i++){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:dropTex, transparent:true, opacity:0.82, depthWrite:false
  }));
  sp.scale.set(0.038, 0.055, 1);
  sp.position.set(dD[i].x, dD[i].y, -3.9);
  scene.add(sp);
  dM.push(sp);
}

/* ═══════════════════════ ANIMATION ═══════════════════════ */
let simTime=0;

function step(dt){
  simTime+=dt;

  // капли вниз: 1.56 units/s
  const dTopY=fy(dV1,-3.9), dBotY=fy(dV2,-3.9);
  for(let i=0;i<60;i++){
    dD[i].y += (-1.56)*dt;
    if(dD[i].y < dBotY){
      dD[i].y = dTopY + (dBotY-dTopY)*lr()*0.15;
      dD[i].x = fx(dU1+lr()*(dU2-dU1), -3.9);
    }
    dM[i].position.y = dD[i].y;
  }

  // пятна вбок: скорость 2–4 units/s, заворачиваются
  const bHalfW=f14.hw*0.95;
  for(let i=0;i<22;i++){
    bD[i].x += bD[i].sp * dt;
    if(bD[i].x > bHalfW){
      bD[i].x = -bHalfW;
      bD[i].y = fy(0.08+lr()*0.66, -14);
    }
    bM[i].position.x = bD[i].x;
  }

  // камерa: x колеблется на 0.045
  camera.position.x = 0.045 * Math.sin(simTime*1.5);

  renderer.render(scene, camera);
}

function probe(){
  return {
    t: simTime.toFixed(4),
    objects: [
      {n:"night",      z:-45,        c:"#1a1230"                    },
      {n:"cabin_top",  v:[0,0.10],   c:"#1a1230"                    },
      {n:"cabin_low",  v:[0.72,1],   c:"#1a1230"                    },
      {n:"cabin_left", u:[0,0.09],   c:"#1a1230"                    },
      {n:"cabin_right",u:[0.91,1],   c:"#1a1230"                    },
      {n:"mullion1",   u:0.31,       w:0.012,   c:"#1a1230"         },
      {n:"mullion2",   u:0.65,       w:0.012,   c:"#1a1230"         },
      {n:"glass",      z:-4,         op:0.30,    sz:[0.78,0.62]    },
      {n:"blobs",      n:22,         z:-14,     c:"#12c7d4"        },
      {n:"rail",       v:0.58,       h:0.02,    op:0.4,    c:"#12c7d4"},
      {n:"glow_top",   v:0.17,       sz:[0.70,0.05], c:"#ffa63c"   },
      {n:"glow_low",   v:0.66,       sz:[0.62,0.04], c:"#ffa63c"   },
      {n:"drops",      n:60,         z:-3.9,    c:"#a8c8dc"        }
    ],
    blob: bM.length>0
      ? [parseFloat(bM[0].position.x.toFixed(4)), parseFloat(bM[0].position.y.toFixed(4))]
      : [0,0]
  };
}

window.__step=step;
window.__probe=probe;
window.__ready=false;

// first frame
renderer.render(scene, camera);
window.__ready=true;
</script>
</body>
</html>
