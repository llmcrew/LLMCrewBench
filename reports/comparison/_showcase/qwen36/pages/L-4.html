<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/><script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
const THREE = window.THREE;

/* ── renderer ── */
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

/* ── scene / camera ── */
const scene   = new THREE.Scene();
scene.background = new THREE.Color(0x2a1b5c);

const camera = new THREE.PerspectiveCamera(45, 1920 / 1080, 0.1, 1000);
camera.position.set(0, 8, 26);
camera.lookAt(0, 8, 0);

/* ── ground plane ── */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshBasicMaterial({ color: 0x0b0b14 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
scene.add(ground);

/* ── houses ── */
const B = [
  { x: -6.8, w: 2.4, h: 14.8 },
  { x: -3.7, w: 2.1, h: 10.1 },
  { x: -1.2, w: 1.6, h: 10.7 },
  { x:  1.5, w: 2.3, h: 14.9 },
  { x:  4.8, w: 2.6, h: 13.5 },
  { x:  8.0, w: 1.6, h: 10.9 },
];
const houseGeo = new THREE.BoxGeometry(1, 1, 3);
for (let i = 0; i < B.length; i++) {
  const m = B[i];
  const mesh = new THREE.Mesh(houseGeo,
    new THREE.MeshBasicMaterial({ color: 0x0b0b14 }));
  mesh.scale.set(m.w, m.h, 3);
  mesh.position.set(m.x, m.h / 2, 0);
  mesh.name = 'house';
  scene.add(mesh);
}

/* ── compute window grid ── */
let totalW = 0;
const ncols = [], nroWs = [];
for (const b of B) {
  const nc = 2 * Math.floor((b.w / 2) / 0.95) + 1;
  const nr = Math.max(0, Math.floor((b.h - 1.0) / 1.45)) + 1;
  ncols.push(nc);  nroWs.push(nr);
  totalW += nc * nr;
}

/* ── InstancedMesh ── */
const wGeo = new THREE.PlaneGeometry(0.5, 0.7);
const winMat = new THREE.ShaderMaterial({
  depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    #version 300 es
    in vec4 color;
    out vec4 vColor;
    void main(){
      vColor = color;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    #version 300 es
    precision highp float;
    in vec4 vColor;
    uniform float uTime;
    out vec4 fragColor;
    void main(){
      int id  = int(gl_InstanceID);
      float g = mod(float(id) * 0.129f + uTime * 0.500f, 1.0f);
      float bright = g < 0.78f ? 1.0f : 0.15f;
      /* vColor encodes which building: r=1 teal, r=0 warm */
      vec3 colId = vColor.r > 0.5f
        ? vec3(0.133, 0.878, 0.816)   // #22e0d0
        : vec3(1.000, 0.690, 0.400);   // #ffb066
      fragColor = vec4(colId * bright, 1.0);
    }
  `,
});

/* build per-instance data */
let id = 0;
const cArr = new Float32Array(totalW * 4);
for (let bi = 0; bi < B.length; bi++) {
  const nc = ncols[bi], nr = nroWs[bi];
  const teal = bi % 2 === 0;
  const cr = teal ? 1.0 : 0.0;
  const cb = teal ? 1.0 : 0.0;
  for (let r = 0; r < nr; r++)
    for (let c = 0; c < nc; c++) {
      cArr[id * 4 + 0] = cr;
      cArr[id * 4 + 1] = 1.0;
      cArr[id * 4 + 2] = cb;
      cArr[id * 4 + 3] = 1.0;
      id++;
    }
}
wGeo.setAttribute('color', new THREE.InstancedBufferAttribute(cArr, 4));

const winMesh = new THREE.InstancedMesh(wGeo, winMat, totalW);
winMesh.name = 'windows';
scene.add(winMesh);

/* matrices for each window instance */
id = 0;
for (let bi = 0; bi < B.length; bi++) {
  const b = B[bi], nc = ncols[bi], nr = nroWs[bi];
  for (let r = 0; r < nr; r++) {
    for (let c = 0; c < nc; c++) {
      const oxw = (c - (nc - 1) / 2) * 0.95 + b.x;
      const oyw = 1.0 + r * 1.45;
      winMesh.setMatrixAt(id,
        new THREE.Matrix4().makeTranslation(oxw, oyw, 1.5));
      id++;
    }
  }
}
winMesh.instanceMatrix.needsUpdate = true;

/* ── haze plane ── */
const hazeMat = new THREE.ShaderMaterial({
  transparent: true,
  blending: THREE.NormalBlending,
  depthTest: true,
  side: THREE.DoubleSide,
  vertexShader: `
    varying vec3 vW;
    void main(){
      vW = (modelMatrix * vec4(position,1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix *
                    vec4(position,1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vW;
    void main(){
      float grad = clamp(vW.y / 18.0 + 0.5, 0.0, 1.0);
      gl_FragColor = vec4(0.29, 0.35, 0.54, 0.22 * grad);
    }
  `,
});
const haze = new THREE.Mesh(new THREE.PlaneGeometry(40, 18), hazeMat);
haze.position.set(0, 7.35, -2);
haze.name = 'haze';
scene.add(haze);

/* ═══════════ public API ═══════════ */
let _t = 0;

window.__step = function(dt) { _t += dt; };

window.__probe = function() {
  winMat.uniforms.uTime.value = _t;
  haze.position.y = 7.35 + 0.9 * Math.sin(_t * 0.25);

  let lit = 0;
  for (let i = 0; i < totalW; i++) {
    const g = ((i * 0.129 + _t * 0.500) % 1 + 1) % 1;
    if (g < 0.78) lit++;
  }

  renderer.render(scene, camera);

  return {
    t: _t.toFixed(4),
    objects: B.map(b => ({ x: b.x, w: b.w, h: b.h })),
    lit: lit,
    haze_y: haze.position.y,
  };
};

setTimeout(() => { window.__ready = true; }, 0);
</script>
</body>
</html>
