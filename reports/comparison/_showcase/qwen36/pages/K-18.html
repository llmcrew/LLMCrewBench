<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Orrery</title>
    <style>body { margin: 0; overflow: hidden; }</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="module">
    const THREE = window.THREE;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 800 / 600, 0.1, 200);
    camera.position.set(0.0, 10.0, 13.0);
    camera.lookAt(0.0, 0.0, 0.0);

    const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(800, 600, false);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight.position.set(7.0, 13.0, 7.0);
    scene.add(dirLight);

    const sunGeo = new THREE.SphereGeometry(0.6, 32, 32);
    const sunMat = new THREE.MeshStandardMaterial({ color: 0xffcf5c });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    sun.name = 'sun';
    sun.position.set(0, 0.6, 0);
    scene.add(sun);

    const planetsData = [
        { name: 'mercury', R: 2.04, T: 7.81, theta0: 150.00, color: 0x3d6bff },
        { name: 'venus', R: 3.77, T: 16.36, theta0: 175.06, color: 0x22b3a0 },
        { name: 'mars', R: 5.19, T: 8.84, theta0: 116.62, color: 0xff5566 }
    ];

    const planets = [];
    const PI = Math.PI;

    planetsData.forEach((p, i) => {
        const orbitGeo = new THREE.RingGeometry(p.R - 0.03, p.R + 0.03, 96);
        const orbitMat = new THREE.MeshBasicMaterial({ color: 0x2f4a63, side: THREE.DoubleSide });
        const orbit = new THREE.Mesh(orbitGeo, orbitMat);
        orbit.name = `orbit-${i}`;
        orbit.rotation.x = -PI / 2;
        orbit.position.y = 0.3;
        scene.add(orbit);

        const planetGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const planetMat = new THREE.MeshStandardMaterial({ color: p.color });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        planet.name = p.name;
        scene.add(planet);

        let theta = p.theta0;
        const rad = theta * PI / 180;
        planet.position.set(p.R * Math.cos(rad), 0.3, p.R * Math.sin(rad));

        planets.push({
            name: p.name,
            R: p.R,
            T: p.T,
            theta: theta,
            mesh: planet
        });
    });

    let steps = 0;
    let t = 0;

    window.__step = function(dt) {
        t += dt;
        steps++;
        for (const p of planets) {
            p.theta = (p.theta + 360 / p.T * dt) % 360;
            const rad = p.theta * PI / 180;
            p.mesh.position.set(p.R * Math.cos(rad), 0.3, p.R * Math.sin(rad));
        }
    };

    window.__probe = function() {
        return {
            steps: steps,
            t: Number(t.toFixed(4)),
            camera: [camera.position.x, camera.position.y, camera.position.z],
            objects: scene.children.map(c => c.name),
            planets: planets.map(p => ({
                name: p.name,
                theta: Number(p.theta.toFixed(4)),
                x: Number(p.mesh.position.x.toFixed(4)),
                z: Number(p.mesh.position.z.toFixed(4))
            }))
        };
    };

    renderer.render(scene, camera);
    window.__ready = true;
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
