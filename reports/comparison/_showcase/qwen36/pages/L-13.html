<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
<script src='../../../_vendor/three.global.js'></script>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
const THREE = window.THREE;

/* =============================================================
   Lava lamp — 9 metaball blobs on a full-screen plane
   ============================================================= */

const DROPS = [
  { cx: 0.333, cy: 0.604, r: 0.089,  A: 0.126, omega: 0.497, p: 1.59 },
  { cx: 0.457, cy: 0.657, r: 0.102,  A: 0.106, omega: 0.478, p: 3.21 },
  { cx: 0.120, cy: 0.672, r: 0.081,  A: 0.112, omega: 0.679, p: 4.65 },
  { cx: 0.606, cy: 0.543, r: 0.077,  A: 0.136, omega: 0.965, p: 3.37 },
  { cx: 0.420, cy: 0.600, r: 0.081,  A: 0.100, omega: 1.148, p: 2.45 },
  { cx: 0.779, cy: 0.713, r: 0.103,  A: 0.175, omega: 1.136, p: 0.39 },
  { cx: 0.472, cy: 0.318, r: 0.079,  A: 0.178, omega: 0.656, p: 1.23 },
  { cx: 0.192, cy: 0.509, r: 0.101,  A: 0.161, omega: 1.014, p: 3.99 },
  { cx: 0.892, cy: 0.486, r: 0.102,  A: 0.115, omega: 0.862, p: 2.83 },
];

let t = 0;

/* compute per-drop centres (frame-fraction coords) at current time */
function positions() {
  return DROPS.map(d => {
    const y = d.cy + d.A * Math.sin(d.omega * t + d.p);
    return { cx: d.cx, cy: y, r: d.r };
  });
}

/* ---- scene setup ---- */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, 1920 / 1080, 0.1, 100);
camera.position.z = 2.0;

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
document.body.appendChild(renderer.domElement);

/* ---- metaball shader on a single PlaneGeometry ---- */
const blobs = new Array(9).fill(new THREE.Vector3());

const uniforms = {
  uP:    { value: blobs },   // [9] vec3  xy = frame-centre  z  = radius (frame-height frac)
  uTime: { value: 0.0 },
};

const vertexShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const fragmentShader = `
  precision highp float;
  varying vec2 vUv;
  uniform vec3  uP[9];
  uniform float uTime;

  // ---------- palette (exact hex → float3) ----------
  vec3 cBg  = vec3(22.0,   9.0,  43.0)  / 255.0;  // #16092b
  vec3 cHal = vec3(255.0,  45.0, 107.0) / 255.0;  // #ff2d6b
  vec3 cBod = vec3(255.0, 107.0, 26.0) / 255.0;  // #ff6b1a
  vec3 cCor = vec3(255.0, 223.0, 61.0) / 255.0;  // #ffdf3d

  void main() {
    // shader-space coords (matches task: p = (vUv-0.5)*vec2(1.3333,1.0))
    vec2 p = (vUv - 0.5) * vec2(1.3333, 1.0);

    // metaball field:  F(p) = sum_i  r_i^2 / max(|p-c_i|^2 , 0.0001)
    float F = 0.0;
    for (int i = 0; i < 9; i++) {
      vec2  c  = (vec2(uP[i].x, uP[i].y) - 0.5) * vec2(1.3333, 1.0);
      float r  = uP[i].z;
      float d2 = max(dot(p - c, p - c), 0.0001);
      F += r * r / d2;
    }

    // colour by field bands with smooth interpolation
    vec3 col;
    if      (F < 0.30)                        col = cBg;
    else if (F < 0.62) { float u=smoothstep(0.,1.,(F-0.30)/0.32); col=mix(cBg,cHal,u); }
    else if (F < 0.85) { float u=smoothstep(0.,1.,(F-0.62)/0.23); col=mix(cHal,cBod,u); }
    else if (F < 1.30)                        col = cBod;
    else if (F < 2.40) { float u=smoothstep(0.,1.,(F-1.30)/1.10); col=mix(cBod,cCor,u); }
    else if (F < 3.20)                        col = cCor;
    else                                        col = cCor;

    gl_FragColor = vec4(col, 1.0);
  }
`;

const planeGeo = new THREE.PlaneGeometry(4.0, 4.0);
const planeMat = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms,
  depthWrite: true,
});
const plane = new THREE.Mesh(planeGeo, planeMat);
scene.add(plane);

/* ---- render function ---- */
function render() {
  const pp = positions();
  for (let i = 0; i < 9; i++) {
    uniforms.uP.value[i].set(DROPS[i].cx, pp[i].cy, pp[i].r);
  }
  uniforms.uTime.value = t;
  renderer.render(scene, camera);
}

/* ---- public API ---- */
window.__step = function (dt) {
  t += dt;
  render();
};

window.__probe = function () {
  const pp = positions();
  return {
    t: parseFloat(t.toFixed(4)),
    objects: [],
    blobs: pp.map(p => ({
      x: parseFloat(p.cx.toFixed(4)),
      y: parseFloat(p.cy.toFixed(4)),
    })),
  };
};

/* initial frame */
render();
window.__ready = true;
</script>
</body>
</html>
