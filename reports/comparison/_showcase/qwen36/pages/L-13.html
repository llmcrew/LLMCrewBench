<script type="module">
const THREE = window.THREE;

const dropsData = [
  {x: 0.333, y: 0.604, r: 0.089, A: 0.126, w: 0.497, p: 1.59},
  {x: 0.457, y: 0.657, r: 0.102, A: 0.106, w: 0.478, p: 3.21},
  {x: 0.120, y: 0.672, r: 0.081, A: 0.112, w: 0.679, p: 4.65},
  {x: 0.606, y: 0.543, r: 0.077, A: 0.136, w: 0.965, p: 3.37},
  {x: 0.420, y: 0.600, r: 0.081, A: 0.100, w: 1.148, p: 2.45},
  {x: 0.779, y: 0.713, r: 0.103, A: 0.175, w: 1.136, p: 0.39},
  {x: 0.472, y: 0.318, r: 0.079, A: 0.178, w: 0.656, p: 1.23},
  {x: 0.192, y: 0.509, r: 0.101, A: 0.161, w: 1.014, p: 3.99},
  {x: 0.892, y: 0.486, r: 0.102, A: 0.115, w: 0.862, p: 2.83}
];

const drops = dropsData.map(d => ({
  x: d.x, y0: d.y, y: d.y, r: d.r, A: d.A, w: d.w, p: d.p
}));

let time = 0.0;

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 600;
document.body.appendChild(canvas);

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 100);
camera.position.z = 0;
camera.lookAt(0, 0, 1);

const planeGeo = new THREE.PlaneGeometry(4.418, 1.6568);
const planeMat = new THREE.ShaderMaterial({
  uniforms: {
    uDrops: { value: drops.map(d => new THREE.Vector3(d.x, d.y, d.r)) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform vec3 uDrops[9];
    void main() {
      vec2 p = (vUv - 0.5) * vec2(1.3333, 1.0);
      float F = 0.0;
      for (int i = 0; i < 9; i++) {
        vec2 c = vec2((uDrops[i].x - 0.5) * 1.3333, (uDrops[i].y - 0.5) * 1.0);
        float r = uDrops[i].z;
        vec2 diff = p - c;
        F += r * r / max(dot(diff, diff), 0.0001);
      }

      vec3 bg = vec3(0.08627, 0.03529, 0.16863);
      vec3 halo = vec3(1.0, 0.17647, 0.41961);
      vec3 body = vec3(1.0, 0.41961, 0.10196);
      vec3 core = vec3(1.0, 0.87451, 0.23922);

      vec3 col = bg;
      if (F > 0.3 && F <= 0.62) col = halo;
      else if (F > 0.62 && F <= 0.85) col = mix(halo, body, smoothstep(0.62, 0.85, F));
      else if (F > 0.85 && F <= 1.3) col = body;
      else if (F > 1.3 && F <= 2.4) col = mix(body, core, smoothstep(1.3, 2.4, F));
      else if (F > 2.4 && F <= 3.2) col = core;
      else if (F > 3.2) col = core;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const plane = new THREE.Mesh(planeGeo, planeMat);
plane.position.z = 2.0;
scene.add(plane);

renderer.render(scene, camera);
window.__ready = true;

window.__step = function(dt) {
  time += dt;
  for (let i = 0; i < 9; i++) {
    let ny = drops[i].y0 + drops[i].A * Math.sin(drops[i].w * time + drops[i].p);
    ny = Math.max(0.15, Math.min(0.85, ny));
    drops[i].y = ny;
    planeMat.uniforms.uDrops.value[i].set(drops[i].x, ny, drops[i].r);
  }
  renderer.render(scene, camera);
  return window.__probe();
};

window.__probe = function() {
  const blobs = drops.map(d => ({
    x: parseFloat(d.x.toFixed(4)),
    y: parseFloat(d.y.toFixed(4))
  }));
  return {
    t: parseFloat(time.toFixed(4)),
    objects: ['plane'],
    blobs: blobs
  };
};
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
