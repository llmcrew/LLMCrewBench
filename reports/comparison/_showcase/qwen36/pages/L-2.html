<script type="module">
const THREE = window.THREE;

const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(800, 600, false);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 1000);
camera.position.set(0, 0, 0);
camera.lookAt(0, 0, -1);

// Sky
const skyGeo = new THREE.PlaneGeometry(49.706, 27.338);
const skyMat = new THREE.ShaderMaterial({
  uniforms: {},
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main() {
      vec3 top = vec3(0.1059, 0.0588, 0.2353);
      vec3 bot = vec3(0.0980, 0.8784, 0.8667);
      float t = smoothstep(0.0, 0.32, vUv.y);
      gl_FragColor = vec4(mix(bot, top, t), 1.0);
    }
  `,
  side: THREE.DoubleSide
});
const sky = new THREE.Mesh(skyGeo, skyMat);
sky.position.set(0, 11.184, -30);
sky.name = 'sky';
scene.add(sky);

// Ground
const groundGeo = new THREE.PlaneGeometry(49.706, 120);
const groundMat = new THREE.ShaderMaterial({
  uniforms: { uOffset: { value: 0.0 } },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorldPos;
    void main() {
      vUv = uv;
      vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uOffset;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    void main() {
      vec3 near = vec3(0.0706, 0.0392, 0.1647);
      vec3 far = vec3(0.1059, 0.0588, 0.2353);
      vec3 base = mix(near, far, -vWorldPos.z / 120.0);

      float lineX = step(0.9, fract(vWorldPos.x / 1.6));
      float lineZ = step(0.9, fract((vWorldPos.z + uOffset) / 1.6));
      float grid = max(lineX, lineZ);

      float fade = smoothstep(1.0, 0.0, -vWorldPos.z / 120.0);
      vec3 gridColor = vec3(1.0, 0.1843, 0.6902);

      gl_FragColor = vec4(mix(base, gridColor, grid * fade), 1.0);
    }
  `,
  side: THREE.DoubleSide
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.position.set(0, -2.485, -60);
ground.rotation.x = -Math.PI / 2;
ground.name = 'ground';
scene.add(ground);

// Sun
const sunGeo = new THREE.CircleGeometry(4.971, 32);
const sunMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    void main() {
      if (length(vUv - 0.5) > 0.5) discard;
      if (vUv.y < 0.333 && fract(vUv.y * 10.0) < 0.5) discard;
      vec3 top = vec3(1.0, 0.6902, 0.2275);
      vec3 bot = vec3(0.4, 0.2, 0.05);
      vec3 col = mix(bot, top, vUv.y);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide
});
const sun = new THREE.Mesh(sunGeo, sunMat);
sun.position.set(0, 5.46, -29.5);
sun.rotation.x = Math.PI;
sun.name = 'sun';
scene.add(sun);

let currentTime = 0.0;
let sunY = 5.46;
const sunDropRate = 1.222; // 0.025 * frame height in world units at z=-29.5
const sunStopY = -0.9776;

window.__step = function(dt) {
  currentTime += dt;
  groundMat.uniforms.uOffset.value = (groundMat.uniforms.uOffset.value + 0.90 * dt) % 1.6;
  sunY -= sunDropRate * dt;
  if (sunY < sunStopY) sunY = sunStopY;
  sun.position.y = sunY;
  renderer.render(scene, camera);
  window.__ready = true;
  return window.__probe();
};

window.__probe = function() {
  const halfH = 24.44;
  const fullH = 48.88;
  const yFrac = (halfH - sunY) / fullH;
  return {
    t: parseFloat(currentTime.toFixed(4)),
    objects: ['sky', 'ground', 'sun'],
    sun: [0.5, parseFloat(yFrac.toFixed(4))],
    grid_z: parseFloat(groundMat.uniforms.uOffset.value.toFixed(4))
  };
};
</script>

<script>
// Сцена играет сама: фиксированный шаг 1/60, чтобы кадры шли ровно и запись
// видео не зависела от загрузки машины. Отчёт может вмешаться сообщением
// 'step' (один шаг), 'pause' и 'play' — так работает режим съёмки.
(() => {
  const DT = 1 / 60;
  const step = () => (typeof window.__step === 'function' ? window.__step(DT) : null);
  let acc = 0;
  let last = 0;
  window.__auto = true;

  window.addEventListener('load', () => {
    // Нулевой шаг даёт первый кадр: некоторые сцены рисуют только по шагу.
    if (typeof window.__step === 'function') { try { window.__step(0); } catch (e) {} }
    last = performance.now();
    requestAnimationFrame(loop);
  });

  function loop(now) {
    const elapsed = Math.min(0.2, (now - last) / 1000);
    last = now;
    if (window.__auto) {
      acc += elapsed;
      while (acc >= DT) { acc -= DT; step(); }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('message', (event) => {
    const cmd = event.data;
    if (cmd === 'step') { window.__auto = false; acc = 0; step(); }
    else if (cmd === 'pause') { window.__auto = false; }
    else if (cmd === 'play') { window.__auto = true; acc = 0; last = performance.now(); }
    else if (cmd === 'reset') { window.location.reload(); }
    else return;
    window.dispatchEvent(new Event('dailybench-step'));
  });

  window.addEventListener('keydown', (event) => {
    if (event.target && /INPUT|TEXTAREA/.test(event.target.tagName || '')) return;
    if (event.key === ' ') { event.preventDefault(); window.__auto = !window.__auto; acc = 0; last = performance.now(); }
    if (event.key === 'ArrowRight') { event.preventDefault(); window.__auto = false; acc = 0; step(); }
    if (event.key === 'r' || event.key === 'R' || event.key === 'к' || event.key === 'К') window.location.reload();
  });
})();
</script>
