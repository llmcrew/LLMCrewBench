name: ci

# Gates that keep the repository runnable: bytecode compiles, the suite passes on
# both supported platforms, the sandbox contract holds, the wheel installs into a
# clean venv, published report links stay closed, and the showcase manifest is
# self-consistent. Every job is time-boxed and the matrix stops on first failure.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compile:
    name: compileall
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install
        run: uv sync --locked --extra dev
      - name: Compile every module
        run: uv run --no-sync python -m compileall -q dailybench scripts tests video/tools

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: compile
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install
        # visual/vision: research-v1 строит VQA-фикстуры (Pillow) и K-блок
        # рендерится в headless Chromium — dev-only падает на collection.
        run: uv sync --locked --extra dev --extra visual --extra vision
      - name: Playwright browsers
        run: uv run --no-sync python -m playwright install chromium
      - name: Run the suite
        if: runner.os != 'Windows'
        env:
          # The full 262144-token LC documents peak ~37 GiB RSS; CI runners
          # have ~7 GiB free and die as an OOM cancel mid-suite.
          DAILYBENCH_LONGCTX_WINDOW: "32768"
        run: uv run --no-sync python -m pytest tests
      - name: Run the suite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DAILYBENCH_LONGCTX_WINDOW: "32768"
        run: |
          Remove-Item Env:PYTHONUTF8 -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONIOENCODING -ErrorAction SilentlyContinue
          uv run --no-sync python -m pytest tests

  docker-smoke:
    name: sandbox smoke
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install
        run: uv sync --locked --extra dev
      - name: Build the pinned image and exercise the isolation contract
        run: uv run --no-sync python -m pytest tests/test_sandbox.py

  validate:
    name: schema validation fixtures
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install
        run: uv sync --locked --extra dev
      - name: Contract documents are valid JSON
        run: |
          uv run --no-sync python -m json.tool schema/task.schema.json > /dev/null
          uv run --no-sync python -m json.tool schema/profile.schema.json > /dev/null
      - name: A published suite fixture validates
        run: uv run --no-sync python -m dailybench validate --suite tests/fixtures/validate/suite.json --no-totals
      - name: A valid task fixture validates
        run: uv run --no-sync python -m dailybench validate --task tests/fixtures/validate/valid-task.yaml
      - name: Every negative fixture is rejected
        run: |
          status=0
          for fixture in tests/fixtures/validate/bad-*.yaml \
                         tests/fixtures/validate/empty.yaml \
                         tests/fixtures/validate/scalar.yaml \
                         tests/fixtures/validate/list.yaml \
                         tests/fixtures/validate/broken.yaml; do
            if uv run --no-sync python -m dailybench validate --task "$fixture" > /dev/null 2>&1; then
              echo "не отклонён: $fixture"
              status=1
            fi
          done
          exit "$status"
      - name: The export is valid on its own
        run: uv run --no-sync python -m dailybench export --format json --out "$RUNNER_TEMP/suite.json" --only R-1,K-1

  wheel:
    name: wheel install smoke
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Create an empty venv
        run: python -m venv "$RUNNER_TEMP/wheel-venv"
      - name: Install the wheel
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
      - name: Smoke the installation
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import dailybench, pathlib; print(dailybench.__file__)"
          "$RUNNER_TEMP/wheel-venv/bin/dailybench" --help > /dev/null
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import pathlib
          import sys

          prefix = pathlib.Path(sys.prefix)
          required = [
              prefix / "vendor" / "three" / "three.module.js",
              prefix / "vendor" / "plotly" / "plotly.min.js",
              prefix / "schema" / "task.schema.json",
              prefix / "schema" / "profile.schema.json",
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f"wheel lost assets: {missing}")
          PY

  report-links:
    name: report link closure
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install
        run: uv sync --locked --extra dev
      - name: Publish a fixture and require every local link to resolve
        run: uv run --no-sync python -m pytest tests/test_htmlreport.py -q -k broken_local_links

  media-preflight:
    name: showcase media preflight
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install
        run: uv sync --locked --extra dev
      - name: Validate the manifest without the gitignored clips
        working-directory: video
        run: uv run --no-sync python tools/preflight.py --no-clips
