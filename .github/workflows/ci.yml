name: ci

# Gates that keep the repository runnable: bytecode compiles, the suite passes on
# both supported platforms, the sandbox contract holds, the wheel installs into a
# clean venv, published report links stay closed, and the showcase manifest is
# self-consistent. Every job is time-boxed and the matrix stops on first failure.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compile:
    name: compileall
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile every module
        run: python -m compileall -q dailybench scripts tests video/tools

  test:
    name: pytest (${{ matrix.os }})
    needs: compile
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run the suite
        run: python -m pytest tests

  docker-smoke:
    name: sandbox smoke
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build the pinned image and exercise the isolation contract
        run: python -m pytest tests/test_sandbox.py

  validate:
    name: schema validation fixtures
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Contract documents are valid JSON
        run: |
          python -m json.tool schema/task.schema.json > /dev/null
          python -m json.tool schema/profile.schema.json > /dev/null
      - name: A published suite fixture validates
        run: python -m dailybench validate --suite tests/fixtures/validate/suite.json --no-totals
      - name: A valid task fixture validates
        run: python -m dailybench validate --task tests/fixtures/validate/valid-task.yaml
      - name: Every negative fixture is rejected
        run: |
          status=0
          for fixture in tests/fixtures/validate/bad-*.yaml \
                         tests/fixtures/validate/empty.yaml \
                         tests/fixtures/validate/scalar.yaml \
                         tests/fixtures/validate/list.yaml \
                         tests/fixtures/validate/broken.yaml; do
            if python -m dailybench validate --task "$fixture" > /dev/null 2>&1; then
              echo "не отклонён: $fixture"
              status=1
            fi
          done
          exit "$status"
      - name: The export is valid on its own
        run: python -m dailybench export --format json --out "$RUNNER_TEMP/suite.json" --only R-1,K-1

  wheel:
    name: wheel install smoke
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Create an empty venv
        run: python -m venv "$RUNNER_TEMP/wheel-venv"
      - name: Install the wheel
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
      - name: Smoke the installation
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import dailybench, pathlib; print(dailybench.__file__)"
          "$RUNNER_TEMP/wheel-venv/bin/dailybench" --help > /dev/null
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import pathlib
          import sys

          prefix = pathlib.Path(sys.prefix)
          required = [
              prefix / "vendor" / "three" / "three.module.js",
              prefix / "vendor" / "plotly" / "plotly.min.js",
              prefix / "schema" / "task.schema.json",
              prefix / "schema" / "profile.schema.json",
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f"wheel lost assets: {missing}")
          PY

  report-links:
    name: report link closure
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Publish a fixture and require every local link to resolve
        run: python -m pytest tests/test_htmlreport.py -q -k broken_local_links

  media-preflight:
    name: showcase media preflight
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate the manifest without the gitignored clips
        working-directory: video
        run: python tools/preflight.py --no-clips
