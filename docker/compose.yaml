# Isolation baseline for LLMCrewBench execution (spec §6.2–§6.4).
#
# All services are rootless-compatible: read-only rootfs, no capabilities,
# no new privileges, 64 MiB tmpfs mounts on /tmp and /dev/shm, pids_limit 256, cgroups v2
# limits.  Images are referenced by digest in production via the environment
# variables; the local tags below only exist for development builds through
# scripts/sandbox_run.py.
#
# `/store` is one generation subdirectory (${STORE_DIR}/${STORE_SUBDIR}), not
# the whole runs/ tree: code under test cannot rewrite an earlier run.
# The judge reaches only the model endpoint: it sits on an internal network,
# and the egress forwarder (on that network and on egress-out) dials the
# configured host:port and nothing else. The default bridge is not used.
#
# `docker compose -f docker/compose.yaml config -q` must stay clean.

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
    - seccomp=${SECCOMP_PROFILE:-./seccomp.json}
  pids_limit: 256
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    - /dev/shm:rw,nosuid,nodev,noexec,size=64m,mode=1777
  restart: "no"
  init: true

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim@sha256:2259debdc6af85626058a15a7bf44ad6a68b8c98c9ae82a02cf5cdb92f096d47}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-1700000000}
    image: ${RUNNER_IMAGE:-dailybench/runner-python:local}
    <<: *hardening
    user: "1000:1000"
    network_mode: none
    cpus: "2"
    mem_limit: 2g
    memswap_limit: 2g
    blkio_config:
      device_read_bps:
        - path: ${IO_DEVICE:-/dev/vda}
          rate: "64mb"
      device_write_bps:
        - path: ${IO_DEVICE:-/dev/vda}
          rate: "64mb"
    volumes:
      - ${TASK_DIR:-..}:/workspace:ro
      - ${STORE_DIR:-../runs}/${STORE_SUBDIR:-generation}:/store:rw
    working_dir: /workspace
    stop_grace_period: 5s
    command: ["python", "-c", "print('runner ready')"]

  capture:
    build:
      context: .
      dockerfile: Dockerfile.capture
      args:
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:-debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-1700000000}
    image: ${CAPTURE_IMAGE:-dailybench/capture:local}
    <<: *hardening
    user: "1000:1000"
    network_mode: none
    cpus: "4"
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - ${TASK_DIR:-..}:/workspace:ro
      - ${STORE_DIR:-../runs}/${STORE_SUBDIR:-generation}:/store:rw
    working_dir: /workspace
    stop_grace_period: 10s

  judge:
    build:
      context: .
      dockerfile: Dockerfile.judge
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim@sha256:2259debdc6af85626058a15a7bf44ad6a68b8c98c9ae82a02cf5cdb92f096d47}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-1700000000}
    image: ${JUDGE_IMAGE:-dailybench/judge:local}
    <<: *hardening
    user: "1000:1000"
    # Internal network only. The endpoint is reached as http://dailybench-egress:8080
    # (HTTPS: map the original hostname to the forwarder, do not publish the host gateway).
    networks:
      - dailybench-internal
    cpus: "1"
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - ${TASK_DIR:-..}:/app:ro
      - ${STORE_DIR:-../runs}/${STORE_SUBDIR:-generation}:/store:ro
    working_dir: /app
    stop_grace_period: 5s
    command: ["python", "-m", "dailybench", "--help"]

  egress:
    image: ${PYTHON_IMAGE:-python:3.12-slim@sha256:2259debdc6af85626058a15a7bf44ad6a68b8c98c9ae82a02cf5cdb92f096d47}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=${SECCOMP_PROFILE:-./seccomp.json}
    cpus: "0.5"
    mem_limit: 128m
    memswap_limit: 128m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    volumes:
      - ./egress_forward.py:/egress_forward.py:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command:
      - python3
      - /egress_forward.py
      - --listen
      - 0.0.0.0:8080
      - --target
      - ${ENDPOINT_HOST:-host.docker.internal}:${ENDPOINT_PORT:-443}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      dailybench-internal:
        aliases:
          - dailybench-egress
      egress-out: {}
    restart: "no"
    init: true

networks:
  dailybench-internal:
    internal: true
  egress-out:
    internal: false
